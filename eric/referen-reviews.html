const baseModes=[['home','學習首頁'],['reference','重點總整理'],['meaning','① 英英辨認'],['choice','② 情境選擇'],['fill','③ 句型填空'],['error','④ 改錯診斷'],['translate','⑤ 中譯英'],['mistakes','錯題重練']];

function home(){const done=Object.keys(saved.completed).length;el.innerHTML=header('從認識到活用，完成一輪有效複習','建議依序完成各關。每一題作答後都會顯示理由，錯題會自動收集，最後再練一次。','STUDY DASHBOARD')+`<div class="stats"><div class="stat"><strong>${done}/${Object.keys(quiz).length}</strong><span>已完成題型</span></div><div class="stat"><strong>${saved.correct}/${saved.attempts}</strong><span>累積答對 / 作答次數</span></div><div class="stat"><strong>${saved.mistakes.length}</strong><span>待複習題目</span></div></div><div class="lesson"><h3>建議流程</h3><p><strong>1. 理解：</strong>閱讀英英解釋與基本句型。</p><p><strong>2. 辨認：</strong>選出正確的搭配詞。</p><p><strong>3. 產出：</strong>自己填入介系詞、動詞形式與固定片語。</p><p><strong>4. 遷移：</strong>判斷錯句、完成新情境翻譯。</p><p><strong>5. 訂正：</strong>只重練真正做錯的題目。</p></div><div class="tips">提醒：中譯英為開放式作答，網站會比對參考答案與常見變體；意思正確的其他自然寫法仍可由老師判定。</div><div class="controls" id="actions"></div>`;let a=document.getElementById('actions');a.append(button('先看重點觀念',()=>go('reference')));a.append(button('直接開始練習',()=>go('meaning'),'secondary'));el.insertAdjacentHTML('beforeend','<h3>本課核心字彙｜英英解釋＋中文</h3><div class="terms">'+glossary.map(([t,d,tag])=>`<div class="term"><span class="dot"></span><div><strong>${esc(t)}</strong><p>${esc(d)}</p><p class="zh">${esc(chineseMeanings[t]||'')}</p><span class="tag">${esc(tag)}</span></div></div>`).join('')+'</div>');}
function reference(){if(currentLesson==='midterm')return referenceMidterm();if(currentLesson==='4')return reference4();el.innerHTML=header('常見搭配詞與句型','先理解 chunk 的作用；每組都有英文解釋與中文對照，建議再用完整句子記憶。','REFERENCE')+`<div class="stack"><section class="lesson"><h3>① 三個容易混淆的 used to</h3><p><b>used to + V</b>：過去常常（現在可能不同）</p><p class="example">People used to live near the volcano.</p><p><b>be used to + N / V-ing</b>：習慣於</p><p class="example">They are used to living in a busy city.</p><p><b>be used to + V</b>：被用來做某事</p><p class="example">This device is used to measure temperature.</p></section><section class="lesson"><h3>② 介系詞後面通常接名詞或 V-ing</h3><p class="example">be exposed <b>to</b> air · be inspired <b>by</b> art · stop someone <b>from entering</b></p><p>注意：<b>to</b> 有時是介系詞（be used to + V-ing），有時是不定詞標記（be used to + V）。</p></section><section class="lesson"><h3>③ 關係子句要找到先行詞</h3><p class="example">a crown with spikes <b>that represent</b> the sun</p><p><b>that</b> 指 spikes（複數），所以動詞用 represent。</p></section><section class="lesson"><h3>④ 句型記憶</h3><p class="example">Each of the students <b>is</b> required to ...</p><p class="example">one of the most famous <b>landmarks</b></p><p class="example">stop visitors from <b>entering</b></p><p class="example">be designed <b>to protect</b>...</p></section></div><h3 style="margin-top:25px">核心 chunks · 英英解釋＋中文意思</h3><div class="terms">${glossary.map(([term,definition,tag])=>`<div class="term"><span class="dot"></span><div><strong>${esc(term)}</strong><p>${esc(definition)}</p><p class="zh">中文：${esc(chineseMeanings[term]||"請參考上下文")}</p><span class="tag">${esc(tag)}</span></div></div>`).join('')}</div><div class="controls" id="actions"></div>`;document.getElementById('actions').append(button('開始英英辨認',()=>go('meaning')));}
function normalise(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ')}
function getItem(){if(view==='mistakes'){let record=retryRecords[index];return {mode:record.mode,item:quiz[record.mode][record.i],id:record.mode+'::'+record.i}}return {mode:view,item:session[index],id:view+'::'+index}}
function answerKey(mode,item){return mode==='meaning'||mode==='choice'?item[2]:mode==='fill'?item[1]:mode==='error'?item[1]:item[1]}
function isCorrect(mode,item,value){if(mode==='meaning'||mode==='choice')return value===item[2];if(mode==='fill')return item[2].some(a=>normalise(a)===normalise(value));if(mode==='error')return normalise(item[1])===normalise(value);return item[2].some(a=>normalise(a)===normalise(value));}
function render(){if(view==='home')return home();if(view==='reference')return reference();if(view==='mistakes'&&!saved.mistakes.length){el.innerHTML=header('目前沒有待訂正的題目','完成練習後，做錯的題目會收集在這裡。','RETRY')+`<div class="review-note">現在沒有錯題。你可以從「英英辨認」或「情境選擇」開始。</div><div class="controls" id="actions"></div>`;document.getElementById('actions').append(button('開始練習',()=>go('meaning')));return;}if(index>=session.length)return finish();let {mode,item}=getItem();let total=session.length;let descriptions={meaning:'根據英文定義，選出正確的 chunk。',choice:'讀懂整句，再選出最自然的搭配。',fill:'自行寫出正確的介系詞、動詞形式或字詞。',error:'原句有一處不自然或錯誤，請將指定片語改正。',translate:'不看參考答案，先寫出完整英文句子。允許合理的其他譯法。',spelling:'根據詞性、英英解釋與首尾字母，拼出完整單字。',dictation:'先按播放，再寫出單字或整句。作答前不顯示英文。語音由瀏覽器合成，需有可用的英語語音。'};

else{area.innerHTML=`<label for="written" class="muted" style="display:block;font-size:14px">${mode==='error'?'改正的片語（不必重寫整句）':mode==='translate'?'英文翻譯':mode==='dictation'?'聽寫內容':mode==='spelling'?'完整單字':'請填入空格'}</label><input class="blank" id="written" placeholder="Type your answer here..." autocomplete="off" spellcheck="false"><div class="text-answer">按 Enter 可檢查答案。英文大小寫與句尾標點不計分。</div>`;let input=document.getElementById('written');input.oninput=()=>{selected=input.value;updateButtons()};input.onkeydown=e=>{if(e.key==='Enter'&&!submitted&&input.value.trim())check()};}
if(mode==='dictation')addAudio(item);updateButtons();}
function updateButtons(){let a=document.getElementById('actions');a.innerHTML='';if(!submitted){let b=button('確認答案',check);b.disabled=!String(selected??'').trim();a.append(b);if(view!=='mistakes'){a.append(button('跳過此題',()=>{{let skipped=getItem().id;wrong.push(skipped);let [m,i]=skipped.split('::');if(!saved.mistakes.some(x=>x.mode===m&&x.i===Number(i)))saved.mistakes.push({mode:m,i:Number(i)});persist();index++;selected=null;render()}},'secondary'))}}else{a.append(button(index===session.length-1?'查看本輪結果':'下一題 →',()=>{index++;selected=null;submitted=false;render()}));}}
function check(){if(submitted||!String(selected??'').trim())return;let {mode,item,id}=getItem(),ok=isCorrect(mode,item,selected);submitted=true;answered++;saved.attempts++;if(ok){correct++;saved.correct++;saved.mistakes=saved.mistakes.filter(x=>x.mode+'::'+x.i!==id)}else{wrong.push(id);let [m,i]=id.split('::');if(!saved.mistakes.some(x=>x.mode===m&&x.i===Number(i)))saved.mistakes.push({mode:m,i:Number(i)});}persist();let box=document.getElementById('feedbackArea');let key=answerKey(mode,item);let explanation=item[mode==='meaning'||mode==='choice'?3:3];box.innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'✓ 正確，掌握這個用法。':'✕ 需要再確認搭配或句型。'}</strong><div>參考答案：<b>${esc(key)}</b></div><small>${esc(explanation)}</small>${mode==='meaning'?`<div class="all-meanings"><b>四個選項的中文意思</b>${item[1].map((o,i)=>`<div class="meaning-row"><span>${'ABCD'[i]}. <b>${esc(o)}</b>${o===key?' ✓ 正解':''}</span><span>${esc(chineseMeanings[o]||'參考上方英文語意解釋')}</span></div>`).join('')}</div>`:''}${mode==='translate'?'<small>注意：自由翻譯可能有其他正確寫法，請與老師確認。</small>':''}</div>`;
if(mode==='meaning'||mode==='choice'){document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.value===key)b.classList.add('correct');else if(b.dataset.value===selected&&!ok)b.classList.add('incorrect')})}else document.getElementById('written').disabled=true;updateButtons();}
function finish(){if(view!=='mistakes'&&answered===session.length)saved.completed[view]=true;persist();const total=session.length;el.innerHTML=header('完成本輪練習','建議檢查錯題原因，而不是只看分數。','SESSION COMPLETE')+`<div class="score-result"><span>本輪答對</span><strong>${correct} / ${answered}</strong><div>跳過 ${total-answered} 題　·　錯題庫現有 ${saved.mistakes.length} 題</div></div><div class="review-note">${saved.mistakes.length?'可立即進入「錯題重練」，重做曾經答錯的題目。':'目前沒有待訂正的錯題。試試下一類題型，確認是否能轉移應用。'}</div><div class="controls" id="actions"></div>`;let a=document.getElementById('actions');a.append(button('錯題重練',()=>go('mistakes')));a.append(button('重新練本關',()=>go(view==='mistakes'?'meaning':view),'secondary'));let next=Object.keys(quiz);let j=next.indexOf(view);if(j!==-1&&j<next.length-1)a.append(button('進入下一關',()=>go(next[j+1]),'secondary'));}

const l4Reference=[["① 關係子句：先找先行詞", "指人用 who；指物用 which / that。逗號後的非限定關係子句不能用 that。", "I bought a device that detects smoke. / My sister, who is a vet, loves animals."], ["② 不定詞、原形與介系詞", "be able to / manage to / be trained to + V；help + V 或 to V；by / from 後接 V-ing。", "The dog helped (to) find the child. / It found the bag by using its nose."], ["③ 分詞與完成式", "trained dogs＝受過訓練的狗；has / have + 過去分詞。so far 提示「到目前為止」。", "She has won two prizes so far this year. / Trained dogs can detect hidden items."], ["④ 名詞子句與比較級", "The answer / reason is that + 完整子句。how useful dogs are 採直述語序。much / far 可修飾比較級。", "The answer is that dogs receive training. / Dogs are far better at detecting scents."], ["⑤ 翻譯必背搭配", "due to + 名詞；carry out a task；run into someone；turn out to be；all of a sudden。", "I ran into an old friend. / The old lamp turned out to be valuable."], ["⑥ 閱讀、篇章與混合題", "比較段落要辨認主旨、對比與結果。閱讀題回到原文定位，分清原文資訊與過度推論。", "however＝轉折；as a result＝結果；in terms of＝就某方面而言。"], ["⑦ 字形轉換與動物保育", "protect → protection；disappear → disappearing / disappearance。prevent ... from 後接 V-ing。", "The species needs protection to prevent it from disappearing from the wild."]];
function reference4(){el.innerHTML=header('Lesson 4｜字彙、搭配與解題觀念','依考卷重點設計新情境；先學句型，再練習遷移應用。','REFERENCE')+'<div class="stack">'+l4Reference.map(([t,d,e])=>`<section class="lesson"><h3>${esc(t)}</h3><p>${esc(d)}</p><p class="example">${esc(e)}</p></section>`).join('')+'</div><h3>核心字彙與語塊｜英英解釋＋中文</h3><div class="terms">'+glossary.map(([t,d,tag])=>`<div class="term"><span class="dot"></span><div><strong>${esc(t)}</strong><p>${esc(d)}</p><p class="zh">${esc(chineseMeanings[t])}</p><span class="tag">${esc(tag)}</span></div></div>`).join('')+'</div><div class="controls" id="actions"></div>';document.getElementById('actions').append(button('開始練習',()=>go('meaning')));}
function switchLesson(v){if(window.speechSynthesis)window.speechSynthesis.cancel();currentLesson=v;const data=v==='midterm'?midterm:v==='4'?lesson4:{glossary:l6Glossary,chineseMeanings:l6Chinese,quiz:l6Quiz};glossary=data.glossary;chineseMeanings=data.chineseMeanings;quiz=data.quiz;modes=baseModes.slice();if(v==='midterm')modes.splice(modes.length-1,0,['spelling','⑥ 單字拼寫'],['dictation','⑦ 聽寫練習']);storageKey=v==='midterm'?'reference_reviews_midterm_v1':v==='4'?'reference_reviews_lesson4_v1':'gsat_chunks_lab_v3';try{saved=JSON.parse(localStorage.getItem(storageKey)||'null')||empty()}catch{saved=empty()}saved.mistakes=saved.mistakes.filter(r=>quiz[r.mode]?.[r.i]);document.getElementById('pageTitle').textContent=v==='midterm'?'第一次期中考｜重點複習':'參考書 Lesson '+v+' 複習';document.getElementById('lessonPill').textContent=v==='midterm'?'第一次期中考':'參考書 Lesson '+v+' 複習';document.getElementById('lessonSelect').value=v;go('home');}
function referenceMidterm(){el.innerHTML=header('第一次期中考｜考點總整理','以新題練習考點；聽力原卷未附錄音，因此不重建原聽力答案。','MIDTERM REVIEW')+'<div class="stack">'+midtermReference.map(([t,d,e])=>`<section class="lesson"><h3>${esc(t)}</h3><p>${esc(d)}</p><p class="example">${esc(e)}</p></section>`).join('')+'</div><h3>字彙與搭配詞</h3><div class="terms">'+glossary.map(([t,d,tag])=>`<div class="term"><span class="dot"></span><div><strong>${esc(t)}</strong><p>${esc(d)}</p><p class="zh">${esc(chineseMeanings[t])}</p></div></div>`).join('')+'</div>';}
function addAudio(item){const area=document.getElementById('answerArea');const box=document.createElement('div');box.className='lesson';box.innerHTML='<p>先聽，再作答。播放不會顯示英文答案。</p><label>英語語音 <select id="voiceChoice" aria-label="選擇朗讀語音"></select></label><div id="speechActions" class="controls"></div><p id="speechStatus" role="status"></p>';area.prepend(box);const synth=window.speechSynthesis;const status=document.getElementById('speechStatus');if(!synth||!window.SpeechSynthesisUtterance){status.textContent='此瀏覽器不支援語音朗讀；請改做拼寫題，或使用支援語音的瀏覽器。';return;}let voices=[];function populate(){if(!document.getElementById('voiceChoice'))return;voices=synth.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));voices.sort((a,b)=>(b.lang==='en-GB')-(a.lang==='en-GB'));document.getElementById('voiceChoice').innerHTML='<option value="">系統預設英語（優先英式）</option>'+voices.map((v,i)=>`<option value="${i}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');}populate();if(!voices.length)synth.addEventListener('voiceschanged',populate,{once:true});function speak(rate){synth.cancel();const utterance=new window.SpeechSynthesisUtterance(item[1]);utterance.lang='en-GB';const choice=document.getElementById('voiceChoice').value;if(choice!==''&&voices[Number(choice)])utterance.voice=voices[Number(choice)];else if(voices[0])utterance.voice=voices[0];utterance.rate=rate;utterance.onerror=()=>status.textContent='語音無法播放，請確認裝置有英語語音或換用其他瀏覽器。';utterance.onstart=()=>status.textContent=rate<1?'慢速播放中…':'播放中…';utterance.onend=()=>status.textContent='播放完成，可重播。';synth.speak(utterance);}const controls=document.getElementById('speechActions');controls.append(button('▶ 播放／重播',()=>speak(1)),button('慢速播放',()=>speak(.78),'secondary'));}
document.getElementById('lessonSelect').onchange=e=>switchLesson(e.target.value);

// Start app
switchLesson('midterm');
</script></body></html>
