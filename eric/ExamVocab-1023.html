function renderView(){if(mode==='study')return renderStudy();if(mode==='mistakes')return renderMistakes();if(!session)return renderSetup();renderQuestion()}
function renderStudy(){const u=unit();$('view').innerHTML=`<section class="panel"><div class="tools"><label class="search">搜尋本單元<input type="search" id="search" placeholder="英文、中文或搭配詞" value="${esc(query)}"></label><label>定位段落<select id="groupFilter"><option value="all">全部段落</option>${u.groups.map((g,i)=>`<option value="${i}" ${String(i)===groupFilter?'selected':''}>${esc(g.title)}</option>`).join('')}</select></label><label class="check"><input id="hideCN" type="checkbox" ${hideCN?'checked':''}> 隱藏中文字義</label><label class="check"><input id="onlyStars" type="checkbox" ${onlyStars?'checked':''}> 只看已加星號</label></div><p class="small">★ 把不熟的字加入重點清單。表格按考卷段落定位；用字比較區不列原題答案。</p><div class="summary" id="visibleCount"></div><details class="notes"><summary>語言觀念與查閱提醒</summary>${u.notes.map(([a,b])=>`<div class="notebox"><b>${esc(a)}</b><br>${esc(b)}</div>`).join('')}</details></section><div id="wordTables"></div><details class="panel"><summary>新編例句｜可作跟讀或聽寫複習（${u.sentences.length} 句）</summary>${u.sentences.map(r=>`<div class="sentence-card"><button class="speak" data-sentence="${r.id}">${esc(r.en)} <span class="sound">◖))</span></button><p class="zh">${esc(r.zh)}</p></div>`).join('')}</details>`;$('search').oninput=e=>{query=e.target.value;renderTables()};$('groupFilter').onchange=e=>{groupFilter=e.target.value;renderTables()};$('hideCN').onchange=e=>{hideCN=e.target.checked;$('view').classList.toggle('hide-cn',hideCN)};$('onlyStars').onchange=e=>{onlyStars=e.target.checked;renderTables()};$('view').classList.toggle('hide-cn',hideCN);$('view').querySelectorAll('[data-sentence]').forEach(b=>b.onclick=()=>speak(sentenceMap.get(b.dataset.sentence).en));renderTables()}
function renderTables(){let count=0;const q=query.trim().toLowerCase();$('wordTables').innerHTML=unit().groups.map((g,i)=>{if(groupFilter!=='all'&&groupFilter!==String(i))return '';const matches=g.items.filter(r=>(!onlyStars||saved.stars.includes(r.id))&&(!q||[r.en,r.zh,r.chunk,r.pos].join(' ').toLowerCase().includes(q)));count+=matches.length;if(!matches.length)return '';return `<section class="group"><h3>${esc(g.title)}</h3><div class="table-wrap"><table><thead><tr><th>字彙／語塊 · 可點選朗讀</th><th>詞性</th><th>本篇字義</th><th>常見搭配／用法</th></tr></thead><tbody>${matches.map(r=>`<tr><td><button class="star" data-star="${r.id}" aria-pressed="${saved.stars.includes(r.id)}" aria-label="${saved.stars.includes(r.id)?'取消':'加入'}重點：${esc(r.en)}">${saved.stars.includes(r.id)?'★':'☆'}</button><button class="speak" data-word="${r.id}">${esc(r.en)} <span class="sound">◖))</span></button></td><td class="pos">${esc(r.pos)}</td><td class="zh">${esc(r.zh)}</td><td class="usage">${r.chunk?`<button class="speak example" data-chunk="${r.id}">${esc(r.chunk)} <span class="sound">◖))</span></button>`:'—'}</td></tr>`).join('')}</tbody></table></div></section>`}).join('')||'<div class="panel empty">沒有符合條件的用字。請取消星號篩選或換個關鍵詞。</div>';$('visibleCount').textContent=`顯示 ${count} / ${rows().length} 組`;document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const id=b.dataset.star;saved.stars=saved.stars.includes(id)?saved.stars.filter(x=>x!==id):[...saved.stars,id];save();renderTables()});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>speak(spokenTerm(rowMap.get(b.dataset.word))));document.querySelectorAll('[data-chunk]').forEach(b=>b.onclick=()=>speak(rowMap.get(b.dataset.chunk).chunk))}
function isPhrase(r){return r.en.includes(' ')&&!/[A-Z]|\+|someone|something|one's|one’s/.test(r.en)&&r.pos!=='pattern'&&!r.en.includes('/')}
function poolFor(m,starOnly=false){let r=m==='sentence'?allSentences.filter(x=>x.unit===current):m==='grammar'?allGrammar.filter(x=>x.unit===current):rows();if(m==='listen')r=r.filter(x=>x.pos!=='pattern'&&!/[A-Z]/.test(x.en));if(m==='phrase')r=r.filter(isPhrase);if(m==='spelling')r=r.filter(x=>/^[a-z]+$/.test(x.en)&&!['what','that','since','though','until'].includes(x.en));if(starOnly)r=r.filter(x=>saved.stars.includes(x.id));return r}
const INTRO={grammar:'全新情境的用法與閱讀觀念練習；不是原考卷的題目或解答。',listen:'只聽英文，在三個中文意思中選出正確字義。聽完前不顯示英文。少數動詞會加讀 to，協助辨認動詞發音。',enzh:'根據本單元語意，把英文用字對應到正確中文。',zhen:'看到中文字義，從三個英文用字中選出對應表達。',spelling:'根據中文字義拼出英文單字。可點提示看首字母及字母數。',phrase:'聽寫本單元的片語或語塊；對答案後才顯示英文與中文。',sentence:'聽寫使用本單元字彙的新編短句；檢查拼字、大小寫及句末標點，逗號可忽略。'};
function renderSetup(){const pool=poolFor(mode);$('view').classList.remove('hide-cn');$('view').innerHTML=`<section class="panel quiz"><h3>${esc(MODES.find(x=>x[0]===mode)[1])}</h3><p>${esc(INTRO[mode])}</p><p class="small">本單元可用 ${pool.length} 題。練習不是原題答案；字義採本頁列出的用法。</p><div class="setup"><label>每輪題數 <select id="length"><option value="10">10 題</option><option value="20">20 題</option><option value="all">全部 ${pool.length} 題</option></select></label>${!['sentence','grammar'].includes(mode)?'<label><input type="checkbox" id="starPool"> 只練已加星號用字</label>':''}<button class="btn primary" id="startPractice" ${pool.length?'':'disabled'}>開始練習</button></div><p class="small">${['listen','phrase','sentence'].includes(mode)?'使用裝置英語合成語音；若無法播放，可改用中英互選或拼寫。':'選項和題目每輪打亂。'}</p></section>`;$('startPractice').onclick=()=>{const pool=poolFor(mode,!!$('starPool')?.checked);if(!pool.length){speechStatus('目前沒有符合篩選的題目；請先加星號或取消限制。',true);return}const len=$('length').value;startSession(shuffle(pool).slice(0,len==='all'?pool.length:Number(len)).map(r=>({id:r.id,mode})))}}
function startSession(queue,retry=false){stop();session={queue,index:0,correct:0,answered:0,submitted:false,heard:false,retry,options:[],hint:false};renderQuestion()}
function currentItem(){const rec=session.queue[session.index];return {rec,row:storedRow(rec)}}
function compatibleDistractors(row){const same=allRows.filter(r=>r.unit===row.unit&&r.id!==row.id&&r.en!==row.en&&r.zh!==row.zh);const meanings=s=>s.split(/[；／;]/).map(x=>x.replace(/……|某人|某事/g,'').trim()).filter(Boolean);const filtered=same.filter(r=>!meanings(r.zh).some(x=>meanings(row.zh).includes(x)));const preferred=filtered.filter(r=>r.pos.split(/[. /]/)[0]===row.pos.split(/[. /]/)[0]);const seen=new Set([row.zh]);let out=[];for(const r of shuffle(preferred).concat(shuffle(filtered))){if(!seen.has(r.zh)&&!out.some(x=>x.en===r.en)){out.push(r);seen.add(r.zh)}if(out.length===2)break}return out}
function renderQuestion(){if(!session)return renderSetup();if(session.index>=session.queue.length)return finish();if(session.queue[session.index].mode==='grammar')return renderGrammar();stop();session.submitted=false;session.heard=false;session.hint=false;const {rec,row}=currentItem(),m=rec.mode;const audio=['listen','phrase','sentence'].includes(m),choice=['listen','enzh','zhen'].includes(m);session.options=choice?shuffle([row,...compatibleDistractors(row)]):[];$('view').classList.remove('hide-cn');$('view').innerHTML=`<section class="panel quiz"><div class="summary"><span>${esc(MODES.find(x=>x[0]===m)[1])} · ${session.index+1} / ${session.queue.length}</span><button class="btn" id="quit">結束本輪</button></div><div class="progress"><span style="width:${session.index/session.queue.length*100}%"></span></div><p class="small">${esc(INTRO[m])}</p><div class="question">${audio?'請先播放'+(m==='sentence'?'短句':m==='phrase'?'語塊':'英文')+'，再作答。':esc(m==='enzh'?row.en:row.zh)}</div>${m==='spelling'?`<p class="small">詞性：${esc(row.pos)}</p><button class="btn" id="hint">顯示首字母提示</button><p id="hintText" class="small"></p>`:''}${audio?'<div class="actions"><button class="btn primary" id="playQuestion">▶ 播放／重播</button><button class="btn" id="playSlow">慢速播放</button></div><p id="audioState" class="status" role="status">播放完成後開放作答。</p>':''}${choice?'<div class="options" id="options"></div>':`<label for="typed" class="small">${m==='spelling'?'英文拼寫':'你聽到的英文'}</label><textarea id="typed" class="answer-input" rows="${m==='sentence'?3:2}" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea><button id="check" class="btn primary" disabled>對答案</button>`}<div id="feedback" class="feedback" hidden role="status"></div><div class="actions"><button class="btn primary" id="next" hidden>下一題 →</button></div><p class="small" id="score">本輪答對 ${session.correct} / ${session.answered}</p></section>`;$('quit').onclick=()=>{stop();session=null;renderView()};if(choice){$('options').innerHTML=session.options.map((r,i)=>`<button class="option" data-answer="${i}" ${audio?'disabled':''}>${i+1}. ${esc(m==='zhen'?r.en:r.zh)}</button>`).join('');$('options').querySelectorAll('button').forEach(b=>b.onclick=()=>checkChoice(Number(b.dataset.answer)))}else{$('typed').oninput=()=>{$('check').disabled=(!session.heard&&audio)||!$('typed').value.trim()||session.submitted};$('typed').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!$('check').disabled)checkTyped()}};$('check').onclick=checkTyped}if(m==='spelling')$('hint').onclick=()=>{$('hintText').textContent=`首字母 ${row.en[0]} · 共 ${row.en.length} 個字母`;session.hint=true};if(audio){$('playQuestion').onclick=()=>playQuestion(false);$('playSlow').onclick=()=>playQuestion(true)}$('next').onclick=()=>{session.index++;renderQuestion()}}
function playQuestion(slow){const ref=session,idx=session.index;const {row,rec}=currentItem();const old=$('rate').value;if(slow)$('rate').value='0.7';$('audioState').textContent='播放中…';speak(rec.mode==='listen'?spokenTerm(row):row.en,ok=>{if(session!==ref||session.index!==idx)return;if(ok){session.heard=true;$('audioState').textContent='已播放，可重聽。';if(rec.mode==='listen')$('options').querySelectorAll('button').forEach(b=>b.disabled=session.submitted);else $('check').disabled=session.submitted||!$('typed').value.trim()}else $('audioState').textContent='無法播放。請使用裝置英語語音，或改做不需聲音的題型。'});$('rate').value=old}
function updateRecord(rec,right){saved.attempts++;session.answered++;const key=rec.mode+'|'+rec.id;if(right){saved.correct++;session.correct++;saved.wrong=saved.wrong.filter(r=>r.mode+'|'+r.id!==key)}else if(!saved.wrong.some(r=>r.mode+'|'+r.id===key))saved.wrong.push({...rec});save()}
function checkChoice(i){if(session.submitted)return;const {rec,row}=currentItem();if(rec.mode==='listen'&&!session.heard)return;const chosen=session.options[i],right=chosen.id===row.id;session.submitted=true;updateRecord(rec,right);$('options').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;b.classList.toggle('correct',session.options[j].id===row.id);b.classList.toggle('incorrect',j===i&&!right)});$('feedback').innerHTML=`<strong>${right?'✓ 字義配對正確':'再比較一次字義'}</strong><p><b>${esc(row.en)}</b> — ${esc(row.zh)}</p><p class="small">常見用法：${esc(row.chunk)}</p><div class="meanings"><b>本題選項一起複習</b>${session.options.map(r=>`<div class="meaning">${esc(r.en)} — ${esc(r.zh)}</div>`).join('')}</div>`;showFeedback()}
function canonical(s){return String(s).normalize('NFKC').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[‐‑–—]/g,'-').replace(/[,，]/g,'').trim().replace(/\s+/g,' ').replace(/\s+([.!?])/g,'$1').replace(/\b(organise|organised|organising|neighbourhood|centre|behaviour|colour|colours|recognise|recognised|modelled|memorise|memorising)\b/gi,w=>({organise:'organize',organised:'organized',organising:'organizing',neighbourhood:'neighborhood',centre:'center',behaviour:'behavior',colour:'color',colours:'colors',recognise:'recognize',recognised:'recognized',modelled:'modeled',memorise:'memorize',memorising:'memorizing'})[w.toLowerCase()]).replace(/\b(5|9)\b/g,w=>({'5':'five','9':'nine'})[w])}
function matchesTyped(typed,row,m){const a=canonical(typed),b=canonical(row.en);return m==='sentence'?a===b:a.toLowerCase().replace(/[.!?]$/,'')===b.toLowerCase().replace(/[.!?]$/,'')}
function checkTyped(){if(session.submitted)return;const {rec,row}=currentItem();if(['phrase','sentence'].includes(rec.mode)&&!session.heard)return;const typed=$('typed').value.trim();if(!typed)return;const right=matchesTyped(typed,row,rec.mode);session.submitted=true;updateRecord(rec,right);$('typed').disabled=true;$('check').disabled=true;let note='';if(!right){if(rec.mode==='sentence'&&canonical(typed).toLowerCase().replace(/[.!?]$/,'')===canonical(row.en).toLowerCase().replace(/[.!?]$/,''))note='內容接近，請檢查大小寫與句末標點。';else note='請對照原文檢查拼字、漏字、多字與動詞形式。'}$('feedback').innerHTML=`<strong>${right?'✓ 正確':'請對照原文修正'}</strong><p>你的答案：<span class="${right?'':'wrongtext'}">${esc(typed)}</span></p><p>英文原文：<b class="righttext">${esc(row.en)}</b></p><p>中文：${esc(row.zh)}</p>${row.chunk?`<p class="small">常見用法：${esc(row.chunk)}</p>`:''}<p class="small">${note}</p>`;showFeedback()}
function showFeedback(){$('overallStats').textContent=`累積作答 ${saved.attempts} 次 · 答對 ${saved.correct} 次 · 待複習 ${saved.wrong.length} 題`;$('feedback').hidden=false;$('next').hidden=false;$('next').textContent=session.index+1===session.queue.length?'查看本輪結果':'下一題 →';$('score').textContent=`本輪答對 ${session.correct} / ${session.answered}`}
function finish(){stop();$('view').innerHTML=`<section class="panel quiz"><h2>本輪複習完成</h2><p class="result">${session.correct} / ${session.answered}</p><p>本單元待複習：${saved.wrong.filter(r=>storedRow(r)?.unit===current).length} 題</p><div class="actions"><button class="btn primary" id="retry">重練本單元錯題</button><button class="btn" id="again">再練一輪</button><button class="btn" id="back">回單字表</button></div></section>`;$('retry').onclick=()=>{mode='mistakes';session=null;renderAll()};$('again').onclick=()=>{if(mode==='mistakes'){session=null;renderAll()}else{session=null;renderSetup()}};$('back').onclick=()=>{mode='study';session=null;renderAll()}}
function renderMistakes(){const wrong=saved.wrong.filter(r=>storedRow(r)?.unit===current);$('view').classList.remove('hide-cn');$('view').innerHTML=`<section class="panel"><h3>本單元錯題重練</h3><p class="muted">共 ${wrong.length} 題；答對後自動移出錯題清單。語音無法播放時，可切換到英翻中練習；聽寫錯題可先看原文複習。</p><button id="retryAll" class="btn primary" ${wrong.length?'':'disabled'}>重練這 ${wrong.length} 題</button>${wrong.map(r=>{const x=storedRow(r);return `<div class="sentence-card"><span class="small">${esc(MODES.find(m=>m[0]===r.mode)?.[1]||r.mode)}</span><p><button class="speak" data-review="${r.id}" data-kind="${r.mode}">${esc(x.en)} <span class="sound">◖))</span></button></p><p>${esc(x.zh)}</p></div>`}).join('')}</section>`;$('retryAll').onclick=()=>startSession(shuffle(wrong),true);$('view').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const r=b.dataset.kind==='sentence'?sentenceMap.get(b.dataset.review):b.dataset.kind==='grammar'?grammarMap.get(b.dataset.review):rowMap.get(b.dataset.review);speak(r.en)})}

function renderGrammar(){stop();session.submitted=false;session.heard=false;const {rec,row}=currentItem();const opts=shuffle(row.options);$('view').classList.remove('hide-cn');$('view').innerHTML=`<section class="panel quiz"><div class="summary"><span>用法新題 · ${session.index+1} / ${session.queue.length}</span><button class="btn" id="quit">結束本輪</button></div><p class="small">${INTRO.grammar}</p><div class="question">${esc(row.prompt)}</div><div class="options" id="options">${opts.map((x,i)=>`<button class="option" data-grammar="${i}">${i+1}. ${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback" hidden></div><div class="actions"><button class="btn primary" id="next" hidden>下一題 →</button></div><p id="score" class="small">本輪答對 ${session.correct} / ${session.answered}</p></section>`;$('quit').onclick=()=>{session=null;renderView()};$('options').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{if(session.submitted)return;session.submitted=true;const ok=opts[i]===row.en;updateRecord(rec,ok);$('options').querySelectorAll('button').forEach((x,j)=>{x.disabled=true;x.classList.toggle('correct',opts[j]===row.en);x.classList.toggle('incorrect',j===i&&!ok)});$('feedback').innerHTML=`<strong>${ok?'✓ 正確':'再確認這個用法'}</strong><p>新題答案：<b>${esc(row.en)}</b></p><p>${esc(row.zh)}</p>`;showFeedback()});$('next').onclick=()=>{session.index++;renderQuestion()}}

$('mobileUnit').onchange=e=>changeUnit(e.target.value);$('stop').onclick=()=>{stop();speechStatus('已停止。')};if(window.speechSynthesis){loadVoices();window.speechSynthesis.addEventListener('voiceschanged',loadVoices)}else speechStatus('此瀏覽器不支援語音；可使用字彙表、中英互選與拼寫。',true);renderAll();
</script></body></html>
