nt of the value of", "because nobody could identify", "as a punishment for"], "answer": 0, "explanations": ["in recognition of his research＝為肯定他的研究貢獻。", "不是因為認不出。", "不是懲罰。"], "tag": "主題搭配"}, {"id": "canned-v-56", "mode": "vocab", "paragraph": "G", "sentence": "Small volumes of food are heated to a precise temperature and for a precise time in order to avoid overcooking and preserve color and nutrients, explains food scientist Philip Nelson, who won the 2007 World Food Prize in recognition of his research on making aseptic processing workable on a large industrial scale.", "target": "workable", "options": ["practical and capable of being used successfully", "currently requiring every worker to do overtime", "proved impossible to put into practice"], "answer": 0, "explanations": ["workable＝可行、能實際運用的。", "不是工時安排。", "不是不可行。"], "tag": "主題字彙"}, {"id": "canned-v-57", "mode": "vocab", "paragraph": "G", "sentence": "Small volumes of food are heated to a precise temperature and for a precise time in order to avoid overcooking and preserve color and nutrients, explains food scientist Philip Nelson, who won the 2007 World Food Prize in recognition of his research on making aseptic processing workable on a large industrial scale.", "target": "on a large industrial scale", "options": ["in large quantities under industrial production conditions", "on a large weighing device in a shop", "only in a small laboratory experiment"], "answer": 0, "explanations": ["on a large industrial scale＝以大規模工業生產方式。", "scale 在此不是秤。", "不只是小型實驗。"], "tag": "主題搭配"}, {"id": "canned-v-58", "mode": "vocab", "paragraph": "H", "sentence": "Today, despite all the modern alternatives, Appert’s technology still reigns supreme for long-term storage.", "target": "alternatives", "options": ["other available options or methods", "steps that must always be used together", "exactly identical copies of the same can"], "answer": 0, "explanations": ["alternatives＝其他選擇、替代方法。", "選擇不等於必須全部一起用。", "不是相同罐頭的複本。"], "tag": "主題字彙"}, {"id": "canned-v-59", "mode": "vocab", "paragraph": "H", "sentence": "Today, despite all the modern alternatives, Appert’s technology still reigns supreme for long-term storage.", "target": "reigns supreme", "options": ["remains the leading or most effective option", "is legally reserved for a king or queen", "has completely disappeared from use"], "answer": 0, "explanations": ["reign supreme＝居於首位、稱霸；此為作者對長期保存用途的評價。", "不是王室專用。", "仍居首位，不是已消失。"], "tag": "慣用表達"}, {"id": "canned-v-60", "mode": "vocab", "paragraph": "H", "sentence": "More than two centuries on, the simple can is still the best solution for the safe and effective preservation of a wide range of foodstuffs worldwide.", "target": "two centuries on", "options": ["two hundred years later", "exactly two hundred years before the invention", "for only the next two years"], "answer": 0, "explanations": ["two centuries on＝兩個世紀之後；原文 More than 表超過兩世紀。", "不是兩世紀之前。", "century 不是一年。"], "tag": "時間表達"}, {"id": "canned-v-61", "mode": "vocab", "paragraph": "H", "sentence": "More than two centuries on, the simple can is still the best solution for the safe and effective preservation of a wide range of foodstuffs worldwide.", "target": "foodstuffs", "options": ["substances used as food", "machines used to fill cans", "the workers employed in food factories"], "answer": 0, "explanations": ["foodstuffs＝食品、食料。", "不是機械。", "staff 才可能指員工，foodstuffs 不是人。"], "tag": "主題字彙"}, {"id": "canned-p-1", "mode": "paraphrase", "paragraph": "A", "sentence": "In 1795, the French government had a problem: they faced the fact that it is not easy to win battles abroad when your soldiers are hungry and malnourished.", "target": "", "options": ["The French government recognized that hungry, poorly nourished soldiers made winning battles overseas difficult.", "The French government believed hungry soldiers were better at winning overseas battles.", "The government’s problem was that its soldiers were eating too much while staying at home."], "answer": 0, "explanations": ["that 引出政府面對的事實；when 描述士兵挨餓時的情況。", "忽略 not easy，反轉句意。", "abroad 是海外，malnourished 不是吃太多。"], "tag": "長難句理解", "structure": "problem 後冒號解釋具體問題；fact 後接 that 同位語子句；it is not easy to win ... 中 it 為形式主詞；when 表情況。"}, {"id": "canned-p-2", "mode": "paraphrase", "paragraph": "A", "sentence": "That year they established a 12,000-franc prize for whoever could find a way to preserve food – from milk and meat to fruits and vegetables.", "target": "", "options": ["In that year, the government offered a prize to anyone able to find a way to preserve many kinds of food.", "The government paid every soldier 12,000 francs to buy fresh food.", "Only someone able to preserve milk, but no other food, could win the prize."], "answer": 0, "explanations": ["whoever 表任何能達成條件的人；from ... to ... 表種類廣。", "prize 得主不是每位士兵。", "milk and meat to fruits and vegetables 不限奶類。"], "tag": "長難句理解", "structure": "for whoever could ... 中 whoever 引出名詞子句；to preserve 修飾 a way；破折號後列舉保存的食物範圍。"}, {"id": "canned-p-3", "mode": "paraphrase", "paragraph": "A", "sentence": "French chef Nicolas Appert took more than a decade to develop a process that involved cooking food in glass jars and then using seals made of cork to make them airtight.", "target": "", "options": ["Appert spent over ten years developing a method of cooking food in glass jars and sealing the jars airtight with cork.", "Appert’s method took less than ten years and depended on leaving the jars open.", "Appert cooked cork inside the food so that the food itself became airtight."], "answer": 0, "explanations": ["them 指 glass jars；made of cork 修飾 seals。", "more than a decade 超過十年，airtight 為密封。", "軟木用於封口，不是食物配料。"], "tag": "長難句理解", "structure": "took more than a decade to develop ...；that involved 修飾 process；cooking 與 using 為並列動名詞；made of cork 是過去分詞片語。"}, {"id": "canned-p-4", "mode": "paraphrase", "paragraph": "A", "sentence": "Appert’s achievement didn’t escape the notice of British merchant and inventor Peter Durand, who applied for a British patent later that year.", "target": "", "options": ["Durand noticed Appert’s achievement and applied for a British patent later in the same year.", "Durand failed to notice Appert’s work and never applied for a patent.", "Appert applied for Durand’s patent because neither man had noticed the invention."], "answer": 0, "explanations": ["didn’t escape the notice＝被注意到；who 指 Durand。", "否定範圍誤讀，原文明說 applied。", "申請專利的是 Durand，並非 Appert。"], "tag": "長難句理解", "structure": "主幹 Appert’s achievement didn’t escape the notice of ...；who 引導非限定關係子句，先行詞 Peter Durand。"}, {"id": "canned-p-5", "mode": "paraphrase", "paragraph": "A", "sentence": "Durand used techniques similar to Appert’s, although he adapted the model to include the use of tin vessels as well as glass jars.", "target": "", "options": ["Durand followed a method similar to Appert’s but modified it to use tin containers as well as glass jars.", "Durand used exactly the same method and made no changes to the containers.", "Durand completely stopped using glass jars and used only tin containers."], "answer": 0, "explanations": ["similar 不等於完全相同；as well as 表兩者皆包含。", "although 引出改良之處，不是無修改。", "as well as glass jars 不表示完全不用玻璃。"], "tag": "長難句理解", "structure": "although 表讓步；adapted the model to include ... 表調整後納入；as well as 將金屬與玻璃容器並列。"}, {"id": "canned-p-6", "mode": "paraphrase", "paragraph": "B", "sentence": "But even after people became aware of the existence of bacteria in the late 19th century, canning companies couldn’t work out exactly why some of their tins turned bad.", "target": "", "options": ["Even after bacteria became known, canning companies still could not fully explain why some canned food spoiled.", "Once bacteria were discovered, every company immediately understood and prevented all spoilage.", "The companies knew the precise cause before anyone knew bacteria existed."], "answer": 0, "explanations": ["even after 與 couldn’t 的組合表知識進展後仍有未解問題。", "原文強調仍不能確定原因。", "before 與 after 顛倒，也把 couldn’t 誤作 knew。"], "tag": "長難句理解", "structure": "even after 引導讓步時間子句；why 引導 work out 的受詞子句；exactly 限定對原因掌握的精確程度。"}, {"id": "canned-p-7", "mode": "paraphrase", "paragraph": "B", "sentence": "And even into the 20th century, newspapers were full of accounts not only of food poisoning but also of cases of the fatal disease botulism resulting from people eating canned food.", "target": "", "options": ["Newspapers continued into the twentieth century to report food poisoning and fatal botulism cases linked to eating canned food.", "By the twentieth century, newspapers reported that all cases of food poisoning had ended.", "Newspapers discussed only ordinary food poisoning and explicitly excluded botulism."], "answer": 0, "explanations": ["not only ... but also ... 將兩類報導並列。", "even into 表直到該時期仍有，不是已終止。", "but also 明確包含 botulism。"], "tag": "長難句理解", "structure": "accounts not only of A but also of B；resulting from ... 修飾前述肉毒桿菌中毒病例，說明其與吃罐頭的關聯。"}, {"id": "canned-p-8", "mode": "paraphrase", "paragraph": "C", "sentence": "From the 1890s to 1920s, the company insisted on weekly manicures for its canning-factory workers to ensure that any bacteria beneath employees’ fingernails stayed out of the food.", "target": "", "options": ["Heinz required weekly hand and nail care so that bacteria under workers’ nails would not get into the food.", "Heinz required nail care mainly to make the food look more colourful.", "Heinz tried to add harmless bacteria from workers’ nails to improve the product."], "answer": 0, "explanations": ["to ensure 表目的，stayed out of 表避免進入。", "不是食品外觀措施。", "stayed out 與添加進去相反。"], "tag": "長難句理解", "structure": "insisted on + 名詞片語；to ensure that ... 表目的；beneath employees’ fingernails 修飾 bacteria。"}, {"id": "canned-p-9", "mode": "paraphrase", "paragraph": "C", "sentence": "In an era when food-factory hygiene was not universally adopted, what might have been considered a nuisance by workers was at least good for consumers.", "target": "", "options": ["At a time when factory hygiene was not widely practised, measures workers might find annoying nevertheless benefited consumers.", "All factories already followed the same hygiene rules, which benefited only workers.", "Because some workers disliked the measures, the passage says the measures harmed consumers."], "answer": 0, "explanations": ["what 子句指可能被視為麻煩的做法；was ... good 為作者對消費者利益的判斷。", "not universally adopted 不是全面採用；也非只對工人有益。", "麻煩是工人可能的感受，不等於對消費者有害。"], "tag": "長難句理解", "structure": "In an era when ... 是時間背景；what might have been considered ... 為主詞子句；might 保留可能性；was at least good ... 為主句謂語。"}, {"id": "canned-p-10", "mode": "paraphrase", "paragraph": "D", "sentence": "Some of the larger canning companies, such as Heinz, Libby, and Campbell’s, installed expensive steam-retort technology developed in the 1870s.", "target": "", "options": ["Some large canning companies installed costly steam-retort equipment based on technology developed in the 1870s.", "All canning companies had already installed cheap steam equipment before the 1870s.", "The companies named invented every part of the steam-retort system themselves."], "answer": 0, "explanations": ["some、expensive 及 developed in the 1870s 都須保留。", "some 不是 all；costly 與 cheap 相反；年代也錯。", "developed 是被動修飾 technology，未指明由這幾家公司發明。"], "tag": "長難句理解", "structure": "such as ... 是公司例子；developed in the 1870s 為過去分詞片語，修飾 technology；installed 是主句動詞。"}, {"id": "canned-p-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Steam retorts worked like steam engines, using pressure to raise canning temperatures high enough to make food safe.", "target": "", "options": ["Steam retorts used pressure, like steam engines, to reach temperatures high enough to make food safe.", "Steam retorts made food safe only by reducing pressure and lowering the temperature.", "Steam retorts replaced heating with chemical additives alone."], "answer": 0, "explanations": ["using pressure 說明方法，high enough to 表溫度足以達成結果。", "raise 是升高，不是降低。", "本句談壓力與加熱，不是只加化學物。"], "tag": "長難句理解", "structure": "using pressure 為方法分詞片語；to raise 表目的；high enough to make ... 表達到足以產生結果的程度。"}, {"id": "canned-p-12", "mode": "paraphrase", "paragraph": "D", "sentence": "Yet some batches of cans, even when made with this advanced technique, would explode after months on the shelf, while the contents of other cans might mysteriously sour.", "target": "", "options": ["Even with advanced equipment, some batches exploded after storage, while food in other cans sometimes went sour.", "The new technique guaranteed that no can would ever explode or spoil.", "Every can exploded immediately during manufacture and none became sour in storage."], "answer": 0, "explanations": ["Yet 和 even when 都強調技術進步後仍有失敗。", "some ... would explode 及 might sour 否定這種保證。", "some 不是 every，after months 不是立即；other cans 會變酸。"], "tag": "長難句理解", "structure": "even when made ... 是省略主詞與 be 的被動讓步子句；would 表過去反覆可能發生的情況；while 對比兩類罐頭的問題。"}, {"id": "canned-p-13", "mode": "paraphrase", "paragraph": "E", "sentence": "US canning companies eventually banded together to discover the scientific principles affecting the canning process.", "target": "", "options": ["American canning companies eventually joined forces to investigate the scientific rules governing canning.", "American canning companies split up because they rejected scientific research.", "The companies combined their food products without sharing any research goal."], "answer": 0, "explanations": ["banded together＝合作；to discover 說明共同目標。", "與聯合研究相反。", "聯合的是公司合作，不是把食品混合。"], "tag": "長難句理解", "structure": "to discover 表目的；affecting the canning process 為現在分詞片語，修飾 scientific principles。"}, {"id": "canned-p-14", "mode": "paraphrase", "paragraph": "E", "sentence": "In 1913, they launched the Research Laboratory of the National Canners Association in order to look into the elusive bacteriology responsible for all manner of spoiled canned food.", "target": "", "options": ["In 1913, the companies set up a laboratory to investigate the poorly understood bacterial causes behind many kinds of canned-food spoilage.", "In 1913, all spoilage had been explained, so the companies closed their research laboratory.", "The laboratory was established only to study whether consumers liked the labels on cans."], "answer": 0, "explanations": ["they 指前句的公司；look into 表調查。", "launched 是成立，elusive 表尚難掌握。", "研究對象是細菌學與腐敗，不是標籤偏好。"], "tag": "長難句理解", "structure": "in order to 表目的；responsible for ... 修飾 bacteriology，指與腐敗成因相關的研究問題；all manner of＝各種。"}, {"id": "canned-p-15", "mode": "paraphrase", "paragraph": "E", "sentence": "The research done by the laboratory in the decades that followed helped resolve the problem of spoiled food and led to improved flavor, color, nutritional value, and texture.", "target": "", "options": ["Over the following decades, the laboratory’s research helped address spoilage and improve several qualities of canned food.", "Research finished in 1913 proved that only the colour of cans mattered.", "The laboratory improved flavour by deliberately allowing food to spoil."], "answer": 0, "explanations": ["done by ... 修飾 research；helped resolve 與 led to 是並列結果。", "in the decades that followed 是之後數十年；改善不只一項。", "原文說解決腐敗問題，不是刻意腐敗。"], "tag": "長難句理解", "structure": "The research 為主詞；done by ... 是過去分詞修飾；that followed 修飾 decades；helped resolve 與 led to ... 並列。"}, {"id": "canned-p-16", "mode": "paraphrase", "paragraph": "F", "sentence": "Before this time, canning companies had discovered through trial and error that the best way to avoid bad cans was to cook food at high temperatures for long periods, an approach that sacrificed flavor.", "target": "", "options": ["Earlier trial and error suggested prolonged high-temperature cooking best prevented spoilage, but this reduced flavour.", "Earlier experiments showed that short cold treatment always preserved both safety and full flavour.", "Companies deliberately made cans unsafe because they wanted stronger flavour."], "answer": 0, "explanations": ["an approach 回指長時間高溫烹煮；that sacrificed flavor 說明代價。", "high temperatures、long periods 與選項相反。", "原句是以風味換安全，不是故意犧牲安全。"], "tag": "長難句理解", "structure": "had discovered 表更早的發現；that 引出受詞子句；the best way ... was to cook ...；an approach 是前面做法的同位說明。"}, {"id": "canned-p-17", "mode": "paraphrase", "paragraph": "F", "sentence": "The addition of salt was one technique employed in the early 20th century to prevent this happening, thereby maintaining the visual appeal of the product and restoring a certain amount of taste.", "target": "", "options": ["Adding salt was used to prevent the colour loss, helping keep food visually attractive and recover some taste.", "Salt was used to remove the remaining colour and eliminate every trace of taste.", "Salt made the product safer but had no effect on its appearance or flavour."], "answer": 0, "explanations": ["this 指前句綠色流失；a certain amount 表部分恢復。", "prevent this happening＝防止色澤流失；restoring 與 eliminate 相反。", "本句目的在色澤與部分味道，未說完全無效果。"], "tag": "長難句理解", "structure": "employed ... 修飾 technique；to prevent 表目的；thereby 後 maintaining 與 restoring 兩個並列分詞，表結果。"}, {"id": "canned-p-18", "mode": "paraphrase", "paragraph": "G", "sentence": "This technique, which involves sterilizing the container separately from the food, was invented in Switzerland in the 1960s for processing milk, but is now used widely for canned tomatoes and many juices.", "target": "", "options": ["Aseptic processing treats the container separately from the food; first developed in Switzerland for milk, it is now also used for tomatoes and juices.", "The technique requires food and container to be sterilized together and is still restricted to milk.", "The technique was invented for tomatoes and was not used for milk until much later."], "answer": 0, "explanations": ["separately 是分開處理；for processing milk 是最初用途。", "together 與 separately 相反；now used widely 不只奶類。", "顛倒原始用途與後來用途。"], "tag": "長難句理解", "structure": "which involves ... 為非限定關係子句；was invented 與 is now used 是以 but 連接的被動謂語；now 依文章時間理解。"}, {"id": "canned-p-19", "mode": "paraphrase", "paragraph": "G", "sentence": "Small volumes of food are heated to a precise temperature and for a precise time in order to avoid overcooking and preserve color and nutrients, explains food scientist Philip Nelson, who won the 2007 World Food Prize in recognition of his research on making aseptic processing workable on a large industrial scale.", "target": "", "options": ["Food is heated in small amounts with exact control of time and temperature to avoid overcooking; Nelson was honoured for helping make this process practical at industrial scale.", "Food must be heated for as long and as hot as possible, regardless of nutrients, to win an award.", "Nelson won the prize because he prevented aseptic processing from being used outside small experiments."], "answer": 0, "explanations": ["precise 不等於越高越久；who 指 Philip Nelson，得獎肯定工業規模可行性的研究。", "原文目的是避免 overcooking 並保留色澤、營養。", "making ... workable on a large industrial scale 是使其能工業應用。"], "tag": "長難句理解", "structure": "主句 Small volumes ... are heated ...；in order to 引出目的；explains ... 為倒裝引述；who ... 修飾 Nelson；making A workable 為使役補語結構。"}, {"id": "canned-p-20", "mode": "paraphrase", "paragraph": "H", "sentence": "Today, despite all the modern alternatives, Appert’s technology still reigns supreme for long-term storage.", "target": "", "options": ["The author presents Appert’s method as still the leading option for long-term storage, even with modern alternatives available.", "The author says modern alternatives have completely displaced Appert’s method in every context.", "The author says Appert’s method can be used only for immediate consumption."], "answer": 0, "explanations": ["despite 是讓步；評價限於 long-term storage，並按文章敘述理解。", "still reigns supreme 與被完全取代相反。", "long-term 是長期，不是立即食用。"], "tag": "長難句理解", "structure": "despite + 名詞片語；主句 Appert’s technology still reigns supreme；for long-term storage 限定比較用途。"}, {"id": "canned-food-qv2-1", "mode": "questionVocab", "paragraph": "", "sentence": "Solving problems in the preservation of food", "target": "preservation of food", "options": ["食品保存、防腐", "食品營養分析", "食物在體內的消化"], "answer": 0, "explanations": ["preservation 指防止食品腐壞、使其可保存。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是分析營養成分。", "不是 digestion。"], "tag": "題目字彙", "source": "Question 1–8 · 題目用語"}, {"id": "canned-food-qv2-2", "mode": "questionVocab", "paragraph": "", "sentence": "Durand adapts Appert’s process for containers made of ______", "target": "adapts", "options": ["調整改良以適用", "不作改變地照搬", "調查並證明原方法無效"], "answer": 0, "explanations": ["adapt a process for…指使方法適合新用途。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是原樣複製。", "不包含證明失效的意思。"], "tag": "題目字彙", "source": "Question 3 · 題目用語"}, {"id": "canned-food-qv2-3", "mode": "questionVocab", "paragraph": "", "sentence": "Heinz company introduces regulations to reduce risk of ______ entering the product", "target": "regulations", "options": ["規定、規章", "產品的成分配方", "對未來的銷量預估"], "answer": 0, "explanations": ["regulations 指要求遵守的規則。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是 recipe 或 formula。", "不是銷量預測。"], "tag": "題目字彙", "source": "Question 5 · 題目用語"}, {"id": "canned-food-qv2-4", "mode": "questionVocab", "paragraph": "", "sentence": "Heinz company introduces regulations to reduce risk of ______ entering the product", "target": "reduce risk", "options": ["降低風險", "完全消除風險", "轉移產品所有權"], "answer": 0, "explanations": ["reduce 只表降低，不保證歸零。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "完全消除是 eliminate risk。", "與轉移所有權無關。"], "tag": "題目字彙", "source": "Question 5 · 題目用語"}, {"id": "canned-food-qv2-5", "mode": "questionVocab", "paragraph": "", "sentence": "Technology developed for use with ______ is adapted for the sterilisation of cans", "target": "sterilisation", "options": ["滅菌", "冷藏", "脫水乾燥"], "answer": 0, "explanations": ["sterilisation 指殺滅微生物的處理。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "冷藏可抑制生長，但不等於滅菌。", "脫水是 dehydration。"], "tag": "題目字彙", "source": "Question 7 · 題目用語"}, {"id": "canned-food-qv2-7", "mode": "questionVocab", "paragraph": "", "sentence": "Peter Durand based his food preservation methods on a process that had recently won a cash prize from the French government.", "target": "based his food preservation methods on", "options": ["以……作為其食品保存方法的基礎", "把其保存方法正式歸功於……", "證明其方法完全取代了……"], "answer": 0, "explanations": ["base A on B＝以 B 為 A 的基礎。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是單純表揚或歸功。", "也未包含完全取代的意思。"], "tag": "題目字彙", "source": "Question 9 · 題目用語"}, {"id": "canned-food-qv2-8", "mode": "questionVocab", "paragraph": "", "sentence": "The first canned food products were aimed at the general public.", "target": "aimed at", "options": ["以……為目標對象", "由……提供資金", "受到……的監管"], "answer": 0, "explanations": ["products aimed at the general public 指產品以大眾為對象。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是描述投資者。", "不是描述監管者。"], "tag": "題目字彙", "source": "Question 10 · 題目用語"}, {"id": "canned-food-qv2-9", "mode": "questionVocab", "paragraph": "", "sentence": "The first canned food products were aimed at the general public.", "target": "the general public", "options": ["一般大眾", "特定行業的專業人士", "政府行政機關"], "answer": 0, "explanations": ["the general public 指普通社會大眾。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是限於某專業群體。", "public 在此不是政府機關。"], "tag": "題目字彙", "source": "Question 10 · 題目用語"}, {"id": "canned-food-qv2-10", "mode": "questionVocab", "paragraph": "", "sentence": "Canned food producers often denied responsibility for cases of food poisoning.", "target": "denied responsibility", "options": ["否認負有責任", "承認責任但拒絕賠償", "承諾今後承擔全部責任"], "answer": 0, "explanations": ["deny responsibility 指否認自己有責。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "承認有責與 deny 不同。", "不是對未來承諾。"], "tag": "題目字彙", "source": "Question 11 · 題目用語"}, {"id": "canned-food-qv2-11", "mode": "questionVocab", "paragraph": "", "sentence": "Canned food producers often denied responsibility for cases of food poisoning.", "target": "food poisoning", "options": ["食物中毒", "對特定食物的過敏反應", "因長期營養不足造成的疾病"], "answer": 0, "explanations": ["food poisoning 指吃下受污染食物所致的中毒或疾病。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是 food allergy。", "不是長期營養不足。"], "tag": "題目字彙", "source": "Question 11 · 題目用語"}, {"id": "canned-food-qv2-12", "mode": "questionVocab", "paragraph": "", "sentence": "The Heinz Company’s regulations regarding employees’ personal hygiene led to an increase in sales of their products.", "target": "personal hygiene", "options": ["個人衛生", "私人醫療保險", "員工的隱私權"], "answer": 0, "explanations": ["personal hygiene 包括洗手、清潔等衛生習慣。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是保險。", "不是隱私權。"], "tag": "題目字彙", "source": "Question 12 · 題目用語"}, {"id": "canned-food-qv2-13", "mode": "questionVocab", "paragraph": "", "sentence": "The Heinz Company’s regulations regarding employees’ personal hygiene led to an increase in sales of their products.", "target": "led to an increase in sales", "options": ["導致銷售量增加", "與銷售量增加同時發生但未表明因果", "導致產品售價提高"], "answer": 0, "explanations": ["lead to 表結果或因果關係；此處是原題的因果主張。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不只是同時發生。", "sales 指銷售，不等於價格。"], "tag": "題目字彙", "source": "Question 12 · 題目用語"}, {"id": "canned-food-qv2-14", "mode": "questionVocab", "paragraph": "", "sentence": "The use of chemical additives was abandoned following the adoption of steam techniques.", "target": "chemical additives", "options": ["化學添加物", "食品原有的天然成分", "只用於清潔設備的藥劑"], "answer": 0, "explanations": ["additives 是加入產品的物質。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是食品本來就有的成分。", "不限定為設備清潔劑。"], "tag": "題目字彙", "source": "Question 13 · 題目用語"}, {"id": "canned-food-qv2-15", "mode": "questionVocab", "paragraph": "", "sentence": "The use of chemical additives was abandoned following the adoption of steam techniques.", "target": "abandoned", "options": ["放棄、不再使用", "暫時減少用量但繼續採用", "改以新名稱繼續銷售"], "answer": 0, "explanations": ["abandon a practice 指停止採行。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是僅降低用量。", "不是改名續用。"], "tag": "題目字彙", "source": "Question 13 · 題目用語"}, {"id": "canned-food-qv2-16", "mode": "questionVocab", "paragraph": "", "sentence": "The use of chemical additives was abandoned following the adoption of steam techniques.", "target": "adoption of steam techniques", "options": ["採用蒸汽技術", "取得蒸汽技術的專利權", "停止使用蒸汽技術"], "answer": 0, "explanations": ["adoption 在技術語境指開始採行。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "採用不等於擁有專利。", "不是停止使用。"], "tag": "題目字彙", "source": "Question 13 · 題目用語"}], "sourceNote": "原文註解：open kettle method 指先在有蓋容器中烹煮食物，再趁熱倒入無菌罐中。文中 today、now 及技術評價依文章敘述理解。"}, {"id": "origin-cinema", "title": "The origin of Cinema", "sourceTitle": "The Origins of Cinema", "subtitle": "The growth of early cinema and the rise of national film industries", "part": 1, "topic": "CINEMA · INDUSTRY · ARTISTIC DEVELOPMENT", "sourceNote": "目錄沿用預留名稱；原文題名為 The Origins of Cinema。年代與「現在」依文章敘述理解，題目選項不一律代表正確的原文事實。", "paragraphs": [{"label": "A", "text": "The history of the cinema in its first thirty years is one of major and, to this day, unparalleled expansion and growth. Beginning as something unusual in a handful of big cities -- New York, London, Paris and Berlin -- the new medium quickly found its way across the world, attracting larger and larger audiences wherever it was shown and replacing other forms of entertainment as it did so. As audiences grew, so did the places where films were shown, finishing up with the ‘great picture palaces’ of the 1920s, which rivalled, and occasionally superseded, theatres and music-houses in terms of opulence and splendour. Meanwhile, films themselves developed from being short ‘attractions’ only a couple of minutes long, to the full-length feature that has dominated the world’s screens up to the present day."}, {"label": "B", "text": "Although French, German, American and British pioneers have all been credited with the invention of cinema, the British and the Germans played a relatively small role in its worldwide exploitation. It was above all the French, followed closely by the Americans, who were the most passionate exporters of the new invention, helping to start cinema in China, Japan, Latin America and Russia. In terms of artistic development it was again the French and the Americans who took the lead, though in the years before the First World War, Italy, Denmark and Russia also played a part."}, {"label": "C", "text": "In the end, it was the United States that was to become, and remain, the largest single market for films. By protecting its own market and pursuing a vigorous export policy, the Americans achieved a dominant position on the world market by the start of the First World War. The centre of film-making had moved westwards, to Hollywood, and it was films from these new Hollywood studios that flooded onto the world’s film markets in the years after the First World War, and have done so ever since. Faced with total Hollywood domination, few film industries proved competitive. The Italian cinema, which had pioneered the feature film with spectacular films like Quo vadis? (1913) and Cabiria (1914), almost collapsed. In Scandinavia, the Swedish cinema had a brief period of glory, notably with powerful epic films and comedies. Even the French cinema found itself in a difficult position. In Europe, only Germany proved industrially capable, while in the new Soviet Union and in Japan the development of the cinema took place in conditions of commercial isolation."}, {"label": "D", "text": "Hollywood took the lead artistically as well as industrially. Hollywood films appealed because they had better-constructed narratives, their special effects were more impressive, and the star system added a new dimension to screen acting. If Hollywood did not have enough of its own resources, it had a great deal of money to buy up artists and technical innovations from Europe to ensure its continued dominance over present or future competition."}, {"label": "E", "text": "The rest of the world survived partly by learning from Hollywood and partly because audiences continued to exist for a product which corresponded to needs which Hollywood could not supply. As well as popular audiences, there were also increasing audiences for films which were artistically more adventurous or which dealt with the issues in the outer world."}, {"label": "F", "text": "None of this would have happened without technology, and cinema is in fact unique as an art form. In the early years, this art form was quite primitive, similar to the original French idea of using a lantern and slides back in the seventeenth century. Early cinema programmes were a mixture of items, combining comic sketches, free-standing narratives, serial episodes and the occasional trick or animated film. With the arrival of the feature length narrative as the main attraction, other types of films became less important. The making of cartoons became a separate branch of film-making, generally practised outside the major studios, and the same was true of serials. Together with newsreels, they tended to be shown as short items in a programme which led to the feature."}, {"label": "G", "text": "From early cinema, it was only American slapstick comedy that successfully developed in both short and feature format. However, during this ‘Silent Film’ era, animation, comedy, serials and dramatic features continued to thrive, along with factual films or documentaries, which acquired an increasing distinctiveness as the period progressed. It was also at this time that the avant-garde film first achieved commercial success, this time thanks almost exclusively to the French and the occasional German film."}, {"label": "H", "text": "Of the countries which developed and maintained distinctive national cinemas in the silent period, the most important were France, Germany and the Soviet Union. Of these, the French displayed the most continuity, in spite of the war and post-war economic uncertainties. The German cinema, relatively insignificant in the pre-war years, exploded on to the world scene after 1919. Yet even they were both overshadowed by the Soviets after the 1917 Revolution. They turned their back on the past, leaving the style of the pre-war Russian cinema to the emigres who fled westwards to escape the Revolution."}, {"label": "I", "text": "The other countries whose cinemas changed dramatically are: Britain, which had an interesting but undistinguished history in the silent period; Italy, which had a brief moment of international fame just before the war; the Scandinavian countries, particularly Denmark, which played a role in the development of silent cinema quite out of proportion to their small population; and Japan, where a cinema developed based primarily on traditional theatrical and, to a lesser extent, other art forms and only gradually adapted to western influence."}], "questions": [{"id": "cinema-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "The history of the cinema in its first thirty years is one of major and, to this day, unparalleled expansion and growth.", "target": "unparalleled", "options": ["never matched in scale or degree", "happening alongside another event", "unimportant compared with later changes"], "answer": 0, "explanations": ["unparalleled＝無可比擬、前所未有的。", "不是 parallel 同時平行發生。", "不是不重要。"], "tag": "主題字彙"}, {"id": "cinema-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Beginning as something unusual in a handful of big cities -- New York, London, Paris and Berlin -- the new medium quickly found its way across the world, attracting larger and larger audiences wherever it was shown and replacing other forms of entertainment as it did so.", "target": "a handful of", "options": ["a small number of", "a large majority of", "a number exactly equal to five"], "answer": 0, "explanations": ["a handful of＝少數幾個。", "不是大多數。", "不是一定五個。"], "tag": "慣用表達"}, {"id": "cinema-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "Beginning as something unusual in a handful of big cities -- New York, London, Paris and Berlin -- the new medium quickly found its way across the world, attracting larger and larger audiences wherever it was shown and replacing other forms of entertainment as it did so.", "target": "medium", "options": ["a means or form of communication and expression", "an object of average size", "the exact midpoint in a numerical range"], "answer": 0, "explanations": ["medium 在此指傳播、藝術媒介，即電影。", "不是尺寸中等。", "不是數列中點。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "Beginning as something unusual in a handful of big cities -- New York, London, Paris and Berlin -- the new medium quickly found its way across the world, attracting larger and larger audiences wherever it was shown and replacing other forms of entertainment as it did so.", "target": "found its way", "options": ["spread or reached different places", "became lost while travelling", "discovered one fixed road for transport"], "answer": 0, "explanations": ["find its way across the world＝傳播至世界各地。", "不是迷路。", "不是找到實體道路。"], "tag": "搭配與語境義"}, {"id": "cinema-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "As audiences grew, so did the places where films were shown, finishing up with the ‘great picture palaces’ of the 1920s, which rivalled, and occasionally superseded, theatres and music-houses in terms of opulence and splendour.", "target": "so did the places", "options": ["the venues grew too", "the venues stayed exactly the same", "the audiences copied the venues"], "answer": 0, "explanations": ["so + 助動詞 + 主詞 表前述成長也適用於放映場所。", "不是保持不變。", "did 代替 grew，不是模仿。"], "tag": "句型語義"}, {"id": "cinema-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "As audiences grew, so did the places where films were shown, finishing up with the ‘great picture palaces’ of the 1920s, which rivalled, and occasionally superseded, theatres and music-houses in terms of opulence and splendour.", "target": "finishing up with", "options": ["eventually leading to or ending with", "closing permanently before reaching", "starting for the first time with"], "answer": 0, "explanations": ["finish up with＝最終發展成、以……告終。", "不是在達成前關閉。", "不是開始於。"], "tag": "Phrasal verb"}, {"id": "cinema-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "As audiences grew, so did the places where films were shown, finishing up with the ‘great picture palaces’ of the 1920s, which rivalled, and occasionally superseded, theatres and music-houses in terms of opulence and splendour.", "target": "rivalled", "options": ["matched or competed with in quality", "copied every detail of", "were always inferior to"], "answer": 0, "explanations": ["rival 作動詞，指在某方面媲美、競爭。", "不等於完全照抄。", "不是必然較差。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "As audiences grew, so did the places where films were shown, finishing up with the ‘great picture palaces’ of the 1920s, which rivalled, and occasionally superseded, theatres and music-houses in terms of opulence and splendour.", "target": "superseded", "options": ["surpassed or overtook in luxury and magnificence", "were built next to without competition", "preserved unchanged forever"], "answer": 0, "explanations": ["supersede 原義是取代；本句比較奢華程度，指有時甚至超越劇院與音樂廳。", "不是只建在旁邊。", "不是原樣保存。"], "tag": "主題字彙"}, {"id": "cinema-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "As audiences grew, so did the places where films were shown, finishing up with the ‘great picture palaces’ of the 1920s, which rivalled, and occasionally superseded, theatres and music-houses in terms of opulence and splendour.", "target": "opulence and splendour", "options": ["great luxury and impressive magnificence", "technical accuracy and low operating costs", "small size and plain decoration"], "answer": 0, "explanations": ["opulence and splendour＝奢華與富麗堂皇。", "不是精準與低成本。", "不是樸素小巧。"], "tag": "主題搭配"}, {"id": "cinema-vocab-10", "mode": "vocab", "paragraph": "A", "sentence": "Meanwhile, films themselves developed from being short ‘attractions’ only a couple of minutes long, to the full-length feature that has dominated the world’s screens up to the present day.", "target": "full-length feature", "options": ["a film long enough to be the main item in a programme", "a short advertisement shown between films", "a written article about film technology"], "answer": 0, "explanations": ["full-length feature＝長篇正片、劇情長片。", "不是廣告短片。", "feature 此處不是報刊專題。"], "tag": "主題搭配"}, {"id": "cinema-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "Although French, German, American and British pioneers have all been credited with the invention of cinema, the British and the Germans played a relatively small role in its worldwide exploitation.", "target": "credited with", "options": ["recognized as having contributed to or achieved", "paid back money borrowed from", "accused of illegally copying"], "answer": 0, "explanations": ["be credited with an invention＝被認為對發明有貢獻、獲肯定。", "不是償還貸款。", "不是被指抄襲。"], "tag": "主題搭配"}, {"id": "cinema-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "Although French, German, American and British pioneers have all been credited with the invention of cinema, the British and the Germans played a relatively small role in its worldwide exploitation.", "target": "exploitation", "options": ["development and use for commercial purposes", "cruel treatment of film workers specifically", "the complete rejection of an invention"], "answer": 0, "explanations": ["worldwide exploitation 在此是全球商業開發、運用。", "本句不是勞工剝削語境。", "不是拒用。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "It was above all the French, followed closely by the Americans, who were the most passionate exporters of the new invention, helping to start cinema in China, Japan, Latin America and Russia.", "target": "above all", "options": ["most importantly or especially", "physically higher than everything else", "without including anyone else at all"], "answer": 0, "explanations": ["above all＝尤其、最重要的是。", "不是物理位置。", "突出法國不等於完全排除其他國。"], "tag": "搭配與語境義"}, {"id": "cinema-vocab-14", "mode": "vocab", "paragraph": "B", "sentence": "In terms of artistic development it was again the French and the Americans who took the lead, though in the years before the First World War, Italy, Denmark and Russia also played a part.", "target": "took the lead", "options": ["became the leading participants", "played the main character in a film", "followed another country’s example only"], "answer": 0, "explanations": ["take the lead＝居於領先地位。", "不是演主角。", "不是只跟隨。"], "tag": "主題搭配"}, {"id": "cinema-vocab-15", "mode": "vocab", "paragraph": "C", "sentence": "In the end, it was the United States that was to become, and remain, the largest single market for films.", "target": "single market", "options": ["one national market considered on its own", "a market selling only one film", "a shop that admits only one customer"], "answer": 0, "explanations": ["largest single market 指個別國家市場中最大的。", "不是只賣一部片。", "不是只容一名顧客。"], "tag": "搭配與語境義"}, {"id": "cinema-vocab-16", "mode": "vocab", "paragraph": "C", "sentence": "By protecting its own market and pursuing a vigorous export policy, the Americans achieved a dominant position on the world market by the start of the First World War.", "target": "pursuing", "options": ["actively following or carrying out", "running after a person physically", "rejecting before trying"], "answer": 0, "explanations": ["pursue a policy＝積極推行政策。", "不是實際追人。", "不是拒絕。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-17", "mode": "vocab", "paragraph": "C", "sentence": "By protecting its own market and pursuing a vigorous export policy, the Americans achieved a dominant position on the world market by the start of the First World War.", "target": "vigorous", "options": ["energetic and forceful", "weak and occasional", "required only by military law"], "answer": 0, "explanations": ["vigorous export policy＝積極有力的出口政策。", "不是軟弱偶發。", "不表示只由軍法規定。"], "tag": "主題搭配"}, {"id": "cinema-vocab-18", "mode": "vocab", "paragraph": "C", "sentence": "The centre of film-making had moved westwards, to Hollywood, and it was films from these new Hollywood studios that flooded onto the world’s film markets in the years after the First World War, and have done so ever since.", "target": "flooded onto", "options": ["entered in very large numbers", "were destroyed by rising water", "were completely blocked from entering"], "answer": 0, "explanations": ["flood onto markets＝大量湧入市場。", "此處不是水災。", "不是禁止進入。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-19", "mode": "vocab", "paragraph": "C", "sentence": "Faced with total Hollywood domination, few film industries proved competitive.", "target": "Faced with", "options": ["confronted by or having to deal with", "physically looking in the same direction as", "unaware of"], "answer": 0, "explanations": ["faced with domination＝面對、遭遇支配地位。", "不是面朝同方向。", "不是不知道。"], "tag": "主題搭配"}, {"id": "cinema-vocab-20", "mode": "vocab", "paragraph": "C", "sentence": "Faced with total Hollywood domination, few film industries proved competitive.", "target": "few", "options": ["not many", "almost all", "exactly two"], "answer": 0, "explanations": ["few 帶否定意味：能競爭的很少。", "不是大多數。", "沒有指定數目為二。"], "tag": "數量與限定"}, {"id": "cinema-vocab-21", "mode": "vocab", "paragraph": "C", "sentence": "The Italian cinema, which had pioneered the feature film with spectacular films like Quo vadis? (1913) and Cabiria (1914), almost collapsed.", "target": "pioneered", "options": ["was among the first to develop", "was the last to copy", "banned the production of"], "answer": 0, "explanations": ["pioneer 作動詞，指率先開創。", "不是最後模仿。", "不是禁止。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-22", "mode": "vocab", "paragraph": "C", "sentence": "In Scandinavia, the Swedish cinema had a brief period of glory, notably with powerful epic films and comedies.", "target": "epic films", "options": ["large-scale films often involving grand historical stories", "films that are necessarily very short", "films made only to report daily news"], "answer": 0, "explanations": ["epic films＝史詩式電影，通常有宏大敘事。", "不是必然很短。", "新聞片是 newsreels。"], "tag": "主題搭配"}, {"id": "cinema-vocab-23", "mode": "vocab", "paragraph": "C", "sentence": "In Europe, only Germany proved industrially capable, while in the new Soviet Union and in Japan the development of the cinema took place in conditions of commercial isolation.", "target": "commercial isolation", "options": ["little connection with international trade or markets", "complete artistic sameness with Hollywood", "a requirement to show every foreign film"], "answer": 0, "explanations": ["commercial isolation＝商業上與外界隔離。", "不是藝術風格相同。", "不是必須播放所有外國片。"], "tag": "主題搭配"}, {"id": "cinema-vocab-24", "mode": "vocab", "paragraph": "D", "sentence": "Hollywood films appealed because they had better-constructed narratives, their special effects were more impressive, and the star system added a new dimension to screen acting.", "target": "appealed", "options": ["attracted or interested audiences", "asked a higher court to change a decision", "caused audiences to leave immediately"], "answer": 0, "explanations": ["films appealed＝電影吸引觀眾。", "不是法律上訴。", "不是使觀眾離去。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-25", "mode": "vocab", "paragraph": "D", "sentence": "Hollywood films appealed because they had better-constructed narratives, their special effects were more impressive, and the star system added a new dimension to screen acting.", "target": "narratives", "options": ["stories and the way they are told", "the machines projecting pictures", "the buildings used to show films"], "answer": 0, "explanations": ["narratives＝敘事、故事。", "不是放映機。", "不是戲院。"], "tag": "主題字彙"}, {"id": "cinema-vocab-26", "mode": "vocab", "paragraph": "D", "sentence": "Hollywood films appealed because they had better-constructed narratives, their special effects were more impressive, and the star system added a new dimension to screen acting.", "target": "special effects", "options": ["visual or other artificial techniques creating screen illusions", "the emotional reaction of every viewer", "advertising shown outside cinemas"], "answer": 0, "explanations": ["special effects＝電影特效。", "不是每個人的情緒反應。", "不是戲院外廣告。"], "tag": "主題搭配"}, {"id": "cinema-vocab-27", "mode": "vocab", "paragraph": "D", "sentence": "Hollywood films appealed because they had better-constructed narratives, their special effects were more impressive, and the star system added a new dimension to screen acting.", "target": "star system", "options": ["the practice of building films around famous performers", "a method of filming objects in the night sky", "a system for giving every cinema a hotel rating"], "answer": 0, "explanations": ["star system＝明星制度。", "不是拍攝天體。", "不是飯店評等。"], "tag": "主題搭配"}, {"id": "cinema-vocab-28", "mode": "vocab", "paragraph": "D", "sentence": "Hollywood films appealed because they had better-constructed narratives, their special effects were more impressive, and the star system added a new dimension to screen acting.", "target": "dimension", "options": ["an additional aspect or quality", "the physical height of a cinema screen only", "a fixed unit of film length"], "answer": 0, "explanations": ["add a new dimension＝增添新的面向。", "不是只指螢幕高度。", "不是片長單位。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-29", "mode": "vocab", "paragraph": "D", "sentence": "If Hollywood did not have enough of its own resources, it had a great deal of money to buy up artists and technical innovations from Europe to ensure its continued dominance over present or future competition.", "target": "buy up", "options": ["acquire or recruit extensively by paying", "sell at a higher price", "use without payment or agreement"], "answer": 0, "explanations": ["buy up artists and innovations 指用雄厚資金延攬人才、取得技術。", "不是賣出。", "不是無償使用。"], "tag": "Phrasal verb"}, {"id": "cinema-vocab-30", "mode": "vocab", "paragraph": "D", "sentence": "If Hollywood did not have enough of its own resources, it had a great deal of money to buy up artists and technical innovations from Europe to ensure its continued dominance over present or future competition.", "target": "dominance", "options": ["a position of greatest power or influence", "an equal share with every competitor", "the total absence of competition in every case"], "answer": 0, "explanations": ["dominance＝優勢、支配地位。", "不是完全平等。", "占優勢不代表完全沒有競爭者。"], "tag": "主題字彙"}, {"id": "cinema-vocab-31", "mode": "vocab", "paragraph": "E", "sentence": "The rest of the world survived partly by learning from Hollywood and partly because audiences continued to exist for a product which corresponded to needs which Hollywood could not supply.", "target": "corresponded to", "options": ["matched or met", "sent written letters to", "contradicted completely"], "answer": 0, "explanations": ["correspond to needs＝符合、回應需求。", "不是通信。", "不是完全違反。"], "tag": "搭配與語境義"}, {"id": "cinema-vocab-32", "mode": "vocab", "paragraph": "E", "sentence": "As well as popular audiences, there were also increasing audiences for films which were artistically more adventurous or which dealt with the issues in the outer world.", "target": "adventurous", "options": ["willing to experiment with new artistic approaches", "limited to stories about dangerous travel", "unable to try any new technique"], "answer": 0, "explanations": ["artistically adventurous＝藝術上勇於嘗試。", "不只指冒險旅行題材。", "與不敢嘗試相反。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-33", "mode": "vocab", "paragraph": "E", "sentence": "As well as popular audiences, there were also increasing audiences for films which were artistically more adventurous or which dealt with the issues in the outer world.", "target": "dealt with", "options": ["addressed or explored a subject", "sold for a reduced price", "avoided mentioning"], "answer": 0, "explanations": ["films dealt with issues＝探討議題。", "不是特價交易。", "不是避而不談。"], "tag": "Phrasal verb"}, {"id": "cinema-vocab-34", "mode": "vocab", "paragraph": "F", "sentence": "In the early years, this art form was quite primitive, similar to the original French idea of using a lantern and slides back in the seventeenth century.", "target": "primitive", "options": ["simple and technically undeveloped", "older than all human civilization", "more advanced than modern equipment"], "answer": 0, "explanations": ["primitive 在此指早期技術簡陋。", "不是史前的絕對年代判斷。", "不是更先進。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-35", "mode": "vocab", "paragraph": "F", "sentence": "In the early years, this art form was quite primitive, similar to the original French idea of using a lantern and slides back in the seventeenth century.", "target": "slides", "options": ["still pictures projected onto a screen", "playground equipment for children", "moving film reels only"], "answer": 0, "explanations": ["lantern and slides 指幻燈設備與投影片。", "不是溜滑梯。", "slides 在此是靜態圖片，不是活動影像捲片。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-36", "mode": "vocab", "paragraph": "F", "sentence": "Early cinema programmes were a mixture of items, combining comic sketches, free-standing narratives, serial episodes and the occasional trick or animated film.", "target": "comic sketches", "options": ["short humorous scenes", "rough drawings of an entire cinema building", "written plans for serious historical epics"], "answer": 0, "explanations": ["comic sketches＝喜劇短段、短劇。", "sketch 此處不是建築草圖。", "也不是嚴肅史詩計畫。"], "tag": "主題搭配"}, {"id": "cinema-vocab-37", "mode": "vocab", "paragraph": "F", "sentence": "Early cinema programmes were a mixture of items, combining comic sketches, free-standing narratives, serial episodes and the occasional trick or animated film.", "target": "free-standing narratives", "options": ["stories that can be understood as independent items", "stories shown only to standing audiences", "episodes that cannot make sense without the next part"], "answer": 0, "explanations": ["free-standing＝獨立成篇的。", "不是觀眾必須站立。", "不是必須接下一集才懂。"], "tag": "主題搭配"}, {"id": "cinema-vocab-38", "mode": "vocab", "paragraph": "F", "sentence": "Early cinema programmes were a mixture of items, combining comic sketches, free-standing narratives, serial episodes and the occasional trick or animated film.", "target": "serial episodes", "options": ["parts of a continuing story shown in separate instalments", "unrelated news reports with no continuing story", "exact repeats of the same complete film"], "answer": 0, "explanations": ["serial episodes＝連續故事分集。", "不是無關新聞。", "不是整片重播。"], "tag": "主題搭配"}, {"id": "cinema-vocab-39", "mode": "vocab", "paragraph": "F", "sentence": "The making of cartoons became a separate branch of film-making, generally practised outside the major studios, and the same was true of serials.", "target": "branch", "options": ["a separate field or division of an activity", "a part of a tree used to build sets", "a financial loan to a film company"], "answer": 0, "explanations": ["branch of film-making＝電影製作的一個分支領域。", "不是樹枝。", "不是貸款。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-40", "mode": "vocab", "paragraph": "F", "sentence": "Together with newsreels, they tended to be shown as short items in a programme which led to the feature.", "target": "newsreels", "options": ["short filmed reports of current events", "newly released fictional epics", "advertisements for newspaper subscriptions only"], "answer": 0, "explanations": ["newsreels＝新聞短片。", "不是虛構史詩片。", "不只指報紙訂閱廣告。"], "tag": "主題字彙"}, {"id": "cinema-vocab-41", "mode": "vocab", "paragraph": "G", "sentence": "From early cinema, it was only American slapstick comedy that successfully developed in both short and feature format.", "target": "slapstick comedy", "options": ["comedy based on exaggerated physical actions and mishaps", "comedy consisting only of quiet wordplay", "factual films explaining the use of wooden tools"], "answer": 0, "explanations": ["slapstick comedy＝以誇張動作、碰撞等逗笑的鬧劇。", "不只靠文字雙關。", "不是工具紀錄片。"], "tag": "主題搭配"}, {"id": "cinema-vocab-42", "mode": "vocab", "paragraph": "G", "sentence": "However, during this ‘Silent Film’ era, animation, comedy, serials and dramatic features continued to thrive, along with factual films or documentaries, which acquired an increasing distinctiveness as the period progressed.", "target": "thrive", "options": ["develop successfully and flourish", "disappear completely", "remain unable to attract viewers"], "answer": 0, "explanations": ["thrive＝蓬勃發展。", "不是消失。", "不是持續無人看。"], "tag": "主題字彙"}, {"id": "cinema-vocab-43", "mode": "vocab", "paragraph": "G", "sentence": "However, during this ‘Silent Film’ era, animation, comedy, serials and dramatic features continued to thrive, along with factual films or documentaries, which acquired an increasing distinctiveness as the period progressed.", "target": "distinctiveness", "options": ["the quality of being recognizably different", "complete similarity to every other type", "the total number of copies sold"], "answer": 0, "explanations": ["distinctiveness＝獨特性、辨識特色。", "不是完全相同。", "不是銷量。"], "tag": "主題字彙"}, {"id": "cinema-vocab-44", "mode": "vocab", "paragraph": "G", "sentence": "It was also at this time that the avant-garde film first achieved commercial success, this time thanks almost exclusively to the French and the occasional German film.", "target": "avant-garde", "options": ["experimental and ahead of established artistic conventions", "strictly copying traditional popular formulas", "used only for military instruction"], "answer": 0, "explanations": ["avant-garde＝前衛的、實驗性的。", "不是完全照傳統公式。", "此處為藝術用法，不是軍事。"], "tag": "主題字彙"}, {"id": "cinema-vocab-45", "mode": "vocab", "paragraph": "G", "sentence": "It was also at this time that the avant-garde film first achieved commercial success, this time thanks almost exclusively to the French and the occasional German film.", "target": "almost exclusively", "options": ["nearly entirely", "in equal amounts from every source", "only in very rare exceptions"], "answer": 0, "explanations": ["almost exclusively＝幾乎完全由……。", "不是每個來源均分。", "不是僅少數例外。"], "tag": "限定搭配"}, {"id": "cinema-vocab-46", "mode": "vocab", "paragraph": "H", "sentence": "Of these, the French displayed the most continuity, in spite of the war and post-war economic uncertainties.", "target": "continuity", "options": ["an ongoing connection and consistency over time", "a complete break with the past", "the physical length of each film reel"], "answer": 0, "explanations": ["continuity＝延續性。", "不是完全斷裂。", "不是膠卷長度。"], "tag": "主題字彙"}, {"id": "cinema-vocab-47", "mode": "vocab", "paragraph": "H", "sentence": "The German cinema, relatively insignificant in the pre-war years, exploded on to the world scene after 1919.", "target": "exploded on to the world scene", "options": ["became internationally prominent very rapidly", "was destroyed in a real explosion", "quietly disappeared from international attention"], "answer": 0, "explanations": ["explode onto the scene＝迅速崛起、受到矚目。", "不是實際爆炸。", "不是淡出。"], "tag": "慣用表達"}, {"id": "cinema-vocab-48", "mode": "vocab", "paragraph": "H", "sentence": "Yet even they were both overshadowed by the Soviets after the 1917 Revolution.", "target": "overshadowed", "options": ["made less prominent by someone else’s greater success", "protected from sunlight in a studio", "considered more important than all others"], "answer": 0, "explanations": ["be overshadowed by＝因他者更突出而相形失色。", "不是擋陽光。", "不是自己最重要。"], "tag": "常見字語境義"}, {"id": "cinema-vocab-49", "mode": "vocab", "paragraph": "H", "sentence": "They turned their back on the past, leaving the style of the pre-war Russian cinema to the emigres who fled westwards to escape the Revolution.", "target": "turned their back on", "options": ["rejected or moved away from", "physically turned around to look at", "preserved as their only accepted approach"], "answer": 0, "explanations": ["turn one’s back on＝背棄、拋開。", "不是回頭看。", "不是只保留原有方式。"], "tag": "慣用表達"}, {"id": "cinema-vocab-50", "mode": "vocab", "paragraph": "H", "sentence": "They turned their back on the past, leaving the style of the pre-war Russian cinema to the emigres who fled westwards to escape the Revolution.", "target": "emigres", "options": ["people who left their own country to live elsewhere", "officials sent abroad to promote films temporarily", "people who never left their birthplace"], "answer": 0, "explanations": ["emigres＝移居海外者，常有政治因素。", "不是僅短期出差官員。", "不是未曾離鄉的人。"], "tag": "主題字彙"}, {"id": "cinema-vocab-51", "mode": "vocab", "paragraph": "I", "sentence": "The other countries whose cinemas changed dramatically are: Britain, which had an interesting but undistinguished history in the silent period; Italy, which had a brief moment of international fame just before the war; the Scandinavian countries, particularly Denmark, which played a role in the development of silent cinema quite out of proportion to their small population; and Japan, where a cinema developed based primarily on traditional theatrical and, to a lesser extent, other art forms and only gradually adapted to western influence.", "target": "undistinguished", "options": ["not especially outstanding", "internationally superior to every rival", "completely undocumented"], "answer": 0, "explanations": ["undistinguished＝並不傑出的；interesting but 表雖有趣卻不突出。", "不是世界第一。", "也不是沒有紀錄。"], "tag": "主題字彙"}, {"id": "cinema-vocab-52", "mode": "vocab", "paragraph": "I", "sentence": "The other countries whose cinemas changed dramatically are: Britain, which had an interesting but undistinguished history in the silent period; Italy, which had a brief moment of international fame just before the war; the Scandinavian countries, particularly Denmark, which played a role in the development of silent cinema quite out of proportion to their small population; and Japan, where a cinema developed based primarily on traditional theatrical and, to a lesser extent, other art forms and only gradually adapted to western influence.", "target": "out of proportion to", "options": ["far greater than would be expected from", "exactly equal in numerical size to", "unconnected in any possible way with"], "answer": 0, "explanations": ["貢獻相對人口小國而言大得不成比例。", "不是數字剛好相等。", "談的是相對比例，不是毫不相關。"], "tag": "主題搭配"}, {"id": "cinema-vocab-53", "mode": "vocab", "paragraph": "I", "sentence": "The other countries whose cinemas changed dramatically are: Britain, which had an interesting but undistinguished history in the silent period; Italy, which had a brief moment of international fame just before the war; the Scandinavian countries, particularly Denmark, which played a role in the development of silent cinema quite out of proportion to their small population; and Japan, where a cinema developed based primarily on traditional theatrical and, to a lesser extent, other art forms and only gradually adapted to western influence.", "target": "to a lesser extent", "options": ["to a smaller degree", "more importantly than everything else", "not in any way at all"], "answer": 0, "explanations": ["to a lesser extent＝程度較小地；other art forms 的影響較小。", "不是更重要。", "不是完全沒有。"], "tag": "限定搭配"}, {"id": "cinema-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Beginning as something unusual in a handful of big cities -- New York, London, Paris and Berlin -- the new medium quickly found its way across the world, attracting larger and larger audiences wherever it was shown and replacing other forms of entertainment as it did so.", "target": "", "options": ["Cinema spread from a few large cities to the wider world, drawing growing audiences and displacing other entertainment.", "Cinema remained in four cities because audiences elsewhere refused to watch it.", "Cinema began worldwide and later shrank to a few European cities."], "answer": 0, "explanations": ["Beginning 分詞片語描述 cinema 起點；attracting 與 replacing 描述擴散伴隨的現象。", "quickly found its way across the world 與未傳播相反。", "顛倒由少數城市到全球的方向。"], "tag": "長難句理解", "structure": "Beginning ... 的邏輯主詞為 the new medium；wherever 引導地點讓步子句；as it did so 承接傳播過程。"}, {"id": "cinema-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "As audiences grew, so did the places where films were shown, finishing up with the ‘great picture palaces’ of the 1920s, which rivalled, and occasionally superseded, theatres and music-houses in terms of opulence and splendour.", "target": "", "options": ["As cinema audiences increased, venues expanded too, eventually including luxurious picture palaces that could match or sometimes surpass older entertainment venues in grandeur.", "Cinema buildings stayed small even though audiences grew, and theatres were always more luxurious.", "Every theatre disappeared as soon as the first short film was shown."], "answer": 0, "explanations": ["so did 代替 grew；比較的是場所規模與奢華，occasionally 表有時超越。", "so did the places 明說場所也成長。", "不是所有劇院消失，也不是第一部片上映當下。"], "tag": "長難句理解", "structure": "As ... 表隨著；so + did + 主詞 是倒裝；which 修飾 picture palaces；rivalled 與 superseded 並列。"}, {"id": "cinema-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "Meanwhile, films themselves developed from being short ‘attractions’ only a couple of minutes long, to the full-length feature that has dominated the world’s screens up to the present day.", "target": "", "options": ["Films developed from very short attractions into full-length features, which became the dominant screen format.", "Full-length films came first and were then replaced by two-minute attractions.", "The phrase full-length feature refers to increasingly long newspaper articles."], "answer": 0, "explanations": ["from ... to ... 表電影形式發展方向。", "將起點與結果顛倒。", "全文為電影語境，非報刊專題。"], "tag": "長難句理解", "structure": "developed from being ... to ...；that has dominated 修飾 full-length feature；present day 依文章時間理解。"}, {"id": "cinema-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Although French, German, American and British pioneers have all been credited with the invention of cinema, the British and the Germans played a relatively small role in its worldwide exploitation.", "target": "", "options": ["Several national groups receive credit for inventing cinema, although Britain and Germany contributed less to its global commercial development.", "Only Britain and Germany are credited with inventing cinema and distributing it worldwide.", "France and America invented nothing but copied British films commercially."], "answer": 0, "explanations": ["分清發明貢獻與全球商業推廣的不同評價。", "French、American 也在列；small role 不是主導。", "原文沒有否定法美發明貢獻。"], "tag": "長難句理解", "structure": "Although 引導讓步；主句主詞 the British and the Germans；its 指 cinema；relatively 表相對程度。"}, {"id": "cinema-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "It was above all the French, followed closely by the Americans, who were the most passionate exporters of the new invention, helping to start cinema in China, Japan, Latin America and Russia.", "target": "", "options": ["France was the strongest exporter of early cinema, with America close behind, helping establish it in several other regions.", "America exported cinema first, while France played no role.", "China and Japan were the only countries exporting films to France."], "answer": 0, "explanations": ["above all 突出法國；followed closely 表美國緊隨。", "法國為主要推廣者，不是沒貢獻。", "把接受推廣的地區與輸出者對調。"], "tag": "長難句理解", "structure": "It was ... who ... 是強調句；followed closely by ... 修飾 French；helping ... 為分詞補充貢獻。"}, {"id": "cinema-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "In terms of artistic development it was again the French and the Americans who took the lead, though in the years before the First World War, Italy, Denmark and Russia also played a part.", "target": "", "options": ["France and America led artistic development, but Italy, Denmark and Russia also contributed before the First World War.", "France and America were the only countries with any artistic contribution at any time.", "Italy, Denmark and Russia took the artistic lead only after the Second World War."], "answer": 0, "explanations": ["took the lead 不排除別國貢獻；though 提出補充讓步。", "also played a part 否定只有兩國。", "原文是第一次大戰前。"], "tag": "長難句理解", "structure": "it was ... who ... 強調領先國家；though 子句保留其他國家與時間限制。"}, {"id": "cinema-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "By protecting its own market and pursuing a vigorous export policy, the Americans achieved a dominant position on the world market by the start of the First World War.", "target": "", "options": ["America secured a leading global position by protecting its home market and strongly promoting exports by the start of the First World War.", "America gained dominance only by closing itself to all exports after the First World War.", "America’s export policy was weak, so it never became commercially important."], "answer": 0, "explanations": ["By + V-ing 表方法，第二個 by 表截止時間。", "有 vigorous export policy，不是禁出口；時間也錯。", "vigorous 與 achieved dominant position 均相反。"], "tag": "長難句理解", "structure": "By protecting ... and pursuing ... 是並列方法；by the start ... 是時間界線，兩個 by 用法不同。"}, {"id": "cinema-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "The centre of film-making had moved westwards, to Hollywood, and it was films from these new Hollywood studios that flooded onto the world’s film markets in the years after the First World War, and have done so ever since.", "target": "", "options": ["After production shifted to Hollywood, films from its studios entered world markets in large numbers after the war and continued to do so.", "Hollywood became important only because its studios refused to sell abroad.", "Flooding destroyed Hollywood’s studios and ended American exports."], "answer": 0, "explanations": ["flooded onto 指大量湧入市場；have done so 表持續。", "與全球市場大量流通相反。", "flood 是比喻，不是水災。"], "tag": "長難句理解", "structure": "had moved 表較早的轉移；it was films ... that ... 是強調句；have done so 代替 flooded onto markets。"}, {"id": "cinema-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "Faced with total Hollywood domination, few film industries proved competitive.", "target": "", "options": ["Most film industries struggled to compete against Hollywood’s dominant position.", "Almost every film industry easily defeated Hollywood.", "No other country made films at all after Hollywood expanded."], "answer": 0, "explanations": ["few 表能競爭者很少，換成 most struggled。", "few 誤讀成多數。", "不能競爭不等於完全停止製片。"], "tag": "長難句理解", "structure": "Faced with ... 是被動分詞片語，主詞為 film industries；few 帶否定數量義；proved competitive＝顯示有競爭力。"}, {"id": "cinema-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "The Italian cinema, which had pioneered the feature film with spectacular films like Quo vadis? (1913) and Cabiria (1914), almost collapsed.", "target": "", "options": ["Italy nearly collapsed as a film industry despite having helped pioneer feature films with major earlier productions.", "Italy had never produced a feature film before Hollywood became dominant.", "Italy collapsed completely before any of its named films were made."], "answer": 0, "explanations": ["which 子句提供早期成就；almost collapsed 是幾近崩潰。", "had pioneered 明說先驅地位。", "almost 不等於完全，時間也非命名前。"], "tag": "長難句理解", "structure": "which had pioneered ... 為非限定關係子句；主句動詞 almost collapsed；過去完成式指出先前成就。"}, {"id": "cinema-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Hollywood films appealed because they had better-constructed narratives, their special effects were more impressive, and the star system added a new dimension to screen acting.", "target": "", "options": ["Hollywood attracted audiences through stronger storytelling, impressive effects and a star system that enriched screen acting.", "Hollywood’s appeal depended entirely on low ticket prices and had nothing to do with its films.", "The star system was a method of filming astronomy, replacing stories and actors."], "answer": 0, "explanations": ["because 後列三種吸引力。", "票價不在這句列出的原因中。", "star system 為明星制度，不是天文。"], "tag": "長難句理解", "structure": "because 引出原因；had、were、added 三個謂語分別對應 narratives、effects、star system。"}, {"id": "cinema-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "If Hollywood did not have enough of its own resources, it had a great deal of money to buy up artists and technical innovations from Europe to ensure its continued dominance over present or future competition.", "target": "", "options": ["When Hollywood lacked resources, it could use its wealth to acquire European talent and technology and protect its lead.", "Hollywood had no money to obtain European talent when it lacked resources.", "European artists were always acquired without payment because Hollywood had no competitors."], "answer": 0, "explanations": ["條件是本身資源不足；money to buy up 說明因應能力。", "had a great deal of money 與沒錢相反。", "buy up 是付費取得；competition 也明列。"], "tag": "長難句理解", "structure": "If 引導一般過去情況的條件，不能只見 did 就當與事實相反；to buy up 說明資金用途；to ensure 表目的。"}, {"id": "cinema-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "The rest of the world survived partly by learning from Hollywood and partly because audiences continued to exist for a product which corresponded to needs which Hollywood could not supply.", "target": "", "options": ["Other film industries survived both by learning from Hollywood and by serving audience needs Hollywood did not meet.", "Foreign industries survived only by copying Hollywood exactly for the same audiences.", "Hollywood supplied every audience need, leaving no reason for other industries to exist."], "answer": 0, "explanations": ["partly ... partly ... 明列兩個生存因素。", "忽略第二項未被滿足的需求。", "could not supply 明說有需求未滿足。"], "tag": "長難句理解", "structure": "partly by ... and partly because ... 並列不同結構；兩個 which 分別修飾 product、needs；could not supply 保留否定。"}, {"id": "cinema-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "As well as popular audiences, there were also increasing audiences for films which were artistically more adventurous or which dealt with the issues in the outer world.", "target": "", "options": ["Alongside mainstream audiences, growing numbers wanted films that experimented artistically or explored real-world issues.", "All audiences abandoned popular entertainment and watched only documentaries.", "Adventurous films meant only travel stories, with no concern for artistic methods."], "answer": 0, "explanations": ["as well as 表兩類並存；or 列兩類特徵。", "不是所有觀眾都轉向，也不只紀錄片。", "artistically 表藝術表現層面。"], "tag": "長難句理解", "structure": "there were ... 是存在句；which ... or which ... 並列修飾 films；As well as 表除……之外也。"}, {"id": "cinema-paraphrase-15", "mode": "paraphrase", "paragraph": "F", "sentence": "None of this would have happened without technology, and cinema is in fact unique as an art form.", "target": "", "options": ["Technology was essential to the developments described, and cinema is presented as a distinctive art form.", "All these developments would have happened exactly the same way without technology.", "The writer says technology made cinema cease to be an art form."], "answer": 0, "explanations": ["None ... without 是否定搭配，表技術不可或缺。", "忽略 None 與 without 的範圍。", "unique as an art form 仍將電影視為藝術。"], "tag": "長難句理解", "structure": "would have happened 是過去假設結果；without technology 相當於假設沒有科技；None 對 this 全體作否定。"}, {"id": "cinema-paraphrase-16", "mode": "paraphrase", "paragraph": "F", "sentence": "The making of cartoons became a separate branch of film-making, generally practised outside the major studios, and the same was true of serials.", "target": "", "options": ["Cartoons and serials became separate production fields, generally outside major studios.", "Cartoons alone were made outside major studios, while serials were always made inside them.", "Every cartoon was produced by the largest studios and no independent production existed."], "answer": 0, "explanations": ["the same was true 將前述情況也套用於 serials；generally 非絕對。", "忽略 same 對 serials 的回指。", "outside 與此選項相反，且原文不作 every 絕對化。"], "tag": "長難句理解", "structure": "The making of cartoons 是動名詞主詞；generally practised ... 修飾製作活動；the same 代指前面整體情況。"}, {"id": "cinema-paraphrase-17", "mode": "paraphrase", "paragraph": "G", "sentence": "From early cinema, it was only American slapstick comedy that successfully developed in both short and feature format.", "target": "", "options": ["According to the passage, American slapstick was the only early form that developed successfully in both short and feature formats.", "All early film forms developed equally well in short and feature formats.", "American slapstick succeeded only as a feature and never as a short."], "answer": 0, "explanations": ["only 限定類型，both 限定兩種片長。", "忽略 only。", "忽略 both。"], "tag": "長難句理解", "structure": "it was only ... that ... 是強調句；both A and B 表兩種格式均包含。"}, {"id": "cinema-paraphrase-18", "mode": "paraphrase", "paragraph": "G", "sentence": "It was also at this time that the avant-garde film first achieved commercial success, this time thanks almost exclusively to the French and the occasional German film.", "target": "", "options": ["Avant-garde films first became commercially successful in this period, largely because of French films with some German contribution.", "Avant-garde films had no commercial success until every country contributed equally.", "Only German films were responsible; French cinema was excluded."], "answer": 0, "explanations": ["almost exclusively 與 occasional 保留貢獻比例。", "原文說 first achieved success，來源也非平均。", "主要是法國，偶有德國。"], "tag": "長難句理解", "structure": "It was ... that ... 強調時間；thanks ... to 表歸因；almost exclusively 非毫無例外。"}, {"id": "cinema-paraphrase-19", "mode": "paraphrase", "paragraph": "H", "sentence": "They turned their back on the past, leaving the style of the pre-war Russian cinema to the emigres who fled westwards to escape the Revolution.", "target": "", "options": ["Soviet filmmakers rejected the earlier Russian style, which continued with emigrants who had gone west to escape the Revolution.", "The emigrants moved west in order to preserve the Soviet rejection of every old style.", "Soviet filmmakers kept only the pre-war Russian style and never changed direction."], "answer": 0, "explanations": ["They 承接 Soviets；leaving 舊風格給西遷者延續。", "to escape 說明逃避革命；舊風格與新蘇維埃方向不同。", "turned their back on 表拋開過去。"], "tag": "長難句理解", "structure": "They 指前句 Soviets；leaving 為結果分詞；who fled ... 修飾 emigres；to escape 表目的。"}, {"id": "cinema-paraphrase-20", "mode": "paraphrase", "paragraph": "I", "sentence": "The other countries whose cinemas changed dramatically are: Britain, which had an interesting but undistinguished history in the silent period; Italy, which had a brief moment of international fame just before the war; the Scandinavian countries, particularly Denmark, which played a role in the development of silent cinema quite out of proportion to their small population; and Japan, where a cinema developed based primarily on traditional theatrical and, to a lesser extent, other art forms and only gradually adapted to western influence.", "target": "", "options": ["The passage contrasts several national histories: Denmark contributed greatly relative to its population, while Japan developed mainly from traditional theatre and adapted gradually to Western influence.", "Denmark’s contribution was minor simply because its population was small, and Japan immediately copied only Western cinema.", "Britain, Italy, Denmark and Japan all had identical cinematic histories."], "answer": 0, "explanations": ["分號分列不同國家；日本主要與次要藝術來源及 gradual 都保留。", "out of proportion 表貢獻相對大；only gradually 不是立即。", "列出的是不同發展歷史。"], "tag": "長難句理解", "structure": "冒號後以分號列國家；which／where 各接關係子句；primarily 與 to a lesser extent 表來源比重；only gradually 限定適應速度。"}, {"id": "origin-cinema-qv2-1", "mode": "questionVocab", "paragraph": "", "sentence": "Which THREE possible reasons for American dominance of the film industry are given in the text?", "target": "dominance", "options": ["主導、支配地位", "短暫參與但不占優勢", "由多方平分的影響力"], "answer": 0, "explanations": ["dominance 指相對其他競爭者具有強大優勢。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不只是短期參與。", "也不是勢均力敵。"], "tag": "題目字彙", "source": "Question 1–3 · 題目用語"}, {"id": "origin-cinema-qv2-2", "mode": "questionVocab", "paragraph": "", "sentence": "plenty of capital to purchase what it didn’t have", "target": "capital", "options": ["資金、資本", "電影產業所在的首都", "公司收到的全部營業收入"], "answer": 0, "explanations": ["有 capital to purchase 指可用來購買的資金。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是首都。", "資本不等於全部營業收入。"], "tag": "題目字彙", "source": "Question 1–3 A · 題目用語"}, {"id": "origin-cinema-qv2-3", "mode": "questionVocab", "paragraph": "", "sentence": "mak
