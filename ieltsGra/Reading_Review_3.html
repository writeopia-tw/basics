透露。", "暗示不等於確證。", "不是拒絕。"], "tag": "主題搭配"}, {"id": "voynich-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "Catalogued as MS 408, the manuscript would attract little attention were it not for the fact that the drawings hint at esoteric knowledge, while the text seems to be some sort of code — one that no-one has been able to break.", "target": "esoteric", "options": ["understood by only a small group with special knowledge", "obvious to absolutely everyone", "concerned only with public entertainment"], "answer": 0, "explanations": ["esoteric＝深奧、僅少數內行理解的。", "不是人人都懂。", "不只指大眾娛樂。"], "tag": "主題字彙"}, {"id": "voynich-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "Catalogued as MS 408, the manuscript would attract little attention were it not for the fact that the drawings hint at esoteric knowledge, while the text seems to be some sort of code — one that no-one has been able to break.", "target": "break", "options": ["decode or solve", "tear the pages physically", "stop a clock from working"], "answer": 0, "explanations": ["break a code＝破解密碼。", "不是撕破手稿。", "不是弄壞時鐘。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-10", "mode": "vocab", "paragraph": "A", "sentence": "It is known to scholars as the Voynich manuscript, after the American book-dealer Wilfrid Voynich, who bought the manuscript from a Jesuit college in Italy in 1912.", "target": "after", "options": ["in honour of or taking the name of", "later in time than the person’s death necessarily", "in pursuit of someone physically"], "answer": 0, "explanations": ["named／known ... after someone＝以某人的名字命名。", "after 此處不是必然在人死後。", "不是追趕。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-11", "mode": "vocab", "paragraph": "A", "sentence": "Over the years, the manuscript has attracted the attention of everyone from amateur dabblers to top code-breakers, all determined to succeed where countless others have failed.", "target": "dabblers", "options": ["people who take a casual, non-expert interest in an activity", "people who have the highest professional qualifications", "people who intentionally destroy manuscripts"], "answer": 0, "explanations": ["dabblers＝淺嘗、涉獵某事者。", "與 top code-breakers 相對，不是頂尖專家。", "不是破壞者。"], "tag": "主題字彙"}, {"id": "voynich-vocab-12", "mode": "vocab", "paragraph": "A", "sentence": "Academic research papers, books and websites are devoted to making sense of the contents of the manuscript, which are freely available to all.", "target": "devoted to", "options": ["dedicated to or focused on", "prevented from taking part in", "unrelated to"], "answer": 0, "explanations": ["be devoted to making sense of＝致力於弄懂。", "不是被阻止參與。", "不是毫無關係。"], "tag": "主題搭配"}, {"id": "voynich-vocab-13", "mode": "vocab", "paragraph": "A", "sentence": "Academic research papers, books and websites are devoted to making sense of the contents of the manuscript, which are freely available to all.", "target": "making sense of", "options": ["understanding or finding meaning in", "inventing a new false history for", "making the pages look more attractive"], "answer": 0, "explanations": ["make sense of＝理解、理清。", "不是造假歷史。", "不是美化外觀。"], "tag": "慣用表達"}, {"id": "voynich-vocab-14", "mode": "vocab", "paragraph": "A", "sentence": "“Most other mysteries involve second-hand reports,” says Dr Gordon Rugg of Keele University, a leading Voynich expert.", "target": "second-hand reports", "options": ["accounts received through other people rather than direct experience", "reports printed on previously used paper", "books bought cheaply after another owner used them"], "answer": 0, "explanations": ["second-hand reports＝間接、轉述的報告。", "不是印在二手紙上。", "也不是二手書的交易意思。"], "tag": "主題搭配"}, {"id": "voynich-vocab-15", "mode": "vocab", "paragraph": "B", "sentence": "It is certainly strange: page after page of drawings of weird plants, astrological symbolism and human figures, accompanied by a script that looks like some form of shorthand.", "target": "script", "options": ["a system or style of written characters", "the instructions for actors in a play", "a computer program controlling the library"], "answer": 0, "explanations": ["script 在此為文字字形、書寫系統。", "不是演員劇本。", "不是電腦腳本。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-16", "mode": "vocab", "paragraph": "B", "sentence": "It is certainly strange: page after page of drawings of weird plants, astrological symbolism and human figures, accompanied by a script that looks like some form of shorthand.", "target": "shorthand", "options": ["a system of writing using abbreviated signs", "writing made only with the left hand", "a book small enough to fit in one hand"], "answer": 0, "explanations": ["shorthand＝速記，以簡化符號書寫。", "不是左手寫字。", "不是小書本。"], "tag": "主題字彙"}, {"id": "voynich-vocab-17", "mode": "vocab", "paragraph": "B", "sentence": "Voynich himself believed that the manuscript was the work of the 13th-century English monk Roger Bacon, famed for his knowledge of alchemy, philosophy and science.", "target": "alchemy", "options": ["an old practice seeking to transform substances, including base metals into gold", "modern computer programming", "the study only of grammar in written language"], "answer": 0, "explanations": ["alchemy＝煉金術。", "不是程式設計。", "不是只研究語法。"], "tag": "主題字彙"}, {"id": "voynich-vocab-18", "mode": "vocab", "paragraph": "B", "sentence": "In 1921 Voynich's view that Bacon was the writer appeared to win support from the work of William Newbold, Professor of Philosophy at the University of Pennsylvania, who claimed to have found the key to the cipher system used by Bacon.", "target": "the key", "options": ["the information or method needed to decode a system", "the physical object needed to unlock the library door", "the most expensive page in a manuscript"], "answer": 0, "explanations": ["key to the cipher＝解密關鍵、方法。", "不是門鑰匙。", "不是最貴的頁面。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-19", "mode": "vocab", "paragraph": "B", "sentence": "In 1921 Voynich's view that Bacon was the writer appeared to win support from the work of William Newbold, Professor of Philosophy at the University of Pennsylvania, who claimed to have found the key to the cipher system used by Bacon.", "target": "cipher", "options": ["a system for writing information in code", "a microscope used to observe cells", "a drawing with no written symbols"], "answer": 0, "explanations": ["cipher＝密碼、加密系統。", "不是顯微鏡。", "不是沒有符號的圖畫。"], "tag": "主題字彙"}, {"id": "voynich-vocab-20", "mode": "vocab", "paragraph": "B", "sentence": "According to Newbold, the manuscript proved that Bacon had access to a microscope centuries before they were supposedly first invented.", "target": "supposedly", "options": ["according to what is generally believed or claimed", "with absolute proof supplied by the writer", "against what every source has ever claimed"], "answer": 0, "explanations": ["supposedly＝據說、一般認為；作者未把說法當絕對定論。", "不是絕對確證語氣。", "不是所有來源都反對。"], "tag": "證據與語氣"}, {"id": "voynich-vocab-21", "mode": "vocab", "paragraph": "B", "sentence": "The claim that this medieval monk had observed living cells created a sensation.", "target": "created a sensation", "options": ["caused widespread excitement or strong public interest", "gave a person a physical feeling in the skin", "quietly passed without anyone noticing"], "answer": 0, "explanations": ["create a sensation＝引起轟動。", "不是身體觸覺。", "不是無人注意。"], "tag": "慣用表達"}, {"id": "voynich-vocab-22", "mode": "vocab", "paragraph": "B", "sentence": "It soon became clear, however, that Newbold had fallen victim to wishful thinking.", "target": "fallen victim to", "options": ["been misled or harmed by", "successfully proved the truth of", "been employed professionally by"], "answer": 0, "explanations": ["fall victim to＝受……所害、被……誤導。", "不是成功證實。", "不是受僱。"], "tag": "主題搭配"}, {"id": "voynich-vocab-23", "mode": "vocab", "paragraph": "B", "sentence": "It soon became clear, however, that Newbold had fallen victim to wishful thinking.", "target": "wishful thinking", "options": ["believing something because one wants it to be true rather than because of sound evidence", "careful reasoning based only on verified evidence", "a deliberate public promise to make no mistakes"], "answer": 0, "explanations": ["wishful thinking＝一廂情願，把希望當事實。", "與只憑可靠證據推理不同。", "不是公開保證。"], "tag": "主題搭配"}, {"id": "voynich-vocab-24", "mode": "vocab", "paragraph": "B", "sentence": "Other scholars showed that his “decoding” methods produced a host of possible interpretations.", "target": "a host of", "options": ["a large number of", "one person welcoming guests", "the original owner of"], "answer": 0, "explanations": ["a host of＝大量、許多。", "不是主人。", "不是原持有人。"], "tag": "慣用表達"}, {"id": "voynich-vocab-25", "mode": "vocab", "paragraph": "B", "sentence": "Other scholars showed that his “decoding” methods produced a host of possible interpretations.", "target": "interpretations", "options": ["possible explanations of meaning", "physical repairs made to damaged pages", "the number of copies printed"], "answer": 0, "explanations": ["interpretations＝詮釋、解讀。", "不是修復。", "不是印量。"], "tag": "主題字彙"}, {"id": "voynich-vocab-26", "mode": "vocab", "paragraph": "C", "sentence": "The Voynich manuscript has continued to defy the efforts of world-class experts.", "target": "defy", "options": ["resist or frustrate", "confirm and support", "obey completely"], "answer": 0, "explanations": ["defy the efforts＝使努力仍無法奏效，難倒專家。", "不是證實。", "不是服從。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-27", "mode": "vocab", "paragraph": "C", "sentence": "In 1944, a team was assembled to tackle the mystery, led by William Friedman, the renowned American code breaker.", "target": "assembled", "options": ["brought together into a group", "taken apart into pieces", "sent away to stop research"], "answer": 0, "explanations": ["a team was assembled＝團隊被組成、召集。", "不是拆散。", "不是遣散停止研究。"], "tag": "主題字彙"}, {"id": "voynich-vocab-28", "mode": "vocab", "paragraph": "C", "sentence": "In 1944, a team was assembled to tackle the mystery, led by William Friedman, the renowned American code breaker.", "target": "tackle", "options": ["try to deal with or solve", "physically pull a person to the ground", "avoid thinking about"], "answer": 0, "explanations": ["tackle the mystery＝著手解決謎團。", "不是運動撲倒。", "不是避開。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-29", "mode": "vocab", "paragraph": "C", "sentence": "They began with the most basic code-breaking task: analysing the relative frequencies of the characters making up the text, looking for signs of an underlying structure.", "target": "relative frequencies", "options": ["how often different symbols occur compared with one another", "the sound pitches heard when reading aloud", "the number of relatives each author had"], "answer": 0, "explanations": ["relative frequencies＝相對出現頻率。", "不是聲音頻率。", "relative 在此不是親屬。"], "tag": "主題搭配"}, {"id": "voynich-vocab-30", "mode": "vocab", "paragraph": "C", "sentence": "They began with the most basic code-breaking task: analysing the relative frequencies of the characters making up the text, looking for signs of an underlying structure.", "target": "characters", "options": ["written symbols or letters", "people appearing in a story", "a writer’s moral qualities"], "answer": 0, "explanations": ["characters making up the text＝構成文字的字元。", "不是故事人物。", "不是人格。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-31", "mode": "vocab", "paragraph": "C", "sentence": "They began with the most basic code-breaking task: analysing the relative frequencies of the characters making up the text, looking for signs of an underlying structure.", "target": "underlying structure", "options": ["an organizing pattern beneath the surface appearance", "the wooden shelf beneath a book", "a decorative cover placed over the text"], "answer": 0, "explanations": ["underlying structure＝潛在、底層的結構規律。", "不是書架。", "不是表面裝飾。"], "tag": "主題搭配"}, {"id": "voynich-vocab-32", "mode": "vocab", "paragraph": "C", "sentence": "Yet Friedman's team soon found themselves in deep water.", "target": "in deep water", "options": ["in serious difficulty", "physically submerged in a deep river", "already certain of success"], "answer": 0, "explanations": ["in deep water＝陷入困境。", "不是泡在水中。", "不是確信成功。"], "tag": "慣用表達"}, {"id": "voynich-vocab-33", "mode": "vocab", "paragraph": "C", "sentence": "The precise size of the “alphabet” of the Voynich manuscript was unclear: it is possible to make out more than 70 distinct symbols among the 170,000-character text.", "target": "make out", "options": ["identify or distinguish with some effort", "invent deliberately false information", "fill in an application form"], "answer": 0, "explanations": ["make out symbols＝辨認符號。", "不是 make up 編造。", "不是填表。"], "tag": "Phrasal verb"}, {"id": "voynich-vocab-34", "mode": "vocab", "paragraph": "C", "sentence": "The precise size of the “alphabet” of the Voynich manuscript was unclear: it is possible to make out more than 70 distinct symbols among the 170,000-character text.", "target": "distinct", "options": ["clearly different or separate", "unclear and impossible to distinguish", "identical in every respect"], "answer": 0, "explanations": ["distinct symbols＝不同、可區分的符號。", "不是分辨不清。", "不是完全相同。"], "tag": "主題字彙"}, {"id": "voynich-vocab-35", "mode": "vocab", "paragraph": "C", "sentence": "Furthermore, Friedman discovered that some words and phrases appeared more often than expected in a standard language, casting doubt on claims that the manuscript concealed a real language, as encryption typically reduces word frequencies.", "target": "casting doubt on", "options": ["making a claim seem less certain or credible", "proving a claim beyond doubt", "deliberately ignoring a claim completely"], "answer": 0, "explanations": ["cast doubt on＝使人懷疑。", "不是確證。", "不是完全忽略，反而是在評估可信度。"], "tag": "主題搭配"}, {"id": "voynich-vocab-36", "mode": "vocab", "paragraph": "C", "sentence": "Furthermore, Friedman discovered that some words and phrases appeared more often than expected in a standard language, casting doubt on claims that the manuscript concealed a real language, as encryption typically reduces word frequencies.", "target": "concealed", "options": ["hid or contained beneath the surface", "openly translated into a modern language", "proved the non-existence of"], "answer": 0, "explanations": ["concealed a real language＝隱藏著真實語言。", "不是已公開翻譯。", "不是證明不存在。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-37", "mode": "vocab", "paragraph": "C", "sentence": "Furthermore, Friedman discovered that some words and phrases appeared more often than expected in a standard language, casting doubt on claims that the manuscript concealed a real language, as encryption typically reduces word frequencies.", "target": "encryption", "options": ["the process of converting information into code", "the physical printing of a page", "the direct translation of a text into plain English"], "answer": 0, "explanations": ["encryption＝加密。", "不是印刷。", "不是解碼成明文。"], "tag": "主題字彙"}, {"id": "voynich-vocab-38", "mode": "vocab", "paragraph": "C", "sentence": "Friedman concluded that the most plausible resolution of this paradox was that “Voynichese” is some sort of specially created artificial language, whose words are devised from concepts rather than linguistics.", "target": "plausible", "options": ["reasonable or believable given the evidence", "certainly proved with no remaining doubt", "impossible under any circumstances"], "answer": 0, "explanations": ["plausible＝合理、可信的；most plausible 仍不等於證明。", "合理不表示完全確定。", "不是不可能。"], "tag": "證據與語氣"}, {"id": "voynich-vocab-39", "mode": "vocab", "paragraph": "C", "sentence": "Friedman concluded that the most plausible resolution of this paradox was that “Voynichese” is some sort of specially created artificial language, whose words are devised from concepts rather than linguistics.", "target": "paradox", "options": ["an apparent contradiction or puzzling inconsistency", "a complete solution accepted by everyone", "a simple list of unrelated facts"], "answer": 0, "explanations": ["paradox＝悖論、表面矛盾的難題。", "不是已公認的解答。", "不是無關事實清單。"], "tag": "主題字彙"}, {"id": "voynich-vocab-40", "mode": "vocab", "paragraph": "C", "sentence": "Friedman concluded that the most plausible resolution of this paradox was that “Voynichese” is some sort of specially created artificial language, whose words are devised from concepts rather than linguistics.", "target": "devised", "options": ["created or designed deliberately", "found unchanged in nature", "copied by accident without any plan"], "answer": 0, "explanations": ["devise＝設計、構想出。", "不是自然存在未經設計。", "不是偶然抄到。"], "tag": "主題字彙"}, {"id": "voynich-vocab-41", "mode": "vocab", "paragraph": "C", "sentence": "“Friedman's hypothesis commands respect because of the lifetime of cryptanalytic expertise he brought to bear,” says Rob Churchill, co-author of The Voynich Manuscript.", "target": "commands respect", "options": ["deserves or attracts serious consideration", "orders everyone to agree unquestioningly", "proves all competing ideas false"], "answer": 0, "explanations": ["command respect＝令人敬重、值得重視。", "受重視不等於強迫認同。", "也不是已駁倒所有其他說法。"], "tag": "主題搭配"}, {"id": "voynich-vocab-42", "mode": "vocab", "paragraph": "C", "sentence": "“Friedman's hypothesis commands respect because of the lifetime of cryptanalytic expertise he brought to bear,” says Rob Churchill, co-author of The Voynich Manuscript.", "target": "brought to bear", "options": ["applied to dealing with a problem", "physically carried towards an animal", "discarded as irrelevant"], "answer": 0, "explanations": ["bring expertise to bear＝運用專業知識處理問題。", "bear 不是熊的意思。", "不是捨棄。"], "tag": "慣用表達"}, {"id": "voynich-vocab-43", "mode": "vocab", "paragraph": "C", "sentence": "“It does little to advance our understanding of the manuscript as a whole,” says Churchill.", "target": "advance", "options": ["improve or move forward", "pay for before delivery", "move an object physically towards a door"], "answer": 0, "explanations": ["advance our understanding＝增進理解；does little to 表幫助有限。", "不是預付款。", "不是搬物品。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-44", "mode": "vocab", "paragraph": "D", "sentence": "Even though Friedman was working more than 60 years ago, he suspected that major insights would come from using the device that had already transformed code-breaking: the computer.", "target": "insights", "options": ["deep or useful understandings", "the physical ability to see small print", "guaranteed final solutions to every question"], "answer": 0, "explanations": ["insights＝深入理解、洞見。", "不是視力。", "有洞見不代表所有問題已解。"], "tag": "主題字彙"}, {"id": "voynich-vocab-45", "mode": "vocab", "paragraph": "D", "sentence": "The insights so far have been perplexing.", "target": "perplexing", "options": ["confusing or difficult to understand", "completely obvious", "deliberately harmful to the book"], "answer": 0, "explanations": ["perplexing＝令人困惑的。", "不是顯而易見。", "不是損害書本。"], "tag": "主題字彙"}, {"id": "voynich-vocab-46", "mode": "vocab", "paragraph": "D", "sentence": "For example, in 2001 another leading Voynich scholar, Dr Gabriel Landini of Birmingham University in the UK, published the results of his study of the manuscript using a pattern-detecting method called spectral analysis.", "target": "spectral analysis", "options": ["a method of analysis used here to detect patterns in the text", "a translation system that supplies the author’s exact name", "a method relying only on judging the colour of the cover"], "answer": 0, "explanations": ["spectral analysis＝頻譜分析；本句明說其用於偵測規律。", "未說它直接提供作者名字。", "不是只看書皮顏色。"], "tag": "主題搭配"}, {"id": "voynich-vocab-47", "mode": "vocab", "paragraph": "D", "sentence": "This revealed evidence that the manuscript contains genuine words, rather than random nonsense, consistent with the existence of some underlying natural language.", "target": "genuine", "options": ["real rather than merely apparent or fabricated", "expensive because of attractive decoration", "certainly written by Roger Bacon"], "answer": 0, "explanations": ["genuine words＝真實、有語言意義的詞。", "不是裝飾價格。", "genuine 不指定作者。"], "tag": "主題字彙"}, {"id": "voynich-vocab-48", "mode": "vocab", "paragraph": "D", "sentence": "This revealed evidence that the manuscript contains genuine words, rather than random nonsense, consistent with the existence of some underlying natural language.", "target": "random nonsense", "options": ["meaningless material arranged without a meaningful pattern", "a fully understood natural language", "a text whose writer is definitely known"], "answer": 0, "explanations": ["random nonsense＝隨機、無意義的內容。", "不是已完全理解的自然語言。", "不關乎作者已知與否。"], "tag": "主題搭配"}, {"id": "voynich-vocab-49", "mode": "vocab", "paragraph": "D", "sentence": "This revealed evidence that the manuscript contains genuine words, rather than random nonsense, consistent with the existence of some underlying natural language.", "target": "consistent with", "options": ["compatible with or in agreement with", "conclusive proof of and the only possible explanation for", "in direct contradiction to"], "answer": 0, "explanations": ["consistent with＝與……相符、相容，仍可能有別種解釋。", "相符不等於唯一解或確證。", "不是相矛盾。"], "tag": "證據與語氣"}, {"id": "voynich-vocab-50", "mode": "vocab", "paragraph": "D", "sentence": "Yet the following year, Voynich expert René Zandbergen of the European Space Agency in Darmstadt, Germany, showed that the entropy of the text (a measure of the rate of transfer of information) was consistent with Friedman's suspicions that an artificial language had been used.", "target": "entropy", "options": ["a statistical measure related here to the transfer of information", "the physical age of the manuscript’s skin pages", "the exact number of illustrations in the book"], "answer": 0, "explanations": ["entropy＝熵；原文括號將它說明為與資訊傳遞速率相關的量。", "不是獸皮年代。", "不是圖畫數目。"], "tag": "主題字彙"}, {"id": "voynich-vocab-51", "mode": "vocab", "paragraph": "E", "sentence": "Many are convinced that the Voynich manuscript is not a hoax.", "target": "hoax", "options": ["a deliberate fabrication intended to deceive", "an accidental printing error", "a completely verified historical account"], "answer": 0, "explanations": ["hoax＝刻意設計的騙局、偽作。", "不是無心印錯。", "不是已核實史實。"], "tag": "主題字彙"}, {"id": "voynich-vocab-52", "mode": "vocab", "paragraph": "E", "sentence": "For how could a medieval hoaxer create so many tell-tale signs of a message from random nonsense?", "target": "tell-tale signs", "options": ["clues that reveal or suggest something otherwise hidden", "stories told aloud for entertainment", "instructions that directly give a complete translation"], "answer": 0, "explanations": ["tell-tale signs＝洩露內情的徵兆、線索。", "不是說故事。", "不是完整翻譯。"], "tag": "主題搭配"}, {"id": "voynich-vocab-53", "mode": "vocab", "paragraph": "E", "sentence": "Using a system first published by the Italian mathematician Girolamo Cardano in 1550, in which a specially constructed grille is used to pick out symbols from a table, Rugg found he could rapidly generate text with many of the basic traits of the Voynich manuscript.", "target": "grille", "options": ["a frame or screen with openings used to select parts of a table", "a cooking tool used to roast meat", "a dictionary giving every coded word’s meaning"], "answer": 0, "explanations": ["grille 指帶孔格柵、模板，本句用以挑出表中符號。", "不是 grill 烤架的用法。", "不是已完成的字典。"], "tag": "主題字彙"}, {"id": "voynich-vocab-54", "mode": "vocab", "paragraph": "E", "sentence": "Using a system first published by the Italian mathematician Girolamo Cardano in 1550, in which a specially constructed grille is used to pick out symbols from a table, Rugg found he could rapidly generate text with many of the basic traits of the Voynich manuscript.", "target": "pick out", "options": ["select or identify", "remove every possible meaning from", "write down without making any selection"], "answer": 0, "explanations": ["pick out symbols＝選出符號。", "不是清除所有意思。", "不是毫無挑選地抄寫。"], "tag": "Phrasal verb"}, {"id": "voynich-vocab-55", "mode": "vocab", "paragraph": "E", "sentence": "Using a system first published by the Italian mathematician Girolamo Cardano in 1550, in which a specially constructed grille is used to pick out symbols from a table, Rugg found he could rapidly generate text with many of the basic traits of the Voynich manuscript.", "target": "traits", "options": ["characteristic features", "the exact identity of an author", "the legal ownership of a book"], "answer": 0, "explanations": ["traits＝特徵；相似特徵不保證來源相同。", "不是作者身分。", "不是所有權。"], "tag": "主題字彙"}, {"id": "voynich-vocab-56", "mode": "vocab", "paragraph": "E", "sentence": "Publishing his results in 2004, Rugg stresses that he had not set out to prove the manuscript a hoax.", "target": "set out to", "options": ["begun with the intention of trying to", "already succeeded in proving", "refused to discuss under any circumstances"], "answer": 0, "explanations": ["set out to＝著手、以……為目標；had not 是否定其原先目的。", "意圖不等於已成功。", "不是拒談。"], "tag": "Phrasal verb"}, {"id": "voynich-vocab-57", "mode": "vocab", "paragraph": "E", "sentence": "“I simply demonstrated that it is feasible to hoax something this complex in a few months,” he says.", "target": "feasible", "options": ["possible to carry out successfully", "proved to have actually happened in this case", "impossible even in theory"], "answer": 0, "explanations": ["feasible＝可行的；能偽造不等於此件必為偽造。", "把可行性誤作歷史事實。", "不是不可能。"], "tag": "證據與語氣"}, {"id": "voynich-vocab-58", "mode": "vocab", "paragraph": "F", "sentence": "Inevitably, others beg to differ.", "target": "beg to differ", "options": ["politely or firmly express disagreement", "ask someone for money", "accept every part of another person’s view"], "answer": 0, "explanations": ["beg to differ＝恕難苟同、持不同看法。", "不是乞錢。", "不是完全贊同。"], "tag": "慣用表達"}, {"id": "voynich-vocab-59", "mode": "vocab", "paragraph": "F", "sentence": "Some scholars, such as Zandbergen, still suspect the text has genuine meaning, though believe it may never be decipherable.", "target": "decipherable", "options": ["able to be decoded or understood", "able to be bought at an affordable price", "able to be physically divided into pages"], "answer": 0, "explanations": ["decipherable＝能被破解、解讀的。", "不是買得起。", "不是能拆頁。"], "tag": "主題字彙"}, {"id": "voynich-vocab-60", "mode": "vocab", "paragraph": "F", "sentence": "Others, such as Churchill, have suggested that the sheer weirdness of the illustrations and text hints at an author who had lost touch with reality.", "target": "sheer", "options": ["complete or striking in degree", "slightly noticeable only", "transparent like thin cloth"], "answer": 0, "explanations": ["sheer weirdness＝極其怪異、怪異本身的強烈程度。", "不是只有一點怪。", "不是布料透明。"], "tag": "常見字語境義"}, {"id": "voynich-vocab-61", "mode": "vocab", "paragraph": "F", "sentence": "Others, such as Churchill, have suggested that the sheer weirdness of the illustrations and text hints at an author who had lost touch with reality.", "target": "lost touch with reality", "options": ["become disconnected from what is real", "stopped physically touching the book", "forgotten the location of the library"], "answer": 0, "explanations": ["lose touch with reality＝脫離現實；此處只是學者對作者的推測。", "不是停止碰書。", "不是忘記地點。"], "tag": "慣用表達"}, {"id": "voynich-vocab-62", "mode": "vocab", "paragraph": "F", "sentence": "What is clear is that the book-sized manuscript, kept under lock and key at Yale University, has lost none of its fascination.", "target": "under lock and key", "options": ["securely locked away", "available only by using a computer keyboard", "left unattended in a public corridor"], "answer": 0, "explanations": ["under lock and key＝鎖妥、嚴密保管。", "key 不是鍵盤按鍵。", "不是無人看管。"], "tag": "慣用表達"}, {"id": "voynich-vocab-63", "mode": "vocab", "paragraph": "F", "sentence": "What is clear is that the book-sized manuscript, kept under lock and key at Yale University, has lost none of its fascination.", "target": "lost none of its fascination", "options": ["remained just as fascinating", "become completely uninteresting", "lost only its financial value"], "answer": 0, "explanations": ["lost none＝魅力毫未減少。", "不是完全失去趣味。", "fascination 不是金錢價值。"], "tag": "否定與限定"}, {"id": "voynich-vocab-64", "mode": "vocab", "paragraph": "F", "sentence": "“Many derive great intellectual pleasure from solving puzzles,” says Rugg.", "target": "derive", "options": ["obtain or gain", "remove in order to prevent", "invent a false explanation for"], "answer": 0, "explanations": ["derive pleasure from＝從……得到樂趣。", "不是移除以防止。", "不是造假。"], "tag": "主題搭配"}, {"id": "voynich-vocab-65", "mode": "vocab", "paragraph": "F", "sentence": "“Many derive great intellectual pleasure from solving puzzles,” says Rugg.", "target": "intellectual pleasure", "options": ["enjoyment from thinking and using the mind", "pleasure caused only by physical exercise", "money earned from a successful discovery"], "answer": 0, "explanations": ["intellectual pleasure＝思考、智力活動帶來的樂趣。", "不是只限運動。", "不是收入。"], "tag": "主題搭配"}, {"id": "voynich-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Yet the library's most controversial possession is an unprepossessing vellum manuscript about the size of a hardback book, containing 240-odd pages of drawings and text of unknown age and authorship.", "target": "", "options": ["Despite its plain appearance, the manuscript is the library’s most disputed possession, with roughly 240-plus pages and unknown age and authorship.", "The manuscript’s lavish appearance proves its exact age and the identity of its author.", "The library’s most valuable-looking book is universally accepted and has exactly 240 pages."], "answer": 0, "explanations": ["unprepossessing 與 controversial 對比外觀與爭議；240-odd 為略多。", "外觀不起眼；unknown 非已知。", "controversial 不是公認，-odd 不是精確。"], "tag": "長難句理解", "structure": "主幹 possession is ... manuscript；containing ... 是分詞修飾；of unknown age and authorship 表年代與作者資訊欠缺。"}, {"id": "voynich-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "Catalogued as MS 408, the manuscript would attract little attention were it not for the fact that the drawings hint at esoteric knowledge, while the text seems to be some sort of code — one that no-one has been able to break.", "target": "", "options": ["The manuscript would draw little interest if its unusual drawings and apparently unbroken code did not make it intriguing.", "The catalogue number itself is the only reason the book attracts attention.", "The writer says the code has already been solved, so the drawings no longer matter."], "answer": 0, "explanations": ["were it not for＝if it were not for；特殊內容才是關注原因。", "MS 408 是編目資訊，不是唯一吸引原因。", "no-one has been able to break 是否定已破解。"], "tag": "長難句理解", "structure": "Catalogued ... 為被動分詞；were it not for 為省略 if 的倒裝；while 對比 drawings 與 text；one 指 code。"}, {"id": "voynich-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "It is known to scholars as the Voynich manuscript, after the American book-dealer Wilfrid Voynich, who bought the manuscript from a Jesuit college in Italy in 1912.", "target": "", "options": ["The manuscript takes its name from Wilfrid Voynich, who purchased it from an Italian Jesuit college in 1912.", "Voynich wrote the manuscript in 1912 and named the college after himself.", "The manuscript was named after its confirmed medieval author."], "answer": 0, "explanations": ["after 表命名來源，who 子句交代購買。", "bought 不等於 wrote。", "買家並非已確認作者。"], "tag": "長難句理解", "structure": "It 指 manuscript；after 引出名字來源；who bought ... 修飾 Voynich。"}, {"id": "voynich-paraphrase-4", "mode": "paraphrase", "paragraph": "A", "sentence": "Over the years, the manuscript has attracted the attention of everyone from amateur dabblers to top code-breakers, all determined to succeed where countless others have failed.", "target": "", "options": ["Both casual enthusiasts and expert code-breakers have tried to solve what many earlier investigators could not.", "Only professional academics have ever taken an interest in the manuscript.", "Every amateur has succeeded, while all professional investigators have failed."], "answer": 0, "explanations": ["from A to B 表涵蓋範圍；determined 是決心，不是成功保證。", "amateur dabblers 明確包含非專家。", "determined to succeed 不等於已成功。"], "tag": "長難句理解", "structure": "all determined ... 補充 everyone 的心志；where ... 表前人失敗的問題領域，不一定指實際地點。"}, {"id": "voynich-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "In 1921 Voynich's view that Bacon was the writer appeared to win support from the work of William Newbold, Professor of Philosophy at the University of Pennsylvania, who claimed to have found the key to the cipher system used by Bacon.", "target": "", "options": ["Newbold’s claimed decoding initially seemed to support Voynich’s belief that Roger Bacon wrote the manuscript.", "Newbold proved beyond doubt in 1921 that Voynich himself wrote the book.", "Voynich rejected Bacon as the author before Newbold began his work."], "answer": 0, "explanations": ["appeared、claimed 保留當時看似支持的語氣。", "Bacon 才是候選作者，且未確證。", "原文是 Voynich 的看法獲表面支持。"], "tag": "長難句理解", "structure": "view 後的 that 為同位語子句；appeared to win support 是主句；who claimed ... 修飾 Newbold。"}, {"id": "voynich-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "According to Newbold, the manuscript proved that Bacon had access to a microscope centuries before they were supposedly first invented.", "target": "", "options": ["Newbold argued that the manuscript showed Bacon had used a microscope long before its generally accepted invention date.", "The writer confirms as settled fact that microscopes were invented by Bacon.", "The manuscript states that Newbold personally observed medieval cells centuries earlier."], "answer": 0, "explanations": ["According to 將主張歸給 Newbold，不是作者定論。", "忽略歸屬語氣；後文還提出反駁。", "使用者是主張中的 Bacon，不是 Newbold 跨越年代觀察。"], "tag": "長難句理解", "structure": "According to 標示資訊來源；proved that 為其聲稱內容；had access to 指可使用；before 引出時間比較。"}, {"id": "voynich-paraphrase-7", "mode": "paraphrase", "paragraph": "B", "sentence": "It soon became clear, however, that Newbold had fallen victim to wishful thinking.", "target": "", "options": ["Later scrutiny showed that Newbold had accepted what he wanted to believe rather than reaching a sound decoding.", "Newbold’s theory was strengthened because his method allowed many incompatible interpretations.", "Everyone accepted his claim permanently because it attracted public attention."], "answer": 0, "explanations": ["wishful thinking 說明認知問題；however 轉折前面看似成功。", "多種可解釋結果是後句提出的問題，不是確證。", "became clear ... fallen victim 不表示永久公認。"], "tag": "長難句理解", "structure": "It 是形式主詞；that 子句為真正內容；had fallen victim 表先前已受誤導。"}, {"id": "voynich-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "In 1944, a team was assembled to tackle the mystery, led by William Friedman, the renowned American code breaker.", "target": "", "options": ["A team led by the code-breaker William Friedman was brought together in 1944 to investigate the mystery.", "Friedman wrote the original manuscript in 1944 before anyone formed a team.", "A team was broken up in 1944 because Friedman refused to investigate."], "answer": 0, "explanations": ["was assembled 是被召集；led by 指領導者。", "調查不等於寫作。", "assembled 與 broken up 相反。"], "tag": "長難句理解", "structure": "主句 a team was assembled；to tackle 表目的；led by ... 是被動分詞；renowned ... 為同位說明。"}, {"id": "voynich-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "They began with the most basic code-breaking task: analysing the relative frequencies of the characters making up the text, looking for signs of an underlying structure.", "target": "", "options": ["The team first compared how often different characters appeared, hoping to find an underlying pattern.", "The team began by counting the author’s relatives and looking for their names in the text.", "The team translated every character before examining its frequency."], "answer": 0, "explanations": ["relative 修飾 frequencies，characters 是字元。", "誤讀 relative 和 characters 的語境義。", "原文不是已逐字翻譯。"], "tag": "長難句理解", "structure": "task 後冒號說明分析內容；making up ... 修飾 characters；looking for ... 表伴隨目的。"}, {"id": "voynich-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "The precise size of the “alphabet” of the Voynich manuscript was unclear: it is possible to make out more than 70 distinct symbols among the 170,000-character text.", "target": "", "options": ["The number of symbols in the manuscript’s alphabet was uncertain, although more than seventy different signs could be distinguished in the full text.", "The text had exactly seventy characters in total and no repeated signs.", "The whole text contained fewer than seventy symbols, including every repetition."], "answer": 0, "explanations": ["區分符號種類與全篇 170,000 字元總數。", "more than 非 exactly；170,000 也不是 70。", "more than 與 fewer than 相反。"], "tag": "長難句理解", "structure": "冒號後解釋為何 alphabet size 不清；make out 表辨認；distinct 限定符號種類，170,000-character 指全文字元量。"}, {"id": "voynich-paraphrase-11", "mode": "paraphrase", "paragraph": "C", "sentence": "Furthermore, Friedman discovered that some words and phrases appeared more often than expected in a standard language, casting doubt on claims that the manuscript concealed a real language, as encryption typically reduces word frequencies.", "target": "", "options": ["Friedman found unexpectedly frequent repetitions and took them as a reason to question the claim that a normal language lay behind the text.", "The high repetition rates proved conclusively that the book was meaningless fraud.", "Friedman’s analysis found no repeated words at all."], "answer": 0, "explanations": ["casting doubt 是提出質疑，仍屬其論證而非確證騙局。", "質疑真實語言不等於已證明偽作。", "more often than expected 明說重複偏多。"], "tag": "長難句理解", "structure": "discovered that ... 為受詞子句；casting doubt ... 是結果分詞；claims that ... 補充主張內容；as 表論證理由。"}, {"id": "voynich-paraphrase-12", "mode": "paraphrase", "paragraph": "C", "sentence": "Friedman concluded that the most plausible resolution of this paradox was that “Voynichese” is some sort of specially created artificial language, whose words are devised from concepts rather than linguistics.", "target": "", "options": ["Friedman regarded a deliberately created language based on concepts as the most believable explanation of the puzzle.", "Friedman conclusively translated the manuscript and identified every word’s meaning.", "Friedman believed it was an ordinary natural language copied unchanged from a dictionary."], "answer": 0, "explanations": ["most plausible 是最合理的假設解釋，不是已解碼。", "沒有提供完整翻譯或每字意思。", "specially created artificial language 與普通自然語言不同。"], "tag": "長難句理解", "structure": "concluded that ...；resolution was that ... 為巢狀子句；whose 修飾 language；rather than 對比概念與語言學來源。"}, {"id": "voynich-paraphrase-13", "mode": "paraphrase", "paragraph": "C", "sentence": "“Friedman's hypothesis commands respect because of the lifetime of cryptanalytic expertise he brought to bear,” says Rob Churchill, co-author of The Voynich Manuscript.", "target": "", "options": ["Churchill says Friedman’s theory merits respect because he applied a lifetime of code-analysis expertise.", "Churchill says respect for Friedman proves the theory must be correct.", "Churchill dismisses Friedman as having no relevant experience."], "answer": 0, "explanations": ["尊重理論有專業背景理由，但不表示證實正確。", "command respect 不等於證明。", "lifetime of expertise 與沒有經驗相反。"], "tag": "長難句理解", "structure": "because of 引出名詞片語理由；he brought to bear 為省略關係代名詞的關係子句，修飾 expertise。"}, {"id": "voynich-paraphrase-14", "mode": "paraphrase", "paragraph": "C", "sentence": "That still leaves a host of questions unanswered, however, such as the identity of the author and the meaning of the bizarre drawings.", "target": "", "options": ["The hypothesis still fails to answer many questions, including who wrote the book and what its strange pictures mean.", "The hypothesis fully answers both authorship and every illustration’s meaning.", "Only the financial value of the manuscript remains uncertain."], "answer": 0, "explanations": ["That 指前述假設；leaves ... unanswered 是尚未解答。", "unanswered 否定已解答。", "原文列的是作者及圖像意義。"], "tag": "長難句理解", "structure": "leaves + 受詞 + unanswered 為受詞補語；such as 列舉問題；however 轉折假設的價值與限制。"}, {"id": "voynich-paraphrase-15", "mode": "paraphrase", "paragraph": "D", "sentence": "Even though Friedman was working more than 60 years ago, he suspected that major insights would come from using the device that had already transformed code-breaking: the computer.", "target": "", "options": ["Despite working decades earlier, Friedman expected computers to produce important discoveries, since they had already transformed code-breaking.", "Friedman thought computers would never help because they had no effect on code-breaking.", "The writer says Friedman was using a modern computer sixty years into the future."], "answer": 0, "explanations": ["he suspected 是當時對未來工具潛力的判斷。", "would come from 與 had transformed 均相反。", "more than 60 years ago 是相對文章寫作時間，不是穿越未來。"], "tag": "長難句理解", "structure": "Even though 讓步；suspected that ...；device 後的 that 為關係子句；冒號後 computer 解釋 device。"}, {"id": "voynich-paraphrase-16", "mode": "paraphrase", "paragraph": "D", "sentence": "This revealed evidence that the manuscript contains genuine words, rather than random nonsense, consistent with the existence of some underlying natural language.", "target": "", "options": ["Landini’s analysis found signs of genuine words, compatible with the possibility of an underlying natural language.", "Landini supplied a complete translation proving the author’s identity.", "The analysis found only random nonsense and ruled out every possible language."], "answer": 0, "explanations": ["evidence、consistent with 表支持相容，不是唯一確解。", "原文未說完整翻譯或作者確定。", "rather than random nonsense 與此選項相反。"], "tag": "長難句理解", "structure": "This 指前句分析研究；evidence that ... 補充證據內容；consistent with ... 描述與自然語言假說相容。"}, {"id": "voynich-paraphrase-17", "mode": "paraphrase", "paragraph": "D", "sentence": "Yet the following year, Voynich expert René Zandbergen of the European Space Agency in Darmstadt, Germany, showed that the entropy of the text (a measure of the rate of transfer of information) was consistent with Friedman's suspicions that an artificial language had been used.", "target": "", "options": ["The next year, Zandbergen found an information measure that was compatible with Friedman’s artificial-language hypothesis.", "Zandbergen proved that Landini’s observations could not exist and named the author.", "Both studies conclusively agreed that the text must be an ordinary natural language."], "answer": 0, "explanations": ["兩種分析呈現不同假說的相容證據，未說已破解。", "文中未否定所有觀察或確認作者。", "此句與 artificial language 相容，不能改成兩者都定論自然語言。"], "tag": "長難句理解", "structure": "showed that ... 是報告內容；括號解釋 entropy；suspicions that ... 中 that 引出假說內容；had been used 為被動。"}, {"id": "voynich-paraphrase-18", "mode": "paraphrase", "paragraph": "E", "sentence": "For how could a medieval hoaxer create so many tell-tale signs of a message from random nonsense?", "target": "", "options": ["Many doubt a medieval hoaxer could have produced so many apparent signs of meaning from meaningless material.", "Everyone has proved a medieval hoaxer created a meaningful natural language.", "The rhetorical question gives the exact method used by the original author."], "answer": 0, "explanations": ["反問承接 many convinced not a hoax，表對造假能力的質疑。", "不是 every，也不是已證明。", "反問沒有提供確切歷史製法。"], "tag": "長難句理解", "structure": "For 此處引出理由；how could ... 是反問；from random nonsense 表起始材料。"}, {"id": "voynich-paraphrase-19", "mode": "paraphrase", "paragraph": "E", "sentence": "Using a system first published by the Italian mathematician Girolamo Cardano in 1550, in which a specially constructed grille is used to pick out symbols from a table, Rugg found he could rapidly generate text with many of the basic traits of the Voynich manuscript.", "target": "", "options": ["Rugg used an old symbol-selection system with a specially made grille and quickly produced text sharing many features of the manuscript.", "Rugg found the original author’s grille and translated every symbol with it.", "Rugg showed that only modern electronic technology could imitate any of the text’s features."], "answer": 0, "explanations": ["system 古已有之；相似特徵不等於找到原物或完整解密。", "未說是原作者用過的工具。", "1550 年發表的系統，不限現代科技。"], "tag": "長難句理解", "structure": "Using ... 的主詞是 Rugg；first published ... 修飾 system；in which 指系統；found 後省略 that；with many ... 修飾所產文本。"}, {"id": "voynich-paraphrase-20", "mode": "paraphrase", "paragraph": "E", "sentence": "Publishing his results in 2004, Rugg stresses that he had not set out to prove the manuscript a hoax.", "target": "", "options": ["When publishing the results, Rugg emphasized that proving the manuscript fraudulent had not been his original aim.", "Rugg announced that his sole original aim had been to prove conclusively that the book was a hoax.", "Rugg refused to publish results because he had no method."], "answer": 0, "explanations": ["had not set out to 說明原先目的的否定。", "把 not 原先目的反轉成唯一目的。", "Publishing his results 明說有公布。"], "tag": "長難句理解", "structure": "Publishing ... 是伴隨分詞；stresses that ...；had not set out to prove ... 為過去完成式否定；prove + 受詞 + 補語 a hoax。"}, {"id": "voynich-paraphrase-21", "mode": "paraphrase", "paragraph": "E", "sentence": "“I simply demonstrated that it is feasible to hoax something this complex in a few months,” he says.", "target": "", "options": ["Rugg says his demonstration established that creating a comparably complex fake within months was possible.", "Rugg says he proved who forged the original manuscript and exactly when.", "Rugg says a fake of this complexity would be impossible even after centuries."], "answer": 0, "explanations": ["feasible 說的是可行性；this complex＝這麼複雜的。", "可行性不等於歷史上已證實的作者與年代。", "與 feasible 和 in a few months 相反。"], "tag": "長難句理解", "structure": "demonstrated that ...；it is feasible to ... 中 it 為形式主詞；this 作程度副詞修飾 complex。"}, {"id": "voynich-paraphrase-22", "mode": "paraphrase", "paragraph": "F", "sentence": "Some scholars, such as Zandbergen, still suspect the text has genuine meaning, though believe it may never be decipherable.", "target": "", "options": ["Some scholars think the text may be meaningful while also accepting that it might never be decoded.", "All scholars agree the text is meaningless because it cannot currently be read.", "Zandbergen guarantees that a full translation will be available soon."], "answer": 0, "explanations": ["有意義與可解碼並非同一判斷；may never 保留可能性。", "some 不是 all；有意義不等於目前能讀懂。", "may never 與保證很快譯出相反。"], "tag": "長難句理解", "structure": "Some scholars 作 suspect 和 believe 的共同主詞；though 後省略同一主詞；may never be decipherable 為可能性否定。"}, {"id": "voynich-paraphrase-23", "mode": "paraphrase", "paragraph": "F", "sentence": "What is clear is that the book-sized manuscript, kept under lock and key at Yale University, has lost none of its fascination.", "target": "", "options": ["Although the manuscript is securely stored, its fascination has not diminished.", "The manuscript has lost all its appeal because nobody may discuss it.", "The writer proves that the mystery has been solved and the book discarded."], "answer": 0, "explanations": ["lost none 表絲毫未失去吸引力；kept under lock and key 是保管狀態。", "none 不能讀作 all，也未說禁止討論。", "全文仍呈現謎團，非破解後丟棄。"], "tag": "長難句理解", "structure": "What is clear 是主詞子句；is that ... 為表語；kept ... 是被動分詞修飾 manuscript；none 否定魅力的流失。"}, {"id": "voynich-manuscript-qv2-1", "mode": "questionVocab", "paragraph": "", "sentence": "It is uncertain when the Voynich manuscript was written.", "target": "manuscript", "options": ["手稿、手寫文獻", "供大量印製的現代印刷版", "對原書的口頭摘要"], "answer": 0, "explanations": ["manuscript 在本文指手寫的古老文獻。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是一般印刷出版品。", "不是口頭摘要。"], "tag": "題目字彙", "source": "Question 27 · 題目用語"}, {"id": "voynich-manuscript-qv2-2", "mode": "questionVocab", "paragraph": "", "sentence": "Wilfrid Voynich donated the manuscript to the Beinecke Library.", "target": "donated", "options": ["捐贈", "付費借用", "以商業價格出售"], "answer": 0, "explanations": ["donate 指無償贈予機構等對象。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是付費借用。", "不是販賣。"], "tag": "題目字彙", "source": "Question 28 · 題目用語"}, {"id": "voynich-manuscript-qv2-3", "mode": "questionVocab", "paragraph": "", "sentence": "Interest in the Voynich manuscript extends beyond that of academics and professional code breakers.", "target": "extends beyond", "options": ["超出、不限於", "完全排除", "嚴格限制在……之內"], "answer": 0, "explanations": ["extends beyond 表範圍還包括其他群體。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是排除原有群體。", "與只限於相反。"], "tag": "題目字彙", "source": "Question 29 · 題目用語"}, {"id": "voynich-manuscript-qv2-4", "mode": "questionVocab", "paragraph": "", "sentence": "Interest in the Voynich manuscript extends beyond that of academics and professional code breakers.", "target": "academics", "options": ["學者、學術研究人員", "受過教育的所有民眾", "只負責圖書保管的人員"], "answer": 0, "explanations": ["academics 在此為名詞，指從事學術者。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是所有受教育者。", "不是專指圖書館管理員。"], "tag": "題目字彙", "source": "Question 29 · 題目用語"}, {"id": "voynich-manuscript-qv2-5", "mode": "questionVocab", "paragraph": "", "sentence": "Interest in the Voynich manuscript extends beyond that of academics and professional code breakers.", "target": "professional code breakers", "options": ["專業密碼破解者", "專門編寫電腦軟體的人員", "負責修復古書紙張的技師"], "answer": 0, "explanations": ["code breakers 解讀、破解加密內容。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不等於一般程式開發人員。", "不是修復紙張的人。"], "tag": "題目字彙", "source": "Question 29 · 題目用語"}, {"id": "voynich-manuscript-qv2-6", "mode": "questionVocab", "paragraph": "", "sentence": "The number of times that some words occur makes it unlikely that the manuscript is based on an authentic language.", "target": "authentic language", "options": ["真實存在或具有真實語言性質的語言", "必然已能被現代學者翻譯的語言", "語法完全沒有任何例外的語言"], "answer": 0, "explanations": ["authentic 在此與偽造或無真實語言基礎相對。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "真實語言不表示已能翻譯。", "不表示語法毫無例外。"], "tag": "題目字彙", "source": "Question 31 · 題目用語"}, {"id": "voynich-manuscript-qv2-7", "mode": "questionVocab", "paragraph": "", "sentence": "Unlike some other similar objects of fascination, people can gain direct access to the Voynich manuscript.", "target": "objects of fascination", "options": ["令人著迷的事物", "已完全被研究清楚的文物", "只具有金錢價值的物品"], "answer": 0, "explanations": ["fascination 指強烈吸引力與興趣。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "著迷不等於已解開謎團。", "不只是經濟價值。"], "tag": "題目字彙", "source": "Question 32 · 題目用語"}, {"id": "voynich-manuscript-qv2-8", "mode": "questionVocab", "paragraph": "", "sentence": "Unlike some other similar objects of fascination, people can gain direct access to the Voynich manuscript.", "target": "gain direct access to", "options": ["獲得直接接觸、查看……的機會", "取得物件的永久所有權", "只透過別人的摘要得知內容"], "answer": 0, "explanations": ["access 指接觸或查閱的途徑。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "查閱不等於擁有。", "direct 排除僅靠他人轉述。"], "tag": "題目字彙", "source": "Question 32 · 題目用語"}, {"id": "voynich-manuscript-qv2-9", "mode": "questionVocab", "paragraph": "", "sentence": "The person who wrote the manuscript may not have been entirely sane.", "target": "sane", "options": ["心智健全、精神正常的", "誠實且從不說謊的", "具備專業語言學資格的"], "answer": 0, "explanations": ["sane 談精神狀態；原題 may not…entirely 保留猜測。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是判定是否誠實。", "不是學術資格。"], "tag": "題目字彙", "source": "Question 33 · 題目用語"}, {"id": "voynich-manuscript-qv2-10", "mode": "questionVocab", "paragraph": "", "sentence": "Other researchers later demonstrated that there were flaws in his argument.", "target": "flaws in his argument", "options": ["其論證中的缺陷、漏洞", "其書寫字體的瑕疵", "其論證獲得的肯定"], "answer": 0, "explanations": ["flaw in an argument 指推理或證據上的不足。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是筆跡問題。", "不是表揚。"], "tag": "題目字彙", "source": "Question 35 · 題目用語"}, {"id": "voynich-manuscript-qv2-11", "mode": "questionVocab", "paragraph": "", "sentence": "William Friedman concluded that the manuscript was written in an artificial language that was based on ______.", "target": "artificial language", "options": ["人為創造的語言", "毫無規則、必定沒有意義的符號", "只因年代古老而無人懂的自然語言"], "answer": 0, "explanations": ["artificial 指刻意設計，不等於無意義。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "人造語言仍可有規則與意義。", "不是只因古老就屬人造。"], "tag": "題目字彙", "source": "Question 36 · 題目用語"}, {"id": "voynich-manuscript-qv2-12", "mode": "questionVocab", "paragraph": "", "sentence": "He couldn’t find out the meaning of this language but he believed that the ______ would continue to bring advances in code-breaking.", "target": "advances in code-breaking", "options": ["密碼破解方面的進展", "為研究預先支付的款項", "破解失敗後退回的資料"], "answer": 0, "explanations": ["advances 在此為進展；code-breaking 是破解密碼。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "advance 可指預付款，但此處不是。", "不是研究倒退。"], "tag": "題目字彙", "source": "Question 37 · 題目用語"}, {"id": "voynich-manuscript-qv2-13", "mode": "questionVocab", "paragraph": "", "sentence": "Dr Gabriel Landini used a system known as ______ in his research, and claims to have demonstrated the presence of genuine words.", "target": "claims to have demonstrated", "options": ["聲稱已經證明或展示了", "已獲公認且毫無疑問地證實了", "撤回原先提出的證據"], "answer": 0, "explanations": ["claims 標示這是研究者的主張；to have 表先前已完成。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "作者轉述主張不等於公認定論。", "不是撤回。"], "tag": "題目字彙", "source": "Question 38 · 題目用語"}, {"id": "voynich-manuscript-qv2-14", "mode": "questionVocab", "paragraph": "", "sentence": "Dr Gabriel Landini used a system known as ______ in his research, and claims to have demonstrated the presence of genuine words.", "target": "genuine words", "options": ["真正具有語言意義的詞", "形狀完全相同的重複符號", "僅因出現次數多就自動成立的詞"], "answer": 0, "explanations": ["genuine 強調非偽造、確實有語言性質。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是只要圖形重複就算詞。", "出現頻率本身不保證有詞義。"], "tag": "題目字彙", "source": "Question 38 · 題目用語"}, {"id": "voynich-manuscript-qv2-16", "mode": "questionVocab", "paragraph": "", "sentence": "determine the true identity of the manuscript’s author", "target": "determine the true identity", "options": ["查明真實身分", "替某人創造新的假身分", "根據個人喜好指定作者"], "answer": 0, "explanations": ["determine 在此指透過調查確定。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是製作假身分。", "不是隨意指定。"], "tag": "題目字彙", "source": "Question 40 B · 題目用語"}, {"id": "voynich-manuscript-qv2-17", "mode": "questionVocab", "paragraph": "", "sentence": "describe the numerous attempts to decode the manuscript.", "target": "decode", "options": ["解碼、破譯", "把可讀內容加密", "把原件逐字抄成一模一樣的副本"], "answer": 0, "explanations": ["decode 指解讀編碼後的內容。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "加密是 encode。", "機械抄寫不是解碼。"], "tag": "題目字彙", "source": "Question 40 C · 題目用語"}, {"id": "voynich-manuscript-qv2-18", "mode": "questionVocab", "paragraph": "", "sentence": "identify which research into the manuscript has had the most media coverage.", "target": "media coverage", "options": ["媒體報導的程度或範圍", "媒體機構的所有權", "書籍封面的材質"], "answer": 0, "explanations": ["coverage 在此指新聞報導。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是媒體歸誰擁有。", "不是實體封面。"], "tag": "題目字彙", "source": "Question 40 D · 題目用語"}]}, {"id": "look-who-was-talking", "title": "Look Who Was Talking", "sourceTitle": "Look who was talking", "subtitle": "Stephen Oppenheimer explores the origins of human speech", "part": 3, "topic": "語言起源、腦容量演化與文化累積", "sourceNote": "依提供的五張圖片完整編入 A–I 段。字彙練習中的原題敘述不代表文章認可該敘述；學說與推論依本文語境理解。", "paragraphs": [{"label": "A", "text": "When did we start talking to each other and how long did it take us to become so good at it? One view of language development, held by linguists such as Noam Chomsky and anthropologists such as Richard Klein, is that language, specifically the spoken word, appeared suddenly among modern humans a mere 35,000 to 50,000 years ago and that the ability to speak words and use syntax was recently genetically hard-wired into our brains in a kind of language organ. This view of language is associated with the old idea that logical thought is dependent on words, a concept originating with Plato and much in vogue in the 19th century – that is, animals do not speak because they do not think. However, the abstract thought demonstrated in 20th-century experiments with chimpanzees and bonobos puts this theory in doubt."}, {"label": "B", "text": "An alternative to the Chomskian theory is that language developed as a series of inventions. This was first suggested by the 18th-century philosopher Etienne Bonnot de Condillac. He argued that spoken language had developed out of gesture language (langage d’action) and that both were inventions arising initially from the simple association between action and object. The theory sees gesture language as arising originally among apes as sounds accompanying gestures, with these sounds gradually becoming coded into ‘words’ as the new skill drove its own evolution. Subsequently, coded words developed into deliberate, complex communication. Evolutionary pressures promoted the development of anatomy geared to speech – the larynx, vocal muscles and a specific part of the brain immediately next to the part responsible for gestures."}, {"label": "C", "text": "The view that spoken language was ultimately a cultural invention like tool-making, which then drove the biological evolution of the brain and vocal apparatus, seems obvious when you think of the development of different languages. The unique features of a language such as French clearly do not result from any physiological aspect of being French but are the cultural possessions of the French-speaking community. Each language evolves from one generation to the next, constantly adapting itself to cope with the learning bias of each new set of young, immature minds."}, {"label": "D", "text": "Those anthropologists and fossil experts who accept that speech started early still tend to think of language evolution as a gradual 2-million-year process, with our own modern human species (Homo sapiens) way at the top. A major reason for this is the perception that brain growth among humans was gradual over a similar period. Several recent changes in the fossil evidence, though, bring this into doubt."}, {"label": "E", "text": "The first of these is a re-dating of soil layers from the famous Olduvai Gorge in East Africa, where many key fossil remains have been found. A number of big-brained human species appear to be much older than previously thought, with several specimens dating from over a million years ago. When brain sizes for all available skulls are plotted against time using the revised dates, the result is startling: the bulk of increases in brain size was over by around 1.2 million years ago, with some African human species having brain volumes easily within the modern human range by that time."}, {"label": "F", "text": "So, we have the paradox that over the period when our brain was growing most rapidly, our material cultural development, as measured by stone tools, advanced only marginally; then, over a million years later, when the development of anatomically modern humans finally started to accelerate, artistically and technologically, our brains were actually getting smaller."}, {"label": "G", "text": "The additional piece of evidence that makes this paradox all the more significant is that brain size did not just leap between human species in a direct line of ascent towards ourselves. Over the period from 2.5 to 1.5 million years ago, brains were growing more rapidly than at any time since, within all the different human species. The logical conclusion is that there must have been a unique new behaviour driving brain growth, shared between all species of humans."}, {"label": "H", "text": "So, what was driving rapid brain growth right at the beginning, 2.5 million years ago? The answer may have been staring us in the face. Namely, that not only early humans but their ancestors had started the trend in the very useful skill of verbal communication. Around 2.5 million years ago, the weather took a decided turn for the worse, becoming more variable and colder and drier. The search for food became more taxing, and there would have been a real need to communicate more effectively and cope with the worsening environment in a co-operative way. The near maximum in brain size achieved by 1.2 million years ago indicates that those early ancestors could already have been talking perfectly well. Our brain, which had developed to manipulate and organise complex symbolic aspects of speech internally, could now be turned to a variety of other tasks."}, {"label": "I", "text": "So what happened in the million-year gap after that? Why did we take so long to get to the moon? Cultural evolution aided by communication and teaching is a cumulative iterative process. If each new generation invented just one new skill or idea and passed it on with the rest to their children and cousins, you could predict exactly the same curve of cultural advance as we see from the archaeological and historical record – first very slowly, then faster and faster."}], "questions": [{"id": "talking-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "One view of language development, held by linguists such as Noam Chomsky and anthropologists such as Richard Klein, is that language, specifically the spoken word, appeared suddenly among modern humans a mere 35,000 to 50,000 years ago and that the ability to speak words and use syntax was recently genetically hard-wired into our brains in a kind of language organ.", "target": "held by", "options": ["believed or supported by", "physically carried by", "officially arrested by"], "answer": 0, "explanations": ["此觀點由這些學者持有、支持。", "不是用手拿著。", "不是被逮捕。"], "tag": "常見字語境義"}, {"id": "talking-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "One view of language development, held by linguists such as Noam Chomsky and anthropologists such as Richard Klein, is that language, specifically the spoken word, appeared suddenly among modern humans a mere 35,000 to 50,000 years ago and that the ability to speak words and use syntax was recently genetically hard-wired into our brains in a kind of language organ.", "target": "a mere", "options": ["only a comparatively small amount of", "at least and probably much more than", "exactly with no uncertainty"], "answer": 0, "explanations": ["mere 強調相對而言僅僅這麼短的時間。", "不是至少或更多。", "不是表示精確無誤。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "One view of language development, held by linguists such as Noam Chomsky and anthropologists such as Richard Klein, is that language, specifically the spoken word, appeared suddenly among modern humans a mere 35,000 to 50,000 years ago and that the ability to speak words and use syntax was recently genetically hard-wired into our brains in a kind of language organ.", "target": "syntax", "options": ["the rules for arranging words into sentences", "the physical production of individual sounds", "the history of written alphabets"], "answer": 0, "explanations": ["syntax 指句法、詞語組成句子的規則。", "不是個別語音的發音。", "不是字母史。"], "tag": "主題字彙"}, {"id": "talking-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "One view of language development, held by linguists such as Noam Chomsky and anthropologists such as Richard Klein, is that language, specifically the spoken word, appeared suddenly among modern humans a mere 35,000 to 50,000 years ago and that the ability to speak words and use syntax was recently genetically hard-wired into our brains in a kind of language organ.", "target": "hard-wired", "options": ["built into the brain through genetic programming", "learned entirely through formal lessons", "connected by artificial electrical cables"], "answer": 0, "explanations": ["genetically hard-wired 指基因預設於大腦的能力；此處是所介紹的理論。", "不是完全靠正式課程學來。", "不是腦中安裝電線。"], "tag": "主題字彙"}, {"id": "talking-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "This view of language is associated with the old idea that logical thought is dependent on words, a concept originating with Plato and much in vogue in the 19th century – that is, animals do not speak because they do not think.", "target": "associated with", "options": ["connected with", "proven superior to", "independent of"], "answer": 0, "explanations": ["be associated with＝與……相關聯。", "不是已證實優於。", "不是與……無關。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "This view of language is associated with the old idea that logical thought is dependent on words, a concept originating with Plato and much in vogue in the 19th century – that is, animals do not speak because they do not think.", "target": "dependent on", "options": ["requiring or relying on", "unrelated to", "always preceding"], "answer": 0, "explanations": ["dependent on＝依賴、以……為必要條件。", "不是毫無關聯。", "不是時間上總在……之前。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "This view of language is associated with the old idea that logical thought is dependent on words, a concept originating with Plato and much in vogue in the 19th century – that is, animals do not speak because they do not think.", "target": "originating with", "options": ["first coming from", "eventually disproved by", "accidentally hidden from"], "answer": 0, "explanations": ["originating with Plato 指此觀念源自柏拉圖。", "不是最終被推翻。", "不是對某人隱瞞。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "This view of language is associated with the old idea that logical thought is dependent on words, a concept originating with Plato and much in vogue in the 19th century – that is, animals do not speak because they do not think.", "target": "in vogue", "options": ["fashionable or widely accepted at the time", "completely forgotten at the time", "scientifically established beyond doubt"], "answer": 0, "explanations": ["in vogue＝當時盛行、流行。", "不是被完全遺忘。", "盛行不等於科學上已確證。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "However, the abstract thought demonstrated in 20th-century experiments with chimpanzees and bonobos puts this theory in doubt.", "target": "abstract thought", "options": ["thinking about concepts beyond concrete objects", "speech with very few words", "thought that has been removed from the brain"], "answer": 0, "explanations": ["abstract thought＝抽象思考。", "不是簡短話語。", "不是思緒被抽走。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-10", "mode": "vocab", "paragraph": "A", "sentence": "However, the abstract thought demonstrated in 20th-century experiments with chimpanzees and bonobos puts this theory in doubt.", "target": "puts this theory in doubt", "options": ["gives reason to question this theory", "proves every part of this theory correct", "makes this theory impossible to discuss"], "answer": 0, "explanations": ["put something in doubt＝使人懷疑其正確性。", "不是證實正確。", "不是不能討論；質疑也不等於徹底推翻。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "He argued that spoken language had developed out of gesture language (langage d’action) and that both were inventions arising initially from the simple association between action and object.", "target": "developed out of", "options": ["grew or emerged from", "remained completely separate from", "replaced without any prior connection to"], "answer": 0, "explanations": ["develop out of＝由……發展而來。", "不是完全分離。", "不是無關來源的直接取代。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "He argued that spoken language had developed out of gesture language (langage d’action) and that both were inventions arising initially from the simple association between action and object.", "target": "gesture language", "options": ["communication through meaningful bodily movements", "a fully developed writing system", "speech produced at a very low volume"], "answer": 0, "explanations": ["gesture language 指以手勢、身體動作溝通的方式。", "不是文字書寫系統。", "不是小聲說話。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "He argued that spoken language had developed out of gesture language (langage d’action) and that both were inventions arising initially from the simple association between action and object.", "target": "arising", "options": ["coming into existence", "being deliberately destroyed", "moving to a higher physical location only"], "answer": 0, "explanations": ["arise 此處指產生、出現。", "不是被摧毀。", "不是僅指往上移動。"], "tag": "主題字彙"}, {"id": "talking-vocab-14", "mode": "vocab", "paragraph": "B", "sentence": "He argued that spoken language had developed out of gesture language (langage d’action) and that both were inventions arising initially from the simple association between action and object.", "target": "association", "options": ["a connection between things", "a formal membership organisation", "a competitive disagreement"], "answer": 0, "explanations": ["association between action and object＝動作與物件間的聯結。", "此處不是協會。", "不是競爭衝突。"], "tag": "常見字語境義"}, {"id": "talking-vocab-15", "mode": "vocab", "paragraph": "B", "sentence": "The theory sees gesture language as arising originally among apes as sounds accompanying gestures, with these sounds gradually becoming coded into ‘words’ as the new skill drove its own evolution.", "target": "accompanying", "options": ["occurring together with", "preventing the occurrence of", "replacing entirely"], "answer": 0, "explanations": ["聲音伴隨手勢出現。", "不是阻止手勢。", "不是完全取代手勢。"], "tag": "主題字彙"}, {"id": "talking-vocab-16", "mode": "vocab", "paragraph": "B", "sentence": "The theory sees gesture language as arising originally among apes as sounds accompanying gestures, with these sounds gradually becoming coded into ‘words’ as the new skill drove its own evolution.", "target": "coded into", "options": ["converted into a system of meaningful signs as", "removed completely from", "copied exactly without acquiring meaning as"], "answer": 0, "explanations": ["coded into words 指聲音逐漸編碼成有意義的詞。", "不是完全移除。", "不只是無意義地照抄。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-17", "mode": "vocab", "paragraph": "B", "sentence": "The theory sees gesture language as arising originally among apes as sounds accompanying gestures, with these sounds gradually becoming coded into ‘words’ as the new skill drove its own evolution.", "target": "drove", "options": ["caused or strongly influenced", "transported in a vehicle", "prevented from developing"], "answer": 0, "explanations": ["drive its own evolution 指推動其自身演化。", "不是開車運送。", "不是阻止發展。"], "tag": "常見字語境義"}, {"id": "talking-vocab-18", "mode": "vocab", "paragraph": "B", "sentence": "Subsequently, coded words developed into deliberate, complex communication.", "target": "deliberate", "options": ["intentional rather than accidental", "very slow rather than fast", "unconscious and automatic"], "answer": 0, "explanations": ["deliberate communication＝有意識、有目的的溝通。", "此處不是動作緩慢。", "不是無意識自動發生。"], "tag": "主題字彙"}, {"id": "talking-vocab-19", "mode": "vocab", "paragraph": "B", "sentence": "Evolutionary pressures promoted the development of anatomy geared to speech – the larynx, vocal muscles and a specific part of the brain immediately next to the part responsible for gestures.", "target": "Evolutionary pressures", "options": ["conditions that favour changes aiding survival and reproduction", "physical forces squeezing the skull", "formal rules imposed by teachers"], "answer": 0, "explanations": ["evolutionary pressures＝演化壓力，促使有利適應發展的條件。", "不是壓擠頭骨的物理力量。", "不是教師規定。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-20", "mode": "vocab", "paragraph": "B", "sentence": "Evolutionary pressures promoted the development of anatomy geared to speech – the larynx, vocal muscles and a specific part of the brain immediately next to the part responsible for gestures.", "target": "geared to", "options": ["adapted or suited to", "unable to support", "unrelated to"], "answer": 0, "explanations": ["geared to speech＝適合、配合說話功能。", "不是不能支持說話。", "不是與說話無關。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-21", "mode": "vocab", "paragraph": "B", "sentence": "Evolutionary pressures promoted the development of anatomy geared to speech – the larynx, vocal muscles and a specific part of the brain immediately next to the part responsible for gestures.", "target": "larynx", "options": ["the organ in the throat containing the vocal cords", "the main bone of the skull", "the muscle that controls the fingers"], "answer": 0, "explanations": ["larynx＝喉、含聲帶的發聲器官。", "不是頭骨。", "不是控制手指的肌肉。"], "tag": "主題字彙"}, {"id": "talking-vocab-22", "mode": "vocab", "paragraph": "C", "sentence": "The view that spoken language was ultimately a cultural invention like tool-making, which then drove the biological evolution
