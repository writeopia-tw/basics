, "answer": 0, "explanations": ["profitable 指收入超過成本而獲利。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "僅收支平衡不等於獲利。", "不是只談藝術評價。"], "tag": "題目字彙", "source": "Question 6 · 題目用語"}, {"id": "origin-cinema-qv2-9", "mode": "questionVocab", "paragraph": "", "sentence": "Which type of film started to become profitable in the ‘silent’ period?", "target": "‘silent’ period", "options": ["無聲電影時期", "沒有任何公開演出的時期", "電影完全不使用現場伴奏的時期"], "answer": 0, "explanations": ["指沒有同步口語對白的無聲電影年代。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是所有公開表演停止。", "無聲片仍可有現場配樂。"], "tag": "題目字彙", "source": "Question 6 · 題目用語"}, {"id": "origin-cinema-qv2-10", "mode": "questionVocab", "paragraph": "", "sentence": "It was the biggest producer of films.", "target": "producer", "options": ["製作者、生產者", "只負責發行影片的公司", "只負責接待觀眾的戲院"], "answer": 0, "explanations": ["biggest producer 指製作電影最多的生產者，此處比較國家。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是僅負責發行。", "不是僅負責放映。"], "tag": "題目字彙", "source": "Question 8 · 題目用語"}, {"id": "origin-cinema-qv2-11", "mode": "questionVocab", "paragraph": "", "sentence": "It was responsible for creating stars.", "target": "creating stars", "options": ["培養、造就電影明星", "製造與天體有關的特效", "以星號標示電影評分"], "answer": 0, "explanations": ["stars 在此指知名演員。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是天體效果。", "不是評分星號。"], "tag": "題目字彙", "source": "Question 10 · 題目用語"}, {"id": "origin-cinema-qv2-12", "mode": "questionVocab", "paragraph": "", "sentence": "It made movies based more on its own culture than outside influences.", "target": "outside influences", "options": ["外來影響", "本國傳統的內部延續", "政府對國內電影的補助"], "answer": 0, "explanations": ["outside 指本國文化以外的影響來源。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是只沿用自身傳統。", "不是專指本國政府補助。"], "tag": "題目字彙", "source": "Question 12 · 題目用語"}]}, {"id": "voynich-manuscript", "title": "The Voynich Manuscript", "sourceTitle": "The Voynich Manuscript", "subtitle": "Competing explanations of an enigmatic manuscript", "part": 3, "topic": "CODES · EVIDENCE · COMPETING HYPOTHESES", "sourceNote": "文章中的研究現況、年代與推測依原文理解。題目摘要稱 Rugg 結論是手稿無意義，比原文主張更強；本複習依原文區分「可偽造」與「已證實為偽作」。", "paragraphs": [{"label": "A", "text": "The starkly modern Beinecke Library at Yale University is home to some of the most valuable books in the world: first folios of Shakespeare, Gutenberg Bibles and manuscripts from the early Middle Ages. Yet the library's most controversial possession is an unprepossessing vellum manuscript about the size of a hardback book, containing 240-odd pages of drawings and text of unknown age and authorship. Catalogued as MS 408, the manuscript would attract little attention were it not for the fact that the drawings hint at esoteric knowledge, while the text seems to be some sort of code — one that no-one has been able to break. It is known to scholars as the Voynich manuscript, after the American book-dealer Wilfrid Voynich, who bought the manuscript from a Jesuit college in Italy in 1912. Over the years, the manuscript has attracted the attention of everyone from amateur dabblers to top code-breakers, all determined to succeed where countless others have failed. Academic research papers, books and websites are devoted to making sense of the contents of the manuscript, which are freely available to all. “Most other mysteries involve second-hand reports,” says Dr Gordon Rugg of Keele University, a leading Voynich expert. “But this is one that you can see for yourself.”"}, {"label": "B", "text": "It is certainly strange: page after page of drawings of weird plants, astrological symbolism and human figures, accompanied by a script that looks like some form of shorthand. What does it say — and what are the drawings about? Voynich himself believed that the manuscript was the work of the 13th-century English monk Roger Bacon, famed for his knowledge of alchemy, philosophy and science. In 1921 Voynich's view that Bacon was the writer appeared to win support from the work of William Newbold, Professor of Philosophy at the University of Pennsylvania, who claimed to have found the key to the cipher system used by Bacon. According to Newbold, the manuscript proved that Bacon had access to a microscope centuries before they were supposedly first invented. The claim that this medieval monk had observed living cells created a sensation. It soon became clear, however, that Newbold had fallen victim to wishful thinking. Other scholars showed that his “decoding” methods produced a host of possible interpretations."}, {"label": "C", "text": "The Voynich manuscript has continued to defy the efforts of world-class experts. In 1944, a team was assembled to tackle the mystery, led by William Friedman, the renowned American code breaker. They began with the most basic code-breaking task: analysing the relative frequencies of the characters making up the text, looking for signs of an underlying structure. Yet Friedman's team soon found themselves in deep water. The precise size of the “alphabet” of the Voynich manuscript was unclear: it is possible to make out more than 70 distinct symbols among the 170,000-character text. Furthermore, Friedman discovered that some words and phrases appeared more often than expected in a standard language, casting doubt on claims that the manuscript concealed a real language, as encryption typically reduces word frequencies. Friedman concluded that the most plausible resolution of this paradox was that “Voynichese” is some sort of specially created artificial language, whose words are devised from concepts rather than linguistics. So could the Voynich manuscript be the earliest-known example of an artificial language? “Friedman's hypothesis commands respect because of the lifetime of cryptanalytic expertise he brought to bear,” says Rob Churchill, co-author of The Voynich Manuscript. That still leaves a host of questions unanswered, however, such as the identity of the author and the meaning of the bizarre drawings. “It does little to advance our understanding of the manuscript as a whole,” says Churchill."}, {"label": "D", "text": "Even though Friedman was working more than 60 years ago, he suspected that major insights would come from using the device that had already transformed code-breaking: the computer. In this he was right — it is now the key tool for uncovering clues about the manuscript's language. The insights so far have been perplexing. For example, in 2001 another leading Voynich scholar, Dr Gabriel Landini of Birmingham University in the UK, published the results of his study of the manuscript using a pattern-detecting method called spectral analysis. This revealed evidence that the manuscript contains genuine words, rather than random nonsense, consistent with the existence of some underlying natural language. Yet the following year, Voynich expert René Zandbergen of the European Space Agency in Darmstadt, Germany, showed that the entropy of the text (a measure of the rate of transfer of information) was consistent with Friedman's suspicions that an artificial language had been used."}, {"label": "E", "text": "Many are convinced that the Voynich manuscript is not a hoax. For how could a medieval hoaxer create so many tell-tale signs of a message from random nonsense? Yet even this has been challenged in new research by Rugg. Using a system first published by the Italian mathematician Girolamo Cardano in 1550, in which a specially constructed grille is used to pick out symbols from a table, Rugg found he could rapidly generate text with many of the basic traits of the Voynich manuscript. Publishing his results in 2004, Rugg stresses that he had not set out to prove the manuscript a hoax. “I simply demonstrated that it is feasible to hoax something this complex in a few months,” he says."}, {"label": "F", "text": "Inevitably, others beg to differ. Some scholars, such as Zandbergen, still suspect the text has genuine meaning, though believe it may never be decipherable. Others, such as Churchill, have suggested that the sheer weirdness of the illustrations and text hints at an author who had lost touch with reality. What is clear is that the book-sized manuscript, kept under lock and key at Yale University, has lost none of its fascination. “Many derive great intellectual pleasure from solving puzzles,” says Rugg. “The Voynich manuscript is as challenging a puzzle as anyone could ask for.”"}], "questions": [{"id": "voynich-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Yet the library's most controversial possession is an unprepossessing vellum manuscript about the size of a hardback book, containing 240-odd pages of drawings and text of unknown age and authorship.", "target": "unprepossessing", "options": ["not impressive or attractive at first sight", "impossible for anyone to own", "deliberately decorated with bright colours"], "answer": 0, "explanations": ["unprepossessing＝外表不起眼、不吸引人的。", "不是不能持有。", "也不是刻意色彩鮮豔。"], "tag": "主題字彙"}, {"id": "voynich-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Yet the library's most controversial possession is an unprepossessing vellum manuscript about the size of a hardback book, containing 240-odd pages of drawings and text of unknown age and authorship.", "target": "vellum", "options": ["a fine prepared animal skin used as a writing surface", "a type of modern printing ink", "a hard wooden cover for a book"], "answer": 0, "explanations": ["vellum＝書寫用的精製獸皮紙。", "不是墨水。", "不是木書皮。"], "tag": "主題字彙"}, {"id": "voynich-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "Yet the library's most controversial possession is an unprepossessing vellum manuscript about the size of a hardback book, containing 240-odd pages of drawings and text of unknown age and authorship.", "target": "240-odd", "options": ["a little more than 240", "exactly 240 with no variation", "240 pages each numbered with an odd number"], "answer": 0, "explanations": ["數字後接 -odd 指略多於該數。", "不是精確等於。", "odd 此處不是奇數頁。"], "tag": "數量與限定"}, {"id": "voynich-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "Yet the library's most controversial possession is an unprepossessing vel
