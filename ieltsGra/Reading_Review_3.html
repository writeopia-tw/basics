 "Question 30 · 題目用語"}, {"id": "look-who-was-talking-qv2-7", "mode": "questionVocab", "paragraph": "", "sentence": "The development of different languages is related more to environment than biological factors.", "target": "biological factors", "options": ["生物、生理層面的因素", "社會風俗與文化規範", "個人接受的學校課程"], "answer": 0, "explanations": ["biological factors 與環境、文化因素作對比。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是社會習俗。", "不是教育課程。"], "tag": "題目字彙", "source": "Question 31 · 題目用語"}, {"id": "look-who-was-talking-qv2-8", "mode": "questionVocab", "paragraph": "", "sentence": "The ability to think rationally is linked to the ability to speak.", "target": "rationally", "options": ["理性地、合乎邏輯地", "只憑直覺且不需理由地", "僅依多數人意見地"], "answer": 0, "explanations": ["think rationally 指以理性、邏輯思考。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是排除理由。", "也不是單純從眾。"], "tag": "題目字彙", "source": "Question 32 · 題目用語"}, {"id": "look-who-was-talking-qv2-9", "mode": "questionVocab", "paragraph": "", "sentence": "Anthropologists now agree on the point in time when speech began.", "target": "Anthropologists", "options": ["人類學家", "研究天體的天文學家", "專為病人治療語音問題的治療師"], "answer": 0, "explanations": ["anthropologist 研究人類及其文化、演化等。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "天文學家是 astronomer。", "語言治療師不是人類學家。"], "tag": "題目字彙", "source": "Question 33 · 題目用語"}, {"id": "look-who-was-talking-qv2-10", "mode": "questionVocab", "paragraph": "", "sentence": "The rate of human technological development in ancient times was directly related to brain size.", "target": "technological development", "options": ["技術發展", "僅指人體器官自然成長", "只指藝術風格變化"], "answer": 0, "explanations": ["此處指工具、技術等方面的進展。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是身體生長。", "不是只談藝術風格。"], "tag": "題目字彙", "source": "Question 34 · 題目用語"}, {"id": "look-who-was-talking-qv2-11", "mode": "questionVocab", "paragraph": "", "sentence": "The development of agriculture influenced language development.", "target": "agriculture", "options": ["農業", "考古學", "人類學"], "answer": 0, "explanations": ["agriculture 指作物種植、畜養等農業活動。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "考古學是 archaeology。", "人類學是 anthropology。"], "tag": "題目字彙", "source": "Question 36 · 題目用語"}, {"id": "look-who-was-talking-qv2-12", "mode": "questionVocab", "paragraph": "", "sentence": "Cultural development has been seen to follow a particular pattern throughout human history.", "target": "follow a particular pattern", "options": ["呈現某種特定的發展模式", "依照某人明文訂定的規則行事", "完全重複同一個事件而無變化"], "answer": 0, "explanations": ["follow a pattern 指變化具有可辨識規律。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不必有人訂規則。", "規律不等於事件完全不變。"], "tag": "題目字彙", "source": "Question 37 · 題目用語"}, {"id": "look-who-was-talking-qv2-13", "mode": "questionVocab", "paragraph": "", "sentence": "Revised fossil evidence indicates most brain growth was complete.", "target": "Revised fossil evidence", "options": ["經重新檢視、修訂的化石證據", "刻意製造的假化石", "只憑口述傳承的祖先故事"], "answer": 0, "explanations": ["revised 指重新調整或詮釋；fossil evidence 是化石證據。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "修訂不等於偽造。", "也不是口傳故事。"], "tag": "題目字彙", "source": "Question 38 · 題目用語"}, {"id": "look-who-was-talking-qv2-14", "mode": "questionVocab", "paragraph": "", "sentence": "An external change may have influenced language development.", "target": "external change", "options": ["外部環境的變化", "基因內部的突變", "個人主觀意願的改變"], "answer": 0, "explanations": ["external 指個體以外；此題對照文中的天氣變化。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是內部基因改變。", "不是純粹主觀意願。"], "tag": "題目字彙", "source": "Question 40 · 題目用語"}]}, {"id": "deaf-to-music", "title": "When people are 'deaf' to music", "sourceTitle": "When people are 'deaf' to music", "subtitle": "", "part": 3, "topic": "音樂失認、音高辨識與作者論證", "sourceNote": "依提供圖片完整編入 A–F 段；D 段跨圖接續處已合併。研究敘述與障礙分類的討論均依本文語境理解；作者的分類立場不代表現今研究共識。原題字彙所用敘述不一定符合文章。", "paragraphs": [{"label": "A", "text": "Music has long been considered a uniquely human concept. In fact, most psychologists agree that music is a universal human instinct. Like any ability, however, there is great variation in people's musical competence. For every brilliant pianist in the world, there are several people we refer to as 'tone deaf'. It is not simply that people with tone deafness (or 'amusia') are unable to sing in tune, they are also unable to discriminate between tones or recognize familiar melodies. Such a 'disorder' can occur after some sort of brain damage, but recently research has been undertaken in an attempt to discover the cause of congenital amusia (when people are born with the condition), which is not associated with any brain damage, hearing problems, or lack of exposure to music."}, {"label": "B", "text": "According to the research of Dr. Isabelle Peretz of the University of Montreal, amusia is more complicated than the inability to distinguish pitches. An amusic (a person who has the condition of amusia) can distinguish between two pitches that are far apart, but cannot tell the difference between intervals smaller than a half step on the Western diatonic scale, while most people can easily distinguish differences smaller than that. When listening to melodies which have had a single note altered so that it is out of key with the rest of the melody, they do not notice a problem. As would be expected, amusics perform significantly worse at singing and tapping a rhythm along with a melody than do non-amusics."}, {"label": "C", "text": "The most fascinating aspect of amusia is how specific to music it is. Because of music's close ties to language, it might be expected that a musical impairment may be caused by a language impairment. Studies suggest, however, that language and music ability are independent of one another. People with brain damage in areas critical to language are often still able to sing, despite being unable to communicate through speech. Moreover, while amusics show deficiencies in their recognition of pitch differences in melodies, they show no such deficiencies in tonal languages. Amusics who speak tonal languages, such as Chinese, do not report having any difficulty discriminating between words that differ only in their intonation. The linguistic cues inherent in speech make discrimination of meaning much easier for amusics. Amusics are also successful most of the time at detecting the mood of a melody, can identify a speaker based on his or her voice and can discriminate and identify environmental sounds."}, {"label": "D", "text": "Recent work has been focused on locating the part of the brain that is responsible for amusia. The temporal lobes of the brain, the location of the primary auditory cortex, have been considered. It has long been believed that the temporal lobes, especially the right temporal lobe, are most active when engaged in musical activity, so any musical disability should logically stem from here as well. Because it has been shown that there is no hearing deficit in amusia, researchers moved on to the temporal neocortex, which is where more sophisticated processing of musical cues was thought to take place. New studies, however, have suggested that the deficits in amusics are located outside the auditory cortex. Brain scans of amusics do not show any reaction at all to differences smaller than a half step. When changes in tones are large, their brains overreact, showing twice as much activity on the right side of the brain as a normal brain hearing the same thing. These differences do not occur in the auditory cortex, indicating again that the deficits of amusia lie not in hearing impairment, but in higher processing of melodies."}, {"label": "E", "text": "So what does this all mean? Looking only at the research of Peretz in the field of neuropsychology of music, it would appear that amusia is some sort of disorder. As a student of neurobiology, however, I am skeptical. Certainly the studies by Peretz that have found significant differences between the brains of so-called amusics and normal brains are legitimate. The more important question now becomes one of normality. Every trait from skin color to intelligence to mood exists on a continuum—there is a great deal of variation from one extreme to the other. Just because we recognize that basic musical ability is something that the vast majority of people have, this doesn't mean that the lack of it is abnormal."}, {"label": "F", "text": "What makes an amusic worse off than a musical prodigy? Musical ability is culturally valued, and may have been a factor in survival at one point in human history, but does not seem likely that it is being selected for on an evolutionary scale any longer. Darwin believed that music was adaptive as a way of finding a mate, but who needs to be able to sing to find a partner in an age when it is possible to express your emotions through a song on your iPod? While the idea of amusia is interesting, it seems to be just one end of the continuum of innate musical ability. Comparing this 'disorder' to learning disorders like a specific language impairment seems to be going too far. Before amusia can be declared a disability, further research must be done to determine whether lack of musical ability is actually detrimental in any way. If no disadvantages can be found of having amusia, then it is no more a disability than having poor fashion sense or bad handwriting."}], "questions": [{"id": "amusia-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "In fact, most psychologists agree that music is a universal human instinct.", "target": "universal human instinct", "options": ["an inborn tendency regarded as shared across humanity", "an ability acquired only through professional training", "a habit limited to one culture"], "answer": 0, "explanations": ["指被視為人類普遍具有的本能。", "不是只靠專業訓練習得。", "不是僅限單一文化。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Like any ability, however, there is great variation in people's musical competence.", "target": "variation", "options": ["differences in level or form", "a complete absence of ability", "an exact numerical average"], "answer": 0, "explanations": ["variation 指能力的差異、變異。", "不是完全沒有能力。", "不是精確平均值。"], "tag": "主題字彙"}, {"id": "amusia-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "Like any ability, however, there is great variation in people's musical competence.", "target": "musical competence", "options": ["ability or skill in music", "a competition between musicians", "the commercial success of music"], "answer": 0, "explanations": ["musical competence＝音樂能力。", "competence 不是 competition 比賽。", "不是音樂的商業成功。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "For every brilliant pianist in the world, there are several people we refer to as 'tone deaf'.", "target": "refer to as", "options": ["describe or call by a particular name", "send to a different physical location", "avoid mentioning completely"], "answer": 0, "explanations": ["refer to someone as＝稱某人為。", "不是把人送到另一地點。", "不是完全避而不提。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "For every brilliant pianist in the world, there are several people we refer to as 'tone deaf'.", "target": "tone deaf", "options": ["unable to perceive musical pitch accurately", "unable to hear any sounds at all", "unwilling to listen to other people’s opinions"], "answer": 0, "explanations": ["tone deaf 在此指音高辨識困難、音樂失認相關表現。", "不等於完全失聰。", "不是比喻無視他人觀感的用法。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "It is not simply that people with tone deafness (or 'amusia') are unable to sing in tune, they are also unable to discriminate between tones or recognize familiar melodies.", "target": "sing in tune", "options": ["sing with accurate musical pitch", "sing in perfect time but at any pitch", "sing only very quietly"], "answer": 0, "explanations": ["sing in tune＝唱準音高、不走音。", "不是只指節拍正確而音高不限。", "不是小聲唱歌。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "It is not simply that people with tone deafness (or 'amusia') are unable to sing in tune, they are also unable to discriminate between tones or recognize familiar melodies.", "target": "discriminate between", "options": ["recognize a difference between", "treat unfairly because of social identity", "remove all differences between"], "answer": 0, "explanations": ["discriminate between tones＝辨別音調差異。", "此處不是社會歧視。", "不是消除差異。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "It is not simply that people with tone deafness (or 'amusia') are unable to sing in tune, they are also unable to discriminate between tones or recognize familiar melodies.", "target": "melodies", "options": ["recognizable sequences of musical notes", "spoken definitions of musical terms", "the loudness of individual sounds only"], "answer": 0, "explanations": ["melodies＝旋律。", "不是音樂術語的口頭定義。", "不是僅指聲音大小。"], "tag": "主題字彙"}, {"id": "amusia-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "Such a 'disorder' can occur after some sort of brain damage, but recently research has been undertaken in an attempt to discover the cause of congenital amusia (when people are born with the condition), which is not associated with any brain damage, hearing problems, or lack of exposure to music.", "target": "undertaken", "options": ["carried out or begun as a task", "abandoned before it began", "hidden beneath another object"], "answer": 0, "explanations": ["research has been undertaken＝已進行研究。", "不是尚未開始就放棄。", "不是藏在物體下面。"], "tag": "主題字彙"}, {"id": "amusia-vocab-10", "mode": "vocab", "paragraph": "A", "sentence": "Such a 'disorder' can occur after some sort of brain damage, but recently research has been undertaken in an attempt to discover the cause of congenital amusia (when people are born with the condition), which is not associated with any brain damage, hearing problems, or lack of exposure to music.", "target": "in an attempt to", "options": ["with the aim of trying to", "as conclusive proof of having managed to", "without any intention of trying to"], "answer": 0, "explanations": ["in an attempt to＝為了嘗試……。", "表示目的，不保證已經成功。", "不是無意嘗試。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-11", "mode": "vocab", "paragraph": "A", "sentence": "Such a 'disorder' can occur after some sort of brain damage, but recently research has been undertaken in an attempt to discover the cause of congenital amusia (when people are born with the condition), which is not associated with any brain damage, hearing problems, or lack of exposure to music.", "target": "congenital", "options": ["present from birth", "acquired only after an adult injury", "caused solely by lack of practice"], "answer": 0, "explanations": ["congenital＝先天的、出生時即有的。", "不是僅指成年受傷後出現。", "不是只因缺乏練習。"], "tag": "主題字彙"}, {"id": "amusia-vocab-12", "mode": "vocab", "paragraph": "A", "sentence": "Such a 'disorder' can occur after some sort of brain damage, but recently research has been undertaken in an attempt to discover the cause of congenital amusia (when people are born with the condition), which is not associated with any brain damage, hearing problems, or lack of exposure to music.", "target": "condition", "options": ["a particular state or health problem", "a requirement in a legal contract", "the physical temperature of the room"], "answer": 0, "explanations": ["the condition 此處指這種狀況、失認症。", "不是合約條件。", "不是室溫。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-13", "mode": "vocab", "paragraph": "A", "sentence": "Such a 'disorder' can occur after some sort of brain damage, but recently research has been undertaken in an attempt to discover the cause of congenital amusia (when people are born with the condition), which is not associated with any brain damage, hearing problems, or lack of exposure to music.", "target": "exposure to music", "options": ["experience of hearing or encountering music", "public disclosure of a musician’s identity", "an extremely loud musical performance only"], "answer": 0, "explanations": ["exposure to music＝接觸音樂的經驗。", "不是揭露音樂家身分。", "不是只指極大音量的演出。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-14", "mode": "vocab", "paragraph": "B", "sentence": "According to the research of Dr. Isabelle Peretz of the University of Montreal, amusia is more complicated than the inability to distinguish pitches.", "target": "pitches", "options": ["levels of how high or low sounds are", "places where sports are played", "the speed of a musical performance"], "answer": 0, "explanations": ["pitches 在此指音高。", "不是球場。", "不是演奏速度。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-15", "mode": "vocab", "paragraph": "B", "sentence": "An amusic (a person who has the condition of amusia) can distinguish between two pitches that are far apart, but cannot tell the difference between intervals smaller than a half step on the Western diatonic scale, while most people can easily distinguish differences smaller than that.", "target": "intervals", "options": ["differences in pitch between notes", "breaks between lessons only", "the physical spaces between instruments"], "answer": 0, "explanations": ["此處 intervals 指音程、音高之間的距離。", "不是課間休息。", "不是樂器間實體距離。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-16", "mode": "vocab", "paragraph": "B", "sentence": "An amusic (a person who has the condition of amusia) can distinguish between two pitches that are far apart, but cannot tell the difference between intervals smaller than a half step on the Western diatonic scale, while most people can easily distinguish differences smaller than that.", "target": "a half step", "options": ["a semitone in musical pitch", "half the duration of a song", "half of a dance movement"], "answer": 0, "explanations": ["a half step＝半音。", "不是歌曲時長的一半。", "不是半個舞步。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-17", "mode": "vocab", "paragraph": "B", "sentence": "An amusic (a person who has the condition of amusia) can distinguish between two pitches that are far apart, but cannot tell the difference between intervals smaller than a half step on the Western diatonic scale, while most people can easily distinguish differences smaller than that.", "target": "diatonic scale", "options": ["a seven-note scale with a pattern of whole and half steps", "an instrument used to weigh musical equipment", "a scale consisting only of equal semitone steps"], "answer": 0, "explanations": ["diatonic scale＝七聲自然音階，含全音與半音。", "scale 此處不是秤。", "不是全由半音組成的半音階。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-18", "mode": "vocab", "paragraph": "B", "sentence": "When listening to melodies which have had a single note altered so that it is out of key with the rest of the melody, they do not notice a problem.", "target": "altered", "options": ["changed or modified", "left exactly the same", "removed together with every other note"], "answer": 0, "explanations": ["a single note altered＝一個音被改動。", "不是原封不動。", "不是連同其他音全部刪去。"], "tag": "主題字彙"}, {"id": "amusia-vocab-19", "mode": "vocab", "paragraph": "B", "sentence": "When listening to melodies which have had a single note altered so that it is out of key with the rest of the melody, they do not notice a problem.", "target": "out of key", "options": ["not fitting the key of the surrounding music", "played without a keyboard", "performed after the music has ended"], "answer": 0, "explanations": ["out of key＝不合調、與其餘旋律不協調。", "不是沒有鍵盤。", "不是音樂結束後才演奏。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-20", "mode": "vocab", "paragraph": "B", "sentence": "As would be expected, amusics perform significantly worse at singing and tapping a rhythm along with a melody than do non-amusics.", "target": "significantly worse", "options": ["worse by a noticeable or substantial amount", "worse only in the writer’s personal taste", "exactly twice as poor in every measure"], "answer": 0, "explanations": ["significantly worse 指表現明顯較差；此句未交代統計檢定數值。", "不是單純個人品味。", "不代表各項都剛好差一倍。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-21", "mode": "vocab", "paragraph": "B", "sentence": "As would be expected, amusics perform significantly worse at singing and tapping a rhythm along with a melody than do non-amusics.", "target": "tapping a rhythm", "options": ["marking a musical beat with repeated light movements", "striking random objects without a pattern", "writing down the words of a song"], "answer": 0, "explanations": ["tapping a rhythm＝以輕拍動作打節奏。", "不是毫無規律敲打。", "不是抄歌詞。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-22", "mode": "vocab", "paragraph": "B", "sentence": "As would be expected, amusics perform significantly worse at singing and tapping a rhythm along with a melody than do non-amusics.", "target": "than do non-amusics", "options": ["than people without amusia perform", "than people with amusia used to perform", "than people without amusia want to perform"], "answer": 0, "explanations": ["do 代替 perform，比較無失認症者的表現。", "不是與患者過去相比。", "不是比較意願。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-23", "mode": "vocab", "paragraph": "C", "sentence": "The most fascinating aspect of amusia is how specific to music it is.", "target": "specific to music", "options": ["particularly confined to the musical domain", "equally affecting every type of communication", "caused by one particular song"], "answer": 0, "explanations": ["specific to music＝針對音樂領域的、具有領域特異性。", "不是所有溝通能力同樣受影響。", "不是某一首歌引起。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-24", "mode": "vocab", "paragraph": "C", "sentence": "Because of music's close ties to language, it might be expected that a musical impairment may be caused by a language impairment.", "target": "close ties", "options": ["strong connections", "tightly fastened pieces of string", "complete identity in every function"], "answer": 0, "explanations": ["close ties＝密切關聯。", "不是繩索綁緊。", "相關不等於所有功能完全相同。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-25", "mode": "vocab", "paragraph": "C", "sentence": "Because of music's close ties to language, it might be expected that a musical impairment may be caused by a language impairment.", "target": "impairment", "options": ["a reduction or difficulty in a function", "a guaranteed improvement in skill", "a lack of personal interest only"], "answer": 0, "explanations": ["impairment＝功能受損、障礙。", "不是技能提升。", "不是只有不感興趣。"], "tag": "主題字彙"}, {"id": "amusia-vocab-26", "mode": "vocab", "paragraph": "C", "sentence": "Studies suggest, however, that language and music ability are independent of one another.", "target": "independent of one another", "options": ["capable of varying or functioning separately", "identical in all their mechanisms", "unable to occur in the same person"], "answer": 0, "explanations": ["此處強調語言與音樂能力可分別保留或受損。", "不是運作機制全部相同。", "不是兩種能力不能共存。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-27", "mode": "vocab", "paragraph": "C", "sentence": "People with brain damage in areas critical to language are often still able to sing, despite being unable to communicate through speech.", "target": "critical to", "options": ["essential for", "hostile in its opinion of", "completely unrelated to"], "answer": 0, "explanations": ["areas critical to language＝對語言功能至關重要的腦區。", "critical 此處不是批評態度。", "不是與語言無關。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-28", "mode": "vocab", "paragraph": "C", "sentence": "Moreover, while amusics show deficiencies in their recognition of pitch differences in melodies, they show no such deficiencies in tonal languages.", "target": "deficiencies", "options": ["weaknesses or shortfalls in an ability", "unusual strengths in every task", "differences that must always be beneficial"], "answer": 0, "explanations": ["deficiencies＝能力上的不足、缺陷。", "不是特別強項。", "不是必然有益的差異。"], "tag": "主題字彙"}, {"id": "amusia-vocab-29", "mode": "vocab", "paragraph": "C", "sentence": "Moreover, while amusics show deficiencies in their recognition of pitch differences in melodies, they show no such deficiencies in tonal languages.", "target": "tonal languages", "options": ["languages where pitch patterns can distinguish word meanings", "languages spoken only through song", "languages with no meaningful pitch differences"], "answer": 0, "explanations": ["tonal languages＝聲調語言，音高模式可區別詞義。", "不是只能唱著說的語言。", "不是音高差異完全無關詞義。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-30", "mode": "vocab", "paragraph": "C", "sentence": "Amusics who speak tonal languages, such as Chinese, do not report having any difficulty discriminating between words that differ only in their intonation.", "target": "intonation", "options": ["variation in the pitch of a voice", "the written shape of letters", "the volume of a sound alone"], "answer": 0, "explanations": ["intonation 指語音音高變化；此句以此描述詞語間的音調差異。", "不是字母形狀。", "不是僅指音量。"], "tag": "主題字彙"}, {"id": "amusia-vocab-31", "mode": "vocab", "paragraph": "C", "sentence": "The linguistic cues inherent in speech make discrimination of meaning much easier for amusics.", "target": "linguistic cues", "options": ["signals in language that help interpretation", "musical instruments used to teach speech", "instructions requiring people to stop talking"], "answer": 0, "explanations": ["linguistic cues＝幫助理解的語言線索。", "不是教學樂器。", "不是叫人停止說話的命令。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-32", "mode": "vocab", "paragraph": "C", "sentence": "The linguistic cues inherent in speech make discrimination of meaning much easier for amusics.", "target": "inherent in", "options": ["existing as a built-in part of", "added accidentally from outside", "completely missing from"], "answer": 0, "explanations": ["inherent in speech＝言語本身所具有的。", "不是外部偶然加入。", "不是完全不存在。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-33", "mode": "vocab", "paragraph": "C", "sentence": "Amusics are also successful most of the time at detecting the mood of a melody, can identify a speaker based on his or her voice and can discriminate and identify environmental sounds.", "target": "mood of a melody", "options": ["the emotional character conveyed by a tune", "the temporary emotions of every listener", "the exact musical key alone"], "answer": 0, "explanations": ["mood of a melody＝旋律傳達的情緒色彩。", "不是每位聽眾當下的心情。", "不是只指調性。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-34", "mode": "vocab", "paragraph": "C", "sentence": "Amusics are also successful most of the time at detecting the mood of a melody, can identify a speaker based on his or her voice and can discriminate and identify environmental sounds.", "target": "environmental sounds", "options": ["sounds from the surrounding world", "only electronic recordings of music", "spoken words in an unfamiliar language only"], "answer": 0, "explanations": ["environmental sounds＝周遭環境聲音。", "不是只有電子音樂錄音。", "不是只有陌生語言。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-35", "mode": "vocab", "paragraph": "D", "sentence": "The temporal lobes of the brain, the location of the primary auditory cortex, have been considered.", "target": "temporal lobes", "options": ["regions at the sides of the brain", "temporary changes in hearing ability", "brain structures that measure elapsed time only"], "answer": 0, "explanations": ["temporal lobes＝顳葉。", "temporal 此處不是暫時的。", "不是僅負責計時的結構。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-36", "mode": "vocab", "paragraph": "D", "sentence": "The temporal lobes of the brain, the location of the primary auditory cortex, have been considered.", "target": "auditory cortex", "options": ["the part of the cerebral cortex involved in processing sound", "the outer surface of the ear", "the part of the eye that receives light"], "answer": 0, "explanations": ["auditory cortex＝聽覺皮質。", "不是外耳表面。", "不是眼睛感光部位。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-37", "mode": "vocab", "paragraph": "D", "sentence": "It has long been believed that the temporal lobes, especially the right temporal lobe, are most active when engaged in musical activity, so any musical disability should logically stem from here as well.", "target": "engaged in", "options": ["taking part in", "legally promised in marriage to", "prevented from doing"], "answer": 0, "explanations": ["engaged in musical activity＝參與音樂活動。", "不是訂婚。", "不是被阻止進行。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-38", "mode": "vocab", "paragraph": "D", "sentence": "It has long been believed that the temporal lobes, especially the right temporal lobe, are most active when engaged in musical activity, so any musical disability should logically stem from here as well.", "target": "stem from", "options": ["originate in or result from", "be completely separate from", "be deliberately hidden inside"], "answer": 0, "explanations": ["stem from＝源於、由……造成。", "不是完全無關。", "不是刻意藏於。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-39", "mode": "vocab", "paragraph": "D", "sentence": "Because it has been shown that there is no hearing deficit in amusia, researchers moved on to the temporal neocortex, which is where more sophisticated processing of musical cues was thought to take place.", "target": "deficit", "options": ["a lack or shortfall in a function", "a surplus of ability", "an amount of money paid for treatment only"], "answer": 0, "explanations": ["hearing deficit＝聽覺功能缺損。", "不是能力過剩。", "不是僅指治療費用。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-40", "mode": "vocab", "paragraph": "D", "sentence": "Because it has been shown that there is no hearing deficit in amusia, researchers moved on to the temporal neocortex, which is where more sophisticated processing of musical cues was thought to take place.", "target": "moved on to", "options": ["shifted their investigation to", "physically carried the brain to", "proved every earlier idea about"], "answer": 0, "explanations": ["moved on to 指把研究焦點轉向另一部位。", "不是搬動大腦。", "不是證實先前所有想法。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-41", "mode": "vocab", "paragraph": "D", "sentence": "Because it has been shown that there is no hearing deficit in amusia, researchers moved on to the temporal neocortex, which is where more sophisticated processing of musical cues was thought to take place.", "target": "sophisticated processing", "options": ["complex or advanced handling of information", "processing done only with expensive machines", "a complete absence of mental analysis"], "answer": 0, "explanations": ["sophisticated processing＝較複雜、高層次的資訊處理。", "不代表只靠昂貴機器。", "不是沒有心智分析。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-42", "mode": "vocab", "paragraph": "D", "sentence": "When changes in tones are large, their brains overreact, showing twice as much activity on the right side of the brain as a normal brain hearing the same thing.", "target": "overreact", "options": ["respond more strongly than expected", "fail to respond in any way", "respond at exactly the usual level"], "answer": 0, "explanations": ["overreact＝反應過度。", "不是毫無反應。", "不是反應程度完全正常。"], "tag": "主題字彙"}, {"id": "amusia-vocab-43", "mode": "vocab", "paragraph": "D", "sentence": "When changes in tones are large, their brains overreact, showing twice as much activity on the right side of the brain as a normal brain hearing the same thing.", "target": "twice as much activity", "options": ["two times the amount of activity", "two additional units regardless of the original amount", "half the amount of activity"], "answer": 0, "explanations": ["twice as much＝活動量為兩倍。", "不是不管基數都只多兩單位。", "不是一半。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-44", "mode": "vocab", "paragraph": "D", "sentence": "These differences do not occur in the auditory cortex, indicating again that the deficits of amusia lie not in hearing impairment, but in higher processing of melodies.", "target": "lie not in", "options": ["are not located in or attributable to", "do not tell falsehoods about", "are guaranteed to disappear from"], "answer": 0, "explanations": ["lie in＝在於；lie not in 否定問題所在。", "lie 此處不是說謊。", "不是保證消失。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-45", "mode": "vocab", "paragraph": "E", "sentence": "Looking only at the research of Peretz in the field of neuropsychology of music, it would appear that amusia is some sort of disorder.", "target": "neuropsychology", "options": ["the study of relationships between brain function and behaviour", "the study of the manufacture of musical instruments", "the study of ancient written languages"], "answer": 0, "explanations": ["neuropsychology＝神經心理學，研究腦功能與行為關係。", "不是樂器製造學。", "不是古文字學。"], "tag": "主題字彙"}, {"id": "amusia-vocab-46", "mode": "vocab", "paragraph": "E", "sentence": "As a student of neurobiology, however, I am skeptical.", "target": "skeptical", "options": ["not readily convinced and inclined to question", "certain that every finding is fabricated", "fully persuaded without reservations"], "answer": 0, "explanations": ["skeptical＝抱持懷疑、尚未信服。", "不等於認定研究造假。", "不是毫無保留接受。"], "tag": "主題字彙"}, {"id": "amusia-vocab-47", "mode": "vocab", "paragraph": "E", "sentence": "Certainly the studies by Peretz that have found significant differences between the brains of so-called amusics and normal brains are legitimate.", "target": "so-called", "options": ["described by that name with some distancing from the label", "universally proved to be exactly that", "called aloud many times"], "answer": 0, "explanations": ["so-called 表所謂的，作者與分類標籤保持距離。", "不是宣告已普遍確證。", "不是大聲反覆叫喊。"], "tag": "主題字彙"}, {"id": "amusia-vocab-48", "mode": "vocab", "paragraph": "E", "sentence": "Certainly the studies by Peretz that have found significant differences between the brains of so-called amusics and normal brains are legitimate.", "target": "legitimate", "options": ["valid or worthy of being taken seriously", "licensed by the government as musical performances", "necessarily sufficient to prove every conclusion"], "answer": 0, "explanations": ["legitimate 指研究有正當性、值得認真看待。", "不是音樂演出執照。", "承認研究有效不等於接受所有推論。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-49", "mode": "vocab", "paragraph": "E", "sentence": "Every trait from skin color to intelligence to mood exists on a continuum—there is a great deal of variation from one extreme to the other.", "target": "trait", "options": ["a characteristic of a person", "a temporary medical treatment", "a compulsory musical examination"], "answer": 0, "explanations": ["trait＝特徵、特質。", "不是治療方式。", "不是音樂考試。"], "tag": "主題字彙"}, {"id": "amusia-vocab-50", "mode": "vocab", "paragraph": "E", "sentence": "Every trait from skin color to intelligence to mood exists on a continuum—there is a great deal of variation from one extreme to the other.", "target": "continuum", "options": ["a continuous range between extremes", "two wholly separate categories with nothing between", "an exact point shared by everyone"], "answer": 0, "explanations": ["continuum＝兩端之間有連續差異的連續體。", "不是只有兩種互斥分類。", "不是人人同一個值。"], "tag": "主題字彙"}, {"id": "amusia-vocab-51", "mode": "vocab", "paragraph": "E", "sentence": "Just because we recognize that basic musical ability is something that the vast majority of people have, this doesn't mean that the lack of it is abnormal.", "target": "the vast majority", "options": ["a very large proportion", "every single person without exception", "only a small exceptional group"], "answer": 0, "explanations": ["the vast majority＝絕大多數。", "不等於毫無例外全部。", "不是少數例外。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-52", "mode": "vocab", "paragraph": "F", "sentence": "What makes an amusic worse off than a musical prodigy?", "target": "worse off", "options": ["in a less favourable position", "less willing to perform", "more fashionable in appearance"], "answer": 0, "explanations": ["worse off＝處境更不利。", "不是較不願表演。", "不是穿著更時髦。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-53", "mode": "vocab", "paragraph": "F", "sentence": "What makes an amusic worse off than a musical prodigy?", "target": "musical prodigy", "options": ["a young person with exceptional musical talent", "a person who cannot recognize melodies", "any adult who enjoys recorded music"], "answer": 0, "explanations": ["musical prodigy＝音樂神童。", "不是音樂失認者。", "不是任何喜歡錄音音樂的成人。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-54", "mode": "vocab", "paragraph": "F", "sentence": "Musical ability is culturally valued, and may have been a factor in survival at one point in human history, but does not seem likely that it is being selected for on an evolutionary scale any longer.", "target": "selected for", "options": ["favoured through natural selection", "chosen for a concert programme", "required by a music teacher"], "answer": 0, "explanations": ["selected for 在此指受到自然選擇偏好。", "不是被選入演奏曲目。", "不是教師要求。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-55", "mode": "vocab", "paragraph": "F", "sentence": "Darwin believed that music was adaptive as a way of finding a mate, but who needs to be able to sing to find a partner in an age when it is possible to express your emotions through a song on your iPod?", "target": "adaptive", "options": ["helpful for survival or reproductive success", "easy to rewrite for another instrument only", "acquired entirely through imitation"], "answer": 0, "explanations": ["adaptive 在演化語境指有助生存或繁殖的適應性。", "不是只指易於改編樂器。", "不是完全靠模仿習得。"], "tag": "主題字彙"}, {"id": "amusia-vocab-56", "mode": "vocab", "paragraph": "F", "sentence": "Darwin believed that music was adaptive as a way of finding a mate, but who needs to be able to sing to find a partner in an age when it is possible to express your emotions through a song on your iPod?", "target": "mate", "options": ["a reproductive partner", "a school friend only", "a musical instrument"], "answer": 0, "explanations": ["finding a mate 此處指尋找配偶、繁殖伴侶。", "不是僅指同學朋友。", "不是樂器。"], "tag": "常見字語境義"}, {"id": "amusia-vocab-57", "mode": "vocab", "paragraph": "F", "sentence": "While the idea of amusia is interesting, it seems to be just one end of the continuum of innate musical ability.", "target": "innate", "options": ["present as an inborn capacity", "learned only through formal instruction", "introduced by an external device"], "answer": 0, "explanations": ["innate＝先天的、與生俱來的。", "不是只靠正式教學。", "不是外接裝置帶來。"], "tag": "主題字彙"}, {"id": "amusia-vocab-58", "mode": "vocab", "paragraph": "F", "sentence": "Comparing this 'disorder' to learning disorders like a specific language impairment seems to be going too far.", "target": "going too far", "options": ["making an excessive or unjustified comparison", "travelling an excessive physical distance", "reaching a conclusively proven result"], "answer": 0, "explanations": ["going too far 指作者認為此類比過度。", "不是旅行太遠。", "不是已獲得確證。"], "tag": "搭配與語境義"}, {"id": "amusia-vocab-59", "mode": "vocab", "paragraph": "F", "sentence": "Before amusia can be declared a disability, further research must be done to determine whether lack of musical ability is actually detrimental in any way.", "target": "detrimental", "options": ["causing harm or disadvantage", "automatically inherited", "culturally fashionable"], "answer": 0, "explanations": ["detrimental＝有害、造成不利的。", "不是自動遺傳。", "不是文化上流行。"], "tag": "主題字彙"}, {"id": "amusia-vocab-60", "mode": "vocab", "paragraph": "F", "sentence": "If no disadvantages can be found of having amusia, then it is no more a disability than having poor fashion sense or bad handwriting.", "target": "no more a disability than", "options": ["not a disability any more than the comparison is", "a more severe disability than", "exactly the same cause of disability as"], "answer": 0, "explanations": ["no more…than…借比較否定障礙的分類；此處受 If 條件限制。", "不是更嚴重。", "也不是兩者有相同病因。"], "tag": "搭配與語境義"}, {"id": "amusia-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "It is not simply that people with tone deafness (or 'amusia') are unable to sing in tune, they are also unable to discriminate between tones or recognize familiar melodies.", "target": "", "options": ["Amusia involves more than singing out of tune: the passage also describes difficulty distinguishing tones and recognizing familiar melodies.", "People with amusia have no musical difficulties beyond singing out of tune.", "People with amusia cannot hear any sound and therefore cannot recognize spoken words."], "answer": 0, "explanations": ["not simply…also…擴充問題範圍，列出唱音、辨音與旋律辨識。", "原句明確說不只唱不準，還有其他困難。", "把音樂能力問題改成完全失聰，且加入語言辨識的推論。"], "tag": "長難句理解", "structure": "It is not simply that…引出第一項；they are also…另列兩個並列不定詞 discriminate…or recognize…。"}, {"id": "amusia-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "Such a 'disorder' can occur after some sort of brain damage, but recently research has been undertaken in an attempt to discover the cause of congenital amusia (when people are born with the condition), which is not associated with any brain damage, hearing problems, or lack of exposure to music.", "target": "", "options": ["Amusia can follow brain damage, but the research discussed seeks to explain congenital cases, which the passage distinguishes from damage, hearing problems and inadequate musical exposure.", "The passage says all congenital amusia is caused by brain damage or by never hearing music.", "Research has conclusively established the cause of every form of amusia and ruled out all brain involvement."], "answer": 0, "explanations": ["保留後天可由損傷引起與先天研究對象的區別；in an attempt to 不保證已找到原因。", "which is not associated with…明確否定題中列出的解釋。", "研究目標不等於確證結果；無腦損傷也不等於大腦功能毫無關聯。"], "tag": "長難句理解", "structure": "but 連接後天發生與先天研究；when…括注 congenital；which 指先天 amusia，非所有類型。"}, {"id": "amusia-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "An amusic (a person who has the condition of amusia) can distinguish between two pitches that are far apart, but cannot tell the difference between intervals smaller than a half step on the Western diatonic scale, while most people can easily distinguish differences smaller than that.", "target": "", "options": ["According to the passage, amusics can tell widely separated pitches apart but struggle with small differences below a half step, unlike most other people.", "Amusics cannot distinguish any two pitches, no matter how far apart they are.", "Amusics detect smaller pitch differences more easily than most people do."], "answer": 0, "explanations": ["保留 can…but cannot 與 while 比較；不是完全無法辨音。", "忽略 far apart 的保留能力。", "顛倒患者與多數人的比較方向。"], "tag": "長難句理解", "structure": "主詞後括注定義 amusic；can…but cannot 並列；while 在此表對比，that 回指前述差異尺度。"}, {"id": "amusia-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "When listening to melodies which have had a single note altered so that it is out of key with the rest of the melody, they do not notice a problem.", "target": "", "options": ["When one note in a melody has been changed so that it no longer fits the key, amusics do not notice the mismatch described.", "Amusics immediately detect every altered note, even if the melody otherwise remains unchanged.", "Listeners deliberately change a melody because they have already noticed that the entire song is silent."], "answer": 0, "explanations": ["they 指 amusics；單一音被改後不合調，患者未察覺問題。", "do not notice 被反轉成 immediately detect。", "原文沒有聽眾主動改曲、整首無聲或這種因果。"], "tag": "長難句理解", "structure": "When listening…省略 they are；which…修飾 melodies；have had a note altered 為 have + O + p.p.；so that 交代改動結果。"}, {"id": "amusia-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "As would be expected, amusics perform significantly worse at singing and tapping a rhythm along with a melody than do non-amusics.", "target": "", "options": ["Amusics perform noticeably worse than people without amusia at both singing and tapping a rhythm with a melody.", "People without amusia perform worse than amusics at both tasks.", "Amusics perform worse at singing but better at rhythmic tapping than people without amusia."], "answer": 0, "explanations": ["比較涵蓋 singing 與 tapping 兩項，than do…以 do 代替 perform。", "比較方向完全相反。", "原句沒有說打節奏表現較好。"], "tag": "長難句理解", "structure": "As would be expected 為評述；at 後接兩個 V-ing；than do non-amusics 為比較子句倒裝。"}, {"id": "amusia-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "Because of music's close ties to language, it might be expected that a musical impairment may be caused by a language impairment.", "target": "", "options": ["Music’s connections with language might lead someone to expect language impairment to cause musical impairment, but this sentence presents an expectation rather than an established finding.", "The writer reports conclusive proof that every musical impairment is caused by language impairment.", "The writer says music has no connection with language and so no such expectation could arise."], "answer": 0, "explanations": ["might be expected 與 may 保留假設；下一句 however 才轉向研究結果。", "把預期與可能性改成全面確證。", "否定了 close ties。"], "tag": "長難句理解", "structure": "Because of + 名詞片語說明預期來源；it 為虛主詞，真正內容是 that 子句；may be caused 為被動可能式。"}, {"id": "amusia-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "People with brain damage in areas critical to language are often still able to sing, despite being unable to communicate through speech.", "target": "", "options": ["People whose language-related brain areas are damaged may retain singing despite losing spoken communication, as often observed in the passage.", "Anyone with damage anywhere in the brain always loses both singing and speech.", "The passage says the ability to sing guarantees that spoken communication is intact."], "answer": 0, "explanations": ["often 保留頻率限制；唱歌與口語能力可出現不同保留情況。", "areas critical to language 不是任何部位；often 不是 always。", "despite 恰好指出能唱歌不保證能說話。"], "tag": "長難句理解", "structure": "with…修飾 People；critical to language 修飾 areas；despite + being unable…為讓步，省略主詞仍指 People。"}, {"id": "amusia-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "Moreover, while amusics show deficiencies in their recognition of pitch differences in melodies, they show no such deficiencies in tonal languages.", "target": "", "options": ["Amusics’ difficulty recognizing pitch differences in melodies does not extend in the same way to tonal languages, according to the passage.", "Amusics show the same pitch-recognition deficiencies in all speech and all music.", "Speaking a tonal language makes a person incapable of developing amusia."], "answer": 0, "explanations": ["while 對比音樂與聲調語言；such 回指前述的缺陷。", "no such deficiencies 與 same deficiencies 相反。", "未聲稱聲調語言使用者不會有 amusia。"], "tag": "長難句理解", "structure": "while 在此為對比子句；their 指 amusics；no such deficiencies 的 such 承接音樂音高辨認不足。"}, {"id": "amusia-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "Amusics who speak tonal languages, such as Chinese, do not report having any difficulty discriminating between words that differ only in their intonation.", "target": "", "options": ["Amusics who use tonal languages such as Chinese do not report difficulty telling apart words differentiated only by voice pitch patterns.", "Amusics who speak Chinese report being unable to distinguish any spoken words.", "The sentence proves that every amusic speaks Chinese and recognizes all musical pitches."], "answer": 0, "explanations": ["who 限定聲調語言使用者；do not report 表述的是未報告該困難。", "把否定改成肯定，也擴張成任何詞都不能辨別。", "such as 只是舉例，不代表全部患者；亦非音樂音高能力。"], "tag": "長難句理解", "structure": "who…限定 Amusics；report + having difficulty + V-ing；that differ…修飾 words。"}, {"id": "amusia-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "Amusics are also successful most of the time at detecting the mood of a melody, can identify a speaker based on his or her voice and can discriminate and identify environmental sounds.", "target": "", "options": ["The passage says amusics usually detect a melody’s emotional character and can also identify speakers and environmental sounds.", "Amusics always identify a song’s exact notes but never recognize a familiar speaker.", "The passage says amusics cannot recognize any emotional or environmental sounds."], "answer": 0, "explanations": ["most of the time 保留通常而非總是；mood 不等於精確辨認音符或曲名。", "mood 被換成 exact notes，且辨聲能力被反轉。", "原句列出保留的能力，非全盤喪失。"], "tag": "長難句理解", "structure": "主詞 Amusics 後並列 are successful…、can identify…及 can discriminate and identify…三項謂語。"}, {"id": "amusia-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "It has long been believed that the temporal lobes, especially the right temporal lobe, are most active when engaged in musical activity, so any musical disability should logically stem from here as well.", "target": "", "options": ["An older belief that the temporal lobes are highly active in music led to the expectation that musical disability would originate there too.", "This sentence reports direct proof that every musical disability originates in the auditory cortex.", "The sentence says temporal lobes never participate in musical activity."], "answer": 0, "explanations": ["has been believed 與 should logically 表所述信念及由此產生的預期，不是直接證實。", "將信念與推論升格成全面確證，且 cortex 與 lobes 不可任意等同。", "與 most active 相反。"], "tag": "長難句理解", "structure": "It 為虛主詞；that 子句為所相信的內容；especially 補充右顳葉；so 引出推論。"}, {"id": "amusia-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "Because it has been shown that there is no hearing deficit in amusia, researchers moved on to the temporal neocortex, which is where more sophisticated processing of musical cues was thought to take place.", "target": "", "options": ["Since amusia was not found to involve a hearing deficit, researchers shifted attention to the temporal neocortex, where more complex processing had been expected.", "Finding that amusics were completely deaf made researchers abandon all study of the brain.", "The researchers proved that all sophisticated music processing takes place outside the brain."], "answer": 0, "explanations": ["保留研究轉移及 was thought to 的既有認知；不是已證明全部機制。", "no hearing deficit 被反轉；也沒有放棄腦研究。", "outside the brain 完全不是原句內容。"], "tag": "長難句理解", "structure": "Because 引導原因；which is where…為補充關係子句；was thought to take place 表先前所認為的位置。"}, {"id": "amusia-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "New studies, however, have suggested that the deficits in amusics are located outside the auditory cortex.", "target": "", "options": ["Newer studies suggested a location outside the auditory cortex for the deficits, contrasting with earlier research expectations.", "New studies conclusively proved that amusia is ordinary hearing loss in the auditory cortex.", "New studies confirmed every earlier proposal without introducing any contrast."], "answer": 0, "explanations": ["however 表轉折，suggested 保留研究證據的語氣。", "位置、聽力問題與確定程度均被改錯。", "however 及 outside 說明新結果挑戰先前方向。"], "tag": "長難句理解", "structure": "however 插入表轉折；have suggested 後 that 子句；are located outside…為位置描述。"}, {"id": "amusia-paraphrase-14", "mode": "paraphrase", "paragraph": "D", "sentence": "When changes in tones are large, their brains overreact, showing twice as much activity on the right side of the brain as a normal brain hearing the same thing.", "target": "", "options": ["For large changes in tones, the passage describes amusics’ brains as overreacting, with twice the right-side activity of a normal brain hearing the same sounds.", "Amusics show twice as much activity everywhere in the brain for all pitch changes, however small.", "Amusics’ brains show no response to large tonal changes and half the usual response to small ones."], "answer": 0, "explanations": ["條件限定 large changes；比較限定 right side 及 same sounds。", "擴大了部位與音高差範圍；小差異前句另有不同結果。", "把大變化的過度反應改成無反應，並虛構小變化數值。"], "tag": "長難句理解", "structure": "When 限定條件；showing…為分詞結果；twice as much X as Y 比較活動量；hearing…修飾 normal brain。"}, {"id": "amusia-paraphrase-15", "mode": "paraphrase", "paragraph": "D", "sentence": "These differences do not occur in the auditory cortex, indicating again that the deficits of amusia lie not in hearing impairment, but in higher processing of melodies.", "target": "", "options": ["Because the observed differences are outside the auditory cortex, the passage interprets amusia as involving higher-level melody processing rather than a hearing impairment.", "The differences occur only in the auditory cortex, proving that the ears cannot detect sound.", "The passage treats higher-level melody processing and basic hearing impairment as exactly the same thing."], "answer": 0, "explanations": ["indicating 引出本文解讀；not…but…對比問題所在。", "原文明說 do not occur in the auditory cortex。", "原句是在區分兩者，而非視為完全相同。"], "tag": "長難句理解", "structure": "These differences 回指所觀察反應差異；indicating…引出推論；lie not in A but in B 強調 B。"}, {"id": "amusia-paraphrase-16", "mode": "paraphrase", "paragraph": "E", "sentence": "Certainly the studies by Peretz that have found significant differences between the brains of so-called amusics and normal brains are legitimate.", "target": "", "options": ["The writer accepts the legitimacy of Peretz’s studies showing brain differences, despite questioning whether those differences justify the disorder label.", "The writer dismisses Peretz’s studies as fabricated and denies all brain differences.", "The writer says accepting brain differences automatically settles whether amusia is a disability."], "answer": 0, "explanations": ["Certainly 承認研究本身有效；上下文質疑的是分類意義，而非否認研究結果。", "legitimate 與 fabricated 相反。", "作者接著提出 normality 問題，並未認為分類已定案。"], "tag": "長難句理解", "structure": "主詞 studies 由 that have found…限定；主句 are legitimate；此處須與前後 skeptical／normality 一起辨認作者立場。"}, {"id": "amusia-paraphrase-17", "mode": "paraphrase", "paragraph": "E", "sentence": "Just because we recognize that basic musical ability is something that the vast majority of people have, this doesn't mean that the lack of it is abnormal.", "target": "", "options": ["The fact that basic musical ability is very common does not by itself establish that lacking it is abnormal.", "Because most people have musical ability, anyone who lacks it must necessarily be abnormal.", "The writer denies that most people have any basic musical ability."], "answer": 0, "explanations": ["否定的是從普遍性直接推到異常性的推論，而非否認普遍性。", "正是作者用 doesn’t mean 否定的推論。", "作者承認 vast majority have it。"], "tag": "長難句理解", "structure": "Just because…this doesn’t mean…否定推論關係；something that…內含關係子句；it 回指 basic musical ability。"}, {"id": "amusia-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "Musical ability is culturally valued, and may have been a factor in survival at one point in human history, but does not seem likely that it is being selected for on an evolutionary scale any longer.", "target": "", "options": ["The writer says musical ability is culturally valued and may once have aided survival, but doubts that it is still favoured by natural selection.", "The writer proves music has always been essential to survival and is becoming increasingly favoured by natural selection.", "The writer says music has no cultural value and could never have had any survival role."], "answer": 0, "explanations": ["保留 may have been 及 does not seem likely；這是作者在本文提出的判斷。", "可能變成證明，且現在的選擇壓力方向被反轉。", "culturally valued 及 may have been 均與此相反。"], "tag": "長難句理解", "structure": "and 並列文化價值與過去可能作用；but 轉折到當下；does not seem likely 後原文省略虛主詞 it，理解時不可當成標準造句範本。"}, {"id": "amusia-paraphrase-19", "mode": "paraphrase", "paragraph": "F", "sentence": "Before amusia can be declared a disability, further research must be done to determine whether lack of musical ability is actually detrimental in any way.", "target": "", "options": ["The writer argues that researchers must first establish whether a lack of musical ability causes harm before classifying amusia as a disability.", "The writer says amusia has already been proved harmful and needs no more research.", "The writer demands that research stop until every person has perfect musical ability."], "answer": 0, "explanations": ["Before…must…要求先有關於不利影響的研究；whether 表尚待判斷。", "further research must be done 與不需研究相反。", "原句沒有要求停止研究或人人達到完美能力。"], "tag": "長難句理解", "structure": "Before 子句為被動 can be declared；主句 must be done；to determine 表目的；whether 引導間接是非問句。"}, {"id": "amusia-paraphrase-20", "mode": "paraphrase", "paragraph": "F", "sentence": "If no disadvantages can be found of having amusia, then it is no more a disability than having poor fashion sense or bad handwriting.", "target": "", "options": ["If no disadvantage from amusia can be demonstrated, the writer argues that calling it a disability would be no more justified than applying that label to poor fashion sense or handwriting.", "The writer proves that amusia never has disadvantages and always causes poor handwriting.", "The writer argues that amusia is a more severe disability than poor handwriting, regardless of any evidence."], "answer": 0, "explanations": ["If 保留條件；no more…than…是分類上的類比，非共病或因果。", "條 'use strict';
const $=id=>document.getElementById(id),bank=JSON.parse($('data').textContent);let data=bank.find(a=>a.id==='deaf-to-music')||bank[0];const keyFor=a=>'reading-review-3-'+a.id+'-v1';let KEY=keyFor(data);

function stats(){if(data.pending){$('stats').textContent='此篇內文與複習題目待加入。';return}const m=mode==='reading'?'vocab':mode,qs=data.questions.filter(q=>q.mode===m),done=qs.filter(q=>progress[fingerprint(q)]),good=done.filter(q=>progress[fingerprint(q)].correct);$('stats').innerHTML=`<b>${names[m]}</b><br>最近作答：${done.length} / ${qs.length} 題<br>答對 ${good.length} 題 · 待複習 ${done.length-good.length} 題`;$('errors').textContent=wrongOnly?'返回全部題目':'重練錯題'}
function start(){for(const id of ['shuffle','errors','para','type'])$(id).disabled=!!data.pending;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=!!data.pending);document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});$('paraWrap').classList.toggle('hidden',mode==='questionVocab'||mode==='reading'||!!data.pending);$('typeWrap').classList.toggle('hidden',mode!=='vocab'||!!data.pending);$('jumpWrap').classList.toggle('hidden',mode==='reading'||!!data.pending);queue=shuffled(data.questions.filter(q=>q.mode===mode&&(mode==='questionVocab'||paragraph==='all'||q.paragraph===paragraph)&&(mode!=='vocab'||category==='all'||q.tag===category)&&(!wrongOnly||progress[fingerprint(q)]?.correct===false))).map(q=>({q,order:shuffled([0,1,2]),selected:null}));position=0;render()}

if(position>=queue.length){const answered=queue.filter(x=>x.selected!==null),good=answered.filter(x=>x.selected===x.q.answer);card.innerHTML=`<div class="result"><div class="label">ROUND COMPLETE</div><h2>這一輪已結束。</h2><p>已作答 ${answered.length} / ${queue.length} 題，其中答對 ${good.length} 題。</p><div class="actions"><button id="roundWrong">重練本輪錯題</button><button class="primary" id="again">重新洗牌練習</button></div></div>`;$('again').onclick=()=>{wrongOnly=false;start()};$('roundWrong').onclick=()=>{queue=shuffled(queue.filter(x=>x.selected!==null&&x.selected!==x.q.answer)).map(x=>({q:x.q,order:shuffled([0,1,2]),selected:null}));wrongOnly=true;position=0;render()};return}
const item=queue[position],q=item.q,done=queue.filter(x=>x.selected!==null).length;card.innerHTML=`<div class="top"><span>${mode==='questionVocab'?esc(q.source):'Paragraph '+esc(q.paragraph)} <span class="tag">${esc(q.tag)}</span></span><span id="roundCount">${wrongOnly?'錯題複習 · ':''}${position+1} / ${queue.length} · 已答 ${done} 題</span></div><progress id="roundProgress" class="progress" value="${done}" max="${queue.length}" aria-label="本輪已答題數"></progress><div class="prompt">${mode==='vocab'?'WHAT DOES THE HIGHLIGHTED EXPRESSION MEAN?':mode==='paraphrase'?'WHICH PARAPHRASE PRESERVES THE ORIGINAL MEANING?':'選出標示字詞在此語境中的中文意思'}</div><p class="sentence" lang="en">${sourceText(q)}</p><div class="answers">${item.order.map((n,i)=>`<button class="answer" data-answer="${n}" lang="${mode==='questionVocab'?'zh-Hant':'en'}"><span class="letter">${'ABC'[i]}</span><span>${esc(q.options[n])}</span></button>`).join('')}</div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="context" class="${mode==='questionVocab'?'hidden':''}">查看所在段落</button><div><button id="previous" ${position===0?'disabled':''}>上一題</button> <button id="next" class="primary" disabled>${position===queue.length-1?'查看本輪結果':'下一題 →'}</button></div></div><div id="contextText" class="context hidden"></div>`;
card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(item.selected!==null)return;item.selected=Number(b.dataset.answer);remember(q,item.selected);showFeedback(item);stats()});$('previous').onclick=()=>{position--;render()};$('next').onclick=()=>{position++;render();$('card').scrollIntoView({behavior:'smooth',block:'start'})};$('context').onclick=()=>{const c=$('contextText');c.classList.toggle('hidden');c.textContent=data.paragraphs.find(p=>p.label===q.paragraph).text;$('context').textContent=c.classList.contains('hidden')?'查看所在段落':'收起段落'};if(item.selected!==null)showFeedback(item)}
function showFeedback(item){const q=item.q,done=queue.filter(x=>x.selected!==null).length;$('roundCount').textContent=(wrongOnly?'錯題複習 · ':'')+(position+1)+' / '+queue.length+' · 已答 '+done+' 題';$('roundProgress').value=done;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const n=Number(b.dataset.answer);b.classList.toggle('correct',n===q.answer);b.classList.toggle('wrong',n===item.selected&&n!==q.answer)});const f=$('feedback');f.classList.remove('hidden');f.innerHTML=`<b>${item.selected===q.answer?'✓ 答對了':'請留意這裡'} · 正確答案 ${'ABC'[item.order.indexOf(q.answer)]}</b>${item.order.map((n,i)=>`<p><b>${'ABC'[i]} ${n===q.answer?'✓':'✕'}</b> ${esc(q.explanations[n])}</p>`).join('')}${q.structure?`<div class="syntax"><b>句構拆解</b><br>${esc(q.structure)}</div>`:''}`;$('next').disabled=false}
function configure(){paragraph='all';category='all';wrongOnly=false;$('title').textContent='Reading Review 3';$('topic').textContent='IELTS READING PRACTICE';$('partLabel').textContent='IELTS READING · PART '+data.part;document.title='Reading Review 3';KEY=keyFor(data);loadProgress();$('status').textContent='';options('para',[['all','全部段落'],...data.paragraphs.map(p=>[p.label,'Paragraph '+p.label])],'all');const tags=[...new Set(data.questions.filter(q=>q.mode==='vocab').map(q=>q.tag))];options('type',[['all','全部類型'],...tags.map(t=>[t,t])],'all');updateCounts();start()}
$('article').replaceChildren(...[1,2,3].filter(part=>bank.some(a=>a.part===part)).map(part=>{const g=document.createElement('optgroup');g.label='IELTS Reading Part '+part;const sorted=bank.filter(a=>a.part===part).sort((a,b)=>a.title.localeCompare(b.title,'en',{sensitivity:'base'}));for(const a of sorted){const o=document.createElement('option');o.value=a.id;o.textContent=a.title+(a.pending?' · 待加入':'');g.appendChild(o)}return g}));$('article').value=data.id;$('article').onchange=e=>{data=bank.find(a=>a.id===e.target.value);configure()};$('para').onchange=e=>{paragraph=e.target.value;start()};$('type').onchange=e=>{category=e.target.value;start()};$('jump').onchange=e=>{position=Number(e.target.value);render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;wrongOnly=false;start()});$('shuffle').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=false;start()};$('errors').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=!wrongOnly;start()};function updateCounts(){$('catalogSummary').textContent='已加入 '+bank.filter(a=>!a.pending).length+' / '+bank.length+' 篇 · 各篇進度分別保留';document.querySelector('.pills').classList.toggle('hidden',!!data.pending);$('countV').textContent=data.questions.filter(q=>q.mode==='vocab').length+' 題關鍵字語義';$('countP').textContent=data.questions.filter(q=>q.mode==='paraphrase').length+' 題長難句改寫';$('countQ').textContent=data.questions.filter(q=>q.mode==='questionVocab').length+' 題題目字彙選中文';}configure();
</script></body></html>
