-26", "mode": "vocab", "paragraph": "C", "sentence": "Each language evolves from one generation to the next, constantly adapting itself to cope with the learning bias of each new set of young, immature minds.", "target": "cope with", "options": ["deal successfully with", "avoid all contact with", "create intentionally"], "answer": 0, "explanations": ["cope with＝因應、應付。", "不是完全不接觸。", "不是故意製造。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-27", "mode": "vocab", "paragraph": "D", "sentence": "Those anthropologists and fossil experts who accept that speech started early still tend to think of language evolution as a gradual 2-million-year process, with our own modern human species (Homo sapiens) way at the top.", "target": "tend to", "options": ["are inclined to", "are required by law to", "always refuse to"], "answer": 0, "explanations": ["tend to＝傾向於；並非所有人一概如此。", "不是法律強制。", "不是總是拒絕。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-28", "mode": "vocab", "paragraph": "D", "sentence": "Those anthropologists and fossil experts who accept that speech started early still tend to think of language evolution as a gradual 2-million-year process, with our own modern human species (Homo sapiens) way at the top.", "target": "way at the top", "options": ["far above the others in the proposed hierarchy", "on a road leading to a mountain summit", "at the earliest point in time"], "answer": 0, "explanations": ["way 是程度副詞，強調現代人被置於演化階序頂端。", "不是通往山頂的道路。", "不是最早的時間點。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-29", "mode": "vocab", "paragraph": "D", "sentence": "A major reason for this is the perception that brain growth among humans was gradual over a similar period.", "target": "perception", "options": ["an understanding or belief about something", "conclusive physical proof", "a formally approved scientific law"], "answer": 0, "explanations": ["perception 指人們的看法、認知。", "不等於確鑿物證。", "不是已認定的科學定律。"], "tag": "常見字語境義"}, {"id": "talking-vocab-30", "mode": "vocab", "paragraph": "D", "sentence": "Several recent changes in the fossil evidence, though, bring this into doubt.", "target": "bring this into doubt", "options": ["make this view less certain", "remove all objections to this view", "show that this view is logically necessary"], "answer": 0, "explanations": ["bring into doubt＝使此看法受到質疑。", "不是消除異議。", "不是證明必然成立。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-31", "mode": "vocab", "paragraph": "E", "sentence": "The first of these is a re-dating of soil layers from the famous Olduvai Gorge in East Africa, where many key fossil remains have been found.", "target": "re-dating", "options": ["estimating the age again", "arranging a second social meeting", "moving objects to a new excavation site"], "answer": 0, "explanations": ["re-dating 指重新測定年代。", "不是再次約會。", "不是搬移遺物。"], "tag": "主題字彙"}, {"id": "talking-vocab-32", "mode": "vocab", "paragraph": "E", "sentence": "The first of these is a re-dating of soil layers from the famous Olduvai Gorge in East Africa, where many key fossil remains have been found.", "target": "fossil remains", "options": ["preserved traces or parts of ancient organisms", "living animals found during excavation", "all the soil left after digging"], "answer": 0, "explanations": ["fossil remains＝化石遺存。", "不是仍活著的動物。", "不是挖掘後所有土壤。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-33", "mode": "vocab", "paragraph": "E", "sentence": "A number of big-brained human species appear to be much older than previously thought, with several specimens dating from over a million years ago.", "target": "specimens", "options": ["individual examples examined for research", "scientists who examine fossils", "hypothetical creatures without physical examples"], "answer": 0, "explanations": ["specimens＝供研究的標本、個體樣本。", "不是研究者。", "不是只有假想、毫無實物。"], "tag": "常見字語境義"}, {"id": "talking-vocab-34", "mode": "vocab", "paragraph": "E", "sentence": "A number of big-brained human species appear to be much older than previously thought, with several specimens dating from over a million years ago.", "target": "dating from", "options": ["originating in a particular time", "being examined for the first time in", "being damaged after"], "answer": 0, "explanations": ["date from＝可追溯至、源於某年代。", "不是首次檢查的日期。", "不是受損時間。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-35", "mode": "vocab", "paragraph": "E", "sentence": "When brain sizes for all available skulls are plotted against time using the revised dates, the result is startling: the bulk of increases in brain size was over by around 1.2 million years ago, with some African human species having brain volumes easily within the modern human range by that time.", "target": "plotted against", "options": ["represented on a graph in relation to", "secretly planned in opposition to", "physically stacked on top of"], "answer": 0, "explanations": ["plotted against time＝以時間為對照繪於圖表。", "plot 此處不是密謀。", "不是實體堆放。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-36", "mode": "vocab", "paragraph": "E", "sentence": "When brain sizes for all available skulls are plotted against time using the revised dates, the result is startling: the bulk of increases in brain size was over by around 1.2 million years ago, with some African human species having brain volumes easily within the modern human range by that time.", "target": "the bulk of", "options": ["the majority or main part of", "a tiny exceptional part of", "the physical weight alone of"], "answer": 0, "explanations": ["the bulk of＝大部分。", "不是少數例外。", "此處不是只指重量。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-37", "mode": "vocab", "paragraph": "E", "sentence": "When brain sizes for all available skulls are plotted against time using the revised dates, the result is startling: the bulk of increases in brain size was over by around 1.2 million years ago, with some African human species having brain volumes easily within the modern human range by that time.", "target": "was over", "options": ["had finished", "had not yet begun", "had doubled in amount"], "answer": 0, "explanations": ["was over＝已結束；主詞是大部分腦容量增長。", "不是尚未開始。", "不是翻倍。"], "tag": "常見字語境義"}, {"id": "talking-vocab-38", "mode": "vocab", "paragraph": "E", "sentence": "When brain sizes for all available skulls are plotted against time using the revised dates, the result is startling: the bulk of increases in brain size was over by around 1.2 million years ago, with some African human species having brain volumes easily within the modern human range by that time.", "target": "within the modern human range", "options": ["inside the span of values found in modern humans", "larger than every modern human brain", "limited to modern humans’ geographical territory"], "answer": 0, "explanations": ["指腦容量已落在現代人的數值範圍內。", "不是比所有現代人都大。", "range 此處不是地理活動區。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-39", "mode": "vocab", "paragraph": "F", "sentence": "So, we have the paradox that over the period when our brain was growing most rapidly, our material cultural development, as measured by stone tools, advanced only marginally; then, over a million years later, when the development of anatomically modern humans finally started to accelerate, artistically and technologically, our brains were actually getting smaller.", "target": "paradox", "options": ["a situation that seems contradictory or contrary to expectation", "a fact that has no possible explanation", "a proven error in every measurement"], "answer": 0, "explanations": ["paradox＝看似矛盾、違反直覺的情況。", "不表示絕不可能解釋。", "不是所有測量都出錯。"], "tag": "主題字彙"}, {"id": "talking-vocab-40", "mode": "vocab", "paragraph": "F", "sentence": "So, we have the paradox that over the period when our brain was growing most rapidly, our material cultural development, as measured by stone tools, advanced only marginally; then, over a million years later, when the development of anatomically modern humans finally started to accelerate, artistically and technologically, our brains were actually getting smaller.", "target": "material cultural development", "options": ["progress in physical products of culture such as tools", "changes in genetic material alone", "improvement in people’s manners alone"], "answer": 0, "explanations": ["material culture 指工具等物質文化。", "不是僅指遺傳物質。", "不是只指禮貌。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-41", "mode": "vocab", "paragraph": "F", "sentence": "So, we have the paradox that over the period when our brain was growing most rapidly, our material cultural development, as measured by stone tools, advanced only marginally; then, over a million years later, when the development of anatomically modern humans finally started to accelerate, artistically and technologically, our brains were actually getting smaller.", "target": "as measured by", "options": ["as assessed using", "as directly caused by", "as deliberately concealed by"], "answer": 0, "explanations": ["as measured by stone tools＝以石器作為衡量依據。", "衡量指標不等於原因。", "不是隱瞞。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-42", "mode": "vocab", "paragraph": "F", "sentence": "So, we have the paradox that over the period when our brain was growing most rapidly, our material cultural development, as measured by stone tools, advanced only marginally; then, over a million years later, when the development of anatomically modern humans finally started to accelerate, artistically and technologically, our brains were actually getting smaller.", "target": "marginally", "options": ["only to a small degree", "at the outer edge of a page", "at an extremely rapid rate"], "answer": 0, "explanations": ["advanced marginally＝僅略有進展。", "不是在頁面邊緣。", "不是極速進展。"], "tag": "主題字彙"}, {"id": "talking-vocab-43", "mode": "vocab", "paragraph": "F", "sentence": "So, we have the paradox that over the period when our brain was growing most rapidly, our material cultural development, as measured by stone tools, advanced only marginally; then, over a million years later, when the development of anatomically modern humans finally started to accelerate, artistically and technologically, our brains were actually getting smaller.", "target": "anatomically", "options": ["in terms of bodily structure", "in terms of artistic style", "in terms of spoken vocabulary"], "answer": 0, "explanations": ["anatomically modern＝身體構造上屬現代型的。", "不是藝術風格。", "不是詞彙範圍。"], "tag": "主題字彙"}, {"id": "talking-vocab-44", "mode": "vocab", "paragraph": "G", "sentence": "The additional piece of evidence that makes this paradox all the more significant is that brain size did not just leap between human species in a direct line of ascent towards ourselves.", "target": "all the more", "options": ["even more", "no more", "equally but not more"], "answer": 0, "explanations": ["all the more significant＝更加重要、顯著。", "不是不再重要。", "不是程度完全相同。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-45", "mode": "vocab", "paragraph": "G", "sentence": "The additional piece of evidence that makes this paradox all the more significant is that brain size did not just leap between human species in a direct line of ascent towards ourselves.", "target": "a direct line of ascent", "options": ["a single straight evolutionary progression towards modern humans", "a vertical route up a mountain", "a written list of unrelated species"], "answer": 0, "explanations": ["指直線式向現代人演進的單一路徑。", "不是登山路線。", "不是互不相關的清單。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-46", "mode": "vocab", "paragraph": "G", "sentence": "Over the period from 2.5 to 1.5 million years ago, brains were growing more rapidly than at any time since, within all the different human species.", "target": "at any time since", "options": ["at any point after that period", "at any point before that period", "only at the exact start of that period"], "answer": 0, "explanations": ["since 指該時期之後；比較其後任何時間。", "不是該時期之前。", "不是只有起點那一刻。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-47", "mode": "vocab", "paragraph": "G", "sentence": "The logical conclusion is that there must have been a unique new behaviour driving brain growth, shared between all species of humans.", "target": "must have been", "options": ["is inferred with strong confidence to have existed", "was legally required to exist", "is known to be impossible"], "answer": 0, "explanations": ["must have been 在此是對過去的強烈推論。", "不是法律義務。", "不是判定不可能。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-48", "mode": "vocab", "paragraph": "H", "sentence": "The answer may have been staring us in the face.", "target": "staring us in the face", "options": ["being obvious although not properly noticed", "watching us with hostile eyes", "remaining impossible to discover"], "answer": 0, "explanations": ["stare someone in the face＝明擺在眼前卻可能未被注意。", "不是敵意瞪視。", "不是不可能發現。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-49", "mode": "vocab", "paragraph": "H", "sentence": "Around 2.5 million years ago, the weather took a decided turn for the worse, becoming more variable and colder and drier.", "target": "took a decided turn for the worse", "options": ["became clearly worse", "was intentionally made worse by a person", "changed direction without becoming worse"], "answer": 0, "explanations": ["take a turn for the worse＝惡化；decided 強調明顯。", "decided 此處不是有人決定使它變差。", "不是只改方向而未變差。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-50", "mode": "vocab", "paragraph": "H", "sentence": "Around 2.5 million years ago, the weather took a decided turn for the worse, becoming more variable and colder and drier.", "target": "variable", "options": ["likely to change rather than stay steady", "always warm and wet", "changing according to a fixed daily timetable only"], "answer": 0, "explanations": ["variable 指天氣多變、不穩定。", "不是總是溫暖潮濕。", "也不是僅依固定日程變化。"], "tag": "主題字彙"}, {"id": "talking-vocab-51", "mode": "vocab", "paragraph": "H", "sentence": "The search for food became more taxing, and there would have been a real need to communicate more effectively and cope with the worsening environment in a co-operative way.", "target": "taxing", "options": ["requiring considerable effort", "requiring payment to the government", "easy to complete without effort"], "answer": 0, "explanations": ["taxing＝費力、吃力的。", "不是向政府繳稅。", "不是輕鬆不費力。"], "tag": "常見字語境義"}, {"id": "talking-vocab-52", "mode": "vocab", "paragraph": "H", "sentence": "The search for food became more taxing, and there would have been a real need to communicate more effectively and cope with the worsening environment in a co-operative way.", "target": "would have been", "options": ["is inferred to have existed in the past", "is guaranteed to exist in the future", "was explicitly denied to have existed"], "answer": 0, "explanations": ["there would have been a need 是對當時需求的推斷。", "不是未來保證。", "不是否認過去存在。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-53", "mode": "vocab", "paragraph": "H", "sentence": "Our brain, which had developed to manipulate and organise complex symbolic aspects of speech internally, could now be turned to a variety of other tasks.", "target": "manipulate", "options": ["handle or work with mentally", "deceive other people for personal gain", "move physical speech organs by hand"], "answer": 0, "explanations": ["manipulate symbolic aspects 指在心智中處理、運用符號。", "不是操縱他人謀利。", "不是用手移動器官。"], "tag": "常見字語境義"}, {"id": "talking-vocab-54", "mode": "vocab", "paragraph": "H", "sentence": "Our brain, which had developed to manipulate and organise complex symbolic aspects of speech internally, could now be turned to a variety of other tasks.", "target": "be turned to", "options": ["be applied or directed to", "be physically rotated towards only", "be permanently excluded from"], "answer": 0, "explanations": ["be turned to other tasks＝被用於其他任務。", "不是僅指實體旋轉。", "不是被排除在外。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-55", "mode": "vocab", "paragraph": "I", "sentence": "Cultural evolution aided by communication and teaching is a cumulative iterative process.", "target": "cumulative", "options": ["increasing through additions over time", "restarting from nothing each time", "remaining unchanged across generations"], "answer": 0, "explanations": ["cumulative＝逐步累積的。", "不是每次從零開始。", "不是代代不變。"], "tag": "主題字彙"}, {"id": "talking-vocab-56", "mode": "vocab", "paragraph": "I", "sentence": "Cultural evolution aided by communication and teaching is a cumulative iterative process.", "target": "iterative", "options": ["involving a repeated process or cycle", "occurring only once", "progressing without repetition of any process"], "answer": 0, "explanations": ["iterative＝反覆進行的、迭代的。", "不是只發生一次。", "不是完全沒有重複過程。"], "tag": "主題字彙"}, {"id": "talking-vocab-57", "mode": "vocab", "paragraph": "I", "sentence": "If each new generation invented just one new skill or idea and passed it on with the rest to their children and cousins, you could predict exactly the same curve of cultural advance as we see from the archaeological and historical record – first very slowly, then faster and faster.", "target": "passed it on", "options": ["transmitted it to others", "refused to accept it", "lost it beyond recovery"], "answer": 0, "explanations": ["pass on a skill or idea＝傳授、傳承。", "不是拒絕接受。", "不是遺失。"], "tag": "搭配與語境義"}, {"id": "talking-vocab-58", "mode": "vocab", "paragraph": "I", "sentence": "If each new generation invented just one new skill or idea and passed it on with the rest to their children and cousins, you could predict exactly the same curve of cultural advance as we see from the archaeological and historical record – first very slowly, then faster and faster.", "target": "record", "options": ["the surviving evidence of past events", "a newly achieved sporting best", "a sound recording of ancient conversations"], "answer": 0, "explanations": ["archaeological and historical record＝考古與歷史記錄、證據。", "不是運動紀錄。", "不是遠古談話錄音。"], "tag": "常見字語境義"}, {"id": "talking-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "One view of language development, held by linguists such as Noam Chomsky and anthropologists such as Richard Klein, is that language, specifically the spoken word, appeared suddenly among modern humans a mere 35,000 to 50,000 years ago and that the ability to speak words and use syntax was recently genetically hard-wired into our brains in a kind of language organ.", "target": "", "options": ["One theory holds that spoken language arose suddenly 35,000–50,000 years ago and that speech and syntax had recently become genetically built into the brain.", "The writer establishes as fact that all language began gradually millions of years ago without any genetic involvement.", "Chomsky’s theory says that writing appeared 35,000–50,000 years ago and that syntax was learned entirely from schooling."], "answer": 0, "explanations": ["One view…is that…and that…並列介紹兩項理論主張；不是作者確證的事實。", "錯在觀點歸屬、年代及 sudden／gradual；原句介紹一種理論。", "原句 specifically the spoken word 指口語；genetically hard-wired 也不等於靠學校教學。"], "tag": "長難句理解", "structure": "主詞 One view 後的 held by…是分詞修飾；is 後兩個 that 子句並列說明該理論。"}, {"id": "talking-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "This view of language is associated with the old idea that logical thought is dependent on words, a concept originating with Plato and much in vogue in the 19th century – that is, animals do not speak because they do not think.", "target": "", "options": ["This language theory is linked to an older belief that words are necessary for logical thought, a belief traced to Plato and popular in the nineteenth century.", "Plato proved in the nineteenth century that animals could think logically because they could speak.", "The nineteenth-century belief was that logical thought develops independently of words in all animals."], "answer": 0, "explanations": ["保留 associated with、dependent on 及 concept 的指涉；這是舊觀念的介紹。", "柏拉圖不是十九世紀人物；原句也沒有 proved，且動物部分被反轉。", "原句 dependent on words，並非 independent of words。"], "tag": "長難句理解", "structure": "a concept…同位說明 old idea；originating…與 in vogue…修飾這個觀念；that is 引出其含意。"}, {"id": "talking-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "However, the abstract thought demonstrated in 20th-century experiments with chimpanzees and bonobos puts this theory in doubt.", "target": "", "options": ["Experiments showing abstract thinking in chimpanzees and bonobos cast doubt on the theory just described.", "The experiments conclusively proved that all animals use human syntax.", "The absence of abstract thought in the animals supported the theory."], "answer": 0, "explanations": ["However 引出反證，puts…in doubt 表示使理論受到質疑。", "原文沒有證實所有動物使用人類句法；質疑不是這種全面結論。", "demonstrated 指已呈現抽象思考，不是 absence。"], "tag": "長難句理解", "structure": "主詞核心是 abstract thought；demonstrated…為過去分詞修飾；謂語 puts…in doubt。"}, {"id": "talking-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "He argued that spoken language had developed out of gesture language (langage d’action) and that both were inventions arising initially from the simple association between action and object.", "target": "", "options": ["Condillac argued that speech grew out of gesture language and that both began as inventions linking actions with objects.", "Condillac argued that gestures appeared only after a fully formed spoken language already existed.", "Condillac denied that either speech or gestures had any connection with actions or objects."], "answer": 0, "explanations": ["He 指 Condillac；that…and that…並列兩項主張，both 指口語與手勢語言。", "發展順序反了：spoken language developed out of gesture language。", "原句明說 arising…from the simple association between action and object。"], "tag": "長難句理解", "structure": "argued 後接兩個並列 that 子句；arising…修飾 inventions，交代起源。"}, {"id": "talking-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "The theory sees gesture language as arising originally among apes as sounds accompanying gestures, with these sounds gradually becoming coded into ‘words’ as the new skill drove its own evolution.", "target": "", "options": ["The theory proposes that gestures among apes were accompanied by sounds, which gradually became words as the developing skill helped drive its own evolution.", "The theory says apes began with complete words and then abandoned them in favour of silent gestures.", "The writer reports that all apes now communicate with a fully developed human language."], "answer": 0, "explanations": ["保留理論歸屬、逐步編碼及演化互動；不是報告現今所有猿類的語言能力。", "聲音逐漸成詞的順序被反轉，且原文沒有 abandoned。", "理論描述起源，不是宣稱今日所有猿類具有完整人類語言。"], "tag": "長難句理解", "structure": "sees X as…；with + sounds + becoming…補充伴隨發展；as 子句說明新技能推動演化。"}, {"id": "talking-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "Evolutionary pressures promoted the development of anatomy geared to speech – the larynx, vocal muscles and a specific part of the brain immediately next to the part responsible for gestures.", "target": "", "options": ["Evolutionary pressures encouraged speech-related bodily development, including a brain area next to the area involved in gestures.", "Evolution created a speech area far away from every area associated with gestures.", "Pressure from language teachers created vocal muscles and replaced the larynx."], "answer": 0, "explanations": ["geared to speech 表適合說話功能；immediately next to 指緊鄰手勢相關部位。", "far away 與 immediately next to 相反。", "原文是 evolutionary pressures，不是教學壓力；也沒有 replaced the larynx。"], "tag": "長難句理解", "structure": "破折號後列舉 anatomy 的部位；responsible for gestures 修飾第二個 part。"}, {"id": "talking-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "The view that spoken language was ultimately a cultural invention like tool-making, which then drove the biological evolution of the brain and vocal apparatus, seems obvious when you think of the development of different languages.", "target": "", "options": ["The writer considers it plausible that speech began as a cultural invention which then helped drive biological changes, in light of how different languages develop.", "The writer argues that biological changes first created French and that culture had no role.", "The writer says tool-making and speech are identical skills controlled by one organ."], "answer": 0, "explanations": ["主句 seems obvious 表作者看法；like tool-making 是類比，非把兩技能視為相同。", "反轉文化發明推動生物演化的方向，且忽略文化因素。", "like 只是類比；原句沒有同一器官的結論。"], "tag": "長難句理解", "structure": "主詞 The view 內含 that 同位子句；which then drove…承接口語作為文化發明的發展；主句動詞 seems。"}, {"id": "talking-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "The unique features of a language such as French clearly do not result from any physiological aspect of being French but are the cultural possessions of the French-speaking community.", "target": "", "options": ["The distinctive features of French are cultural properties of its speech community rather than consequences of French people’s physiology.", "French differs from other languages because French people have unique vocal organs.", "French speakers share identical cultural possessions because they are genetically identical."], "answer": 0, "explanations": ["not… but…對比生理來源與文化歸屬；此處支持文化層面的解釋。", "原文明確否定由法國人的生理特徵解釋法語特色。", "原文未宣稱基因相同，也不是在談所有文化財物完全一致。"], "tag": "長難句理解", "structure": "主詞 unique features；do not result from… but are…為兩個對比謂語。"}, {"id": "talking-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "Each language evolves from one generation to the next, constantly adapting itself to cope with the learning bias of each new set of young, immature minds.", "target": "", "options": ["Languages change across generations, continually adjusting to the learning tendencies of successive groups of young learners.", "Languages remain fixed because every new generation has exactly the same learning habits.", "Young people must first change their physiology before they can learn a language."], "answer": 0, "explanations": ["保留跨世代演化及語言適應學習者傾向的方向。", "evolves 與 constantly adapting 不支持保持不變。", "原句沒有要求學習前先改變生理結構。"], "tag": "長難句理解", "structure": "constantly adapting…為分詞片語，主詞仍是 Each language；to cope with 說明適應目的。"}, {"id": "talking-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "Those anthropologists and fossil experts who accept that speech started early still tend to think of language evolution as a gradual 2-million-year process, with our own modern human species (Homo sapiens) way at the top.", "target": "", "options": ["Even experts who accept an early start for speech often still picture a gradual two-million-year evolution culminating in modern humans.", "Every anthropologist agrees that language began only 35,000 years ago.", "Experts who accept early speech deny that language evolved over time."], "answer": 0, "explanations": ["who 子句限定某些專家；still tend to 保留傾向與讓步，不是全體共識。", "Those…who…不是所有學者；年代亦不符本句。", "他們接受漸進演化，並非否定演化。"], "tag": "長難句理解", "structure": "Those…who accept…限定主詞；think of X as Y；with…補充其階序中現代人的位置。"}, {"id": "talking-paraphrase-11", "mode": "paraphrase", "paragraph": "E", "sentence": "A number of big-brained human species appear to be much older than previously thought, with several specimens dating from over a million years ago.", "target": "", "options": ["Revised evidence makes several large-brained human species seem older than previously believed, with some specimens over a million years old.", "Every large-brained human specimen has been proved to be exactly one million years old.", "The new dates indicate that all large-brained human species are younger than previously believed."], "answer": 0, "explanations": ["appear 保留推測；a number of／several 不等於全部，over 也不等於 exactly。", "把部分、推估及超過的限制全部刪除了。", "older 被反轉成 younger。"], "tag": "長難句理解", "structure": "appear to be 表呈現出的判斷；than previously thought 省略 they were；with…補充標本年代。"}, {"id": "talking-paraphrase-12", "mode": "paraphrase", "paragraph": "E", "sentence": "When brain sizes for all available skulls are plotted against time using the revised dates, the result is startling: the bulk of increases in brain size was over by around 1.2 million years ago, with some African human species having brain volumes easily within the modern human range by that time.", "target": "", "options": ["Using revised dates to graph skull sizes suggests that most brain enlargement had finished by about 1.2 million years ago, and some species were already within the modern range.", "The revised graph shows that brain enlargement began exactly 1.2 million years ago and continued unchanged thereafter.", "Every African human species already had a brain larger than any modern human brain by 1.2 million years ago."], "answer": 0, "explanations": ["保留 most、about、some 及 within range；不是所有增長都終止或所有物種都相同。", "was over 是已結束，不是開始；around 不是 exactly。", "some 不等於 every，within range 也不是大於所有現代人。"], "tag": "長難句理解", "structure": "When 引導被動時間子句；冒號後說明 startling result；with + species + having…補充結果。"}, {"id": "talking-paraphrase-13", "mode": "paraphrase", "paragraph": "F", "sentence": "So, we have the paradox that over the period when our brain was growing most rapidly, our material cultural development, as measured by stone tools, advanced only marginally; then, over a million years later, when the development of anatomically modern humans finally started to accelerate, artistically and technologically, our brains were actually getting smaller.", "target": "", "options": ["Material culture changed little during the fastest brain growth, whereas much later artistic and technological development accelerated while brains were becoming smaller.", "Artistic and technological progress always increased in direct proportion to brain size.", "Brains became larger only after stone tools had stopped changing and modern cultural development had ended."], "answer": 0, "explanations": ["句子對照兩個時期，形成腦容量與文化進展不呈簡單正比的矛盾。", "正比說法與兩時期的反差相反。", "原句未說石器停止改變，也未說文化發展結束。"], "tag": "長難句理解", "structure": "paradox 後 that 子句含兩時期；over the period when…對 then…when…；as measured by 指衡量依據。"}, {"id": "talking-paraphrase-14", "mode": "paraphrase", "paragraph": "G", "sentence": "The additional piece of evidence that makes this paradox all the more significant is that brain size did not just leap between human species in a direct line of ascent towards ourselves.", "target": "", "options": ["What strengthens the paradox is that brain enlargement was not confined to a single direct evolutionary line leading to modern humans.", "Brain enlargement happened only along the direct ancestral line that produced modern humans.", "The paradox disappears because only modern humans experienced any brain growth."], "answer": 0, "explanations": ["not just 否定僅限單一路徑；all the more significant 是更顯重要。", "only 與 did not just…相衝突。", "不是矛盾消失，也不是只有現代人有腦容量增長。"], "tag": "長難句理解", "structure": "主詞 evidence 由 that makes…修飾；is that…表語子句；not just 限定被否定的範圍。"}, {"id": "talking-paraphrase-15", "mode": "paraphrase", "paragraph": "G", "sentence": "Over the period from 2.5 to 1.5 million years ago, brains were growing more rapidly than at any time since, within all the different human species.", "target": "", "options": ["Between 2.5 and 1.5 million years ago, brain growth within all the different human species was faster than at any later time.", "From 2.5 to 1.5 million years ago, brain growth was faster than at every earlier time in history.", "Brain growth began only 1.5 million years ago and was restricted to one species."], "answer": 0, "explanations": ["since 指這段時期之後；within all…並非只有單一物種。", "earlier 反轉了 since 的比較時間範圍。", "原文給的是快速增長區間，不是起始點，且明說 all different species。"], "tag": "長難句理解", "structure": "句首時間片語限定區間；more rapidly than…比較速率；since 省略該時期之後的重複時間內容。"}, {"id": "talking-paraphrase-16", "mode": "paraphrase", "paragraph": "G", "sentence": "The logical conclusion is that there must have been a unique new behaviour driving brain growth, shared between all species of humans.", "target": "", "options": ["The writer infers that a new behaviour shared by all human species must have been driving brain growth.", "Direct fossil recordings conclusively show that every species used exactly the same words.", "The writer concludes that each species had an unrelated behaviour with no common factor."], "answer": 0, "explanations": ["must have been 是強烈推論；本句還沒有直接證實某套共同詞語。", "原文無化石錄音或詞語證據，不能把推論改成直接觀測。", "shared between all species 與彼此毫無共同因素相反。"], "tag": "長難句理解", "structure": "conclusion 後 that 子句；driving…與 shared…均修飾 behaviour，後者為過去分詞片語。"}, {"id": "talking-paraphrase-17", "mode": "paraphrase", "paragraph": "H", "sentence": "Namely, that not only early humans but their ancestors had started the trend in the very useful skill of verbal communication.", "target": "", "options": ["The proposed answer is that verbal communication had begun not only among early humans but also among their ancestors.", "The proposed answer is that only early modern humans communicated and their ancestors did not.", "The writer denies any connection between communication and early brain growth."], "answer": 0, "explanations": ["Namely 補充上一句的 answer；not only…but…把祖先也納入，仍屬作者提出的解釋。", "把 not only…but…錯讀成 only。", "上下文明確以溝通解釋腦容量快速增長，並非否認相關性。"], "tag": "長難句理解", "structure": "這是承接前句的補充片段；not only A but B 並列主詞，had started 為共同謂語。"}, {"id": "talking-paraphrase-18", "mode": "paraphrase", "paragraph": "H", "sentence": "The search for food became more taxing, and there would have been a real need to communicate more effectively and cope with the worsening environment in a co-operative way.", "target": "", "options": ["As finding food became harder, the writer infers a need for more effective communication and cooperation in dealing with a worsening environment.", "The writer proves that agriculture made food plentiful and eliminated the need for speech.", "Because the environment improved, humans no longer needed to cooperate in finding food."], "answer": 0, "explanations": ["would have been 保留對當時需求的推斷；taxing 指費力。", "沒有提農業；更難覓食也不是食物充足。", "worsening 被改成 improved，合作需求亦被反轉。"], "tag": "長難句理解", "structure": "and 並列兩分句；a need 後 to communicate…and cope…為並列不定詞；in a co-operative way 說明方式。"}, {"id": "talking-paraphrase-19", "mode": "paraphrase", "paragraph": "H", "sentence": "The near maximum in brain size achieved by 1.2 million years ago indicates that those early ancestors could already have been talking perfectly well.", "target": "", "options": ["The writer suggests that brain size near its maximum by 1.2 million years ago may mean early ancestors were already speaking effectively.", "The writer directly observes and proves that ancestors spoke the same languages as people today exactly 1.2 million years ago.", "The writer claims that early ancestors could not speak until their brains became much larger than modern brains."], "answer": 0, "explanations": ["indicates…could already have been 表由腦容量作出的可能性推論；未指特定語言。", "沒有直接觀測、同樣語言或精確日期的證據。", "could already have been talking 與不能說話相反，near maximum 也非超越現代。"], "tag": "長難句理解", "structure": "主詞 near maximum 由 achieved…修飾；indicates 後 that 子句；could + already + have been + V-ing 表過去可能已有的能力。"}, {"id": "talking-paraphrase-20", "mode": "paraphrase", "paragraph": "I", "sentence": "If each new generation invented just one new skill or idea and passed it on with the rest to their children and cousins, you could predict exactly the same curve of cultural advance as we see from the archaeological and historical record – first very slowly, then faster and faster.", "target": "", "options": ["If generations accumulated and transmitted even one new idea each, the resulting cultural growth could match the historical pattern of slow progress followed by acceleration.", "The writer establishes that every generation invented exactly one idea and no more.", "The writer predicts that cultural progress must slow down because each generation loses all earlier knowledge."], "answer": 0, "explanations": ["If 是條件模型，非實際每代發明數的紀錄；with the rest 表先前成果也一同傳承。", "把假設條件錯當已核實事實；just one 用來說明即使少量新增也能累積。", "passed it on with the rest 是累積傳承，不是全部遺失；速度亦被反轉。"], "tag": "長難句理解", "structure": "If 子句含 invented…and passed…；主句 could predict；as we see…比較預測曲線與實際記錄。"}, {"id": "look-who-was-talking-qv2-1", "mode": "questionVocab", "paragraph": "", "sentence": "The development of human speech can be traced back to apes.", "target": "traced back to", "options": ["追溯至……的起源", "認定完全由……負責", "逐字翻譯成……"], "answer": 0, "explanations": ["trace back to 指追查來源、起點。 本題辨認原題用字；該敘述是否符合文章須
