</style></head><body><header><div class="brand">Reading Room</div><div class="part" id="partLabel">IELTS READING</div></header><main><section class="hero"><div class="label" id="topic">IELTS READING PRACTICE</div><h1 id="title">Reading Review 3</h1><p class="minor" id="catalogSummary"></p><div class="pills"><span class="pill" id="countV"></span><span class="pill" id="countP"></span><span class="pill" id="countQ"></span></div></section><div class="layout"><aside class="side"><h2>篇章與複習設定</h2><label for="article">閱讀篇章｜Part 分類 · A–Z</label><select id="article"></select><div id="paraWrap"><label for="para">段落範圍</label><select id="para"></select></div><div id="typeWrap"><label for="type">字詞類型</label><select id="type"></select></div><div class="stats" id="stats" aria-live="polite"></div><button id="shuffle">重新洗牌練習</button><button id="errors">重練錯題</button><p class="hint">每輪題目與選項隨機排列，同輪不重複。作答後可查看各選項解析。</p><p class="hint">進度保留在目前瀏覽器，不會跨裝置同步。</p><div id="status" role="status"></div></aside><section><nav class="tabs" aria-label="複習模式"><button data-mode="vocab">01 關鍵字語義</button><button data-mode="paraphrase">02 長難句改寫</button><button data-mode="questionVocab">03 題目字彙｜選中文</button><button data-mode="reading">原文閱讀</button></nav><div class="jump" id="jumpWrap"><label for="jump">跳至本輪題目</label><select id="jump"></select></div><div class="card" id="card"></div><p class="footer">先找主幹，再核對修飾範圍、否定、比較與作者態度。</p></section></div></main><script id="data" type="application/json">[{"id": "spider-web", "title": "Spider web", "sourceTitle": "Spider silk", "subtitle": "A strong, light bio-material made by genes from spiders could transform construction and industry", "part": 1, "topic": "BIOMATERIALS · GENETICS · MANUFACTURING", "paragraphs": [{"label": "A", "text": "Scientists have succeeded in copying the silk-producing genes of the Golden Orb Weaver spider and are using them to create a synthetic material which they believe is the model for a new generation of advanced bio-materials. The new material, biosilk, which has been spun for the first time by researchers at DuPont, has an enormous range of potential uses in construction and manufacturing."}, {"label": "B", "text": "The attraction of the silk spun by the spider is a combination of great strength and enormous elasticity, which man-made fibres have been unable to replicate. On an equal-weight basis, spider silk is far stronger than steel and it is estimated that if a single strand could be made about 10m in diameter, it would be strong enough to stop a jumbo jet in flight. A third important factor is that it is extremely light. Army scientists are already looking at the possibilities of using it for lightweight, bulletproof vests and parachutes."}, {"label": "C", "text": "For some time, biochemists have been trying to synthesise the drag-line silk of the Golden Orb Weaver. The drag-line silk, which forms the radial arms of the web, is stronger than the other parts of the web and some biochemists believe a synthetic version could prove to be as important a material as nylon, which has been around for 50 years, since the discoveries of Wallace Carothers and his team ushered in the age of polymers."}, {"label": "D", "text": "To recreate the material, scientists, including Randolph Lewis at the University of Wyoming, first examined the silk-producing gland of the spider. 'We took out the glands that produce the silk and looked at the coding for the protein material they make, which is spun into a web. We then went looking for clones with the right DNA,' he says."}, {"label": "E", "text": "At DuPont, researchers have used both yeast and bacteria as hosts to grow the raw material, which they have spun into fibres. Robert Dorsch, DuPont's director of biochemical development, says the globules of protein, comparable with marbles in an egg, are harvested and processed. 'We break open the bacteria, separate out the globules of protein and use them as the raw starting material. With yeast, the gene system can be designed so that the material excretes the protein outside the yeast for better access,' he says."}, {"label": "F", "text": "'The bacteria and the yeast produce the same protein, equivalent to that which the spider uses in the draglines of the web. The spider mixes the protein into a water-based solution and then spins it into a solid fibre in one go. Since we are not as clever as the spider and we are not using such sophisticated organisms, we substituted man-made approaches and dissolved the protein in chemical solvents, which are then spun to push the material through small holes to form the solid fibre.'"}, {"label": "G", "text": "Researchers at DuPont say they envisage many possible uses for a new biosilk material. They say that earthquake-resistant suspension bridges hung from cables of synthetic spider silk fibres may become a reality. Stronger ropes, safer seat belts, shoe soles that do not wear out so quickly and tough new clothing are among the other applications. Biochemists such as Lewis see the potential range of uses of biosilk as almost limitless. 'It is very strong and retains elasticity: there are no man-made materials that can mimic both these properties. It is also a biological material with all the advantages that have over petrochemicals,' he says."}, {"label": "H", "text": "At DuPont's laboratories, Dorsch is excited by the prospect of new super-strong materials but he warns they are many years away. 'We are at an early stage but theoretical predictions are that we will wind up with a very strong, tough material, with an ability to absorb shock, which is stronger and tougher than the man-made materials that are conventionally available to us,' he says."}, {"label": "I", "text": "The spider is not the only creature that has aroused the interest of material scientists. They have also become envious of the natural adhesive secreted by the sea mussel. It produces a protein adhesive to attach itself for rocks. It is tedious and expensive to extract  the man-made materials that are conventionally available to us,' he says.", "target": "wind up with", "options": ["eventually end up having", "wrap tightly around", "lose completely before starting"], "answer": 0, "explanations": ["wind up with＝最後得到、最終擁有。", "不是捲繞。", "不是開始前失去。"], "tag": "Phrasal verb"}, {"id": "spider-v-56", "mode": "vocab", "paragraph": "H", "sentence": "'We are at an early stage but theoretical predictions are that we will wind up with a very strong, tough material, with an ability to absorb shock, which is stronger and tougher than the man-made materials that are conventionally available to us,' he says.", "target": "absorb shock", "options": ["take in or reduce the effect of a sudden impact", "feel emotionally surprised by news", "allow every impact to pass through unchanged"], "answer": 0, "explanations": ["absorb shock＝吸收衝擊。", "不是心理震驚。", "吸震不是讓衝擊原封不動通過。"], "tag": "主題搭配"}, {"id": "spider-v-57", "mode": "vocab", "paragraph": "H", "sentence": "'We are at an early stage but theoretical predictions are that we will wind up with a very strong, tough material, with an ability to absorb shock, which is stronger and tougher than the man-made materials that are conventionally available to us,' he says.", "target": "conventionally", "options": ["in the usual or established way", "only at an international meeting", "in a completely new and untested way"], "answer": 0, "explanations": ["conventionally＝以傳統、常規方式。", "不是在會議上。", "不是全新未經試驗。"], "tag": "常見字語境義"}, {"id": "spider-v-58", "mode": "vocab", "paragraph": "I", "sentence": "The spider is not the only creature that has aroused the interest of material scientists.", "target": "aroused the interest", "options": ["caused people to become interested", "caused people to lose all curiosity", "woken people from sleep physically"], "answer": 0, "explanations": ["arouse interest＝引起興趣。", "不是使失去興趣。", "不是實際叫醒睡覺的人。"], "tag": "主題搭配"}, {"id": "spider-v-59", "mode": "vocab", "paragraph": "I", "sentence": "They have also become envious of the natural adhesive secreted by the sea mussel.", "target": "adhesive", "options": ["a substance used to stick things together", "a tool for cutting fibres apart", "a liquid used only to remove salt"], "answer": 0, "explanations": ["adhesive＝黏著劑、膠。", "不是切割工具。", "不是只用於除鹽的液體。"], "tag": "主題字彙"}, {"id": "spider-v-60", "mode": "vocab", "paragraph": "I", "sentence": "They have also become envious of the natural adhesive secreted by the sea mussel.", "target": "secreted", "options": ["produced and released by a living organism", "hidden deliberately from all researchers", "made completely dry by heating"], "answer": 0, "explanations": ["secrete＝分泌；不要混成 secret 隱藏的。", "secreted 在生理語境不是保密。", "不是烘乾。"], "tag": "易混字義"}, {"id": "spider-v-61", "mode": "vocab", "paragraph": "I", "sentence": "It is tedious and expensive to extract the protein from the mussel, so researchers have already produced a synthetic gene for use in surrogate bacteria.", "target": "tedious", "options": ["boring or tiring because it takes much repetitive effort", "quick and entertaining", "scientifically impossible in every case"], "answer": 0, "explanations": ["tedious＝冗長乏味、費事的。", "不是輕鬆有趣。", "費事不等於不可能。"], "tag": "主題字彙"}, {"id": "spider-v-62", "mode": "vocab", "paragraph": "I", "sentence": "It is tedious and expensive to extract the protein from the mussel, so researchers have already produced a synthetic gene for use in surrogate bacteria.", "target": "extract", "options": ["remove or obtain a substance from its source", "add a new substance to an organism", "make a substance disappear without collecting it"], "answer": 0, "explanations": ["extract protein from＝從……提取蛋白質。", "不是加進去。", "提取是取得，不是讓它消失。"], "tag": "主題搭配"}, {"id": "spider-v-63", "mode": "vocab", "paragraph": "I", "sentence": "It is tedious and expensive to extract the protein from the mussel, so researchers have already produced a synthetic gene for use in surrogate bacteria.", "target": "surrogate", "options": ["used as a substitute for another biological source", "identical to an adult sea mussel in every way", "unable to carry any synthetic gene"], "answer": 0, "explanations": ["surrogate bacteria 指代替原本生物來源的細菌。", "替代用途不表示各方面都相同。", "原文指出合成基因用於此細菌，不是不能帶基因。"], "tag": "主題字彙"}, {"id": "spider-p-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Scientists have succeeded in copying the silk-producing genes of the Golden Orb Weaver spider and are using them to create a synthetic material which they believe is the model for a new generation of advanced bio-materials.", "target": "", "options": ["Scientists have copied spider genes and are using them to develop an artificial material they regard as a basis for future biomaterials.", "Scientists are copying entire spiders because the original silk genes cannot be used.", "Scientists have already replaced every construction material with natural spider webs."], "answer": 0, "explanations": ["them 指 genes；which 後的 they believe 引出研究者的判斷。", "複製的是基因，不是整隻蜘蛛；也沒有說基因不能用。", "are using ... to create 不代表已全面取代現有材料。"], "tag": "長難句理解", "structure": "主幹：Scientists have succeeded ... and are using them ...；to create 表目的；which they believe is ... 修飾 material，they believe 是插入的判斷。"}, {"id": "spider-p-2", "mode": "paraphrase", "paragraph": "A", "sentence": "The new material, biosilk, which has been spun for the first time by researchers at DuPont, has an enormous range of potential uses in construction and manufacturing.", "target": "", "options": ["Biosilk, first spun by DuPont researchers, has many possible uses in construction and manufacturing.", "DuPont has proved that biosilk is already used for every construction task.", "Biosilk is the name of the researchers who produced the spider’s genes."], "answer": 0, "explanations": ["同位語 biosilk 說明 new material；potential 保留潛力語氣。", "potential uses 不等於每種用途都已實現。", "biosilk 是材料名稱，不是研究者。"], "tag": "長難句理解", "structure": "The new material 為主詞，biosilk 是同位語；which has been spun ... 是非限定關係子句；主句動詞是 has。"}, {"id": "spider-p-3", "mode": "paraphrase", "paragraph": "B", "sentence": "The attraction of the silk spun by the spider is a combination of great strength and enormous elasticity, which man-made fibres have been unable to replicate.", "target": "", "options": ["The silk’s appeal is its combination of high strength and high elasticity, a combination artificial fibres have not matched.", "Artificial fibres already combine greater strength and elasticity than spider silk.", "Spider silk is attractive because it has elasticity instead of strength."], "answer": 0, "explanations": ["重點是 strength 與 elasticity 同時存在的組合。", "have been unable to replicate 表尚未成功重現，並非已勝過。", "combination 是兼有兩者，不是二選一。"], "tag": "長難句理解", "structure": "主詞 The attraction ...；is 的補語為 a combination ...；which 回指這個特性組合；spun by the spider 修飾 silk。"}, {"id": "spider-p-4", "mode": "paraphrase", "paragraph": "B", "sentence": "On an equal-weight basis, spider silk is far stronger than steel and it is estimated that if a single strand could be made about 10m in diameter, it would be strong enough to stop a jumbo jet in flight.", "target": "", "options": ["For the same weight, spider silk is much stronger than steel; an estimate suggests a hypothetical strand about 10m wide could stop a flying jumbo jet.", "A spider has already spun a 10m-wide thread that stopped a real aircraft in flight.", "A thread 10m long has been proved stronger than any quantity of steel."], "answer": 0, "explanations": ["等重比較；it is estimated 和 if ... could ... would ... 均須保留估計及假設。", "把估計與假設改成已發生的實驗。", "10m 是 diameter 直徑，不是長度；也有限定等重比較。"], "tag": "長難句理解", "structure": "it is estimated that ... 為形式主詞結構；that 子句內含 if 條件句；could be made 是被動，would be strong enough to ... 是假設結果。"}, {"id": "spider-p-5", "mode": "paraphrase", "paragraph": "B", "sentence": "Army scientists are already looking at the possibilities of using it for lightweight, bulletproof vests and parachutes.", "target": "", "options": ["Army scientists are investigating possible uses of the silk in light protective vests and parachutes.", "The army has already replaced all existing vests and parachutes with biosilk.", "Army scientists are studying the silk only because it is too heavy for protective equipment."], "answer": 0, "explanations": ["looking at the possibilities 是研究應用可能性。", "already 修飾正在研究，不是已全面取代。", "lightweight 與前句 extremely light 指輕，不是太重。"], "tag": "長難句理解", "structure": "are already looking at 為進行式；of using it ... 補充 possibilities 的內容；for 後接兩個並列用途。"}, {"id": "spider-p-6", "mode": "paraphrase", "paragraph": "C", "sentence": "The drag-line silk, which forms the radial arms of the web, is stronger than the other parts of the web and some biochemists believe a synthetic version could prove to be as important a material as nylon, which has been around for 50 years, since the discoveries of Wallace Carothers and his team ushered in the age of polymers.", "target": "", "options": ["The web’s radial support silk is stronger than its other parts, and some scientists think an artificial version might become as important as nylon.", "All parts of a spider’s web have exactly the same strength, unlike nylon.", "Scientists agree that synthetic spider silk has already made nylon unnecessary."], "answer": 0, "explanations": ["保留 stronger than 的比較及 some ... believe ... could 的限制。", "原文明說牽引絲比其他部分強。", "some 不是全體；could 不表示已取代尼龍。"], "tag": "長難句理解", "structure": "主幹是 The drag-line silk ... is stronger ... and some biochemists believe ...；兩個 which 分別修飾 silk 與 nylon；as important a material as 為比較結構。"}, {"id": "spider-p-7", "mode": "paraphrase", "paragraph": "D", "sentence": "To recreate the material, scientists, including Randolph Lewis at the University of Wyoming, first examined the silk-producing gland of the spider.", "target": "", "options": ["Scientists first studied the spider’s silk-producing gland as a step towards reproducing the material.", "Scientists first built a synthetic spider and only later discovered its silk gland.", "The purpose of studying the gland was to stop spiders producing any silk."], "answer": 0, "explanations": ["To recreate 說明研究目的；first examined 表第一步。", "原文未說製造合成蜘蛛，也顛倒研究內容。", "recreate 是重製材料，不是阻止產絲。"], "tag": "長難句理解", "structure": "句首 To recreate the material 是目的不定詞；including ... 補充 scientists 的成員；主句動詞是 examined。"}, {"id": "spider-p-8", "mode": "paraphrase", "paragraph": "D", "sentence": "'We took out the glands that produce the silk and looked at the coding for the protein material they make, which is spun into a web.", "target": "", "options": ["The researchers removed silk-producing glands and studied the coding for the protein that is spun into a web.", "The researchers studied a code written on a finished spider web without examining glands.", "The glands themselves are spun into the web after the protein is removed."], "answer": 0, "explanations": ["that produce 修飾 glands；they make 指腺體製造蛋白質；which is spun 指蛋白質材料。", "原文有 took out the glands，並非完全不研究腺體。", "被紡成網的是 protein material，不是腺體。"], "tag": "長難句理解", "structure": "glands 後有 that 關係子句；protein material 後的 they make 省略受詞關係代名詞；which is spun 為被動關係子句。"}, {"id": "spider-p-9", "mode": "paraphrase", "paragraph": "E", "sentence": "At DuPont, researchers have used both yeast and bacteria as hosts to grow the raw material, which they have spun into fibres.", "target": "", "options": ["DuPont researchers have used yeast and bacteria to produce the starting material, then spun that material into fibres.", "Yeast and bacteria are woven together directly to make the finished fibre.", "Only yeast can produce the raw material, and no fibres have yet been made."], "answer": 0, "explanations": ["which 指 raw material；兩種生物都作宿主。", "被紡成纖維的是原料，不是把整個微生物織起來。", "both ... and ... 表兩者；have spun 指已製成纖維。"], "tag": "長難句理解", "structure": "have used both A and B as hosts 是主幹；to grow 表目的；which they have spun 修飾 raw material。"}, {"id": "spider-p-10", "mode": "paraphrase", "paragraph": "E", "sentence": "'We break open the bacteria, separate out the globules of protein and use them as the raw starting material.", "target": "", "options": ["The researchers open up bacteria, isolate the protein globules, and use those globules as their starting material.", "The researchers use whole unopened bacteria as finished silk fibres.", "The researchers discard all the protein and use only the bacterial outer walls."], "answer": 0, "explanations": ["三個動作依序是 break open、separate out、use；them 指 protein globules。", "break open 與 unopened 矛盾；原料仍需加工。", "use them 明說使用蛋白質小球，不是全部丟棄。"], "tag": "長難句理解", "structure": "We 共有三個並列動詞；use A as B＝把 A 當作 B；them 回指 globules of protein。"}, {"id": "spider-p-11", "mode": "paraphrase", "paragraph": "E", "sentence": "With yeast, the gene system can be designed so that the material excretes the protein outside the yeast for better access,' he says.", "target": "", "options": ["The yeast gene system can be designed to release protein outside the cells, making the protein easier to obtain.", "The gene system must keep all protein permanently inside the yeast to prevent access.", "Researchers can obtain protein only by breaking open yeast in exactly the same way as bacteria."], "answer": 0, "explanations": ["so that 引出設計所達成的結果，for better access 表更易取得。", "outside 與 better access 均與此選項相反。", "這句說酵母可將蛋白質排至外部，並非一定要破開。"], "tag": "長難句理解", "structure": "can be designed 為情態動詞加被動；so that 引導目的／預期結果子句；for better access 解釋釋放到外部的好處。"}, {"id": "spider-p-12", "mode": "paraphrase", "paragraph": "F", "sentence": "'The bacteria and the yeast produce the same protein, equivalent to that which the spider uses in the draglines of the web.", "target": "", "options": ["The bacteria and yeast make the same protein as the one spiders use in their web draglines.", "The bacteria and yeast make proteins entirely different from those used by spiders.", "The bacteria and yeast naturally build complete spider webs themselves."], "answer": 0, "explanations": ["equivalent to that which ... 中 that 指 protein。", "the same 與 equivalent 都強調相同或相當。", "產生蛋白質不等於自己建造蜘蛛網。"], "tag": "長難句理解", "structure": "equivalent to ... 補充修飾 protein；that 代替 protein，which the spider uses 是修飾 that 的關係子句。"}, {"id": "spider-p-13", "mode": "paraphrase", "paragraph": "F", "sentence": "The spider mixes the protein into a water-based solution and then spins it into a solid fibre in one go.", "target": "", "options": ["A spider combines protein with a water-based liquid and turns it into a solid fibre in a single operation.", "A spider uses chemical solvents instead of water and requires many separate operations.", "A spider first makes a solid fibre and then dissolves it to produce protein."], "answer": 0, "explanations": ["保留 mixes ... then spins ... 的順序和 in one go。", "化學溶劑是下句人工方法；蜘蛛用水性溶液。", "製程先溶液後固體，不是先固體再產生蛋白質。"], "tag": "長難句理解", "structure": "主詞 The spider 共有 mixes 和 spins 兩個並列動詞；it 指 protein；in one go 補充一次完成。"}, {"id": "spider-p-14", "mode": "paraphrase", "paragraph": "F", "sentence": "Since we are not as clever as the spider and we are not using such sophisticated organisms, we substituted man-made approaches and dissolved the protein in chemical solvents, which are then spun to push the material through small holes to form the solid fibre.'", "target": "", "options": ["Because researchers cannot work like spiders with such complex organisms, they use artificial methods and dissolve the protein in chemical solvents to form fibres.", "Since a particular date, researchers have used only water and exactly copied the spider’s whole process.", "Scientists are saying that their organisms are more sophisticated than spiders and need no alternative methods."], "answer": 0, "explanations": ["Since 此處表原因；substituted 指採用替代人工方法。", "Since 後是原因，不是時間起點；chemical solvents 不是只用水。", "not as clever 和 not ... such sophisticated organisms 與此說法相反。"], "tag": "長難句理解", "structure": "Since 引導原因子句；not as ... as 為比較；主句 substituted 與 dissolved 並列；to push、to form 表製程目的。"}, {"id": "spider-p-15", "mode": "paraphrase", "paragraph": "G", "sentence": "They say that earthquake-resistant suspension bridges hung from cables of synthetic spider silk fibres may become a reality.", "target": "", "options": ["The researchers think bridges supported by synthetic spider-silk cables and designed to resist earthquakes may be possible.", "Such bridges are already in widespread use and make earthquakes impossible.", "Synthetic spider-silk cables are mentioned only as a way to dismantle existing bridges."], "answer": 0, "explanations": ["may become a reality 是未來可能性；hung from cables 修飾橋梁。", "把 may 改成已普及；抗震不等於阻止地震。", "句子談建造用途，沒有拆橋。"], "tag": "長難句理解", "structure": "They say that 引出報告內容；earthquake-resistant 修飾 bridges；hung from cables 是過去分詞片語；may 表可能。"}, {"id": "spider-p-16", "mode": "paraphrase", "paragraph": "G", "sentence": "Stronger ropes, safer seat belts, shoe soles that do not wear out so quickly and tough new clothing are among the other applications.", "target": "", "options": ["Other possible uses include tougher clothing, safer belts, stronger ropes, and shoe bottoms that resist wear for longer.", "Only shoe soles are possible uses; ropes, belts and clothes are ruled out.", "The shoes are intended to wear out faster so people will replace them more often."], "answer": 0, "explanations": ["among the other applications 表列舉部分用途；not so quickly＝較不易磨損。", "多個項目並列，沒有排除繩、帶、衣服。", "do not wear out so quickly 是磨損較慢，不是更快。"], "tag": "長難句理解", "structure": "多個名詞片語構成並列主詞；that do not wear out ... 修飾 shoe soles；are among 表屬於若干例子。"}, {"id": "spider-p-17", "mode": "paraphrase", "paragraph": "G", "sentence": "'It is very strong and retains elasticity: there are no man-made materials that can mimic both these properties.", "target": "", "options": ["The material combines high strength with retained elasticity, and the speaker says artificial materials have not copied both qualities together.", "The material is strong only because it has no elasticity.", "The speaker claims artificial materials already reproduce both qualities in combination."], "answer": 0, "explanations": ["both these properties 是強度與彈性，重點在兼具。", "retains elasticity 表仍有彈性。", "there are no ... that can mimic ... 是否定這項能力。"], "tag": "長難句理解", "structure": "冒號後解釋前句意義；no man-made materials 否定主詞；that can mimic 修飾 materials；both 限定兩種特性。"}, {"id": "spider-p-18", "mode": "paraphrase", "paragraph": "H", "sentence": "At DuPont's laboratories, Dorsch is excited by the prospect of new super-strong materials but he warns they are many years away.", "target": "", "options": ["Dorsch welcomes the possibility of very strong new materials but says they will still take many years to become available.", "Dorsch says the finished materials have already been sold for many years.", "Dorsch dismisses the materials as impossible and expresses no interest in them."], "answer": 0, "explanations": ["but 對比期待與時間上的限制。", "are many years away＝尚需多年，不是已出售多年。", "is excited 表興奮期待，不是毫無興趣。"], "tag": "長難句理解", "structure": "is excited by ... 與 he warns ... 由 but 連接；warns 後省略 that；they 指 new super-strong materials。"}, {"id": "spider-p-19", "mode": "paraphrase", "paragraph": "H", "sentence": "'We are at an early stage but theoretical predictions are that we will wind up with a very strong, tough material, with an ability to absorb shock, which is stronger and tougher than the man-made materials that are conventionally available to us,' he says.", "target": "", "options": ["Although development is at an early stage, theory predicts an eventual material that absorbs impact and outperforms conventional artificial materials in strength and toughness.", "Practical testing has already guaranteed immediate production of a material with no need for further development.", "The predicted material will be weaker than conventional materials because it cannot absorb impacts."], "answer": 0, "explanations": ["early stage、theoretical predictions、will 均保留發展與預測語氣。", "把理論預測改成已實驗保證，並忽略早期階段。", "原文說 stronger and tougher，並能 absorb shock。"], "tag": "長難句理解", "structure": "but 對比現階段和預測；predictions are that ... 是表語子句；with an ability ... 補充材料能力；which 修飾預期材料。"}, {"id": "spider-p-20", "mode": "paraphrase", "paragraph": "I", "sentence": "It is tedious and expensive to extract the protein from the mussel, so researchers have already produced a synthetic gene for use in surrogate bacteria.", "target": "", "options": ["Because extracting mussel protein is costly and laborious, researchers have already made a synthetic gene for use in substitute bacteria.", "Researchers have abandoned synthetic genes because extracting mussel protein is quick and cheap.", "The sea mussels naturally produce synthetic genes inside the bacteria used by researchers."], "answer": 0, "explanations": ["It 為形式主詞，真正內容是 to extract；so 表導致合成基因研究的原因。", "tedious and expensive 與 quick and cheap 相反；原文也說 already produced。", "合成基因是研究者製作，不是海貽貝天然在細菌內製作。"], "tag": "長難句理解", "structure": "It is + 形容詞 + to extract ...；from 指提取來源；so 連接原因與結果；for use in 指預定用途。"}, {"id": "spider-web-qv2-1", "mode": "questionVocab", "paragraph": "", "sentence": "a comparison of the ways two materials are used to replace silk-producing glands", "target": "silk-producing glands", "options": ["產絲腺體", "分泌黏膠的外部絲線", "產卵的生殖器官"], "answer": 0, "explanations": ["gland 是腺體；silk-producing 說明其產絲功能。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是已分泌到體外的絲線。", "不是產卵器官。"], "tag": "題目字彙", "source": "Question 1 · 題目用語"}, {"id": "spider-web-qv2-2", "mode": "questionVocab", "paragraph": "", "sentence": "predictions regarding the availability of the synthetic silk", "target": "synthetic silk", "options": ["人工合成絲", "未經加工的天然蜘蛛絲", "由蠶繭直接抽出的蠶絲"], "answer": 0, "explanations": ["synthetic 指人工合成，不是天然直接採集。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "天然蜘蛛絲與 synthetic 的來源相反。", "蠶絲不是此處人工合成絲。"], "tag": "題目字彙", "source": "Question 2 · 題目用語"}, {"id": "spider-web-qv2-3", "mode": "questionVocab", "paragraph": "", "sentence": "predictions regarding the availability of the synthetic silk", "target": "availability", "options": ["可取得、可供使用的情況", "產品受歡迎的程度", "產品能承受的拉力"], "answer": 0, "explanations": ["availability 指是否能取得或供應。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "受歡迎程度是 popularity。", "拉力強度是 strength。"], "tag": "題目字彙", "source": "Question 2 · 題目用語"}, {"id": "spider-web-qv2-4", "mode": "questionVocab", "paragraph": "", "sentence": "ongoing research into other synthetic materials", "target": "ongoing research", "options": ["持續進行中的研究", "已完成並獲確證的研究", "只供參考的過往研究"], "answer": 0, "explanations": ["ongoing 表仍在進行，不代表已有定論。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是 completed 或 conclusively established。", "不是僅指過往文獻。"], "tag": "題目字彙", "source": "Question 3 · 題目用語"}, {"id": "spider-web-qv2-6", "mode": "questionVocab", "paragraph": "", "sentence": "the research into the part of the spider that manufactures silk", "target": "manufactures", "options": ["製造、產生", "採集並儲存", "分解並回收"], "answer": 0, "explanations": ["此處把蜘蛛產絲比作製造過程。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是只把現成絲採集起來。", "不是拆解回收。"], "tag": "題目字彙", "source": "Question 4 · 題目用語"}, {"id": "spider-web-qv2-7", "mode": "questionVocab", "paragraph": "", "sentence": "the possible application of the silk in civil engineering", "target": "application", "options": ["實際應用、用途", "提出申請的程序", "把表面塗平的工序"], "answer": 0, "explanations": ["application of the silk 指絲的使用方式。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是申請手續。", "本句不是塗抹工序。"], "tag": "題目字彙", "source": "Question 5 · 題目用語"}, {"id": "spider-web-qv2-8", "mode": "questionVocab", "paragraph": "", "sentence": "the possible application of the silk in civil engineering", "target": "civil engineering", "options": ["土木工程", "電子工程", "生物工程"], "answer": 0, "explanations": ["civil engineering 涉及橋梁、道路等建設。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "電子工程是 electronic engineering。", "生物工程是 bioengineering。"], "tag": "題目字彙", "source": "Question 5 · 題目用語"}, {"id": "spider-web-qv2-9", "mode": "questionVocab", "paragraph": "", "sentence": "Complete the flow-chart below.", "target": "flow-chart", "options": ["流程圖", "數據隨時間變化的折線圖", "不同事物比例的圓餅圖"], "answer": 0, "explanations": ["flow-chart 表呈現步驟及先後關係的圖。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是一般趨勢折線圖。", "不是比例圓餅圖。"], "tag": "題目字彙", "source": "Question 6–10 · 題目用語"}, {"id": "spider-web-qv2-10", "mode": "questionVocab", "paragraph": "", "sentence": "passed through ______ to produce a solid fibre", "target": "solid fibre", "options": ["固態纖維", "溶液中的液態蛋白質", "鬆散的粉末顆粒"], "answer": 0, "explanations": ["solid 指固態；fibre 指細長纖維。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是尚未成纖的液態溶液。", "纖維也不是粉末顆粒。"], "tag": "題目字彙", "source": "Question 6–10 · 題目用語"}, {"id": "spider-web-qv2-11", "mode": "questionVocab", "paragraph": "", "sentence": "Biosilk has already replaced nylon in parachute manufacture.", "target": "nylon", "options": ["尼龍、一種合成聚合物纖維", "天然棉纖維", "直接取自蠶繭的蛋白質纖維"], "answer": 0, "explanations": ["nylon 是合成聚合物材料。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是 cotton。", "不是天然蠶絲。"], "tag": "題目字彙", "source": "Question 11 · 題目用語"}, {"id": "spider-web-qv2-12", "mode": "questionVocab", "paragraph": "", "sentence": "Biosilk has already replaced nylon in parachute manufacture.", "target": "parachute manufacture", "options": ["降落傘製造", "降落傘的操作訓練", "用來減緩飛機速度的飛行程序"], "answer": 0, "explanations": ["manufacture 指製造產品。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "不是使用降落傘的訓練。", "不是飛行操作程序。"], "tag": "題目字彙", "source": "Question 11 · 題目用語"}, {"id": "spider-web-qv2-13", "mode": "questionVocab", "paragraph": "", "sentence": "The spider produces silk of varying strengths.", "target": "varying strengths", "options": ["不同的強度", "不同的粗細", "不同的彈性回復速度"], "answer": 0, "explanations": ["varying 指不一樣；strengths 指強度。 本題辨認原題用字；該敘述是否符合文章須另行判斷。", "粗細是 thickness，不等於強度。", "彈性回復也不是 strength 本身。"], "tag": "題目字彙", "source": "Question 12 · 題目用語"}], "sourceNote": "目錄名稱沿用 Spider web；附圖原文題名為 Spider silk。內文按附圖保留。原圖有疑似誤植，例如 attach itself for rocks；常用搭配應為 attach itself to rocks。含疑義的片語未用作考點。文中的研究進度與年數均依文章敘述理解，不代表當前技術現況。"}, {"id": "canned-food", "title": "A Brief History Of Canned Food", "sourceTitle": "A brief history of canned food", "subtitle": "Preservation, hygiene and the development of canning technology", "part": 1, "topic": "FOOD PRESERVATION · INDUSTRIAL HISTORY", "paragraphs": [{"label": "A", "text": "In 1795, the French government had a problem: they faced the fact that it is not easy to win battles abroad when your soldiers are hungry and malnourished. That year they established a 12,000-franc prize for whoever could find a way to preserve food – from milk and meat to fruits and vegetables. French chef Nicolas Appert took more than a decade to develop a process that involved cooking food in glass jars and then using seals made of cork to make them airtight. In 1810, he published a book whose title translates as “The art of preserving all animal and vegetable substances for several years”, and collected his prize money. Appert’s achievement didn’t escape the notice of British merchant and inventor Peter Durand, who applied for a British patent later that year. Durand used techniques similar to Appert’s, although he adapted the model to include the use of tin vessels as well as glass jars."}, {"label": "B", "text": "Following these discoveries, canned food was initially produced for soldiers and explorers. But even after people became aware of the existence of bacteria in the late 19th century, canning companies couldn’t work out exactly why some of their tins turned bad. And even into the 20th century, newspapers were full of accounts not only of food poisoning but also of cases of the fatal disease botulism resulting from people eating canned food. For that reason, many continued to look upon canned food with suspicion and fear."}, {"label": "C", "text": "The US food manufacturer, The Heinz Company, realized bad cans were bad for business. From the 1890s to 1920s, the company insisted on weekly manicures for its canning-factory workers to ensure that any bacteria beneath employees’ fingernails stayed out of the food. Heinz employees were required to shower and change their clothing regularly. In an era when food-factory hygiene was not universally adopted, what might have been considered a nuisance by workers was at least good for consumers."}, {"label": "D", "text": "Some canning companies killed bacteria with chemical additives such as sodium benzoate, which is still used today in canned food, and formaldehydes, which are now known to cause cancer. Some of the larger canning companies, such as Heinz, Libby, and Campbell’s, installed expensive steam-retort technology developed in the 1870s. Steam retorts worked like steam engines, using pressure to raise canning temperatures high enough to make food safe. Yet some batches of cans, even when made with this advanced technique, would explode after months on the shelf, while the contents of other cans might mysteriously sour. Smaller canning manufacturers relied on the open kettle method* and they had even less consistent results."}, {"label": "E", "text": "US canning companies eventually banded together to discover the scientific principles affecting the canning process. In 1913, they launched the Research Laboratory of the National Canners Association in order to look into the elusive bacteriology responsible for all manner of spoiled canned food. The research done by the laboratory in the decades that followed helped resolve the problem of spoiled food and led to improved flavor, color, nutritional value, and texture."}, {"label": "F", "text": "Before this time, canning companies had discovered through trial and error that the best way to avoid bad cans was to cook food at high temperatures for long periods, an approach that sacrificed flavor. “Food safety and palatability were often at cross-purposes,” remarks food historian Gabriella Petrick. For string beans, for instance, long cooking times in hot water leach out the green color, creating an unattractive grayish-toned bean. The addition of salt was one technique employed in the early 20th century to prevent this happening, thereby maintaining the visual appeal of the product and restoring a certain amount of taste."}, {"label": "G", "text": "One of the major canning innovations of the 20th century was the development of aseptic processing. This technique, which involves sterilizing the container separately from the food, was invented in Switzerland in the 1960s for processing milk, but is now used widely for canned tomatoes and many juices. Small volumes of food are heated to a precise temperature and for a precise time in order to avoid overcooking and preserve color and nutrients, explains food scientist Philip Nelson, who won the 2007 World Food Prize in recognition of his research on making aseptic processing workable on a large industrial scale."}, {"label": "H", "text": "Today, despite all the modern alternatives, Appert’s technology still reigns supreme for long-term storage. More than two centuries on, the simple can is still the best solution for the safe and effective preservation of a wide range of foodstuffs worldwide."}], "questions": [{"id": "canned-v-1", "mode": "vocab", "paragraph": "A", "sentence": "In 1795, the French government had a problem: they faced the fact that it is not easy to win battles abroad when your soldiers are hungry and malnourished.", "target": "malnourished", "options": ["not receiving enough of the right nutrients", "unwilling to follow military orders", "suffering only from eating too much food"], "answer": 0, "explanations": ["malnourished＝營養不良，可能是量不足或營養不均。", "不服從命令不等於營養不良。", "不是特指吃太多。"], "tag": "主題字彙"}, {"id": "canned-v-2", "mode": "vocab", "paragraph": "A", "sentence": "That year they established a 12,000-franc prize for whoever could find a way to preserve food – from milk and meat to fruits and vegetables.", "target": "preserve", "options": ["keep food from spoiling so it lasts longer", "prepare food to be eaten immediately only", "remove all nutrients from food"], "answer": 0, "explanations": ["preserve food＝保存食物、防止腐敗。", "不只是立即烹食。", "保存不表示移除所有營養。"], "tag": "主題搭配"}, {"id": "canned-v-3", "mode": "vocab", "paragraph": "A", "sentence": "French chef Nicolas Appert took more than a decade to develop a process that involved cooking food in glass jars and then using seals made of cork to make them airtight.", "target": "seals", "options": ["closures that prevent air from entering", "sea animals with thick skin", "official stamps printed on the jars"], "answer": 0, "explanations": ["seals 在此是密封物、封口。", "不是海豹。", "不是官方印章。"], "tag": "常見字語境義"}, {"id": "canned-v-4", "mode": "vocab", "paragraph": "A", "sentence": "French chef Nicolas Appert took more than a decade to develop a process that involved cooking food in glass jars and then using seals made of cork to make them airtight.", "target": "cork", "options": ["a light material from tree bark used to close containers", "a hard metal used to make cans", "a liquid chemical used to sterilize food"], "answer": 0, "explanations": ["cork＝軟木，用來製作封口。", "不是金屬。", "不是液體消毒劑。"], "tag": "主題字彙"}, {"id": "canned-v-5", "mode": "vocab", "paragraph": "A", "sentence": "French chef Nicolas Appert took more than a decade to develop a process that involved cooking food in glass jars and then using seals made of cork to make them airtight.", "target": "airtight", "options": ["closed so that air cannot pass through", "open to let fresh air circulate freely", "strong enough to resist every possible impact"], "answer": 0, "explanations": ["airtight＝不透氣、密封的。", "與通風相反。", "密封不等於能抵擋所有衝擊。"], "tag": "主題搭配"}, {"id": "canned-v-6", "mode": "vocab", "paragraph": "A", "sentence": "Appert’s achievement didn’t escape the notice of British merchant and inventor Peter Durand, who applied for a British patent later that year.", "target": "didn’t escape the notice", "options": ["was noticed by", "was successfully hidden from", "was completely misunderstood by"], "answer": 0, "explanations": ["didn’t escape the notice of＝沒有逃過……注意，也就是引起其注意。", "忽略 didn’t，反轉了否定。", "注意到不等於誤解。"], "tag": "慣用表達"}, {"id": "canned-v-7", "mode": "vocab", "paragraph": "A", "sentence": "Appert’s achievement didn’t escape the notice of British merchant and inventor Peter Durand, who applied for a British patent later that year.", "target": "patent", "options": ["an official legal ions": ["work out why＝弄清楚原因。", "不是健身。", "不是把食物拿出來。"], "tag": "Phrasal verb"}, {"id": "canned-v-12", "mode": "vocab", "paragraph": "B", "sentence": "But even after people became aware of the existence of bacteria in the late 19th century, canning companies couldn’t work out exactly why some of their tins turned bad.", "target": "turned bad", "options": ["became spoiled and unfit to eat", "changed into a darker metal", "became commercially successful"], "answer": 0, "explanations": ["食物 turn bad＝變質；their tins 在此代指罐頭食品。", "不是金屬變色。", "bad 與商業成功無關。"], "tag": "搭配與語境義"}, {"id": "canned-v-13", "mode": "vocab", "paragraph": "B", "sentence": "And even into the 20th century, newspapers were full of accounts not only of food poisoning but also of cases of the fatal disease botulism resulting from people eating canned food.", "target": "accounts", "options": ["written reports or descriptions of events", "banking arrangements for keeping money", "calculations of how much food was sold"], "answer": 0, "explanations": ["newspapers full of accounts 指報紙刊載事件報導。", "不是銀行帳戶。", "不是銷售計算。"], "tag": "常見字語境義"}, {"id": "canned-v-14", "mode": "vocab", "paragraph": "B", "sentence": "And even into the 20th century, newspapers were full of accounts not only of food poisoning but also of cases of the fatal disease botulism resulting from people eating canned food.", "target": "food poisoning", "options": ["illness caused by eating contaminated food", "a method of adding nutrients to food", "the deliberate act of poisoning someone in every case"], "answer": 0, "explanations": ["food poisoning＝食物中毒，不預設有人蓄意下毒。", "不是營養強化。", "食物中毒未必涉及故意投毒。"], "tag": "主題搭配"}, {"id": "canned-v-15", "mode": "vocab", "paragraph": "B", "sentence": "And even into the 20th century, newspapers were full of accounts not only of food poisoning but also of cases of the fatal disease botulism resulting from people eating canned food.", "target": "fatal", "options": ["causing death", "always easy to cure", "unpleasant but necessaril
