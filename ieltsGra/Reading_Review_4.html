 no one has ever seen a whale switch pods.", "target": "", "options": ["The passage reports calves remaining with their mothers into adulthood and no observed switching of pods over many years.", "The observation proves with absolute certainty that no killer whale anywhere has ever changed groups.", "Calves are reported to leave their mothers before adulthood and regularly change resident pods."], "answer": 0, "explanations": ["保留族群語境及「未觀察到」，不是超越觀察範圍的絕對證明。", "把觀察記錄擴張成所有虎鯨、所有時代。", "反轉 staying 與 no one has seen。"], "tag": "長難句理解", "structure": "主幹：Calves stay…and no one has seen…。throughout adulthood 限定時期；see + O + 原形 switch，表示未曾目睹換群。"}, {"id": "whale-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Killer whales detect prey with a range of echo-locating clicks, but converse with a vocabulary of squeaks, whistles and whines.", "target": "", "options": ["The sentence distinguishes echolocation for finding prey from a different range of sounds used for communication.", "The sentence treats all clicks, squeaks and whistles as sounds used exclusively to detect prey.", "Killer whales communicate only through visual signals, according to the sentence."], "answer": 0, "explanations": ["but 對比 detect prey 與 converse 兩功能及聲音類型。", "把兩類聲音的功能合併且加上 exclusively。", "原文明說以聲音交流，沒有「只靠視覺」的限定。"], "tag": "長難句理解", "structure": "主幹：whales detect…but converse…。兩個 with 片語分別說明偵測與交流所用聲音。"}, {"id": "whale-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "Residents have a much more extensive repertoire, and each family group has its own unique and distinctive set of calls.", "target": "", "options": ["Residents use a wider range of calls, and different family groups each possess their own distinctive set.", "All resident family groups share one identical small repertoire.", "Transients are said here to have a larger repertoire than residents."], "answer": 0, "explanations": ["比較更廣的是 residents；each group has its own 限定家族特異性。", "把 each…own 改成所有完全一致，並刪去 extensive。", "叫聲種類較多的是 residents，不是 transients。"], "tag": "長難句理解", "structure": "主幹為 and 連接兩句：Residents have…each group has…。much 修飾 more extensive；its own 回指每個家族。"}, {"id": "whale-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "To qualify as part of killer whale culture, dialects must be learnt from other members of the pod.", "target": "", "options": ["For a dialect to count as killer-whale culture in the passage’s argument, it must be learned socially from pod members.", "Any genetically inherited call automatically qualifies as culture without learning.", "The sentence says whales must learn dialects from human researchers."], "answer": 0, "explanations": ["to qualify 設定文化認定條件；must be learnt from pod members。", "抹去社會學習條件。", "學習來源是鯨群，不是人類。"], "tag": "長難句理解", "structure": "主幹：dialects must be learnt…。To qualify as…是目的／判準條件；as part of…說明被歸類的身分。"}, {"id": "whale-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "Animals with different dialects share the same waters, so the variation can't be a product of physical environment. 'And we can throw out the notion that dialects are inherited,' says Lance Barrett-Lennard of the University of British Columbia.", "target": "", "options": ["The writer argues that sharing the same waters rules out physical environment as the explanation for these groups’ dialect differences.", "The writer proves all whale groups live in different environments, which explains their dialects.", "The writer says every animal’s behaviour is entirely unaffected by environment."], "answer": 0, "explanations": ["so 由共享環境推到此處方言差異的解釋；結論範圍不能擴成所有行為。", "原句 share same waters，非不同環境。", "過度概括到所有動物行為。"], "tag": "長難句理解", "structure": "主幹：Animals share…so variation can’t be a product…。with different dialects 修飾 Animals；the variation 回指方言差異。"}, {"id": "whale-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "His paternity tests reveal that female killer whales invariably attract mates from outside their own pod – males with a very different dialect.", "target": "", "options": ["The paternity tests are reported to show that females’ mates come from outside their own pods and have different dialects.", "The tests show females mate only with males sharing their own pod and dialect.", "The tests directly measure whether calves understand their fathers’ calls."], "answer": 0, "explanations": ["破折號後 males 補充說明 outside mates 的方言。", "outside 與 different 均被反轉。", "paternity tests 驗父系關係，不是直接測語音理解。"], "tag": "長難句理解", "structure": "主幹：tests reveal that females attract mates…。from outside…限定配偶來源；破折號後為同位說明 mates。"}, {"id": "whale-paraphrase-16", "mode": "paraphrase", "paragraph": "E", "sentence": "If dialects were programmed by genetics, call patterns from both father and mother would be passed on to the calf. 'A calf uses the calls of its maternal pod very precisely.", "target": "", "options": ["Under the genetic-inheritance hypothesis, a calf would be expected to receive call patterns from both parents; this is a conditional prediction rather than the observed conclusion.", "The sentence reports as an established fact that calves inherit both parents’ dialects genetically.", "The sentence predicts that only the father would influence calls even if dialects were genetic."], "answer": 0, "explanations": ["If…were…would…是在檢驗假說的條件推論，後文以母群叫聲對照。", "把假設當成已證實事實。", "both parents 被改成父親一方。"], "tag": "長難句理解", "structure": "If + were programmed 為假設條件；主句 would be passed on 為預期結果；from both father and mother 限定雙親來源。"}, {"id": "whale-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "It is, according to Frans de Waal of Emory University in Atlanta, who argues that culture is just another biological adaptation that has evolved in many creatures.", "target": "", "options": ["De Waal accepts that this is culture and regards culture as an evolved biological adaptation found in many creatures.", "De Waal rejects the existence of culture in any non-human animal.", "The sentence proves whale dialects are genetically programmed because culture has biological aspects."], "answer": 0, "explanations": ["It is 回應前句 is this culture；生物適應解釋不等於方言由基因直接編碼。", "與 It is 相反。", "把生物基礎錯推成特定方言必為遺傳。"], "tag": "長難句理解", "structure": "主幹：It is。according to…歸屬觀點；who argues…修飾 de Waal；that has evolved…修飾 adaptation。"}, {"id": "whale-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "One benefit of viewing culture in this way is that you can start to understand how and why it might have arisen in these creatures.", "target": "", "options": ["Viewing culture as a biological adaptation may help explain the ways and reasons it arose in these animals.", "This perspective has already established the exact cause of every cultural behaviour.", "The sentence says this perspective makes it impossible to ask about cultural origins."], "answer": 0, "explanations": ["can start 與 might 保留探索性，how and why 涵蓋方式與原因。", "把有助理解升格為所有成因精確定論。", "與 benefit、understand 相反。"], "tag": "長難句理解", "structure": "主幹：One benefit…is that…。of viewing…修飾 benefit；understand 後 how and why 引導間接問句。"}, {"id": "whale-paraphrase-19", "mode": "paraphrase", "paragraph": "F", "sentence": "Apart from their advanced mental abilities, they are adept at recognising sounds: ideal for communicating in the marine environment.", "target": "", "options": ["In addition to mental abilities, whales’ skill at recognizing sounds is presented as especially suitable for marine communication.", "The writer excludes mental abilities from the explanation and says whales cannot recognize sounds.", "Whales’ sound recognition is presented as useful only outside the marine environment."], "answer": 0, "explanations": ["Apart from 在此是「除了……還有」，不是排除其作用。", "把補充誤作排除，又否定 adept。", "ideal for communicating in marine environment 與此相反。"], "tag": "長難句理解", "structure": "主幹：they are adept at recognising sounds。Apart from…加列另一條件；冒號後 ideal…省略主詞及 be，補述辨聲能力用途。"}, {"id": "whale-paraphrase-20", "mode": "paraphrase", "paragraph": "F", "sentence": "Man , "paragraph": "A", "sentence": "But patient observation over many years has begun to reveal behaviours that can only be learnt from other whales.", "target": "reveal", "options": ["make something previously unknown apparent", "deliberately hide", "prove all possible explanations false"], "answer": 0, "explanations": ["reveal behaviours＝揭示、呈現行為。", "不是隱藏。", "不等於排除所有解釋。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-44", "mode": "vocab", "paragraph": "B", "sentence": "So far, humpback and killer whales provide the best evidence of culture in cetaceans, and the song of the male humpback is among the most striking examples.", "target": "evidence", "options": ["information supporting a claim", "a belief requiring no support", "a guaranteed conclusion by definition"], "answer": 0, "explanations": ["evidence＝證據、支持主張的資訊。", "不是無依據信念。", "證據不自動等於最終定論。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-45", "mode": "vocab", "paragraph": "B", "sentence": "So far, humpback and killer whales provide the best evidence of culture in cetaceans, and the song of the male humpback is among the most striking examples.", "target": "striking", "options": ["remarkable or strongly noticeable", "hitting something physically in this context", "typical and unremarkable"], "answer": 0, "explanations": ["striking example＝引人注目的例子。", "不是擊打。", "不是平凡無奇。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-46", "mode": "vocab", "paragraph": "B", "sentence": "The latest version of the song can be learnt only from other whales – almost certainly by imitation.", "target": "imitation", "options": ["copying another’s behaviour", "inheritance of an exact behaviour through genes only", "independent invention without observing others"], "answer": 0, "explanations": ["imitation＝模仿。", "不是只靠基因遺傳。", "不是完全無觀察的獨創。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-47", "mode": "vocab", "paragraph": "C", "sentence": "Nowhere is this more obvious than along the north-west coast of America, where killer whales are split into two distinct populations – 'residents' and 'transients'.", "target": "distinct", "options": ["clearly different or separate", "identical in every feature", "uncertain and impossible to tell apart"], "answer": 0, "explanations": ["distinct populations＝兩個不同族群。", "不是全然相同。", "不是無法辨別。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-48", "mode": "vocab", "paragraph": "C", "sentence": "Residents live in stable groups, or 'pods', made up of two or three mothers and their offspring – perhaps 20 whales in all.", "target": "stable", "options": ["remaining relatively consistent over time", "guaranteed never to change under any circumstances", "changing membership at every moment"], "answer": 0, "explanations": ["stable groups＝相對穩定的群體。", "不表示永遠絕不改變。", "不是時時更換。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-49", "mode": "vocab", "paragraph": "C", "sentence": "Calves stay with their mothers throughout adulthood, and in many years of observation no one has ever seen a whale switch pods.", "target": "throughout adulthood", "options": ["during the whole adult stage of life", "only before becoming an adult", "only at the exact moment of birth"], "answer": 0, "explanations": ["throughout＝整段期間；adulthood＝成年期。", "不是只在幼年。", "不是僅出生時。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-50", "mode": "vocab", "paragraph": "D", "sentence": "Residents have a much more extensive repertoire, and each family group has its own unique and distinctive set of calls.", "target": "extensive", "options": ["wide-ranging or large in scope", "limited to a single item", "expensive specifically in monetary cost"], "answer": 0, "explanations": ["extensive repertoire＝廣泛的一套聲音。", "不是僅一項。", "extensive 不是 expensive。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-51", "mode": "vocab", "paragraph": "D", "sentence": "Residents have a much more extensive repertoire, and each family group has its own unique and distinctive set of calls.", "target": "distinctive", "options": ["characteristic and recognizably different", "the same in every group", "unimportant because it is common" "paragraph": "F", "sentence": "Apart from their advanced mental abilities, they are adept at recognising sounds: ideal for communicating in the marine environment.", "target": "marine environment", "options": ["the sea and its surrounding conditions", "only an inland freshwater habitat", "a human-built aquarium exclusively"], "answer": 0, "explanations": ["marine＝海洋的。", "不是僅內陸淡水。", "不專指水族箱。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-61", "mode": "vocab", "paragraph": "G", "sentence": "Experts in whale biology believe that ecological factors and the need to adapt to sudden changes in the environment played a large part in the emergence of culture.", "target": "adapt to", "options": ["adjust to cope with", "remain unaffected by every aspect of", "deliberately destroy"], "answer": 0, "explanations": ["adapt to change＝適應變化。", "不是完全不受影響。", "不是摧毀。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-62", "mode": "vocab", "paragraph": "G", "sentence": "Although the ocean is a relatively stable habitat in many ways, it is highly changeable in one crucial respect – the availability of food.", "target": "habitat", "options": ["the natural place where organisms live", "a behaviour acquired by repetition", "a single genetic instruction"], "answer": 0, "explanations": ["habitat＝棲地。", "不是 habit 習慣。", "不是單一基因指令。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-63", "mode": "vocab", "paragraph": "G", "sentence": "Although the ocean is a relatively stable habitat in many ways, it is highly changeable in one crucial respect – the availability of food.", "target": "crucial", "options": ["extremely important", "merely decorative", "impossible to notice"], "answer": 0, "explanations": ["crucial respect＝關鍵面向。", "不是裝飾。", "不是無法察覺。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-64", "mode": "vocab", "paragraph": "G", "sentence": "Although the ocean is a relatively stable habitat in many ways, it is highly changeable in one crucial respect – the availability of food.", "target": "availability", "options": ["the extent to which something can be obtained", "the desirability of something regardless of supply", "the size of an animal"], "answer": 0, "explanations": ["availability of food＝食物能否取得、供應情形。", "不是只問喜不喜歡。", "不是動物體型。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-65", "mode": "vocab", "paragraph": "G", "sentence": "One moment there might be a plentiful supply of fish, the next they've disappeared.", "target": "plentiful", "options": ["available in large amounts", "barely enough to find", "completely unchanged in quality"], "answer": 0, "explanations": ["plentiful supply＝供應豐富。", "不是匱乏。", "不只問品質。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-66", "mode": "vocab", "paragraph": "G", "sentence": "When that happens, the past experience of senior members of the group – and the ability to share this knowledge – is a huge asset.", "target": "senior", "options": ["older or more experienced in the group", "physically larger in every case", "the youngest members"], "answer": 0, "explanations": ["senior members 此處指年長、資深成員。", "不保證體型最大。", "不是最幼小。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-67", "mode": "vocab", "paragraph": "G", "sentence": "The dialects of killer whales allow members of the group to identify each other, enabling them to share information about food hot spots.", "target": "enabling", "options": ["making it possible for", "making it compulsory for", "preventing"], "answer": 0, "explanations": ["enable + O + to V＝使能夠。", "不是強迫必須。", "不是阻止。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-68", "mode": "vocab", "paragraph": "H", "sentence": "And what whale matriarchs offer is the most important thing of all – cultural knowledge, vital for the group's survival, passed directly from one generation to the next.", "target": "survival", "options": ["continuing to live or exist", "reproduction guaranteed in every case", "voluntary movement to another ocean only"], "answer": 0, "explanations": ["survival＝存活、生存。", "不等於必然繁殖。", "不是只指遷移。"], "tag": "字彙與語境義"}, {"id": "whale-questionVocab-16", "mode": "questionVocab", "paragraph": "", "sentence": "A calf communicates exclusively with the dialect of the group to which its mother belongs.", "target": "calf", "options": ["幼鯨", "成年雄鯨", "一種海洋植物"], "answer": 0, "explanations": ["calf 在此指幼鯨。此處辨認題目用語，不表示整句敘述符合文章。", "不是成年雄性。", "不是植物。"], "tag": "題目字彙", "source": "Question 32–34 · 題目用語"}, {"id": "whale-questionVocab-17", "mode": "questionVocab", "paragraph": "", "sentence": "sensitivity to sound", "target": "sensitivity", "options": ["敏感度、感受能力", "製造聲音的音量", "無法聽見任何聲音"], "answer": 0, "explanations": ["sensitivity to sound＝對聲音的敏感度。此處辨認題目用語，不表示整句敘述符合文章。", "不是發聲音量。", "不是失聰。"], "tag": "題目字彙", "source": "Question 35–37 C · 題目用語"}, {"id": "whale-questionVocab-18", "mode": "questionVocab", "paragraph": "", "sentence": "variations in communication styles between different cultures within one species", "target": "species", "options": ["物種", "僅以居住地區分的任意群體", "每一隻個體的名字"], "answer": 0, "explanations": ["species 是生物分類的物種。此處辨認題目用語，不表示整句敘述符合文章。", "不同地區不必不同種。", "不是個體姓名。"], "tag": "題目字彙", "source": "Question 39 · 題目用語"}, {"id": "whale-vocab-71", "mode": "vocab", "paragraph": "B", "sentence": "Humpback populations in different oceans sing different songs, but within the same ocean they all stick to the same one.", "target": "stick to", "options": ["continue to use or follow", "physically glue oneself to", "permanently abandon"], "answer": 0, "explanations": ["stick to the same song＝持續使用同一首歌。", "不是黏上去。", "不是放棄。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-72", "mode": "vocab", "paragraph": "B", "sentence": "One male might add an extra set of groans; another might drop a series of grunts.", "target": "groans", "options": ["low deep sounds", "high clear musical whistles only", "the physical movements of fins"], "answer": 0, "explanations": ["groans＝低沉的呻吟般聲音。", "不是只有高音哨聲。", "不是魚鰭動作。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-73", "mode": "vocab", "paragraph": "B", "sentence": "One male might add an extra set of groans; another might drop a series of grunts.", "target": "grunts", "options": ["short low rough sounds", "long silent pauses", "patterns of colour on the skin"], "answer": 0, "explanations": ["grunts＝短促低沉的哼聲。", "不是沉默。", "不是皮膚顏色。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-74", "mode": "vocab", "paragraph": "B", "sentence": "One male might add an extra set of groans; another might drop a series of grunts.", "target": "drop", "options": ["omit or stop using", "let a physical object fall only", "add an entirely new item"], "answer": 0, "explanations": ["drop a series of grunts＝刪去、不再使用某些聲音。", "不是必然讓東西落下。", "不是新增。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-75", "mode": "vocab", "paragraph": "B", "sentence": "Soon all the other males have altered their own rendition to incorporate the changes until they are once again singing the same song.", "target": "altered", "options": ["changed or modified", "kept exactly the same", "proved to be genetically inherited"], "answer": 0, "explanations": ["alter rendition＝改變演唱版本。", "不是保持原樣。", "不表示證明遺傳。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-76", "mode": "vocab", "paragraph": "C", "sentence": "They live in the same stretch of water, but they don't mingle.", "target": "stretch of water", "options": ["an area or expanse of water", "water made elastic by stretching", "a single drop of seawater"], "answer": 0, "explanations": ["stretch 在此指一段、一片水域。", "不是把水拉出彈性。", "不是單一水滴。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-77", "mode": "vocab", "paragraph": "C", "sentence": "In effect, they belong to two quite separate cultures.", "target": "In effect", "options": ["in practice or in its essential meaning", "with no actual consequence", "as a prediction about a later time only"], "answer": 0, "explanations": ["in effect＝實際上、實質上。", "不是毫無影響。", "不是只預測未來。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-78", "mode": "vocab", "paragraph": "D", "sentence": "One of the most obvious distinctions between the transient and resident societies is the way they impart information.", "target": "distinctions", "options": ["differences that allow things to be told apart", "rewards for outstanding academic results here", "complete similarities"], "answer": 0, "explanations": ["distinctions between societies＝族群間的差異、區別。", "不是學業獎項。", "不是全然相同。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-79", "mode": "vocab", "paragraph": "D", "sentence": "Killer whales detect prey with a range of echo-locating clicks, but converse with a vocabulary of squeaks, whistles and whines.", "target": "detect", "options": ["notice or discover the presence of", "create something that was absent", "deliberately overlook"], "answer": 0, "explanations": ["detect prey＝偵測獵物。", "不是製造獵物。", "不是忽略。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-80", "mode": "vocab", "paragraph": "D", "sentence": "Killer whales detect prey with a range of echo-locating clicks, but converse with a vocabulary of squeaks, whistles and whines.", "target": "squeaks", "options": ["short high-pitched sounds", "low continuous humming only", "the shapes of the animals’ mouths"], "answer": 0, "explanations": ["squeaks＝短促尖細的叫聲。", "不是只有低沉持續聲。", "不是嘴的形狀。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-81", "mode": "vocab", "paragraph": "D", "sentence": "Killer whales detect prey with a range of echo-locating clicks, but converse with a vocabulary of squeaks, whistles and whines.", "target": "whines", "options": ["high or prolonged plaintive sounds", "food consumed before breeding", "silent bodily gestures"], "answer": 0, "explanations": ["whines＝尖細、帶哀鳴感的叫聲。", "不是食物。", "不是無聲手勢。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-82", "mode": "vocab", "paragraph": "E", "sentence": "If dialects were programmed by genetics, call patterns from both father and mother would be passed on to the calf. 'A calf uses the calls of its maternal pod very precisely.", "target": "programmed by genetics", "options": ["specified through inherited biological instructions", "learned solely through observation", "arranged in advance by a human trainer"], "answer": 0, "explanations": ["programmed by genetics＝由遺傳資訊預先決定、編碼；此處為假說條件。", "不是純觀察學習。", "不是人類排定訓練。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-83", "mode": "vocab", "paragraph": "E", "sentence": "There's no input from the father,' says Barrett-Lennard.", "target": "input", "options": ["a contribution or influence", "a physical entrance to the ocean", "the final conclusion of an experiment only"], "answer": 0, "explanations": ["no input from father 指叫聲模式沒有父方貢獻；不能擴成父親任何方面都無作用。", "不是入口。", "不是僅最終研究結論。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-84", "mode": "vocab", "paragraph": "F", "sentence": "It is, according to Frans de Waal of Emory University in Atlanta, who argues that culture is just another biological adaptation that has evolved in many creatures.", "target": "evolved", "options": ["developed through biological change over generations", "was consciously invented by one animal in one moment", "was copied directly from a human language"], "answer": 0, "explanations": ["evolved 在此指演化形成。", "不是個體一瞬有意發明。", "不是直接照抄人語。"], "tag": "字彙與語境義"}, {"id": "whale-vocab-85", "mode": "vocab", "paragraph": "G", "sentence": "Although the ocean is a relatively stable habitat in many ways, it is highly changeable in one crucial respect – the availability of food.", "target": "respect", "options": ["an aspect or way of considering something", "admiration for an individual here", "a formal greeting"], "answer": 0, "explanations": ["one crucial respect＝一個關鍵方面。", "不是尊敬某人。", "不是問候。"], "tag": "字彙與語境義"}]}, {"id": "parrot-alex", "title": "Animal Minds: Parrot Alex", "sourceTitle": "Animal Minds: Parrot Alex", "subtitle": "", "part": 2, "topic": "動物認知、模仿與研究方法", "sourceNote": "字義及改寫依本文語境理解；觀察、研究者解釋與敘事比擬應分開判斷。", "paragraphs": [{"label": "A", "text": "In 1977 Irene Pepperberg, a recent graduate of Harvard University, did something very bold. At a time when animals still were considered automatons, she set out to find what was on another creature’s mind by talking to it. She brought a one-year-old African gray parrot she named Alex into her lab to teach him to reproduce the sounds of the English language. “I thought if he learned to communicate, I could ask him questions about how he sees the world.”"}, {"label": "B", "text": "When Pepperberg began her dialogue with Alex, who died last September at the age of 31, many scientists believed animals were incapable of any thought. They were simply machines, robots programmed to react to stimuli but lacking the ability to think or feel. Any pet owner would disagree. We see the love in our dogs’ eyes and know that, of course, they have thoughts and emotions. But such claims remain highly controversial. Gut instinct is not science, and it is all too easy to project human thoughts and feelings onto another creature. How, then, does a scientist prove that an animal is capable of thinking—that it is able to acquire information about the world and act on it? “That’s why I started my studies with Alex,” Pepperberg said. They were seated—she at her desk, he on top of his cage—in her lab, a windowless room about the size of a boxcar, at Brandeis University. Newspapers lined the floor; baskets of bright toys were stacked on the shelves. They were clearly a team—and because of their work, the notion that animals can think is no longer so fanciful."}, {"label": "C", "text": "Certain skills are considered key signs of higher mental abilities: good memory, a grasp of grammar and symbols, self-awareness, understanding others’ motives, imitating others, and being creative. Bit by bit, in ingenious experiments, researchers have documented these talents in other species, gradually chipping away at what we thought made human beings distinctive while offering a glimpse of where our own abilities came from. Scrub jays know that other jays are thieves and that stashed food can spoil; sheep can recognize faces; chimpanzees use a variety of tools to probe termite mounds and even use weapons to hunt small mammals; dolphins can imitate human postures; the archerfish, which stuns insects with a sudden blast of water, can learn how to aim its squirt simply by watching an experienced fish perform the task. And Alex the parrot turned out to be a surprisingly good talker."}, {"label": "D", "text": "Thirty years after the Alex studies began, Pepperberg and a changing collection of assistants were still giving him English lessons. The humans, along with two younger parrots, also served as Alex’s flock, providing the social input all parrots crave. Like any flock, this one—as small as it was—had its share of drama. Alex dominated his fellow parrots, acted huffy at times around Pepperberg, tolerated the other female humans, and fell to pieces over a male assistant who dropped by for a visit. Pepperberg bought Alex in a Chicago pet store where she let the store’s assistant pick him out because she didn’t want other scientists saying later that she’d particularly chosen an especially smart bird for her work. Given that Alex’s brain was the size of a shelled walnut, most researchers thought Pepperberg’s interspecies communication study would be futile."}, {"label": "E", "text": "“Some people actually called me crazy for trying this,” she said. “Scientists thought that chimpanzees were better subjects, although, of course, chimps can’t speak.” Chimpanzees, bonobos, and gorillas have been taught to use sign language and symbols to communicate with us, often with impressive results. The bonobo Kanzi, for instance, carries his symbol-communication board with him so he can “talk” to his human researchers, and has invented combinations of symbols to express his thoughts. Nevertheless, this is not the same thing as having an animal look up at you, open his mouth, and speak. Under Pepperberg’s patient tutelage, Alex learned how to use his vocal tract to imitate almost one hundred English words, including the sounds for various foods, although he calls an apple a “banerry.” “Apples taste a little bit like bananas to him, and they look a little bit like cherries, so Alex made up that word for them,” Pepperberg said."}, {"label": "F", "text": "The idea of having lessons to practise and willingly taking part sounded a bit mad. But after listening to and observing Alex, it was difficult to argue with Pepperberg’s explanation for his behaviors. She wasn’t handing him treats for the repetitious work or rapping him on the claws to make him say the sounds. “He has to hear the words over and over before he can correctly imitate them,” Pepperberg said, after pronouncing “seven” for Alex a good dozen times in a row. “I’m not trying to see if Alex can learn a human language,” she added. “That’s never been the point. My plan always was to use his imitative skills to get a better understanding of avian cognition.”"}, {"label": "G", "text": "In other words, because Alex was able to produce a close approximation of the sounds of some English words, Pepperberg could ask him questions about a bird’s basic understanding of the world. She couldn’t ask him what he was thinking about, but she could ask him about his knowledge of numbers, shapes, and colors. To demonstrate, Pepperberg carried Alex on her arm to a tall wooden perch in the middle of the room. She then retrieved a green key and a small green cup from a basket on a shelf. She held up the two items to Alex’s eye. “What’s the same?” she asked. Without hesitation, Alex’s beak opened: “Color.” “What’s different?” Pepperberg asked. “Shape,” Alex said. His voice had the digitized sound of a cartoon character. Since parrots lack lips (another reason it was difficult for Alex to pronounce some sounds, such as ba), the words seemed to come from the air around him, as if a ventriloquist were speaking. But the words—and what can only be called the thoughts—were entirely his."}, {"label": "H", "text": "For the next 20 minutes, Alex ran through his tests, distinguishing colors, shapes, sizes, and materials (wool versus wood versus metal). He did some simple arithmetic, such as counting the yellow toy blocks among a pile of mixed hues. And, then, as if to offer final proof of the mind inside his bird’s brain, Alex spoke up. “Talk clearly!” he commanded, when one of the younger birds Pepperberg was also teaching mispronounced a word. “Talk clearly!” “Don’t be a smart aleck,” Pepperberg said, shaking her head at him. “He knows all this, and he gets bored, so he interrupts the others, or he gives the wrong answer just to be obstinate. At this stage, he’s like a teenager; he’s moody, and I’m never sure what he’ll do.”"}], "questions": [{"id": "alex-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "In 1977 Irene Pepperberg, a recent graduate of Harvard University, did something very bold.", "target": "graduate", "options": ["a person who has completed a university degree", "a person who has just enrolled at university", "a teacher responsible for university admissions"], "answer": 0, "explanations": ["graduate 作名詞＝大學畢業生。", "不是剛入學者。", "不是招生教師。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "In 1977 Irene Pepperberg, a recent graduate of Harvard University, did something very bold.", "target": "bold", "options": ["brave and willing to take risks", "quiet and unwilling to attract attention", "large and heavy in physical size"], "answer": 0, "explanations": ["bold 指大膽、有勇氣的。", "不是畏縮低調。", "不是體積大。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "At a time when animals still were considered automatons, she set out to find what was on another creature’s mind by talking to it.", "target": "automatons", "options": ["beings treated as acting mechanically without independent thought", "animals known to invent new ideas freely", "machines designed specifically to translate speech"], "answer": 0, "explanations": ["automaton 指像機器般無獨立思考的存在。", "不是承認能自由創意。", "不專指翻譯機。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "At a time when animals still were considered automatons, she set out to find what was on another creature’s mind by talking to it.", "target": "set out to", "options": ["began with the intention of trying to", "proved conclusively that one had managed to", "abandoned the intention of trying to"], "answer": 0, "explanations": ["set out to＝著手打算、開始嘗試。", "不是已確證成功。", "不是放棄。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "At a time when animals still were considered automatons, she set out to find what was on another creature’s mind by talking to it.", "target": "on another creature’s mind", "options": ["occupying another creature’s thoughts", "physically resting on the creature’s head", "being remembered only by a human observer"], "answer": 0, "explanations": ["on someone’s mind＝某人正在想的事。", "不是放在頭上。", "不是只在人類記憶中。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "She brought a one-year-old African gray parrot she named Alex into her lab to teach him to reproduce the sounds of the English language.", "target": "reproduce", "options": ["copy or produce again", "remove permanently", "breed offspring in this context"], "answer": 0, "explanations": ["reproduce sounds＝模仿、重現聲音。", "不是永久去除。", "此處不是繁殖。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-7", "mode": "vocab", "paragraph": "B", "sentence": "When Pepperberg began her dialogue with Alex, who died last September at the age of 31, many scientists believed animals were incapable of any thought.", "target": "incapable of", "options": ["unable to do or have", "unwilling but fully able to do", "forbidden by a rule to do"], "answer": 0, "explanations": ["incapable of＝沒有能力做到。", "不是只有不願意。", "不是規則禁止。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-8", "mode": "vocab", "paragraph": "B", "sentence": "They were simply machines, robots programmed to react to stimuli but lacking the ability to think or feel.", "target": "stimuli", "options": ["things that trigger a response", "rewards necessarily given after a response", "the responses themselves"], "answer": 0, "explanations": ["stimuli 是 stimulus 複數，指刺激。", "不是必為事後獎勵。", "不是反應本身。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-9", "mode": "vocab", "paragraph": "B", "sentence": "But such claims remain highly controversial.", "target": "controversial", "options": ["causing disagreement or debate", "universally accepted without question", "impossible to investigate"], "answer": 0, "explanations": ["controversial＝有爭議的。", "不是一致接受。", "有爭議不等於不能研究。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "Gut instinct is not science, and it is all too easy to project human thoughts and feelings onto another creature.", "target": "Gut instinct", "options": ["an immediate intuitive feeling", "a conclusion established through controlled evidence", "a digestive illness"], "answer": 0, "explanations": ["gut instinct＝直覺、本能感覺。", "不等於科學確證。", "不是腸胃疾病。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "Gut instinct is not science, and it is all too easy to project human thoughts and feelings onto another creature.", "target": "project human thoughts and feelings onto", "options": ["attribute human mental experiences to", "measure another creature’s thoughts directly using", "remove all human influence from"], "answer": 0, "explanations": ["project…onto＝把人類想法感受投射到……身上。", "不是直接測得牠的想法。", "不是排除人類影響。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "How, then, does a scientist prove that an animal is capable of thinking—that it is able to acquire information about the world and act on it?", "target": "acquire", "options": ["obtain or learn", "automatically prove to everyone", "deliberately forget"], "answer": 0, "explanations": ["acquire information＝取得、習得資訊。", "不是自動證明。", "不是刻意忘記。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "How, then, does a scientist prove that an animal is capable of thinking—th  with a sudden blast of water, can learn how to aim its squirt simply by watching an experienced fish perform the task.", "target": "probe", "options": ["explore or examine by inserting a tool", "protect from any physical contact", "build entirely from scratch"], "answer": 0, "explanations": ["probe termite mounds 指用工具探查蟻丘。", "不是隔絕接觸。", "不是建造蟻丘。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-29", "mode": "vocab", "paragraph": "C", "sentence": "Scrub jays know that other jays are thieves and that stashed food can spoil; sheep can recognize faces; chimpanzees use a variety of tools to probe termite mounds and even use weapons to hunt small mammals; dolphins can imitate human postures; the archerfish, which stuns insects with a sudden blast of water, can learn how to aim its squirt simply by watching an experienced fish perform the task.", "target": "postures", "options": ["positions of the body", "patterns of speech sounds", "opinions held by researchers"], "answer": 0, "explanations": ["postures＝姿勢、體態。", "不是語音模式。", "不是研究觀點。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-30", "mode": "vocab", "paragraph": "C", "sentence": "Scrub jays know that other jays are thieves and that stashed food can spoil; sheep can recognize faces; chimpanzees use a variety of tools to probe termite mounds and even use weapons to hunt small mammals; dolphins can imitate human postures; the archerfish, which stuns insects with a sudden blast of water, can learn how to aim its squirt simply by watching an experienced fish perform the task.", "target": "stuns", "options": ["temporarily disables or dazes", "feeds until completely satisfied", "trains to perform repeatedly"], "answer": 0, "explanations": ["stun insects＝使昆蟲暫時失去反應、擊暈。", "不是餵飽。", "不是訓練。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-31", "mode": "vocab", "paragraph": "D", "sentence": "The humans, along with two younger parrots, also served as Alex’s flock, providing the social input all parrots crave.", "target": "served as", "options": ["acted or functioned as", "were employed to serve meals to", "were officially certified as"], "answer": 0, "explanations": ["serve as a flock＝充當鳥群。", "不是供餐。", "不必有正式認證。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-32", "mode": "vocab", "paragraph": "D", "sentence": "The humans, along with two younger parrots, also served as Alex’s flock, providing the social input all parrots crave.", "target": "flock", "options": ["a social group of birds", "a group of mammals only", "a structure used as a cage"], "answer": 0, "explanations": ["flock＝鳥群。", "不是僅指哺乳動物群。", "不是籠子結構。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-33", "mode": "vocab", "paragraph": "D", "sentence": "The humans, along with two younger parrots, also served as Alex’s flock, providing the social input all parrots crave.", "target": "crave", "options": ["strongly desire or need", "firmly reject", "receive without wanting"], "answer": 0, "explanations": ["crave social input＝渴望社交互動。", "不是排斥。", "不是不想要卻得到。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-34", "mode": "vocab", "paragraph": "D", "sentence": "Like any flock, this one—as small as it was—had its share of drama.", "target": "had its share of drama", "options": ["experienced its own interpersonal tensions and emotional incidents", "regularly performed scripted theatre", "avoided all conflict successfully"], "answer": 0, "explanations": ["have one’s share of drama 指也有不少情緒、人際風波。", "不是演戲。", "不是毫無衝突。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-35", "mode": "vocab", "paragraph": "D", "sentence": "Alex dominated his fellow parrots, acted huffy at times around Pepperberg, tolerated the other female humans, and fell to pieces over a male assistant who dropped by for a visit.", "target": "dominated", "options": ["exerted control or superiority over", "depended entirely on", "never interacted with"], "answer": 0, "explanations": ["dominated fellow parrots＝支配、壓過其他鸚鵡。", "不是完全依賴。", "不是不互動。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-36", "mode": "vocab", "paragraph": "D", "sentence": "Alex dominated his fellow parrots, acted huffy at times around Pepperberg, tolerated the other female humans, and fell to pieces over a male assistant who dropped by for a visit.", "target": "huffy", "options": ["annoyed and showing offence", "relaxed and content", "physically unable to breathe"], "answer": 0, "explanations": ["huffy＝鬧彆扭、氣呼呼的。", "不是放鬆滿足。", "不是呼吸不能。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-37", "mode": "vocab", "paragraph": "D", "sentence": "Alex dominated his fellow parrots, acted huffy at times around Pepperberg, tolerated the other female humans, and fell to pieces over a male assistant who dropped by for a visit.", "target": "tolerated", "options": ["accepted or put up with", "enthusiastically preferred above everyone else", "actively attacked"], "answer": 0, "explanations": ["tolerate＝容忍、接受。", "不等於特別熱愛。", "不是攻擊。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-38", "mode": "vocab", "paragraph": "D", "sentence": "Alex dominated his fellow parrots, acted huffy at times around Pepperberg, tolerated the other female humans, and fell to pieces over a male assistant who dropped by for a visit.", "target": "fell to pieces", "options": ["lost emotional composure", "physically broke into fragments", "became permanently unable to learn"], "answer": 0, "explanations": ["fall to pieces 在此指情緒失去控制。", "不是身體碎裂。", "不是永久失去學習力。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-39", "mode": "vocab", "paragraph": "D", "sentence": "Alex dominated his fellow parrots, acted huffy at times around Pepperberg, tolerated the other female humans, and fell to pieces over a male assistant who dropped by for a visit.", "target": "dropped by", "options": ["visited briefly or informally", "fell physically from a height", "cancelled a planned visit"], "answer": 0, "explanations": ["drop by＝順道、短暫造訪。", "不是從高處掉落。", "不是取消拜訪。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-41", "mode": "vocab", "paragraph": "D", "sentence": "Given that Alex’s brain was the size of a shelled walnut, most researchers thought Pepperberg’s interspecies comm ence": "My plan always was to use his imitative skills to get a better understanding of avian cognition.”", "target": "avian cognition", "options": ["mental processes and understanding in birds", "the structure of bird feathers", "the study of all flying objects"], "answer": 0, "explanations": ["avian＝鳥類的；cognition＝認知。", "不是羽毛構造。", "不是所有飛行物研究。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-55", "mode": "vocab", "paragraph": "G", "sentence": "In other words, because Alex was able to produce a close approximation of the sounds of some English words, Pepperberg could ask him questions about a bird’s basic understanding of the world.", "target": "a close approximation of", "options": ["something very similar to but not necessarily identical to", "an exact duplicate in every respect of", "a completely unrelated substitute for"], "answer": 0, "explanations": ["close approximation＝相當接近的模擬。", "不保證完全相同。", "不是毫無關係的替代。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-56", "mode": "vocab", "paragraph": "G", "sentence": "To demonstrate, Pepperberg carried Alex on her arm to a tall wooden perch in the middle of the room.", "target": "perch", "options": ["a bar or place on which a bird rests", "a container for bird food", "the lower part of a bird’s beak"], "answer": 0, "explanations": ["perch＝鳥棲木、棲息處。", "不是食物容器。", "不是鳥喙下半部。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-57", "mode": "vocab", "paragraph": "G", "sentence": "She then retrieved a green key and a small green cup from a basket on a shelf.", "target": "retrieved", "options": ["went and got back", "permanently discarded", "manufactured for the first time"], "answer": 0, "explanations": ["retrieve＝取回、拿回。", "不是丟棄。", "不是首次製造。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-58", "mode": "vocab", "paragraph": "G", "sentence": "Without hesitation, Alex’s beak opened: “Color.” “What’s different?” Pepperberg asked.", "target": "hesitation", "options": ["a pause caused by uncertainty or reluctance", "a refusal already expressed clearly", "a change in physical ues.", "target": "hues", "options": ["colours or shades", "materials distinguished by hardness", "the shapes of objects"], "answer": 0, "explanations": ["hues＝色彩、色調。", "不是硬度分類。", "不是形狀。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-64", "mode": "vocab", "paragraph": "H", "sentence": "“Talk clearly!” “Don’t be a smart aleck,” Pepperberg said, shaking her head at him.", "target": "smart aleck", "options": ["someone who annoys others by acting as if they know everything", "someone praised without criticism as exceptionally wise", "someone unable to understand any question"], "answer": 0, "explanations": ["smart aleck＝自以為聰明、愛逞聰明的人。", "通常帶批評，不是單純稱讚。", "不是完全不理解問題的人。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-65", "mode": "vocab", "paragraph": "H", "sentence": "“He knows all this, and he gets bored, so he interrupts the others, or he gives the wrong answer just to be obstinate.", "target": "obstinate", "options": ["stubbornly unwilling to cooperate or change", "unable to act because of injury", "unaware that any answer is required"], "answer": 0, "explanations": ["obstinate＝固執、故意不合作的。", "不是受傷不能做。", "不是不知道要答題。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-66", "mode": "vocab", "paragraph": "H", "sentence": "At this stage, he’s like a teenager; he’s moody, and I’m never sure what he’ll do.”", "target": "moody", "options": ["liable to change mood unpredictably", "consistently cheerful", "unable to experience emotion"], "answer": 0, "explanations": ["moody＝情緒多變的。", "不是一直開朗。", "不是沒有情緒。"], "tag": "字彙與語境義"}, {"id": "alex-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "At a time when animals still were considered automatons, she set out to find what was on another creature’s mind by talking to it.", "target": "", "options": ["Pepperberg began trying to investigate an animal’s thoughts through communication when animals were still widely viewed as mechanical beings.", "Pepperberg began only after scientists had already proved animals think exactly like humans.", "She aimed to sical punishment to obtain every sound.", "Alex spoke only because he was denied all food."], "answer": 0, "explanations": ["wasn’t A or B 共同否定兩種手段。", "原句同時否定給點心獎勵及敲爪強迫，選項卻說兩者都有。", "原句未說剝奪食物。"], "tag": "長難句理解", "structure": "主幹：She wasn’t handing…or rapping…。for 表獎勵所對應行為；to make him say…表示強迫發聲目的；make + O + 原形。"}, {"id": "alex-paraphrase-15", "mode": "paraphrase", "paragraph": "F", "sentence": "My plan always was to use his imitative skills to get a better understanding of avian cognition.”", "target": "", "options": ["Pepperberg’s purpose was to use imitation as a way to understand bird cognition better.", "Her only purpose was to make Alex fully acquire a human language.", "She planned to avoid all questions about how birds think."], "answer": 0, "explanations": ["模仿為研究工具，鳥類認知為研究目標。", "與前文否定人類語言目標相違。", "理解認知正是目的。"], "tag": "長難句理解", "structure": "主幹：My plan was to use…。to get…表使用模仿能力的目的；avian cognition 是研究對象。"}, {"id": "alex-paraphrase-16", "mode": "paraphrase", "paragraph": "G", "sentence": "In other words, because Alex was able to produce a close approximation of the sounds of some English words, Pepperberg could ask him questions about a bird’s basic understanding of the world.", "target": "", "options": ["Because Alex could approximate certain English sounds, Pepperberg could ask limited questions about a bird’s understanding.", "Approximate pronunciation let her directly know every thought Alex had.", "She could ask those questions only because Alex’s pronunciation was perfectly identical to a human’s."], "answer": 0, "explanations": ["close approximation、some 及後文限制作答範圍。", "並不能因此知道所有想法。", "接近不等於完全相同。"], "tag": "長難句理解", "structure": "主幹：Pepperberg could ask…。because 子句提供方法基礎；of the sounds…修飾 approximation；about…限定詢問範圍。"}, {"id": "alex-paraphrase-17", "mode": "paraphrase", "paragraph": "G", "sentence": "She couldn’t ask him what he was thinking about, but she could ask him about his knowledge of numbers, shapes, and colors.", "target": "", "options": ["She could ask about numbers, shapes and colours, but not simply ask Alex to report whatever he was thinking.", "She could ask unrestricted questions about all private thoughts but none about shapes.", "The sentence says Alex knew no numbers or colours."], "answer": 0, "explanations": ["couldn’t…but could 明確區分可研究範圍。", "兩部分能力範圍反轉。", "限制提問不等於完全沒有相關知識。"], "tag": "長難句理解", "structure": "主幹：She couldn’t ask…but could ask…。what he was thinking about 為間接問句，末尾 about 是 think about 的介系詞。"}, {"id": "alex-paraphrase-18", "mode": "paraphrase", "paragraph": "G", "sentence": "Since parrots lack lips (another reason it was difficult for Alex to pronounce some sounds, such as ba), the words seemed to come from the air around him, as if a ventriloquist were speaking.", "target": "", "options": ["The lack of lips is given as a reason for pronunciation difficulty, while the voice’s seemingly disembodied quality is compared to ventriloquism.", "A hidden human ventriloquist was actually producing every word Alex said.", "The writer says Alex had human lips and therefore sounded entirely human."], "answer": 0, "explanations": ["as if 是感受的比擬，不是揭露有人代講。", "將比擬改成事實。", "與 lack lips 及 digitized sound 相反。"], "tag": "長難句理解", "structure": "主幹：the words seemed to come…。Since 給原因；括號補述 another reason；as if + were 表彷彿的情境。"}, {"id": "alex-paraphrase-19", "mode": "paraphrase", "paragraph": "H", "sentence": "And, then, as if to offer final proof of the mind inside his bird’s brain, Alex spoke up.", "target": "", "options": ["The narrator presents Alex’s interjection as though it supplied further evidence of a mind, without claiming the comparison is a formal scientific proof.", "The phrase as if establishes a conclusive laboratory proof beyond any interpretation.", "Alex remained completely silent during all the tests."], "answer": 0, "explanations": ["as if to offer 是敘事比擬。", "不能把敘事比擬升格為最終確證。", "spoke up 明說開口。"], "tag": "長難句理解", "structure": "主幹：Alex spoke up。as if to offer…為目的樣態比擬；of the mind…修飾 proof，不是實驗證明程序。"}, ocab", "paragraph": "B", "sentence": "They were simply machines, robots programmed to react to stimuli but lacking the ability to think or feel.", "target": "react to", "options": ["respond to a stimulus or event", "create every stimulus intentionally", "stay completely unaffected by"], "answer": 0, "explanations": ["react to stimuli＝對刺激作出反應。", "不是製造所有刺激。", "不是完全無反應。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-69", "mode": "vocab", "paragraph": "B", "sentence": "We see the love in our dogs’ eyes and know that, of course, they have thoughts and emotions.", "target": "emotions", "options": ["feelings such as affection or fear", "the physical organs themselves", "facts known with certainty regardless of feeling"], "answer": 0, "explanations": ["emotions＝情緒、情感。", "不是器官。", "不是與感受無關的確定事實。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-70", "mode": "vocab", "paragraph": "B", "sentence": "But such claims remain highly controversial.", "target": "claims", "options": ["statements asserted to be true", "conclusions necessarily verified beyond doubt", "formal demands for money only"], "answer": 0, "explanations": ["claims 在此指主張、說法。", "主張不等於必已確證。", "不只索款。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-72", "mode": "vocab", "paragraph": "C", "sentence": "Certain skills are considered key signs of higher mental abilities: good memory, a grasp of grammar and symbols, self-awareness, understanding others’ motives, imitating others, and being creative.", "target": "mental abilities", "options": ["capacities involving thought and understanding", "only muscular strength", "only the ability to imitate a noise physically"], "answer": 0, "explanations": ["mental abilities＝心智能力。", "不是僅肌力。", "不限發聲模仿。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-73", "mode": "vocab", "paragraph": "C", "sentence": "Certain skills are considered key signs of higher mental abilities: good memory, a grasp of grammar and symbols, self-awareness, understanding others’ motives, imitating others, and being creative.", "target": "symbols", "options": ["signs representing meanings or concepts", "objects with no possible meaning by definition", "only the actual things being referred to"], "answer": 0, "explanations": ["symbols＝代表意義的符號。", "不是按定義毫無意義。", "符號不同於所代表實物。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-75", "mode": "vocab", "paragraph": "C", "sentence": "Bit by bit, in ingenious experiments, researchers have documented these talents in other species, gradually chipping away at what we thought made human beings distinctive while offering a glimpse of where our own abilities came from.", "target": "species", "options": ["a particular biological kind of organism", "any animals living in one cage", "every individual animal’s personal name"], "answer": 0, "explanations": ["species＝物種。", "同籠不等於同物種。", "不是個體名字。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-77", "mode": "vocab", "paragraph": "C", "sentence": "Scrub jays know that other jays are thieves and that stashed food can spoil; sheep can recognize faces; chimpanzees use a variety of tools to probe termite mounds and even use weapons to hunt small mammals; dolphins can imitate human postures; the archerfish, which stuns insects with a sudden blast of water, can learn how to aim its squirt simply by watching an experienced fish perform the task.", "target": "a sudden blast of water", "options": ["an abrupt forceful burst of water", "a slow steady rise in sea level", "a quiet period with no water movement"], "answer": 0, "explanations": ["blast of water＝突發的強力水流。", "不是緩慢水位上升。", "不是靜止。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-79", "mode": "vocab", "paragraph": "D", "sentence": "The humans, along with two younger parrots, also served as Alex’s flock, providing the social input all parrots crave.", "target": "social input", "options": ["interaction and stimulation provided by others", "food intake alone", "genetic instructions fixed at birth only"], "answer": 0, "explanations": ["social input＝他者給予的社交刺激、互動。", "不是只有食物。", "不是僅出生固定基因。"], "tag": "搭配與語境義"}, {"id": "alex-vocab-81", "mode": "vocab", "paragraph": "E", "sentence": "The bonobo Kanzi, for instance, carries his symbol-communication board with him so he can “talk” to his human researchers, and has invented combinations of symbols to express his thoughts.", "target": "combinations", "options": ["arrangements bringing separate elements together", "the removal of every shared element", "items that cannot be used together"], "answer": 0, "explanations": ["combinations of symbols＝符號的組合。", "不是移除一切共同點。", "不是不能合用。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-83", "mode": "vocab", "paragraph": "G", "sentence": "To demonstrate, Pepperberg carried Alex on her arm to a tall wooden perch in the middle of the room.", "target": "demonstrate", "options": ["show by an example or performance", "conceal all observable behaviour", "assert without giving any example"], "answer": 0, "explanations": ["To demonstrate 指以例子或操作示範。", "不是隱藏。", "不是無例說斷言。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-84", "mode": "vocab", "paragraph": "H", "sentence": "For the next 20 minutes, Alex ran through his tests, distinguishing colors, shapes, sizes, and materials (wool versus wood versus metal).", "target": "distinguishing", "options": ["recognizing differences between", "making all items identical", "refusing to examine"], "answer": 0, "explanations": ["distinguish colours＝辨別顏色。", "不是使其一致。", "不是拒絕檢視。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-85", "mode": "vocab", "paragraph": "H", "sentence": "For the next 20 minutes, Alex ran through his tests, distinguishing colors, shapes, sizes, and materials (wool versus wood versus metal).", "target": "versus", "options": ["compared with or contrasted with", "always combined into one", "caused exclusively by"], "answer": 0, "explanations": ["wool versus wood versus metal＝羊毛、木材、金屬之間的對比。", "不是一定合為一物。", "不是唯一因果。"], "tag": "字彙與語境義"}, {"id": "alex-vocab-86", "mode": "vocab", "paragraph": "H", "sentence": "“He knows all this, and he gets bored, so he interrupts the others, or he gives the wrong answer just to be obstinate.", "target": "interrupts", "options": ["breaks into another’s activity or speech", "waits until everyone has finished", "completes an activity without any pause"], "answer": 0, "explanations": ["interrupt others＝打斷他者。", "不是等到都完成。", "不是自己毫無停頓完成。"], "tag": "字彙與語境義"}]}, {"id": "john-ray-plants", "title": "John Ray and the Study of Plants", "sourceTitle": "John Ray and the Study of Plants", "subtitle": "", "part": 2, "topic": "植物學、科學觀察與知識建立", "sourceNote": "改寫練習須區分作者推論、歷史自述與研究計畫；題目字彙不等於原題答案。", "paragraphs": [{"label": "A", "text": "The 17th-century English scholar and botanist John Ray was well aware that he lived through, and participated in, a profound revolution in the way people interacted with nature. In the preface to his Synopsis of British Plants, published in 1690, he gave thanks that he had been born at a time when traditional dependence on the teaching of the Greek philosopher Aristotle (384–322 BCE) had given way to a new philosophy, based on experiment and observation of the real world, that we now call science."}, {"label": "B", "text": "Ray was born in 1627. His father was a village blacksmith, and his mother was also a respected member of the community, a healer who was an expert in folk medicine and the use of herbs to treat ailments. Ray must have stood out as an unusually bright boy among his schoolmates, and his talents were recognised by a church official, Samuel Covell, who had graduated from Cambridge University in 1600, and maintained his links with his university. Through his influence, Ray was admitted to Cambridge University in 1644 at the age of seventeen—a huge step for a village blacksmith’s son. There he made a solid start, and quickly gained a reputation as a brilliant student. He studied the classics (Greek, Latin and Hebrew) and mathematics, but there was nothing yet we would now call science in the curriculum. After graduating in 1648, he became a minor member of staff at Trinity College, Cambridge. He was appointed Lecturer in Greek in 1651, Lecturer in Mathematics in 1653, and Lecturer in Humanities in 1655."}, {"label": "C", "text": "Almost immediately after graduating, Ray also seems to have developed the interest to which he would devote the rest of his life: the study of the natural world. He explains this conversion into a naturalist—in particular into a botanist—in the preface to his first book, the Cambridge Catalogue of English Plants. Here Ray tells us that he suffered an illness in his early twenties, and was advised to take long walks and ride in the fresh air while recovering. While doing this, he became interested in the local flora, and finding nobody able to teach him, Ray investigated it for himself. He then went on to pass on the knowledge he acquired to others."}, {"label": "D", "text": "By the mid-1650s, even the first-year students at Trinity College were able to identify the plants and flowers around Cambridge, as they were being taught (unofficially—none of this was part of their formal education) by Ray. Many of them were the sons of landowners, and so had a natural, if amateurish, interest in country matters. But a few of them took his efforts to understand the natural world much more seriously. One of these, Francis Willughby, later played an important part in Ray’s life."}, {"label": "E", "text": "Having himself had no authority on the subject of plants on which to draw, Ray also started work on what would become his Cambridge Catalogue of English Plants. The work was not published until 1660 because, as Ray explained in the preface, he had to start from scratch: “I had first to become familiar with the literature, to compare the plants that I found with the pictures, and when there seemed to be a resemblance, to go fully into any unknown descriptions. Gaining skill by experience, I acquired at last the ability to recognise to which tribe and family similar plants could be assigned; this taught me to search for similarities and saved a vast deal of labour, which others would otherwise have spent resolving those difficulties. I was eager to make the most of this and was fortunate to share my enthusiasm with my friends…”"}, {"label": "F", "text": "Ray’s Cambridge Catalogue of English Plants was much more than a simple list of species. It gave the names of plants found in the area around Cambridge and included information about where they grew and how common they were. In doing this, Ray was producing something that would be of practical use to students and other readers interested in the local natural world. At the same time, the book showed his determination to describe plants accurately, on the basis of direct examination rather than reliance on old authorities. In this respect, it reflected the spirit of the new learning that Ray admired."}, {"label": "G", "text": "Ray’s studies of plants were only the beginning of a much larger ambition. With the support of Francis Willughby, he began to imagine a more comprehensive investigation of nature, one that would attempt to classify living things according to careful observation of their shared characteristics. This was an ambitious undertaking, especially at a time when many aspects of the natural world remained poorly described. Yet Ray believed that by collecting evidence systematically and comparing related forms, it would be possible to build a more reliable understanding of nature than scholars had possessed before."}], "questions": [{"id": "ray-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "The 17th-century English scholar and botanist John Ray was well aware that he lived through, and participated in, a profound revolution in the way people interacted with nature.", "target": "scholar", "options": ["a person engaged in serious academic study", "any person attending primary school", "a person employed only to copy books"], "answer": 0, "explanations": ["scholar＝學者。", "不是所有小學生。", "不只指抄寫者。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "The 17th-century English scholar and botanist John Ray was well aware that he lived through, and participated in, a profound revolution in the way people interacted with nature.", "target": "botanist", "options": ["a scientist who studies plants", "a scientist who studies only animal behaviour", "a person who designs boats"], "answer": 0, "explanations": ["botanist＝植物學家。", "不是動物行為專家。", "不是造船者。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "The 17th-century English scholar and botanist John Ray was well aware that he lived through, and participated in, a profound revolution in the way people interacted with nature.", "target": "well aware", "options": ["fully conscious or informed", "only vaguely suspicious", "deliberately pretending not to know"], "answer": 0, "explanations": ["well aware＝清楚知道。", "不是僅模糊懷疑。", "不是假裝不知。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "The 17th-century English scholar and botanist John Ray was well aware that he lived through, and participated in, a profound revolution in the way people interacted with nature.", "target": "profound revolution", "options": ["a deep and far-reaching transformation", "a minor temporary adjustment", "a physical circular movement only"], "answer": 0, "explanations": ["profound revolution 指深刻、影響廣泛的變革。", "不是細微暫時調整。", "不是僅指旋轉。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "The 17th-century English scholar and botanist John Ray was well aware that he lived through, and participated in, a profound revolution in the way people interacted with nature.", "target": "interacted with", "options": ["engaged with or acted in relation to", "remained completely separate from", "controlled every aspect of"], "answer": 0, "explanations": ["interact with nature＝與自然互動。", "不是完全隔絕。", "不保證控制一切。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "In the preface to his Synopsis of British Plants, published in 1690, he gave thanks that he had been born at a time when traditional dependence on the teaching of the Greek philosopher Aristotle (384–322 BCE) had given way to a new philosophy, based on experiment and observation of the real world, that we now call science.", "target": "preface", "options": ["an introductory section at the beginning of a book", "the alphabetical index at the end", "an independent review written after publication"], "answer": 0, "explanations": ["preface＝序言。", "不是書末索引。", "不是出版後外部書評。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "In the preface to his Synopsis of British Plants, published in 1690, he gave thanks that he had been born at a time when traditional dependence on the teaching of the Greek philosopher Aristotle (384–322 BCE) had given way to a new philosophy, based on experiment and observation of the real world, that we now call science.", "target": "dependence on", "options": ["reliance on", "opposition to", "ownership of"], "answer": 0, "explanations": ["dependence on＝依賴。", "不是反對。", "不是所有權。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "In the preface to his Synopsis of British Plants, published in 1690, he gave thanks that he had been born at a time when traditional dependence on the teaching of the Greek philosopher Aristotle (384–322 BCE) had given way to a new philosophy, based on experiment and observation of the real world, that we now call science.", "target": "had given way to", "options": ["had been replaced by", "had become more dominant than", "had been exactly copied by"], "answer": 0, "explanations": ["give way to＝被……取代、讓位於。", "不是變得更占優勢。", "不是被原樣照抄。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-10", "mode": "vocab", "paragraph": "A", "sentence": "In the preface to his Synopsis of British Plants, published in 1690, he gave thanks that he had been born at a time when traditional dependence on the teaching of the Greek philosopher Aristotle (384–322 BCE) had given way to a new philosophy, based on experiment and observation of the real world, that we now call science.", "target": "philosophy", "options": ["a system of ideas or principles", "a list of plant specimens only", "a compulsory legal code"], "answer": 0, "explanations": ["philosophy 在此指思想體系、理念。", "不只是植物標本清單。", "不是法律。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-11", "mode": "vocab", "paragraph": "A", "sentence": "In the preface to his Synopsis of British Plants, published in 1690, he gave thanks that he had been born at a time when traditional dependence on the teaching of the Greek philosopher Aristotle (384–322 BCE) had given way to a new philosophy, based on experiment and observation of the real world, that we now call science.", "target": "observation", "options": ["careful watching or examination", "accepting tradition without checking", "changing a result to fit a claim"], "answer": 0, "explanations": ["observation＝觀察、檢視。", "不是不查證便接受。", "不是修改結果迎合主張。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "His father was a village blacksmith, and his mother was also a respected member of the community, a healer who was an expert in folk medicine and the use of herbs to treat ailments.", "target": "blacksmith", "options": ["a person who makes or repairs things from iron", "a person who treats illness with herbs", "a person who copies religious books"], "answer": 0, "explanations": ["blacksmith＝鐵匠。", "不是草藥治療者。", "不是抄經者。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "His father was a village blacksmith, and his mother was also a respected member of the community, a healer who was an expert in folk medicine and the use of herbs to treat ailments.", "target": "folk medicine", "options": ["traditional community-based healing practices", "only officially regulated modern surgery", "the study of human ancestry"], "answer": 0, "explanations": ["folk medicine＝民俗、民間醫療。", "不是只指現代外科。", "不是族譜研究。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-15", "mode": "vocab", "paragraph": "B", "sentence": "His father was a village blacksmith, and his mother was also a respected member of the community, a healer who was an expert in folk medicine and the use of herbs to treat ailments.", "target": "ailments", "options": ["illnesses or health problems", "professional medical qualifications", "hereditary advantages"], "answer": 0, "explanations": ["ailments＝疾病、病痛。", "不是醫療資格。", "不是遺傳優勢。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-16", "mode": "vocab", "paragraph": "B", "sentence": "Ray must have stood out as an unusually bright boy among his schoolmates, and his talents were recognised by a church official, Samuel Covell, who had graduated from Cambridge University in 1600, and maintained his links with his university.", "target": "stood out", "options": ["was noticeably different or exceptional", "stood physically outside a room", "was excluded because of misconduct"], "answer": 0, "explanations": ["stand out＝突出、出眾。", "不是站在外面。", "不自帶違規被排除之意。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-19", "mode": "vocab", "paragraph": "B", "sentence": "Through his influence, Ray was admitted to Cambridge University in 1644 at the age of seventeen—a huge step for a village blacksmith’s son.", "target": "admitted to", "options": ["allowed to enter or join", "forced to confess an offence to", "permanently expelled from"], "answer": 0, "explanations": ["be admitted to university＝獲准入學。", "不是承認罪行。", "不是被開除。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-20", "mode": "vocab", "paragraph": "B", "sentence": "There he made a solid start, and quickly gained a reputation as a brilliant student.", "target": "gained a reputation", "options": ["became known for a particular quality", "received a formal salary increase", "obtained legal ownership of a title"], "answer": 0, "explanations": ["gain reputation＝獲得名聲、建立聲譽。", "不是加薪。", "不
