rest to which he would devote the rest of his life: the study of the natural world.", "target": "devote", "options": ["give time or effort to a purpose", "divide equally without priorities", "remove oneself entirely from"], "answer": 0, "explanations": ["devote one’s life to＝投入一生於。", "不是沒有優先次序地均分。", "不是退出。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-26", "mode": "vocab", "paragraph": "C", "sentence": "He explains this conversion into a naturalist—in particular into a botanist—in the preface to his first book, the Cambridge Catalogue of English Plants.", "target": "conversion", "options": ["a change from one orientation or role to another", "the confirmation of an unchanged career plan", "a numerical calculation only"], "answer": 0, "explanations": ["conversion 此處指轉向自然研究者的過程。", "不是確認未變計畫。", "不是僅指數值換算。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-27", "mode": "vocab", "paragraph": "C", "sentence": "He explains this conversion into a naturalist—in particular into a botanist—in the preface to his first book, the Cambridge Catalogue of English Plants.", "target": "naturalist", "options": ["a person who studies the natural world", "a person who rejects all artificial objects", "an advocate of a political nationality"], "answer": 0, "explanations": ["naturalist＝博物學家、自然研究者。", "不是一概排斥人造物的人。", "不是民族政治倡議者。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-29", "mode": "vocab", "paragraph": "C", "sentence": "While doing this, he became interested in the local flora, and finding nobody able to teach him, Ray investigated it for himself.", "target": "flora", "options": ["the plants of a particular region", "the animals of a particular region", "the rocks beneath a region"], "answer": 0, "explanations": ["flora＝某地植物群。", "動物群是 fauna。", "不是岩石。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-30", "mode": "vocab", "paragraph": "C", "sentence": "While doing this, he became interested in the local flora, and finding nobody able to teach him, Ray investigated it for himself.", "target": "investigated", "options": ["examined systematically to find out more", "copied without checking", "officially prohibited"], "answer": 0, "explanations": ["investigate＝研究、調查。", "不是不查核就抄。", "不是禁止。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-31", "mode": "vocab", "paragraph": "C", "sentence": "He then went on to pass on the knowledge he acquired to others.", "target": "acquired", "options": ["obtained or learned", "lent to someone temporarily", "denied having"], "answer": 0, "explanations": ["acquire knowledge＝習得知識。", "不是暫借他人。", "不是否認擁有。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-32", "mode": "vocab", "paragraph": "D", "sentence": "By the mid-1650s, even the first-year students at Trinity College were able to identify the plants and flowers around Cambridge, as they were being taught (unofficially—none of this was part of their formal education) by Ray.", "target": "identify", "options": ["recognise what something is", "make two objects physically identical", "assign ownership without examining"], "answer": 0, "explanations": ["identify plants＝辨認植物。", "不是使兩物相同。", "不是不看就分配所有權。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-33", "mode": "vocab", "paragraph": "D", "sentence": "By the mid-1650s, even the first-year students at Trinity College were able to identify the plants and flowers around Cambridge, as they were being taught (unofficially—none of this was part of their formal education) by Ray.", "target": "formal education", "options": ["officially organised instruction", "casual learning outside official courses", "education concerned only with polite manners"], "answer": 0, "explanations": ["formal education＝正式教育。", "不是課外非正式學習。", "不是只教禮貌。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-34", "mode": "vocab", "paragraph": "D", "sentence": "Many of them were the sons of landowners, and so had a natural, if amateurish, interest in country matters.", "target": "landowners", "options": ["people who own land", "people temporarily walking across land", "workers renting their tools"], "answer": 0, "explanations": ["landowners＝地主、土地所有者。", "不是路人。", "不是租工具者。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-35", "mode": "vocab", "paragraph": "D", "sentence": "Many of them were the sons of landowners, and so had a natural, if amateurish, interest in country matters.", "target": "amateurish", "options": ["showing non-professional interest or skill", "necessarily superior to experts", "performed for payment by licensed specialists"], "answer": 0, "explanations": ["amateurish＝業餘、非專業的。", "不表示必然勝過專家。", "不是正式付費專業服務。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-36", "mode": "vocab", "paragraph": "D", "sentence": "Many of them were the sons of landowners, and so had a natural, if amateurish, interest in country matters.", "target": "country matters", "options": ["issues and activities connected with rural life", "international relations between countries", "government administration only"], "answer": 0, "explanations": ["country 此處指鄉村，country matters＝鄉野事物。", "不是國際關係。", "不是僅政府事務。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-37", "mode": "vocab", "paragraph": "E", "sentence": "Having himself had no authority on the subject of plants on which to draw, Ray also started work on what would become his Cambridge Catalogue of English Plants.", "target": "authority", "options": ["a knowledgeable expert or authoritative source", "only a person with legal power", "a set of compulsory laboratory rules"], "answer": 0, "explanations": ["authority 此處指可借重的專家、權威資料。", "不只法律權力者。", "不是實驗規章本身。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-38", "mode": "vocab", "paragraph": "E", "sentence": "Having himself had no authority on the subject of plants on which to draw, Ray also started work on what would become his Cambridge Catalogue of English Plants.", "target": "draw", "options": ["make use of a source or resource", "make a picture in this context", "choose a winner randomly only"], "answer": 0, "explanations": ["draw on＝利用、借重資料。", "此處不是畫圖。", "不是只指抽獎。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-39", "mode": "vocab", "paragraph": "E", "sentence": "The work was not published until 1660 because, as Ray explained in the preface, he had to start from scratch: “I had first to become familiar with the literature, to compare the plants that I found with the pictures, and when there seemed to be a resemblance, to go fully into any unknown descriptions.", "target": "from scratch", "options": ["from the beginning without a ready-made foundation", "by copying a finished work", "only after completing the task"], "answer": 0, "explanations": ["from scratch＝從零、從頭開始。", "不是照抄成品。", "不是完成後才開始。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-40", "mode": "vocab", "paragraph": "E", "sentence": "The work was not published until 1660 because, as Ray explained in the preface, he had to start from scratch: “I had first to become familiar with the literature, to compare the plants that I found with the pictures, and when there seemed to be a resemblance, to go fully into any unknown descriptions.", "target": "literature", "options": ["existing writings on a subject", "only imaginative novels and poetry", "a collection of unwritten personal guesses"], "answer": 0, "explanations": ["literature 在此指相關文獻。", "不只小說詩歌。", "不是未記錄猜測。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-41", "mode": "vocab", "paragraph": "E", "sentence": "The work was not published until 1660 because, as Ray explained in the preface, he had to start from scratch: “I had first to become familiar with the literature, to compare the plants that I found with the pictures, and when there seemed to be a resemblance, to go fully into any unknown descriptions.", "target": "resemblance", "options": ["similarity in appearance or features", "complete absence of shared features", "the legal transfer of a specimen"], "answer": 0, "explanations": ["resemblance＝相似之處。", "不是毫無共同點。", "不是標本所有權轉移。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-42", "mode": "vocab", "paragraph": "E", "sentence": "Gaining skill by experience, I acquired at last the ability to recognise to which tribe and family similar plants could be assigned; this taught me to search for similarities and saved a vast deal of labour, which others would otherwise have spent resolving those difficulties.", "target": "assigned", "options": ["placed in a category", "sent to a new home only", "judged financially valuable"], "answer": 0, "explanations": ["assigned to a family 指歸入某分類。", "不是僅搬家。", "不是估價。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-43", "mode": "vocab", "paragraph": "E", "sentence": "I was eager to make the most of this and was fortunate to share my enthusiasm with my friends…”", "target": "make the most of", "options": ["use as effectively as possible", "produce the greatest physical quantity of", "avoid relying on"], "answer": 0, "explanations": ["make the most of＝充分利用。", "不是單指製造數量最多。", "不是避免使用。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-44", "mode": "vocab", "paragraph": "E", "sentence": "I was eager to make the most of this and was fortunate to share my enthusiasm with my friends…”", "target": "enthusiasm", "options": ["strong interest and eagerness", "reluctance to become involved", "a guaranteed successful result"], "answer": 0, "explanations": ["enthusiasm＝熱忱、熱情。", "不是不願參與。", "不是必定成功。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-45", "mode": "vocab", "paragraph": "F", "sentence": "Ray’s Cambridge Catalogue of English Plants was much more than a simple list of species.", "target": "species", "options": ["groups of organisms of a particular biological kind", "all organisms sharing the same habitat", "the personal names given to specimens"], "answer": 0, "explanations": ["species＝物種。", "同棲地未必同物種。", "不是個體名字。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-46", "mode": "vocab", "paragraph": "F", "sentence": "In doing this, Ray was producing something that would be of practical use to students and other readers interested in the local natural world.", "target": "of practical use", "options": ["useful in real activities", "valuable only as decoration", "certain to become profitable"], "answer": 0, "explanations": ["of practical use＝有實際用途。", "不是只有裝飾價值。", "有用不保證獲利。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-47", "mode": "vocab", "paragraph": "F", "sentence": "At the same time, the book showed his determination to describe plants accurately, on the basis of direct examination rather than reliance on old authorities.", "target": "determination", "options": ["firmness of purpose", "a fixed mathematical result only", "a lack of willingness to continue"], "answer": 0, "explanations": ["determination 在此指決心。", "不是只指計算結果。", "不是不願繼續。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-48", "mode": "vocab", "paragraph": "F", "sentence": "At the same time, the book showed his determination to describe plants accurately, on the basis of direct examination rather than reliance on old authorities.", "target": "on the basis of", "options": ["using as the foundation or evidence", "despite evidence contradicting", "without considering"], "answer": 0, "explanations": ["on basis of＝以……為依據。", "不是儘管證據相反。", "不是不考慮。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-49", "mode": "vocab", "paragraph": "F", "sentence": "At the same time, the book showed his determination to describe plants accurately, on the basis of direct examination rather than reliance on old authorities.", "target": "reliance on", "options": ["dependence on", "a systematic rejection of", "proof of ownership of"], "answer": 0, "explanations": ["reliance on＝依靠、依賴。", "不是全面拒絕。", "不是所有權證明。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-50", "mode": "vocab", "paragraph": "F", "sentence": "At the same time, the book showed his determination to describe plants accurately, on the basis of direct examination rather than reliance on old authorities.", "target": "authorities", "options": ["recognised experts or accepted scholarly sources", "only government officials", "physical tools used to inspect plants"], "answer": 0, "explanations": ["old authorities 此處指舊有權威學者或文獻。", "不專指政府官員。", "不是實體工具。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-51", "mode": "vocab", "paragraph": "F", "sentence": "In this respect, it reflected the spirit of the new learning that Ray admired.", "target": "reflected", "options": ["expressed or represented", "copied a mirror image only", "contradicted completely"], "answer": 0, "explanations": ["reflect the spirit＝體現精神。", "不是只指鏡面反射。", "不是完全違背。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-52", "mode": "vocab", "paragraph": "G", "sentence": "With the support of Francis Willughby, he began to imagine a more comprehensive investigation of nature, one that would attempt to classify living things according to careful observation of their shared characteristics.", "target": "comprehensive", "options": ["covering a wide range thoroughly", "restricted to one minor detail", "easy enough to require no investigation"], "answer": 0, "explanations": ["comprehensive＝全面、廣泛而完整的。", "不是限單一細節。", "不表示無需研究。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-53", "mode": "vocab", "paragraph": "G", "sentence": "With the support of Francis Willughby, he began to imagine a more comprehensive investigation of nature, one that would attempt to classify living things according to careful observation of their shared characteristics.", "target": "classify", "options": ["arrange into groups according to features", "name randomly without comparing", "remove from a collection permanently"], "answer": 0, "explanations": ["classify＝分類。", "不是隨機取名。", "不是永久刪除。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-54", "mode": "vocab", "paragraph": "G", "sentence": "With the support of Francis Willughby, he began to imagine a more comprehensive investigation of nature, one that would attempt to classify living things according to careful observation of their shared characteristics.", "target": "shared characteristics", "options": ["features held in common", "traits found in only one individual", "differences that prevent comparison"], "answer": 0, "explanations": ["shared characteristics＝共同特徵。", "不是只某個體有。", "不是不能比較的差異。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-55", "mode": "vocab", "paragraph": "G", "sentence": "This was an ambitious undertaking, especially at a time when many aspects of the natural world remained poorly described.", "target": "undertaking", "options": ["a demanding project or task", "a completed scientific proof", "an inherited social title"], "answer": 0, "explanations": ["undertaking 作名詞＝任務、事業。", "不是已完成的確證。", "不是世襲頭銜。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-56", "mode": "vocab", "paragraph": "G", "sentence": "Yet Ray believed that by collecting evidence systematically and comparing related forms, it would be possible to build a more reliable understanding of nature than scholars had possessed before.", "target": "systematically", "options": ["according to an organised method", "at random without a plan", "with absolute certainty in every result"], "answer": 0, "explanations": ["systematically＝有系統地。", "不是隨機無計畫。", "不保證結果絕對確定。"], "tag": "字彙與語境義"}, {"id": "ray-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "The 17th-century English scholar and botanist John Ray was well aware that he lived through, and participated in, a profound revolution in the way people interacted with nature.", "target": "", "options": ["Ray recognised both that a major change in people’s relationship with nature was occurring and that he was part of it.", "Ray believed no significant change occurred in his lifetime.", "He observed the change only centuries after it had ended."], "answer": 0, "explanations": ["lived through 與 participated in 並列兩種關係。", "profound revolution 與此相反。", "原文指自己生活其中。"], "tag": "長難句理解", "structure": "主幹：Ray was aware that…。that 內 lived through…and participated in…並列；the way 後 people interacted…說變革面向。"}, {"id": "ray-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "In the preface to his Synopsis of British Plants, published in 1690, he gave thanks that he had been born at a time when traditional dependence on the teaching of the Greek philosopher Aristotle (384–322 BCE) had given way to a new philosophy, based on experiment and observation of the real world, that we now call science.", "target": "", "options": ["Ray welcomed living at a time when dependence on Aristotle was giving way to an approach based on experiment and observation.", "Ray thanked Aristotle for replacing experimental science with older teachings.", "The sentence says the new philosophy excluded all observation of reality."], "answer": 0, "explanations": ["had given way to 表舊依賴讓位於新方式。", "更替方向與感謝對象錯誤。", "based on observation 與此相反。"], "tag": "長難句理解", "structure": "主幹：he gave thanks that…。published…修飾書；at a time when…界定年代；based on…與 that we now call…皆修飾新理念。"}, {"id": "ray-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "His father was a village blacksmith, and his mother was also a respected member of the community, a healer who was an expert in folk medicine and the use of herbs to treat ailments.", "target": "", "options": ["Ray came from a family with a blacksmith father and a respected mother skilled in folk medicine.", "His mother’s only role was to assist his father in metalwork.", "Both parents were described as university-trained medical doctors."], "answer": 0, "explanations": ["a healer…補充母親專長。", "原文明說醫療專長。", "沒有大學醫師資格資訊。"], "tag": "長難句理解", "structure": "主幹：His father was…and his mother was…。a healer 為母親的同位語；who…說明專長；to treat…表藥草用途。"}, {"id": "ray-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Ray must have stood out as an unusually bright boy among his schoolmates, and his talents were recognised by a church official, Samuel Covell, who had graduated from Cambridge University in 1600, and maintained his links with his university.", "target": "", "options": ["The writer infers that Ray was conspicuously intelligent, and reports that Covell recognised his talents and retained university connections.", "The writer reports a legal requirement that Ray had to outperform every classmate.", "Covell’s recognition proves Ray himself graduated in 1600."], "answer": 0, "explanations": ["must have 是過去推論；who graduated 指 Covell。", "must 不是此處的義務。", "畢業年份歸屬錯誤。"], "tag": "長難句理解", "structure": "主幹：Ray must have stood out…and talents were recognised…。Samuel Covell 同位命名；who 修飾 Covell，不是 Ray。"}, {"id": "ray-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "Through his influence, Ray was admitted to Cambridge University in 1644 at the age of seventeen—a huge step for a village blacksmith’s son.", "target": "", "options": ["Covell’s influence helped Ray enter Cambridge at seventeen, a significant opportunity for a blacksmith’s son.", "Ray entered Cambridge at seventeen because his father was already a university lecturer.", "The passage states his admission had no connection with Covell."], "answer": 0, "explanations": ["his 承前指 Covell；破折號後評價階層背景下的進展。", "父親是村中鐵匠，不是大學講師；入學助力來自 Covell。", "Through influence 明確表示關聯。"], "tag": "長難句理解", "structure": "主幹：Ray was admitted…。Through his influence 表助力；at age…表時間；a huge step 為整個事件的同位評述。"}, {"id": "ray-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "He studied the classics (Greek, Latin and Hebrew) and mathematics, but there was nothing yet we would now call science in the curriculum.", "target": "", "options": ["Ray’s formal studies included classical subjects and mathematics, but nothing corresponding to modern science was yet in the curriculum.", "Ray’s degree consisted entirely of modern experimental science.", "The sentence says mathematics was not taught at Cambridge."], "answer": 0, "explanations": ["nothing we would now call science 以現代概念對照當時課程。", "與 nothing…science 相反。", "mathematics 明列在內。"], "tag": "長難句理解", "structure": "主幹：He studied A and B, but there was nothing…。we would now call science 為省略 that 的關係子句；would now call 是現代觀點，不是過去習慣。"}, {"id": "ray-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "Almost immediately after graduating, Ray also seems to have developed the interest to which he would devote the rest of his life: the study of the natural world.", "target": "", "options": ["The writer cautiously dates Ray’s lifelong natural-history interest to soon after graduation.", "Ray’s lifelong interest is conclusively dated to his earliest childhood.", "Ray stopped studying nature immediately after graduating."], "answer": 0, "explanations": ["seems to have 保留推斷；would devote 從過去看後續人生。", "將推斷改確證，且時間改成童年。", "developed interest 不是停止研究。"], "tag": "長難句理解", "structure": "主幹：Ray seems to have developed the interest…。to which…修飾 interest；would devote 表過去觀點下的將來；冒號後解釋 interest。"}, {"id": "ray-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "Here Ray tells us that he suffered an illness in his early twenties, and was advised to take long walks and ride in the fresh air while recovering.", "target": "", "options": ["Ray reported falling ill and being advised to walk and ride outdoors during recovery.", "Ray reported that botanical expertise caused his illness.", "Ray was advised to stay indoors and avoid fresh air."], "answer": 0, "explanations": ["tells us that 引出他的自述；被建議的是康復活動。", "原文只說他生病後接受康復建議，沒有說植物專長導致疾病。", "原文建議到戶外散步、騎乘與呼吸新鮮空氣，不是留在室內。"], "tag": "長難句理解", "structure": "主幹：Ray tells us that he suffered…and was advised…。兩個並列謂語共用 he；while recovering 省略 he was。"}, {"id": "ray-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "While doing this, he became interested in the local flora, and finding nobody able to teach him, Ray investigated it for himself.", "target": "", "options": ["While taking the recommended outdoor exercise, Ray became interested in plants and studied them himself because he could find no teacher.", "Ray had an expert botanist teaching him every plant during those walks.", "He abandoned plant study because no teacher was available."], "answer": 0, "explanations": ["this 回指戶外活動；finding nobody…說明自學背景。", "與 finding nobody able to teach 相反。", "investigated for himself 不是放棄。"], "tag": "長難句理解", "structure": "主幹：he became interested…and Ray investigated…。While doing…同主詞省略；finding…為原因性分詞片語；it 回指 local flora。"}, {"id": "ray-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "By the mid-1650s, even the first-year students at Trinity College were able to identify the plants and flowers around Cambridge, as they were being taught (unofficially—none of this was part of their formal education) by Ray.", "target": "", "options": ["By the mid-1650s, Ray’s unofficial instruction had enabled even first-year students to identify local plants.", "Plant identification had already become an officially required science course.", "First-year students were excluded from Ray’s teaching."], "answer": 0, "explanations": ["as 表原因；括號排除正式課程。", "unofficially 明確否定正式課程。", "even first-year 不是被排除。"], "tag": "長難句理解", "structure": "主幹：students were able to identify…。as they were being taught 為原因；括號說非正式教育，不是否定正在教。"}, {"id": "ray-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Many of them were the sons of landowners, and so had a natural, if amateurish, interest in country matters.", "target": "", "options": ["Many students, being landowners’ sons, naturally had rural interests, although their involvement was amateurish.", "All students were professional botanists before Ray taught them.", "The sentence says their interests concerned international politics only."], "answer": 0, "explanations": ["natural if amateurish：有自然興趣但業餘。", "many 不等於 all，amateurish 不是專業。", "country 在此是鄉村。"], "tag": "長難句理解", "structure": "主幹：Many were sons…and so had interest…。if amateurish 為省略讓步結構；不是在設一個尚未成立的條件。"}, {"id": "ray-paraphrase-12", "mode": "paraphrase", "paragraph": "E", "sentence": "Having himself had no authority on the subject of plants on which to draw, Ray also started work on what would become his Cambridge Catalogue of English Plants.", "target": "", "options": ["Having lacked an authoritative source to consult, Ray began creating what would become his plant catalogue.", "Ray copied an existing complete catalogue written by his expert teacher.", "Ray began only after an authority had already classified all his plants."], "answer": 0, "explanations": ["Having…交代缺乏可依據來源的背景。", "原文 no authority，非抄成品。", "與 lacking authority 相反。"], "tag": "長難句理解", "structure": "主幹：Ray started work on…。Having…為完成式分詞背景；on which to draw＝authority to draw on；what would become…為名詞子句。"}, {"id": "ray-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "The work was not published until 1660 because, as Ray explained in the preface, he had to start from scratch: “I had first to become familiar with the literature, to compare the plants that I found with the pictures, and when there seemed to be a resemblance, to go fully into any unknown descriptions.", "target": "", "options": ["Publication did not occur until 1660 because Ray had to build his knowledge and method from the beginning.", "The work was published before 1660, after Ray merely copied a ready-made method.", "The book was delayed because Ray refused to examine plants."], "answer": 0, "explanations": ["not until…表到該年才；because 給自述原因。", "時間及工作來源均改錯。", "他要親自檢視，非拒絕。"], "tag": "長難句理解", "structure": "主幹：The work was not published until…。because 說原因；as Ray explained 為插入來源；冒號後用自述展開 from scratch。"}, {"id": "ray-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "Gaining skill by experience, I acquired at last the ability to recognise to which tribe and family similar plants could be assigned; this taught me to search for similarities and saved a vast deal of labour, which others would otherwise have spent resolving those difficulties.", "target": "", "options": ["By building experience, Ray learned to assign similar plants to groups, which reduced the effort needed to deal with classification difficulties.", "Ray decided plant similarities were useless and had to repeat every investigation from zero.", "The sentence says others had already completed every classification for him."], "answer": 0, "explanations": ["this 指分類辨識能力與方法；which 指省下的勞力。", "與 taught me to search for similarities 相反。", "不是別人已完成後給他答案。"], "tag": "長難句理解", "structure": "主幹：I acquired…the ability…; this taught…and saved…。Gaining…給途徑；to which tribe and family…為 recognise 的間接問句；which 修飾 labour。"}, {"id": "ray-paraphrase-15", "mode": "paraphrase", "paragraph": "F", "sentence": "It gave the names of plants found in the area around Cambridge and included information about where they grew and how common they were.", "target": "", "options": ["The catalogue included plant names as well as information about location and frequency.", "The book contained names alone, with no further information.", "It gave only the prices paid for plants in Cambridge."], "answer": 0, "explanations": ["and included 擴充清單以外內容；how common 指常見程度。", "忽略位置及頻度資訊。", "how common 詢問植物常見程度，並非交易價格。"], "tag": "長難句理解", "structure": "主幹：It gave…and included…。plants found…為過去分詞；where 與 how 引導並列間接問句。"}, {"id": "ray-paraphrase-16", "mode": "paraphrase", "paragraph": "F", "sentence": "In doing this, Ray was producing something that would be of practical use to students and other readers interested in the local natural world.", "target": "", "options": ["By providing that information, Ray produced a work useful to students and other readers interested in local nature.", "Only Ray himself could make any use of the book.", "Its practical value was guaranteed by commercial profit."], "answer": 0, "explanations": ["this 指記載名稱、分布與常見度；受眾包含學生及其他讀者。", "原文明列其他使用者。", "practical use 不等於獲利。"], "tag": "長難句理解", "structure": "主幹：Ray was producing something…。that would be…修飾 something；interested in…修飾 readers；would 表過去看後續用途。"}, {"id": "ray-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "At the same time, the book showed his determination to describe plants accurately, on the basis of direct examination rather than reliance on old authorities.", "target": "", "options": ["The book expressed Ray’s commitment to accurate description grounded in direct examination rather than inherited scholarly authority.", "Ray preferred copying old authorities even when direct observation contradicted them.", "He abandoned accuracy in order to write a longer list."], "answer": 0, "explanations": ["on basis of A rather than B 對比知識依據。", "原文強調直接檢視優先於依賴舊權威，不是反過來。", "determination to describe accurately 與此相反。"], "tag": "長難句理解", "structure": "主幹：the book showed his determination…。to describe…補充決心內容；on basis…與 rather than…給方法對照。"}, {"id": "ray-paraphrase-18", "mode": "paraphrase", "paragraph": "G", "sentence": "With the support of Francis Willughby, he began to imagine a more comprehensive investigation of nature, one that would attempt to classify living things according to careful observation of their shared characteristics.", "target": "", "options": ["Supported by Willughby, Ray envisioned a broader investigation that would classify life using observed shared features.", "His new plan was limited to repeating only the names already listed near Cambridge.", "He planned to classify things according to reputation rather than observation."], "answer": 0, "explanations": ["one 回指 investigation；would attempt 表規劃目標。", "more comprehensive 與此相反。", "careful observation 被換成聲譽。"], "tag": "長難句理解", "structure": "主幹：he began to imagine investigation。one 為同位語；that would attempt…修飾 one；according to…交代分類依據。"}, {"id": "ray-paraphrase-19", "mode": "paraphrase", "paragraph": "G", "sentence": "This was an ambitious undertaking, especially at a time when many aspects of the natural world remained poorly described.", "target": "", "options": ["The project was especially demanding because many parts of nature were still poorly described at that time.", "It was easy because nature had already been exhaustively documented.", "The passage says no natural objects had ever been described in any form."], "answer": 0, "explanations": ["especially at a time when…交代任務難度背景。", "poorly described 與全面完成相反。", "many poorly described 不等於任何都無描述。"], "tag": "長難句理解", "structure": "主幹：This was an undertaking。when…修飾 time；many aspects 限定範圍，poorly 表程度，不是全盤未曾記錄。"}, {"id": "ray-paraphrase-20", "mode": "paraphrase", "paragraph": "G", "sentence": "Yet Ray believed that by collecting evidence systematically and comparing related forms, it would be possible to build a more reliable understanding of nature than scholars had possessed before.", "target": "", "options": ["Ray believed systematic evidence and comparison could produce a more dependable understanding than earlier scholars had had.", "Ray conclusively proved all previous scholarship worthless.", "Ray believed observation was less reliable than inherited belief."], "answer": 0, "explanations": ["believed、would be possible 保留信念與可能成果。", "比較更可靠不等於以前全部無價值。", "依據優先次序反轉。"], "tag": "長難句理解", "structure": "主幹：Ray believed that it would be possible…。by 內含 collecting 與 comparing；it 為虛主詞；than scholars had possessed before 比較理解的可靠程度。"}, {"id": "ray-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "Ray’s account of his working methods", "target": "account", "options": ["敘述、說明", "銀行帳戶", "應付帳單"], "answer": 0, "explanations": ["account 在此指對方法的敘述。此處辨認題目用語，不表示整句敘述符合文章。", "不是金融帳戶。", "不是帳單。"], "tag": "題目字彙", "source": "Question 14–20 i · 題目用語"}, {"id": "ray-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "The botanical expert who inspired Ray", "target": "botanical", "options": ["植物學的", "航海工程的", "動物心理學的"], "answer": 0, "explanations": ["botanical＝植物學方面的。此處辨認題目用語，不表示整句敘述符合文章。", "不是航海工程。", "不是動物心理。"], "tag": "題目字彙", "source": "Question 14–20 ii · 題目用語"}, {"id": "ray-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "A succession of academic achievements", "target": "A succession of", "options": ["一連串的", "唯一一次的", "完全互不相干且不分次序的"], "answer": 0, "explanations": ["succession 指接連發生的一系列。此處辨認題目用語，不表示整句敘述符合文章。", "不是一次。", "不是毫無先後。"], "tag": "題目字彙", "source": "Question 14–20 iii · 題目用語"}, {"id": "ray-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "A succession of academic achievements", "target": "academic achievements", "options": ["學術成就", "家庭背景", "身體成長紀錄"], "answer": 0, "explanations": ["academic achievements＝學術上的成果。此處辨認題目用語，不表示整句敘述符合文章。", "不是家世。", "不是身體發育。"], "tag": "題目字彙", "source": "Question 14–20 iii · 題目用語"}, {"id": "ray-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "Ray’s informal tuition", "target": "informal tuition", "options": ["非正式的教學、指導", "未繳清的學費", "正式課程的必修考試"], "answer": 0, "explanations": ["tuition 在此是教學，informal 指非正式。此處辨認題目用語，不表示整句敘述符合文章。", "不是未繳費用。", "不是必修考試。"], "tag": "題目字彙", "source": "Question 14–20 iv · 題目用語"}, {"id": "ray-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "Ray’s appreciation of his contemporary academic culture", "target": "appreciation", "options": ["肯定、欣賞", "必然的全盤複製", "經濟上的漲價"], "answer": 0, "explanations": ["appreciation 在此指欣賞、感激其價值。此處辨認題目用語，不表示整句敘述符合文章。", "不是必然照抄。", "不是金錢升值。"], "tag": "題目字彙", "source": "Question 14–20 v · 題目用語"}, {"id": "ray-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Ray’s appreciation of his contemporary academic culture", "target": "contemporary", "options": ["當時的、與他同時代的", "遠古而已被遺忘的", "一定屬於今日二十一世紀的"], "answer": 0, "explanations": ["contemporary 依 Ray 的時代理解。此處辨認題目用語，不表示整句敘述符合文章。", "不是僅遠古。", "不是必定指現在。"], "tag": "題目字彙", "source": "Question 14–20 v · 題目用語"}, {"id": "ray-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "John Ray was a scholar and self-taught botanist whose work reflected a new approach to knowledge.", "target": "self-taught", "options": ["自學的", "沒有任何知識的", "只在一對一課堂學成的"], "answer": 0, "explanations": ["self-taught＝未靠教師系統教學而自學。此處辨認題目用語，不表示整句敘述符合文章。", "不是一無所知。", "不是限定個別授課。"], "tag": "題目字彙", "source": "Question 21–24 · 題目用語"}, {"id": "ray-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "This new approach represented a complete break from earlier ideas.", "target": "a complete break from", "options": ["徹底脫離、打破先前模式", "完全照舊遵循", "短暫休息後原樣繼續"], "answer": 0, "explanations": ["a break from ideas＝與舊觀念決裂、轉向。此處辨認題目用語，不表示整句敘述符合文章。", "不是照舊。", "不是休息。"], "tag": "題目字彙", "source": "Question 21–24 · 題目用語"}, {"id": "ray-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "He began compiling his catalogue of plants.", "target": "compiling", "options": ["蒐集整理、彙編", "任意毀棄", "只做口頭背誦"], "answer": 0, "explanations": ["compile catalogue＝彙編目錄。此處辨認題目用語，不表示整句敘述符合文章。", "不是摧毀。", "不是只背誦。"], "tag": "題目字彙", "source": "Question 21–24 · 題目用語"}, {"id": "ray-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "He began compiling his catalogue of plants.", "target": "catalogue", "options": ["分類整理的目錄或清單", "只描述單一人物的傳記", "研究者個人收入紀錄"], "answer": 0, "explanations": ["catalogue＝目錄、編錄。此處辨認題目用語，不表示整句敘述符合文章。", "不是人物傳記。", "不是收入表。"], "tag": "題目字彙", "source": "Question 21–24 · 題目用語"}, {"id": "ray-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "His school record was not exceptional in any way.", "target": "exceptional", "options": ["格外優秀、異常突出的", "絕不符合任何規則的", "一定屬於例外錯誤的"], "answer": 0, "explanations": ["exceptional 在成就語境指卓越、不凡。此處辨認題目用語，不表示整句敘述符合文章。", "不是完全無規則。", "不是必然有錯。"], "tag": "題目字彙", "source": "Question 25–26 B · 題目用語"}, {"id": "ray-questionVocab-13", "mode": "questionVocab", "paragraph": "", "sentence": "He was helped by a former student of Cambridge University.", "target": "former", "options": ["以前的、從前的", "將來才會成為的", "目前在職不曾離開的"], "answer": 0, "explanations": ["former student 指曾在此就讀的人。此處辨認題目用語，不表示整句敘述符合文章。", "不是未來學生。", "不是現任身分。"], "tag": "題目字彙", "source": "Question 25–26 C · 題目用語"}, {"id": "ray-questionVocab-15", "mode": "questionVocab", "paragraph": "", "sentence": "He originally planned to take up his father’s occupation.", "target": "occupation", "options": ["職業", "假期活動", "大學住宿地點"], "answer": 0, "explanations": ["occupation 在此指工作職業。此處辨認題目用語，不表示整句敘述符合文章。", "不是度假活動。", "不是宿舍。"], "tag": "題目字彙", "source": "Question 25–26 E · 題目用語"}, {"id": "ray-vocab-60", "mode": "vocab", "paragraph": "B", "sentence": "His father was a village blacksmith, and his mother was also a respected member of the community, a healer who was an expert in folk medicine and the use of herbs to treat ailments.", "target": "treat", "options": ["give care or remedies for a health problem", "provide an enjoyable reward in this context", "prove that no illness exists"], "answer": 0, "explanations": ["treat ailments＝治療病症。", "不是此處的獎勵義。", "不是證明無病。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-61", "mode": "vocab", "paragraph": "B", "sentence": "Ray must have stood out as an unusually bright boy among his schoolmates, and his talents were recognised by a church official, Samuel Covell, who had graduated from Cambridge University in 1600, and maintained his links with his university.", "target": "recognised", "options": ["acknowledged as present or valuable", "created genetically for the first time", "dismissed without being noticed"], "answer": 0, "explanations": ["talents recognised＝才能獲得認可。", "不是創造基因。", "不是不看就否定。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-62", "mode": "vocab", "paragraph": "B", "sentence": "Ray must have stood out as an unusually bright boy among his schoolmates, and his talents were recognised by a church official, Samuel Covell, who had graduated from Cambridge University in 1600, and maintained his links with his university.", "target": "maintained his links with", "options": ["kept his connections with", "removed every connection with", "acquired legal ownership of"], "answer": 0, "explanations": ["maintain links＝維持聯繫。", "不是完全斷絕。", "不是擁有所有權。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-63", "mode": "vocab", "paragraph": "B", "sentence": "There he made a solid start, and quickly gained a reputation as a brilliant student.", "target": "made a solid start", "options": ["began in a sound and promising way", "built something physically hard", "completed an entire career immediately"], "answer": 0, "explanations": ["make solid start＝有穩健、良好的開始。", "不是做出硬物。", "不是一開始就完成生涯。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-66", "mode": "vocab", "paragraph": "C", "sentence": "He then went on to pass on the knowledge he acquired to others.", "target": "pass on", "options": ["transmit knowledge to another person", "refuse all knowledge offered", "postpone gaining knowledge indefinitely"], "answer": 0, "explanations": ["pass on knowledge＝傳授知識。", "不是拒絕。", "不是無限延期。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-69", "mode": "vocab", "paragraph": "E", "sentence": "I was eager to make the most of this and was fortunate to share my enthusiasm with my friends…”", "target": "eager", "options": ["strongly wanting or keen to do something", "reluctant to become involved", "already certain of success"], "answer": 0, "explanations": ["eager to＝渴望、熱切想要。", "不是不情願。", "意願不等於必定成功。"], "tag": "字彙與語境義"}, {"id": "ray-vocab-71", "mode": "vocab", "paragraph": "F", "sentence": "At the same time, the book showed his determination to describe plants accurately, on the basis of direct examination rather than reliance on old authorities.", "target": "direct examination", "options": ["first-hand inspection or investigation", "reliance solely on others’ descriptions", "an examination that has no practical observation"], "answer": 0, "explanations": ["direct examination＝直接檢視。", "不是全靠他人記載。", "不是完全無實際觀察。"], "tag": "搭配與語境義"}, {"id": "ray-vocab-73", "mode": "vocab", "paragraph": "G", "sentence": "This was an ambitious undertaking, especially at a time when many aspects of the natural world remained poorly described.", "target": "aspects", "options": ["different parts or features of a subject", "only physical viewing angles", "names assigned randomly"], "answer": 0, "explanations": ["aspects＝面向、部分。", "不只實體視角。", "不是隨機名字。"], "tag": "字彙與語境義"}]}, {"id": "steam-water", "title": "Steam Across the Water", "sourceTitle": "Steam across the water", "subtitle": "A look at the early history of boats powered by steam", "part": 1, "topic": "蒸汽船、工程突破與商業航運", "sourceNote": "練習依文中的技術、營運與時間關係理解；原題敘述不一定符合文章。", "paragraphs": [{"label": "A", "text": "During the 1600s, very early in the development of steam engines, inventive spirits like the Frenchman Denis Papin dreamed of—and experimented with—boats driven by steam, rather than by the wind or human effort, but many decades passed before those visions became reality."}, {"label": "B", "text": "Englishman Jonathan Hulls took out patents on a steamboat in 1736, but the boat was to be driven by a Newcomen engine, which was heavy and therefore inefficient, and the venture would never be a success. In 1763, William Henry, an American, put a Watt steam engine in a boat, but it sank. Nearly 20 years later, in the 1780s, a steam-powered paddle-wheeler managed to last fifteen minutes against the current on the River Saone in France, but lacked the endurance for longer trips. Developments elsewhere included a boat driven by a steam-powered water-jet and able to do six kilometres per hour. However, all these steamboats were either too slow or too expensive to run. For example, American John Fitch successfully trialled his first steamboat in 1787, but although he tried a number of designs and solved many technical challenges—one of his boats could even travel at 13 km/h—he could never convince sceptics that steamboats would pay."}, {"label": "C", "text": "Real success could not be claimed until the 19th century. In Scotland in 1802, Lord Dundas launched the steamboat Charlotte Dundas, which was driven by a paddle wheel and had an improved engine designed by William Symington. Barges, some weighing as much as 70 tonnes, were towed by this steamboat 30 kilometres along the Forth and Clyde Canal to Glasgow, Scotland’s second city. Soon after, success came to American Robert Fulton, whose countrymen called him “the father of the steamboat”. Inspired by news of the Charlotte Dundas, Fulton ran steamboat trials on the River Seine in an attempt to attract French support for his submarine Nautilus. He later imported a Boulton-Watt steam engine and built a boat to use it in. In 1807, the Clermont began a scheduled passenger steamboat service between New York and Albany, 250 kilometres up the Hudson River, taking 30 hours for the trip. Within a few years, steamers were running on the St Lawrence River in Canada and would soon appear on other rivers and lakes, including the Mississippi River, a most famous venue for the paddle-wheelers."}, {"label": "D", "text": "Back in Scotland, Fulton’s ideas inspired Henry Bell, who launched his Comet in 1812 on the Clyde between Glasgow and Greenock. Inside a decade, dozens of steamboats were to be seen on the rivers, lochs and canals of Scotland, carrying cargo and occasionally passengers. The age of steamboats had come."}, {"label": "E", "text": "Once steamboats were carrying passengers and industrial goods along the inland waterways and sheltered coastlines of Europe, North America and elsewhere, the challenge became to send steamboats onto the open ocean, such as across the Atlantic Ocean, between Europe and the US. Travelling under steam power alone would require engines to use less coal so the ship could stay at sea for several weeks. In order to provide a reliable service, it was also necessary to replace paddle wheels as a source of power with something less affected by the rolling of the ship."}, {"label": "F", "text": "Without waiting for such breakthroughs, crossings under a combination of steam and sail got underway in 1819 with the American ship Savannah. A regular service took another two decades and introduced the famous name of Cunard. Securing the British government contract for the mail service across the Atlantic, Samuel Cunard established a shipping line in 1840, soon carrying passengers as well, and offering guaranteed sailing dates. Cunard’s first ships used a sail-steam combination, but the era of the passenger liner, using steam alone, was getting close. When it came to building the ships, the versatile British engineer Isambard Kingdom Brunel set the pace. Brunel, brilliant and daring, had already built the Great Western Railway. He created ever bigger ships—faster, more luxurious and comfortable for passengers. The Great Western, launched in 1837, was 70 metres long and crossed from Bristol to New York in about fifteen and a half days in 1838. The largest paddle steamer ever built was Brunel’s Great Eastern. Ultimately too expensive to run as a passenger ship, it was later used to lay transatlantic submarine telegraph cables. His Great Britain, launched in 1843, nearly 100 metres long and luxuriously appointed, was the first large ocean-going steamship to combine an iron hull with a screw propeller, powering movement in place of paddle wheels. The idea of the screw had been around since the experiments of the American John Stevens in 1803, and by the late 1830s a steamer had adopted one: the Archimedes, which used a propeller designed by Francis Pettit Smith. Later ships had twin screws for reliability."}, {"label": "G", "text": "In many modern ships, steam turbines have replaced engines with pistons, with fuel oil instead of coal to fire the boilers. Diesel engines keep others moving. The largest ships afloat now would dwarf Brunel’s Great Eastern, launched in 1858; the Atlantic can be crossed in only four days. But in whatever form, the ever-evolving descendants of the original visions of Denis Papin and Robert Fulton continue to travel the seas in vast numbers."}], "questions": [{"id": "steam-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "During the 1600s, very early in the development of steam engines, inventive spirits like the Frenchman Denis Papin dreamed of—and experimented with—boats driven by steam, rather than by the wind or human effort, but many decades passed before those visions became reality.", "target": "inventive", "options": ["good at creating new ideas or devices", "unwilling to try any new approach", "capable only of copying old designs"], "answer": 0, "explanations": ["inventive＝有創造力、善於發明的。", "不是拒絕嘗試。", "不是只會照抄。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "During the 1600s, very early in the development of steam engines, inventive spirits like the Frenchman Denis Papin dreamed of—and experimented with—boats driven by steam, rather than by the wind or human effort, but many decades passed before those visions became reality.", "target": "spirits", "options": ["people with a particular character or attitude", "supernatural beings in this context", "alcoholic drinks"], "answer": 0, "explanations": ["inventive spirits 此處指富發明精神的人。", "不是鬼魂。", "不是烈酒。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "During the 1600s, very early in the development of steam engines, inventive spirits like the Frenchman Denis Papin dreamed of—and experimented with—boats driven by steam, rather than by the wind or human effort, but many decades passed before those visions became reality.", "target": "experimented with", "options": ["tried out to discover how something worked", "accepted without testing", "permanently abandoned before trying"], "answer": 0, "explanations": ["experiment with＝試驗、嘗試。", "不是不經測試接受。", "不是未試就放棄。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "During the 1600s, very early in the development of steam engines, inventive spirits like the Frenchman Denis Papin dreamed of—and experimented with—boats driven by steam, rather than by the wind or human effort, but many decades passed before those visions became reality.", "target": "driven by", "options": ["powered or propelled by", "legally owned by", "guided only by an opinion held by"], "answer": 0, "explanations": ["boats driven by steam＝由蒸汽驅動的船。", "不是所有權。", "不是觀點引導。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "During the 1600s, very early in the development of steam engines, inventive spirits like the Frenchman Denis Papin dreamed of—and experimented with—boats driven by steam, rather than by the wind or human effort, but many decades passed before those visions became reality.", "target": "visions", "options": ["ideas of what might be possible in the future", "the physical eyesight of a boat", "records proving something already happened"], "answer": 0, "explanations": ["visions＝構想、願景。", "不是船的視力。", "不是過去事件的確證。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-6", "mode": "vocab", "paragraph": "B", "sentence": "Englishman Jonathan Hulls took out patents on a steamboat in 1736, but the boat was to be driven by a Newcomen engine, which was heavy and therefore inefficient, and the venture would never be a success.", "target": "took out patents", "options": ["obtained legal protection for inventions", "removed inventions from legal protection", "paid for the repair of existing engines"], "answer": 0, "explanations": ["take out a patent＝申請取得專利保護。", "不是撤除保護。", "不是付修理費。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-7", "mode": "vocab", "paragraph": "B", "sentence": "Englishman Jonathan Hulls took out patents on a steamboat in 1736, but the boat was to be driven by a Newcomen engine, which was heavy and therefore inefficient, and the venture would never be a success.", "target": "inefficient", "options": ["using too much energy or effort for the result", "producing no movement under any conditions", "working as economically as possible"], "answer": 0, "explanations": ["inefficient＝效率不佳的。", "不等於任何情況完全不能動。", "不是最節省。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-8", "mode": "vocab", "paragraph": "B", "sentence": "Nearly 20 years later, in the 1780s, a steam-powered paddle-wheeler managed to last fifteen minutes against the current on the River Saone in France, but lacked the endurance for longer trips.", "target": "paddle-wheeler", "options": ["a vessel propelled by a rotating paddle wheel", "a boat moved only by hand-held oars", "a boat powered by a submerged screw alone"], "answer": 0, "explanations": ["paddle-wheeler＝明輪船。", "不是僅靠手划。", "不是僅螺旋槳推進。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-9", "mode": "vocab", "paragraph": "B", "sentence": "Nearly 20 years later, in the 1780s, a steam-powered paddle-wheeler managed to last fifteen minutes against the current on the River Saone in France, but lacked the endurance for longer trips.", "target": "against the current", "options": ["in the opposite direction to the flowing water", "with the direction of the water’s flow", "opposed to contemporary public opinion here"], "answer": 0, "explanations": ["against current＝逆水流。", "不是順流。", "此處不是反對時代觀點。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "Nearly 20 years later, in the 1780s, a steam-powered paddle-wheeler managed to last fifteen minutes against the current on the River Saone in France, but lacked the endurance for longer trips.", "target": "endurance", "options": ["the capacity to keep operating over time", "the maximum speed at one moment", "the price of building a vessel"], "answer": 0, "explanations": ["endurance＝持續運作能力、耐力。", "不是瞬間極速。", "不是建造價格。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "Developments elsewhere included a boat driven by a steam-powered water-jet and able to do six kilometres per hour.", "target": "water-jet", "options": ["a stream of water used for propulsion", "a jet aircraft landing on water", "a current created only by wind"], "answer": 0, "explanations": ["water-jet 此處指噴水推進裝置、噴流。", "不是水上飛機。", "不是僅風致水流。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "For example, American John Fitch successfully trialled his first steamboat in 1787, but although he tried a number of designs and solved many technical challenges—one of his boats could even travel at 13 km/h—he could never convince sceptics that steamboats would pay.", "target": "trialled", "options": ["tested in practice", "punished after a legal hearing", "sold without testing"], "answer": 0, "explanations": ["trial 作動詞＝試驗、試航。", "不是司法審判處罰。", "不是不測就賣。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-16", "mode": "vocab", "paragraph": "B", "sentence": "For example, American John Fitch successfully trialled his first steamboat in 1787, but although he tried a number of designs and solved many technical challenges—one of his boats could even travel at 13 km/h—he could never convince sceptics that steamboats would pay.", "target": "sceptics", "options": ["people who doubt a claim or proposal", "people certain of success without evidence", "workers responsible only for ship repair"], "answer": 0, "explanations": ["sceptics＝懷疑者。", "不是無證據仍篤定者。", "不是修船工的專稱。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-17", "mode": "vocab", "paragraph": "B", "sentence": "For example, American John Fitch successfully trialled his first steamboat in 1787, but although he tried a number of designs and solved many technical challenges—one of his boats could even travel at 13 km/h—he could never convince sceptics that steamboats would pay.", "target": "pay", "options": ["be financially worthwhile or profitable", "make a payment to every passenger", "require no money to operate"], "answer": 0, "explanations": ["steamboats would pay＝營運有利可圖、划算。", "不是付錢給乘客。", "不是沒有成本。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-18", "mode": "vocab", "paragraph": "C", "sentence": "In Scotland in 1802, Lord Dundas launched the steamboat Charlotte Dundas, which was driven by a paddle wheel and had an improved engine designed by William Symington.", "target": "launched", "options": ["put a vessel into the water", "ended all operations permanently", "made the first sketch only"], "answer": 0, "explanations": ["launch a boat＝使船下水。", "不是永久停業。", "不是只畫初稿。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-19", "mode": "vocab", "paragraph": "C", "sentence": "Barges, some weighing as much as 70 tonnes, were towed by this steamboat 30 kilometres along the Forth and Clyde Canal to Glasgow, Scotland’s second city.", "target": "Barges", "options": ["flat-bottomed vessels mainly used to carry goods", "small boats used only for recreation", "fixed barriers across canals"], "answer": 0, "explanations": ["barge＝主要載貨的平底駁船。", "不是僅供娛樂。", "不是運河障礙。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-20", "mode": "vocab", "paragraph": "C", "sentence": "Barges, some weighing as much as 70 tonnes, were towed by this steamboat 30 kilometres along the Forth and Clyde Canal to Glasgow, Scotland’s second city.", "target": "towed", "options": ["pulled by another vessel", "carried entirely on another vessel’s deck", "moved only by its own sails"], "answer": 0, "explanations": ["tow＝拖曳。", "不是全放在甲板上運載。", "不是自行靠帆。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-21", "mode": "vocab", "paragraph": "C", "sentence": "Barges, some weighing as much as 70 tonnes, were towed by this steamboat 30 kilometres along the Forth and Clyde Canal to Glasgow, Scotland’s second city.", "target": "Canal", "options": ["an artificial waterway", "a natural open ocean", "a road built for carts"], "answer": 0, "explanations": ["canal＝人工運河。", "不是開放大洋。", "不是馬車道路。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-22", "mode": "vocab", "paragraph": "C", "sentence": "Soon after, success came to American Robert Fulton, whose countrymen called him “the father of the steamboat”.", "target": "countrymen", "options": ["people from the same country", "people living only in rural areas", "people working aboard the same ship only"], "answer": 0, "explanations": ["countrymen＝同胞、同國人。", "不是只指鄉村居民。", "不只同船人員。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-23", "mode": "vocab", "paragraph": "C", "sentence": "Inspired by news of the Charlotte Dundas, Fulton ran steamboat trials on the River Seine in an attempt to attract French support for his submarine Nautilus.", "target": "trials", "options": ["practical tests", "passenger holidays only", "definite commercial successes"], "answer": 0, "explanations": ["trials 在此指試驗、試航。", "不是只指旅遊。", "試航不保證商業成功。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-24", "mode": "vocab", "paragraph": "C", "sentence": "Inspired by news of the Charlotte Dundas, Fulton ran steamboat trials on the River Seine in an attempt to attract French support for his submarine Nautilus.", "target": "submarine", "options": ["a vessel designed to operate underwater", "a vessel required to remain on inland rivers", "a type of paddle wheel"], "answer": 0, "explanations": ["submarine 作名詞＝潛水艇。", "不是只走內河的船。", "不是明輪。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-26", "mode": "vocab", "paragraph": "C", "sentence": "In 1807, the Clermont began a scheduled passenger steamboat service between New York and Albany, 250 kilometres up the Hudson River, taking 30 hours for the trip.", "target": "scheduled passenger steamboat service", "options": ["a passenger service operating to a planned timetable", "a single experimental trip without a timetable", "a cargo service prohibited from carrying people"], "answer": 0, "explanations": ["scheduled service＝按預定班表運行的客運航線。", "不是無班表的一次試航。", "不是禁載客貨運。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-27", "mode": "vocab", "paragraph": "C", "sentence": "Within a few years, steamers were running on the St Lawrence River in Canada and would soon appear on other rivers and lakes, including the Mississippi River, a most famous venue for the paddle-wheelers.", "target": "venue", "options": ["a place where an activity occurs", "a machine producing power", "the price paid for a journey"], "answer": 0, "explanations": ["venue 在此指明輪船活動的著名場域、水域。", "不是動力機器。", "不是票價。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-28", "mode": "vocab", "paragraph": "D", "sentence": "Inside a decade, dozens of steamboats were to be seen on the rivers, lochs and canals of Scotland, carrying cargo and occasionally passengers.", "target": "lochs", "options": ["Scottish lakes or sea inlets", "mechanical locks on cabin doors", "narrow artificial bridges"], "answer": 0, "explanations": ["loch＝蘇格蘭湖泊或海灣。", "不是門鎖。", "不是橋梁。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-29", "mode": "vocab", "paragraph": "D", "sentence": "Inside a decade, dozens of steamboats were to be seen on the rivers, lochs and canals of Scotland, carrying cargo and occasionally passengers.", "target": "cargo", "options": ["goods carried by a vessel", "the crew operating it", "the fuel necessarily stored in the engine"], "answer": 0, "explanations": ["cargo＝貨物。", "不是船員。", "不是一定指燃料。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-30", "mode": "vocab", "paragraph": "E", "sentence": "Once steamboats were carrying passengers and industrial goods along the inland waterways and sheltered coastlines of Europe, North America and elsewhere, the challenge became to send steamboats onto the open ocean, such as across the Atlantic Ocean, between Europe and the US.", "target": "inland waterways", "options": ["navigable routes within land areas", "routes across the open ocean only", "roads used to transport boats on trucks"], "answer": 0, "explanations": ["inland waterways＝內陸水道。", "不是僅開放大洋航線。", "不是公路。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-31", "mode": "vocab", "paragraph": "E", "sentence": "Once steamboats were carrying passengers and industrial goods along the inland waterways and sheltered coastlines of Europe, North America and elsewhere, the challenge became to send steamboats onto the open ocean, such as across the Atlantic Ocean, between Europe and the US.", "target": "sheltered coastlines", "options": ["coastal areas relatively protected from severe sea conditions", "coasts completely enclosed by roofs", "ports reserved exclusively for naval ships"], "answer": 0, "explanations": ["sheltered＝受遮蔽、較能避風浪的。", "不是蓋上屋頂。", "不限定軍港。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-33", "mode": "vocab", "paragraph": "E", "sentence": "In order to provide a reliable service, it was also necessary to replace paddle wheels as a source of power with something less affected by the rolling of the ship.", "target": "rolling", "options": ["side-to-side movement of the vessel", "movement on wheels over a road", "a permanent sinking of the vessel"], "answer": 0, "explanations": ["rolling of ship＝船體左右搖晃。", "不是在道路滾動。", "不是永久沉沒。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-34", "mode": "vocab", "paragraph": "F", "sentence": "Without waiting for such breakthroughs, crossings under a combination of steam and sail got underway in 1819 with the American ship Savannah.", "target": "breakthroughs", "options": ["major developments overcoming previous difficulties", "minor repetitions of unchanged designs", "official bans on testing"], "answer": 0, "explanations": ["breakthrough＝重大突破。", "不是原樣重複。", "不是禁令。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-35", "mode": "vocab", "paragraph": "F", "sentence": "Without waiting for such breakthroughs, crossings under a combination of steam and sail got underway in 1819 with the American ship Savannah.", "target": "underway", "options": ["started and in progress", "permanently cancelled", "completed before it began"], "answer": 0, "explanations": ["get underway＝開始進行。", "不是取消。", "不是未開始就完成。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-36", "mode": "vocab", "paragraph": "F", "sentence": "Securing the British government contract for the mail service across the Atlantic, Samuel Cunard established a shipping line in 1840, soon carrying passengers as well, and offering guaranteed sailing dates.", "target": "Securing", "options": ["successfully obtaining", "physically locking away only", "refusing to negotiate for"], "answer": 0, "explanations": ["secure a contract＝取得合約。", "不是只指上鎖。", "不是拒絕商談。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-38", "mode": "vocab", "paragraph": "F", "sentence": "Securing the British government contract for the mail service across the Atlantic, Samuel Cunard established a shipping line in 1840, soon carrying passengers as well, and offering guaranteed sailing dates.", "target": "shipping line", "options": ["a company operating a regular shipping service", "a rope laid along a ship’s side", "a painted border marking a harbour"], "answer": 0, "explanations": ["shipping line＝航運公司、定期航運業者。", "不是船邊繩索。", "不是港邊畫線。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-39", "mode": "vocab", "paragraph": "F", "sentence": "Securing the British government contract for the mail service across the Atlantic, Samuel Cunard established a shipping line in 1840, soon carrying passengers as well, and offering guaranteed sailing dates.", "target": "guaranteed", "options": ["formally promised or assured", "roughly guessed without a commitment", "deliberately kept secret"], "answer": 0, "explanations": ["guaranteed sailing dates＝承諾確定開航日期。", "不是只猜日期。", "不是保密。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-40", "mode": "vocab", "paragraph": "F", "sentence": "Cunard’s first ships used a sail-steam combination, but the era of the passenger liner, using steam alone, was getting close.", "target": "passenger liner", "options": ["a large ship operating a regular passenger service", "a material used to line a passenger’s luggage", "a boat used only to tow cargo barges"], "answer": 0, "explanations": ["passenger liner＝定期客輪。", "不是行李內襯。", "不是只拖貨船。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-41", "mode": "vocab", "paragraph": "F", "sentence": "When it came to building the ships, the versatile British engineer Isambard Kingdom Brunel set the pace.", "target": "versatile", "options": ["able to do many different things well", "limited to one narrow activity", "unwilling to adapt to change"], "answer": 0, "explanations": ["versatile＝多才多藝、用途多樣的。", "不是只限一件事。", "不是拒絕適應。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-42", "mode": "vocab", "paragraph": "F", "sentence": "When it came to building the ships, the versatile British engineer Isambard Kingdom Brunel set the pace.", "target": "set the pace", "options": ["lead and establish the standard or rate of progress", "choose a walking speed only", "fall permanently behind others"], "answer": 0, "explanations": ["set pace＝帶頭、引領發展。", "不只是選步速。", "不是落後。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-43", "mode": "vocab", "paragraph":
