 tow ships"], "answer": 0, "explanations": ["submarine 作形容詞＝海底、水下的。", "不是只在潛艇內。", "不是拖曳繩。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-48", "mode": "vocab", "paragraph": "F", "sentence": "His Great Britain, launched in 1843, nearly 100 metres long and luxuriously appointed, was the first large ocean-going steamship to combine an iron hull with a screw propeller, powering movement in place of paddle wheels.", "target": "luxuriously appointed", "options": ["equipped and furnished to a high luxurious standard", "officially named after a wealthy person", "chosen to represent rich passengers"], "answer": 0, "explanations": ["appointed 此處指配備、裝潢。", "不是被命名。", "不是被選為代表。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-49", "mode": "vocab", "paragraph": "F", "sentence": "His Great Britain, launched in 1843, nearly 100 metres long and luxuriously appointed, was the first large ocean-going steamship to combine an iron hull with a screw propeller, powering movement in place of paddle wheels.", "target": "hull", "options": ["the main body of a vessel", "the rotating blades providing propulsion", "the cloth carrying wind above deck"], "answer": 0, "explanations": ["hull＝船體。", "不是槳葉。", "不是船帆。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-50", "mode": "vocab", "paragraph": "F", "sentence": "His Great Britain, launched in 1843, nearly 100 metres long and luxuriously appointed, was the first large ocean-going steamship to combine an iron hull with a screw propeller, powering movement in place of paddle wheels.", "target": "screw propeller", "options": ["a rotating bladed device pushing a vessel through water", "a paddle wheel turning beside a hull", "a screw used only to fasten furniture"], "answer": 0, "explanations": ["screw propeller＝螺旋槳。", "不是船側明輪。", "不是家具螺絲。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-51", "mode": "vocab", "paragraph": "F", "sentence": "His Great Britain, launched in 1843, nearly 100 metres long and luxuriously appointed, was the first large ocean-going steamship to combine an iron hull with a screw propeller, powering movement in place of paddle wheels.", "target": "in place of", "options": ["instead of", "in addition to without replacing", "at exactly the same physical location as necessarily"], "answer": 0, "explanations": ["in place of＝取代、代替。", "不是額外並用。", "不必同一實體位置。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-52", "mode": "vocab", "paragraph": "F", "sentence": "Later ships had twin screws for reliability.", "target": "twin screws", "options": ["two screw propellers", "two fastening screws on a passenger seat", "one paddle wheel with two boards"], "answer": 0, "explanations": ["twin screws 在船舶語境指雙螺旋槳。", "不是椅子螺絲。", "不是雙板明輪。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-53", "mode": "vocab", "paragraph": "G", "sentence": "In many modern ships, steam turbines have replaced engines with pistons, with fuel oil instead of coal to fire the boilers.", "target": "steam turbines", "options": ["machines using flowing steam to turn a rotor", "engines powered only by human rowing", "devices storing coal without producing motion"], "answer": 0, "explanations": ["steam turbine＝蒸汽渦輪機。", "不是人力划槳。", "不是單純存煤。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-54", "mode": "vocab", "paragraph": "G", "sentence": "In many modern ships, steam turbines have replaced engines with pistons, with fuel oil instead of coal to fire the boilers.", "target": "pistons", "options": ["parts moving back and forth within engine cylinders", "flat cloth surfaces catching wind", "cables used to moor ships"], "answer": 0, "explanations": ["pistons＝活塞。", "不是帆布。", "不是繫船纜。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-55", "mode": "vocab", "paragraph": "G", "sentence": "In many modern ships, steam turbines have replaced engines with pistons, with fuel oil instead of coal to fire the boilers.", "target": "boilers", "options": ["containers where water is heated to produce steam", "devices used to cool steam into ice", "rooms reserved for passengers"], "answer": 0, "explanations": ["boilers＝鍋爐。", "不是製冰機。", "不是客房。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-56", "mode": "vocab", "paragraph": "G", "sentence": "In many modern ships, steam turbines have replaced engines with pistons, with fuel oil instead of coal to fire the boilers.", "target": "fire", "options": ["supply fuel and heat to", "dismiss from employment in this context", "attack with weapons only"], "answer": 0, "explanations": ["fire the boilers＝給鍋爐加燃料、燃燒加熱。", "不是解雇鍋爐。", "不是射擊。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-57", "mode": "vocab", "paragraph": "G", "sentence": "The largest ships afloat now would dwarf Brunel’s Great Eastern, launched in 1858; the Atlantic can be crossed in only four days.", "target": "afloat", "options": ["floating or operating on water", "being built inland before launching", "permanently resting on the seabed"], "answer": 0, "explanations": ["ships afloat＝浮於水上、在航運作的船。", "不是未下水。", "不是沉海底。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-58", "mode": "vocab", "paragraph": "G", "sentence": "The largest ships afloat now would dwarf Brunel’s Great Eastern, launched in 1858; the Atlantic can be crossed in only four days.", "target": "dwarf", "options": ["make something else seem much smaller by comparison", "be made smaller through damage", "match exactly in size"], "answer": 0, "explanations": ["dwarf 作動詞＝使相較之下顯得矮小。", "不是自己受損變小。", "不是尺寸相同。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-59", "mode": "vocab", "paragraph": "G", "sentence": "But in whatever form, the ever-evolving descendants of the original visions of Denis Papin and Robert Fulton continue to travel the seas in vast numbers.", "target": "ever-evolving", "options": ["continually developing or changing", "remaining identical over time", "always becoming less useful"], "answer": 0, "explanations": ["ever-evolving＝持續演變的。", "不是完全不變。", "不表示必然退步。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-60", "mode": "vocab", "paragraph": "G", "sentence": "But in whatever form, the ever-evolving descendants of the original visions of Denis Papin and Robert Fulton continue to travel the seas in vast numbers.", "target": "descendants", "options": ["later developments derived from earlier designs", "the biological children of the inventors only", "unrelated objects with no historical connection"], "answer": 0, "explanations": ["descendants 此處比喻由早期構想演變而來的後續船舶。", "不是只指發明者子女。", "不是毫無歷史關聯。"], "tag": "字彙與語境義"}, {"id": "steam-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "During the 1600s, very early in the development of steam engines, inventive spirits like the Frenchman Denis Papin dreamed of—and experimented with—boats driven by steam, rather than by the wind or human effort, but many decades passed before those visions became reality.", "target": "", "options": ["Early inventors imagined and tested steam-driven boats in the seventeenth century, but widespread practical realization did not follow immediately.", "Steam-driven boats were already fully established as soon as the first inventors imagined them.", "Those inventors rejected steam and used only wind or rowing."], "answer": 0, "explanations": ["but many decades…before 表理想與實現之間的時間差。", "原文明說構想提出後又過了許多年代才實現，並非立即成功。", "發明者嘗試的是蒸汽動力，rather than 對照風力及人力。"], "tag": "長難句理解", "structure": "主幹：inventive spirits dreamed…and experimented…, but decades passed…。driven…修飾 boats；rather than 對比動力。"}, {"id": "steam-paraphrase-2", "mode": "paraphrase", "paragraph": "B", "sentence": "Englishman Jonathan Hulls took out patents on a steamboat in 1736, but the boat was to be driven by a Newcomen engine, which was heavy and therefore inefficient, and the venture would never be a success.", "target": "", "options": ["Hulls obtained patents, but the proposed heavy engine was inefficient and the venture did not succeed.", "Obtaining a patent guaranteed the boat’s commercial success.", "The boat was successful because a heavy engine always means high efficiency."], "answer": 0, "explanations": ["patent 與實際成效以 but 對比。", "專利不等於成功保證。", "重與 inefficiency 關係被反轉。"], "tag": "長難句理解", "structure": "主幹：Hulls took out patents, but it was to be driven…。which 指 Newcomen engine；the venture would never be a success 從過去看後續結果。"}, {"id": "steam-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "Nearly 20 years later, in the 1780s, a steam-powered paddle-wheeler managed to last fifteen minutes against the current on the River Saone in France, but lacked the endurance for longer trips.", "target": "", "options": ["The French paddle-wheeler could work against the flow for fifteen minutes but could not sustain longer journeys.", "It travelled with the flow for many hours without endurance problems.", "The boat was unable to operate for even a moment."], "answer": 0, "explanations": ["managed…fifteen minutes 與 lacked endurance 同時保留。", "方向及續航結果錯誤。", "有短暫運作能力，非完全不能動。"], "tag": "長難句理解", "structure": "主幹：paddle-wheeler managed to last…, but lacked…。against current 表方向；for longer trips 限定不足的續航範圍。"}, {"id": "steam-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "For example, American John Fitch successfully trialled his first steamboat in 1787, but although he tried a number of designs and solved many technical challenges—one of his boats could even travel at 13 km/h—he could never convince sceptics that steamboats would pay.", "target": "", "options": ["Although Fitch solved engineering problems and tested several designs, he did not convince doubters that steamboats could be profitable.", "Technical problem-solving conclusively persuaded every investor of profitability.", "Fitch never conducted a successful technical trial or produced a moving boat."], "answer": 0, "explanations": ["although 讓步於技術進展，主結論仍是未說服商業價值。", "技術成功被跳成確定獲利且說服所有人。", "忽略 successfully trialled 與速度例子。"], "tag": "長難句理解", "structure": "主幹：Fitch trialled…, but…he could never convince…。although 子句含 tried and solved；破折號補例；pay 指有利可圖。"}, {"id": "steam-paraphrase-5", "mode": "paraphrase", "paragraph": "C", "sentence": "In Scotland in 1802, Lord Dundas launched the steamboat Charlotte Dundas, which was driven by a paddle wheel and had an improved engine designed by William Symington.", "target": "", "options": ["The Charlotte Dundas used a paddle wheel and an improved engine designed by Symington.", "Symington is said to have designed every part of every early steamboat.", "The Charlotte Dundas was driven only by sail and had no engine."], "answer": 0, "explanations": ["which 內兩個並列謂語描述該船。", "engine designed by…不能擴到全部船舶零件。", "原文記載明輪與改良引擎，並非只有船帆且沒有引擎。"], "tag": "長難句理解", "structure": "主幹：Dundas launched boat…。which was driven…and had…為關係子句；designed…只修飾 engine。"}, {"id": "steam-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "Barges, some weighing as much as 70 tonnes, were towed by this steamboat 30 kilometres along the Forth and Clyde Canal to Glasgow, Scotland’s second city.", "target": "", "options": ["The steamboat towed barges along a thirty-kilometre route, with some barges weighing up to seventy tonnes.", "Every barge weighed exactly seventy tonnes and travelled under its own power.", "Thirty kilometres describes the length of the steamboat itself."], "answer": 0, "explanations": ["some、as much as 及被拖曳方式均保留。", "把部分估計上限與被動拖曳改錯。", "30 kilometres 是路程，不是船長。"], "tag": "長難句理解", "structure": "主幹：Barges were towed…。some weighing…為獨立分詞補述；along…表路線；Scotland’s second city 同位指 Glasgow。"}, {"id": "steam-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "Inspired by news of the Charlotte Dundas, Fulton ran steamboat trials on the River Seine in an attempt to attract French support for his submarine Nautilus.", "target": "", "options": ["News of the Charlotte Dundas prompted Fulton to run trials intended to attract French backing for his submarine.", "Fulton’s sole purpose was to compete commercially with the Charlotte Dundas on the same canal.", "The trials prove France had already purchased every submarine design."], "answer": 0, "explanations": ["in attempt to 表目的，不保證取得支持。", "改掉 submarine 目標並加上唯一目的。", "嘗試吸引不等於已購買。"], "tag": "長難句理解", "structure": "主幹：Fulton ran trials…。Inspired…分詞主詞同為 Fulton；in an attempt to…表研究展示的目的；for his submarine 限定支持對象。"}, {"id": "steam-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "He later imported a Boulton-Watt steam engine and built a boat to use it in.", "target": "", "options": ["Fulton imported an engine and built a boat to accommodate and use it.", "Fulton built an engine to put inside an existing imported boat.", "He imported an engine but never intended to use it in a boat."], "answer": 0, "explanations": ["it 指進口引擎。", "進口與建造的受詞反轉。", "to use it in 表用途。"], "tag": "長難句理解", "structure": "主幹：He imported engine and built boat…。to use it in 修飾 boat；句尾 in 的受詞為 boat，不是多餘介系詞。"}, {"id": "steam-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "In 1807, the Clermont began a scheduled passenger steamboat service between New York and Albany, 250 kilometres up the Hudson River, taking 30 hours for the trip.", "target": "", "options": ["The Clermont began a timetabled passenger route of 250 kilometres that took thirty hours.", "The trip lasted 250 hours over a thirty-kilometre route.", "The Clermont offered only unscheduled freight trips with no passengers."], "answer": 0, "explanations": ["正確對應距離與時間。", "將數字單位互換。", "scheduled passenger service 與此相反。"], "tag": "長難句理解", "structure": "主幹：Clermont began service…。250 kilometres…補述 Albany 與沿河路程；taking…說單程所需時間，不是船長。"}, {"id": "steam-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "Within a few years, steamers were running on the St Lawrence River in Canada and would soon appear on other rivers and lakes, including the Mississippi River, a most famous venue for the paddle-wheelers.", "target": "", "options": ["Steamers operated in Canada and were expected soon to spread to other rivers and lakes, including the Mississippi.", "Every river and lake worldwide already had steamers in 1807.", "The Mississippi was excluded from steamboat development."], "answer": 0, "explanations": ["within few years、would soon 依時間先後理解擴散。", "把局部擴散變成全球完成，時間也改錯。", "including 明確納入。"], "tag": "長難句理解", "structure": "主幹：steamers were running…and would appear…。including…舉地點；venue 指活動場域，不是建築限定。"}, {"id": "steam-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Back in Scotland, Fulton’s ideas inspired Henry Bell, who launched his Comet in 1812 on the Clyde between Glasgow and Greenock.", "target": "", "options": ["Henry Bell’s Comet followed inspiration from Fulton’s ideas and began operating on the Clyde in 1812.", "Fulton designed the Comet after being inspired by Bell’s later ideas.", "The sentence says Bell never launched a vessel."], "answer": 0, "explanations": ["who 指 Bell；靈感方向是 Fulton 到 Bell。", "是 Fulton 的構想啟發 Bell，不是 Bell 後來的構想啟發 Fulton。", "原文明說 launched Comet。"], "tag": "長難句理解", "structure": "主幹：Fulton’s ideas inspired Henry Bell。who…修飾 Bell，非 Fulton；between…限定航行區間。"}, {"id": "steam-paraphrase-12", "mode": "paraphrase", "paragraph": "E", "sentence": "Once steamboats were carrying passengers and industrial goods along the inland waterways and sheltered coastlines of Europe, North America and elsewhere, the challenge became to send steamboats onto the open ocean, such as across the Atlantic Ocean, between Europe and the US.", "target": "", "options": ["After steamboats were established in inland and protected coastal routes, crossing the open ocean became the next challenge.", "Open-ocean steam services came before any inland use in the sequence described.", "The writer says protected coastal travel and Atlantic crossings pose exactly the same challenges."], "answer": 0, "explanations": ["Once…主句 表已具基礎後的下一階段。", "原文順序為先建立內河及沿岸運輸，再挑戰遠洋航行。", "the challenge became…指出新挑戰。"], "tag": "長難句理解", "structure": "主幹：the challenge became to send…。Once 為時間條件；such as across Atlantic 舉 open ocean 的例子。"}, {"id": "steam-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "Travelling under steam power alone would require engines to use less coal so the ship could stay at sea for several weeks.", "target": "", "options": ["Crossing under steam alone required more economical coal use so ships could remain at sea for weeks.", "Carrying passengers was possible only if engines burned more coal per unit of work.", "The sentence guarantees steamships could already cross for weeks without any fuel constraints."], "answer": 0, "explanations": ["would require 表必要改進；so 表目的或可實現結果。", "less coal 被反轉成更多。", "需求尚待達成不能當已無限制。"], "tag": "長難句理解", "structure": "主詞：Travelling under steam power alone。主句 require + engines + to use…；so the ship could…說節能目的。"}, {"id": "steam-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "In order to provide a reliable service, it was also necessary to replace paddle wheels as a source of power with something less affected by the rolling of the ship.", "target": "", "options": ["Reliable ocean service also required replacing paddle-wheel propulsion with a system less sensitive to the ship’s rolling.", "Paddle wheels were ideal precisely because rolling had no effect on them.", "A reliable service required only guaranteed dates and no technical changes."], "answer": 0, "explanations": ["also 說另一項技術要求；less affected 保留比較。", "原文要求改用較不受船體搖晃影響的推進方式，並非明輪完全不受影響。", "忽略更換動力裝置。"], "tag": "長難句理解", "structure": "主幹：it was necessary to replace A with B。it 為虛主詞；in order to…表目的；less affected…修飾 something。"}, {"id": "steam-paraphrase-15", "mode": "paraphrase", "paragraph": "F", "sentence": "Without waiting for such breakthroughs, crossings under a combination of steam and sail got underway in 1819 with the American ship Savannah.", "target": "", "options": ["Steam-and-sail crossings began before all the improvements needed for steam-only service had been achieved.", "The Savannah waited until every steam-only breakthrough was complete before it crossed.", "The 1819 crossings used steam alone throughout."], "answer": 0, "explanations": ["Without waiting 及 combination 是時間與動力關鍵。", "Without waiting 明說未等所有突破完成，就開始蒸汽與帆並用的航行。", "combination 包含帆，不是全程僅蒸汽。"], "tag": "長難句理解", "structure": "主幹：crossings got underway…。Without waiting for…表未等待的背景；under combination…限定航行動力。"}, {"id": "steam-paraphrase-16", "mode": "paraphrase", "paragraph": "F", "sentence": "Securing the British government contract for the mail service across the Atlantic, Samuel Cunard established a shipping line in 1840, soon carrying passengers as well, and offering guaranteed sailing dates.", "target": "", "options": ["Having obtained the mail contract, Cunard established a line that also carried passengers and promised sailing dates.", "Cunard began passenger operations while refusing any government mail contract.", "Guaranteed sailing dates mean every voyage necessarily arrived without any delay."], "answer": 0, "explanations": ["Securing 表取得合約的背景；as well 擴展載客業務。", "Securing the contract 表取得郵運合約，不是拒絕合約。", "sailing dates 是開航日，不保證抵達永無延誤。"], "tag": "長難句理解", "structure": "主幹：Cunard established line…。Securing…為分詞背景；carrying…and offering…補述航運業務。"}, {"id": "steam-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "Cunard’s first ships used a sail-steam combination, but the era of the passenger liner, using steam alone, was getting close.", "target": "", "options": ["Cunard initially combined sail and steam, while the era of liners using steam alone was approaching.", "All Cunard ships had always used only steam from the beginning.", "The passage says steam-only liners were becoming less likely."], "answer": 0, "explanations": ["but 對照當時與即將發展的階段。", "initial combination 被刪除。", "getting close 是接近，不是更不可能。"], "tag": "長難句理解", "structure": "主幹：first ships used…, but era…was getting close。using steam alone 修飾 passenger liner，非第一批船的既有方式。"}, {"id": "steam-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "Ultimately too expensive to run as a passenger ship, it was later used to lay transatlantic submarine telegraph cables.", "target": "", "options": ["The Great Eastern later found cable-laying work because operating it as a passenger vessel was too costly.", "Its commercial failure as a passenger vessel meant it never served any later purpose.", "Cable laying was described as its original and only design purpose."], "answer": 0, "explanations": ["it 指前句 Great Eastern；後續用途仍存在。", "忽略 later used to lay cables。", "先客運後改用，不是原始唯一目的。"], "tag": "長難句理解", "structure": "主幹：it was later used to lay…。句首省略 because it was 的形容詞背景解釋客運不划算；as passenger ship 限定成本評價用途。"}, {"id": "steam-paraphrase-19", "mode": "paraphrase", "paragraph": "F", "sentence": "His Great Britain, launched in 1843, nearly 100 metres long and luxuriously appointed, was the first large ocean-going steamship to combine an iron hull with a screw propeller, powering movement in place of paddle wheels.", "target": "", "options": ["The Great Britain combined an iron hull with screw propulsion, with the latter replacing paddle wheels.", "The ship’s iron hull is another name for the propeller.", "The text says it kept paddle wheels as its only propulsion."], "answer": 0, "explanations": ["船體材料與推進系統為不同創新。", "hull 與 propeller 分屬不同部件。", "in place of 表取代。"], "tag": "長難句理解", "structure": "主幹：Great Britain was the first…to combine…。nearly…與 appointed 為插入補述；powering…指螺旋槳的推進功能。"}, {"id": "steam-paraphrase-20", "mode": "paraphrase", "paragraph": "G", "sentence": "The largest ships afloat now would dwarf Brunel’s Great Eastern, launched in 1858; the Atlantic can be crossed in only four days.", "target": "", "options": ["By comparison, the largest ships described as modern make the Great Eastern seem small.", "The verb dwarf means modern ships have physically shrunk the old vessel.", "The Great Eastern is stated to be larger than every modern ship."], "answer": 0, "explanations": ["would dwarf 為比較效果，不是實體縮小。", "誤用動詞字面義。", "比較原文要求改用較不受船體搖晃影響的推進方式，並非明輪完全不受影響。"], "tag": "長難句理解", "structure": "主幹：ships would dwarf Great Eastern。launched…為補充舊船背景；分號後給跨洋速度的另一項發展例子。"}, {"id": "steam-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "A French paddle steamer did not have the ______ to keep going for more than a quarter of an hour.", "target": "paddle steamer", "options": ["明輪蒸汽船", "只有人力槳的船", "只靠螺旋槳的柴油船"], "answer": 0, "explanations": ["paddle steamer 以蒸汽帶動明輪。此處辨認題目用語，不表示整句敘述符合文章。", "不是只靠人力。", "不是柴油螺旋槳船。"], "tag": "題目字彙", "source": "Question 2 · 題目用語"}, {"id": "steam-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "John Fitch overcame a number of ______ problems with his steamboat designs.", "target": "overcame", "options": ["克服、解決", "刻意掩飾", "證明不存在"], "answer": 0, "explanations": ["overcome problems＝克服難題。此處辨認題目用語，不表示整句敘述符合文章。", "不是隱瞞。", "克服不等於沒發生。"], "tag": "題目字彙", "source": "Question 3 · 題目用語"}, {"id": "steam-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "For steamboats to cross the Atlantic Ocean, engines which used fuel economically were needed.", "target": "economically", "options": ["節省地、有效利用燃料地", "只與經濟學理論有關地", "盡可能大量耗用燃料地"], "answer": 0, "explanations": ["use fuel economically 指省油、燃料效率佳。此處辨認題目用語，不表示整句敘述符合文章。", "不是僅學科相關。", "不是盡量多耗油。"], "tag": "題目字彙", "source": "Question 7 · 題目用語"}, {"id": "steam-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Using paddle wheels guaranteed reliability on ocean crossings.", "target": "guaranteed reliability", "options": ["保證運作可靠", "只提出尚待檢驗的可能性", "降低可靠程度"], "answer": 0, "explanations": ["guarantee 表保證，是否符合文章須另判。此處辨認題目用語，不表示整句敘述符合文章。", "不是僅可能。", "不是降低可靠性。"], "tag": "題目字彙", "source": "Question 8 · 題目用語"}, {"id": "steam-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "The Great Britain had more than one innovative feature.", "target": "innovative", "options": ["創新的", "僅因昂貴而奢華的", "依舊完全照舊的"], "answer": 0, "explanations": ["innovative＝有新意、創新的。此處辨認題目用語，不表示整句敘述符合文章。", "價格高不等於創新。", "不是照舊。"], "tag": "題目字彙", "source": "Question 11 · 題目用語"}, {"id": "steam-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "The Great Britain had more than one innovative feature.", "target": "feature", "options": ["特徵、特色", "影片的正片", "研究者的意願"], "answer": 0, "explanations": ["feature 在此指船的設計特色。此處辨認題目用語，不表示整句敘述符合文章。", "不是電影長片。", "不是意願。"], "tag": "題目字彙", "source": "Question 11 · 題目用語"}, {"id": "steam-vocab-61", "mode": "vocab", "paragraph": "A", "sentence": "During the 1600s, very early in the development of steam engines, inventive spirits like the Frenchman Denis Papin dreamed of—and experimented with—boats driven by steam, rather than by the wind or human effort, but many decades passed before those visions became reality.", "target": "steam engines", "options": ["machines using steam to produce mechanical power", "engines powered only by human effort", "containers used only to store cold water"], "answer": 0, "explanations": ["steam engines＝蒸汽引擎。", "不是只靠人力。", "不是僅存冷水。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-64", "mode": "vocab", "paragraph": "B", "sentence": "Englishman Jonathan Hulls took out patents on a steamboat in 1736, but the boat was to be driven by a Newcomen engine, which was heavy and therefore inefficient, and the venture would never be a success.", "target": "venture", "options": ["an undertaking involving uncertainty or risk", "the physical opening of an engine only", "a result guaranteed before any work begins"], "answer": 0, "explanations": ["venture 在此指有風險的新事業、嘗試。", "不是引擎開口。", "不是預先保證結果。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-66", "mode": "vocab", "paragraph": "B", "sentence": "Nearly 20 years later, in the 1780s, a steam-powered paddle-wheeler managed to last fifteen minutes against the current on the River Saone in France, but lacked the endurance for longer trips.", "target": "steam-powered", "options": ["using steam as its source of power", "using steam only as decoration", "powered exclusively by wind"], "answer": 0, "explanations": ["steam-powered＝蒸汽驅動的。", "不是只作裝飾。", "不是僅風力。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-68", "mode": "vocab", "paragraph": "C", "sentence": "Inspired by news of the Charlotte Dundas, Fulton ran steamboat trials on the River Seine in an attempt to attract French support for his submarine Nautilus.", "target": "in an attempt to", "options": ["with the aim of trying to", "as conclusive proof of having succeeded in", "without any intention of"], "answer": 0, "explanations": ["in an attempt to＝為了嘗試……。", "目的不等於已成功的證明。", "不是無意做。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-70", "mode": "vocab", "paragraph": "D", "sentence": "Back in Scotland, Fulton’s ideas inspired Henry Bell, who launched his Comet in 1812 on the Clyde between Glasgow and Greenock.", "target": "inspired", "options": ["gave ideas or motivation to", "copied every detail from", "formally dismissed from work"], "answer": 0, "explanations": ["inspired Bell＝啟發 Bell。", "不是照抄 Bell。", "不是解雇。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-72", "mode": "vocab", "paragraph": "F", "sentence": "Without waiting for such breakthroughs, crossings under a combination of steam and sail got underway in 1819 with the American ship Savannah.", "target": "sail", "options": ["propulsion by wind acting on sails here", "a sale of ownership", "the propeller turning below the hull"], "answer": 0, "explanations": ["steam and sail 中 sail 指風帆動力。", "不是 sale 出售。", "不是螺旋槳。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-73", "mode": "vocab", "paragraph": "F", "sentence": "Securing the British government contract for the mail service across the Atlantic, Samuel Cunard established a shipping line in 1840, soon carrying passengers as well, and offering guaranteed sailing dates.", "target": "established", "options": ["set up or founded", "removed permanently", "merely imagined without beginning"], "answer": 0, "explanations": ["establish shipping line＝成立航運公司。", "不是移除。", "不是僅想像。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-74", "mode": "vocab", "paragraph": "F", "sentence": "Cunard’s first ships used a sail-steam combination, but the era of the passenger liner, using steam alone, was getting close.", "target": "era", "options": ["a period marked by particular features", "an individual scheduled voyage", "a unit of fuel capacity"], "answer": 0, "explanations": ["era＝時代。", "不是單次航程。", "不是燃料容量單位。"], "tag": "字彙與語境義"}, {"id": "steam-vocab-75", "mode": "vocab", "paragraph": "F", "sentence": "When it came to building the ships, the versatile British engineer Isambard Kingdom Brunel set the pace.", "target": "When it came to", "options": ["when considering the subject or activity of", "when physically arriving at a destination only", "because it was impossible to"], "answer": 0, "explanations": ["when it comes to…＝談到、就……而言。", "不只是抵達地點。", "不是因為不可能。"], "tag": "搭配與語境義"}, {"id": "steam-vocab-76", "mode": "vocab", "paragraph": "G", "sentence": "In many modern ships, steam turbines have replaced engines with pistons, with fuel oil instead of coal to fire the boilers.", "target": "fuel oil", "options": ["oil burned as a source of energy", "oil used only to lubricate parts", "water heated to create steam"], "answer": 0, "explanations": ["fuel oil＝燃料油。", "不是僅潤滑油。", "不是蒸汽用水。"], "tag": "搭配與語境義"}]}]</script><script>

let progress={};function loadProgress(){progress={};try{const stored=JSON.parse(localStorage.getItem(KEY)||'{}');if(stored&&typeof stored==='object'&&!Array.isArray(stored))progress=stored}catch(e){}}loadProgress();
let mode='vocab',paragraph='all',category='all',wrongOnly=false,queue=[],position=0;
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fingerprint(q){return JSON.stringify([q.id,q.sentence,q.options,q.answer])}
function remember(q,n){progress[fingerprint(q)]={selected:n,correct:n===q.answer};try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){$('status').textContent='瀏覽器無法保留進度；目前這一輪仍可正常作答。'}}
function options(id,rows,value){$(id).replaceChildren(...rows.map(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;return o}));$(id).value=value}
function stats(){if(data.pending){$('stats').textContent='此篇內文與複習題目待加入。';return}const m=mode==='reading'?'vocab':mode,qs=data.questions.filter(q=>q.mode===m),done=qs.filter(q=>progress[fingerprint(q)]),good=done.filter(q=>progress[fingerprint(q)].correct);$('stats').innerHTML=`<b>${names[m]}</b><br>最近作答：${done.length} / ${qs.length} 題<br>答對 ${good.length} 題 · 待複習 ${done.length-good.length} 題`;$('errors').textContent=wrongOnly?'返回全部題目':'重練錯題'}
function start(){for(const id of ['shuffle','errors','para','type'])$(id).disabled=!!data.pending;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=!!data.pending);document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});$('paraWrap').classList.toggle('hidden',mode==='questionVocab'||mode==='reading'||!!data.pending);$('typeWrap').classList.toggle('hidden',mode!=='vocab'||!!data.pending);$('jumpWrap').classList.toggle('hidden',mode==='reading'||!!data.pending);queue=shuffled(data.questions.filter(q=>q.mode===mode&&(mode==='questionVocab'||paragraph==='all'||q.paragraph===paragraph)&&(mode!=='vocab'||category==='all'||q.tag===category)&&(!wrongOnly||progress[fingerprint(q)]?.correct===false))).map(q=>({q,order:shuffled([0,1,2]),selected:null}));position=0;render()}
function sourceText(q){let i=q.sentence.indexOf(q.target);return q.target?esc(q.sentence.slice(0,i))+'<mark>'+esc(q.target)+'</mark>'+esc(q.sentence.slice(i+q.target.length)):esc(q.sentence)}
function render(){stats();const card=$('card');if(data.pending){card.innerHTML=`<article class="result"><div class="label">IELTS READING · PART ${data.part}</div><h2>${esc(data.title)}</h2><p>內容待加入</p><p class="minor">這篇已列入目錄。提供文章與題目後，即可加入三種複習練習。</p></article>`;return}if(mode==='reading'){card.innerHTML=`<article class="read"><div class="label">SOURCE TEXT</div><h2>${esc(data.sourceTitle||data.title)}</h2><p class="minor">${esc(data.subtitle)}</p>${data.sourceNote?`<p class="source-note">${esc(data.sourceNote)}</p>`:""}${data.paragraphs.map(p=>`<h3>PARAGRAPH ${esc(p.label)}</h3><p lang="en">${esc(p.text)}</p>`).join('')}</article>`;return}options('jump',queue.map((x,i)=>[String(i),`${i+1} · ${x.q.paragraph||'題目'} · ${x.q.target||x.q.tag}`]),position<queue.length?String(position):'');$('jump').disabled=!queue.length;
if(!queue.length){card.innerHTML=`<div class="result"><div class="label">${wrongOnly?'REVIEW':'PRACTICE'}</div><h2>${wrongOnly?'此範圍目前沒有錯題。':'此範圍沒有題目。'}</h2><p class="minor">可調整範圍或返回全部題目。</p><button id="all" class="primary">顯示全部題目</button></div>`;$('all').onclick=()=>{wrongOnly=false;paragraph='all';category='all';$('para').value='all';$('type').value='all';start()};return}
if(position>=queue.length){const answered=queue.filter(x=>x.selected!==null),good=answered.filter(x=>x.selected===x.q.answer);card.innerHTML=`<div class="result"><div class="label">ROUND COMPLETE</div><h2>這一輪已結束。</h2><p>已作答 ${answered.length} / ${queue.length} 題，其中答對 ${good.length} 題。</p><div class="actions"><button id="roundWrong">重練本輪錯題</button><button class="primary" id="again">重新洗牌練習</button></div></div>`;$('again').onclick=()=>{wrongOnly=false;start()};$('roundWrong').onclick=()=>{queue=shuffled(queue.filter(x=>x.selected!==null&&x.selected!==x.q.answer)).map(x=>({q:x.q,order:shuffled([0,1,2]),selected:null}));wrongOnly=true;position=0;render()};return}
const item=queue[position],q=item.q,done=queue.filter(x=>x.selected!==null).length;card.innerHTML=`<div class="top"><span>${mode==='questionVocab'?esc(q.source):'Paragraph '+esc(q.paragraph)} <span class="tag">${esc(q.tag)}</span></span><span id="roundCount">${wrongOnly?'錯題複習 · ':''}${position+1} / ${queue.length} · 已答 ${done} 題</span></div><progress id="roundProgress" class="progress" value="${done}" max="${queue.length}" aria-label="本輪已答題數"></progress><div class="prompt">${mode==='vocab'?'WHAT DOES THE HIGHLIGHTED EXPRESSION MEAN?':mode==='paraphrase'?'WHICH PARAPHRASE PRESERVES THE ORIGINAL MEANING?':'選出標示字詞在此語境中的中文意思'}</div><p class="sentence" lang="en">${sourceText(q)}</p><div class="answers">${item.order.map((n,i)=>`<button class="answer" data-answer="${n}" lang="${mode==='questionVocab'?'zh-Hant':'en'}"><span class="letter">${'ABC'[i]}</span><span>${esc(q.options[n])}</span></button>`).join('')}</div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="context" class="${mode==='questionVocab'?'hidden':''}">查看所在段落</button><div><button id="previous" ${position===0?'disabled':''}>上一題</button> <button id="next" class="primary" disabled>${position===queue.length-1?'查看本輪結果':'下一題 →'}</button></div></div><div id="contextText" class="context hidden"></div>`;
card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(item.selected!==null)return;item.selected=Number(b.dataset.answer);remember(q,item.selected);showFeedback(item);stats()});$('previous').onclick=()=>{position--;render()};$('next').onclick=()=>{position++;render();$('card').scrollIntoView({behavior:'smooth',block:'start'})};$('context').onclick=()=>{const c=$('contextText');c.classList.toggle('hidden');c.textContent=data.paragraphs.find(p=>p.label===q.paragraph).text;$('context').textContent=c.classList.contains('hidden')?'查看所在段落':'收起段落'};if(item.selected!==null)showFeedback(item)}
function showFeedback(item){const q=item.q,done=queue.filter(x=>x.selected!==null).length;$('roundCount').textContent=(wrongOnly?'錯題複習 · ':'')+(position+1)+' / '+queue.length+' · 已答 '+done+' 題';$('roundProgress').value=done;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const n=Number(b.dataset.answer);b.classList.toggle('correct',n===q.answer);b.classList.toggle('wrong',n===item.selected&&n!==q.answer)});const f=$('feedback');f.classList.remove('hidden');f.innerHTML=`<b>${item.selected===q.answer?'✓ 答對了':'請留意這裡'} · 正確答案 ${'ABC'[item.order.indexOf(q.answer)]}</b>${item.order.map((n,i)=>`<p><b>${'ABC'[i]} ${n===q.answer?'✓':'✕'}</b> ${esc(q.explanations[n])}</p>`).join('')}${q.structure?`<div class="syntax"><b>句構拆解</b><br>${esc(q.structure)}</div>`:''}`;$('next').disabled=false}
function configure(){paragraph='all';category='all';wrongOnly=false;$('title').textContent='Reading Review 4';$('topic').textContent='IELTS READING PRACTICE';$('partLabel').textContent='IELTS READING · PART '+data.part;document.title='Reading Review 4';KEY=keyFor(data);loadProgress();$('status').textContent='';options('para',[['all','全部段落'],...data.paragraphs.map(p=>[p.label,'Paragraph '+p.label])],'all');const tags=[...new Set(data.questions.filter(q=>q.mode==='vocab').map(q=>q.tag))];options('type',[['all','全部類型'],...tags.map(t=>[t,t])],'all');updateCounts();start()}
$('article').replaceChildren(...[1,2,3].filter(part=>bank.some(a=>a.part===part)).map(part=>{const g=document.createElement('optgroup');g.label='IELTS Reading Part '+part;const sorted=bank.filter(a=>a.part===part).sort((a,b)=>a.title.localeCompare(b.title,'en',{sensitivity:'base'}));for(const a of sorted){const o=document.createElement('option');o.value=a.id;o.textContent=a.title+(a.pending?' · 待加入':'');g.appendChild(o)}return g}));$('article').value=data.id;$('article').onchange=e=>{data=bank.find(a=>a.id===e.target.value);configure()};$('para').onchange=e=>{paragraph=e.target.value;start()};$('type').onchange=e=>{category=e.target.value;start()};$('jump').onchange=e=>{position=Number(e.target.value);render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;wrongOnly=false;start()});$('shuffle').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=false;start()};$('errors').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=!wrongOnly;start()};function updateCounts(){$('catalogSummary').textContent='已加入 '+bank.filter(a=>!a.pending).length+' / '+bank.length+' 篇 · 各篇進度分別保留';document.querySelector('.pills').classList.toggle('hidden',!!data.pending);$('countV').textContent=data.questions.filter(q=>q.mode==='vocab').length+' 題關鍵字語義';$('countP').textContent=data.questions.filter(q=>q.mode==='paraphrase').length+' 題長難句改寫';$('countQ').textContent=data.questions.filter(q=>q.mode==='questionVocab').length+' 題題目字彙選中文';}configure();
</script></body></html>
