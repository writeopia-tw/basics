</style></head><body><header><div class="brand">Reading Room</div><div class="part" id="partLabel">IELTS READING</div></header><main><section class="hero"><div class="label" id="topic">IELTS READING PRACTICE</div><h1 id="title">Reading Review 4</h1><p class="minor" id="catalogSummary"></p><div class="pills"><span class="pill" id="countV"></span><span class="pill" id="countP"></span><span class="pill" id="countQ"></span></div></section><div class="layout"><aside class="side"><h2>篇章與複習設定</h2><label for="article">閱讀篇章｜Part 分類 · A–Z</label><select id="article"></select><div id="paraWrap"><label for="para">段落範圍</label><select id="para"></select></div><div id="typeWrap"><label for="type">字詞類型</label><select id="type"></select></div><div class="stats" id="stats" aria-live="polite"></div><button id="shuffle">重新洗牌練習</button><button id="errors">重練錯題</button><p class="hint">每輪題目與選項隨機排列，同輪不重複。作答後可查看各選項解析。</p><p class="hint">進度保留在目前瀏覽器，不會跨裝置同步。</p><div id="status" role="status"></div></aside><section><nav class="tabs" aria-label="複習模式"><button data-mode="vocab">01 關鍵字語義</button><button data-mode="paraphrase">02 長難句改寫</button><button data-mode="questionVocab">03 題目字彙｜選中文</button><button data-mode="reading">原文閱讀</button></nav><div class="jump" id="jumpWrap"><label for="jump">跳至本輪題目</label><select id="jump"></select></div><div class="card" id="card"></div><p class="footer">先找主幹，再核對修飾範圍、否定、比較與作者態度。</p></section></div></main><script id="data" type="application/json">[{"id": "multitasking-brain", "title": "Multi-tasking and the Brain", "sourceTitle": "Multi-tasking and the brain", "subtitle": "", "part": 2, "topic": "注意力限制、任務切換與研究證據", "sourceNote": "研究發現、研究者推論及例外範圍均依本文語境理解。原題用語中的敘述仍須另依文章判斷。", "paragraphs": [{"label": "A", "text": "Do you think you're a master of multi-tasking? Think again. Unless you are one of the three percent of super-taskers in the population, research shows that your brain isn't capable of paying close attention to more than one complex task at a time. Researchers who study attention say that effective multi-tasking is beyond most of us. Psychiatrist Edward M Hallowell even describes multi-tasking as 'a mythical activity in which people believe they can perform two or more tasks simultaneously as effectively as they can perform one'."}, {"label": "B", "text": "It is true that you can check your email while eating your lunch, or listen to music while walking. But innate activities like walking, chewing, and breathing do not require you to pay attention, whereas activities such as reading, tapping out a text message, or driving a car do require attention. Why is paying attention to two things at once difficult? 'The brain can perform simultaneous tasks, but attention has capacity limitations,' says Associate Professor Paul E Dux, a cognitive neuroscientist at the University of Queensland in Australia. When you do only one thing at a time, you're better at that task than when you're doing multiple things concurrently. Take the classic multi-tasking scenario of talking on a mobile phone while driving - an ill-advised activity that many people believe they have mastered. When David Strayer, Professor of Psychology at the University of Utah in the US, and his team observed 56,000 drivers as they approached an intersection, the majority of drivers who were talking on their phone failed to stop in accordance with traffic laws. And it did not matter if the driver was using a handheld or hands-free device. Even with both eyes on the road and both hands on the wheel, drivers' performance was impaired. Strayer's research shows that performance deteriorates drastically when attention is split between tasks: more mistakes are made and it takes longer to complete each activity."}, {"label": "C", "text": "The prefrontal cortex is the brain region responsible for choosing what to pay attention to, and for coordinating inputs from other brain areas. By scanning the prefrontal cortex of people while they multi-tasked, scientists at the French Institute of Health and Medical Research in Paris (INSERM) found that when people focused on a single thing, the right and left sides of the prefrontal cortex worked together. But when people attempt to perform two things at once, the sides work independently. Neuroscientist Etienne Koechlin says his study demonstrates that while the brain can switch back and forth between two tasks, 'we might be in great trouble when we try to juggle more than two tasks, simply because we have only two frontal lobes'."}, {"label": "D", "text": "To the question of whether there is a difference between the sexes, Koechlin's imaging studies uncovered no differences in the ability to switch between tasks in the prefrontal cortices of men or women. But other researchers studying real life scenarios such as finding lost keys, believe there might be some truth to the claim that women are superior multi-taskers. Women have a much better strategy for finding the keys, whereas men tend to jump to it and be far less organised and thorough. 'It's as if they don't stop to reflect and plan for a moment,' says Professor Keith Laws from the University of Hertfordshire in England. But while the ability to develop strategies for coping with the numerous tasks in everyday life could give women an advantage, 'nobody can juggle two, never mind three, \"complex\" tasks at the same time'."}, {"label": "E", "text": "However, David Strayer's research uncovered that some rare people possess extraordinary multi-tasking ability. These so-called 'super-taskers' exhibit different patterns of brain activity when multi-tasking compared to ordinary people: they show less activity in the prefrontal cortex during multi-tasking, suggesting their brains are functioning with a high level of efficiency. Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\"."}, {"label": "F", "text": "The ability to multi-task probably comes down to the DNA you inherit from your parents to a large extent, says Strayer. 'You are either born with the neural structure that allows you to overcome the usual multi-tasking challenges, or you aren't. Super-taskers' brains are doing something we can't do.' All in all, these findings may have very real consequences for our lives."}], "questions": [{"id": "multi-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Psychiatrist Edward M Hallowell even describes multi-tasking as 'a mythical activity in which people believe they can perform two or more tasks simultaneously as effectively as they can perform one'.", "target": "a mythical activity", "options": ["an activity described as based on an unreal belief", "a task that has been directly observed in every person", "an activity restricted to ancient religious rituals"], "answer": 0, "explanations": ["mythical 在引述中表質疑：把多工視為眾人誤信能做到的活動。", "不是人人已被觀測到的能力。", "不是只指古代宗教儀式。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Psychiatrist Edward M Hallowell even describes multi-tasking as 'a mythical activity in which people believe they can perform two or more tasks simultaneously as effectively as they can perform one'.", "target": "simultaneously", "options": ["at the same time", "one after another without overlap", "at an equally high level of difficulty"], "answer": 0, "explanations": ["simultaneously＝同時地。", "依序發生是 sequentially。", "不是難度相同。"], "tag": "進階字彙"}, {"id": "multi-vocab-3", "mode": "vocab", "paragraph": "B", "sentence": "But innate activities like walking, chewing, and breathing do not require you to pay attention, whereas activities such as reading, tapping out a text message, or driving a car do require attention.", "target": "innate", "options": ["inborn rather than acquired through deliberate learning", "learned only through repeated formal instruction", "requiring intense conscious planning"], "answer": 0, "explanations": ["innate＝先天、與生俱來的；此處依原文分類。", "不是僅靠正式訓練。", "不是需高度有意識規劃。"], "tag": "進階字彙"}, {"id": "multi-vocab-4", "mode": "vocab", "paragraph": "B", "sentence": "But innate activities like walking, chewing, and breathing do not require you to pay attention, whereas activities such as reading, tapping out a text message, or driving a car do require attention.", "target": "tapping out", "options": ["producing a message by repeatedly pressing keys", "reading a message silently", "removing a message from a device"], "answer": 0, "explanations": ["tap out a text message＝按鍵打出訊息。", "不是默讀。", "不是刪除訊息。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-5", "mode": "vocab", "paragraph": "B", "sentence": "Why is paying attention to two things at once difficult? 'The brain can perform simultaneous tasks, but attention has capacity limitations,' says Associate Professor Paul E Dux, a cognitive neuroscientist at the University of Queensland in Australia.", "target": "capacity limitations", "options": ["restrictions on how much can be handled", "differences in how interesting tasks seem", "a complete absence of brain activity"], "answer": 0, "explanations": ["capacity limitations＝處理容量的限制。", "不是興趣程度差異。", "有限制不等於完全無活動。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-6", "mode": "vocab", "paragraph": "B", "sentence": "Why is paying attention to two things at once difficult? 'The brain can perform simultaneous tasks, but attention has capacity limitations,' says Associate Professor Paul E Dux, a cognitive neuroscientist at the University of Queensland in Australia.", "target": "cognitive neuroscientist", "options": ["a researcher studying the neural basis of mental processes", "a specialist concerned only with the bones of the skull", "a researcher studying social customs without refere "a place reserved for parking"], "answer": 0, "explanations": ["intersection 此處指道路交會處、十字路口。", "不是腦區分界。", "不是停車區。"], "tag": "進階字彙"}, {"id": "multi-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "When David Strayer, Professor of Psychology at the University of Utah in the US, and his team observed 56,000 drivers as they approached an intersection, the majority of drivers who were talking on their phone failed to stop in accordance with traffic laws.", "target": "in accordance with", "options": ["in conformity with", "in spite of", "as an unintended cause of"], "answer": 0, "explanations": ["in accordance with traffic laws＝遵守、符合交通法規。", "不是儘管。", "不是意外造成法規。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "Even with both eyes on the road and both hands on the wheel, drivers' performance was impaired.", "target": "impaired", "options": ["made less effective or weakened", "made more efficient by repetition", "unchanged despite competing demands"], "answer": 0, "explanations": ["performance was impaired＝表現受損、變差。", "不是因重複而更有效率。", "不是完全不變。"], "tag": "進階字彙"}, {"id": "multi-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "Strayer's research shows that performance deteriorates drastically when attention is split between tasks: more mistakes are made and it takes longer to complete each activity.", "target": "deteriorates drastically", "options": ["becomes much worse", "improves only slightly", "remains stable over time"], "answer": 0, "explanations": ["deteriorate＝惡化；drastically 強調程度大。", "不是略有改善。", "不是維持穩定。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-14", "mode": "vocab", "paragraph": "C", "sentence": "The prefrontal cortex is the brain region responsible for choosing what to pay attention to, and for coordinating inputs from other brain areas.", "target": "prefrontal cortex", "options": ["the front part of the cerebral cortex involved here in attentional control", "the part of the ear that first detects sound", "the
