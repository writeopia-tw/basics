mode": "vocab", "paragraph": "D", "sentence": "Women have a much better strategy for finding the keys, whereas men tend to jump to it and be far less organised and thorough. 'It's as if they don't stop to reflect and plan for a moment,' says Professor Keith Laws from the University of Hertfordshire in England.", "target": "thorough", "options": ["careful and complete in dealing with details", "rapid because important details are ignored", "rigidly unable to change strategy"], "answer": 0, "explanations": ["thorough＝周全、仔細的。", "不是略過細節求快。", "不是僵化無法調整。"], "tag": "進階字彙"}, {"id": "multi-vocab-23", "mode": "vocab", "paragraph": "D", "sentence": "Women have a much better strategy for finding the keys, whereas men tend to jump to it and be far less organised and thorough. 'It's as if they don't stop to reflect and plan for a moment,' says Professor Keith Laws from the University of Hertfordshire in England.", "target": "reflect", "options": ["think carefully about something", "produce an optical image on a surface", "repeat another person’s words without thinking"], "answer": 0, "explanations": ["stop to reflect＝停下來思考。", "此處不是反射影像。", "不是不加思索重複他人話語。"], "tag": "進階字彙"}, {"id": "multi-vocab-24", "mode": "vocab", "paragraph": "D", "sentence": "But while the ability to develop strategies for coping with the numerous tasks in everyday life could give women an advantage, 'nobody can juggle two, never mind three, \"complex\" tasks at the same time'.", "target": "never mind three", "options": ["let alone three, which would be even less feasible", "three tasks are easier and therefore irrelevant", "three tasks have already been mastered"], "answer": 0, "explanations": ["never mind＝更不用說、遑論；此處強化否定。", "不是三件較容易。", "不是已精通三件。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-25", "mode": "vocab", "paragraph": "E", "sentence": "These so-called 'super-taskers' exhibit different patterns of brain activity when multi-tasking compared to ordinary people: they show less activity in the prefrontal cortex during multi-tasking, suggesting their brains are functioning with a high level of efficiency.", "target": "exhibit", "options": ["show or display a characteristic", "put an object in a museum only", "remove a characteristic through training"], "answer": 0, "explanations": ["exhibit patterns＝呈現模式；此處是動詞。", "不只指博物館展覽。", "不是去除特徵。"], "tag": "進階字彙"}, {"id": "multi-vocab-26", "mode": "vocab", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "high-performance aircraft", "options": ["aircraft designed to operate at an exceptionally high level", "aircraft chosen only for the comfort of passengers", "aircraft with unusually high ticket prices"], "answer": 0, "explanations": ["high-performance 指性能優越的。", "不是只談舒適度。", "不是指票價。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-27", "mode": "vocab", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "high-end chefs", "options": ["chefs working at the premium level of the profession", "chefs working on the highest floor of a building", "chefs who prepare only high-calorie food"], "answer": 0, "explanations": ["high-end 指高端、頂尖層級；此處形容廚師。", "不是工作樓層。", "不是只做高熱量食物。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-28", "mode": "vocab", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "elite doctors", "options": ["doctors regarded as exceptionally skilled", "doctors who treat only wealthy patients", "doctors at the earliest stage of training"], "answer": 0, "explanations": ["elite doctors＝頂尖、精英醫師。", "不表示只服務富人。", "不是初入行醫師。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-29", "mode": "vocab", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "All other things being equal", "options": ["assuming the other relevant factors are the same", "because everyone’s abilities are already identical", "even if every relevant condition differs"], "answer": 0, "explanations": ["all other things being equal＝其他條件相同的情況下。", "不是宣稱所有人能力相同。", "不是忽略條件差異也必然成立。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-30", "mode": "vocab", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "places a high demand on", "options": ["requires a great deal of", "creates a strong desire to buy", "provides complete protection from"], "answer": 0, "explanations": ["place demands on 指對某能力提出很高要求。", "不是消費需求。", "不是保護免受影響。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-31", "mode": "vocab", "paragraph": "F", "sentence": "The ability to multi-task probably comes down to the DNA you inherit from your parents to a large extent, says Strayer. 'You are either born with the neural structure that allows you to overcome the usual multi-tasking challenges, or you aren't.", "target": "comes down to", "options": ["is largely determined or explained by", "moves physically to a lower level", "becomes less important than"], "answer": 0, "explanations": ["come down to＝歸結於、主要取決於。", "不是下降位置。", "不是變得較不重要。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-32", "mode": "vocab", "paragraph": "F", "sentence": "The ability to multi-task probably comes down to the DNA you inherit from your parents to a large extent, says Strayer. 'You are either born with the neural structure that allows you to overcome the usual multi-tasking challenges, or you aren't.", "target": "neural structure", "options": ["the physical organisation of the nervous system", "a person’s preferred study timetable", "the social hierarchy of a profession"], "answer": 0, "explanations": ["neural structure＝神經結構。", "不是讀書時間表。", "不是職業階序。"], "tag": "搭配與語境義"}, {"id": "multi-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Unless you are one of the three percent of super-taskers in the population, research shows that your brain isn't capable of paying close attention to more than one complex task at a time.", "target": "", "options": ["Except for the small group of super-taskers, research suggests that people cannot attend closely to more than one complex task at once.", "Research shows that nobody, including super-taskers, can pay attention to any task.", "Unless a task is simple, everyone can manage several complex tasks equally well."], "answer": 0, "explanations": ["Unless 保留少數例外；限制的是同時密切注意多個複雜任務。", "刪掉少數例外，並把多個複雜任務改成任何任務。", "否定與條件方向被反轉。"], "tag": "長難句理解", "structure": "主幹：research shows that your brain isn’t capable…。Unless 子句限定例外；more than one + complex task 限定數量及任務性質。"}, {"id": "multi-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "Psychiatrist Edward M Hallowell even describes multi-tasking as 'a mythical activity in which people believe they can perform two or more tasks simultaneously as effectively as they can perform one'.", "target": "", "options": ["Hallowell questions the belief that people can carry out several tasks at once just as effectively as a single task.", "Hallowell confirms that everyone performs several tasks more effectively than one.", "Hallowell says that people never believe they can multitask."], "answer": 0, "explanations": ["mythical 標示質疑，as effectively as 表與單一任務同樣有效。", "把質疑改成肯定，且比較級方向改變。", "原文 people believe，並非從沒有人相信。"], "tag": "長難句理解", "structure": "主幹：Hallowell describes X as Y。in which 修飾 mythical activity；people believe 後省略 that；as…as 比較成效，不是比較任務數。"}, {"id": "multi-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "But innate activities like walking, chewing, and breathing do not require you to pay attention, whereas activities such as reading, tapping out a text message, or driving a car do require attention.", "target": "", "options": ["The passage contrasts relatively automatic activities with activities such as reading or driving that require attention.", "The passage states that every task requires exactly the same amount of attention.", "The passage claims that driving needs no attention because it can become familiar."], "answer": 0, "explanations": ["whereas 與 do require 強調兩類活動的對照。", "忽略原文的需求差別。", "原文明確把 driving 放在需注意的活動中。"], "tag": "長難句理解", "structure": "主幹：innate activities do not require…whereas activities…do require…。兩組 like／such as 為例子；do 是強調助動詞。"}, {"id": "multi-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Why is paying attention to two things at once difficult? 'The brain can perform simultaneous tasks, but attention has capacity limitations,' says Associate Professor Paul E Dux, a cognitive neuroscientist at the University of Queensland in Australia.", "target": "", "options": ["Dux says simultaneous activity is possible, but the amount of attention available is limited.", "Dux says the brain cannot perform any two activities simultaneously under any circumstances.", "Dux says attention has no limits if two tasks happen together."], "answer": 0, "explanations": ["can…but…保留能同時活動及注意力受限兩部分。", "把限制擴成全盤不可能。", "否定了 capacity limitations。"], "tag": "長難句理解", "structure": "引述主幹：brain can perform…but attention has…。轉折限制能力，不能只讀 can perform 便推論複雜多工無成本。"}, {"id": "multi-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "When you do only one thing at a time, you're better at that task than when you're doing multiple things concurrently.", "target": "", "options": ["Performance on a task is better when it is done alone than when attention is shared across several tasks.", "Performance improves whenever more tasks are added.", "The sentence compares different people’s intelligence rather than one-task and multiple-task conditions."], "answer": 0, "explanations": ["比較單一與多項任務情境下的表現。", "原句說單一任務時表現較佳，不是工作增加就更好。", "原句比較的是情境，不是不同人的智力。"], "tag": "長難句理解", "structure": "主幹：you’re better at that task than…。兩個 when 子句提供比較條件；than 後省略重複的 you are at that task。"}, {"id": "multi-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "Take the classic multi-tasking scenario of talking on a mobile phone while driving - an ill-advised activity that many people believe they have mastered.", "target": "", "options": ["Using a phone while driving is presented as unwise, even though many people think they have mastered it.", "The writer recommends using a phone while driving once it feels familiar.", "Everyone who believes they have mastered phone use while driving has been verified as a super-tasker."], "answer": 0, "explanations": ["ill-advised 是作者評價；believe 並非能力已獲證實。", "把不明智改成建議採行。", "信念不能改成研究確認。"], "tag": "長難句理解", "structure": "主幹為祈使句 Take the scenario…。while driving 與 talking 主詞同一人；破折號後 activity 為同位說明；that…修飾 activity。"}, {"id": "multi-paraphrase-7", "mode": "paraphrase", "paragraph": "B", "sentence": "When David Strayer, Professor of Psychology at the University of Utah in the US, and his team observed 56,000 drivers as they approached an intersection, the majority of drivers who were talking on their phone failed to stop in accordance with traffic laws.", "target": "", "options": ["Among the drivers observed approaching an intersection, most of those using phones failed to stop as traffic law required.", "Every one of the 56,000 drivers was on the phone and broke the law.", "The researchers studied only drivers who had already stopped legally."], "answer": 0, "explanations": ["majority 與 who were talking 限定違規描述適用的群體。", "把部分群體、多數變成全部觀測者。", "原句 as they approached，不是只觀察合法停車者。"], "tag": "長難句理解", "structure": "主幹：the majority of drivers…failed to stop。When 子句交代研究；who…限定使用電話的駕駛；in accordance with 修飾停車是否守法。"}, {"id": "multi-paraphrase-8", "mode": "paraphrase", "paragraph": "B", "sentence": "Even with both eyes on the road and both hands on the wheel, drivers' performance was impaired.", "target": "", "options": ["Keeping eyes on the road and hands on the wheel did not prevent the impaired performance described.", "Impaired driving occurred only when drivers looked away and took both hands off the wheel.", "The sentence shows hands-free devices completely eliminate the performance problem."], "answer": 0, "explanations": ["Even with 引出即使仍如此的讓步。", "把讓步條件反轉成必要原因。", "原句沒有完全消除問題的結論。"], "tag": "長難句理解", "structure": "主幹：drivers’ performance was impaired。Even with + 兩個並列名詞片語表示讓步；視線及手的位置不代表注意力未分散。"}, {"id": "multi-paraphrase-9", "mode": "paraphrase", "paragraph": "B", "sentence": "Strayer's research shows that performance deteriorates drastically when attention is split between tasks: more mistakes are made and it takes longer to complete each activity.", "target": "", "options": ["Splitting attention is associated here with sharply worse performance: more errors and more time needed for each task.", "Splitting attention makes each task faster but less accurate, according to this sentence.", "The research says performance changes only slightly, with no difference in mistakes."], "answer": 0, "explanations": ["冒號後同時說明錯誤增加與耗時增加。", "只保留準確率降低卻反轉時間結果。", "drastically 及 more mistakes 均被刪除。"], "tag": "長難句理解", "structure": "主幹：research shows that performance deteriorates…。when 給條件；冒號後兩個分句解釋「惡化」如何呈現。"}, {"id": "multi-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "The prefrontal cortex is the brain region responsible for choosing what to pay attention to, and for coordinating inputs from other brain areas.", "target": "", "options": ["The prefrontal cortex is described as selecting what receives attention and coordinating information from other brain regions.", "The prefrontal cortex is described as preventing all input from other brain regions.", "The sentence says attention is chosen exclusively by the eyes without involvement from the brain."], "answer": 0, "explanations": ["for choosing 與 for coordinating 是並列功能。", "coordinating 不是阻擋全部資訊。", "原句明指該腦區的角色。"], "tag": "長難句理解", "structure": "主幹：prefrontal cortex is the brain region…。responsible for 後接兩項 V-ing；what to pay attention to 是疑問詞不定詞作 choosing 的受詞。"}, {"id": "multi-paraphrase-11", "mode": "paraphrase", "paragraph": "C", "sentence": "By scanning the prefrontal cortex of people while they multi-tasked, scientists at the French Institute of Health and Medical Research in Paris (INSERM) found that when people focused on a single thing, the right and left sides of the prefrontal cortex worked together.", "target": "", "options": ["The scans showed that the right and left prefrontal sides worked together when people focused on a single task.", "The scans showed that the two sides worked independently during every single-task condition.", "Scientists found that the prefrontal cortex stopped working whenever one task was selected."], "answer": 0, "explanations": ["保留 scanning 的方法及 single thing 的條件。", "把 work together 反轉成 independently。", "原句沒有停止活動。"], "tag": "長難句理解", "structure": "主幹：scientists found that…。By scanning…說明方法；while they multi-tasked 交代掃描情境；that 內的 when 指其中單一焦點條件。"}, {"id": "multi-paraphrase-12", "mode": "paraphrase", "paragraph": "C", "sentence": "Neuroscientist Etienne Koechlin says his study demonstrates that while the brain can switch back and forth between two tasks, 'we might be in great trouble when we try to juggle more than two tasks, simply because we have only two frontal lobes'.", "target": "", "options": ["Koechlin says the brain can switch between two tasks, but suggests that handling more than two may create serious difficulty.", "Koechlin proves that everyone can perform three complex tasks simultaneously with no difficulty.", "Koechlin denies that the brain can ever switch from one task to another."], "answer": 0, "explanations": ["while 表讓步；might 保留可能性；switching 不等於同時做好。", "把可能困難改成已證明毫無困難。", "原句承認 can switch。"], "tag": "長難句理解", "structure": "主幹：Koechlin says his study demonstrates that…。that 內含 while 子句；when…給困難情境；because 提供引述中的原因。"}, {"id": "multi-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "To the question of whether there is a difference between the sexes, Koechlin's imaging studies uncovered no differences in the ability to switch between tasks in the prefrontal cortices of men or women.", "target": "", "options": ["Koechlin’s imaging studies did not find a sex difference in the prefrontal ability to switch tasks.", "Koechlin proved men and women have identical abilities in every aspect of everyday multitasking.", "Koechlin’s scans found women’s prefrontal cortices were consistently superior at task switching."], "answer": 0, "explanations": ["no differences 的範圍限於這些造影研究及切換能力。", "未發現某項差異不等於證明所有能力完全相同。", "將未發現改成發現明確優勢。"], "tag": "長難句理解", "structure": "主幹：imaging studies uncovered no differences…。句首 To the question of whether…界定議題；in the ability…限定差異面向。"}, {"id": "multi-paraphrase-14", "mode": "paraphrase", "paragraph": "D", "sentence": "But other researchers studying real life scenarios such as finding lost keys, believe there might be some truth to the claim that women are superior multi-taskers.", "target": "", "options": ["Other researchers examining everyday situations think the claim of a female multitasking advantage may be partly justified.", "All researchers now agree that women are better at every complex task.", "Researchers have proved women’s advantage must come from a different prefrontal structure."], "answer": 0, "explanations": ["other、believe、might、some truth 都限制結論強度。", "把部分研究者及可能性擴成全體確論。", "本句沒有證實生理來源。"], "tag": "長難句理解", "structure": "主幹：other researchers…believe…。studying…修飾 researchers；might be some truth 後的 claim 接 that 同位子句。"}, {"id": "multi-paraphrase-15", "mode": "paraphrase", "paragraph": "D", "sentence": "Women have a much better strategy for finding the keys, whereas men tend to jump to it and be far less organised and thorough. 'It's as if they don't stop to reflect and plan for a moment,' says Professor Keith Laws from the University of Hertfordshire in England.", "target": "", "options": ["Laws compares the men’s behaviour to acting without first pausing to think and plan; the wording is an interpretation of their strategy.", "Laws reports directly observing the total absence of thought inside every man’s brain.", "Laws says men always stop and plan more thoroughly than women."], "answer": 0, "explanations": ["as if 表看起來彷彿，不是直接量得內心活動。", "把比擬與觀察解讀誤作全體腦內事實。", "方向與原文 less organised 相反。"], "tag": "長難句理解", "structure": "主幹：It’s as if…。as if 後子句描述觀察印象；stop to reflect and plan＝停下來為了思考及規劃，不是 stop reflecting。"}, {"id": "multi-paraphrase-16", "mode": "paraphrase", "paragraph": "D", "sentence": "But while the ability to develop strategies for coping with the numerous tasks in everyday life could give women an advantage, 'nobody can juggle two, never mind three, \"complex\" tasks at the same time'.", "target": "", "options": ["A possible advantage in managing everyday demands does not mean women can simultaneously juggle two or three complex tasks, in the quoted assessment.", "Because women may manage everyday tasks better, they can certainly perform three complex tasks simultaneously.", "The writer says no everyday strategy can ever be useful to anyone."], "answer": 0, "explanations": ["while…could…讓步於可能優勢；後句仍否定複雜同時多工。", "把可能策略優勢跳成三件複雜事的確定能力。", "原文承認策略可能有優勢。"], "tag": "長難句理解", "structure": "主幹在引述：nobody can juggle…。while 子句主詞核心是 ability；could 限定可能；never mind three 加強兩件都難、更別說三件。"}, {"id": "multi-paraphrase-17", "mode": "paraphrase", "paragraph": "E", "sentence": "These so-called 'super-taskers' exhibit different patterns of brain activity when multi-tasking compared to ordinary people: they show less activity in the prefrontal cortex during multi-tasking, suggesting their brains are functioning with a high level of efficiency.", "target": "", "options": ["Super-taskers show less prefrontal activity while multitasking than ordinary people, which the passage interprets as suggesting greater efficiency.", "Super-taskers show more activity everywhere in the brain, conclusively proving they are more intelligent.", "Less prefrontal activity is presented here as evidence that super-taskers fail to perform any task."], "answer": 0, "explanations": ["less activity 的部位、條件及 suggesting 語氣均保留。", "部位、比較方向與確定性都被改變，且加入智力。", "原文解讀為可能效率高，不是完全失敗。"], "tag": "長難句理解", "structure": "主幹：super-taskers exhibit different patterns…。compared to…比較一般人；冒號舉結果；suggesting…引出解讀，不能當成直接證明。"}, {"id": "multi-paraphrase-18", "mode": "paraphrase", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "", "options": ["Strayer suspects people in several demanding occupations may be more likely to be super-taskers; the sentence does not classify all such workers that way.", "Every pilot, chef and hospital doctor is conclusively identified as a super-tasker.", "Only people in those three professions can ever possess super-tasking ability."], "answer": 0, "explanations": ["保留 thinks、might、more likely；例子不是排他清單。", "把較可能改成所有人均已確定。", "原文沒有 only 的限定。"], "tag": "長難句理解", "structure": "主幹：Strayer thinks that A, B, and C might all be more likely…。who can cook…修飾 chefs；三組職業為並列主詞。"}, {"id": "multi-paraphrase-19", "mode": "paraphrase", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "", "options": ["Under equal other conditions, Strayer suspects super-taskers will reach senior positions in occupations that heavily require managing competing attentional demands.", "Strayer guarantees every super-tasker will lead any occupation regardless of its demands or other conditions.", "The prediction applies only to jobs that never require attention."], "answer": 0, "explanations": ["保留比較條件、suspect 的推測及職業要求的限制。", "刪掉條件，將推測變成無條件保證。", "預測對象是高度要求注意力分配的職業，不是完全不需注意的工作。"], "tag": "長難句理解", "structure": "主幹：we suspect that super-taskers will rise…。All other things being equal 為獨立分詞結構；第一個 that 修飾 occupation；第二個 that 修飾 tasks。"}, {"id": "multi-paraphrase-20", "mode": "paraphrase", "paragraph": "F", "sentence": "The ability to multi-task probably comes down to the DNA you inherit from your parents to a large extent, says Strayer. 'You are either born with the neural structure that allows you to overcome the usual multi-tasking challenges, or you aren't.", "target": "", "options": ["Strayer thinks inherited DNA probably explains much of multitasking ability, without claiming in this sentence that it is the sole certain cause.", "Strayer proves that training has no possible role and genes explain every difference without exception.", "Strayer says inheritance has no relationship with multitasking ability."], "answer": 0, "explanations": ["probably 與 to a large extent 都保留範圍及把握程度。", "大程度不等於唯一原因；probably 也不是 proved。", "與 comes down to DNA 的主張相反。"], "tag": "長難句理解", "structure": "主幹：ability probably comes down to DNA。you inherit…為省略 that 的關係子句；to a large extent 限定主要程度。"}, {"id": "multi-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "The effects of multi-tasking on neurological structure", "target": "neurological structure", "options": ["神經系統的結構", "人格及習慣的組成", "社會組織的階級"], "answer": 0, "explanations": ["neurological 指神經系統，structure 指結構。此處只辨認原題用語，不代表整句敘述符合文章。", "不是性格構成。", "不是社會階層。"], "tag": "題目字彙", "source": "Questions 14–19 · Heading ii · 題目用語"}, {"id": "multi-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "A distinction between situations when people can and can’t multi-task", "target": "distinction", "options": ["區別、差異", "因果證明", "完全一致的特徵"], "answer": 0, "explanations": ["distinction between＝兩者之間的區別。此處只辨認原題用語，不代表整句敘述符合文章。", "不是原因的證明。", "不是完全相同。"], "tag": "題目字彙", "source": "Questions 14–19 · Heading iii · 題目用語"}, {"id": "multi-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "The neurological reasons for struggling to manage more things", "target": "neurological", "options": ["神經系統相關的", "營養攝取相關的", "社會文化相關的"], "answer": 0, "explanations": ["neurological＝神經學、神經系統方面的。此處只辨認原題用語，不代表整句敘述符合文章。", "不是 nutritional。", "不是 sociocultural。"], "tag": "題目字彙", "source": "Questions 14–19 · Heading vi · 題目用語"}, {"id": "multi-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "The ability to multi-task is determined by people’s genes", "target": "genes", "options": ["攜帶遺傳資訊的基因", "後天養成的固定習慣", "神經元接收訊息的突觸"], "answer": 0, "explanations": ["genes 指遺傳資訊的基本單位；原標題是否合適仍須另判。此處只辨認原題用語，不代表整句敘述符合文章。", "不是後天習慣。", "突觸是 synapses，與基因不同。"], "tag": "題目字彙", "source": "Questions 14–19 · Heading vii · 題目用語"}, {"id": "multi-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "The brain of a good multi-tasker works differently from other people’s.", "target": "multi-tasker", "options": ["同時處理多項任務的人", "只做固定單一工作的人", "專門替別人分派任務的人"], "answer": 0, "explanations": ["multi-tasker 指多任務處理者。此處只辨認原題用語，不代表整句敘述符合文章。", "不是限定只做一件事。", "不必是分派工作的主管。"], "tag": "題目字彙", "source": "Question 20 · 題目用語"}, {"id": "multi-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "The rate of error is considerably higher when people multi-task.", "target": "considerably higher", "options": ["高出相當多、顯著較高", "僅高出極微小差距", "一定剛好增加一倍"], "answer": 0, "explanations": ["considerably 表程度相當大。此處只辨認原題用語，不代表整句敘述符合文章。", "不是略微而已。", "不包含固定倍數。"], "tag": "題目字彙", "source": "Question 21 · 題目用語"}, {"id": "multi-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "People are mistaken in their assumption that they can multi-task.", "target": "assumption", "options": ["未經充分證實便接受的假定", "已用實驗排除其他可能的確論", "對事件的正式法規"], "answer": 0, "explanations": ["assumption＝假設、想當然的看法。此處只辨認原題用語，不代表整句敘述符合文章。", "不是已排除其他可能的定論。", "不是規章。"], "tag": "題目字彙", "source": "Question 22 · 題目用語"}, {"id": "multi-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Super-taskers are those of us who possess special multi-tasking ability.", "target": "possess", "options": ["擁有、具備", "暫時借用", "刻意壓抑"], "answer": 0, "explanations": ["possess an ability＝具有某能力。此處只辨認原題用語，不代表整句敘述符合文章。", "不是借用。", "不是壓抑。"], "tag": "題目字彙", "source": "Question 24–26 · 題目用語"}, {"id": "multi-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "People who are pilots, chefs and doctors are often super-taskers, and super-taskers are most likely to achieve a ______ that is high on the career ladder.", "target": "career ladder", "options": ["職涯晉升的階梯或體系", "工作場所的實體梯子", "職業訓練的出席名單"], "answer": 0, "explanations": ["career ladder 比喻職位由低到高的晉升層級。此處只辨認原題用語，不代表整句敘述符合文章。", "不是實體工具。", "不是出席紀錄。"], "tag": "題目字彙", "source": "Question 24–26 · 題目用語"}, {"id": "multi-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "Super-taskers typically have to undertake many tasks simultaneously that need their ______.", "target": "undertake", "options": ["著手進行、承擔", "把任務永久擱置", "把結果作廢"], "answer": 0, "explanations": ["undertake tasks＝承擔、進行任務。此處只辨認原題用語，不代表整句敘述符合文章。", "不是擱置。", "不是取消結果。"], "tag": "題目字彙", "source": "Question 24–26 · 題目用語"}, {"id": "multi-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "Super-taskers typically have to undertake many tasks simultaneously that need their ______.", "target": "simultaneously", "options": ["同時地", "依序完成後才進行下一件", "偶爾但不規則地"], "answer": 0, "explanations": ["simultaneously＝在同一時間。此處只辨認原題用語，不代表整句敘述符合文章。", "不是 sequentially。", "不是偶爾的頻率。"], "tag": "題目字彙", "source": "Question 24–26 · 題目用語"}, {"id": "multi-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "Genes play an important role in having this capability: these people have a special brain ______, which helps them do what we cannot.", "target": "capability", "options": ["能力、能耐", "行事意願", "社會身分"], "answer": 0, "explanations": ["capability 指能做到的能力。此處只辨認原題用語，不代表整句敘述符合文章。", "不只是願不願意。", "不是身分地位。"], "tag": "題目字彙", "source": "Question 24–26 · 題目用語"}, {"id": "multi-vocab-33", "mode": "vocab", "paragraph": "A", "sentence": "Do you think you're a master of multi-tasking?", "target": "a master of", "options": ["someone highly skilled in", "someone who merely owns an object", "someone legally responsible for a household only"], "answer": 0, "explanations": ["a master of multi-tasking＝精通多工的人。", "不是物品所有者。", "不是只指家長。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-34", "mode": "vocab", "paragraph": "A", "sentence": "Unless you are one of the three percent of super-taskers in the population, research shows that your brain isn't capable of paying close attention to more than one complex task at a time.", "target": "capable of", "options": ["able to do something", "willing but unable to do something", "forbidden to attempt something"], "answer": 0, "explanations": ["capable of + V-ing＝有能力做。", "不是只有意願卻無能力。", "不是禁止。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-36", "mode": "vocab", "paragraph": "A", "sentence": "Researchers who study attention say that effective multi-tasking is beyond most of us.", "target": "beyond most of us", "options": ["outside the ability of most people", "physically behind most people", "easier than most people expect"], "answer": 0, "explanations": ["beyond someone 在此指超出其能力。", "不是站在後面。", "不是比預想容易。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-37", "mode": "vocab", "paragraph": "A", "sentence": "Psychiatrist Edward M Hallowell even describes multi-tasking as 'a mythical activity in which people believe they can perform two or more tasks simultaneously as effectively as they can perform one'.", "target": "Psychiatrist", "options": ["a medical specialist in mental health", "a researcher studying only fossils", "a counsellor without medical training by definition"], "answer": 0, "explanations": ["psychiatrist＝精神科醫師。", "不是化石研究者。", "不是按定義無醫療訓練的諮商員。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-38", "mode": "vocab", "paragraph": "A", "sentence": "Psychiatrist Edward M Hallowell even describes multi-tasking as 'a mythical activity in which people believe they can perform two or more tasks simultaneously as effectively as they can perform one'.", "target": "effectively", "options": ["in a way that achieves the intended result", "with no effort under any conditions", "only in an appearance of success"], "answer": 0, "explanations": ["effectively＝有效地。", "不保證毫不費力。", "不是只有表面成功。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-39", "mode": "vocab", "paragraph": "B", "sentence": "But innate activities like walking, chewing, and breathing do not require you to pay attention, whereas activities such as reading, tapping out a text message, or driving a car do require attention.", "target": "chewing", "options": ["breaking food down with the teeth", "swallowing food without biting", "taking air into the lungs"], "answer": 0, "explanations": ["chew＝咀嚼。", "不是不咬就吞。", "不是吸氣。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-40", "mode": "vocab", "paragraph": "B", "sentence": "But innate activities like walking, chewing, and breathing do not require you to pay attention, whereas activities such as reading, tapping out a text message, or driving a car do require attention.", "target": "whereas", "options": ["while by contrast", "because as a cause", "provided that as a condition"], "answer": 0, "explanations": ["whereas＝然而、相對而言，用來對照。", "不是原因。", "不是條件。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-41", "mode": "vocab", "paragraph": "B", "sentence": "Take the classic multi-tasking scenario of talking on a mobile phone while driving - an ill-advised activity that many people believe they have mastered.", "target": "have mastered", "options": ["have become highly skilled at", "have only just begun to try", "have permanently stopped doing"], "answer": 0, "explanations": ["master 作動詞＝熟練掌握；此處是很多人的自認。", "不是剛開始嘗試。", "不是停止。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-42", "mode": "vocab", "paragraph": "B", "sentence": "And it did not matter if the driver was using a handheld or hands-free device.", "target": "handheld", "options": ["held in the hand during use", "operating without being held", "fixed permanently to the road"], "answer": 0, "explanations": ["handheld device＝手持裝置。", "不是免持。", "不是固定在道路。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-43", "mode": "vocab", "paragraph": "B", "sentence": "And it did not matter if the driver was using a handheld or hands-free device.", "target": "hands-free", "options": ["usable without holding it in the hands", "requiring both hands at all times", "available without payment"], "answer": 0, "explanations": ["hands-free＝免持的。", "不是雙手全程握持。", "不是免費。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-44", "mode": "vocab", "paragraph": "B", "sentence": "Strayer's research shows that performance deteriorates drastically when attention is split between tasks: more mistakes are made and it takes longer to complete each activity.", "target": "split between tasks", "options": ["divided across different tasks", "focused exclusively on one task", "removed from every task"], "answer": 0, "explanations": ["attention split between tasks＝注意力分散於多項工作。", "不是專注一項。", "不是對所有事皆無注意。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-46", "mode": "vocab", "paragraph": "C", "sentence": "Neuroscientist Etienne Koechlin says his study demonstrates that while the brain can switch back and forth between two tasks, 'we might be in great trouble when we try to juggle more than two tasks, simply because we have only two frontal lobes'.", "target": "switch back and forth", "options": ["alternate repeatedly between two things", "perform every task with no switching", "stop permanently after the first change"], "answer": 0, "explanations": ["switch back and forth＝來回切換。", "不是無切換地完成全部。", "不是只換一次後永久停止。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-47", "mode": "vocab", "paragraph": "C", "sentence": "But when people attempt to perform two things at once, the sides work independently.", "target": "independently", "options": ["separately rather than jointly", "in exactly the same coordinated pattern", "without needing any energy"], "answer": 0, "explanations": ["independently＝分別、獨立地。", "不是完全相同的協同模式。", "不等於不耗能。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-48", "mode": "vocab", "paragraph": "D", "sentence": "Women have a much better strategy for finding the keys, whereas men tend to jump to it and be far less organised and thorough. 'It's as if they don't stop to reflect and plan for a moment,' says Professor Keith Laws from the University of Hertfordshire in England.", "target": "strategy", "options": ["a planned way of achieving a goal", "an accidental result with no method", "a person’s inherited DNA"], "answer": 0, "explanations": ["strategy＝策略、計畫性方法。", "不是純偶然結果。", "不是基因。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-49", "mode": "vocab", "paragraph": "D", "sentence": "But while the ability to develop strategies for coping with the numerous tasks in everyday life could give women an advantage, 'nobody can juggle two, never mind three, \"complex\" tasks at the same time'.", "target": "coping with", "options": ["managing or dealing with difficulties", "avoiding every possible contact with", "making the difficulty disappear by definition"], "answer": 0, "explanations": ["cope with＝應付、處理。", "不是完全不接觸。", "不保證問題直接消失。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-52", "mode": "vocab", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "to perfection", "options": ["to an exceptionally high standard", "only until the first attempt begins", "without any need to learn"], "answer": 0, "explanations": ["cook to perfection＝烹調得恰到好處、極佳。", "不是只到開始階段。", "不表示不需學習。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-53", "mode": "vocab", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "occupation", "options": ["a job or profession", "a short period of rest", "the physical layout of an office"], "answer": 0, "explanations": ["occupation＝職業。", "不是休息。", "不是辦公室配置。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-54", "mode": "vocab", "paragraph": "E", "sentence": "These so-called 'super-taskers' exhibit different patterns of brain activity when multi-tasking compared to ordinary people: they show less activity in the prefrontal cortex during multi-tasking, suggesting their brains are functioning with a high level of efficiency.", "target": "efficiency", "options": ["the ability to achieve results with little wasted effort", "the total amount of effort regardless of results", "a person’s confidence without performance evidence"], "answer": 0, "explanations": ["efficiency＝效率，關注投入與成效。", "不是只看投入總量。", "不是只有自信。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-55", "mode": "vocab", "paragraph": "F", "sentence": "The ability to multi-task probably comes down to the DNA you inherit from your parents to a large extent, says Strayer. 'You are either born with the neural structure that allows you to overcome the usual multi-tasking challenges, or you aren't.", "target": "inherit", "options": ["receive genetically from parents here", "learn solely through practice", "borrow temporarily"], "answer": 0, "explanations": ["inherit DNA＝遺傳自父母。", "不是只靠練習。", "不是暫借。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-56", "mode": "vocab", "paragraph": "F", "sentence": "The ability to multi-task probably comes down to the DNA you inherit from your parents to a large extent, says Strayer. 'You are either born with the neural structure that allows you to overcome the usual multi-tasking challenges, or you aren't.", "target": "to a large extent", "options": ["to a considerable degree", "completely and without exception", "only to a negligible degree"], "answer": 0, "explanations": ["to large extent＝在很大程度上。", "不是百分之百無例外。", "不是幾乎沒有。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-57", "mode": "vocab", "paragraph": "F", "sentence": "The ability to multi-task probably comes down to the DNA you inherit from your parents to a large extent, says Strayer. 'You are either born with the neural structure that allows you to overcome the usual multi-tasking challenges, or you aren't.", "target": "overcome", "options": ["successfully deal with a difficulty", "deny the difficulty exists", "cause the difficulty to become worse"], "answer": 0, "explanations": ["overcome challenges＝克服挑戰。", "不是否認。", "不是使惡化。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-58", "mode": "vocab", "paragraph": "F", "sentence": "Super-taskers' brains are doing something we can't do.' All in all, these findings may have very real consequences for our lives.", "target": "consequences", "options": ["results or effects", "plans that have not been attempted", "the original causes only"], "answer": 0, "explanations": ["consequences＝後果、影響。", "不是未執行計畫。", "不是最初原因。"], "tag": "字彙與語境義"}, {"id": "multi-questionVocab-14", "mode": "questionVocab", "paragraph": "", "sentence": "The neurological reasons for struggling to manage more things", "target": "struggling to", "options": ["吃力地嘗試、奮力……", "輕易且毫不費力地……", "無意嘗試而完全拒絕……"], "answer": 0, "explanations": ["struggle to 表努力但有困難。此處辨認題目用語，不表示整句敘述符合文章。", "不是輕鬆。", "不是完全拒絕。"], "tag": "題目字彙", "source": "Question 14–19 vi · 題目用語"}, {"id": "multi-vocab-60", "mode": "vocab", "paragraph": "A", "sentence": "Unless you are one of the three percent of super-taskers in the population, research shows that your brain isn't capable of paying close attention to more than one complex task at a time.", "target": "complex task", "options": ["an activity involving several connected or demanding elements", "an activity that is automatically easy for everyone", "a task that must be physically large"], "answer": 0, "explanations": ["complex task＝複雜任務。", "不是人人都容易的活動。", "不是體積大。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-61", "mode": "vocab", "paragraph": "A", "sentence": "Psychiatrist Edward M Hallowell even describes multi-tasking as 'a mythical activity in which people believe they can perform two or more tasks simultaneously as effectively as they can perform one'.", "target": "perform", "options": ["carry out an action or task", "describe a task without doing it", "watch another person do a task"], "answer": 0, "explanations": ["perform tasks＝執行任務。", "不是只口述。", "不是只旁觀。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-63", "mode": "vocab", "paragraph": "B", "sentence": "When you do only one thing at a time, you're better at that task than when you're doing multiple things concurrently.", "target": "multiple", "options": ["several or more than one", "exactly two in every case", "one task repeated without any other task"], "answer": 0, "explanations": ["multiple things＝多項事務。", "不限定剛好兩項。", "不是單一事務的同義詞。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-64", "mode": "vocab", "paragraph": "B", "sentence": "When David Strayer, Professor of Psychology at the University of Utah in the US, and his team observed 56,000 drivers as they approached an intersection, the majority of drivers who were talking on their phone failed to stop in accordance with traffic laws.", "target": "the majority of", "options": ["more than half of", "every single member of", "only a very small minority of"], "answer": 0, "explanations": ["majority＝大多數、超過一半。", "不等於全部。", "不是極少數。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-65", "mode": "vocab", "paragraph": "B", "sentence": "Even with both eyes on the road and both hands on the wheel, drivers' performance was impaired.", "target": "performance", "options": ["how well an activity is carried out", "only a staged artistic show", "a person’s willingness regardless of results"], "answer": 0, "explanations": ["performance 在此指任務執行表現。", "不是舞台表演義。", "不是只有意願。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-66", "mode": "vocab", "paragraph": "C", "sentence": "Neuroscientist Etienne Koechlin says his study demonstrates that while the brain can switch back and forth between two tasks, 'we might be in great trouble when we try to juggle more than two tasks, simply because we have only two frontal lobes'.", "target": "demonstrates", "options": ["shows or provides evidence for", "necessarily proves every interpretation beyond doubt", "intentionally hides the results of"], "answer": 0, "explanations": ["demonstrate 在此指研究顯示、展示證據。", "顯示證據不代表任何延伸解釋都確證。", "不是藏起結果。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-67", "mode": "vocab", "paragraph": "D", "sentence": "But while the ability to develop strategies for coping with the numerous tasks in everyday life could give women an advantage, 'nobody can juggle two, never mind three, \"complex\" tasks at the same time'.", "target": "numerous", "options": ["many in number", "very few", "identical in every detail"], "answer": 0, "explanations": ["numerous tasks＝許多任務。", "不是少數。", "不是內容相同。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-68", "mode": "vocab", "paragraph": "E", "sentence": "However, David Strayer's research uncovered that some rare people possess extraordinary multi-tasking ability.", "target": "possess", "options": ["have or own", "temporarily borrow", "refuse to accept"], "answer": 0, "explanations": ["possess ability＝具有能力。", "不是暫借。", "不是拒絕。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-69", "mode": "vocab", "paragraph": "E", "sentence": "These so-called 'super-taskers' exhibit different patterns of brain activity when multi-tasking compared to ordinary people: they show less activity in the prefrontal cortex during multi-tasking, suggesting their brains are functioning with a high level of efficiency.", "target": "patterns of brain activity", "options": ["recognizable ways in which brain activity is organised", "the visible colour of the outside of the head", "a schedule deciding when researchers work"], "answer": 0, "explanations": ["brain activity patterns＝腦部活動模式。", "不是頭部外觀顏色。", "不是研究員班表。"], "tag": "搭配與語境義"}, {"id": "multi-vocab-70", "mode": "vocab", "paragraph": "E", "sentence": "These so-called 'super-taskers' exhibit different patterns of brain activity when multi-tasking compared to ordinary people: they show less activity in the prefrontal cortex during multi-tasking, suggesting their brains are functioning with a high level of efficiency.", "target": "functioning", "options": ["working or operating", "being physically repaired in every case", "remaining inactive"], "answer": 0, "explanations": ["brains functioning＝大腦在運作。", "不一定是在修理。", "不是不活動。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-71", "mode": "vocab", "paragraph": "E", "sentence": "Strayer thinks that pilots of high-performance aircraft, high-end chefs who can cook several meals at the same time to perfection, and elite doctors in hospital emergency rooms might all be more likely to be super-taskers. \"All other things being equal, we suspect that super-taskers will rise to a top position in any occupation that places a high demand on juggling various tasks that demand attention at the same time\".", "target": "suspect", "options": ["think that something is probably true without being certain", "know that it has been conclusively proved", "accuse a person of a crime in this context"], "answer": 0, "explanations": ["suspect 在此指推測、認為可能。", "不是確證。", "此處不是懷疑犯罪。"], "tag": "字彙與語境義"}, {"id": "multi-vocab-72", "mode": "vocab", "paragraph": "F", "sentence": "Super-taskers' brains are doing something we can't do.' All in all, these findings may have very real consequences for our lives.", "target": "findings", "options": ["results obtained from investigation", "questions asked before research only", "rules imposed on participants only"], "answer": 0, "explanations": ["findings＝研究結果、發現。", "不只是研究前問題。", "不是參與者規則。"], "tag": "字彙與語境義"}]}, {"id": "whale-culture", "title": "Whale Culture", "sourceTitle": "Whale Culture", "subtitle": "", "part": 3, "topic": "社會學習、方言與文化傳承", "sourceNote": "文化定義、研究解讀與因果推論均依本文語境理解；原題敘述及干擾選項不等於文章主張。", "paragraphs": [{"label": "A", "text": "Most social scientists stubbornly resist the idea that animals have culture. Even such advanced cetacean mammals as whales and dolphins clearly don't have art, literature, or architecture. But patient observation over many years has begun to reveal behaviours that can only be learnt from other whales. And that, say whale biologists, constitutes culture."}, {"label": "B", "text": "So far, humpback and killer whales provide the best evidence of culture in cetaceans, and the song of the male humpback is among the most striking examples. Humpback populations in different oceans sing different songs, but within the same ocean they all stick to the same one. However, during the breeding season the sounds change, as it appears that females are drawn to novel songs. One male might add an extra set of groans; another might drop a series of grunts. Soon all the other males have altered their own rendition to incorporate the changes until they are once again singing the same song. Since this occurs among thousands of whales spread across a vast part of the planet, the change cannot be in response to any factor in the animal's environment. The latest version of the song can be learnt only from other whales – almost certainly by imitation."}, {"label": "C", "text": "Culture plays an even bigger part in the life of killer whales. Nowhere is this more obvious than along the north-west coast of America, where killer whales are split into two distinct populations – 'residents' and 'transients'. They live in the same stretch of water, but they don't mingle. In effect, they belong to two quite separate cultures. Residents live in stable groups, or 'pods', made up of two or three mothers and their offspring – perhaps 20 whales in all. Calves stay with their mothers throughout adulthood, and in many years of observation no one has ever seen a whale switch pods. Transients travel in smaller, more changeable groups of between three and six."}, {"label": "D", "text": "One of the most obvious distinctions between the transient and resident societies is the way they impart information. Killer whales detect prey with a range of echo-locating clicks, but converse with a vocabulary of squeaks, whistles and whines. Transients have only a few such calls, and all transient societies share the same ones. Residents have a much more extensive repertoire, and each family group has its own unique and distinctive set of calls. Despite regular interaction between them, each resident pod sticks firmly to its own dialect. Research shows these dialects are maintained for at least 40 years."}, {"label": "E", "text": "To qualify as part of killer whale culture, dialects must be learnt from other members of the pod. Animals with different dialects share the same waters, so the variation can't be a product of physical environment. 'And we can throw out the notion that dialects are inherited,' says Lance Barrett-Lennard of the University of British Columbia. He has spent the past seven years analysing DNA from 270 whales. His paternity tests reveal that female killer whales invariably attract mates from outside their own pod – males with a very different dialect. If dialects were programmed by genetics, call patterns from both father and mother would be passed on to the calf. 'A calf uses the calls of its maternal pod very precisely. There's no input from the father,' says Barrett-Lennard."}, {"label": "F", "text": "The question still remains – is this culture? It is, according to Frans de Waal of Emory University in Atlanta, who argues that culture is just another biological adaptation that has evolved in many creatures. One benefit of viewing culture in this way is that you can start to understand how and why it might have arisen in these creatures. Whales have several biological attributes that give them an advantage in social learning. Apart from their advanced mental abilities, they are adept at recognising sounds: ideal for communicating in the marine environment. Many species spend years rearing their offspring, and live in small, stable, multi-generational societies, a social system that provides ample opportunity for teaching and learning."}, {"label": "G", "text": "But why have cetaceans evolved the ability to learn from other group members? Experts in whale biology believe that ecological factors and the need to adapt to sudden changes in the environment played a large part in the emergence of culture. Although the ocean is a relatively stable habitat in many ways, it is highly changeable in one crucial respect – the availability of food. One moment there might be a plentiful supply of fish, the next they've disappeared. When that happens, the past experience of senior members of the group – and the ability to share this knowledge – is a huge asset. The dialects of killer whales allow members of the group to identify each other, enabling them to share information about food hot spots. Among resident killer whales, it also allows females to avoid inbreeding by picking out a mate with a strange dialect from outside their pod, says Barrett-Lennard."}, {"label": "H", "text": "The importance of sharing information seems to have led to biological changes in at least some species of whale. Female killer whales, like humans, are very unusual in that they live up to a quarter of a century after they have had their descendants. And what whale matriarchs offer is the most important thing of all – cultural knowledge, vital for the group's survival, passed directly from one generation to the next."}], "questions": [{"id": "whale-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Most social scientists stubbornly resist the idea that animals have culture.", "target": "stubbornly resist", "options": ["persistently refuse to accept", "accept without examining evidence", "temporarily forget to mention"], "answer": 0, "explanations": ["stubbornly resist 指頑固地抗拒接受。", "不是不經檢視就接受。", "不是暫時忘記提及。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Even such advanced cetacean mammals as whales and dolphins clearly don't have art, literature, or architecture.", "target": "cetacean mammals", "options": ["marine mammals of the whale and dolphin group", "all animals that live in the sea", "fish that give birth to live young"], "answer": 0, "explanations": ["cetacean mammals＝鯨類哺乳動物。", "不是所有海洋動物。", "不是魚類。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "And that, say whale biologists, constitutes culture.", "target": "constitutes", "options": ["counts as or makes up", "is merely unrelated to", "prevents the existence of"], "answer": 0, "explanations": ["constitute culture＝構成、可算作文化。", "不是毫無關係。", "不是阻止文化存在。"], "tag": "進階字彙"}, {"id": "whale-vocab-4", "mode": "vocab", "paragraph": "B", "sentence": "However, during the breeding season the sounds change, as it appears that females are drawn to novel songs.", "target": "breeding season", "options": ["the period when animals reproduce", "the period when young animals learn to feed only", "a season determined only by ocean temperature"], "answer": 0, "explanations": ["breeding season＝繁殖季。", "不是僅指學習進食時期。", "不只由水溫的語義定義。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-5", "mode": "vocab", "paragraph": "B", "sentence": "However, during the breeding season the sounds change, as it appears that females are drawn to novel songs.", "target": "are drawn to", "options": ["are attracted to", "are physically carried towards against their will", "are trained to reject"], "answer": 0, "explanations": ["be drawn to＝受到吸引。", "不是強制搬運。", "不是被訓練去排斥。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-6", "mode": "vocab", "paragraph": "B", "sentence": "However, during the breeding season the sounds change, as it appears that females are drawn to novel songs.", "target": "novel", "options": ["new and unusual", "fictional rather than real", "complex because it is written in a book"], "answer": 0, "explanations": ["novel 作形容詞＝新穎的。", "不是 fictional 虛構的。", "不是名詞 novel 小說。"], "tag": "進階字彙"}, {"id": "whale-vocab-7", "mode": "vocab", "paragraph": "B", "sentence": "Soon all the other males have altered their own rendition to incorporate the changes until they are once again singing the same song.", "target": "rendition", "options": ["a particular performance or version of a song", "the anatomical organ producing sound", "a fixed genetic code for a sound"], "answer": 0, "explanations": ["rendition 指某次演唱、詮釋版本。", "不是發聲器官。", "不是基因編碼。"], "tag": "進階字彙"}, {"id": "whale-vocab-8", "mode": "vocab", "paragraph": "B", "sentence": "Soon all the other males have altered their own rendition to incorporate the changes until they are once again singing the same song.", "target": "incorporate", "options": ["include something as part of a larger whole", "remove something from the whole", "copy something while keeping it entirely separate"], "answer": 0, "explanations": ["incorporate the changes＝把變化納入。", "不是刪除。", "不是始終分離不整合。"], "tag": "進階字彙"}, {"id": "whale-vocab-9", "mode": "vocab", "paragraph": "B", "sentence": "Since this occurs among thousands of whales spread across a vast part of the planet, the change cannot be in response to any factor in the animal's environment.", "target": "in response to", "options": ["as a reaction to", "as the original cause of", "in complete isolation from"], "answer": 0, "explanations": ["in response to＝回應、因應……而發生。", "不是反過來成為原始原因。", "不是完全隔絕無關。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-10", "mode": "vocab", "paragraph": "C", "sentence": "Nowhere is this more obvious than along the north-west coast of America, where killer whales are split into two distinct populations – 'residents' and 'transients'.", "target": "residents", "options": ["killer whales belonging to the relatively stable resident population", "people who permanently live on the coast", "all whales temporarily passing through any ocean"], "answer": 0, "explanations": ["residents 在此是定居型虎鯨的族群稱呼。", "不是沿岸居民。", "不是任何路過海域的鯨魚。"], "tag": "進階字彙"}, {"id": "whale-vocab-11", "mode": "vocab", "paragraph": "C", "sentence": "Nowhere is this more obvious than along the north-west coast of America, where killer whales are split into two distinct populations – 'residents' and 'transients'.", "target": "transients", "options": ["killer whales of the more mobile transient population", "permanent members of a single resident pod", "whales kept in temporary captivity"], "answer": 0, "explanations": ["transients 在此指過客型、移動型虎鯨族群。", "不是定居型鯨群成員。", "不是暫時圈養的鯨魚。"], "tag": "進階字彙"}, {"id": "whale-vocab-12", "mode": "vocab", "paragraph": "C", "sentence": "They live in the same stretch of water, but they don't mingle.", "target": "mingle", "options": ["mix or interact socially", "live in exactly the same place without any contact", "mate and produce offspring in every case"], "answer": 0, "explanations": ["mingle＝混在一起、交往。", "同海域不等於有互動。", "也不專指交配生育。"], "tag": "進階字彙"}, {"id": "whale-vocab-13", "mode": "vocab", "paragraph": "C", "sentence": "Residents live in stable groups, or 'pods', made up of two or three mothers and their offspring – perhaps 20 whales in all.", "target": "pods", "options": ["social groups of whales", "hard protective shells around young whales", "small stretches of shallow seawater"], "answer": 0, "explanations": ["pods 在此指鯨群社會群體。", "不是包覆幼鯨的殼。", "不是淺水區。"], "tag": "進階字彙"}, {"id": "whale-vocab-14", "mode": "vocab", "paragraph": "C", "sentence": "Residents live in stable groups, or 'pods', made up of two or three mothers and their offspring – perhaps 20 whales in all.", "target": "offspring", "options": ["an animal’s young or descendants", "older ancestors", "unrelated partners from another group"], "answer": 0, "explanations": ["offspring＝後代、子女。", "不是祖先。", "不是外群伴侶。"], "tag": "進階字彙"}, {"id": "whale-vocab-15", "mode": "vocab", "paragraph": "C", "sentence": "Calves stay with their mothers throughout adulthood, and in many years of observation no one has ever seen a whale switch pods.", "target": "Calves", "options": ["young whales", "the lower parts of the whales’ tails", "only young domestic cattle"], "answer": 0, "explanations": ["calf 在此為幼鯨；複數 calves。", "不是尾部。", "此字也可指小牛，但本句不是。"], "tag": "進階字彙"}, {"id": "whale-vocab-16", "mode": "vocab", "paragraph": "D", "sentence": "One of the most obvious distinctions between the transient and resident societies is the way they impart information.", "target": "impart information", "options": ["communicate or pass on information", "keep information inaccessible", "verify that information is genetically inherited"], "answer": 0, "explanations": ["impart information＝傳遞、告知資訊。", "不是封鎖資訊。", "不自帶基因遺傳的意思。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-17", "mode": "vocab", "paragraph": "D", "sentence": "Killer whales detect prey with a range of echo-locating clicks, but converse with a vocabulary of squeaks, whistles and whines.", "target": "prey", "options": ["animals hunted for food", "animals that do the hunting", "the habitat where animals rest"], "answer": 0, "explanations": ["prey＝獵物。", "獵食者是 predator。", "不是棲地。"], "tag": "進階字彙"}, {"id": "whale-vocab-18", "mode": "vocab", "paragraph": "D", "sentence": "Killer whales detect prey with a range of echo-locating clicks, but converse with a vocabulary of squeaks, whistles and whines.", "target": "echo-locating clicks", "options": ["click sounds used to locate objects from returning echoes", "sounds used only to entertain other whales", "clicks that cannot carry information about distance"], "answer": 0, "explanations": ["echo-locating 指回聲定位，用回傳聲波偵測物體。", "不是僅為娛樂。", "不是完全不能提供距離資訊。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-19", "mode": "vocab", "paragraph": "D", "sentence": "Killer whales detect prey with a range of echo-locating clicks, but converse with a vocabulary of squeaks, whistles and whines.", "target": "converse", "options": ["communicate with one another", "turn around in the water", "change a substance into another substance"], "answer": 0, "explanations": ["converse＝交談、交流。", "不是轉身。", "不是 convert 轉化。"], "tag": "進階字彙"}, {"id": "whale-vocab-20", "mode": "vocab", "paragraph": "D", "sentence": "Residents have a much more extensive repertoire, and each family group has its own unique and distinctive set of calls.", "target": "repertoire", "options": ["the complete range of calls available to a group", "the loudness of one particular call", "the number of whales in a family"], "answer": 0, "explanations": ["repertoire 在此指可使用的整套叫聲。", "不是單一聲音音量。", "不是族群數量。"], "tag": "進階字彙"}, {"id": "whale-vocab-21", "mode": "vocab", "paragraph": "D", "sentence": "Despite regular interaction between them, each resident pod sticks firmly to its own dialect.", "target": "dialect", "options": ["a distinctive form of communication used by a group", "a universal call identical in every whale group", "a defect in the hearing organs"], "answer": 0, "explanations": ["dialect 在此指群體特有的叫聲、方言。", "不是各群完全相同的通用叫聲。", "不是聽覺器官缺陷。"], "tag": "進階字彙"}, {"id": "whale-vocab-22", "mode": "vocab", "paragraph": "E", "sentence": "To qualify as part of killer whale culture, dialects must be learnt from other members of the pod.", "target": "qualify as", "options": ["meet the conditions to count as", "be excluded from the category of", "be able to teach professionally about"], "answer": 0, "explanations": ["qualify as culture＝符合被算作文化的條件。", "不是被排除。", "此處不是教師專業資格。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-23", "mode": "vocab", "paragraph": "E", "sentence": "Animals with different dialects share the same waters, so the variation can't be a product of physical environment. 'And we can throw out the notion that dialects are inherited,' says Lance Barrett-Lennard of the University of British Columbia.", "target": "throw out the notion", "options": ["reject an idea as an explanation", "physically discard a written object only", "accept an idea without reservation"], "answer": 0, "explanations": ["throw out a notion＝摒棄、排除某個觀念。", "不是僅指丟掉實體東西。", "不是全盤接受。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-24", "mode": "vocab", "paragraph": "E", "sentence": "His paternity tests reveal that female killer whales invariably attract mates from outside their own pod – males with a very different dialect.", "target": "paternity tests", "options": ["tests used to establish who the father is", "tests measuring a whale’s hearing sensitivity", "tests assessing whether a calf can learn a song"], "answer": 0, "explanations": ["paternity tests＝父系親子鑑定。", "不是聽力測試。", "不是歌曲學習測驗。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-25", "mode": "vocab", "paragraph": "E", "sentence": "His paternity tests reveal that female killer whales invariably attract mates from outside their own pod – males with a very different dialect.", "target": "invariably", "options": ["always or without variation in the reported pattern", "only in rare exceptions", "at unpredictable intervals"], "answer": 0, "explanations": ["invariably＝總是、一貫地；此處依研究者的敘述。", "不是少數例外。", "不是頻率不可預測。"], "tag": "進階字彙"}, {"id": "whale-vocab-26", "mode": "vocab", "paragraph": "E", "sentence": "If dialects were programmed by genetics, call patterns from both father and mother would be passed on to the calf. 'A calf uses the calls of its maternal pod very precisely.", "target": "maternal pod", "options": ["the social group associated with the calf’s mother", "the group associated only with the father", "a temporary group of unrelated males"], "answer": 0, "explanations": ["maternal＝母系的；maternal pod 指母親所屬鯨群。", "不是父系鯨群。", "不是不相關雄性暫時組群。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-27", "mode": "vocab", "paragraph": "F", "sentence": "It is, according to Frans de Waal of Emory University in Atlanta, who argues that culture is just another biological adaptation that has evolved in many creatures.", "target": "biological adaptation", "options": ["a feature or process shaped through evolution that supports functioning or survival", "a consciously planned change made by every individual", "a cultural practice that must exclude all biology"], "answer": 0, "explanations": ["biological adaptation＝生物適應，這是 de Waal 在本文的文化解釋。", "不是每個體有意識規劃的改變。", "文化可受生物條件支持，不必互斥。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-28", "mode": "vocab", "paragraph": "F", "sentence": "Whales have several biological attributes that give them an advantage in social learning.", "target": "attributes", "options": ["features or qualities", "commands given to other animals", "formal ownership rights"], "answer": 0, "explanations": ["attributes 作名詞＝特徵、特質。", "不是指令。", "不是所有權。"], "tag": "進階字彙"}, {"id": "whale-vocab-29", "mode": "vocab", "paragraph": "F", "sentence": "Apart from their advanced mental abilities, they are adept at recognising sounds: ideal for communicating in the marine environment.", "target": "adept at", "options": ["highly skilled at", "unable to improve at", "dependent on chance for"], "answer": 0, "explanations": ["adept at + V-ing＝善於、熟練於。", "不是無法進步。", "不是只靠運氣。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-30", "mode": "vocab", "paragraph": "F", "sentence": "Many species spend years rearing their offspring, and live in small, stable, multi-generational societies, a social system that provides ample opportunity for teaching and learning.", "target": "rearing their offspring", "options": ["raising and caring for their young", "hunting animals from other groups", "producing offspring without caring for them"], "answer": 0, "explanations": ["rear offspring＝撫育後代。", "不是捕獵外群動物。", "不只是生育後不照顧。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-31", "mode": "vocab", "paragraph": "F", "sentence": "Many species spend years rearing their offspring, and live in small, stable, multi-generational societies, a social system that provides ample opportunity for teaching and learning.", "target": "multi-generational societies", "options": ["social groups containing several generations", "groups that dissolve before offspring mature", "groups made up only of animals of the same age"], "answer": 0, "explanations": ["multi-generational＝多個世代共同生活的。", "不是必然幼年就解散。", "不是只由同齡構成。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-32", "mode": "vocab", "paragraph": "F", "sentence": "Many species spend years rearing their offspring, and live in small, stable, multi-generational societies, a social system that provides ample opportunity for teaching and learning.", "target": "ample opportunity", "options": ["more than sufficient opportunity", "one narrowly limited opportunity", "a guaranteed successful outcome"], "answer": 0, "explanations": ["ample＝充足的。", "不是極有限的一次機會。", "有機會不保證必然學會。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-33", "mode": "vocab", "paragraph": "G", "sentence": "Experts in whale biology believe that ecological factors and the need to adapt to sudden changes in the environment played a large part in the emergence of culture.", "target": "ecological factors", "options": ["conditions relating to organisms and their environment", "only the legal rules governing whale research", "individual preferences unrelated to surroundings"], "answer": 0, "explanations": ["ecological factors＝生態因素。", "不是研究法律。", "不是與環境無關的偏好。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-34", "mode": "vocab", "paragraph": "G", "sentence": "Experts in whale biology believe that ecological factors and the need to adapt to sudden changes in the environment played a large part in the emergence of culture.", "target": "emergence of culture", "options": ["the coming into existence of culture", "the deliberate concealment of culture", "the complete disappearance of culture"], "answer": 0, "explanations": ["emergence＝出現、形成。", "不是隱藏。", "不是消失。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-35", "mode": "vocab", "paragraph": "G", "sentence": "When that happens, the past experience of senior members of the group – and the ability to share this knowledge – is a huge asset.", "target": "a huge asset", "options": ["a very valuable advantage or resource", "a large financial debt", "a physical organ that must be unusually large"], "answer": 0, "explanations": ["asset 在此指有價值的優勢、資源。", "不是負債。", "不是必須體積大的器官。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-36", "mode": "vocab", "paragraph": "G", "sentence": "The dialects of killer whales allow members of the group to identify each other, enabling them to share information about food hot spots.", "target": "food hot spots", "options": ["places where food is particularly plentiful", "areas where food is cooked at high temperatures", "sites that are necessarily warmer than all others"], "answer": 0, "explanations": ["hot spot 在此指食物集中的地點。", "不是烹調區。", "不表示水溫一定最高。"], "tag": "搭配與語境義"}, {"id": "whale-vocab-37", "mode": "vocab", "paragraph": "G", "sentence": "Among resident killer whales, it also allows females to avoid inbreeding by picking out a mate with a strange dialect from outside their pod, says Barrett-Lennard.", "target": "inbreeding", "options": ["reproduction between closely related individuals", "learning behaviour from unrelated group members", "feeding only within a fixed habitat"], "answer": 0, "explanations": ["inbreeding＝近親繁殖。", "不是向外群學習。", "不是只在固定地點覓食。"], "tag": "進階字彙"}, {"id": "whale-vocab-38", "mode": "vocab", "paragraph": "H", "sentence": "Female killer whales, like humans, are very unusual in that they live up to a quarter of a century after they have had their descendants.", "target": "descendants", "options": ["later generations descended from an individual", "ancestors from earlier generations", "unrelated adults of the same age"], "answer": 0, "explanations": ["descendants＝後代。", "不是祖先。", "不是同齡但無親緣者。"], "tag": "進階字彙"}, {"id": "whale-vocab-39", "mode": "vocab", "paragraph": "H", "sentence": "And what whale matriarchs offer is the most important thing of all – cultural knowledge, vital for the group's survival, passed directly from one generation to the next.", "target": "matriarchs", "options": ["senior females with a central role in their social groups", "the oldest males in a group", "young females that have just left their mothers"], "answer": 0, "explanations": ["matriarchs＝母系群體中的年長雌性、女族長。", "不是年長雄性。", "不是剛離母的幼雌。"], "tag": "進階字彙"}, {"id": "whale-vocab-40", "mode": "vocab", "paragraph": "H", "sentence": "And what whale matriarchs offer is the most important thing of all – cultural knowledge, vital for the group's survival, passed directly from one generation to the next.", "target": "vital for", "options": ["essential to", "merely decorative for", "unrelated to the survival of"], "answer": 0, "explanations": ["vital for survival＝對生存至關重要。", "不是裝飾作用。", "不是與存活無關。"], "tag": "搭配與語境義"}, {"id": "whale-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Even such advanced cetacean mammals as whales and dolphins clearly don't have art, literature, or architecture.", "target": "", "options": ["The writer acknowledges that whales and dolphins lack familiar human cultural products even though they are advanced cetacean mammals.", "The sentence proves whales have no learned behaviour because they lack art.", "The writer says whales and dolphins are not mammals and therefore cannot learn."], "answer": 0, "explanations": ["Even 引出讓步；沒有藝術等不等於後文否定動物文化。", "把沒有特定人類產物跳成不可能有學習。", "原文明稱 cetacean mammals。"], "tag": "長難句理解", "structure": "主幹：mammals…don’t have…。such…as…舉出 whales and dolphins；Even 強化反差，不是否定牠們為哺乳動物。"}, {"id": "whale-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "But patient observation over many years has begun to reveal behaviours that can only be learnt from other whales.", "target": "", "options": ["Long-term observations have begun to reveal behaviours that, according to the passage, whales must learn from other whales.", "Brief experiments conclusively proved every whale behaviour is genetically inherited.", "The passage says observations have failed to reveal any socially learned behaviour."], "answer": 0, "explanations": ["保留多年觀察、has begun 及 only learnt from other whales 的範圍。", "方法、時間及行為來源全部被換掉。", "與 has begun to reveal 相反。"], "tag": "長難句理解", "structure": "主幹：observation has begun to reveal behaviours。that…修飾 behaviours；can only be learnt 限定這些被討論的行為，不是所有行為。"}, {"id": "whale-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "So far, humpback and killer whales provide the best evidence of culture in cetaceans, and the song of the male humpback is among the most striking examples.", "target": "", "options": ["The passage presents humpback and killer whales as the strongest evidence available so far, with male humpback song as a particularly striking example.", "Only those two species can ever have culture, and this has been conclusively proved.", "Every cetacean produces exactly the same male song."], "answer": 0, "explanations": ["So far、best evidence、among 限定目前證據及例子程度。", "最佳現有證據不等於排除其他物種。", "句子沒有全部同歌的內容。"], "tag": "長難句理解", "structure": "主幹為兩個 and 並列分句；So far 限定目前；among the most striking 把歌聲列為例子之一。"}, {"id": "whale-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Humpback populations in different oceans sing different songs, but within the same ocean they all stick to the same one.", "target": "", "options": ["Songs vary between oceans, while humpbacks within a given ocean use the same song.", "Every humpback population worldwide uses the same song regardless of ocean.", "Whales within one ocean always sing different songs from one another."], "answer": 0, "explanations": ["保留 between oceans 與 within the same ocean 的對比。", "把同一海洋擴成全世界。", "把同一海洋內的一致性反轉。"], "tag": "長難句理解", "structure": "主幹：populations sing different songs, but…they stick to the same one。they 指同一海洋的群體；one 代替 song。"}, {"id": "whale-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "However, during the breeding season the sounds change, as it appears that females are drawn to novel songs.", "target": "", "options": ["Songs change in the breeding season, apparently because females are attracted to new songs.", "Female attraction to new songs is presented as an absolutely proven cause applying in every season.", "Songs never change because females reject unfamiliar sounds."], "answer": 0, "explanations": ["as 表原因；it appears 保留觀察推測，during 限定時期。", "刪掉 appears，並抹掉 breeding season。", "兩項內容均與原文相反。"], "tag": "長難句理解", "structure": "主幹：sounds change。during…限定時間；as it appears that…提出帶保留的原因；drawn to＝受吸引。"}, {"id": "whale-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "Soon all the other males have altered their own rendition to incorporate the changes until they are once again singing the same song.", "target": "", "options": ["Other males modify their own performances to include the innovations, eventually restoring a shared song.", "Each male keeps a completely unchanged personal song even after other whales innovate.", "All males abandon singing permanently once one new sound appears."], "answer": 0, "explanations": ["own rendition 不表示永遠獨立；incorporate…until 說明調整後再趨一致。", "忽略 altered、incorporate 及 same song。", "沒有永久停止的內容。"], "tag": "長難句理解", "structure": "主幹：all the other males have altered their rendition。to incorporate 表目的；until…標記再次一致的結果界線。"}, {"id": "whale-paraphrase-7", "mode": "paraphrase", "paragraph": "B", "sentence": "Since this occurs among thousands of whales spread across a vast part of the planet, the change cannot be in response to any factor in the animal's environment.", "target": "", "options": ["The writer reasons that the geographically widespread song change cannot be explained by an environmental factor shared in the way required.", "The writer states that a single local environmental change was directly observed causing all whales to change song.", "The sentence says the change occurs in only a few whales in a small bay."], "answer": 0,
