tion of spelling errors"], "answer": 0, "explanations": ["此處 Pattern recognition 表示「模式辨識」。須依原句語境理解。", "這個選項表示「只依名聲判斷」；原句要表達的是「模式辨識」。", "這個選項表示「手動更正拼字錯誤」；原句要表達的是「模式辨識」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-47", "mode": "vocab", "paragraph": "E", "sentence": "Stylometry has come up with little to encourage those experts who insist Shakespeare was simply too uneducated to create works of enduring brilliance.", "target": "come up with", "options": ["produced or discovered", "physically caught up with", "withdrawn support from"], "answer": 0, "explanations": ["此處 come up with 表示「提出、找到」。須依原句語境理解。", "這個選項表示「實際追上」；原句要表達的是「提出、找到」。", "這個選項表示「撤回對……的支持」；原句要表達的是「提出、找到」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-48", "mode": "vocab", "paragraph": "E", "sentence": "Stylometry has come up with little to encourage those experts who insist Shakespeare was simply too uneducated to create works of enduring brilliance.", "target": "enduring brilliance", "options": ["outstanding quality that lasts over time", "a brief period of celebrity", "a brightly illuminated stage"], "answer": 0, "explanations": ["此處 enduring brilliance 表示「持久不衰的卓越才華或品質」。須依原句語境理解。", "這個選項表示「短暫的成名期」；原句要表達的是「持久不衰的卓越才華或品質」。", "這個選項表示「燈光明亮的舞台」；原句要表達的是「持久不衰的卓越才華或品質」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-49", "mode": "vocab", "paragraph": "E", "sentence": "Elliott and Valenza applied a battery of 51 tests to computerised texts and found that none of the claimants had a stylometric ‘fingerprint’ similar to that of Shakespeare.", "target": "a battery of", "options": ["a large organised set of", "a single source of electrical power", "a random handful of"], "answer": 0, "explanations": ["此處 a battery of 表示「一整套、一系列的」。須依原句語境理解。", "這個選項表示「單一電源」；原句要表達的是「一整套、一系列的」。", "這個選項表示「隨手取的少數幾個」；原句要表達的是「一整套、一系列的」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-50", "mode": "vocab", "paragraph": "E", "sentence": "Elliott and Valenza applied a battery of 51 tests to computerised texts and found that none of the claimants had a stylometric ‘fingerprint’ similar to that of Shakespeare.", "target": "claimants", "options": ["people put forward as possible authors", "people buying theatre tickets", "people who have verified every result"], "answer": 0, "explanations": ["此處 claimants 表示「被提出作為作者的人選」。須依原句語境理解。", "這個選項表示「購買劇票的人」；原句要表達的是「被提出作為作者的人選」。", "這個選項表示「已驗證所有結果的人」；原句要表達的是「被提出作為作者的人選」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-51", "mode": "vocab", "paragraph": "E", "sentence": "“I think these claims were driven initially by a sense that Shakespeare is too ‘important’ to be an ordinary person,” says Professor Kate McCluskey, director of the Shakespeare Institute at the University of Birmingham.", "target": "driven initially by", "options": ["motivated at the beginning by", "transported at first by", "proved conclusively by"], "answer": 0, "explanations": ["此處 driven initially by 表示「最初受到……驅動」。須依原句語境理解。", "這個選項表示「最初由……載運」；原句要表達的是「最初受到……驅動」。", "這個選項表示「由……確證」；原句要表達的是「最初受到……驅動」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-52", "mode": "vocab", "paragraph": "F", "sentence": "Some of the earliest plays, notably Henry VI and the notoriously violent Titus Andronicus, seem to be a combination of Shakespeare and his brilliant contemporary the playwright Christopher Marlowe, who was born in the same year as Shakespeare.", "target": "notably", "options": ["especially or in particular", "without any evidence", "only very rarely"], "answer": 0, "explanations": ["此處 notably 表示「尤其、特別是」。須依原句語境理解。", "這個選項表示「沒有任何證據地」；原句要表達的是「尤其、特別是」。", "這個選項表示「僅極少數時候」；原句要表達的是「尤其、特別是」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-53", "mode": "vocab", "paragraph": "F", "sentence": "Some of the earliest plays, notably Henry VI and the notoriously violent Titus Andronicus, seem to be a combination of Shakespeare and his brilliant contemporary the playwright Christopher Marlowe, who was born in the same year as Shakespeare.", "target": "notoriously", "options": ["in a way widely known for something bad", "secretly and without attention", "with universal admiration"], "answer": 0, "explanations": ["此處 notoriously 表示「惡名昭彰地、以負面特徵聞名地」。須依原句語境理解。", "這個選項表示「秘密且不受注意地」；原句要表達的是「惡名昭彰地、以負面特徵聞名地」。", "這個選項表示「受到普遍景仰地」；原句要表達的是「惡名昭彰地、以負面特徵聞名地」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-54", "mode": "vocab", "paragraph": "F", "sentence": "Some of the earliest plays, notably Henry VI and the notoriously violent Titus Andronicus, seem to be a combination of Shakespeare and his brilliant contemporary the playwright Christopher Marlowe, who was born in the same year as Shakespeare.", "target": "playwright", "options": ["a person who writes plays", "an actor performing on stage", "a person building theatre equipment"], "answer": 0, "explanations": ["此處 playwright 表示「劇作家」。須依原句語境理解。", "這個選項表示「舞台演員」；原句要表達的是「劇作家」。", "這個選項表示「製造劇院設備的人」；原句要表達的是「劇作家」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-55", "mode": "vocab", "paragraph": "F", "sentence": "He explains that, provisionally at least, stylometric studies suggest some of Marlowe's actual text exists within the early plays of Shakespeare.", "target": "provisionally", "options": ["tentatively and subject to revision", "finally and beyond revision", "without consulting the text"], "answer": 0, "explanations": ["此處 provisionally 表示「暫時地、尚待修正確認地」。須依原句語境理解。", "這個選項表示「最終且不可修正地」；原句要表達的是「暫時地、尚待修正確認地」。", "這個選項表示「未查閱文本地」；原句要表達的是「暫時地、尚待修正確認地」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-56", "mode": "vocab", "paragraph": "G", "sentence": "Some scholars remain cautious about basing new views of Shakespeare’s career on stylometric analysis of centuries-old texts.", "target": "cautious about", "options": ["careful not to make an unwarranted judgement about", "completely certain about", "uninterested in learning about"], "answer": 0, "explanations": ["此處 cautious about 表示「對……持審慎態度」。須依原句語境理解。", "這個選項表示「對……完全確定」；原句要表達的是「對……持審慎態度」。", "這個選項表示「無意了解」；原句要表達的是「對……持審慎態度」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-57", "mode": "vocab", "paragraph": "G", "sentence": "“If they have been edited, amended or shortened, then the data from them is highly compromised,” says Dr Markus Dahl of London University.", "target": "amended", "options": ["changed or corrected", "authenticated as original", "translated into speech"], "answer": 0, "explanations": ["此處 amended 表示「修訂、更改」。須依原句語境理解。", "這個選項表示「驗證為原件」；原句要表達的是「修訂、更改」。", "這個選項表示「轉換成口語」；原句要表達的是「修訂、更改」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-58", "mode": "vocab", "paragraph": "G", "sentence": "“If they have been edited, amended or shortened, then the data from them is highly compromised,” says Dr Markus Dahl of London University.", "target": "compromised", "options": ["made less reliable or valid", "resolved through mutual agreement", "made completely secure"], "answer": 0, "explanations": ["此處 compromised 表示「可靠性或有效性受到損害」。須依原句語境理解。", "這個選項表示「透過雙方讓步達成協議」；原句要表達的是「可靠性或有效性受到損害」。", "這個選項表示「變得完全安全」；原句要表達的是「可靠性或有效性受到損害」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-59", "mode": "vocab", "paragraph": "G", "sentence": "Even so, the results to date are in line with the growing view of Shakespeare as a hardworking professional who perfected his skills throughout his career.", "target": "to date", "options": ["up to the present point", "on one previously fixed date", "at some unknown future time"], "answer": 0, "explanations": ["此處 to date 表示「迄今為止」。須依原句語境理解。", "這個選項表示「在某個預定日期」；原句要表達的是「迄今為止」。", "這個選項表示「在未來不明的時間」；原句要表達的是「迄今為止」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-60", "mode": "vocab", "paragraph": "G", "sentence": "Even so, the results to date are in line with the growing view of Shakespeare as a hardworking professional who perfected his skills throughout his career.", "target": "in line with", "options": ["consistent with", "standing physically behind", "directly opposed to"], "answer": 0, "explanations": ["此處 in line with 表示「與……一致、相符」。須依原句語境理解。", "這個選項表示「實際排在……後方」；原句要表達的是「與……一致、相符」。", "這個選項表示「與……直接對立」；原句要表達的是「與……一致、相符」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-61", "mode": "vocab", "paragraph": "G", "sentence": "Even so, the results to date are in line with the growing view of Shakespeare as a hardworking professional who perfected his skills throughout his career.", "target": "perfected", "options": ["developed to a very high standard", "possessed without practice from birth", "replaced with a completely new activity"], "answer": 0, "explanations": ["此處 perfected 表示「使臻完善、磨練至高水準」。須依原句語境理解。", "這個選項表示「天生具備且不需練習」；原句要表達的是「使臻完善、磨練至高水準」。", "這個選項表示「改以全新的活動取代」；原句要表達的是「使臻完善、磨練至高水準」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-62", "mode": "vocab", "paragraph": "A", "sentence": "This analysis of features of literary style is known as 'stylometry' and with it researchers can recognise the work of Shakespeare and his contemporaries with impressive reliability.", "target": "analysis", "options": ["systematic examination of something's parts or features", "an unsupported personal guess", "the physical publication of a book"], "answer": 0, "explanations": ["此處 analysis 表示「分析」。須依原句語境理解。", "這個選項表示「沒有根據的個人猜測」；原句要表達的是「分析」。", "這個選項表示「書籍的實際出版」；原句要表達的是「分析」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-63", "mode": "vocab", "paragraph": "C", "sentence": "Recognising the need to include large samples of writing from both authors, Mendenhall lumped all their works together, despite the fact that literary style can vary enormously between plays, poetry and philosophy, for example.", "target": "enormously", "options": ["to a very great degree", "only to a negligible degree", "in a precisely measured identical way"], "answer": 0, "explanations": ["此處 enormously 表示「極大程度地」。須依原句語境理解。", "這個選項表示「僅在微不足道的程度上」；原句要表達的是「極大程度地」。", "這個選項表示「以精確測量且相同的方式」；原句要表達的是「極大程度地」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-64", "mode": "vocab", "paragraph": "E", "sentence": "In 1996, literary scholar Ward Elliott and mathematician Robert Valenza of Claremont McKenna College, California, published the results of a stylometric comparison of the works of Shakespeare with those of over 30 of the proposed 'real' authors.", "target": "literary scholar", "options": ["an academic specialist studying literature", "a skilled stage performer", "an official issuing publication permits"], "answer": 0, "explanations": ["此處 literary scholar 表示「研究文學的學者」。須依原句語境理解。", "這個選項表示「技藝純熟的舞台演員」；原句要表達的是「研究文學的學者」。", "這個選項表示「核發出版許可的官員」；原句要表達的是「研究文學的學者」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Even today, almost 400 years after his death, the works of the famous English dramatist William Shakespeare have lost none of their appeal, nor have questions about the source of his genius.", "target": "", "options": ["Both Shakespeare's works and questions about the source of his talent remain of interest.", "His works remain popular, but questions about his talent have disappeared.", "Neither his works nor the source of his talent interests anyone now."], "answer": 0, "explanations": ["nor have questions 延續 lost none of their appeal，表示兩者的吸引力都沒有消失。", "誤把 nor 理解成對問題關注消失，否定方向讀錯。", "lost none 是沒有失去，而非已經全失去。"], "tag": "長難句理解", "structure": "the works...have lost none... 是第一主句；nor 放句首使 have questions 倒裝；第二分句省略 lost their appeal；almost 400 years... 是時間背景。"}, {"id": "shakespeare-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "For some, the answer is obvious: Shakespeare was a genius whose gift is no more suspicious than that of the physicist Albert Einstein, the German salesman's son who devised the theory of relativity.", "target": "", "options": ["Supporters see no greater reason to doubt Shakespeare's talent than to doubt Einstein's.", "Supporters regard both men's talent as equally fraudulent.", "Supporters find Shakespeare's talent more suspicious than Einstein's."], "answer": 0, "explanations": ["no more...than 在此用公認的愛因斯坦天賦作比較，反對懷疑莎士比亞。", "句子沒有認定兩者都造假，不能僅看到 suspicious 就認為在指控。", "no more 排除更可疑，並非說更可疑。"], "tag": "長難句理解", "structure": "whose gift 修飾 genius；no more suspicious than that of... 中 that 代指 gift；who devised... 修飾 Einstein；salesman's son 是對 Einstein 的同位補充。"}, {"id": "shakespeare-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "They believe that Shakespeare was a pseudonym for someone with far more impressive qualifications who wrote the plays that still play to packed theatres today.", "target": "", "options": ["Those doubting Shakespeare's authorship think the name concealed a better-qualified writer whose plays still attract full houses.", "Researchers have conclusively proved that Shakespeare was a false name used by an identified writer.", "The doubters believe the plays no longer attract theatre audiences."], "answer": 0, "explanations": ["They believe 限定為質疑者的信念，並非本文確證；who 指被假設的另一位作者。", "把某群人的推測升格為研究已證實，且加入已辨識的作者。", "still play to packed theatres 表示至今滿座，非失去觀眾。"], "tag": "長難句理解", "structure": "They believe 後接 that 受詞子句；someone with... 為 pseudonym 所代指的人；who wrote... 修飾 someone；that still play... 修飾 plays；兩層關係子句需分開。"}, {"id": "shakespeare-paraphrase-4", "mode": "paraphrase", "paragraph": "A", "sentence": "But after long and largely fruitless debate, researchers are now turning to scientific methods to resolve the controversies surrounding Shakespeare.", "target": "", "options": ["After prolonged debate with few useful results, researchers have begun using scientific methods to address the disputes.", "Scientific methods were abandoned because they had already settled every dispute.", "The debate produced clear agreement before any scientific methods were considered."], "answer": 0, "explanations": ["after...fruitless debate 說明轉向科學方法的背景，不是研究方法已被放棄。", "把 are now turning to 讀成停止使用，且加入爭議全解決。", "fruitless 不支持已達明確共識。"], "tag": "長難句理解", "structure": "But 表示研究方式的轉向；after... 是時間背景；researchers are now turning to... 為主幹；to resolve... 表目的，不能當成已完成的結果。"}, {"id": "shakespeare-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "The idea of using these basic scientific techniques to probe questions of authorship dates back to 1851, when the Victorian mathematician Augustus de Morgan suggested that different authors might be identified through the frequency with which they used words of different lengths.", "target": "", "options": ["De Morgan proposed in 1851 that differences in word-length frequency might help identify authors.", "De Morgan proved that every author uses words of one fixed length.", "The proposal was that authors could be identified only by the physical size of their books."], "answer": 0, "explanations": ["might 表可行性；the frequency with which... 指不同長度詞的使用頻率。", "might 並非證明；words of different lengths 也非固定一種長度。", "word length 不是書本的實體大小，且未聲稱只能如此辨識。"], "tag": "長難句理解", "structure": "The idea...dates back to 1851 為主幹；when 引導年代的補充關係子句；suggested that... 嵌入提議；through the frequency with which... 中 which 回指 frequency。"}, {"id": "shakespeare-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "Bacon's possible motivation for not wanting to be known as the author of such masterpieces is far from clear, but Mendenhall believed his methods might at least reveal telltale signs of Bacon's hand in the plays.", "target": "", "options": ["Why Bacon would have wanted to hide authorship is unclear, but Mendenhall hoped his methods could reveal evidence of involvement.", "Bacon's wish to hide his authorship was conclusively explained by Mendenhall's results.", "Mendenhall was certain that his methods would prove Bacon wrote every play."], "answer": 0, "explanations": ["far from clear 表動機不清；might at least reveal 表有限而不確定的研究期待。", "將不清楚的動機說成已獲確證的解釋。", "believed、might、at least 都有限定，不能改成確定證明所有作品。"], "tag": "長難句理解", "structure": "Bacon's possible motivation...is far from clear 是第一主句；for not wanting... 補充 motivation；but 後為 Mendenhall believed...；his methods might reveal 是受詞子句。"}, {"id": "shakespeare-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "However, his results, published in 1901, revealed Bacon's writing style to be quite unlike that of Shakespeare.", "target": "", "options": ["Mendenhall's published findings indicated that Bacon's writing style differed from Shakespeare's.", "Mendenhall's results showed that Bacon and Shakespeare used identical writing styles.", "The sentence states that Bacon published Shakespeare's plays in 1901."], "answer": 0, "explanations": ["revealed...to be quite unlike 指揭示兩種風格不同；1901 是研究結果出版年。", "把 quite unlike 改成相同，否定方向顛倒。", "published 修飾 results，不是說培根於該年出版戲劇。"], "tag": "長難句理解", "structure": "his results 是主詞；published in 1901 為被動分詞補充；revealed 後接 Bacon's writing style 作受詞、to be quite unlike... 作補語；that 代指 writing style。"}, {"id": "shakespeare-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "Recognising the need to include large samples of writing from both authors, Mendenhall lumped all their works together, despite the fact that literary style can vary enormously between plays, poetry and philosophy, for example.", "target": "", "options": ["Although literary style differs by genre, Mendenhall combined all works because he recognised a need for large samples.", "Mendenhall separated every genre to eliminate the effect of stylistic differences.", "Mendenhall combined the works because literary style never varies between genres."], "answer": 0, "explanations": ["Recognising... 解釋合併動機；despite the fact... 說明方法忽略文類差異。", "原句是 lumped together，不是分開處理。", "despite 指即使存在差異仍合併，不能把差異否認掉。"], "tag": "長難句理解", "structure": "Recognising the need... 是主詞 Mendenhall 的分詞片語；主句 lumped...together；despite the fact that... 為讓步結構；between plays, poetry and philosophy 列舉文類。"}, {"id": "shakespeare-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "His focus on word length as the sole ‘fingerprint’ of writing style was also questionable - for how could he be sure that some other characteristics would not give different results?", "target": "", "options": ["Relying only on word length was questionable because other characteristics might produce different results.", "Word length was confirmed as the only characteristic capable of identifying a writer.", "Other characteristics had already been tested and produced exactly the same results."], "answer": 0, "explanations": ["反問 how could he be sure 提出方法限制，沒有說其他特徵已全部測試。", "把作者質疑的唯一指標說成已確認可靠的唯一指標。", "would not give different results 是未能排除的可能性，不是已完成的實驗結論。"], "tag": "長難句理解", "structure": "His focus...was questionable 為主句；on word length... 補充 focus；for 引出原因；how could he be sure 後接 that 子句；some other characteristics 是 give 的主詞。"}, {"id": "shakespeare-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "But Mendenhall’s biggest fault was perhaps simply that he was too far ahead of his time - he was attempting a task that cried out for the kind of computers not even conceivable over 100 years ago.", "target": "", "options": ["The task needed computational tools that were beyond what people could even imagine in Mendenhall's era.", "Mendenhall failed because he refused to use computers that were readily available to him.", "Mendenhall's methods were too old-fashioned for the computers already in widespread use."], "answer": 0, "explanations": ["ahead of his time 與 not even conceivable 都指出當時缺少足夠先進的工具。", "原句沒有現成電腦可拒用。", "是構想超前，不是方法落伍於普及的電腦。"], "tag": "長難句理解", "structure": "that he was too far ahead... 為 was 後的表語子句；破折號後補充原因；a task that cried out for... 中 that 修飾 task；not even conceivable 修飾 computers。"}, {"id": "shakespeare-paraphrase-11", "mode": "paraphrase", "paragraph": "C", "sentence": "More recently, with their development, scholars have been able to look for subtle peculiarities among the complete works of authors, which, in Shakespeare's case, amount to over 800,000 words.", "target": "", "options": ["With computers, scholars can search for subtle patterns across complete bodies of writing, including over 800,000 words for Shakespeare.", "Computers allow researchers to reduce Shakespeare's entire output to exactly 800,000 words.", "The number 800,000 refers to the total number of authors compared."], "answer": 0, "explanations": ["which...amount to... 修飾 complete works，800,000 計算的是字數，且 over 為超過。", "amount to 不是刪減，over 也不是恰好。", "words 明確表示字數，不是作者人數。"], "tag": "長難句理解", "structure": "with their development 中 their 回指 computers；scholars have been able to... 是主幹；which 為非限定關係代名詞；in Shakespeare's case 插入限定個案；over 修飾總數。"}, {"id": "shakespeare-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "Traditional methods of investigating such questions have relied on traits like the use of metaphor, but these may be shared by different authors simply on cultural grounds.", "target": "", "options": ["Shared cultural influences can explain similarities such as metaphors, so those similarities need not establish a common author.", "Whenever two texts share a metaphor, they must have been written by the same person.", "Cultural influences make it impossible for different authors to share any stylistic traits."], "answer": 0, "explanations": ["may be shared...on cultural grounds 提出另一成因，避免由相似風格直接推定同一作者。", "把可能共同文化來源忽略，誤將相似性視為同一作者的充分證明。", "原句正說不同作者可能共享特徵，並非不可能。"], "tag": "長難句理解", "structure": "Traditional methods...have relied on traits 是主幹；like the use of metaphor 舉例；but 後提出限制；these 回指 traits；may be shared 是被動且帶可能性。"}, {"id": "shakespeare-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "In contrast, modern stylometry focuses on far more fundamental characteristics which are less likely to be shared by others.", "target": "", "options": ["Modern stylometry looks for more basic features that different authors are less likely to share.", "Modern stylometry relies on features that no two authors could ever share.", "Modern stylometry deliberately selects the most culturally widespread similarities."], "answer": 0, "explanations": ["less likely 是機率較低，不是絕不會共享；far more 修飾 fundamental。", "把比較性的較低機率升格為零可能性。", "將方法要避開的普遍共享特徵改成刻意選取的目標。"], "tag": "長難句理解", "structure": "In contrast 連接與傳統方法的比較；focuses on 為謂語；far more fundamental characteristics 為受詞；which... 修飾 characteristics；less likely to be shared 為帶比較程度的被動不定詞。"}, {"id": "shakespeare-paraphrase-14", "mode": "paraphrase", "paragraph": "D", "sentence": "The text-crunching power of computers allows researchers to pinpoint phrases, words or even individual letters by their frequency in the work of different authors.", "target": "", "options": ["Computers can identify precise textual elements by analysing how frequently each appears in different authors' work.", "Computers identify authors by measuring how loudly each letter is pronounced.", "The method ignores individual words and letters and considers only whole-book titles."], "answer": 0, "explanations": ["by their frequency 說明分析依據；phrases、words、letters 是層次不同的分析單位。", "頻率是出現次數，不是朗讀音量。", "原句 explicitly 包含字詞與字母，並非只看書名。"], "tag": "長難句理解", "structure": "The text-crunching power... 是主詞；allows researchers to pinpoint 為 allow+受詞+to不定詞；phrases, words or even individual letters 是受詞；by their frequency 表依據。"}, {"id": "shakespeare-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "Stylometry has come up with little to encourage those experts who insist Shakespeare was simply too uneducated to create works of enduring brilliance.", "target": "", "options": ["Stylometry has provided little support for experts who think Shakespeare lacked the education needed to create such works.", "Stylometry has strongly supported the claim that Shakespeare was too uneducated to write the works.", "The sentence says there are no experts who question Shakespeare's education."], "answer": 0, "explanations": ["little to encourage 是支持很少，who 子句限定仍持懷疑態度的專家。", "把 little support 反轉成 strong support。", "句子明確談到持此看法的專家，不能讀成不存在。"], "tag": "長難句理解", "structure": "Stylometry has come up with little 為主幹；to encourage... 修飾 little；who insist... 修飾 experts；too uneducated to create... 表過於缺乏教育而不能創作，是專家主張。"}, {"id": "shakespeare-paraphrase-16", "mode": "paraphrase", "paragraph": "E", "sentence": "Elliott and Valenza applied a battery of 51 tests to computerised texts and found that none of the claimants had a stylometric ‘fingerprint’ similar to that of Shakespeare.", "target": "", "options": ["A series of 51 tests found no matching stylometric fingerprint among the proposed alternative authors examined.", "The tests found that all proposed authors shared Shakespeare's fingerprint.", "The tests established that Shakespeare had never collaborated with anyone."], "answer": 0, "explanations": ["none of the claimants 限定在受測人選中沒有相符者，不等於排除一切可能合作。", "none 不能讀成 all，匹配結果完全顛倒。", "研究比較替代作者，這句沒有排除所有合作。"], "tag": "長難句理解", "structure": "Elliott and Valenza applied...and found... 為兩個並列謂語；that 子句說結果；none of... 表全否定；similar to that of... 中 that 回指 fingerprint。"}, {"id": "shakespeare-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "Some of the earliest plays, notably Henry VI and the notoriously violent Titus Andronicus, seem to be a combination of Shakespeare and his brilliant contemporary the playwright Christopher Marlowe, who was born in the same year as Shakespeare.", "target": "", "options": ["Some early plays appear to contain contributions from both Shakespeare and Marlowe.", "All of Shakespeare's plays have been proved to be written entirely by Marlowe.", "The research conclusively establishes that Marlowe contributed nothing to any early play."], "answer": 0, "explanations": ["Some、seem to、combination 都必須保留：部分作品、似乎、共同成分。", "把部分擴為全部、似乎改為證明、合寫改為全由一人。", "把可能存在的共同貢獻誤改成確定完全沒有。"], "tag": "長難句理解", "structure": "Some of the earliest plays 是主詞；notably... 插入例子；seem to be a combination... 是主幹；the playwright... 同位說明 Marlowe；who was born... 補充他的出生背景。"}, {"id": "shakespeare-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "He explains that, provisionally at least, stylometric studies suggest some of Marlowe's actual text exists within the early plays of Shakespeare.", "target": "", "options": ["The studies tentatively suggest that actual passages by Marlowe occur in Shakespeare's early plays, rather than merely showing influence.", "The studies finally prove that every early play was written only by Shakespeare.", "The studies say only that Marlowe influenced Shakespeare, explicitly ruling out any shared text."], "answer": 0, "explanations": ["provisionally at least 表暫定；actual text 比一般 influence 更具體，但仍未成為確證。", "將暫定推論改成最終證明，且作者歸屬也被改變。", "句子正區分一般影響與實際文本可能存在，並非排除共用文本。"], "tag": "長難句理解", "structure": "He explains that... 為主幹；provisionally at least 為限定插入語；stylometric studies suggest 後再嵌入 some...text exists...；多層報告動詞不可省略其不確定性。"}, {"id": "shakespeare-paraphrase-19", "mode": "paraphrase", "paragraph": "G", "sentence": "“If they have been edited, amended or shortened, then the data from them is highly compromised,” says Dr Markus Dahl of London University.", "target": "", "options": ["Editing or shortening old texts could weaken the reliability of data used in stylometric analysis.", "Every historical text is known to have been edited, so all stylometric evidence is worthless.", "Editing old texts necessarily improves the validity of all data derived from them."], "answer": 0, "explanations": ["If 引出條件；compromised 指可靠性受損，不等於已證明所有文本失效。", "把有條件的風險擴大為所有文本均已編修且毫無價值。", "受損與改善相反，原句並未稱編修有助研究有效性。"], "tag": "長難句理解", "structure": "If they have been edited... 是條件子句，they 指 centuries-old texts；edited、amended、shortened 平行被動；then 主句的 the data from them 才是 compromised 的對象。"}, {"id": "shakespeare-paraphrase-20", "mode": "paraphrase", "paragraph": "G", "sentence": "Even so, the results to date are in line with the growing view of Shakespeare as a hardworking professional who perfected his skills throughout his career.", "target": "", "options": ["Despite these reservations, findings so far fit the view that Shakespeare developed his skills through sustained professional work.", "The reservations prove that Shakespeare's skills never improved.", "The findings conclusively prove that every doubt about authorship has been resolved."], "answer": 0, "explanations": ["Even so 讓步；in line with 只是與觀點一致，to date 也保留目前範圍。", "原句支持技能在職涯中磨練的觀點，非技能不曾進步。", "一致不等於確證所有作者爭議，沒有總結為所有疑慮已解。"], "tag": "長難句理解", "structure": "Even so 承接前述保留；the results to date are in line with... 為主幹；view of Shakespeare as... 表看待方式；who perfected... 修飾 professional；throughout 限定整個職涯。"}, {"id": "shakespeare-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "Uncertainty why an author would wish to remain anonymous.", "target": "anonymous", "options": ["匿名的、不公開姓名的", "不識字的", "名聲顯赫的"], "answer": 0, "explanations": ["anonymous 指未公開身分或姓名。此處練習題目用語，不表示整句符合原文。", "不識字是 illiterate", "名聲顯赫不是匿名"], "tag": "題目字彙", "source": "Question 14 · 題目用語"}, {"id": "shakespeare-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "The reasons why a particular researcher's approach proved unsatisfactory.", "target": "proved unsatisfactory", "options": ["結果顯示不令人滿意", "在開始前便遭禁止", "已獲證明完全正確"], "answer": 0, "explanations": ["prove+形容詞表示結果顯示為某種狀態。此處練習題目用語，不表示整句符合原文。", "沒有表達事前禁止", "unsatisfactory 是不滿意，非完全正確"], "tag": "題目字彙", "source": "Question 16 · 題目用語"}, {"id": "shakespeare-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Mention of the time when the use of stylometry was first proposed.", "target": "proposed", "options": ["被提出、被提議", "已經徹底證實", "被法律禁止"], "answer": 0, "explanations": ["propose 是提出方法或主張，尚不等於證實。此處練習題目用語，不表示整句符合原文。", "提出不代表完成證明", "propose 不表示禁止"], "tag": "題目字彙", "source": "Question 17 · 題目用語"}, {"id": "shakespeare-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "A similarity between Shakespeare and a scientist with exceptional ability.", "target": "exceptional", "options": ["格外優秀、非凡的", "僅達最低標準的", "完全沒有能力的"], "answer": 0, "explanations": ["exceptional ability 指超出一般水準的能力。此處練習題目用語，不表示整句符合原文。", "最低標準不等於非凡", "exceptional 不是沒有能力"], "tag": "題目字彙", "source": "Question 19 · 題目用語"}, {"id": "shakespeare-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "To investigate this issue, literary experts traditionally looked at stylistic features such as the writer's choice of metaphor.", "target": "stylistic features", "options": ["文體或表達風格的特徵", "書籍的售價", "演出的場地規模"], "answer": 0, "explanations": ["stylistic 指語言表達方式與文風。此處練習題目用語，不表示整句符合原文。", "售價屬財務資訊，不是文體", "場地大小不是語言特徵"], "tag": "題目字彙", "source": "Question 20–22 · 題目用語"}, {"id": "shakespeare-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "To investigate this issue, literary experts traditionally looked at stylistic features such as the writer's choice of metaphor.", "target": "metaphor", "options": ["隱喻", "逐字引文", "作品目錄"], "answer": 0, "explanations": ["metaphor 透過另一事物描述某物。此處練習題目用語，不表示整句符合原文。", "引文是 quotation，與隱喻不同", "目錄不是比喻手法"], "tag": "題目字彙", "source": "Question 20–22 · 題目用語"}, {"id": "shakespeare-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "It was recognised that this choice may have been influenced by cultural factors.", "target": "cultural factors", "options": ["文化上的影響因素", "紙張的物理尺寸", "作者的出生證明"], "answer": 0, "explanations": ["cultural factors 指共享文化等影響，不是物件規格。此處練習題目用語，不表示整句符合原文。", "紙張尺寸不是文化因素本身", "出生證明是文件，不是此處的因素"], "tag": "題目字彙", "source": "Question 20–22 · 題目用語"}, {"id": "shakespeare-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "By using stylometric analysis of particular characteristics and pattern recognition systems, a so-called fingerprint of a writer can be identified.", "target": "pattern recognition systems", "options": ["辨認資料中規律模式的系統", "只檢查手指紋路的儀器", "安排劇場座位的系統"], "answer": 0, "explanations": ["此處辨識的是文字資料模式，fingerprint 為比喻。此處練習題目用語，不表示整句符合原文。", "並非實體指紋檢測", "與劇場座位配置無關"], "tag": "題目字彙", "source": "Question 20–22 · 題目用語"}, {"id": "shakespeare-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "People search for a more distinguished author because they cannot accept that a normal individual could write such brilliant plays.", "target": "distinguished", "options": ["成就卓著、受尊敬的", "刻意匿名的", "未受訓練的"], "answer": 0, "explanations": ["distinguished author 指聲望與成就較高的作者。此處練習題目用語，不表示整句符合原文。", "匿名是 anonymous，非 distinguished", "未受訓練不是此字義"], "tag": "題目字彙", "source": "Question 23 · 題目用語"}, {"id": "shakespeare-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "The fact that Shakespeare's works are likely to have been altered over the years raises doubts about any stylometric analysis.", "target": "altered", "options": ["更動、修改過", "原封不動地保存", "以原名出版"], "answer": 0, "explanations": ["altered 指文本內容曾有變動。此處練習題目用語，不表示整句符合原文。", "原封不動與改動相反", "不是作者姓名的變更"], "tag": "題目字彙", "source": "Question 25 · 題目用語"}, {"id": "shakespeare-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "The fact that Shakespeare's works are likely to have been altered over the years raises doubts about any stylometric analysis.", "target": "raises doubts about", "options": ["使人質疑……", "確證……完全正確", "使人忘記……"], "answer": 0, "explanations": ["raise doubts 指引發可靠性上的疑問。此處練習題目用語，不表示整句符合原文。", "疑問不等於確證", "raise 不是消除記憶"], "tag": "題目字彙", "source": "Question 25 · 題目用語"}, {"id": "shakespeare-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "Analysis shows that Shakespeare's style differs from the styles of writers proposed as authors of the plays.", "target": "differs from", "options": ["與……不同", "與……完全一致", "起源於……"], "answer": 0, "explanations": ["differ from 比較差異；此句已修正原題比較對象的搭配。此處練習題目用語，不表示整句符合原文。", "一致是 matches，非 differs", "不同不等於源自"], "tag": "題目字彙", "source": "Question 26 · 題目用語"}]}, {"id": "living-dunes", "title": "Living Dunes", "sourceTitle": "Living Dunes", "subtitle": "", "part": 3, "topic": "沙丘遷移、聲音機制與實驗", "sourceNote": "比喻與物理機制分開理解；數值與研究描述依所附文章，並不表示沙丘是真正的生物。", "paragraphs": [{"label": "A", "text": "Armies of giant sand dunes are advancing across the world’s deserts, engulfing anything that crosses their path. They are tens of metres tall and hundreds of metres long. Fortunately, they aren't going very fast. Even the smallest, speediest dunes only travel about 100 metres over the course of a year, while the bigger ones, which weigh something in the order of 10,000 tonnes, barely move one metre in that time. However, their insidious creep can have serious consequences if there is an oil installation or a railway line in their path."}, {"label": "B", "text": "About 47% of the world’s land mass, including Antarctica, most of Australia and large areas of Africa, is classified as arid or semi-arid desert. Only around 20% of that is sand-covered, however, and over half of that is classified as ‘linear’ sand dunes. These form in a long curving wave, as a result of wind blowing strongly from several quarters, flipping them from side to side. Although linear dunes are static, sand blowing off them can cause problems for desert villages, burying crops and buildings."}, {"label": "C", "text": "Moving dunes make up just a small percentage of the rest, but they are of the most interest to scientists. They are known as ‘barchans’: heavy, crescent-shaped sand piles with a ridged crest and two elongated arms, one curving away to either side. ‘Barchan dunes only tend to form where you have one-directional winds on the edge of sandy deserts near coastal areas,’ says Giles Wiggs, a geomorphologist at Oxford University, who has been studying the formation and movement of sand dunes for more than a decade."}, {"label": "D", "text": "But even with strong winds, how can entire barchans move while retaining their form? That question was first answered in the mid-20th century by British explorer Ralph Alger Bagnold, and his answer hinges on the fact that dunes aren't solid, but granular. Bagnold figured out how barchan dunes are able to move grain by grain. Imagine a single grain of sand being blown up the back of a dune by the wind and deposited on the top. More grains follow the same pattern, until the accumulated weight of piled-up sand finally pushes the top down the dune face. The grain tumbles, then stops on the face until subsequent mini-avalanches bury it. Eventually, it reappears at the back of the dune, ready to repeat the process. As this happens to every grain of sand in the dune, the whole thing creeps in the direction of the prevailing wind."}, {"label": "E", "text": "The relationship between the wind and barchan dunes is complex. As a dune grows, it modifies the speed and course of the wind, which in turn alters how that dune and its neighbours evolve. ‘Interestingly, the dune can regulate its own shape, and maintain it as it moves,’ says Dr Stéphane Douady, a physicist at Ecole Normale Supérieure (ENS) in France. ‘Even when two dunes collide, they quickly take on their distinctive shapes again. It's like a living organism.’"}, {"label": "F", "text": "Douady and his colleagues have also been studying an even odder phenomenon than moving dunes: some barchans actually sing. Local legends attributed the sounds to dangerous spirits which were trying to trap unwary travellers. Douady is more pragmatic. ‘It's a strong booming noise with a low frequency,’ he explains, making a noise like a foghorn to demonstrate. ‘It can last for a long time — up to several minutes. It’s a very loud sound and you don't understand where it’s coming from when you first hear it.’ There are about 50 dunes distributed across 35 deserts round the world that are known to sing. Douady says the sound is caused by the way sand avalanches down the faces of particular dunes. Rather than tumbling randomly, the sand grains flow in synchrony and set each other vibrating like the membrane on a gigantic loudspeaker. The synchronisation causes the air to move in and out between the grains, creating a powerful sound wave."}, {"label": "G", "text": "What really surprised the scientists, however, was that they were able to take samples of the singing sand back to France and replicate the sound at ENS, proving that it's the sand, not the dune shape, that causes the sound. Their studies show the grains are a uniform shape, well-rounded from years of striking each other, and that the variations in size affect the tone. Crucially, the grains are coated with a special veneer, which Douady calls ‘desert glaze’, made from a precise combination of minerals from surrounding rocks including iron, aluminium, manganese, silicon and calcium. The team found that after a month or so, the veneer wore off and the grains lost their ‘voice’. ‘We managed to reproduce the desert glaze and then the grains started to sing again,’ says Douady. ‘We tried putting the coating onto different grains, but they weren’t round enough and it didn't work. But some American colleagues made some artificial grains and managed to make them sing, after covering them in desert glaze.’ Douady has now made recordings of dunesong from all over the world which are to be made into a CD."}], "questions": [{"id": "dunes-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Armies of giant sand dunes are advancing across the world’s deserts, engulfing anything that crosses their path.", "target": "sand dunes", "options": ["hills or ridges formed from wind-blown sand", "solid rock formations", "underground water channels"], "answer": 0, "explanations": ["此處 sand dunes 表示「風成沙丘」。須依原句語境理解。", "這個選項表示「堅硬岩層」；原句要表達的是「風成沙丘」。", "這個選項表示「地下水道」；原句要表達的是「風成沙丘」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Armies of giant sand dunes are advancing across the world’s deserts, engulfing anything that crosses their path.", "target": "advancing", "options": ["moving forwards", "developing a new theory", "retreating to an earlier position"], "answer": 0, "explanations": ["此處 advancing 表示「向前推進」。須依原句語境理解。", "這個選項表示「提出新理論」；原句要表達的是「向前推進」。", "這個選項表示「退回原位」；原句要表達的是「向前推進」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "Armies of giant sand dunes are advancing across the world’s deserts, engulfing anything that crosses their path.", "target": "engulfing", "options": ["completely covering or surrounding", "gently moving around without contact", "breaking into smaller pieces"], "answer": 0, "explanations": ["此處 engulfing 表示「吞沒、完全覆蓋」。須依原句語境理解。", "這個選項表示「不接觸而輕輕繞過」；原句要表達的是「吞沒、完全覆蓋」。", "這個選項表示「裂成較小碎片」；原句要表達的是「吞沒、完全覆蓋」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "Even the smallest, speediest dunes only travel about 100 metres over the course of a year, while the bigger ones, which weigh something in the order of 10,000 tonnes, barely move one metre in that time.", "target": "over the course of", "options": ["during the whole period of", "in the direction of", "as a consequence of"], "answer": 0, "explanations": ["此處 over the course of 表示「在……期間」。須依原句語境理解。", "這個選項表示「朝……方向」；原句要表達的是「在……期間」。", "這個選項表示「由於……的結果」；原句要表達的是「在……期間」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "Even the smallest, speediest dunes only travel about 100 metres over the course of a year, while the bigger ones, which weigh something in the order of 10,000 tonnes, barely move one metre in that time.", "target": "in the order of", "options": ["approximately the amount of", "ranked in a fixed sequence of", "under the authority of"], "answer": 0, "explanations": ["此處 in the order of 表示「大約、約為」。須依原句語境理解。", "這個選項表示「依固定次序排列」；原句要表達的是「大約、約為」。", "這個選項表示「受……指揮」；原句要表達的是「大約、約為」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "However, their insidious creep can have serious consequences if there is an oil installation or a railway line in their path.", "target": "insidious creep", "options": ["slow movement whose danger is not immediately obvious", "a sudden highly visible collapse", "a completely harmless vibration"], "answer": 0, "explanations": ["此處 insidious creep 表示「緩慢且不易察覺其危險的移動」。須依原句語境理解。", "這個選項表示「突然且非常明顯的崩塌」；原句要表達的是「緩慢且不易察覺其危險的移動」。", "這個選項表示「完全無害的震動」；原句要表達的是「緩慢且不易察覺其危險的移動」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "However, their insidious creep can have serious consequences if there is an oil installation or a railway line in their path.", "target": "oil installation", "options": ["equipment and structures used in the oil industry", "the act of pouring oil onto sand", "a naturally occurring pool of oil"], "answer": 0, "explanations": ["此處 oil installation 表示「石油設施」。須依原句語境理解。", "這個選項表示「把油倒在沙上的動作」；原句要表達的是「石油設施」。", "這個選項表示「天然油池」；原句要表達的是「石油設施」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-8", "mode": "vocab", "paragraph": "B", "sentence": "About 47% of the world’s land mass, including Antarctica, most of Australia and large areas of Africa, is classified as arid or semi-arid desert.", "target": "land mass", "options": ["a large continuous area of land", "the weight of an individual soil sample", "the whole volume of ocean water"], "answer": 0, "explanations": ["此處 land mass 表示「陸地、陸塊」。須依原句語境理解。", "這個選項表示「單份土壤樣本的重量」；原句要表達的是「陸地、陸塊」。", "這個選項表示「全部海水的體積」；原句要表達的是「陸地、陸塊」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-9", "mode": "vocab", "paragraph": "B", "sentence": "About 47% of the world’s land mass, including Antarctica, most of Australia and large areas of Africa, is classified as arid or semi-arid desert.", "target": "classified as", "options": ["placed in a particular category", "concealed from public knowledge", "removed from the study"], "answer": 0, "explanations": ["此處 classified as 表示「被歸類為」。須依原句語境理解。", "這個選項表示「被列為機密」；原句要表達的是「被歸類為」。", "這個選項表示「被排除研究」；原句要表達的是「被歸類為」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "About 47% of the world’s land mass, including Antarctica, most of Australia and large areas of Africa, is classified as arid or semi-arid desert.", "target": "arid", "options": ["very dry with little rain", "regularly flooded", "covered with dense forest"], "answer": 0, "explanations": ["此處 arid 表示「乾旱的」。須依原句語境理解。", "這個選項表示「經常淹水的」；原句要表達的是「乾旱的」。", "這個選項表示「被茂密森林覆蓋的」；原句要表達的是「乾旱的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "About 47% of the world’s land mass, including Antarctica, most of Australia and large areas of Africa, is classified as arid or semi-arid desert.", "target": "semi-arid", "options": ["receiving little rainfall but not as dry as an arid region", "completely without any water", "alternating daily between flood and drought"], "answer": 0, "explanations": ["此處 semi-arid 表示「半乾旱的」。須依原句語境理解。", "這個選項表示「完全沒有水的」；原句要表達的是「半乾旱的」。", "這個選項表示「每天在洪水與乾旱間交替的」；原句要表達的是「半乾旱的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "Only around 20% of that is sand-covered, however, and over half of that is classified as ‘linear’ sand dunes.", "target": "linear", "options": ["long and extended along a line", "roughly circular", "composed of separate vertical columns"], "answer": 0, "explanations": ["此處 linear 表示「線狀的」。須依原句語境理解。", "這個選項表示「大致圓形的」；原句要表達的是「線狀的」。", "這個選項表示「由分離直立柱組成的」；原句要表達的是「線狀的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "These form in a long curving wave, as a result of wind blowing strongly from several quarters, flipping them from side to side.", "target": "quarters", "options": ["directions from which something comes", "four equal parts of a single grain", "temporary living accommodation"], "answer": 0, "explanations": ["此處 quarters 表示「方向」。須依原句語境理解。", "這個選項表示「單顆沙粒的四等份」；原句要表達的是「方向」。", "這個選項表示「臨時住所」；原句要表達的是「方向」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-14", "mode": "vocab", "paragraph": "B", "sentence": "These form in a long curving wave, as a result of wind blowing strongly from several quarters, flipping them from side to side.", "target": "flipping", "options": ["turning from one side to the other", "remaining completely motionless", "moving vertically underground"], "answer": 0, "explanations": ["此處 flipping 表示「來回翻轉、擺動」。須依原句語境理解。", "這個選項表示「完全靜止」；原句要表達的是「來回翻轉、擺動」。", "這個選項表示「垂直移入地下」；原句要表達的是「來回翻轉、擺動」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-15", "mode": "vocab", "paragraph": "B", "sentence": "Although linear dunes are static, sand blowing off them can cause problems for desert villages, burying crops and buildings.", "target": "static", "options": ["not moving or changing position", "gradually accelerating", "producing a loud sound"], "answer": 0, "explanations": ["此處 static 表示「靜止不動的」。須依原句語境理解。", "這個選項表示「逐漸加速的」；原句要表達的是「靜止不動的」。", "這個選項表示「產生巨大聲響的」；原句要表達的是「靜止不動的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-16", "mode": "vocab", "paragraph": "C", "sentence": "They are known as ‘barchans’: heavy, crescent-shaped sand piles with a ridged crest and two elongated arms, one curving away to either side.", "target": "barchans", "options": ["crescent-shaped dunes formed by winds mainly from one direction", "long stationary dunes formed by winds from several directions", "small hollows created by flowing water"], "answer": 0, "explanations": ["此處 barchans 表示「新月形沙丘」。須依原句語境理解。", "這個選項表示「多方向風形成的長形靜止沙丘」；原句要表達的是「新月形沙丘」。", "這個選項表示「流水形成的小凹洞」；原句要表達的是「新月形沙丘」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-17", "mode": "vocab", "paragraph": "C", "sentence": "They are known as ‘barchans’: heavy, crescent-shaped sand piles with a ridged crest and two elongated arms, one curving away to either side.", "target": "crescent-shaped", "options": ["shaped like a curved new moon", "perfectly spherical", "straight and rectangular"], "answer": 0, "explanations": ["此處 crescent-shaped 表示「新月形的」。須依原句語境理解。", "這個選項表示「完全呈球形的」；原句要表達的是「新月形的」。", "這個選項表示「筆直且呈長方形的」；原句要表達的是「新月形的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-18", "mode": "vocab", "paragraph": "C", "sentence": "They are known as ‘barchans’: heavy, crescent-shaped sand piles with a ridged crest and two elongated arms, one curving away to either side.", "target": "ridged crest", "options": ["a raised narrow top", "a deep hollow at the base", "a smooth circular opening"], "answer": 0, "explanations": ["此處 ridged crest 表示「隆起的狹長頂脊」。須依原句語境理解。", "這個選項表示「底部深凹處」；原句要表達的是「隆起的狹長頂脊」。", "這個選項表示「平滑的圓形開口」；原句要表達的是「隆起的狹長頂脊」。
