rget": "", "options": ["Selective breeding involved repeatedly choosing plants with preferred traits as parents for later generations.", "Farmers randomly selected plants without considering any traits.", "Selective breeding means changing harvested vegetables after reproduction has ended."], "answer": 0, "explanations": ["in which 修飾 selective breeding，描述重複挑親代過程。", "desirable characteristics 與隨機不看特徵相反。", "produce next generation 指繁殖，不是收成後加工。"], "tag": "長難句理解", "structure": "It was the result of a process...為主幹；known as...被動分詞命名；in which...為過程關係子句；chose...and used...兩動詞共用 farmers。"}, {"id": "brassica-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Unlike modern genetic engineering, selective breeding does not involve changing a plant's DNA in a laboratory.", "target": "", "options": ["The passage distinguishes selecting existing variation from directly changing DNA in a laboratory.", "The passage says selective breeding and genetic engineering are identical procedures.", "The passage says selective breeding uses no inherited differences at all."], "answer": 0, "explanations": ["does not involve laboratory change 與後句 relies on existing variation 是方法區別。", "Unlike 明確表示兩者不同。", "遺傳變異正是依據，不是完全不使用。"], "tag": "長難句理解", "structure": "Unlike...為比較前提；selective breeding does not involve...為否定主幹；changing...是動名詞受詞；in a laboratory 限定被排除的直接操作方式。"}, {"id": "brassica-paraphrase-5", "mode": "paraphrase", "paragraph": "C", "sentence": "By saving seeds only from those preferred plants, they gradually increased the frequency of these characteristics over many generations.", "target": "", "options": ["Repeatedly saving seeds from preferred plants made those traits more common across generations.", "Saving seeds made the preferred traits disappear in the next generation.", "Every plant developed every desired trait immediately after one selection."], "answer": 0, "explanations": ["By 表方法；gradually 與 many generations 表漸進累積。", "increased frequency 不是特徵消失。", "逐漸多代不等於一次選擇立刻全 structure": "They also contain...為主幹；called glucosinolates 為被動分詞命名；which give...為非限定關係子句，which 指 chemicals。"}, {"id": "brassica-paraphrase-11", "mode": "paraphrase", "paragraph": "E", "sentence": "When a Brassica vegetable is cut or chewed, these compounds are converted into other substances that may help protect the body from certain diseases.", "target": "", "options": ["Cutting or chewing triggers conversion of compounds into substances that could have protective effects.", "The passage guarantees that eating the vegetables cures every disease.", "The protective substances form only if the vegetable is never cut or chewed."], "answer": 0, "explanations": ["When 表轉化條件；may help 保留效果不確定及輔助性。", "may、help、certain diseases 不能擴成保證治百病。", "條件是切或咀嚼，非完全不處理。"], "tag": "長難句理解", "structure": "When...is cut or chewed 為被動時間子句；compounds are converted...為被動主句；that may help...修飾 substances，not compounds' original state。"}, {"id": "brassica-paraphrase-12", "mode": "paraphrase", "paragraph": "E", "sentence": "Although researchers continue to investigate these effects, many health experts recommend eating a variety of Brassica vegetables as part of a balanced diet.", "target": "", "options": ["The author reports dietary recommendations while noting that investigation of the effects continues.", "All investigation has ended because every health effect is settled.", "Experts recommend avoiding every Brassica vegetable until all research is complete."], "answer": 0, "explanations": ["Although 讓步承認仍研究，同時報告建議。", "continue to investigate 不等於已全定論。", "recommend eating...不是一律禁止。"], "tag": "長難句理解", "structure": "Although...continue...為讓步；many health experts recommend...為主句；eating...為動名詞受詞；as part of...限於均衡飲食的一部分。"}, {"id": "brassica-paraphrase-13", "mode": "paraphrase", "paragraph": "F", "sentence": "Because many members of the family are closely related, they are vulnerable to similar insects and plant diseases.", "target": "", "options": ["Related crops can share vulnerability to pests and disease.", "Their relationship makes them immune to every pest.", "Every insect harms every crop in exactly the same way."], "answer": 0, "explanations": ["closely related 說明類似風險，非免疫或所有生物普遍相同。", "vulnerable 與 immune 相反。", "similar 不等於每種昆蟲、每株作物完全同效。"], "tag": "長難句理解", "structure": "Because many members...are related 為原因子句；they are vulnerable...為主句；similar insects and diseases 為風險對象，many 不等於全部。"}, {"id": "brassica-paraphrase-14", "mode": "paraphrase", "paragraph": "G", "sentence": "This knowledge enables breeders to produce improved crops more efficiently while still relying on natural breeding methods.", "target": "", "options": ["Genetic knowledge can improve breeding efficiency without replacing natural breeding methods.", "Scientists have completely abandoned breeding in favour of direct genetic engineering.", "The sentence says DNA research prevents any improvement in breeding."], "answer": 0, "explanations": ["while still 保留同時持續使用自然育種。", "combine 和 still relying 不支持完全取代。", "enables...improved crops 不是阻止改良。"], "tag": "長難句理解", "structure": "This knowledge 指研究基因所得；enables breeders to produce...為主幹；more efficiently 修飾 produce；while still relying...省略主詞 breeders，表同時方式。"}, {"id": "brassica-paraphrase-15", "mode": "paraphrase", "paragraph": "G", "sentence": "Scientists are also preserving wild Brassica populations because they contain valuable genetic diversity that may help future crops adapt to climate change and new diseases.", "target": "", "options": ["Wild populations are conserved because their genetic variety may aid future adaptation.", "Wild populations are preserved only as museum decorations with no genetic importance.", "The passage guarantees that all future crops will resist every new disease."], "answer": 0, "explanations": ["because 指保育理由；may help 限定未來可能助適應。", "valuable genetic diversity 明確具有遺傳意義。", "may 不等於保證，adapt 亦非萬病免疫。"], "tag": "長難句理解", "structure": "Scientists are preserving...為主幹；because they contain...為原因；that may help...修飾 diversity；adapt to...為 help 後的動詞結構。"}, {"id": "brassica-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "All Brassica vegetables originated from more than one wild plant.", "target": "originated from", "options": ["源自", "被……完全消滅", "與……沒有關係"], "answer": 0, "explanations": ["originate from 表來源；整句真偽需另判。此處練習題目用語，不表示整句符合原文。", "不是滅絕", "不是無關"], "tag": "題目字彙", "source": "Question 1 · 題目用語"}, {"id": "brassica-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Selective breeding changes a plant's DNA directly in a laboratory.", "target": "Selective breeding", "options": ["選擇性育種", "收成後挑菜", "植物輪作"], "answer": 0, "explanations": ["是挑選具所需特徵的親代繁殖。此處練習題目用語，不表示整句符合原文。", "不是收成後分級", "不是輪換作物"], "tag": "題目字彙", "source": "Question 2 · 題目用語"}, {"id": "brassica-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Early farmers repeatedly selected plants with desirable characteristics.", "target": "desirable characteristics", "options": ["理想的特徵", "不利而必須剔除的特徵", "固定販售價格"], "answer": 0, "explanations": ["desirable 是所希望保留的。此處練習題目用語，不表示整句符合原文。", "不能反讀為不利特徵", "不是價格"], "tag": "題目字彙", "source": "Question 3 · 題目用語"}, {"id": "brassica-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Brassica vegetables are generally considered nutritious.", "target": "nutritious", "options": ["有營養的", "價格低廉的", "保證治癒疾病的"], "answer": 0, "explanations": ["nutritious 指提供營養。此處練習題目用語，不表示整句符合原文。", "營養不等於價格", "有營養不代表保證療效"], "tag": "題目字彙", "source": "Question 5 · 題目用語"}, {"id": "brassica-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "Clubroot disease mainly damages the roots of Brassica plants.", "target": "Clubroot disease", "options": ["根瘤病", "一般開花階段", "人類關節炎"], "answer": 0, "explanations": ["為影響植物根的疾病。此處練習題目用語，不表示整句符合原文。", "不是正常發育階段", "不是人類病名"], "tag": "題目字彙", "source": "Question 6 · 題目用語"}, {"id": "brassica-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "Scientists have completely replaced traditional breeding with genetic engineering.", "target": "genetic engineering", "options": ["基因工程", "一般手工除草", "只依外觀挑選蔬菜"], "answer": 0, "explanations": ["指直接利用技術改變遺傳物質。此處練習題目用語，不表示整句符合原文。", "不是除草", "不同於單憑外形選擇"], "tag": "題目字彙", "source": "Question 7 · 題目用語"}, {"id": "brassica-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Brassica vegetables contain vitamins, minerals and dietary fibre.", "target": "dietary fibre", "options": ["膳食纖維", "衣料纖維", "骨骼總重量"], "answer": 0, "explanations": ["dietary 限定作為食物中的纖維。此處練習題目用語，不表示整句符合原文。", "不是紡織用途", "不是骨重"], "tag": "題目字彙", "source": "Question 8–13 · 題目用語"}, {"id": "brassica-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Natural chemicals known as glucosinolates are responsible for their distinctive flavour.", "target": "distinctive flavour", "options": ["具有辨識度的獨特風味", "完全沒有味道", "外形的大小"], "answer": 0, "explanations": ["distinctive 指特有可辨；flavour 是風味。此處練習題目用語，不表示整句符合原文。", "獨特不等於沒有味道", "flavour 不是形狀"], "tag": "題目字彙", "source": "Question 8–13 · 題目用語"}, {"id": "brassica-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "Farmers can help control diseases by rotating crops.", "target": "rotating", "options": ["輪換種植、輪作", "實際轉動收成菜體", "永久停止種植"], "answer": 0, "explanations": ["rotating crops 是同塊地輪種不同作物。此處練習題目用語，不表示整句符合原文。", "非把菜旋轉", "輪作不是停耕全部"], "tag": "題目字彙", "source": "Question 8–13 · 題目用語"}, {"id": "brassica-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "Wild Brassica plants are preserved because they contain valuable genetic diversity.", "target": "genetic diversity", "options": ["遺傳多樣性", "所有植株完全同一基因", "包裝樣式差異"], "answer": 0, "explanations": ["指遺傳資訊的變異範圍。此處練習題目用語，不表示整句符合原文。", "多樣與完全相同相反", "不是商業包裝"], "tag": "題目字彙", "source": "Question 8–13 · 題目用語"}]}, {"id": "clean-beach", "title": "How to Clean a Beach", "sourceTitle": "How to Clean a Beach", "subtitle": "", "part": 3, "topic": "漏油清理、環境權衡與決策", "sourceNote": "依本文不同地形與案例理解方法限制；不能把特定處理的好壞擴大為所有海岸均適用。", "paragraphs": [{"label": "A", "text": "After the oil tanker Prestige spilt her cargo just off north-west Spain in November 2002, the beautiful beaches of the Galician coastline were covered by a metre-deep mixture of oil and seawater. The Prestige was only one incident in a long series of accidents involving oil tankers. But while each new incident, including that of the Prestige, brings environmental destruction and financial loss, it also improves our understanding of how to deal with oil spills. This knowledge is hard-won, as people have often learned from mistakes made in dealing with oil spills. Aggressive clean-ups have sometimes caused more damage than the oil. But such difficulties apart, a rough consensus on how to deal with the issues involved in cleaning up oil spills has begun to emerge."}, {"label": "B", "text": "Oil is much less damaging at sea than on shore, so the best option is to skim the spilled oil off the surface of the water using specially equipped ships. A series of wooden booms floating on the surface of the water can also be used to protect the coastline. But the sea around the Prestige was too rough for the former, and much of the coast too exposed for booms to work, so there was little that could be done except watch the oil wash up onto the beaches."}, {"label": "C", "text": "When oil arrives onshore, the question becomes how best to save affected plants and animals, while minimizing damage to the surrounding ecosystem, without running up a huge bill. In large spills, leaving nature to do the job is a bad idea. Even the oiliest shore will return to normal, but without human intervention this can take many years. In the case of the Prestige, both the volume of oil spilt and the wildlife, fishing and tourist value of the Galician coast demanded action by specialists."}, {"label": "D", "text": "To decide what to do, specialists combined their own professional experience with local knowledge in an assessment process known as ‘net environmental benefit analysis’. Factors taken into account include possible environmental destruction, such as damage to an oiled beach which is home to a breeding colony of seals or seabirds. Less immediate socio-economic repercussions also come into play: local people may rely on shellfish beds, for example, or an affected beach could be a tourist destination. And such practical realities as the cost incurred by a particular clean-up option and how easy it will be to implement are also assessed."}, {"label": "E", "text": "Every intensive clean-up option has its drawbacks. When oil from the Exxon Valdez polluted the Alaskan shoreline in 1989, hot water applied under high pressure was used to scrub the beaches. But the parts of the shoreline that got this treatment recovered more slowly than those that did not. In Spain, this technique has so far been used only on man-made structures such as harbour walls."}, {"label": "F", "text": "Other methods have been even more aggressive than this. When the Torrey Canyon ran aground off the south coast of England in March 1967, oiled beaches were treated with 10,000 tonnes of chemical sprays. These turned out to be more toxic than the oil: many seashore invertebrates died, and the nutrients in the dispersants caused an explosion of seaweed growth."}, {"label": "G", "text": "In Galicia, local people wanted heavy machinery to come in and remove large quantities of oil quickly. But this has its own environmental cost. There were no tracks to the worst-affected beaches and it was feared that building them would harm the surrounding landscape. But in one of the areas affected, oil on the surface of the beaches was likely to be washed into the pipe that supplied water to a large fish farm. In the end, the desire to safeguard the farm tipped the balance in favour of building tracks for bulldozers and earthmovers, which scooped up the oil from the beach. Such equipment was not used in all areas affected by the Prestige spill, however. Salt-marshes and estuaries are such delicate terrain that almost any activity does more damage than the oil."}, {"label": "H", "text": "After the Amoco Cadiz disaster in 1978, when nearly a quarter of a million tonnes of oil were spilt off the coast of north-western France, heavy equipment was sent in to some polluted salt-marshes, where it scraped up the top half-metre of sediment. Twelve years later, these areas had still not recovered, whereas the oiled marshes that went uncleaned seemed in good shape."}, {"label": "I", "text": "After a short period of time, the Prestige spill moved from the emergency phase—high profile, high pressure—to a long-term painstaking project. Cleaning the beaches, for example, was a huge task. At Carnota, one of the most heavily affected areas of Galicia, dozens of volunteers and soldiers worked their way along six kilometres of sand on hands and knees, scraping up the small lumps of solidified oil. At other beaches nearby, people sifted the sand and combed seaside plants by hand to remove the oil and stop it becoming buried."}, {"label": "J", "text": "Once workers there had done all they could, stubborn patches still remained on rocks and in crevices. A possibility was to move oily rocks down the beach into the surf since this accelerates the natural cleaning process, as can ‘flushing’—i.e. pumping seawater over the shore and sifting the oil out of the run-off. But as the coastline became cleaner, the clean-up started to cost more for progressively less reward and more environmental damage. The Galicians were then faced with perhaps their most difficult decision: when to stop. As with most such operations, this decision is usually taken by local politicians rather than by environmentalists."}], "questions": [{"id": "beach-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "After the oil tanker Prestige spilt her cargo just off north-west Spain in November 2002, the beautiful beaches of the Galician coastline were covered by a metre-deep mixture of oil and seawater.", "target": "oil tanker", "options": ["a ship carrying large amounts of oil", "a vehicle transporting drinking water", "an offshore wind turbine"], "answer": 0, "explanations": ["此處 oil tanker 表示「油輪」。須依原句語境理解。", "這個選項表示「運送飲用水的車輛」；原句要表達的是「油輪」。", "這個選項表示「離岸風機」；原句要表達的是「油輪」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "After the oil tanker Prestige spilt her cargo just off north-west Spain in November 2002, the beautiful beaches of the Galician coastline were covered by a metre-deep mixture of oil and seawater.", "target": "cargo", "options": ["goods carried by a ship or other vehicle", "people operating a vessel", "the outer body of a ship"], "answer": 0, "explanations": ["此處 cargo 表示「貨物」。須依原句語境理解。", "這個選項表示「船舶操作人員」；原句要表達的是「貨物」。", "這個選項表示「船體外殼」；原句要表達的是「貨物」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "The Prestige was only one incident in a long series of accidents involving oil tankers.", "target": "incident", "options": ["an event especially one causing concern or damage", "a guaranteed solution", "an official shipping contract"], "answer": 0, "explanations": ["此處 incident 表示「事故、事件」。須依原句語境理解。", "這個選項表示「保證有效的解法」；原句要表達的是「事故、事件」。", "這個選項表示「正式航運合約」；原句要表達的是「事故、事件」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "This knowledge is hard-won, as people have often learned from mistakes made in dealing with oil spills.", "target": "hard-won", "options": ["obtained through considerable difficulty", "won without any effort", "physically hard to touch"], "answer": 0, "explanations": ["此處 hard-won 表示「得來不易的」。須依原句語境理解。", "這個選項表示「不費力獲得的」；原句要表達的是「得來不易的」。", "這個選項表示「觸感堅硬的」；原句要表達的是「得來不易的」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "Aggressive clean-ups have sometimes caused more damage than the oil.", "target": "Aggressive clean-ups", "options": ["forceful intensive attempts to remove contamination", "clean-ups involving personal anger only", "minimal passive observation"], "answer": 0, "explanations": ["此處 Aggressive clean-ups 表示「強力、密集的清理」。須依原句語境理解。", "這個選項表示「只涉及個人憤怒的清理」；原句要表達的是「強力、密集的清理」。", "這個選項表示「極少量的被動觀察」；原句要表達的是「強力、密集的清理」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "But such difficulties apart, a rough consensus on how to deal with the issues involved in cleaning up oil spills has begun to emerge.", "target": "rough consensus", "options": ["broad though not exact agreement", "complete disagreement", "a precisely calculated measurement"], "answer": 0, "explanations": ["此處 rough consensus 表示「大致共識」。須依原句語境理解。", "這個選項表示「完全分歧」；原句要表達的是「大致共識」。", "這個選項表示「精確測量數值」；原句要表達的是「大致共識」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-7", "mode": "vocab", "paragraph": "B", "sentence": "Oil is much less damaging at sea than on shore, so the best option is to skim the spilled oil off the surface of the water using specially equipped ships.", "target": "skim", "options": ["remove a layer from the surface", "read quickly for the main idea", "force material into deep sediment"], "answer": 0, "explanations": ["此處 skim 表示「撇除、掠取表層」。須依原句語境理解。", "這個選項表示「快速略讀抓重點」；原句要表達的是「撇除、掠取表層」。", "這個選項表示「把物質壓入深層沉積物」；原句要表達的是「撇除、掠取表層」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-8", "mode": "vocab", "paragraph": "B", "sentence": "A series of wooden booms floating on the surface of the water can also be used to protect the coastline.", "target": "booms", "options": ["floating barriers used to contain or divert oil", "rapid increases in economic activity", "very loud low-pitched noises"], "answer": 0, "explanations": ["此處 booms 表示「攔油浮欄」。須依原句語境理解。", "這個選項表示「經濟快速成長」；原句要表達的是「攔油浮欄」。", "這個選項表示「低沉巨大聲響」；原句要表達的是「攔油浮欄」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-9", "mode": "vocab", "paragraph": "B", "sentence": "But the sea around the Prestige was too rough for the former, and much of the coast too exposed for booms to work, so there was little that could be done except watch the oil wash up onto the beaches.", "target": "the former", "options": ["the first of two previously mentioned options", "the second of two previously mentioned options", "every method mentioned before"], "answer": 0, "explanations": ["此處 the former 表示「前述兩者中的前者」。須依原句語境理解。", "這個選項表示「前述兩者中的後者」；原句要表達的是「前述兩者中的前者」。", "這個選項表示「前面提及的所有方法」；原句要表達的是「前述兩者中的前者」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "But the sea around the Prestige was too rough for the former, and much of the coast too exposed for booms to work, so there was little that could be done except watch the oil wash up onto the beaches.", "target": "exposed", "options": ["unprotected from waves and weather", "publicly revealed as dishonest", "protected completely by harbour walls"], "answer": 0, "explanations": ["此處 exposed 表示「暴露於風浪、缺乏屏障的」。須依原句語境理解。", "這個選項表示「被揭發不誠實的」；原句要表達的是「暴露於風浪、缺乏屏障的」。", "這個選項表示「完全受港牆保護的」；原句要表達的是「暴露於風浪、缺乏屏障的」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "But the sea around the Prestige was too rough for the former, and much of the coast too exposed for booms to work, so there was little that could be done except watch the oil wash up onto the beaches.", "target": "wash up onto", "options": ["be carried ashore by water", "be completely cleaned with soap", "evaporate before reaching"], "answer": 0, "explanations": ["此處 wash up onto 表示「隨水流被沖上岸」。須依原句語境理解。", "這個選項表示「用肥皂完全洗淨」；原句要表達的是「隨水流被沖上岸」。", "這個選項表示「抵達前蒸發」；原句要表達的是「隨水流被沖上岸」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-12", "mode": "vocab", "paragraph": "C", "sentence": "When oil arrives onshore, the question becomes how best to save affected plants and animals, while minimizing damage to the surrounding ecosystem, without running up a huge bill.", "target": "minimizing", "options": ["reducing to the smallest practicable amount", "eliminating with absolute certainty", "ignoring entirely"], "answer": 0, "explanations": ["此處 minim xic than the oil: many seashore invertebrates died, and the nutrients in the dispersants caused an explosion of seaweed growth.", "target": "invertebrates", "options": ["animals without backbones", "animals with spinal columns", "all plants in shallow water"], "answer": 0, "explanations": ["此處 invertebrates 表示「無脊椎動物」。須依原句語境理解。", "這個選項表示「有脊柱動物」；原句要表達的是「無脊椎動物」。", "這個選項表示「淺水區全部植物」；原句要表達的是「無脊椎動物」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-33", "mode": "vocab", "paragraph": "F", "sentence": "These turned out to be more toxic than the oil: many seashore invertebrates died, and the nutrients in the dispersants caused an explosion of seaweed growth.", "target": "nutrients", "options": ["substances supporting growth and life", "organisms causing infection", "inert stones with no biological function"], "answer": 0, "explanations": ["此處 nutrients 表示「養分」。須依原句語境理解。", "這個選項表示「引起感染的生物」；原句要表達的是「養分」。", "這個選項表示「沒有生物作用的惰性石塊」；原句要表達的是「養分」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-34", "mode": "vocab", "paragraph": "F", "sentence": "These turned out to be more toxic than the oil: many seashore invertebrates died, and the nutrients in the dispersants caused an explosion of seaweed growth.", "target": "dispersants", "options": ["chemicals used to break oil into smaller droplets", "floating wooden barriers", "machines lifting heavy rocks"], "answer": 0, "explanations": ["此處 dispersants 表示「分散劑」。須依原句語境理解。", "這個選項表示「漂浮木製障欄」；原句要表達的是「分散劑」。", "這個選項表示「吊大石的機器」；原句要表達的是「分散劑」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-35", "mode": "vocab", "paragraph": "F", "sentence": "These turned out to be more toxic than the oil: many seashore invertebrates died, and the nutrients in the dispersants caused an explosion of seaweed growth.", "target": "an explosion of seaweed growth", "options": ["a very rapid increase in seaweed", "a literal blast destroying seaweed", "a permanent end to seaweed growth"], "answer": 0, "explanations": ["此處 an explosion of seaweed growth 表示「海藻爆發性生長」。須依原句語境理解。", "這個選項表示「實際爆炸摧毀海藻」；原句要表達的 ools for measuring wind"], "answer": 0, "explanations": ["此處 bulldozers 表示「推土機」。須依原句語境理解。", "這個選項表示「採水樣的小船」；原句要表達的是「推土機」。", "這個選項表示「手持測風工具」；原句要表達的是「推土機」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-40", "mode": "vocab", "paragraph": "G", "sentence": "In the end, the desire to safeguard the farm tipped the balance in favour of building tracks for bulldozers and earthmovers, which scooped up the oil from the beach.", "target": "earthmovers", "options": ["heavy machines used to move soil and materials", "naturally occurring earthquakes", "scientists studying soil"], "answer": 0, "explanations": ["此處 earthmovers 表示「土方機械」。須依原句語境理解。", "這個選項表示「自然地震」；原句要表達的是「土方機械」。", "這個選項表示「研究土壤的學者」；原句要表達的是「土方機械」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-41", "mode": "vocab", "paragraph": "G", "sentence": "In the end, the desire to safeguard the farm tipped the balance in favour of building tracks for bulldozers and earthmovers, which scooped up the oil from the beach.", "target": "scooped up", "options": ["lifted and removed with a curved tool or machine", "pressed deeper into the ground", "left completely undisturbed"], "answer": 0, "explanations": ["此處 scooped up 表示「鏟起、舀起」。須依原句語境理解。", "這個選項表示「壓入更深地層」；原句要表達的是「鏟起、舀起」。", "這個選項表示「保持完全未擾動」；原句要表達的是「鏟起、舀起」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-42", "mode": "vocab", "paragraph": "G", "sentence": "Salt-marshes and estuaries are such delicate terrain that almost any activity does more damage than the oil.", "target": "Salt-marshes", "options": ["coastal wetlands influenced by salt water", "dry deserts containing salt", "artificial storage tanks"], "answer": 0, "explanations": ["此處 Salt-marshes 表示「鹽沼」。須依原句語境理解。", "這個選項表示「含鹽乾沙漠」；原句要表達的是「鹽沼」。", "這個選項表示「人造儲槽」；原句要表達的是「鹽沼」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-43", "mode": "vocab", "paragraph": "G", "sentence": "Salt-marshes and estuaries are such delicate terrain that almost any activity does more damage than the oil.", "target": "estuaries", "options": ["areas where rivers meet the sea", "high mountain springs", "enclosed freshwater lakes"], "answer": 0, "explanations": ["此處 estuaries 表示「河口」。須依原句語境理解。", "這個選項表示「高山泉源」；原句要表達的是「河口」。", "這個選項表示「封閉淡水湖」；原句要表達的是「河口」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-44", "mode": "vocab", "paragraph": "G", "sentence": "Salt-marshes and estuaries are such delicate terrain that almost any activity does more damage than the oil.", "target": "delicate terrain", "options": ["land easily damaged by disturbance", "land entirely resistant to machinery", "land reserved only for private buildings"], "answer": 0, "explanations": ["此處 delicate terrain 表示「脆弱、易受擾動破壞的地形」。須依原句語境理解。", "這個選項表示「完全不受機械影響的地面」；原句要表達的是「脆弱、易受擾動破壞的地形」。", "這個選項表示「僅保留作私人建築的土地」；原句要表達的是「脆弱、易受擾動破壞的地形」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-45", "mode": "vocab", "paragraph": "H", "sentence": "After the Amoco Cadiz disaster in 1978, when nearly a quarter of a million tonnes of oil were spilt off the coast of north-western France, heavy equipment was sent in to some polluted salt-marshes, where it scraped up the top half-metre of sediment.", "target": "sediment", "options": ["material deposited by water or other natural processes", "the moving surface water alone", "a mixture of living fish only"], "answer": 0, "explanations": ["此處 sediment 表示「沉積物」。須依原句語境理解。", "這個選項表示「僅流動表面水」；原句要表達的是「沉積物」。", "這個選項表示「僅活魚的混合物」；原句要表達的是「沉積物」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-46", "mode": "vocab", "paragraph": "H", "sentence": "Twelve years later, these areas had still not recovered, whereas the oiled marshes that went uncleaned seemed in good shape.", "target": "in good shape", "options": ["in a healthy or satisfactory condition", "having a precise geometric outline", "newly formed"], "answer": 0, "explanations": ["此處 in good shape 表示「狀況良好的」。須依原句語境理解。", "這個選項表示「具有精確幾何輪廓的」；原句要表達的是「狀況良好的」。", "這個選項表示「新形成的」；原句要表達的是「狀況良好的」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-47", "mode": "vocab", "paragraph": "I", "sentence": "After a short period of time, the Prestige spill moved from the emergency phase—high profile, high pressure—to a long-term painstaking project.", "target": "emergency phase", "options": ["the initial period requiring urgent action", "the final period after all work ends", "a routine annual inspection"], "answer": 0, "explanations": ["此處 emergency phase 表示「緊急應變階段」。須依原句語境理解。", "這個選項表示「全部工作結束後的最終階段」；原句要表達的是「緊急應變階段」。", "這個選項表示「例行年度檢查」；原句要表達的是「緊急應變階段」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-48", "mode": "vocab", "paragraph": "I", "sentence": "After a short period of time, the Prestige spill moved from the emergency phase—high profile, high pressure—to a long-term painstaking project.", "target": "high profile", "options": ["attracting considerable public attention", "physically tall in outline", "hidden from public knowledge"], "answer": 0, "explanations": ["此處 high profile 表示「備受矚目的」。須依原句語境理解。", "這個選項表示「輪廓實際很高的」；原句要表達的是「備受矚目的」。", "這個選項表示「不為公眾所知的」；原句要表達的是「備受矚目的」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-49", "mode": "vocab", "paragraph": "I", "sentence": "After a short period of time, the Prestige spill moved from the emergency phase—high profile, high pressure—to a long-term painstaking project.", "target": "painstaking", "options": ["requiring great care and sustained effort", "done carelessly at high speed", "causing pain by deliberate violence"], "answer": 0, "explanations": ["此處 painstaking 表示「費心仔細、艱辛細緻的」。須依原句語境理解。", "這個選項表示「快速草率進行的」；原句要表達的是「費心仔細、艱辛細緻的」。", "這個選項表示「刻意以暴力製造疼痛的」；原句要表達的是「費心仔細、艱辛細緻的」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-50", "mode": "vocab", "paragraph": "I", "sentence": "At Carnota, one of the most heavily affected areas of Galicia, dozens of volunteers and soldiers worked their way along six kilometres of sand on hands and knees, scraping up the small lumps of solidified oil.", "target": "solidified", "options": ["hardened from a liquid or softer state", "fully dissolved in water", "evaporated into gas"], "answer": 0, "explanations": ["此處 solidified 表示「凝固的」。須依原句語境理解。", "這個選項表示「完全溶於水的」；原句要表達的是「凝固的」。", "這個選項表示「蒸發為氣體的」；原句要表達的是「凝固的」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-51", "mode": "vocab", "paragraph": "I", "sentence": "At other beaches nearby, people sifted the sand and combed seaside plants by hand to remove the oil and stop it becoming buried.", "target": "sifted", "options": ["separated by passing through a sieve", "burned at high temperature", "compressed into blocks"], "answer": 0, "explanations": ["此處 sifted 表示「篩過、篩分」。須依原句語境理解。", "這個選項表示「高溫焚燒」；原句要表達的是「篩過、篩分」。", "這個選項表示「壓成塊」；原句要表達的是「篩過、篩分」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-52", "mode": "vocab", "paragraph": "I", "sentence": "At other beaches nearby, people sifted the sand and combed seaside plants by hand to remove the oil and stop it becoming buried.", "target": "combed", "options": ["searched or worked through carefully", "cut off all plant roots", "spread more oil across"], "answer": 0, "explanations": ["此處 combed 表示「仔細梳理、搜尋」。須依原句語境理解。", "這個選項表示「切掉所有植物根」；原句要表達的是「仔細梳理、搜尋」。", "這個選項表示「散布更多油於」；原句要表達的是「仔細梳理、搜尋」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-53", "mode": "vocab", "paragraph": "J", "sentence": "Once workers there had done all they could, stubborn patches still remained on rocks and in crevices.", "target": "stubborn patches", "options": ["areas of contamination difficult to remove", "people refusing instructions", "newly cleaned surfaces"], "answer": 0, "explanations": ["此處 stubborn patches 表示「難以清除的殘留油斑」。須依原句語境理解。", "這個選項表示「拒絕指示的人」；原句要表達的是「難以清除的殘留油斑」。", "這個選項表示「剛清乾淨的表面」；原句要表達的是「難以清除的殘留油斑」。"], "tag": "搭配與語境義"}, {"id": "beach-vocab-54", "mode": "vocab", "paragraph": "J", "sentence": "Once workers there had done all they could, stubborn patches still remained on rocks and in crevices.", "target": "crevices", "options": ["narrow cracks or openings", "large flat beaches", "deep offshore trenches only"], "answer": 0, "explanations": ["此處 crevices 表示「裂隙」。須依原句語境理解。", "這個選項表示「大片平坦海灘」；原句要表達的是「裂隙」。", "這個選項表示「僅離岸深海溝」；原句要表達的是「裂隙」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-55", "mode": "vocab", "paragraph": "J", "sentence": "A possibility was to move oily rocks down the beach into the surf since this accelerates the natural cleaning process, as can ‘flushing’—i.e. pumping seawater over the shore and sifting the oil out of the run-off.", "target": "surf", "options": ["breaking waves near the shore", "browsing information online", "the smooth surface of a rock"], "answer": 0, "explanations": ["此處 surf 表示「近岸碎浪」。須依原句語境理解。", "這個選項表示「上網瀏覽」；原句要表達的是「近岸碎浪」。", "這個選項表示「石頭平滑表面」；原句要表達的是「近岸碎浪」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-56", "mode": "vocab", "paragraph": "J", "sentence": "A possibility was to move oily rocks down the beach into the surf since this accelerates the natural cleaning process, as can ‘flushing’—i.e. pumping seawater over the shore and sifting the oil out of the run-off.", "target": "accelerates", "options": ["makes a process happen faster", "prevents completely", "reverses permanently"], "answer": 0, "explanations": ["此處 accelerates 表示「加速」。須依原句語境理解。", "這個選項表示「完全阻止」；原句要表達的是「加速」。", "這個選項表示「永久逆轉」；原句要表達的是「加速」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-57", "mode": "vocab", "paragraph": "J", "sentence": "A possibility was to move oily rocks down the beach into the surf since this accelerates the natural cleaning process, as can ‘flushing’—i.e. pumping seawater over the shore and sifting the oil out of the run-off.", "target": "flushing", "options": ["washing an area with flowing seawater", "a sudden redness of the face", "forcing all oil deep underground"], "answer": 0, "explanations": ["此處 flushing 表示「沖洗」。須依原句語境理解。", "這個選項表示「臉部突然泛紅」；原句要表達的是「沖洗」。", "這個選項表示「把油壓到地下深處」；原句要表達的是「沖洗」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-58", "mode": "vocab", "paragraph": "J", "sentence": "A possibility was to move oily rocks down the beach into the surf since this accelerates the natural cleaning process, as can ‘flushing’—i.e. pumping seawater over the shore and sifting the oil out of the run-off.", "target": "run-off", "options": ["water flowing away from the treated area", "a contest deciding an election", "equipment removed after work"], "answer": 0, "explanations": ["此處 run-off 表示「流出的水、逕流」。須依原句語境理解。", "這個選項表示「選舉決選」；原句要表達的是「流出的水、逕流」。", "這個選項表示「工作後移除的器材」；原句要表達的是「流出的水、逕流」。"], "tag": "字彙與語境義"}, {"id": "beach-vocab-59", "mode": "vocab", "paragraph": "J", "sentence": "But as the coastline became cleaner, the clean-up started to cost more for progressively less reward and more environmental damage.", "target": "progressively", "options": ["increasingly as a process develops", "all at once", "without any change over time"], "answer": 0, "explanations": ["此處 progressively 表示「逐步地、愈來愈」。須依原句語境理解。", "這個選項表示「一次全部」；原句要表達的是「逐步地、愈來愈」。", "這個選項表示「隨時間毫無變化」；原句要表達的是「逐步地、愈來愈」。"], "tag": "字彙與語境義"}, {"id": "beach-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "But while each new incident, including that of the Prestige, brings environmental destruction and financial loss, it also improves our understanding of how to deal with oil spills.", "target": "", "options": ["Each spill causes damage yet can also teach people how to respond better.", "Every new spill is environmentally beneficial because learning cancels out all damage.", "Spills cause only financial loss and never improve knowledge."], "answer": 0, "explanations": ["while...also...兼含損害與知識，沒有把兩者相互抵銷。", "學到經驗不代表災難變成純好事。", "原句明說 also improves understanding。"], "tag": "長難句理解", "structure": "while each...brings...為讓步；including...插入例子；it also improves...為主句；how to deal...為 understanding 的內容。"}, {"id": "beach-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "This knowledge is hard-won, as people have often learned from mistakes made in dealing with oil spills.", "target": "", "options": ["People's knowledge has often developed through errors made while addressing spills.", "All the knowledge was obtained without any mistakes or difficulty.", "The mistakes were deliberately created to ensure greater damage."], "answer": 0, "explanations": ["hard-won、learned from mistakes 指代價，不代表刻意犯錯。", "from mistakes 與毫無錯誤相反。", "made in dealing...沒有故意加害目的。"], "tag": "長難句理解", "structure": "This knowledge 回指應對知識；is hard-won 為主幹；as...為原因；mistakes made...被動分詞修飾 mistakes。"}, {"id": "beach-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "But such difficulties apart, a rough consensus on how to deal with the issues involved in cleaning up oil spills has begun to emerge.", "target": "", "options": ["A broad agreement is beginning to form despite the practical difficulties described.", "Every expert already agrees on one perfect method for every spill.", "The difficulties have prevented any agreement from even starting."], "answer": 0, "explanations": ["rough、has begun、difficulties apart 都限定共識程度與進程。", "大致初成不等於全體完美通法。", "has begun to emerge 排除完全未開始。"], "tag": "長難句理解", "structure": "such difficulties apart 為讓步插入；a rough consensus...為主詞；on how to deal...補內容；has begun to emerge 為主幹。"}, {"id": "beach-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Oil is much less damaging at sea than on shore, so the best option is to skim the spilled oil off the surface of the water using specially equipped ships.", "target": "", "options": ["Because oil is generally described as less harmful at sea than on shore, surface removal is presented as the preferred option.", "Oil is described as more damaging at sea, so pushing it onto beaches is recommended.", "The sentence guarantees surface removal works in every sea condition."], "answer": 0, "explanations": ["比較 at sea 與 on shore；後文條件限制不能抹去。", "把 less 改成 more，且方法不是推上岸。", "best option 不代表任何風浪下可行，後文正給例外。"], "tag": "長難句理解", "structure": "Oil is much less damaging...為比較主句；so 引出選擇結果；to skim...為表語不定詞；using...表採用特裝船隻的方法。"}, {"id": "beach-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "But the sea around the Prestige was too rough for the former, and much of the coast too exposed for booms to work, so there was little that could be done except watch the oil wash up onto the beaches.", "target": "", "options": ["Rough seas prevented skimming and exposed shores prevented barriers from working, leaving little scope for action.", "The sea was calm enough for every method to work perfectly.", "The former refers to the floating booms rather than skimming."], "answer": 0, "explanations": ["former 指前列的 skim；兩種不同條件分別限制兩種方法。", "too rough、too exposed 與全可行相反。", "兩項順序是先船撇油後浮欄，前者不能指後者。"], "tag": "長難句理解", "structure": "but...too rough for the former 為第一限制；and much of coast [was] too exposed...為省略；so...little...except...引無可奈何結果。"}, {"id": "beach-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "When oil arrives onshore, the question becomes how best to save affected plants and animals, while minimizing damage to the surrounding ecosystem, without running up a huge bill.", "target": "", "options": ["Shoreline response must protect wildlife and the ecosystem while keeping costs from escalating.", "The sole aim is to remove oil at any cost regardless of other damage.", "The question concerns only tourists and never plants or animals."], "answer": 0, "explanations": ["while、without 同時列環境和費用限制。", "忽略 minimizing damage 與 without huge bill。", "原句明確 save affected plants and animals。"], "tag": "長難句理解", "structure": "When...為時間背景；question becomes how best to...為主幹；while minimizing...與 without running up...為並列的限制性補充，主體為應對者。"}, {"id": "beach-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "Even the oiliest shore will return to normal, but without human intervention this can take many years.", "target": "", "options": ["Natural recovery may eventually occur, but without intervention it can take a long time.", "The possibility of eventual recovery means every large spill should be left alone.", "Human intervention is said to be required because nature can never recover at all."], "answer": 0, "explanations": ["will return...but...many years 區分能恢復與恢復速度。", "原句未因此建議一律不處理；前句還稱大型漏油放任非佳策。", "eventual recovery 不能反讀為永不恢復。"], "tag": "長難句理解", "structure": "Even the oiliest shore...為第一主句；but without intervention...為轉折；this 指回到正常的過程；can 限定可能所需時間。"}, {"id": "beach-paraphrase-8", "mode": "paraphrase", "paragraph": "D", "sentence": "Factors taken into account include possible environmental destruction, such as damage to an oiled beach which is home to a breeding colony of seals or seabirds.", "target": "", "options": ["The assessment considers possible ecological harm, including damage to beaches used by breeding seals or seabirds.", "They assess only the cheapest option, ignoring all environmental effects.", "The process considers only immediate wildlife harm and excludes community effects."], "answer": 0, "explanations": ["include 表示列入的因素；such as 後以繁殖地受損舉例。", "environmental destruction 是明列因素。", "less immediate socio-economic repercussions 也明列。"], "tag": "長難句理解", "structure": "Factors 為主詞核心；taken into account 為被動分詞修飾；include...為主幹；such as...舉例；which is home to...修飾 beach，colony 指繁殖群落。"}, {"id": "beach-paraphrase-9", "mode": "paraphrase", "paragraph": "E", "sentence": "But the parts of the shoreline that got this treatment recovered more slowly than those that did not.", "target": "", "options": ["Shoreline areas treated with high-pressure hot water recovered more slowly than untreated areas.", "The treated areas recovered faster than the untreated ones.", "All untreated areas were proved never to recover."], "answer": 0, "explanations": ["those 代指 parts of shoreline；比較的是恢復速度。", "more slowly 不等於 faster。", "較慢比較不表示另一組永遠不能恢復。"], "tag": "長難句理解", "structure": "the parts...that got...為長主詞；recovered...為主幹；than those that did not 中 did not 省略 get treatment，不是 did not recover。"}, {"id": "beach-paraphrase-10", "mode": "paraphrase", "paragraph": "F", "sentence": "These turned out to be more toxic than the oil: many seashore invertebrates died, and the nutrients in the dispersants caused an explosion of seaweed growth.", "target": "", "options": ["The chemical sprays were found more harmful than the oil and contributed to damaging biological effects.", "The chemicals were harmless because they were intended to clean oil.", "The only change was a reduction in every kind of seaweed."], "answer": 0, "explanations": ["turned out to be 與 intention 不同；explosion 表海藻迅增。", "用途是清理不保證無毒，原句明說 more toxic。", "explosion of growth 與減少相反。"], "tag": "長難句理解", "structure": "These 指 chemical sprays；turned out...為結果主幹；冒號列死亡與海藻增生；nutrients...caused...為第二因果。"}, {"id": "beach-paraphrase-11", "mode": "paraphrase", "paragraph": "G", "sentence": "There were no tracks to the worst-affected beaches and it was feared that building them would harm the surrounding landscape.", "target": "", "options": ["Building access tracks was considered risky for the landscape because the affected beaches had no existing routes.", "The existing road network guaranteed machinery access without any possible landscape cost.", "The sentence reports that the tracks had already destroyed every beach."], "answer": 0, "explanations": ["it was feared 表預期風險，不是既成全部毀壞。", "no tracks 與既有完備路網相反。", "would harm 是當時預期，非已全毀的事實。"], "tag": "長難句理解", "structure": "There were no tracks...為存在句；and it was feared...為虛主詞被動；that building them would harm...為內容；them 指 tracks。"}, {"id": "beach-paraphrase-12", "mode": "paraphrase", "paragraph": "G", "sentence": "In the end, the desire to safeguard the farm tipped the balance in favour of building tracks for bulldozers and earthmovers, which scooped up the oil from the beach.", "target": "", "options": ["Protecting the fish farm became the decisive consideration supporting access tracks for heavy machinery.", "The decision was taken solely because machines were guaranteed to be cheapest.", "The fish farm's safety had no influence on the decision."], "answer": 0, "explanations": ["tipped the balance 指權衡後的決定性因素，不是宣告唯一成本。", "文中理由是 safeguard farm，未說最低價。", "原句明說它改變權衡，非無影響。"], "tag": "長難句理解", "structure": "the desire to safeguard...為主詞；tipped...為謂語；in favour of building...說明傾向；which scooped up...修飾 machinery，非 tracks。"}, {"id": "beach-paraphrase-13", "mode": "paraphrase", "paragraph": "G", "sentence": "Such equipment was not used in all areas affected by the Prestige spill, however.", "target": "", "options": ["Machinery was not deployed everywhere because some coastal habitats are particularly vulnerable to disturbance.", "No heavy machinery was used anywhere in the affected region.", "Heavy machinery was suitable for every type of coastal habitat without exception."], "answer": 0, "explanations": ["not in all 是並非全部，不是全部都不用；後句補脆弱區域理由。", "not all 與 none 是不同否定範圍。", "such delicate terrain 指存在不宜使用的地形。"], "tag": "長難句理解", "structure": "Such equipment...was not used in all areas 為部分否定；affected by...修飾 areas；however 標例外；後句 such...that...解釋脆弱程度與結果。"}, {"id": "beach-paraphrase-14", "mode": "paraphrase", "paragraph": "H", "sentence": "Twelve years later, these areas had still not recovered, whereas the oiled marshes that went uncleaned seemed in good shape.", "target": "", "options": ["After twelve years, mechanically disturbed marshes remained unrecovered while uncleaned oiled marshes appeared healthier.", "Both groups were confirmed fully recovered within twelve months.", "The uncleaned marshes were described as more severely damaged than the cleaned ones."], "answer": 0, "explanations": ["whereas 比較不同處理後結果；seemed 保留觀察判斷。", "years 不是 months，still not recovered 不是完全康復。", "in good shape 與未清理更差相反。"], "tag": "長難句理解", "structure": "Twelve years later 為時間背景；these areas 指機械處理區；had still not recovered 為主句；whereas...seemed...為對照；that went uncleaned 修飾 marshes。"}, {"id": "beach-paraphrase-15", "mode": "paraphrase", "paragraph": "I", "sentence": "After a short period of time, the Prestige spill moved from the emergency phase—high profile, high pressure—to a long-term painstaking project.", "target": "", "options": ["The response shifted from an urgent highly visible phase to a slower task requiring sustained careful work.", "The spill ceased to require any work once the emergency phase ended.", "The response remained exactly the same throughout all stages."], "answer": 0, "explanations": ["from...to...明示工作性質轉換，非結束全部工作。", "a long-term project 排除不再需要工作。", "from emergency to painstaking 表階段差異。"], "tag": "長難句理解", "structure": "the Prestige spill moved...以事件代指應對工作；from...to...為轉換；破折號 high profile,high pressure 補 emergency phase 特性。"}, {"id": "beach-paraphrase-16", "mode": "paraphrase", "paragraph": "I", "sentence": "At Carnota, one of the most heavily affected areas of Galicia, dozens of volunteers and soldiers worked their way along six kilometres of sand on hands and knees, scraping up the small lumps of solidified oil.", "target": "", "options": ["Workers painstakingly removed solid oil along the beach by manual effort.", "Workers removed the oil only by spraying from boats without touching the sand.", "All of the six kilometres were excavated using heavy machines in this sentence."], "answer": 0, "explanations": ["on hands and knees、scraping 指趴跪人工刮除。", "原句描述人員在沙灘，不是只在船上噴。", "此句未說機械挖除，重點是人工。"], "tag": "長難句理解", "structure": "At Carnota 為地點；one of...同位補充；dozens...為主詞；worked their way...為主幹；scraping up...為伴隨方法。"}, {"id": "beach-paraphrase-17", "mode": "paraphrase", "paragraph": "J", "sentence": "A possibility was to move oily rocks down the beach into the surf since this accelerates the natural cleaning process, as can ‘flushing’—i.e. pumping seawater over the shore and sifting the oil out of the run-off.", "target": "", "options": ["Moving oily rocks into breaking waves and flushing with seawater can both speed natural cleaning.", "Only moving rocks works; flushing is explicitly said to have no effect.", "Flushing means forcing the oil permanently below the beach surface."], "answer": 0, "explanations": ["as can flushing 省略 accelerate，表示另一方法也可加速。", "as can 表也能，不是不能。", "定義是泵水及從流出水篩油，不是壓地下。"], "tag": "長難句理解", "structure": "A possibility was to move...為主幹；since...為原因；as can flushing 為倒裝省略結構；i.e. 後解釋沖洗作法；this 指移石入浪。"}, {"id": "beach-paraphrase-18", "mode": "paraphrase", "paragraph": "J", "sentence": "But as the coastline became cleaner, the clean-up started to cost more for progressively less reward and more environmental damage.", "target": "", "options": ["As the shore grew cleaner, additional cleaning brought diminishing returns, rising costs and more ecological harm.", "Every additional stage produced greater benefit at lower cost without harm.", "The sentence says no oil had been removed at any point."], "answer": 0, "explanations": ["as...cleaner 描述已有改善；for less reward 表邊際回報降低。", "cost more、less reward、more damage 三處皆相反。", "became cleaner 意味已有改善，不能說完全未清。"], "tag": "長難句理解", "structure": "as the coastline became cleaner 為時間／趨勢子句；clean-up started to cost more 為主幹；for progressively less reward...說明付出與回報的變化。"}, {"id": "beach-paraphrase-19", "mode": "paraphrase", "paragraph": "J", "sentence": "As with most such operations, this decision is usually taken by local politicians rather than by environmentalists.", "target": "", "options": ["Local politicians, rather than environmentalists, usually decide when to end this type of operation.", "Environmentalists always make the final decision, with no role for politicians.", "The author says every operation worldwide follows an identical decision process without exception."], "answer": 0, "explanations": ["usually 限定普遍傾向；rather than 對照決策者。", "將被排除者換成唯一決策者。", "usually 不等於無例外的 every operation。"], "tag": "長難句理解", "structure": "As with most...引相似背景；this decision is usually taken...為被動主幹；by politicians 為施動者；rather than by...排除對照，this 指何時停止清理。"}, {"id": "beach-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "Each new oil spill improves our understanding of how to deal with such incidents.", "target": "incidents", "options": ["事故、事件", "確定有效的療法", "自然形成的棲地"], "answer": 0, "explanations": ["incidents 在此回指漏油事件。此處練習題目用語，不表示整句符合原文。", "不是療法", "不是棲地"], "tag": "題目字彙", "source": "Question 27 · 題目用語"}, {"id": "beach-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Aggressive clean-ups have sometimes caused more damage than the oil itself.", "target": "Aggressive", "options": ["強力、密集的", "完全被動不處理的", "專指對人動怒的"], "answer": 0, "explanations": ["此處形容清理強度，不是人際情緒。此處練習題目用語，不表示整句符合原文。", "不是放任不管", "不能只套人際攻擊義"], "tag": "題目字彙", "source": "Question 28 · 題目用語"}, {"id": "beach-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "It is best to let nature clean up large oil spills without any human intervention.", "target": "intervention", "options": ["介入、干預", "毫無行動的旁觀", "預測儀器"], "answer": 0, "explanations": ["human intervention 指人為採取措施。此處練習題目用語，不表示整句符合原文。", "介入與純旁觀不同", "不是器材"], "tag": "題目字彙", "source": "Question 30 · 題目用語"}, {"id": "beach-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Most oil spills are caused by poor maintenance of tankers.", "target": "maintenance", "options": ["維護、保養", "首度製造", "所有權移轉"], "answer": 0, "explanations": ["maintenance 為維持設備狀態的工作。此處練習題目用語，不表示整句符合原文。", "不是第一次生產", "不是轉讓"], "tag": "題目字彙", "source": "Question 31 · 題目用語"}, {"id": "beach-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "Practical issues, including the cost of each option, are assessed too.", "target": "assessed", "options": ["評估", "刻意忽略", "完全保證正確"], "answer": 0, "explanations": ["assess 是判斷可行性及利弊。此處練習題目用語，不表示整句符合原文。", "不是忽略", "評估不是保證結論無誤"], "tag": "題目字彙", "source": "Question 32–36 · 題目用語"}, {"id": "beach-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "They consider possible destruction as well as less immediate effects on the local community.", "target": "less immediate", "options": ["較不立即顯現的", "絕不會發生的", "已發生且無法觀察的"], "answer": 0, "explanations": ["less immediate 比較影響時間，不否定其可能性。此處練習題目用語，不表示整句符合原文。", "不立即不等於永不", "此片語沒說已發生且不可觀察"], "tag": "題目字彙", "source": "Question 32–36 · 題目用語"}, {"id": "beach-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Following the spill, water under high pressure was used on beaches, but this slowed recovery.", "target": "recovery", "options": ["恢復、復原", "船隻重新出航的唯一時點", "污染總量"], "answer": 0, "explanations": ["此處指受損環境恢復狀態。此處練習題目用語，不表示整句符合原文。", "不是只談船舶出航", "不是數量"], "tag": "題目字彙", "source": "Question 32–36 · 題目用語"}, {"id": "beach-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "The chemical sprays proved more toxic than the oil itself.", "target": "toxic", "options": ["有毒的", "完全無害的", "僅顏色較深的"], "answer": 0, "explanations": ["toxic 指對生物有毒害。此處練習題目用語，不表示整句符合原文。", "與無害相反", "不是顏色"], "tag": "題目字彙", "source": "Question 32–36 · 題目用語"}, {"id": "beach-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "Why did the authorities decide to build tracks for heavy machinery?", "target": "authorities", "options": ["主管機關、當局", "普通觀光客", "船上所有乘客"], "answer": 0, "explanations": ["authorities 此處為有決策權的機關。此處練習題目用語，不表示整句符合原文。", "不是遊客", "不是乘客"], "tag": "題目字彙", "source": "Question 37 · 題目用語"}, {"id": "beach-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "The beaches were too exposed for other methods.", "target": "exposed", "options": ["缺乏風浪屏障、暴露的", "受到完備保護的", "已公開展出的"], "answer": 0, "explanations": ["海岸語境指受風浪影響。此處練習題目用語，不表示整句符合原文。", "與受到保護相反", "不是展覽義"], "tag": "題目字彙", "source": "Question 37 C · 題目用語"}, {"id": "beach-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "Leaving them untouched can be better than cleaning them.", "target": "untouched", "options": ["未受擾動、未處理的", "已完全清除污染的", "完全沒有生物的"], "answer": 0, "explanations": ["此處指不施清理處理，不表示從未沾油。此處練習題目用語，不表示整句符合原文。", "不能推成已乾淨", "不處理不等於無生物"], "tag": "題目字彙", "source": "Question 38 A · 題目用語"}, {"id": "beach-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "The options include pumping seawater, using earthmovers, and moving rocks into the surf.", "target": "earthmovers", "options": ["土方機械", "地震", "地質學家"], "answer": 0, "explanations": ["為搬移土石的重型機械。此處練習題目用語，不表示整句符合原文。", "不是自然地震", "不是研究者"], "tag": "題目字彙", "source": "Question 39 · 題目用語"}, {"id": "beach-questionVocab-13", "mode": "questionVocab", "paragraph": "", "sentence": "The options include pumping seawater, using earthmovers, and moving rocks into the surf.", "target": "surf", "options": ["近岸碎浪", "網頁瀏覽", "地底暗流"], "answer": 0, "explanations": ["海岸清理語境為岸邊浪區。此處練習題目用語，不表示整句符合原文。", "不是上網", "不是地下水"], "tag": "題目字彙", "source": "Question 39 · 題目用語"}, {"id": "beach-questionVocab-14", "mode": "questionVocab", "paragraph": "", "sentence": "Who usually decides when to stop a clean-up operation?", "target": "operation", "options": ["作業、行動", "外科手術", "數學運算"], "answer": 0, "explanations": ["clean-up operation 指清理作業。此處練習題目用語，不表示整句符合原文。", "此處不是手術", "不是算術"], "tag": "題目字彙", "source": "Question 40 · 題目用語"}]}]</script><script>
'use strict';
const $=id=>document.getElementById(id),bank=JSON.parse($('data').textContent);let data=bank.find(a=>a.id==='katherine-mansfield')||bank[0];const keyFor=a=>'reading-review-5-'+a.id+'-v1';let KEY=keyFor(data);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={vocab:'關鍵字語義',paraphrase:'長難句改寫',questionVocab:'題目字彙｜選中文'};
let progress={};function loadProgress(){progress={};try{const stored=JSON.parse(localStorage.getItem(KEY)||'{}');if(stored&&typeof stored==='object'&&!Array.isArray(stored))progress=stored}catch(e){}}loadProgress();
let mode='vocab',paragraph='all',category='all',wrongOnly=false,queue=[],position=0;
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fingerprint(q){return JSON.stringify([q.id,q.sentence,q.options,q.answer])}
function remember(q,n){progress[fingerprint(q)]={selected:n,correct:n===q.answer};try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){$('status').textContent='瀏覽器無法保留進度；目前這一輪仍可正常作答。'}}
function options(id,rows,value){$(id).replaceChildren(...rows.map(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;return o}));$(id).value=value}
function stats(){if(data.pending){$('stats').textContent='此篇內文與複習題目待加入。';return}const m=mode==='reading'?'vocab':mode,qs=data.questions.filter(q=>q.mode===m),done=qs.filter(q=>progress[fingerprint(q)]),good=done.filter(q=>progress[fingerprint(q)].correct);$('stats').innerHTML=`<b>${names[m]}</b><br>最近作答：${done.length} / ${qs.length} 題<br>答對 ${good.length} 題 · 待複習 ${done.length-good.length} 題`;$('errors').textContent=wrongOnly?'返回全部題目':'重練錯題'}
function start(){for(const id of ['shuffle','errors','para','type'])$(id).disabled=!!data.pending;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=!!data.pending);document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});$('paraWrap').classList.toggle('hidden',mode==='questionVocab'||mode==='reading'||!!data.pending);$('typeWrap').classList.toggle('hidden',mode!=='vocab'||!!data.pending);$('jumpWrap').classList.toggle('hidden',mode==='reading'||!!data.pending);queue=shuffled(data.questions.filter(q=>q.mode===mode&&(mode==='questionVocab'||paragraph==='all'||q.paragraph===paragraph)&&(mode!=='vocab'||category==='all'||q.tag===category)&&(!wrongOnly||progress[fingerprint(q)]?.correct===false))).map(q=>({q,order:shuffled([0,1,2]),selected:null}));position=0;render()}
function sourceText(q){let i=q.sentence.indexOf(q.target);return q.target?esc(q.sentence.slice(0,i))+'<mark>'+esc(q.target)+'</mark>'+esc(q.sentence.slice(i+q.target.length)):esc(q.sentence)}
function render(){stats();const card=$('card');if(data.pending){card.innerHTML=`<article class="result"><div class="label">IELTS READING · PART ${data.part}</div><h2>${esc(data.title)}</h2><p>內容待加入</p><p class="minor">這篇已列入目錄。提供文章與題目後，即可加入三種複習練習。</p></article>`;return}if(mode==='reading'){card.innerHTML=`<article class="read"><div class="label">SOURCE TEXT</div><h2>${esc(data.sourceTitle||data.title)}</h2><p class="minor">${esc(data.subtitle)}</p>${data.sourceNote?`<p class="source-note">${esc(data.sourceNote)}</p>`:""}${data.paragraphs.map(p=>`<h3>PARAGRAPH ${esc(p.label)}</h3><p lang="en">${esc(p.text)}</p>`).join('')}</article>`;return}options('jump',queue.map((x,i)=>[String(i),`${i+1} · ${x.q.paragraph||'題目'} · ${x.q.target||x.q.tag}`]),position<queue.length?String(position):'');$('jump').disabled=!queue.length;
if(!queue.length){card.innerHTML=`<div class="result"><div class="label">${wrongOnly?'REVIEW':'PRACTICE'}</div><h2>${wrongOnly?'此範圍目前沒有錯題。':'此範圍沒有題目。'}</h2><p class="minor">可調整範圍或返回全部題目。</p><button id="all" class="primary">顯示全部題目</button></div>`;$('all').onclick=()=>{wrongOnly=false;paragraph='all';category='all';$('para').value='all';$('type').value='all';start()};return}
if(position>=queue.length){const answered=queue.filter(x=>x.selected!==null),good=answered.filter(x=>x.selected===x.q.answer);card.innerHTML=`<div class="result"><div class="label">ROUND COMPLETE</div><h2>這一輪已結束。</h2><p>已作答 ${answered.length} / ${queue.length} 題，其中答對 ${good.length} 題。</p><div class="actions"><button id="roundWrong">重練本輪錯題</button><button class="primary" id="again">重新洗牌練習</button></div></div>`;$('again').onclick=()=>{wrongOnly=false;start()};$('roundWrong').onclick=()=>{queue=shuffled(queue.filter(x=>x.selected!==null&&x.selected!==x.q.answer)).map(x=>({q:x.q,order:shuffled([0,1,2]),selected:null}));wrongOnly=true;position=0;render()};return}
const item=queue[position],q=item.q,done=queue.filter(x=>x.selected!==null).length;card.innerHTML=`<div class="top"><span>${mode==='questionVocab'?esc(q.source):'Paragraph '+esc(q.paragraph)} <span class="tag">${esc(q.tag)}</span></span><span id="roundCount">${wrongOnly?'錯題複習 · ':''}${position+1} / ${queue.length} · 已答 ${done} 題</span></div><progress id="roundProgress" class="progress" value="${done}" max="${queue.length}" aria-label="本輪已答題數"></progress><div class="prompt">${mode==='vocab'?'WHAT DOES THE HIGHLIGHTED EXPRESSION MEAN?':mode==='paraphrase'?'WHICH PARAPHRASE PRESERVES THE ORIGINAL MEANING?':'選出標示字詞在此語境中的中文意思'}</div><p class="sentence" lang="en">${sourceText(q)}</p><div class="answers">${item.order.map((n,i)=>`<button class="answer" data-answer="${n}" lang="${mode==='questionVocab'?'zh-Hant':'en'}"><span class="letter">${'ABC'[i]}</span><span>${esc(q.options[n])}</span></button>`).join('')}</div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="context" class="${mode==='questionVocab'?'hidden':''}">查看所在段落</button><div><button id="previous" ${position===0?'disabled':''}>上一題</button> <button id="next" class="primary" disabled>${position===queue.length-1?'查看本輪結果':'下一題 →'}</button></div></div><div id="contextText" class="context hidden"></div>`;
card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(item.selected!==null)return;item.selected=Number(b.dataset.answer);remember(q,item.selected);showFeedback(item);stats()});$('previous').onclick=()=>{position--;render()};$('next').onclick=()=>{position++;render();$('card').scrollIntoView({behavior:'smooth',block:'start'})};$('context').onclick=()=>{const c=$('contextText');c.classList.toggle('hidden');c.textContent=data.paragraphs.find(p=>p.label===q.paragraph).text;$('context').textContent=c.classList.contains('hidden')?'查看所在段落':'收起段落'};if(item.selected!==null)showFeedback(item)}
function showFeedback(item){const q=item.q,done=queue.filter(x=>x.selected!==null).length;$('roundCount').textContent=(wrongOnly?'錯題複習 · ':'')+(position+1)+' / '+queue.length+' · 已答 '+done+' 題';$('roundProgress').value=done;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const n=Number(b.dataset.answer);b.classList.toggle('correct',n===q.answer);b.classList.toggle('wrong',n===item.selected&&n!==q.answer)});const f=$('feedback');f.classList.remove('hidden');f.innerHTML=`<b>${item.selected===q.answer?'✓ 答對了':'請留意這裡'} · 正確答案 ${'ABC'[item.order.indexOf(q.answer)]}</b>${item.order.map((n,i)=>`<p><b>${'ABC'[i]} ${n===q.answer?'✓':'✕'}</b> ${esc(q.explanations[n])}</p>`).join('')}${q.structure?`<div class="syntax"><b>句構拆解</b><br>${esc(q.structure)}</div>`:''}`;$('next').disabled=false}
function configure(){paragraph='all';category='all';wrongOnly=false;$('title').textContent='Reading Review 5';$('topic').textContent='IELTS READING PRACTICE';$('partLabel').textContent='IELTS READING · PART '+data.part;document.title='Reading Review 5';KEY=keyFor(data);loadProgress();$('status').textContent='';options('para',[['all','全部段落'],...data.paragraphs.map(p=>[p.label,'Paragraph '+p.label])],'all');const tags=[...new Set(data.questions.filter(q=>q.mode==='vocab').map(q=>q.tag))];options('type',[['all','全部類型'],...tags.map(t=>[t,t])],'all');updateCounts();start()}
$('article').replaceChildren(...[1,2,3].filter(part=>bank.some(a=>a.part===part)).map(part=>{const g=document.createElement('optgroup');g.label='IELTS Reading Part '+part;const sorted=bank.filter(a=>a.part===part).sort((a,b)=>a.title.localeCompare(b.title,'en',{sensitivity:'base'}));for(const a of sorted){const o=document.createElement('option');o.value=a.id;o.textContent=a.title+(a.pending?' · 待加入':'');g.appendChild(o)}return g}));$('article').value=data.id;$('article').onchange=e=>{data=bank.find(a=>a.id===e.target.value);configure()};$('para').onchange=e=>{paragraph=e.target.value;start()};$('type').onchange=e=>{category=e.target.value;start()};$('jump').onchange=e=>{position=Number(e.target.value);render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;wrongOnly=false;start()});$('shuffle').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=false;start()};$('errors').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=!wrongOnly;start()};function updateCounts(){$('catalogSummary').textContent='已加入 '+bank.filter(a=>!a.pending).length+' / '+bank.length+' 篇 · 各篇進度分別保留';document.querySelector('.pills').classList.toggle('hidden',!!data.pending);$('countV').textContent=data.questions.filter(q=>q.mode==='vocab').length+' 題關鍵字語義';$('countP').textContent=data.questions.filter(q=>q.mode==='paraphrase').length+' 題長難句改寫';$('countQ').textContent=data.questions.filter(q=>q.mode==='questionVocab').length+' 題題目字彙選中文';}configure();
</script></body></html>
