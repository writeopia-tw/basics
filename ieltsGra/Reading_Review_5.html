示「各方面完全相同」；原句要表達的是「優於」。", "這個選項表示「完全依賴」；原句要表達的是「優於」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-43", "mode": "vocab", "paragraph": "E", "sentence": "However, as well as seeing the sun go down, they also seem to see the plane of polarised light it causes.", "target": "polarised light", "options": ["light whose waves have a particular directional alignment", "light occurring only at the poles", "light without any wave structure"], "answer": 0, "explanations": ["此處 polarised light 表示「偏振光」。須依原句語境理解。", "這個選項表示「只在兩極出現的光」；原句要表達的是「偏振光」。", "這個選項表示「完全沒有波動結構的光」；原句要表達的是「偏振光」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-44", "mode": "vocab", "paragraph": "E", "sentence": "This calibrates their compass.", "target": "calibrates", "options": ["adjusts against a reference for accuracy", "destroys the function of", "makes deliberately inaccurate"], "answer": 0, "explanations": ["此處 calibrates 表示「校準」。須依原句語境理解。", "這個選項表示「破壞功能」；原句要表達的是「校準」。", "這個選項表示「刻意使不準確」；原句要表達的是「校準」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-45", "mode": "vocab", "paragraph": "E", "sentence": "Travelling at night provides other benefits: the danger of meeting predators as well as the risk of dehydration due to flying for long periods in warm sunlit skies is reduced.", "target": "dehydration", "options": ["loss or shortage of water in the body", "lack of oxygen only", "excessive food intake"], "answer": 0, "explanations": ["此處 dehydration 表示「脫水」。須依原句語境理解。", "這個選項表示「僅缺氧」；原句要表達的是「脫水」。", "這個選項表示「食物攝取過量」；原句要表達的是「脫水」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-46", "mode": "vocab", "paragraph": "E", "sentence": "Furthermore, at night the air structure is cool and smooth and conducive to sustained, stable flight.", "target": "conducive to", "options": ["helpful or favourable for", "certain to prevent", "completely unrelated to"], "answer": 0, "explanations": ["此處 conducive to 表示「有助於、有利於」。須依原句語境理解。", "這個選項表示「必定阻止」；原句要表達的是「有助於、有利於」。", "這個選項表示「完全無關」；原句要表達的是「有助於、有利於」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-47", "mode": "vocab", "paragraph": "F", "sentence": "Birds are adept at both and, in tests, some can detect the minute difference in barometric pressure between the floor and ceiling of a room.", "target": "adept at", "options": ["highly skilled at", "unwilling to attempt", "physically unable to"], "answer": 0, "explanations": ["此處 adept at 表示「擅長」。須依原句語境理解。", "這個選項表示「不願嘗試」；原句要表達的是「擅長」。", "這個選項表示「身體上無法」；原句要表達的是「擅長」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-48", "mode": "vocab", "paragraph": "F", "sentence": "Birds are adept at both and, in tests, some can detect the minute difference in barometric pressure between the floor and ceiling of a room.", "target": "minute", "options": ["extremely small", "lasting sixty seconds", "very large and obvious"], "answer": 0, "explanations": ["此處 minute 表示「極微小的」。須依原句語境理解。", "這個選項表示「持續六十秒的」；原句要表達的是「極微小的」。", "這個選項表示「極大且明顯的」；原句要表達的是「極微小的」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-49", "mode": "vocab", "paragraph": "F", "sentence": "Birds are adept at both and, in tests, some can detect the minute difference in barometric pressure between the floor and ceiling of a room.", "target": "barometric pressure", "options": ["atmospheric pressure", "the force exerted by flowing water", "the speed of a bird's wingbeats"], "answer": 0, "explanations": ["此處 barometric pressure 表示「大氣壓、氣壓」。須依原句語境理解。", "這個選項表示「流水施力」；原句要表達的是「大氣壓、氣壓」。", "這個選項表示「鳥振翅速度」；原句要表達的是「大氣壓、氣壓」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-50", "mode": "vocab", "paragraph": "F", "sentence": "Certain species that feed on grassland flee at the onset of a cold snap because when the ground surface freezes the birds could starve.", "target": "at the onset of", "options": ["at the beginning of", "well after the end of", "regardless of the timing of"], "answer": 0, "explanations": ["此處 at the onset of 表示「在……開始時」。須依原句語境理解。", "這個選項表示「在結束很久之後」；原句要表達的是「在……開始時」。", "這個選項表示「不論時間」；原句要表達的是「在……開始時」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-51", "mode": "vocab", "paragraph": "F", "sentence": "Certain species that feed on grassland flee at the onset of a cold snap because when the ground surface freezes the birds could starve.", "target": "cold snap", "options": ["a short spell of unusually cold weather", "a sudden loud cracking sound", "a period of constant summer heat"], "answer": 0, "explanations": ["此處 cold snap 表示「短暫寒潮」。須依原句語境理解。", "這個選項表示「突然的大聲斷裂聲」；原句要表達的是「短暫寒潮」。", "這個選項表示「持續夏季高溫」；原句要表達的是「短暫寒潮」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-52", "mode": "vocab", "paragraph": "F", "sentence": "Yet they return ahead of a thaw, their arrival linked to a pressure change presaging an improvement in the weather.", "target": "thaw", "options": ["a change allowing frozen ground or ice to melt", "an increase in permanent ice cover", "a sudden arrival of darkness"], "answer": 0, "explanations": ["此處 thaw 表示「解凍、回暖」。須依原句語境理解。", "這個選項表示「永久冰蓋增加」；原句要表達的是「解凍、回暖」。", "這個選項表示「突然天黑」；原句要表達的是「解凍、回暖」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-53", "mode": "vocab", "paragraph": "F", "sentence": "Yet they return ahead of a thaw, their arrival linked to a pressure change presaging an improvement in the weather.", "target": "presaging", "options": ["indicating that something is about to happen", "proving that something can never happen", "recording something only after it ends"], "answer": 0, "explanations": ["此處 presaging 表示「預示」。須依原句語境理解。", "這個選項表示「證明某事永不發生」；原句要表達的是「預示」。", "這個選項表示「只在結束後記錄」；原句要表達的是「預示」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-54", "mode": "vocab", "paragraph": "G", "sentence": "Not so long ago the assumption was that a bird in the air on a dark windy night with no visible reference points to judge position was, like a pilot without radar, hopelessly lost.", "target": "reference points", "options": ["known features used to judge position", "places used only for feeding", "formal citations in a scientific paper"], "answer": 0, "explanations": ["此處 reference points 表示「定位參照點」。須依原句語境理解。", "這個選項表示「僅供覓食的地方」；原句要表達的是「定位參照點」。", "這個選項表示「論文的正式引用」；原句要表達的是「定位參照點」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-55", "mode": "vocab", "paragraph": "G", "sentence": "Losses do occur, but mainly because birds get swept off course by strong air masses against which battle is futile, and this results in a watery grave.", "target": "swept off course", "options": ["carried away from the intended route", "guided precisely to the destination", "prevented from taking off"], "answer": 0, "explanations": ["此處 swept off course 表示「被吹離航線」。須依原句語境理解。", "這個選項表示「精確引導至目的地」；原句要表達的是「被吹離航線」。", "這個選項表示「阻止起飛」；原句要表達的是「被吹離航線」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-56", "mode": "vocab", "paragraph": "G", "sentence": "Losses do occur, but mainly because birds get swept off course by strong air masses against which battle is futile, and this results in a watery grave.", "target": "futile", "options": ["unable to produce a useful result", "certain to succeed", "not yet attempted"], "answer": 0, "explanations": ["此處 futile 表示「徒勞無益的」。須依原句語境理解。", "這個選項表示「必定成功的」；原句要表達的是「徒勞無益的」。", "這個選項表示「尚未嘗試的」；原句要表達的是「徒勞無益的」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-57", "mode": "vocab", "paragraph": "G", "sentence": "Losses do occur, but mainly because birds get swept off course by strong air masses against which battle is futile, and this results in a watery grave.", "target": "a watery grave", "options": ["death by drowning or ending up in the sea", "a safe place to rest beside water", "a nest built over a pond"], "answer": 0, "explanations": ["此處 a watery grave 表示「葬身水中」。須依原句語境理解。", "這個選項表示「水旁安全休息處」；原句要表達的是「葬身水中」。", "這個選項表示「建於池上的巢」；原句要表達的是「葬身水中」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-58", "mode": "vocab", "paragraph": "G", "sentence": "But sometimes there's a silver lining.", "target": "a silver lining", "options": ["a hopeful aspect of an unfortunate situation", "a literal layer of silver metal", "a guarantee that nothing bad will occur"], "answer": 0, "explanations": ["此處 a silver lining 表示「困境中的一線好處」。須依原句語境理解。", "這個選項表示「實際銀金屬層」；原句要表達的是「困境中的一線好處」。", "這個選項表示「不會發生壞事的保證」；原句要表達的是「困境中的一線好處」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-59", "mode": "vocab", "paragraph": "G", "sentence": "Each autumn a small number of North American birds are blown across the Atlantic by fast-moving westerly tail winds.", "target": "westerly tail winds", "options": ["winds from the west blowing in the direction of travel", "winds blowing from the east against flight", "winds moving vertically downwards"], "answer": 0, "explanations": ["此處 westerly tail winds 表示「從西方吹來並順著飛行方向的風」。須依原句語境理解。", "這個選項表示「從東方吹來的逆風」；原句要表達的是「從西方吹來並順著飛行方向的風」。", "這個選項表示「垂直向下的風」；原句要表達的是「從西方吹來並順著飛行方向的風」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-60", "mode": "vocab", "paragraph": "G", "sentence": "Not only do they arrive safely in Europe but, based on tracking evidence, some make it back to North America in the following spring — probably after spending the winter with European migrants in sunny African climes.", "target": "climes", "options": ["regions considered in terms of their climate", "steep rock surfaces", "brief periods of sleep"], "answer": 0, "explanations": ["此處 climes 表示「氣候地帶」。須依原句語境理解。", "這個選項表示「陡峭岩面」；原句要表達的是「氣候地帶」。", "這個選項表示「短暫睡眠」；原句要表達的是「氣候地帶」。"], "tag": "字彙與語境義"}, {"id": "birds-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Flight gives them the power to move in any direction for as long as they have the energy to keep going.", "target": "", "options": ["Flight permits movement in any direction provided the birds retain enough energy.", "Flight lets birds continue indefinitely without using energy.", "Birds can fly only in one fixed direction regardless of energy."], "answer": 0, "explanations": ["for as long as 設下能量可維持的限制，不是無限飛行。", "刪除能量限制而加入 indefinitely。", "any direction 不等於固定單一方向。"], "tag": "長難句理解", "structure": "Flight gives them the power...為主幹；to move...說明能力內容；for as long as...為時間／條件限制；to keep going 補充所需能量用途。"}, {"id": "birds-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "They are equipped with lightweight, hollow bones, a finely-tuned navigation system and an ingenious heat-conserving design that allows them to face life in the harshest of climates.", "target": "", "options": ["Light bones, precise navigation and heat retention help birds survive demanding climatic conditions.", "The features described guarantee migration without any risk or energy cost.", "Heat-conserving design prevents birds from flying in cold conditions."], "answer": 0, "explanations": ["that allows...表助於面對嚴酷氣候，不保證無風險。", "後文仍明說 constant danger，不能推成零風險。", "保溫是助適應，非阻止寒冷時飛行。"], "tag": "長難句理解", "structure": "They are equipped with...為主幹；三項配備並列；that allows...修飾 heat-conserving design；the harshest of climates 為極端適應情境。"}, {"id": "birds-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "Migration evolved as a way for birds to exploit resources that are seasonally abundant and, equally important, to go elsewhere when the resources become scarce or harsh weather arrives.", "target": "", "options": ["Migration lets birds use seasonal food supplies and leave when conditions deteriorate.", "Birds migrate only because they cannot survive any cold weather.", "Migration evolved so that birds could avoid abundant resources."], "answer": 0, "explanations": ["to exploit...與 to go elsewhere...並列目的，兼顧資源季節變化。", "只歸因寒冷忽略食物，且下一句允許食多時耐寒。", "exploit 是利用豐富資源，非避開。"], "tag": "長難句理解", "structure": "Migration evolved as a way...為主幹；for birds to...與 to go...為平行不定詞；that are...修飾 resources；when...限定離開情境。"}, {"id": "birds-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Many species can tolerate cold temperatures if food is plentiful but when food is not available they must migrate.", "target": "", "options": ["Many species can withstand cold when food is sufficient, but must move when food is unavailable.", "Cold always forces every species to migrate even if food is plentiful.", "All birds can stay indefinitely when there is no food."], "answer": 0, "explanations": ["if 與 when 分別限定能耐寒、必須移動的不同條件。", "many 不等於 all；food plentiful 時原句容許留駐。", "no food 時 must migrate，非能無限留下。"], "tag": "長難句理解", "structure": "Many species...為主詞；can tolerate...為第一謂語；if...為條件；but when...they must...構成轉折；不同情境不能混合。"}, {"id": "birds-paraphrase-5", "mode": "paraphrase", "paragraph": "C", "sentence": "While this simple explanation for why birds migrate is essentially true, intriguing questions remain.", "target": "", "options": ["The food-based explanation is broadly valid but does not answer every puzzle about migration.", "The author rejects every role of food in migration.", "The author says there is nothing left to investigate about migration."], "answer": 0, "explanations": ["While 讓步接受基本解釋，主句提出仍有疑問。", "essentially true 不是完全拒絕。", "questions remain 表尚未全解。"], "tag": "長難句理解", "structure": "While...is essentially true 為讓步子句；for why birds migrate 修飾 explanation；intriguing questions remain 為主句，不可把讓步部分當作者唯一結論。"}, {"id": "birds-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "In general, the further north a migrant species breeds, the further south it spends the winter.", "target": "", "options": ["Species breeding farther north generally winter farther south.", "Every individual bird always moves the same fixed distance south.", "The sentence compares distance east with distance west."], "answer": 0, "explanations": ["the further...,the further...是緯向相關比較，in general 保留概括。", "沒有說每隻固定相同距離。", "north、south 不能改成 east、west。"], "tag": "長難句理解", "structure": "In general 限定概括程度；the further north...與 the further south...構成對應比較；第一主詞為 migrant species，第二 it 回指該物種。"}, {"id": "birds-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "Yet, en route to a final destination in southern latitudes, all these individuals overfly areas of seemingly suitable habitat spanning two hemispheres.", "target": "", "options": ["Migrants pass over apparently suitable areas before reaching their southern destination.", "Migrants stop permanently at every apparently suitable area they encounter.", "All the areas they pass over have been proved totally unsuitable."], "answer": 0, "explanations": ["Yet 表前述食物解釋仍留下的謎：會飛過看似合適棲地。", "overfly 不是每處都停留。", "seemingly suitable 不等於已證實完全不適合。"], "tag": "長難句理解", "structure": "en route to...為途中背景；all these individuals 為主詞；overfly...為謂語；spanning two hemispheres 分詞修飾 areas，seemingly 限定觀察判斷。"}, {"id": "birds-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "Such compulsive journeys probably evolved over time and in response to fluctuations in weather but we do not really know.", "target": "", "options": ["Weather fluctuations are offered as a tentative explanation for the long journeys, not an established conclusion.", "The author claims the weather explanation is conclusively proved.", "The author says no possible explanation can even be proposed."], "answer": 0, "explanations": ["probably 與 we do not really know 明確保留不確定。", "將可能解釋升格為確證。", "不知道最終答案不等於不能提出假說。"], "tag": "長難句理解", "structure": "Such...journeys 指前述超長行程；probably evolved...為推論主幹；in response to...表可能成因；but...限制確定性。"}, {"id": "birds-paraphrase-9", "mode": "paraphrase", "paragraph": "D", "sentence": "Very few adults migrate accompanied by their offspring and youngsters may have little or no inkling of their parents’ appearance.", "target": "", "options": ["Few adults travel with their young, and young birds may scarcely know their parents' appearance.", "All young birds must recognise and accompany their parents to migrate.", "The sentence says no bird of any species has ever travelled with its offspring."], "answer": 0, "explanations": ["Very few 與 may little or no 表比例及認知的不確定限制。", "原句正指出缺少親代同行與外貌認知。", "very few 不是 none，也未說史上從未。"], "tag": "長難句理解", "structure": "Very few adults...為第一主句；accompanied by...為被動分詞；and youngsters may have...為第二主句；little or no inkling 限定了解程度。"}, {"id": "birds-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "Cuckoos are famous for depositing their eggs in the nests of other birds that unwittingly serve as foster-parents.", "target": "", "options": ["Other birds raise cuckoo young without realising that they are acting as foster parents.", "Cuckoos consciously train other birds in a formal cooperative agreement.", "Cuckoos raise the other birds' eggs in their own nests."], "answer": 0, "explanations": ["unwittingly 修飾其他鳥代養時的不知情，非合作契約。", "無從得出知情訓練或協議。", "交換杜鵑與其他鳥的產卵及代養角色。"], "tag": "長難句理解", "structure": "Cuckoos are famous for...為主幹；depositing eggs...為介詞受詞；that unwittingly serve...修飾 other birds；as foster-parents 為角色。"}, {"id": "birds-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Astonishing as this piece of evolutionary behaviour is, it is even more remarkable to consider that, once grown, the young cuckoo makes its own way to ancestral wintering grounds in the tropics before returning single-handedly to northern Europe to seek out a mate among its own kind.", "target": "", "options": ["Even more remarkable than brood parasitism is the young cuckoo's unassisted journey to ancestral wintering areas and back.", "The cuckoo's journey is said to require continuous parental escort.", "The sentence states that cuckoos return to a different species to find a mate."], "answer": 0, "explanations": ["Astonishing as...先承認寄養行為驚人，再強調獨自遷徙更驚人。", "its own way、single-handedly 都指獨力。", "among its own kind 是同類，不是不同物種。"], "tag": "長難句理解", "structure": "形容詞 Astonishing 前置的 as 子句表讓步；it is even more remarkable...主句；once grown 為縮減時間子句；before returning...說明後續順序。"}, {"id": "birds-paraphrase-12", "mode": "paraphrase", "paragraph": "E", "sentence": "As we continue to study bird migration, its mystery is better understood but also compounded.", "target": "", "options": ["Further study makes migration more understandable while also exposing additional complexity.", "Each new study removes every mystery without creating new questions.", "The writer says research has produced no understanding at all."], "answer": 0, "explanations": ["better understood 與 compounded 並存，是理解增加但複雜性也顯現。", "also compounded 排除所有疑問已消失。", "better understood 排除完全沒有進展。"], "tag": "長難句理解", "structure": "As we continue...為時間背景；its mystery 是主詞；is better understood 與 also compounded 為平行被動，but 表看似矛盾的雙重結果。"}, {"id": "birds-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "Experiments have shown that, after being taken thousands of miles over an unfamiliar landmass, birds are still capable of returning rapidly to nest sites.", "target": "", "options": ["Experiments indicate that displaced birds can still return quickly to their nesting places.", "The birds returned only because they had remained beside their nests throughout the experiment.", "Every displaced bird has been proved incapable of finding any familiar place."], "answer": 0, "explanations": ["after being taken...明說被移走，still capable 為保留返回能力。", "被移到陌生陸地，不是全程留巢邊。", "can return 不是所有鳥必定無法返回。"], "tag": "長難句理解", "structure": "Experiments have shown that...為報告框架；after being taken...為被動縮減時間子句，主體為 birds；are still capable of...為結果能力。"}, {"id": "birds-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "How the birds use their 'instruments' remains unknown, but one thing is clear - they see the world with a sensory perception superior to ours.", "target": "", "options": ["Researchers do not fully know how the mechanisms work, though birds' sensory abilities are described as superior.", "The author claims every navigation mechanism has been completely explained.", "The lack of a full explanation proves birds have no navigation abilities."], "answer": 0, "explanations": ["How...remains unknown 與 one thing is clear 分開未知機制和所知能力。", "unknown 不可改成全解。", "機制未知不否定觀察到的能力。"], "tag": "長難句理解", "structure": "How birds use...為主詞子句；but 後 one thing is clear 為對比；破折號後解釋 clear 的內容；superior to ours 中 ours 指人類 sensory perception。"}, {"id": "birds-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "Travelling at night provides other benefits: the danger of meeting predators as well as the risk of dehydration due to flying for long periods in warm sunlit skies is reduced.", "target": "", "options": ["Night travel reduces predator encounters and the water-loss risk associated with long flight in warm sunlight.", "Night travel guarantees that birds never encounter predators or lose any water.", "The sentence says sunlight always makes migration impossible."], "answer": 0, "explanations": ["is reduced 表風險下降，非完全消除；due to...說明脫水風險成因。", "reduced 不等於零風險。", "降低風險不能推為白天絕對不能飛。"], "tag": "長難句理解", "structure": "Travelling at night 為動名詞主詞；冒號後列 benefits；danger...as well as risk...為主詞組；due to...修飾 dehydration 的情境。"}, {"id": "birds-paraphrase-16", "mode": "paraphrase", "paragraph": "F", "sentence": "Birds are adept at both and, in tests, some can detect the minute difference in barometric pressure between the floor and ceiling of a room.", "target": "", "options": ["Some birds can detect very small pressure differences, a skill relevant to choosing weather and winds.", "All birds always need visible storm clouds before reacting to weather.", "The measured difference is said to last exactly one minute."], "answer": 0, "explanations": ["some 限定受測鳥；minute 是極微小，不是六十秒。", "下一句 before visible sign，不能說一定先見雲。", "把形容詞 minute 誤讀成時間名詞。"], "tag": "長難句理解", "structure": "Birds are adept at both 承接預測天氣與利用風；and some can detect...為並列；in tests 限定證據來源；between floor and ceiling 指壓差範圍。"}, {"id": "birds-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "Yet they return ahead of a thaw, their arrival linked to a pressure change presaging an improvement in the weather.", "target": "", "options": ["Birds may return before a thaw, with arrival associated with a pressure change signalling improved weather.", "Birds return only after every part of the ground has already thawed.", "The sentence says their arrival directly causes all pressure changes."], "answer": 0, "explanations": ["ahead of 表早於；linked to 表關聯，不是鳥造成天氣。", "把解凍前改成全部解凍後。", "關聯不能升格為鳥返抵造成壓變。"], "tag": "長難句理解", "structure": "Yet 承接寒潮離開形成反差；they return ahead of...為主幹；their arrival linked...為獨立補充結構；presaging 修飾 pressure change。"}, {"id": "birds-paraphrase-18", "mode": "paraphrase", "paragraph": "G", "sentence": "Not only do they arrive safely in Europe but, based on tracking evidence, some make it back to North America in the following spring — probably after spending the winter with European migrants in sunny African climes.", "target": "", "options": ["Some wind-blown birds reach Europe safely and, according to tracking, some also return to North America next spring.", "Every wind-blown bird dies before reaching Europe.", "Tracking proves all birds returned by exactly the same route after a fully documented African winter."], "answer": 0, "explanations": ["Not only...but...加入返航成功；some 與 probably 限定範圍及冬季推測。", "arrive safely 明確有倖存者。", "some 非 all；probably 也非已完整記錄的確證。"], "tag": "長難句理解", "structure": "Not only 置首使 do they arrive 倒裝；but 後 some make it back 為第二主句；based on tracking evidence 標記依據；probably after...為帶不確定性的補充。"}, {"id": "birds-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "The physical characteristics of birds that allow them to migrate.", "target": "physical characteristics", "options": ["身體特徵", "政治立場", "外部路線圖"], "answer": 0, "explanations": ["physical 此處指身體構造與機能相關特徵。此處練習題目用語，不表示整句符合原文。", "不是政治資訊", "特徵不等於地圖"], "tag": "題目字彙", "source": "Question 14–20 Heading ii · 題目用語"}, {"id": "birds-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Environmental pollution and migration patterns.", "target": "migration patterns", "options": ["遷徙規律、模式", "個別羽毛圖案", "固定鳥巢材料"], "answer": 0, "explanations": ["pattern 此處指移動的可辨規律。此處練習題目用語，不表示整句符合原文。", "不是表面花紋", "不是築巢材料"], "tag": "題目字彙", "source": "Question 14–20 Heading iii · 題目用語"}, {"id": "birds-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Research findings on how birds find their way.", "target": "findings", "options": ["研究結果、發現", "研究前的猜測而已", "遺失的研究工具"], "answer": 0, "explanations": ["findings 指研究得出的內容。此處練習題目用語，不表示整句符合原文。", "不是僅前置猜測", "不是遺失物"], "tag": "題目字彙", "source": "Question 14–20 Heading v · 題目用語"}, {"id": "birds-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "The unexplained rejection of closer feeding grounds.", "target": "rejection", "options": ["拒絕、捨棄不用", "積極採納", "精確定位"], "answer": 0, "explanations": ["rejection 指不選用較近地點。此處練習題目用語，不表示整句符合原文。", "採納與捨棄相反", "不是定位"], "tag": "題目字彙", "source": "Question 14–20 Heading x · 題目用語"}, {"id": "birds-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "The unexplained rejection of closer feeding grounds.", "target": "feeding grounds", "options": ["覓食地", "供人餵養的飼料袋", "鳥類產卵器官"], "answer": 0, "explanations": ["grounds 指活動地點。此處練習題目用語，不表示整句符合原文。", "不是袋子", "不是器官"], "tag": "題目字彙", "source": "Question 14–20 Heading x · 題目用語"}, {"id": "birds-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "Only shore birds are unaffected by wind.", "target": "unaffected by", "options": ["不受……影響的", "必然被……殺死的", "完全由……創造的"], "answer": 0, "explanations": ["unaffected 為未受影響；only 的真偽須依文章另判。此處練習題目用語，不表示整句符合原文。", "未受影響不等於被殺死", "不是起源關係"], "tag": "題目字彙", "source": "Question 21–22 D · 題目用語"}, {"id": "birds-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Birds are unable to survive if separated from other members of their own species.", "target": "species", "options": ["物種", "個別家庭", "棲地總面積"], "answer": 0, "explanations": ["own species 是同物種成員。此處練習題目用語，不表示整句符合原文。", "同家庭範圍比同物種窄", "不是面積"], "tag": "題目字彙", "source": "Question 21–22 E · 題目用語"}, {"id": "birds-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "The cuckoo is able to migrate despite a lack of parental guidance.", "target": "parental guidance", "options": ["親代指引", "研究員安裝的導航器", "其他物種發出的警告"], "answer": 0, "explanations": ["parental 指父母或親代。此處練習題目用語，不表示整句符合原文。", "不是器材", "不是泛指他種警告"], "tag": "題目字彙", "source": "Question 23 · 題目用語"}, {"id": "birds-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "Some birds can anticipate weather changes without visible clues.", "target": "anticipate", "options": ["預先察覺、預料", "事後才記錄", "直接造成"], "answer": 0, "explanations": ["anticipate 指事情發生前已有預期。此處練習題目用語，不表示整句符合原文。", "不是事後記錄", "預料不等於造成"], "tag": "題目字彙", "source": "Question 25 · 題目用語"}, {"id": "birds-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "Some birds can anticipate weather changes without visible clues.", "target": "visible clues", "options": ["看得見的線索", "完全無法察覺的全部訊號", "研究者口頭命令"], "answer": 0, "explanations": ["visible 限定視覺可見，不代表任何感官訊號皆無。此處練習題目用語，不表示整句符合原文。", "不能把不可見改成完全不可感知", "不是口頭指令"], "tag": "題目字彙", "source": "Question 25 · 題目用語"}]}, {"id": "facial-expression", "title": "Facial Expression", "sourceTitle": "Facial Expression", "subtitle": "", "part": 2, "topic": "表情、文化與研究限制", "sourceNote": "原文 aliens 等明顯用字及語句錯誤已修正。研究主張須辨認來源，相關不等於因果；表情普遍性與不可隱藏性也不是相同命題。", "paragraphs": [{"label": "A", "text": "A facial expression is one or more motions or positions of the muscles in the skin. These movements convey the emotional state of the individual to observers. Facial expressions are a form of nonverbal communication. They are a primary means of conveying social information among humans, but also occur in most other mammals and some other animal species. Facial expressions and their interpretation can, to some extent, vary between cultures, as described in the works of Charles Darwin."}, {"label": "B", "text": "Humans can adopt a facial expression voluntarily. However, because expressions are closely tied to emotion, they are more often involuntary. It can be nearly impossible to avoid expressions for certain emotions, even when it would be strongly desirable to do so; a person who is trying to avoid insulting an individual he or she finds highly unattractive might, nevertheless, show a brief expression of disgust before being able to reassume a neutral expression. Microexpressions are one example of this phenomenon. The close link between emotion and expression can also work in the other direction; it has been observed that voluntarily assuming an expression can actually cause the associated emotion."}, {"label": "C", "text": "Some expressions can be accurately interpreted even between members of different species—anger and extreme contentment being the primary examples. Others, however, are difficult to interpret even in familiar individuals. For instance, disgust and fear can be tough to tell apart. Because faces have only a limited range of movement, expressions rely upon fairly minuscule differences in the proportion and relative position of facial features, and reading them requires considerable sensitivity to these differences. Some faces are often falsely read as expressing some emotion, even when they are neutral, because their proportions naturally resemble those another face would temporarily assume when emoting."}, {"label": "D", "text": "Also, a person's eyes reveal much about how they are feeling, or what they are thinking. Blink rate can reveal how nervous or at ease a person may be. Research by Boston College professor Joe Tecce suggests that stress levels are revealed by blink rates. He supports his data with statistics on the relation between the blink rates of presidential candidates and their success in their races. Tecce claims that the faster blinker in the presidential debates has lost every election since 1980. Though Tecce's data are interesting, it is important to recognize that non-verbal communication is multi-channeled, and focusing on only one aspect is reckless. Nervousness can also be measured by examining each candidate's perspiration, eye contact and stiffness."}, {"label": "E", "text": "As Charles Darwin noted in his book The Expression of the Emotions in Man and Animals, the young and the old of widely different races, in both humans and animals, express the same state of mind by the same movements. Still, up to the mid-20th century most anthropologists believed that facial expressions were entirely learned and could therefore differ among cultures. Studies conducted in the 1960s by Paul Ekman eventually supported Darwin's belief to a large degree."}, {"label": "F", "text": "Ekman's work on facial expressions had its starting point in the work of psychologist Silvan Tomkins. Ekman showed that contrary to the belief of some anthropologists including Margaret Mead, facial expressions of emotion are not culturally determined, but universal across human cultures. The South Fore people of New Guinea were chosen as subjects for one such survey. The study consisted of 189 adults and 130 children from among a very isolated population, as well as twenty-three members of the culture who lived a less isolated lifestyle as a control group. Participants were told a story that described one particular emotion; they were then shown three pictures (two for children) of facial expressions and asked to match the picture which expressed the story's emotion."}, {"label": "G", "text": "While the isolated South Fore people could identify emotions with the same accuracy as the non-isolated control group, problems associated with the study include the fact that both fear and surprise were constantly misidentified. The study concluded that certain facial expressions correspond to particular emotions and cannot be concealed, regardless of cultural background, and regardless of whether or not the culture has been isolated or exposed to the mainstream."}, {"label": "H", "text": "Expressions Ekman found to be universal included those indicating anger, disgust, fear, joy, sadness, and surprise (note that none of these emotions has a definitive social component, such as shame, pride, or schadenfreude). Findings on contempt (which is social) are less clear, though there is at least some preliminary evidence that this emotion and its expression are universally recognized. This may suggest that the facial expressions are largely related to the mind and individual parts of the face can express specific emotions."}], "questions": [{"id": "facial-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "These movements convey the emotional state of the individual to observers.", "target": "convey", "options": ["communicate or express", "deliberately hide", "physically reshape"], "answer": 0, "explanations": ["此處 convey 表示「傳達、表達」。須依原句語境理解。", "這個選項表示「刻意隱藏」；原句要表達的是「傳達、表達」。", "這個選項表示「實際改造形狀」；原句要表達的是「傳達、表達」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Facial expressions are a form of nonverbal communication.", "target": "nonverbal communication", "options": ["communication without words", "communication only through writing", "speech in a foreign language"], "answer": 0, "explanations": ["此處 nonverbal communication 表示「非語言溝通」。須依原句語境理解。", "這個選項表示「僅透過書寫溝通」；原句要表達的是「非語言溝通」。", "這個選項表示「以外語說話」；原句要表達的是「非語言溝通」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "They are a primary means of conveying social information among humans, but also occur in most other mammals and some other animal species.", "target": "primary means", "options": ["a principal method", "an unimportant side effect", "the first numerical average"], "answer": 0, "explanations": ["此處 primary means 表示「主要方式」。須依原句語境理解。", "這個選項表示「不重要的副作用」；原句要表達的是「主要方式」。", "這個選項表示「第一個數值平均」；原句要表達的是「主要方式」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "Facial expressions and their interpretation can, to some extent, vary between cultures, as described in the works of Charles Darwin.", "target": "interpretation", "options": ["the meaning attributed to something", "a direct physical cause", "a fixed biological measurement"], "answer": 0, "explanations": ["此處 interpretation 表示「解讀」。須依原句語境理解。", "這個選項表示「直接物理原因」；原句要表達的是「解讀」。", "這個選項表示「固定生物測量值」；原句要表達的是「解讀」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "Facial expressions and their interpretation can, to some extent, vary between cultures, as described in the works of Charles Darwin.", "target": "vary", "options": ["differ or change", "remain identical", "be deliberately concealed"], "answer": 0, "explanations": ["此處 vary 表示「有所差異、變化」。須依原句語境理解。", "這個選項表示「維持相同」；原句要表達的是「有所差異、變化」。", "這個選項表示「被刻意隱藏」；原句要表達的是「有所差異、變化」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-6", "mode": "vocab", "paragraph": "B", "sentence": "Humans can adopt a facial expression voluntarily.", "target": "voluntarily", "options": ["by conscious choice", "without any control", "under an external legal order"], "answer": 0, "explanations": ["此處 voluntarily 表示「自願、有意識地」。須依原句語境理解。", "這個選項表示「完全無法控制地」；原句要表達的是「自願、有意識地」。", "這個選項表示「受外部法律命令」；原句要表達的是「自願、有意識地」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-7", "mode": "vocab", "paragraph": "B", "sentence": "However, because expressions are closely tied to emotion, they are more often involuntary.", "target": "involuntary", "options": ["not under conscious control", "always deliberately performed", "physically impossible"], "answer": 0, "explanations": ["此處 involuntary 表示「非自主的、不由自主的」。須依原句語境理解。", "這個選項表示「總是刻意表現的」；原句要表達的是「非自主的、不由自主的」。", "這個選項表示「物理上不可能的」；原句要表達的是「非自主的、不由自主的」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-8", "mode": "vocab", "paragraph": "B", "sentence": "However, because expressions are closely tied to emotion, they are more often involuntary.", "target": "closely tied to", "options": ["strongly connected with", "completely independent of", "physically fastened by rope to"], "answer": 0, "explanations": ["此處 closely tied to 表示「與……密切相連」。須依原句語境理解。", "這個選項表示「完全獨立於」；原句要表達的是「與……密切相連」。", "這個選項表示「用繩索實際綁住」；原句要表達的是「與……密切相連」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-9", "mode": "vocab", "paragraph": "B", "sentence": "It can be nearly impossible to avoid expressions for certain emotions, even when it would be strongly desirable to do so; a person who is trying to avoid insulting an individual he or she finds highly unattractive might, nevertheless, show a brief expression of disgust before being able to reassume a neutral expression.", "target": "desirable", "options": ["wanted or considered worthwhile", "morally impossible", "entirely irrelevant"], "answer": 0, "explanations": ["此處 desirable 表示「值得期待、想要的」。須依原句語境理解。", "這個選項表示「道德上不可能的」；原句要表達的是「值得期待、想要的」。", "這個選項表示「完全無關的」；原句要表達的是「值得期待、想要的」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "It can be nearly impossible to avoid expressions for certain emotions, even when it would be strongly desirable to do so; a person who is trying to avoid insulting an individual he or she finds highly unattractive might, nevertheless, show a brief expression of disgust before being able to reassume a neutral expression.", "target": "insulting", "options": ["offending or showing disrespect to", "expressing warm approval of", "formally diagnosing"], "answer": 0, "explanations": ["此處 insulting 表示「冒犯、侮辱」。須依原句語境理解。", "這個選項表示「表達熱烈肯定」；原句要表達的是「冒犯、侮辱」。", "這個選項表示「正式診斷」；原句要表達的是「冒犯、侮辱」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "It can be nearly impossible to avoid expressions for certain emotions, even when it would be strongly desirable to do so; a person who is trying to avoid insulting an individual he or she finds highly unattractive might, nevertheless, show a brief expression of disgust before being able to reassume a neutral expression.", "target": "disgust", "options": ["a strong feeling of revulsion", "mild curiosity", "complete satisfaction"], "answer": 0, "explanations": ["此處 disgust 表示「厭惡」。須依原句語境理解。", "這個選項表示「輕微好奇」；原句要表達的是「厭惡」。", "這個選項表示「完全滿意」；原句要表達的是「厭惡」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "It can be nearly impossible to avoid expressions for certain emotions, even when it would be strongly desirable to do so; a person who is trying to avoid insulting an individual he or she finds highly unattractive might, nevertheless, show a brief expression of disgust before being able to reassume a neutral expression.", "target": "reassume", "options": ["take on again", "permanently abandon", "mistakenly predict"], "answer": 0, "explanations": ["此處 reassume 表示「重新恢復、再度呈現」。須依原句語境理解。", "這個選項表示「永久放棄」；原句要表達的是「重新恢復、再度呈現」。", "這個選項表示「錯誤預測」；原句要表達的是「重新恢復、再度呈現」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "It can be nearly impossible to avoid expressions for certain emotions, even when it would be strongly desirable to do so; a person who is trying to avoid insulting an individual he or she finds highly unattractive might, nevertheless, show a brief expression of disgust before being able to reassume a neutral expression.", "target": "neutral expression", "options": ["a face showing no particular emotion", "an expression of intense anger", "a deliberately flattering comment"], "answer": 0, "explanations": ["此處 neutral expression 表示「中性、未顯特定情緒的表情」。須依原句語境理解。", "這個選項表示「強烈憤怒表情」；原句要表達的是「中性、未顯特定情緒的表情」。", "這個選項表示「刻意奉承的評論」；原句要表達的是「中性、未顯特定情緒的表情」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-14", "mode": "vocab", "paragraph": "B", "sentence": "Microexpressions are one example of this phenomenon.", "target": "Microexpressions", "options": ["very brief facial expressions that may reveal emotion", "expressions shown only in writing", "permanent differences in facial bone structure"], "answer": 0, "explanations": ["此處 Microexpressions 表示「微表情」。須依原句語境理解。", "這個選項表示「只在書寫呈現的表達」；原句要表達的是「微表情」。", "這個選項表示「永久臉部骨骼差異」；原句要表達的是「微表情」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-15", "mode": "vocab", "paragraph": "B", "sentence": "The close link between emotion and expression can also work in the other direction; it has been observed that voluntarily assuming an expression can actually cause the associated emotion.", "target": "assuming an expression", "options": ["adopting or putting on a facial expression", "guessing the meaning of another's expression", "preventing all muscle movement"], "answer": 0, "explanations": ["此處 assuming an expression 表示「擺出、呈現某種表情」。須依原句語境理解。", "這個選項表示「猜測別人表情含義」；原句要表達的是「擺出、呈現某種表情」。", "這個選項表示「阻止全部肌肉活動」；原句要表達的是「擺出、呈現某種表情」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-16", "mode": "vocab", "paragraph": "C", "sentence": "Some expressions can be accurately interpreted even between members of different species—anger and extreme contentment being the primary examples.", "target": "contentment", "options": ["a state of happiness and satisfaction", "contempt for others", "a lack of consciousness"], "answer": 0, "explanations": ["此處 contentment 表示「滿足、知足」。須依原句語境理解。", "這個選項表示「鄙視他人」；原句要表達的是「滿足、知足」。", "這個選項表示「失去意識」；原句要表達的是「滿足、知足」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-17", "mode": "vocab", "paragraph": "C", "sentence": "For instance, disgust and fear can be tough to tell apart.", "target": "tell apart", "options": ["distinguish between", "describe at great length", "make identical"], "answer": 0, "explanations": ["此處 tell apart 表示「分辨、區分」。須依原句語境理解。", "這個選項表示「詳盡描述」；原句要表達的是「分辨、區分」。", "這個選項表示「使相同」；原句要表達的是「分辨、區分」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-18", "mode": "vocab", "paragraph": "C", "sentence": "Because faces have only a limited range of movement, expressions rely upon fairly minuscule differences in the proportion and relative position of facial features, and reading them requires considerable sensitivity to these differences.", "target": "minuscule", "options": ["extremely small", "large and immediately obvious", "entirely imaginary"], "answer": 0, "explanations": ["此處 minuscule 表示「極微小的」。須依原句語境理解。", "這個選項表示「巨大且立刻明顯的」；原句要表達的是「極微小的」。", "這個選項表示「完全想像的」；原句要表達的是「極微小的」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-19", "mode": "vocab", "paragraph": "C", "sentence": "Because faces have only a limited range of movement, expressions rely upon fairly minuscule differences in the proportion and relative position of facial features, and reading them requires considerable sensitivity to these differences.", "target": "relative position", "options": ["where a feature lies in relation to other features", "the location of a family member", "an absolute geographical coordinate"], "answer": 0, "explanations": ["此處 relative position 表示「相對位置」。須依原句語境理解。", "這個選項表示「親屬所在位置」；原句要表達的是「相對位置」。", "這個選項表示「絕對地理座標」；原句要表達的是「相對位置」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-20", "mode": "vocab", "paragraph": "C", "sentence": "Because faces have only a limited range of movement, expressions rely upon fairly minuscule differences in the proportion and relative position of facial features, and reading them requires considerable sensitivity to these differences.", "target": "sensitivity", "options": ["ability to notice fine differences", "inability to remain calm", "certainty without observation"], "answer": 0, "explanations": ["此處 sensitivity 表示「敏銳度、辨識細微差異的能力」。須依原句語境理解。", "這個選項表示「無法保持冷靜」；原句要表達的是「敏銳度、辨識細微差異的能力」。", "這個選項表示「不觀察便確定」；原句要表達的是「敏銳度、辨識細微差異的能力」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-21", "mode": "vocab", "paragraph": "C", "sentence": "Some faces are often falsely read as expressing some emotion, even when they are neutral, because their proportions naturally resemble those another face would temporarily assume when emoting.", "target": "resemble", "options": ["be similar to", "be caused directly by", "be entirely different from"], "answer": 0, "explanations": ["此處 resemble 表示「與……相似」。須依原句語境理解。", "這個選項表示「直接由……造成」；原句要表達的是「與……相似」。", "這個選項表示「與……完全不同」；原句要表達的是「與……相似」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-22", "mode": "vocab", "paragraph": "C", "sentence": "Some faces are often falsely read as expressing some emotion, even when they are neutral, because their proportions naturally resemble those another face would temporarily assume when emoting.", "target": "emoting", "options": ["showing emotion", "conducting an election", "measuring facial width"], "answer": 0, "explanations": ["此處 emoting 表示「表現情緒」。須依原句語境理解。", "這個選項表示「舉行選舉」；原句要表達的是「表現情緒」。", "這個選項表示「測量臉寬」；原句要表達的是「表現情緒」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-23", "mode": "vocab", "paragraph": "D", "sentence": "Blink rate can reveal how nervous or at ease a person may be.", "target": "Blink rate", "options": ["the frequency of closing and opening the eyelids", "the speed of eye movement from side to side", "a measure of pupil size"], "answer": 0, "explanations": ["此處 Blink rate 表示「眨眼頻率」。須依原句語境理解。", "這個選項表示「眼球左右移動速度」；原句要表達的是「眨眼頻率」。", "這個選項表示「瞳孔大小測量」；原句要表達的是「眨眼頻率」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-24", "mode": "vocab", "paragraph": "D", "sentence": "Blink rate can reveal how nervous or at ease a person may be.", "target": "at ease", "options": ["relaxed and comfortable", "under strong pressure", "unable to see clearly"], "answer": 0, "explanations": ["此處 at ease 表示「放鬆自在的」。須依原句語境理解。", "這個選項表示「壓力強大的」；原句要表達的是「放鬆自在的」。", "這個選項表示「無法看清楚的」；原句要表達的是「放鬆自在的」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-25", "mode": "vocab", "paragraph": "D", "sentence": "He supports his data with statistics on the relation between the blink rates of presidential candidates and their success in their races.", "target": "statistics", "options": ["numerical information used for analysis", "unrecorded personal rumours", "instructions for actors"], "answer": 0, "explanations": ["此處 statistics 表示「統計數據」。須依原句語境理解。", "這個選項表示「沒有紀錄的個人傳聞」；原句要表達的是「統計數據」。", "這個選項表示「給演員的指令」；原句要表達的是「統計數據」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-26", "mode": "vocab", "paragraph": "D", "sentence": "He supports his data with statistics on the relation between the blink rates of presidential candidates and their success in their races.", "target": "presidential candidates", "options": ["people competing to become president", "judges counting votes", "all eligible voters"], "answer": 0, "explanations": ["此處 presidential candidates 表示「總統候選人」。須依原句語境理解。", "這個選項表示「計票裁判」；原句要表達的是「總統候選人」。", "這個選項表示「所有合格選民」；原句要表達的是「總統候選人」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-27", "mode": "vocab", "paragraph": "D", "sentence": "Though Tecce's data are interesting, it is important to recognize that non-verbal communication is multi-channeled, and focusing on only one aspect is reckless.", "target": "multi-channeled", "options": ["operating through several sources of signals", "limited to a single signal", "available only on television"], "answer": 0, "explanations": ["此處 multi-channeled 表示「多管道的」。須依原句語境理解。", "這個選項表示「侷限單一訊號的」；原句要表達的是「多管道的」。", "這個選項表示「僅限電視播放的」；原句要表達的是「多管道的」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-28", "mode": "vocab", "paragraph": "D", "sentence": "Though Tecce's data are interesting, it is important to recognize that non-verbal communication is multi-channeled, and focusing on only one aspect is reckless.", "target": "reckless", "options": ["careless about risks or consequences", "cautious and well qualified", "accurate beyond all doubt"], "answer": 0, "explanations": ["此處 reckless 表示「魯莽、不顧後果的」。須依原句語境理解。", "這個選項表示「審慎且充分限定的」；原句要表達的是「魯莽、不顧後果的」。", "這個選項表示「準確無疑的」；原句要表達的是「魯莽、不顧後果的」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-29", "mode": "vocab", "paragraph": "D", "sentence": "Nervousness can also be measured by examining each candidate's perspiration, eye contact and stiffness.", "target": "perspiration", "options": ["sweat or the process of sweating", "the movement of the eyelids", "a sudden change in opinion"], "answer": 0, "explanations": ["此處 perspiration 表示「汗、出汗」。須依原句語境理解。", "這個選項表示「眼皮動作」；原句要表達的是「汗、出汗」。", "這個選項表示「突然改變意見」；原句要表達的是「汗、出汗」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-30", "mode": "vocab", "paragraph": "D", "sentence": "Nervousness can also be measured by examining each candidate's perspiration, eye contact and stiffness.", "target": "stiffness", "options": ["rigidity or lack of relaxed movement", "a state of complete sleep", "unusually fast movement"], "answer": 0, "explanations": ["此處 stiffness 表示「僵硬」。須依原句語境理解。", "這個選項表示「完全睡眠」；原句要表達的是「僵硬」。", "這個選項表示「異常快速動作」；原句要表達的是「僵硬」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-31", "mode": "vocab", "paragraph": "E", "sentence": "Still, up to the mid-20th century most anthropologists believed that facial expressions were entirely learned and could therefore differ among cultures.", "target": "anthropologists", "options": ["researchers studying human societies and cultures", "specialists in weather prediction", "researchers studying only rocks"], "answer": 0, "explanations": ["此處 anthropologists 表示「人類學家」。須依原句語境理解。", "這個選項表示「氣象預測專家」；原句要表達的是「人類學家」。", "這個選項表示「只研究岩石者」；原句要表達的是「人類學家」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-32", "mode": "vocab", "paragraph": "E", "sentence": "Studies conducted in the 1960s by Paul Ekman eventually supported Darwin's belief to a large degree.", "target": "conducted", "options": ["carried out", "formally cancelled", "physically transmitted electricity"], "answer": 0, "explanations": ["此處 conducted 表示「進行、實施」。須依原句語境理解。", "這個選項表示「正式取消」；原句要表達的是「進行、實施」。", "這個選項表示「實際傳導電流」；原句要表達的是「進行、實施」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-33", "mode": "vocab", "paragraph": "F", "sentence": "Ekman showed that contrary to the belief of some anthropologists including Margaret Mead, facial expressions of emotion are not culturally determined, but universal across human cultures.", "target": "contrary to", "options": ["in opposition to", "in full agreement with", "as a physical result of"], "answer": 0, "explanations": ["此處 contrary to 表示「與……相反」。須依原句語境理解。", "這個選項表示「與……完全一致」；原句要表達的是「與……相反」。", "這個選項表示「作為……物理結果」；原句要表達的是「與……相反」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-34", "mode": "vocab", "paragraph": "F", "sentence": "Ekman showed that contrary to the belief of some anthropologists including Margaret Mead, facial expressions of emotion are not culturally determined, but universal across human cultures.", "target": "culturally determined", "options": ["shaped by cultural influences", "entirely independent of cultural experience", "selected by random mechanical sampling"], "answer": 0, "explanations": ["此處 culturally determined 表示「由文化因素決定的」。須依原句語境理解。", "這個選項表示「完全不受文化經驗影響的」；原句要表達的是「由文化因素決定的」。", "這個選項表示「由隨機機械抽樣選出的」；原句要表達的是「由文化因素決定的」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-35", "mode": "vocab", "paragraph": "F", "sentence": "Ekman showed that contrary to the belief of some anthropologists including Margaret Mead, facial expressions of emotion are not culturally determined, but universal across human cultures.", "target": "universal", "options": ["applicable or found across all the relevant groups", "limited to a single community", "impossible for anyone to recognise"], "answer": 0, "explanations": ["此處 universal 表示「普遍存在、跨群體共有的」。須依原句語境理解。", "這個選項表示「只限單一社群的」；原句要表達的是「普遍存在、跨群體共有的」。", "這個選項表示「任何人都無法辨認的」；原句要表達的是「普遍存在、跨群體共有的」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-36", "mode": "vocab", "paragraph": "F", "sentence": "The South Fore people of New Guinea were chosen as subjects for one such survey.", "target": "subjects", "options": ["people being studied in research", "school course topics", "people ruling the country"], "answer": 0, "explanations": ["此處 subjects 表示「研究受試者」。須依原句語境理解。", "這個選項表示「學校科目」；原句要表達的是「研究受試者」。", "這個選項表示「統治國家的人」；原句要表達的是「研究受試者」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-37", "mode": "vocab", "paragraph": "F", "sentence": "The study consisted of 189 adults and 130 children from among a very isolated population, as well as twenty-three members of the culture who lived a less isolated lifestyle as a control group.", "target": "control group", "options": ["a comparison group used to evaluate research results", "a team managing election campaigns", "all researchers conducting the study"], "answer": 0, "explanations": ["此處 control group 表示「研究對照組」。須依原句語境理解。", "這個選項表示「管理選戰的團隊」；原句要表達的是「研究對照組」。", "這個選項表示「進行研究的全部學者」；原句要表達的是「研究對照組」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-38", "mode": "vocab", "paragraph": "F", "sentence": "Participants were told a story that described one particular emotion; they were then shown three pictures (two for children) of facial expressions and asked to match the picture which expressed the story's emotion.", "target": "Participants", "options": ["people taking part in a study", "people explicitly excluded", "only the senior researchers"], "answer": 0, "explanations": ["此處 Participants 表示「參與者、受試者」。須依原句語境理解。", "這個選項表示「明確被排除的人」；原句要表達的是「參與者、受試者」。", "這個選項表示「僅資深研究員」；原句要表達的是「參與者、受試者」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-39", "mode": "vocab", "paragraph": "G", "sentence": "While the isolated South Fore people could identify emotions with the same accuracy as the non-isolated control group, problems associated with the study include the fact that both fear and surprise were constantly misidentified.", "target": "misidentified", "options": ["identified incorrectly", "never presented to anyone", "recognised without error"], "answer": 0, "explanations": ["此處 misidentified 表示「辨識錯誤的」。須依原句語境理解。", "這個選項表示「從未呈現給任何人的」；原句要表達的是「辨識錯誤的」。", "這個選項表示「無誤辨識的」；原句要表達的是「辨識錯誤的」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-40", "mode": "vocab", "paragraph": "G", "sentence": "The study concluded that certain facial expressions correspond to particular emotions and cannot be concealed, regardless of cultural background, and regardless of whether or not the culture has been isolated or exposed to the mainstream.", "target": "correspond to", "options": ["have a matching relationship with", "completely prevent", "communicate by sending letters to"], "answer": 0, "explanations": ["此處 correspond to 表示「與……對應」。須依原句語境理解。", "這個選項表示「完全阻止」；原句要表達的是「與……對應」。", "這個選項表示「以寄信方式聯繫」；原句要表達的是「與……對應」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-41", "mode": "vocab", "paragraph": "G", "sentence": "The study concluded that certain facial expressions correspond to particular emotions and cannot be concealed, regardless of cultural background, and regardless of whether or not the culture has been isolated or exposed to the mainstream.", "target": "concealed", "options": ["hidden from view or recognition", "deliberately emphasised", "made scientifically measurable"], "answer": 0, "explanations": ["此處 concealed 表示「隱藏、掩飾」。須依原句語境理解。", "這個選項表示「刻意強調」；原句要表達的是「隱藏、掩飾」。", "這個選項表示「使可科學測量」；原句要表達的是「隱藏、掩飾」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-42", "mode": "vocab", "paragraph": "G", "sentence": "The study concluded that certain facial expressions correspond to particular emotions and cannot be concealed, regardless of cultural background, and regardless of whether or not the culture has been isolated or exposed to the mainstream.", "target": "exposed to the mainstream", "options": ["in contact with the dominant wider culture", "covered by flowing water", "isolated from every outside influence"], "answer": 0, "explanations": ["此處 exposed to the mainstream 表示「接觸主流文化」。須依原句語境理解。", "這個選項表示「被流水覆蓋」；原句要表達的是「接觸主流文化」。", "這個選項表示「與外界影響完全隔離」；原句要表達的是「接觸主流文化」。"], "tag": "搭配與語境義"}, {"id": "facial-vocab-43", "mode": "vocab", "paragraph": "H", "sentence": "Expressions Ekman found to be universal included those indicating anger, disgust, fear, joy, sadness, and surprise (note that none of these emotions has a definitive social component, such as shame, pride, or schadenfreude).", "target": "definitive", "options": ["clear and conclusive", "extremely uncertain", "merely decorative"], "answer": 0, "explanations": ["此處 definitive 表示「明確、具決定性的」。須依原句語境理解。", "這個選項表示「極不確定的」；原句要表達的是「明確、具決定性的」。", "這個選項表示「僅裝飾性的」；原句要表達的是「明確、具決定性的」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-44", "mode": "vocab", "paragraph": "H", "sentence": "Expressions Ekman found to be universal included those indicating anger, disgust, fear, joy, sadness, and surprise (note that none of these emotions has a definitive social component, such as shame, pride, or schadenfreude).", "target": "component", "options": ["a constituent part or element", "the complete result only", "an unrelated comparison"], "answer": 0, "explanations": ["此處 component 表示「組成部分、要素」。須依原句語境理解。", "這個選項表示「僅完整結果」；原句要表達的是「組成部分、要素」。", "這個選項表示「無關比較」；原句要表達的是「組成部分、要素」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-45", "mode": "vocab", "paragraph": "H", "sentence": "Expressions Ekman found to be universal included those indicating anger, disgust, fear, joy, sadness, and surprise (note that none of these emotions has a definitive social component, such as shame, pride, or schadenfreude).", "target": "schadenfreude", "options": ["pleasure at another person's misfortune", "grief at another's success", "a feeling of personal exhaustion"], "answer": 0, "explanations": ["此處 schadenfreude 表示「幸災樂禍」。須依原句語境理解。", "這個選項表示「因別人成功而悲傷」；原句要表達的是「幸災樂禍」。", "這個選項表示「個人疲憊感」；原句要表達的是「幸災樂禍」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-46", "mode": "vocab", "paragraph": "H", "sentence": "Findings on contempt (which is social) are less clear, though there is at least some preliminary evidence that this emotion and its expression are universally recognized.", "target": "contempt", "options": ["a feeling that someone is unworthy of respect", "quiet satisfaction with one's own situation", "a strong desire to help"], "answer": 0, "explanations": ["此處 contempt 表示「輕蔑、鄙視」。須依原句語境理解。", "這個選項表示「對自身處境安靜滿足」；原句要表達的是「輕蔑、鄙視」。", "這個選項表示「強烈助人願望」；原句要表達的是「輕蔑、鄙視」。"], "tag": "字彙與語境義"}, {"id": "facial-vocab-47", "mode": "vocab", "paragraph": "H", "sentence": "Findings on contempt (which is social) are less clear, though there is at least some preliminary evidence that this emotion and its expression are universally recognized.", "target": "preliminary evidence", "options": ["initial information that has not yet settled the issue", "final conclusive proof", "information known to be fabricated"], "answer": 0, "explanations": ["此處 preliminary evidence 表示「初步證據」。須依原句語境理解。", "這個選項表示「最終確證」；原句要表達的是「初步證據」。", "這個選項表示「已知捏造的資料」；原句要表達的是「初步證據」。"], "tag": "搭配與語境義"}, {"id": "facial-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "They are a primary means of conveying social information among humans, but also occur in most other mammals and some other animal species.", "target": "", "options": ["Facial expressions convey social information in humans and also occur in other animal species.", "Only humans ever display facial expressions.", "Every species uses facial expressions with exactly the same meanings."], "answer": 0, "explanations": ["but also 表人類以外也有，不代表所有物種含義全同。", "other mammals and some other species 排除人類獨有。", "some 與文化變化都不支持每種完全一致。"], "tag": "長難句理解", "structure": "They are...among humans 為主句；but also occur...共用 facial expressions 為主詞；some 限定其他動物範圍；原文明顯 aliens 誤字已修正。"}, {"id": "facial-paraphrase-2", "mode": "paraphrase", "paragraph": "B", "sentence": "However, because expressions are closely tied to emotion, they are more often involuntary.", "target": "", "options": ["People can deliberately make expressions, but expressions are often beyond conscious control because of their connection with emotion.", "People consciously control every expression at all times.", "No person can ever intentionally adopt an expression."], "answer": 0, "explanations": ["However 與 more often 區分可自願擺表情和常有非自主反應。", "often involuntary 不容改成全都可控。", "前句明說 can adopt voluntarily，非完全不能。"], "tag": "長難句理解", "structure": "because...為原因子句；expressions are closely tied...為被動關聯；they are more often involuntary 為主句；often 不等於 always。"}, {"id": "facial-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "It can be nearly impossible to avoid expressions for certain emotions, even when it would be strongly desirable to do so; a person who is trying to avoid insulting an individual he or she finds highly unattractive might, nevertheless, show a brief expression of disgust before being able to reassume a neutral expression.", "target": "", "options": ["Someone trying not to offend may briefly reveal disgust before recovering a neutral face.", "The wish not to offend guarantees no sign of disgust can appear.", "A neutral face must appear before any feeling or expression of disgust."], "answer": 0, "explanations": ["might、nevertheless、before 連出意圖未必成功及先後。", "想避免不等於保證做到，原句有可能洩漏。", "before being able to reassume 表厭惡先、恢復中性後。"], "tag": "長難句理解", "structure": "a person who is trying...為長主詞；he or she finds...修飾 individual；might show 為限定主幹；before being able...省略相同主詞。"}, {"id": "facial-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "The close link between emotion and expression can also work in the other direction; it has been observed that voluntarily assuming an expression can actually cause the associated emotion.", "target": "", "options": ["The passage reports that deliberately putting on an expression can itself lead to a corresponding emotion.", "Emotion can cause expression, but expression can never influence emotion.", "The passage guarantees that every deliberate expression always produces an identical feeling."], "answer": 0, "explanations": ["other direction 指由表情到情緒；can 保留可能。", "原句明說 can cause，不能絕對排除。", "can 非 always，並未說每次都同強度情緒。"], "tag": "長難句理解", "structure": "The close link...can also work...先引反向作用；分號後 it has been observed that...為被動報告；voluntarily assuming...為動名詞主詞；cause 為可能因果主張。"}, {"id": "facial-paraphrase-5", "mode": "paraphrase", "paragraph": "C", "sentence": "Some expressions can be accurately interpreted even between members of different species—anger and extreme contentment being the primary examples.", "target": "", "options": ["Some expressions are interpretable even across species, whereas others can be difficult within familiar individuals.", "Every facial expression is equally easy to interpret in every animal.", "Being familiar with a person guarantees an error-free reading of all expressions."], "answer": 0, "explanations": ["Some 與 Others 切分兩種情況，even 強調超出預期。", "some 不等於 every，且後文強調困難。", "even in familiar individuals 表熟悉仍可能難解。"], "tag": "長難句理解", "structure": "Some expressions can be interpreted 為被動主幹；even between...表跨物種範圍；破折號列 anger、contentment 為例；下一句 Others 為對照。"}, {"id": "facial-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "Because faces have only a limited range of movement, expressions rely upon fairly minuscule differences in the proportion and relative position of facial features, and reading them requires considerable sensitivity to these differences.", "target": "", "options": ["Because facial movement is limited, identifying expressions depends on noticing very small differences in features.", "Facial expressions are always obvious because faces can move without limit.", "Accurate interpretation requires ignoring all differences in feature position."], "answer": 0, "explanations": ["Because 解釋細小差異的重要；reading them 為解讀表情。", "limited 與 minuscule 都不支持無限移動且總明顯。", "rely upon differences 不能改成忽略差異。"], "tag": "長難句理解", "structure": "Because faces have...為原因；expressions rely upon...第一主句；and reading them requires...第二主句，reading 為動名詞，them 指 expressions。"}, {"id": "facial-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "Some faces are often falsely read as expressing some emotion, even when they are neutral, because their proportions naturally resemble those another face would temporarily assume when emoting.", "target": "", "options": ["A neutral face may be misread as emotional because its natural proportions resemble an emotional configuration on another face.", "Any face read as emotional must actually be experiencing that emotion.", "Neutral faces can never resemble expressions on other people."], "answer": 0, "explanations": ["falsely read 與 even when neutral 說明外觀和實際情緒可能不一致。", "將誤讀改成必然準確。", "原句 because...resemble 明說可能相似。"], "tag": "長難句理解", "structure": "Some faces are...read as...為被動主句；even when...為讓步；because...為成因；those 代指 proportions；another face would assume...修飾 those。"}, {"id": "facial-paraphrase-8", "mode": "paraphrase", "paragraph": "D", "sentence": "Research by Boston College professor Joe Tecce suggests that stress levels are revealed by blink rates.", "target": "", "options": ["Tecce's research is presented as suggesting an association between blink frequency and stress.", "The sentence proves blinking is the sole cause of every form of stress.", "The sentence says stress and blinking can never be related."], "answer": 0, "explanations": ["suggests 與 revealed by 描述指標關係，非眨眼造成壓力。", "關聯或指標不等於單一因果來源。", "研究主張有關，不能改成永無關聯。"], "tag": "長難句理解", "structure": "Research by...為主詞；suggests 後接 that 受詞子句；stress levels are revealed by...為被動；by blink rates 說明觀察指標。"}, {"id": "facial-paraphrase-9", "mode": "paraphrase", "paragraph": "D", "sentence": "Though Tecce's data are interesting, it is important to recognize that non-verbal communication is multi-channeled, and focusing on only one aspect is reckless.", "target": "", "options": ["The writer acknowledges interest in the data but cautions against judging complex nonverbal communication through one signal alone.", "The writer dismisses all blink data as worthless and refuses any further observation.", "The writer recommends using blink rate alone as a conclusive test."], "answer": 0, "explanations": ["Though...interesting 是讓步；only one aspect is reckless 才是核心警示。", "原句承認 interesting，不是全盤無價值。", "reckless 是反對單一指標判斷，非建議。"], "tag": "長難句理解", "structure": "Though...為讓步；it is important to recognise...為虛主詞主句；that...包含 multi-channeled；and focusing...is reckless 補充不當簡化。"}, {"id": "facial-paraphrase-10", "mode": "paraphrase", "paragraph": "E", "sentence": "Still, up to the mid-20th century most anthropologists believed that facial expressions were entirely learned and could therefore differ among cultures.", "target": "", "options": ["Most anthropologists once favoured a learned-expression account, while later Ekman studies supported much of Darwin's earlier view.", "Ekman's research preceded Darwin and caused Darwin to write his book.", "Every anthropologist had always accepted Darwin without disagreement."], "answer": 0, "explanations": ["Still 對照原有主張；eventually supported...to a large degree 是後來研究。", "Darwin 是較早觀點，1960s 是後來研究，時序倒置。", "most...believed entirely learned 與始終全體接受不同。"], "tag": "長難句理解", "structure": "up to the mid-20th century 為時間範圍；most anthropologists believed that...為主幹；could therefore...表其推論；後句 studies...supported...標示後續證據。"}, {"id": "facial-paraphrase-11", "mode": "paraphrase", "paragraph": "F", "sentence": "Ekman showed that contrary to the belief of some anthropologists including Margaret Mead, facial expressions of emotion are not culturally determined, but universal across human cultures.", "target": "", "options": ["Ekman's findings are presented as challenging the claim that emotional expressions are determined by culture.", "Ekman's findings are described as confirming cultural determination as the only explanation.", "The sentence claims Mead and Ekman held precisely identical views."], "answer": 0, "explanations": ["contrary to 明確標記對部分人類學家看法的挑戰。", "not...but...對照文化決定與普遍性，不能反讀。", "contrary 排除完全同一觀點。"], "tag": "長難句理解", "structure": "Ekman showed that...為報告主幹；contrary to...插入對照；including Margaret Mead 修飾 anthropologists；not culturally determined,but universal 為嵌入對照。"}, {"id": "facial-paraphrase-12", "mode": "paraphrase", "paragraph": "F", "sentence": "The study consisted of 189 adults and 130 children from among a very isolated population, as well as twenty-three members of the culture who lived a less isolated lifestyle as a control group.", "target": "", "options": ["The comparison included an isolated population and a smaller group from the same culture with less isolated lives.", "The control group came from a completely unrelated culture.", "The study compared only adults and included no children or control participants."], "answer": 0, "explanations": ["members of the culture 指同文化；as a control group 指比較角色。", "不是跨完全無關文化的對照。", "明列130 children 與23對照者，不可刪除。"], "tag": "長難句理解", "structure": "The study consisted of...為主幹；189 adults 與130 children 來自孤立族群；as well as 加入23人；who lived...修飾 members；as a control group 表角色。"}, {"id": "facial-paraphrase-13", "mode": "paraphrase", "paragraph": "F", "sentence": "Participants were told a story that described one particular emotion; they were then shown three pictures (two for children) of facial expressions and asked to match the picture which expressed the story's emotion.", "target": "", "options": ["After hearing a story, participants chose the picture matching its emotion, with fewer pictures shown to children.", "All participants were asked to draw new faces without seeing any pictures.", "Children saw more pictures than adults and heard no stories."], "answer": 0, "explanations": ["three pictures、two for children 與故事配對流程明確。", "asked to match picture 不是畫圖。", "兒童兩張比三張少，且參與者皆先聽故事。"], "tag": "長難句理解", "structure": "Participants were told...為第一被動；that described...修飾 story；分號後 were shown...and asked...為並列被動；which...修飾 picture。"}, {"id": "facial-paraphrase-14", "mode": "paraphrase", "paragraph": "G", "sentence": "While the isolated South Fore people could identify emotions with the same accuracy as the non-isolated control group, problems associated with the study include the fact that both fear and surprise were constantly misidentified.", "target": "", "options": ["The isolated group performed as accurately as the control group, though fear and surprise remained problem areas.", "Equal overall performance meant no expression was ever misidentified.", "The isolated group could not identify any emotion at all."], "answer": 0, "explanations": ["While 讓步保留相同準確度與特定誤辨可並存。", "明說 fear and surprise misidentified，不能讀成零錯誤。", "same accuracy 與 completely unable 不同。"], "tag": "長難句理解", "structure": "While...could identify...為讓步；with the same accuracy as...為比較；problems...include the fact that...為主句，that 後說明特定誤辨。"}, {"id": "facial-paraphrase-15", "mode": "paraphrase", "paragraph": "H", "sentence": "Expressions Ekman found to be universal included those indicating anger, disgust, fear, joy, sadness, and surprise (note that none of these emotions has a definitive social component, such as shame, pride, or schadenfreude).", "target": "", "options": ["The author distinguishes the listed basic emotions from emotions treated as having a social component.", "The author says every listed emotion necessarily contains the same clear social component as shame.", "The author lists shame as one of the six emotions in the immediately preceding list."], "answer": 0, "explanations": ["none 與 such as shame...區分列舉六情緒和社會成分例子。", "把 none 改成 every，否定反轉。", "shame 位於反例說明，不在六項清單。"], "tag": "長難句理解", "structure": "Expressions...included those...為主句；those 指 expressions；括號 note that...為補充；none of these emotions 為全否定主詞，such as 舉社會性情緒例。"}, {"id": "facial-paraphrase-16", "mode": "paraphrase", "paragraph": "H", "sentence": "Findings on contempt (which is social) are less clear, though there is at least some preliminary evidence that this emotion and its expression are universally recognized.", "target": "", "options": ["Contempt findings were less certain, although some initial evidence favoured shared recognition.", "Contempt had been proved universally recognisable with final certainty.", "No evidence of any kind had been found concerning contempt."], "answer": 0, "explanations": ["less clear、at least some preliminary 限定證據成熟程度。", "初步支持不是最終確證。", "some evidence 不等於 none。"], "tag": "長難句理解", "structure": "Findings...are less clear 為主句；which is social 補 contempt 性質；though...there is...為讓步；that emotion...recognised 為 evidence 的內容。"}, {"id": "facial-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "Ekman's study found that fear and surprise were persistently misidentified.", "target": "persistently", "options": ["持續、反覆地", "毫無例外地全然正確", "只發生一次地"], "answer": 0, "explanations": ["persistently 指反覆持續；原題語法已修順。此處練習題目用語，不表示整句符合原文。", "此字不表示辨識正確", "持續不等於僅一次"], "tag": "題目字彙", "source": "Question 14–18 · 題目用語"}, {"id": "facial-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Ekman's study found that fear and surprise were persistently misidentified.", "target": "misidentified", "options": ["被錯誤辨識的", "被正確配對的", "未曾呈現的"], "answer": 0, "explanations": ["mis- 表錯誤，misidentify 是認錯。此處練習題目用語，不表示整句符合原文。", "正確與 mis- 相反", "認錯不等於沒看過"], "tag": "題目字彙", "source": "Question 14–18 · 題目用語"}, {"id": "facial-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "The study considered cultural background and whether a culture had been isolated or exposed to the mainstream.", "target": "cultural background", "options": ["文化背景", "實驗室牆面", "個人血壓"], "answer": 0, "explanations": ["指受試者所處文化經驗背景。此處練習題目用語，不表示整句符合原文。", "不是物理背景牆", "不是生理測量"], "tag": "題目字彙", "source": "Question 14–18 · 題目用語"}, {"id": "facial-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "The study considered cultural background and whether a culture had been isolated or exposed to the mainstream.", "target": "isolated", "options": ["與外界較隔離的", "完全融入外部文化的", "科學能力較低的"], "answer": 0, "explanations": ["此處指文化接觸程度，不是能力價值評判。此處練習題目用語，不表示整句符合原文。", "融入與隔離相反", "孤立不能推論能力低"], "tag": "題目字彙", "source": "Question 14–18 · 題目用語"}, {"id": "facial-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "The study considered cultural background and whether a culture had been isolated or exposed to the mainstream.", "target": "mainstream", "options": ["主流文化、較廣泛的主流社會", "河流中央水道", "小型私人家庭"], "answer": 0, "explanations": ["此處 mainstream 是文化社會義。此處練習題目用語，不表示整句符合原文。", "不是字面水流", "不是家庭"], "tag": "題目字彙", "source": "Question 14–18 · 題目用語"}, {"id": "facial-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "The difficulty of identifying the actual meaning of facial expressions.", "target": "identifying", "options": ["辨識、確認", "刻意製造", "不加檢查地否定"], "answer": 0, "explanations": ["identify meaning 指辨認含義。此處練習題目用語，不表示整句符合原文。", "不是製造含義", "不是否定"], "tag": "題目字彙", "source": "Question 19 · 題目用語"}, {"id": "facial-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Collected data on the relation between blinking and success in elections.", "target": "relation", "options": ["關聯、關係", "確定的單向因果", "完全無關"], "answer": 0, "explanations": ["relation 本身不保證因果方向。此處練習題目用語，不表示整句符合原文。", "關聯不能直接等同單向因果", "關係不等於無關"], "tag": "題目字彙", "source": "Question 21 · 題目用語"}, {"id": "facial-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "An indicator reflecting one's degree of nervousness.", "target": "indicator", "options": ["可反映某狀況的指標", "必然造成某狀況的原因", "唯一不可替代的療法"], "answer": 0, "explanations": ["indicator 是供判讀的徵象。此處練習題目用語，不表示整句符合原文。", "指標不必是原因", "不是療法"], "tag": "題目字彙", "source": "Question 23 · 題目用語"}, {"id": "facial-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "A potential relationship exists between facial expressions and state of mind.", "target": "state of mind", "options": ["心理狀態", "臉部骨骼數量", "固定的國家制度"], "answer": 0, "explanations": ["指當時的心理或情緒狀態。此處練習題目用語，不表示整句符合原文。", "不是解剖數量", "state 在此不是國家"], "tag": "題目字彙", "source": "Question 25–26 B · 題目用語"}, {"id": "facial-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "Different areas of the face convey particular states of mind.", "target": "convey", "options": ["傳達、呈現", "永久消除", "保證讀懂所有情緒"], "answer": 0, "explanations": ["此處 convey 指表情呈現心理狀態。此處練習題目用語，不表示整句符合原文。", "傳達不是消除", "傳達不保證被完全理解"], "tag": "題目字彙", "source": "Question 25–26 D · 題目用語"}]}, {"id": "brassica-family", "title": "The Brassica Family: One Plant, Many Vegetables", "sourceTitle": "The Brassica Family: One Plant, Many Vegetables", "subtitle": "", "part": 1, "topic": "選擇性育種、遺傳與作物", "sourceNote": "one wild plant 指共同的野生植物物種背景，不是所有品種都源自同一個別植株。營養效果中的 may 不代表保證療效。", "paragraphs": [{"label": "A", "text": "Many people are surprised to learn that cabbage, broccoli, cauliflower, kale, Brussels sprouts and kohlrabi all belong to the same plant family. Although these vegetables differ greatly in appearance, taste and texture, they all originated from a single wild plant called Brassica oleracea. This species, commonly known as wild cabbage or wild mustard, has grown naturally along the rocky coastlines of Europe for thousands of years. Through careful human selection, it has gradually developed into many of the vegetables that are commonly found in supermarkets today."}, {"label": "B", "text": "The transformation of Brassica oleracea did not happen by chance. It was the result of a process known as selective breeding, in which farmers repeatedly chose plants with desirable characteristics and used them to produce the next generation. Unlike modern genetic engineering, selective breeding does not involve changing a plant's DNA in a laboratory. Instead, it relies on naturally occurring genetic variation that already exists within a species."}, {"label": "C", "text": "Early farmers noticed that some wild Brassica plants had larger leaves, thicker stems or more compact flower buds than others. By saving seeds only from those preferred plants, they gradually increased the frequency of these characteristics over many generations. As a result, different vegetables began to emerge. Cabbage was developed for its large terminal leaves, broccoli for its flower buds, cauliflower for its undeveloped flower clusters, Brussels sprouts for its side buds, kale for its loose leaves and kohlrabi for its swollen stem."}, {"label": "D", "text": "Although these vegetables look very different, scientists have discovered that they are genetically very similar. Because they all belong to the same species, they are still capable of interbreeding under suitable conditions. This close genetic relationship explains why plant breeders can continue to develop new varieties with improved qualities, such as better taste, higher nutritional value or greater resistance to disease."}, {"label": "E", "text": "The Brassica family is also well known for its impressive nutritional benefits. Most Brassica vegetables contain large amounts of vitamins C and K, dietary fibre and important minerals such as potassium and calcium. They also contain natural plant chemicals called glucosinolates, which give these vegetables their distinctive flavour. When a Brassica vegetable is cut or chewed, these compounds are converted into other substances that may help protect the body from certain diseases. Although researchers continue to investigate these effects, many health experts recommend eating a variety of Brassica vegetables as part of a balanced diet."}, {"label": "F", "text": "However, growing Brassica crops presents several challenges for farmers. Because many members of the family are closely related, they are vulnerable to similar insects and plant diseases. One of the most serious problems is clubroot disease, which attacks the roots and reduces plant growth. Farmers often reduce these risks by rotating crops, improving soil conditions and developing resistant varieties through breeding programmes."}, {"label": "G", "text": "Modern plant scientists now combine traditional breeding methods with advanced genetic techniques. By studying the DNA of Brassica plants, researchers can identify genes responsible for useful characteristics such as drought tolerance, faster growth or resistance to pests. This knowledge enables breeders to produce improved crops more efficiently while still relying on natural breeding methods. Scientists are also preserving wild Brassica populations because they contain valuable genetic diversity that may help future crops adapt to climate change and new diseases."}, {"label": "H", "text": "The history of the Brassica family demonstrates the remarkable influence of human agriculture on plant evolution. From one wild coastal plant, centuries of careful selection have produced a wide range of vegetables with different shapes, colours and uses. Today, Brassica crops are grown throughout the world and play an important role in both human nutrition and global agriculture. Their development provides a clear example of how small genetic differences, guided by human choice, can create extraordinary diversity while maintaining a common biological origin."}], "questions": [{"id": "brassica-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Although these vegetables differ greatly in appearance, taste and texture, they all originated from a single wild plant called Brassica oleracea.", "target": "texture", "options": ["the physical feel or structure of a sur
