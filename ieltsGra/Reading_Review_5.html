ag": "字彙與語境義"}, {"id": "elephants-vocab-39", "mode": "vocab", "paragraph": "F", "sentence": "Even though adult elephants have no enemies other than human beings, calves are vulnerable and susceptible to attacks from lions and hyenas.", "target": "vulnerable", "options": ["exposed to possible harm", "guaranteed to be safe", "unable to feel pain"], "answer": 0, "explanations": ["此處 vulnerable 表示「易受傷害的」。須依原句語境理解。", "這個選項表示「保證安全的」；原句要表達的是「易受傷害的」。", "這個選項表示「無法感到疼痛的」；原句要表達的是「易受傷害的」。"], "tag": "字彙與語境義"}, {"id": "elephants-vocab-40", "mode": "vocab", "paragraph": "F", "sentence": "Even though adult elephants have no enemies other than human beings, calves are vulnerable and susceptible to attacks from lions and hyenas.", "target": "susceptible to", "options": ["likely to be affected or harmed by", "naturally immune to", "fully responsible for creating"], "answer": 0, "explanations": ["此處 susceptible to 表示「容易受……影響或傷害」。須依原句語境理解。", "這個選項表示「天生免疫於」；原句要表達的是「容易受……影響或傷害」。", "這個選項表示「完全負責造成」；原句要表達的是「容易受……影響或傷害」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-41", "mode": "vocab", "paragraph": "F", "sentence": "At the sight of a predator, older herd members clump together to protect the young before running away.", "target": "clump together", "options": ["gather into a close group", "spread out individually", "move underground"], "answer": 0, "explanations": ["此處 clump together 表示「聚攏成團」。須依原句語境理解。", "這個選項表示「各自分散」；原句要表達的是「聚攏成團」。", "這個選項表示「移到地下」；原句要表達的是「聚攏成團」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-42", "mode": "vocab", "paragraph": "G", "sentence": "We now know that elephants can respond to warning calls in the air, but can they detect signals transmitted solely through the ground?", "target": "solely", "options": ["only or exclusively", "together with other channels", "mainly but not entirely"], "answer": 0, "explanations": ["此處 solely 表示「僅僅、單獨」。須依原句語境理解。", "這個選項表示「連同其他管道」；原句要表達的是「僅僅、單獨」。", "這個選項表示「主要但非完全」；原句要表達的是「僅僅、單獨」。"], "tag": "字彙與語境義"}, {"id": "elephants-vocab-43", "mode": "vocab", "paragraph": "H", "sentence": "It used three different recordings: the 1994 warning call from Mushara, an anti-predator call recorded by scientist Joyce Poole in Kenya, and a made-up warble tone.", "target": "warble tone", "options": ["an artificial wavering sound", "a chemical warning smell", "a silent visual signal"], "answer": 0, "explanations": ["此處 warble tone 表示「人工製作的顫音」。須依原句語境理解。", "這個選項表示「化學警告氣味」；原句要表達的是「人工製作的顫音」。", "這個選項表示「無聲視覺訊號」；原句要表達的是「人工製作的顫音」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-44", "mode": "vocab", "paragraph": "H", "sentence": "However, the fascinating finding is that the anti-predator call from Kenya—unfamiliar to them—caused them to gather, tense up and rumble aggressively as well; but they didn't always flee.", "target": "tense up", "options": ["become physically stiff or alert", "become completely relaxed", "lose consciousness"], "answer": 0, "explanations": ["此處 tense up 表示「繃緊、警戒起來」。須依原句語境理解。", "這個選項表示「完全放鬆」；原句要表達的是「繃緊、警戒起來」。", "這個選項表示「失去意識」；原句要表達的是「繃緊、警戒起來」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-45", "mode": "vocab", "paragraph": "H", "sentence": "However, the fascinating finding is that the anti-predator call from Kenya—unfamiliar to them—caused them to gather, tense up and rumble aggressively as well; but they didn't always flee.", "target": "rumble", "options": ["make a low deep sound", "make no sound", "produce a high whistle only"], "answer": 0, "explanations": ["此處 rumble 表示「發出低沉隆隆聲」。須依原句語境理解。", "這個選項表示「完全不發聲」；原句要表達的是「發出低沉隆隆聲」。", "這個選項表示「只發尖銳口哨聲」；原句要表達的是「發出低沉隆隆聲」。"], "tag": "字彙與語境義"}, {"id": "elephants-vocab-46", "mode": "vocab", "paragraph": "H", "sentence": "However, the fascinating finding is that the anti-predator call from Kenya—unfamiliar to them—caused them to gather, tense up and rumble aggressively as well; but they didn't always flee.", "target": "flee", "options": ["escape or run away", "approach calmly", "stay to sleep"], "answer": 0, "explanations": ["此處 flee 表示「逃離」。須依原句語境理解。", "這個選項表示「冷靜接近」；原句要表達的是「逃離」。", "這個選項表示「留下睡覺」；原句要表達的是「逃離」。"], "tag": "字彙與語境義"}, {"id": "elephants-vocab-47", "mode": "vocab", "paragraph": "H", "sentence": "I didn't expect the results to be that clear-cut.’", "target": "clear-cut", "options": ["unambiguous and distinct", "tentative and confusing", "physically cut into pieces"], "answer": 0, "explanations": ["此處 clear-cut 表示「明確、清楚的」。須依原句語境理解。", "這個選項表示「暫定且混亂的」；原句要表達的是「明確、清楚的」。", "這個選項表示「實際切成碎片的」；原句要表達的是「明確、清楚的」。"], "tag": "字彙與語境義"}, {"id": "elephants-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "This revolution has made a stunning revelation: elephants are capable of communicating with one another over long distances by means of low-frequency sounds, also known as infrasound, which are too deep for humans to hear.", "target": "", "options": ["The passage describes low-frequency signals through which elephants communicate over distances but which people cannot ordinarily hear.", "People can hear all these signals as clearly as elephants can.", "The signals are inaudible because their pitch is higher than the human hearing range."], "answer": 0, "explanations": ["too deep 指頻率太低；which 修飾 low-frequency sounds。", "too...for humans to hear 明確排除一般可聽。", "infrasound 是低於聽覺範圍，非高於。"], "tag": "長難句理解", "structure": "冒號後 elephants are capable of...為主要發現；by means of 表媒介；also known as...同位補充；which...為非限定關係子句。"}, {"id": "elephants-paraphrase-2", "mode": "paraphrase", "paragraph": "B", "sentence": "As might be expected, African elephants’ ability to detect seismic sound may have something to do with their ears.", "target": "", "options": ["The ear's structure is proposed as a possible contributor to detecting ground vibration.", "The sentence proves that ears are the only possible route for detecting vibration.", "The sentence denies any possible relation between ears and seismic detection."], "answer": 0, "explanations": ["may 與 have something to do with 表可能相關，不是排他確證。", "刪掉可能性並加入 only，過度推論。", "possible relation 被改成無關，方向相反。"], "tag": "長難句理解", "structure": "As might be expected 為評論插入；ability to detect...是主詞核心；may have...為限定謂語；with their ears 為相關對象。"}, {"id": "elephants-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "The hammer bone in an elephant's middle ear is proportionally huge for a mammal, but it is normal for animals that use vibrational signals.", "target": "", "options": ["The hammer bone is unusually large for a mammal but consistent with animals using vibration signals.", "The hammer bone is equally small in every animal using vibration.", "The writer treats the bone's size as unrelated to the comparison group."], "answer": 0, "explanations": ["for a mammal 與 for animals that...使用不同參照群體，兩說法可並存。", "huge 不等於 small，也未說每種大小一致。", "proportionally 與兩個 for 明確是相對比較。"], "tag": "長難句理解", "structure": "The hammer bone...is...為第一分句；but it is normal...為對照；that use vibrational signals 修飾 animals；已修正文中的 middle ear 位置。"}, {"id": "elephants-paraphrase-4", "mode": "paraphrase", "paragraph": "C", "sentence": "First, their massive bodies, which enable them to give out low-frequency sounds almost as powerful as the sound a jet makes during take-off, serve as ideal frames for receiving ground vibrations and transmitting them to the inner ear.", "target": "", "options": ["Elephants' large bodies both produce powerful low sounds and provide structures for receiving ground vibration.", "Their bodies serve only to produce sounds and cannot receive ground vibration.", "Their sounds are described as exactly identical to jet noise in every respect."], "answer": 0, "explanations": ["which...補充發聲能力，serve as...才是主句的接收功能。", "刪去主幹 receiving...transmitting 的功能。", "almost as powerful 只比較強度，非各方面相同。"], "tag": "長難句理解", "structure": "their massive bodies 為主詞；which enable...為非限定關係子句；a jet makes...修飾 sound；serve as...為主謂主幹；for receiving...and transmitting...平行。"}, {"id": "elephants-paraphrase-5", "mode": "paraphrase", "paragraph": "C", "sentence": "Second, the elephant's toe bones are set in a fatty pad, which might help focus vibrations from the ground into the bone.", "target": "", "options": ["The fat surrounding toe bones might help concentrate ground vibrations into bone.", "The fatty pad has been proved to block every ground vibration.", "The sentence states that all low-frequency sounds originate in toe fat."], "answer": 0, "explanations": ["might help 為可能功能，focus 為集中傳入而非阻擋。", "將可能助傳改成確證全阻隔。", "集中既有振動不等於聲音全部由此產生。"], "tag": "長難句理解", "structure": "toe bones are set...為被動；which might help...修飾 fatty pad；focus vibrations...into the bone 表來源由地面、方向到骨骼。"}, {"id": "elephants-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "The front of the skull is riddled with sinus cavities, which might function as resonating chambers for ground vibrations.", "target": "", "options": ["Skull cavities may reinforce ground vibrations by functioning as resonating spaces.", "The cavities are described as permanently preventing all skull vibration.", "The sentence conclusively identifies the only way elephants hear."], "answer": 0, "explanations": ["might function 限定為可能角色。", "共鳴功能不等於完全阻隔。", "might 不等於確證，也未說唯一途徑。"], "tag": "長難句理解", "structure": "The front of the skull is riddled with...為主幹；which...修飾 cavities；as resonating chambers 表可能功能；for ground vibrations 說明相關訊號。"}, {"id": "elephants-paraphrase-7", "mode": "paraphrase", "paragraph": "D", "sentence": "It remains unclear how elephants detect such vibrations, but O’Connell-Rodwell suggests that the pachyderms are ‘listening’ with their trunks and feet instead of (or in addition to) their ears.", "target": "", "options": ["The precise detection mechanism is uncertain, though the researcher proposes the trunk and feet as possible additional or alternative channels.", "It is certain that elephants never use their ears for any part of this communication.", "No explanation has been proposed because the mechanism is not fully known."], "answer": 0, "explanations": ["unclear 與 suggests 同時存在；instead of or in addition to 保留兩種關係。", "將可能補充或替代改成確定絕不用耳朵。", "有研究假說不等於已知機制，不能因未知否定假說存在。"], "tag": "長難句理解", "structure": "It remains unclear 中 it 為虛主詞；how...為未知內容；but...suggests that...接研究假說；instead of 與 in addition to 分別為替代及附加。"}, {"id": "elephants-paraphrase-8", "mode": "paraphrase", "paragraph": "D", "sentence": "Both trunk and feet contain two types of nerve endings that are sensitive to pressure—one detects infrasonic vibration and the other responds to vibrations of slightly higher frequencies.", "target": "", "options": ["The trunk and feet contain receptors for pressure, with one type detecting infrasonic vibrations and another slightly higher frequencies.", "One receptor type detects only light and the other only smell.", "The sentence assigns all low-frequency detection to the feet and all higher frequencies to the trunk."], "answer": 0, "explanations": ["one、other 指 two types，不是分別指 trunk、feet。", "兩者皆 vibration，不能換成光與氣味。", "原句兩種末梢存在於兩處，未作部位各別專屬分工。"], "tag": "長難句理解", "structure": "Both trunk and feet 為並列主詞；that are sensitive...修飾 nerve endings；破折號後 one...the other...說明兩類受器，非兩個部位。"}, {"id": "elephants-paraphrase-9", "mode": "paraphrase", "paragraph": "D", "sentence": "‘Our work is really at the interface of geophysics, neurophysiology and ecology,’ she says.", "target": "", "options": ["The researcher sees the work as joining several fields and raising previously unasked questions.", "The work is described as confined entirely to one established field.", "The researcher claims every question in these fields has now been answered."], "answer": 0, "explanations": ["interface 表交會；never even been considered 表新問題，非全解。", "geophysics、neurophysiology、ecology 是三領域。", "提出未考慮問題與回答所有問題不同。"], "tag": "長難句理解", "structure": "Our work is...為引述主幹；at the interface of...為表語；三個學科並列；引述後的 she says 指明這是研究者評述。"}, {"id": "elephants-paraphrase-10", "mode": "paraphrase", "paragraph": "E", "sentence": "Nevertheless, O’Connell-Rodwell was the first to argue that a giant land animal is also sending and receiving seismic signals.", "target": "", "options": ["Although ground-based communication was known in small animals, the proposed use by a giant land animal was presented as novel.", "The writer says no small animal had previously been known to use vibration.", "The researcher merely repeated the claim that elephants cannot receive ground signals."], "answer": 0, "explanations": ["Nevertheless 對比既有小型動物研究與大型動物的新主張。", "Scientists have long known 直接否定此選項。", "sending and receiving 表兩者都可能，不是否定。"], "tag": "長難句理解", "structure": "前句 long known 建背景；Nevertheless...was the first to argue...為新主張；that...為 argue 的受詞子句；also 標示加入大型陸地動物。"}, {"id": "elephants-paraphrase-11", "mode": "paraphrase", "paragraph": "E", "sentence": "‘I used to lay a male planthopper on a stem and replay the calling sound of a female; the male would exhibit the same kind of behaviour that happens in elephants: he would freeze, press down on his legs, move forward a little, then stay still again. I found it fascinating, and it made me think that perhaps auditory communication is not the only thing going on.’", "target": "", "options": ["The insect's response to a replayed female call resembled the sequence of elephant behaviour observed by the researcher.", "The insect deliberately imitated an elephant after being shown a video.", "The sequence began with running away and contained no stopping behaviour."], "answer": 0, "explanations": ["same kind of behaviour 是比較觀察，不是證明刻意模仿。", "原句沒有影片或模仿意圖。", "freeze、stay still 均是停住；move forward 也非先逃跑。"], "tag": "長難句理解", "structure": "I used to lay...and replay...為研究程序；分號後 male would exhibit...描述反覆反應；冒號列動作；that happens in elephants 修飾 behaviour。"}, {"id": "elephants-paraphrase-12", "mode": "paraphrase", "paragraph": "F", "sentence": "Scientists have confirmed that an elephant's capacity to communicate over long distances is essential for survival, especially in places like Etosha, where more than 2,400 savanna elephants range over an area larger than New Jersey.", "target": "", "options": ["Long-distance communication matters especially where elephants are spread over an enormous area.", "All elephants live together in one small enclosure and can meet easily.", "The number 2,400 refers to the size of a single elephant herd."], "answer": 0, "explanations": ["where 子句說明 Etosha 廣大分布，非一群大小。", "range over an area larger...排除小圍欄。", "elephants 分布於區域，不是明說單一 herd 成員數。"], "tag": "長難句理解", "structure": "Scientists have confirmed that...為報告；capacity...is essential...為內容；especially in places...限定情境；where...range over...為地點關係子句。"}, {"id": "elephants-paraphrase-13", "mode": "paraphrase", "paragraph": "F", "sentence": "Even though adult elephants have no enemies other than human beings, calves are vulnerable and susceptible to attacks from lions and hyenas.", "target": "", "options": ["The passage contrasts the relative safety of adults with calves' vulnerability to predators.", "Adult and juvenile elephants are described as equally safe from every predator.", "The sentence says lions prey only on adult elephants and never on calves."], "answer": 0, "explanations": ["Even though 引成年情況作讓步，calves 才是主句主詞。", "抹平主從句的安全程度差異。", "susceptible to attacks 修飾 calves，不是只有成年象。"], "tag": "長難句理解", "structure": "Even though...為讓步子句；other than 表排除人類例外；calves are vulnerable and susceptible...為主句；from lions and hyenas 指攻擊來源。"}, {"id": "elephants-paraphrase-14", "mode": "paraphrase", "paragraph": "G", "sentence": "We now know that elephants can respond to warning calls in the air, but can they detect signals transmitted solely through the ground?", "target": "", "options": ["The question distinguishes known airborne alarm responses from the possibility of sensing ground-only signals.", "The question asks whether elephants can see the colour of alarm signals.", "The question assumes all ground signals must be accompanied by audible air signals."], "answer": 0, "explanations": ["but can they...提出新待測問題；solely 限定傳播媒介。", "原句是聲音／振動，沒有顏色辨識。", "ground-only 不要求同時有空氣訊號。"], "tag": "長難句理解", "structure": "We now know that...先交代已知；but 後為疑問倒裝 can they detect...；transmitted solely through...為被動分詞，修飾 signals。"}, {"id": "elephants-paraphrase-15", "mode": "paraphrase", "paragraph": "H", "sentence": "However, the fascinating finding is that the anti-predator call from Kenya—unfamiliar to them—caused them to gather, tense up and rumble aggressively as well; but they didn't always flee.", "target": "", "options": ["An unfamiliar alarm call also prompted gathering and defensive tension, although the elephants did not invariably run away.", "The elephants ignored the unfamiliar call and never changed behaviour.", "Every elephant always fled immediately after every alarm call."], "answer": 0, "explanations": ["caused them to gather...為反應；didn't always flee 否定必然逃跑。", "gather、tense up、rumble 均顯示有反應。", "not always 不是 always；也不能推成 never。"], "tag": "長難句理解", "structure": "the finding is that...為表語子句；unfamiliar to them 插入修飾 call；caused them to...為使役；but 限定並非每次 flee。"}, {"id": "elephants-paraphrase-16", "mode": "paraphrase", "paragraph": "H", "sentence": "I didn't expect the results to be that clear-cut.’", "target": "", "options": ["The researcher reports that the findings were more distinct than she had expected.", "The researcher says the findings were so unclear that no reaction could be observed.", "The sentence states that the results were exactly as ambiguous as anticipated."], "answer": 0, "explanations": ["didn't expect...that clear-cut 意指未料到如此清楚。", "clear-cut 不是模糊難辨。", "否定的是預期此清楚程度，非實際結果很模糊。"], "tag": "長難句理解", "structure": "I didn't expect...為否定主句；the results to be...為 expect+受詞+to不定詞；that 在 clear-cut 前為程度副詞，表示「那麼」。"}, {"id": "elephants-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "The diagram asks about the elephant's hammer bones, body, fatty pad and sinus cavities.", "target": "hammer bones", "options": ["錘骨", "敲擊工具", "腳趾骨"], "answer": 0, "explanations": ["hammer bone 為聽小骨之一；原圖 inner ear 的位置說法有誤，正文已修為 middle ear。此處練習題目用語，不表示整句符合原文。", "不是手工具", "不是趾骨"], "tag": "題目字彙", "source": "Question 27–30 Diagram · 題目用語"}, {"id": "elephants-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "The diagram asks about the elephant's hammer bones, body, fatty pad and sinus cavities.", "target": "sinus cavities", "options": ["鼻竇空腔", "腳底肌肉", "外耳皮膚"], "answer": 0, "explanations": ["sinus cavities 指顱骨中的空腔。此處練習題目用語，不表示整句符合原文。", "不是腳部", "不是外耳表皮"], "tag": "題目字彙", "source": "Question 27–30 Diagram · 題目用語"}, {"id": "elephants-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Two kinds of nerve endings respond to vibrations at infrasonic and slightly higher frequencies.", "target": "infrasonic", "options": ["次聲頻率的", "超音波頻率的", "完全不振動的"], "answer": 0, "explanations": ["infra- 此處表低於人類一般可聽頻率。此處練習題目用語，不表示整句符合原文。", "不能與 ultrasonic 高頻超音波混淆", "低頻仍有振動"], "tag": "題目字彙", "source": "Question 31–38 · 題目用語"}, {"id": "elephants-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "The research combines geophysics, neurophysiology and ecology.", "target": "neurophysiology", "options": ["神經生理學", "氣象學", "海洋化學"], "answer": 0, "explanations": ["研究神經系統功能的學科。此處練習題目用語，不表示整句符合原文。", "氣象是 meteorology", "不是海洋化學"], "tag": "題目字彙", "source": "Question 31–38 · 題目用語"}, {"id": "elephants-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "The research combines geophysics, neurophysiology and ecology.", "target": "ecology", "options": ["生態學", "經濟學", "占星術"], "answer": 0, "explanations": ["ecology 研究生物與環境互動。此處練習題目用語，不表示整句符合原文。", "經濟學是 economics，形近須區分", "不是 astrology"], "tag": "題目字彙", "source": "Question 31–38 · 題目用語"}, {"id": "elephants-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "She noticed a freezing response in a male planthopper placed on a stem.", "target": "planthopper", "options": ["飛蝨等植食性昆蟲", "小青蛙", "幼象"], "answer": 0, "explanations": ["為研究例子中的昆蟲；句子修整原題不自然搭配。此處練習題目用語，不表示整句符合原文。", "不是青蛙", "不是象"], "tag": "題目字彙", "source": "Question 31–38 · 題目用語"}, {"id": "elephants-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "The observation suggested other communication approaches besides auditory communication.", "target": "auditory", "options": ["聽覺的", "視覺的", "文字書寫的"], "answer": 0, "explanations": ["auditory 與聽覺、聲音有關。此處練習題目用語，不表示整句符合原文。", "視覺是 visual", "不是書面溝通"], "tag": "題目字彙", "source": "Question 31–38 · 題目用語"}, {"id": "elephants-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "When a female elephant is in estrus.", "target": "in estrus", "options": ["處於發情期", "正在冬眠", "正在蛻皮"], "answer": 0, "explanations": ["estrus 指雌性繁殖週期的發情階段。此處練習題目用語，不表示整句符合原文。", "不是 hibernation", "不是脫皮"], "tag": "題目字彙", "source": "Question 39 D · 題目用語"}, {"id": "elephants-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "When older members of the herd want to flee from the group.", "target": "flee", "options": ["逃離", "安靜休息", "互相辨認"], "answer": 0, "explanations": ["flee 是迅速離開或逃跑。此處練習題目用語，不表示整句符合原文。", "不是休息", "不是辨識"], "tag": "題目字彙", "source": "Question 39 C · 題目用語"}, {"id": "elephants-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "The outcome goes beyond the initial expectations.", "target": "initial expectations", "options": ["最初的預期", "最終確定結果", "全部實驗設備"], "answer": 0, "explanations": ["原題不自然的 out of the original expectation 已修順。此處練習題目用語，不表示整句符合原文。", "期待不是結果", "不是器材"], "tag": "題目字彙", "source": "Question 40 A · 題目用語"}, {"id": "elephants-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "The result could be inconclusive or inaccurate.", "target": "inconclusive", "options": ["無法得出明確結論的", "確證無疑的", "完全不相關的"], "answer": 0, "explanations": ["原題 undecided 在研究結果語境已修為較自然的 inconclusive。此處練習題目用語，不表示整句符合原文。", "無定論不等於確證", "無定論不必然無關"], "tag": "題目字彙", "source": "Question 40 C · 題目用語"}, {"id": "elephants-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "The result could be inconclusive or inaccurate.", "target": "inaccurate", "options": ["不準確的", "精確的", "保密的"], "answer": 0, "explanations": ["inaccurate 是否定 accurate。此處練習題目用語，不表示整句符合原文。", "與精確相反", "不是 confidential"], "tag": "題目字彙", "source": "Question 40 C · 題目用語"}]}, {"id": "bird-migration", "title": "Bird Migration", "sourceTitle": "Bird Migration", "subtitle": "", "part": 2, "topic": "遷徙、生理適應與導航", "sourceNote": "probably、seem 與 remains unknown 的限定必須保留；A 段呼吸系統的語句已修為從空氣取得氧氣。", "paragraphs": [{"label": "A", "text": "Birds are highly mobile and among the swiftest of living creatures. Flight gives them the power to move in any direction for as long as they have the energy to keep going. They are equipped with lightweight, hollow bones, a finely-tuned navigation system and an ingenious heat-conserving design that allows them to face life in the harshest of climates. Their respiratory systems have to perform efficiently during sustained flights at altitude, so they have evolved a system of extracting oxygen from the air in their lungs that far exceeds that of any other animal. These features enable birds to come and go with the seasons. On the way, they face constant danger and a daily requirement to find food, water and a safe place to rest. So why do millions of birds migrate rather than stay in one place?"}, {"label": "B", "text": "Most of the explanation revolves around food. In temperate and arctic regions of the northern hemisphere, food is abundant during a short growing season. Migration evolved as a way for birds to exploit resources that are seasonally abundant and, equally important, to go elsewhere when the resources become scarce or harsh weather arrives. Many species can tolerate cold temperatures if food is plentiful but when food is not available they must migrate."}, {"label": "C", "text": "While this simple explanation for why birds migrate is essentially true, intriguing questions remain. One puzzling fact is that many birds journey much further than would be necessary to find food and good weather. Another apparent conundrum involves the huge migrations performed by arctic birds and mudflat-probing shore birds that breed close to polar regions. In general, the further north a migrant species breeds, the further south it spends the winter. Yet, en route to a final destination in southern latitudes, all these individuals overfly areas of seemingly suitable habitat spanning two hemispheres. Such compulsive journeys probably evolved over time and in response to fluctuations in weather but we do not really know."}, {"label": "D", "text": "But just how do birds reach their destination and, more to the point, how do young birds migrate over vast distances without parental assistance? Very few adults migrate accompanied by their offspring and youngsters may have little or no inkling of their parents’ appearance. Cuckoos are famous for depositing their eggs in the nests of other birds that unwittingly serve as foster-parents. Astonishing as this piece of evolutionary behaviour is, it is even more remarkable to consider that, once grown, the young cuckoo makes its own way to ancestral wintering grounds in the tropics before returning single-handedly to northern Europe to seek out a mate among its own kind."}, {"label": "E", "text": "As we continue to study bird migration, its mystery is better understood but also compounded. Mounting evidence has confirmed that birds use the sun and stars to obtain compass directions but true navigation requires an awareness of position and time, especially when lost. Experiments have shown that, after being taken thousands of miles over an unfamiliar landmass, birds are still capable of returning rapidly to nest sites. Such phenomenal powers are the product of computing a number of sophisticated cues including an innate map of the night sky and the pull of the Earth's magnetic field. How the birds use their 'instruments' remains unknown, but one thing is clear - they see the world with a sensory perception superior to ours. Most small birds migrate at night and take their direction from the position of the setting sun. However, as well as seeing the sun go down, they also seem to see the plane of polarised light it causes. This calibrates their compass. Travelling at night provides other benefits: the danger of meeting predators as well as the risk of dehydration due to flying for long periods in warm sunlit skies is reduced. Furthermore, at night the air structure is cool and smooth and conducive to sustained, stable flight."}, {"label": "F", "text": "Nevertheless, all journeys involve considerable risk and part of the skill in arriving safely is setting off at the right time. This means accurate weather forecasting and utilising favourable winds. Birds are adept at both and, in tests, some can detect the minute difference in barometric pressure between the floor and ceiling of a room. Often birds react to weather changes before there is any visible sign of them. Certain species that feed on grassland flee at the onset of a cold snap because when the ground surface freezes the birds could starve. Yet they return ahead of a thaw, their arrival linked to a pressure change presaging an improvement in the weather."}, {"label": "G", "text": "Unfortunately, some never complete their journey. Not so long ago the assumption was that a bird in the air on a dark windy night with no visible reference points to judge position was, like a pilot without radar, hopelessly lost. We now know this is not the case. Losses do occur, but mainly because birds get swept off course by strong air masses against which battle is futile, and this results in a watery grave. Indeed, it is not unusual for ocean fish to be caught with bird remains in their stomachs. But sometimes there's a silver lining. Each autumn a small number of North American birds are blown across the Atlantic by fast-moving westerly tail winds. Not only do they arrive safely in Europe but, based on tracking evidence, some make it back to North America in the following spring — probably after spending the winter with European migrants in sunny African climes."}], "questions": [{"id": "birds-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Birds are highly mobile and among the swiftest of living creatures.", "target": "mobile", "options": ["able to move readily from place to place", "used only for making telephone calls", "permanently fixed in place"], "answer": 0, "explanations": ["此處 mobile 表示「善於移動、活動性高的」。須依原句語境理解。", "這個選項表示「僅供打電話使用的」；原句要表達的是「善於移動、活動性高的」。", "這個選項表示「永久固定不動的」；原句要表達的是「善於移動、活動性高的」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Birds are highly mobile and among the swiftest of living creatures.", "target": "swiftest", "options": ["fastest", "most numerous", "most silent"], "answer": 0, "explanations": ["此處 swiftest 表示「最快速的」。須依原句語境理解。", "這個選項表示「數量最多的」；原句要表達的是「最快速的」。", "這個選項表示「最安靜的」；原句要表達的是「最快速的」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "They are equipped with lightweight, hollow bones, a finely-tuned navigation system and an ingenious heat-conserving design that allows them to face life in the harshest of climates.", "target": "hollow bones", "options": ["bones with internal spaces rather than solid interiors", "bones completely lacking strength", "bones formed only in adulthood"], "answer": 0, "explanations": ["此處 hollow bones 表示「中空骨骼」。須依原句語境理解。", "這個選項表示「完全沒有強度的骨骼」；原句要表達的是「中空骨骼」。", "這個選項表示「只在成年形成的骨骼」；原句要表達的是「中空骨骼」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "They are equipped with lightweight, hollow bones, a finely-tuned navigation system and an ingenious heat-conserving design that allows them to face life in the harshest of climates.", "target": "finely-tuned navigation system", "options": ["a highly precise way-finding mechanism", "a system working only through instruction", "a device measuring loudness"], "answer": 0, "explanations": ["此處 finely-tuned navigation system 表示「精密調校  to perform efficiently during sustained flights at altitude, so they have evolved a system of extracting oxygen from the air in their lungs that far exceeds that of any other animal.", "target": "altitude", "options": ["height above sea level", "distance from the equator", "speed of forward movement"], "answer": 0, "explanations": ["此處 altitude 表示「海拔、高度」。須依原句語境理解。", "這個選項表示「距離赤道的距離」；原句要表達的是「海拔、高度」。", "這個選項表示「向前移動速度」；原句要表達的是「海拔、高度」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "Their respiratory systems have to perform efficiently during sustained flights at altitude, so they have evolved a system of extracting oxygen from the air in their lungs that far exceeds that of any other animal.", "target": "extracting", "options": ["taking or drawing out", "permanently blocking", "returning without use"], "answer": 0, "explanations": ["此處 extracting 表示「提取、取得」。須依原句語境理解。", "這個選項表示「永久阻擋」；原句要表達的是「提取、取得」。", "這個選項表示「未使用便歸還」；原句要表達的是「提取、取得」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-10", "mode": "vocab", "paragraph": "A", "sentence": "Their respiratory systems have to perform efficiently during sustained flights at altitude, so they have evolved a system of extracting oxygen from the air in their lungs that far exceeds that of any other animal.", "target": "far exceeds", "options": ["is much greater than", "is exactly equal to", "falls far short of"], "answer": 0, "explanations": ["此處 far exceeds 表示「遠超過」。須依原句語境理解。", "這個選項表示「完全等於」；原句要表達的是「遠超過」。", "這個選項表示「遠不及」；原句要表達的是「遠超過」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "Most of the explanation revolves around food.", "target": "revolves around", "options": ["has as its main focus", "physically spins in orbit around", "avoids any connection with"], "answer": 0, "explanations": ["此處 revolves around 表示「圍繞、以……為核心」。須依原句語境理解。", "這個選項表示「實際繞軌道旋轉」；原句要表達的是「圍繞、以……為核心」。", "這個選項表示「避開所有關聯」；原句要表達的是「圍繞、以……為核心」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-12",  for birds to exploit resources that are seasonally abundant and, equally important, to go elsewhere when the resources become scarce or harsh weather arrives.", "target": "seasonally", "options": ["at particular times of the year", "at exactly the same rate every day", "without any pattern"], "answer": 0, "explanations": ["此處 seasonally 表示「隨季節地」。須依原句語境理解。", "這個選項表示「每天以完全相同速率」；原句要表達的是「隨季節地」。", "這個選項表示「毫無規律地」；原句要表達的是「隨季節地」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-17", "mode": "vocab", "paragraph": "B", "sentence": "Migration evolved as a way for birds to exploit resources that are seasonally abundant and, equally important, to go elsewhere when the resources become scarce or harsh weather arrives.", "target": "scarce", "options": ["insufficient or available only in small amounts", "more than enough", "impossible to digest"], "answer": 0, "explanations": ["此處 scarce 表示「稀少、短缺的」。須依原句語境理解。", "這個選項表示「綽綽有餘的」；原句要表達的是「稀少、短缺的」。", "這個選項表示「無法消化的」；原句要表達的是「稀少、短缺的」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-18", "mode": "vocab", "paragraph": "B", "sentence": "Many species can tolerate cold temperatures if food is plentiful but when food is not available they must migrate.", "target": "tolerate", "options": ["endure without serious harm", "actively seek in all cases", "eliminate permanently"], "answer": 0, "explanations": ["此處 tolerate 表示「忍受、耐受」。須依原句語境理解。", "這個選項表示「所有情況都積極尋求」；原句要表達的是「忍受、耐受」。", "這個選項表示「永久消除」；原句要表達的是「忍受、耐受」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-19", "mode": "vocab", "paragraph": "C", "sentence": "While this simple explanation for why birds migrate is essentially true, intriguing questions remain.", "target": "intriguing", "options": ["arousing curiosity and interest", "already fully answered", "too ordinary to notice"], "answer": 0, "explanations": ["此處 intriguing 表示「引人好奇的」。須依原句語境理解。", "這個選項表示「已完全解答的」；原句要表達的是「引人好奇的」。", "這個選項表示「平凡到無法注意的」；原句要表達的是「引人好奇的」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-20", "mode": "vocab", "paragraph": "C", "sentence": "Another apparent c s-vocab-28", "mode": "vocab", "paragraph": "D", "sentence": "But just how do birds reach their destination and, more to the point, how do young birds migrate over vast distances without parental assistance?", "target": "parental assistance", "options": ["help from parents", "help only from unrelated birds", "guidance supplied by researchers"], "answer": 0, "explanations": ["此處 parental assistance 表示「親代協助」。須依原句語境理解。", "這個選項表示「僅來自無親緣鳥類的幫助」；原句要表達的是「親代協助」。", "這個選項表示「研究人員提供的指導」；原句要表達的是「親代協助」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-29", "mode": "vocab", "paragraph": "D", "sentence": "Very few adults migrate accompanied by their offspring and youngsters may have little or no inkling of their parents’ appearance.", "target": "offspring", "options": ["the young of an animal", "ancestors of an animal", "unrelated mates"], "answer": 0, "explanations": ["此處 offspring 表示「後代、幼鳥」。須依原句語境理解。", "這個選項表示「動物的祖先」；原句要表達的是「後代、幼鳥」。", "這個選項表示「無親緣的配偶」；原句要表達的是「後代、幼鳥」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-30", "mode": "vocab", "paragraph": "D", "sentence": "Very few adults migrate accompanied by their offspring and youngsters may have little or no inkling of their parents’ appearance.", "target": "inkling", "options": ["a slight idea or awareness", "complete expert knowledge", "a physical marking on a feather"], "answer": 0, "explanations": ["此處 inkling 表示「一點概念、隱約了解」。須依原句語境理解。", "這個選項表示「完整專業知識」；原句要表達的是「一點概念、隱約了解」。", "這個選項表示「羽毛上的實體標記」；原句要表達的是「一點概念、隱約了解」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-31", "mode": "vocab", "paragraph": "D", "sentence": "Cuckoos are famous for depositing their eggs in the nests of other birds that unwittingly serve as foster-parents.", "target": "unwittingly", "options": ["without realising what is happening", "with detailed advance knowledge", "against every instinct"], "answer": 0, "explanations": ["此處 unwittingly 表示「不知情地」。須依原句語境理解。", "這個選項表示「事先充分知情地」；原句要表達的是「不知情地」。", "這個選項表示「違反所有本能地」；原句要表達的是「不知情地」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-32", "mode": "vocab", nded.", "target": "compounded", "options": ["made more complex or difficult", "solved completely", "measured by weight"], "answer": 0, "explanations": ["此處 compounded 表示「變得更複雜」。須依原句語境理解。", "這個選項表示「完全解決」；原句要表達的是「變得更複雜」。", "這個選項表示「按重量測量」；原句要表達的是「變得更複雜」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-36", "mode": "vocab", "paragraph": "E", "sentence": "Mounting evidence has confirmed that birds use the sun and stars to obtain compass directions but true navigation requires an awareness of position and time, especially when lost.", "target": "Mounting evidence", "options": ["an increasing body of supporting information", "evidence placed on a wall", "evidence already proved false"], "answer": 0, "explanations": ["此處 Mounting evidence 表示「愈來愈多的證據」。須依原句語境理解。", "這個選項表示「掛在牆上的證據」；原句要表達的是「愈來愈多的證據」。", "這個選項表示「已證實為假的證據」；原句要表達的是「愈來愈多的證據」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-37", "mode": "vocab", "paragraph": "E", "sentence": "Such phenomenal powers are the product of computing a number of sophisticated cues including an innate map of the night sky and the pull of the Earth's magnetic field.", "target": "phenomenal", "options": ["extraordinary in degree or quality", "ordinary and predictable", "entirely imaginary"], "answer": 0, "explanations": ["此處 phenomenal 表示「驚人的、非凡的」。須依原句語境理解。", "這個選項表示「普通且可預期的」；原句要表達的是「驚人的、非凡的」。", "這個選項表示「完全虛構的」；原句要表達的是「驚人的、非凡的」。"], "tag": "字彙與語境義"}, {"id": "birds-vocab-38", "mode": "vocab", "paragraph": "E", "sentence": "Such phenomenal powers are the product of computing a number of sophisticated cues including an innate map of the night sky and the pull of the Earth's magnetic field.", "target": "sophisticated cues", "options": ["complex sources of information used as signals", "simple spoken commands only", "decorative markings with no information"], "answer": 0, "explanations": ["此處 sophisticated cues 表示「精密複雜的線索」。須依原句語境理解。", "這個選項表示「僅簡單口頭命令」；原句要表達的是「精密複雜的線索」。", "這個選項表示「沒有資訊的裝飾標記」；原句要表達的是「精密複雜的線索」。"], "tag": "搭配與語境義"}, {"id": "birds-vocab-39", "mode": "vo
