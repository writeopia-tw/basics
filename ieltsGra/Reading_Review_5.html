e away from", "a routine continuation of", "a journey starting at"], "answer": 0, "explanations": ["此處 radical departure from 表示「根本背離、重大改變」。須依原句語境理解。", "這個選項表示「例行延續」；原句要表達的是「根本背離、重大改變」。", "這個選項表示「從……出發的旅程」；原句要表達的是「根本背離、重大改變」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-29", "mode": "vocab", "paragraph": "C", "sentence": "“Music, together with dance, co-evolved biologically and culturally to serve as a technology of social bonding,” Nils L. Wallin and Björn Merker wrote in The Origins of Music.", "target": "co-evolved", "options": ["developed together through linked processes", "were invented separately on the same day", "disappeared at the same time"], "answer": 0, "explanations": ["此處 co-evolved 表示「共同演化」。須依原句語境理解。", "這個選項表示「在同一天各自被發明」；原句要表達的是「共同演化」。", "這個選項表示「同時消失」；原句要表達的是「共同演化」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-30", "mode": "vocab", "paragraph": "C", "sentence": "“Music, together with dance, co-evolved biologically and culturally to serve as a technology of social bonding,” Nils L. Wallin and Björn Merker wrote in The Origins of Music.", "target": "social bonding", "options": ["the formation and strengthening of social connections", "a legal restriction on movement", "a financial agreement between companies"], "answer": 0, "explanations": ["此處 social bonding 表示「社會連結的形成與強化」。須依原句語境理解。", "這個選項表示「對移動的法律限制」；原句要表達的是「社會連結的形成與強化」。", "這個選項表示「企業間的財務協議」；原句要表達的是「社會連結的形成與強化」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-31", "mode": "vocab", "paragraph": "C", "sentence": "Songs don't leave behind bones, but evidence of musical notation dates back to Sumeria, 3,500 years ago, and in 1995 archaeologists discovered a bone flute in southern Europe estimated to be 44,000 years old.", "target": "musical notation", "options": ["a system of written signs representing music", "spoken instructions to musicians", "a record of concert attendance"], "answer": 0, "explanations": ["此處 musical notation 表示「記譜、樂譜符號系統」。須依原句語境理解。", "這個選項表示「給音樂家的口頭指示」；原句要表達的是「記譜、樂譜符號系統」。", "這個選項表示「音樂會出席紀錄」；原句要表達的是「記譜、樂譜符號系統」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-32", "mode": "vocab", "paragraph": "C", "sentence": "Songs don't leave behind bones, but evidence of musical notation dates back to Sumeria, 3,500 years ago, and in 1995 archaeologists discovered a bone flute in southern Europe estimated to be 44,000 years old.", "target": "archaeologists", "options": ["researchers who study past societies through physical remains", "researchers studying modern workplace output", "performers of traditional music"], "answer": 0, "explanations": ["此處 archaeologists 表示「考古學家」。須依原句語境理解。", "這個選項表示「研究現代職場產出的學者」；原句要表達的是「考古學家」。", "這個選項表示「傳統音樂表演者」；原句要表達的是「考古學家」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-33", "mode": "vocab", "paragraph": "C", "sentence": "If music evolved as a social glue for the species, as a way to make groups and keep them together, headphones have done what writing and literacy did for language — they made music private.", "target": "social glue", "options": ["something that holds groups together", "a sticky material used to repair instruments", "a rule forbidding private activities"], "answer": 0, "explanations": ["此處 social glue 表示「凝聚群體的力量」。須依原句語境理解。", "這個選項表示「修理樂器的黏膠」；原句要表達的是「凝聚群體的力量」。", "這個選項表示「禁止私人活動的規則」；原句要表達的是「凝聚群體的力量」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-34", "mode": "vocab", "paragraph": "C", "sentence": "If music evolved as a social glue for the species, as a way to make groups and keep them together, headphones have done what writing and literacy did for language — they made music private.", "target": "literacy", "options": ["the ability to read and write", "skill in playing several instruments", "knowledge of a city's layout"], "answer": 0, "explanations": ["此處 literacy 表示「識字、讀寫能力」。須依原句語境理解。", "這個選項表示「演奏多種樂器的能力」；原句要表達的是「識字、讀寫能力」。", "這個選項表示「對城市格局的了解」；原句要表達的是「識字、讀寫能力」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-35", "mode": "vocab", "paragraph": "D", "sentence": "Author and columnist Stephen Marche wrote that separation from other people is one of the first things ordinary Americans spend their money achieving.", "target": "columnist", "options": ["a writer who regularly contributes opinion pieces", "a person who designs structural columns", "an official conducting a census"], "answer": 0, "explanations": ["此處 columnist 表示「專欄作家」。須依原句語境理解。", "這個選項表示「設計建築柱的人」；原句要表達的是「專欄作家」。", "這個選項表示「進行人口普查的官員」；原句要表達的是「專欄作家」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-36", "mode": "vocab", "paragraph": "D", "sentence": "It is “a by-product of a long-standing national appetite for independence,” he said.", "target": "by-product", "options": ["a secondary result of something else", "the main intended goal", "a product purchased second-hand"], "answer": 0, "explanations": ["此處 by-product 表示「附帶產物、衍生結果」。須依原句語境理解。", "這個選項表示「主要預定目標」；原句要表達的是「附帶產物、衍生結果」。", "這個選項表示「二手購買的產品」；原句要表達的是「附帶產物、衍生結果」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-37", "mode": "vocab", "paragraph": "D", "sentence": "It is “a by-product of a long-standing national appetite for independence,” he said.", "target": "long-standing", "options": ["existing for a long time", "requiring people to remain standing", "introduced very recently"], "answer": 0, "explanations": ["此處 long-standing 表示「長期存在的」。須依原句語境理解。", "這個選項表示「要求人們一直站立的」；原句要表達的是「長期存在的」。", "這個選項表示「最近才引進的」；原句要表達的是「長期存在的」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-38", "mode": "vocab", "paragraph": "D", "sentence": "It is “a by-product of a long-standing national appetite for independence,” he said.", "target": "appetite for", "options": ["a strong desire for", "a physical need to eat", "a deep distrust of"], "answer": 0, "explanations": ["此處 appetite for 表示「對……的強烈渴望」。須依原句語境理解。", "這個選項表示「進食的生理需求」；原句要表達的是「對……的強烈渴望」。", "這個選項表示「對……的深深不信任」；原句要表達的是「對……的強烈渴望」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-39", "mode": "vocab", "paragraph": "D", "sentence": "Marche is right; wealth can buy — and modern technology can deliver — personal independence, and it is this that people have always sought.", "target": "deliver", "options": ["provide or bring about successfully", "transport a parcel only", "give a public speech only"], "answer": 0, "explanations": ["此處 deliver 表示「提供、實現」。須依原句語境理解。", "這個選項表示「只指運送包裹」；原句要表達的是「提供、實現」。", "這個選項表示「只指發表演講」；原句要表達的是「提供、實現」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-40", "mode": "vocab", "paragraph": "D", "sentence": "Marche is right; wealth can buy — and modern technology can deliver — personal independence, and it is this that people have always sought.", "target": "sought", "options": ["tried to obtain or achieve", "avoided whenever possible", "gave away without payment"], "answer": 0, "explanations": ["此處 sought 表示「尋求、追求」。須依原句語境理解。", "這個選項表示「盡可能避免」；原句要表達的是「尋求、追求」。", "這個選項表示「無償送出」；原句要表達的是「尋求、追求」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-41", "mode": "vocab", "paragraph": "D", "sentence": "Dr Michael Bull, an expert on personal music devices from the University of Sussex in the UK, has repeatedly made the larger point that personal music devices change how we relate to public spaces.", "target": "relate to", "options": ["experience or engage with", "give a spoken account of", "be biologically related to"], "answer": 0, "explanations": ["此處 relate to 表示「與……互動、建立關係」。須依原句語境理解。", "這個選項表示「口頭敘述」；原句要表達的是「與……互動、建立關係」。", "這個選項表示「與……有血緣關係」；原句要表達的是「與……互動、建立關係」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-42", "mode": "vocab", "paragraph": "D", "sentence": "“With the urban space, the more it's inhabited, the safer you feel,” Bull says.", "target": "inhabited", "options": ["occupied by people living there", "legally protected from development", "temporarily closed to visitors"], "answer": 0, "explanations": ["此處 inhabited 表示「有人居住的」。須依原句語境理解。", "這個選項表示「依法禁止開發的」；原句要表達的是「有人居住的」。", "這個選項表示「暫時不對訪客開放的」；原句要表達的是「有人居住的」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-43", "mode": "vocab", "paragraph": "D", "sentence": "“You feel safe if you can feel people there, but you don't want to interact with them.”", "target": "interact with", "options": ["communicate or engage with", "remain completely separate from", "exercise authority over"], "answer": 0, "explanations": ["此處 interact with 表示「與……互動」。須依原句語境理解。", "這個選項表示「與……完全隔離」；原句要表達的是「與……互動」。", "這個選項表示「對……行使權力」；原句要表達的是「與……互動」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-44", "mode": "vocab", "paragraph": "D", "sentence": "Headphones create shields for wearers, separating them from other people and their surroundings.", "target": "shields", "options": ["protective barriers separating people from their surroundings", "devices that make music louder", "signs requiring everyone to speak"], "answer": 0, "explanations": ["此處 shields 表示「隔絕周遭的保護屏障」。須依原句語境理解。", "這個選項表示「放大音樂的設備」；原句要表達的是「隔絕周遭的保護屏障」。", "這個選項表示「要求所有人說話的標誌」；原句要表達的是「隔絕周遭的保護屏障」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-45", "mode": "vocab", "paragraph": "D", "sentence": "Americans are not alone in their desire for personal independence and privacy.", "target": "privacy", "options": ["freedom from unwanted observation or interference", "secrecy required by law in all cases", "complete physical solitude at all times"], "answer": 0, "explanations": ["此處 privacy 表示「不受窺探或干擾的私人空間」。須依原句語境理解。", "這個選項表示「所有情況下法律要求的保密」；原句要表達的是「不受窺探或干擾的私人空間」。", "這個選項表示「任何時候都完全獨處」；原句要表達的是「不受窺探或干擾的私人空間」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-46", "mode": "vocab", "paragraph": "E", "sentence": "The outcome of relaxation, reflection and pausing at work won't be captured in minute-to-minute productivity metrics.", "target": "captured", "options": ["recorded or represented adequately", "physically detained", "obtained by stealing"], "answer": 0, "explanations": ["此處 captured 表示「記錄、呈現出來」。須依原句語境理解。", "這個選項表示「實際拘捕」；原句要表達的是「記錄、呈現出來」。", "這個選項表示「偷取獲得」；原句要表達的是「記錄、呈現出來」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-47", "mode": "vocab", "paragraph": "E", "sentence": "The outcome of relaxation, reflection and pausing at work won't be captured in minute-to-minute productivity metrics.", "target": "productivity metrics", "options": ["measurements used to assess work output or efficiency", "rules governing musical rhythm", "devices measuring only sound volume"], "answer": 0, "explanations": ["此處 productivity metrics 表示「評估工作產出或效率的指標」。須依原句語境理解。", "這個選項表示「管理音樂節奏的規則」；原句要表達的是「評估工作產出或效率的指標」。", "這個選項表示「只測量音量的裝置」；原句要表達的是「評估工作產出或效率的指標」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-48", "mode": "vocab", "paragraph": "E", "sentence": "What must be considered is that in moments of extreme focus, our attention radiates outward, toward the problem, rather than inward, on how to solve the problem.", "target": "radiates outward", "options": ["extends away from the self towards something external", "returns towards personal reflection", "disappears completely"], "answer": 0, "explanations": ["此處 radiates outward 表示「向外延伸、朝外部事物集中」。須依原句語境理解。", "這個選項表示「轉向內在反思」；原句要表達的是「向外延伸、朝外部事物集中」。", "這個選項表示「完全消失」；原句要表達的是「向外延伸、朝外部事物集中」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-49", "mode": "vocab", "paragraph": "E", "sentence": "However, with music, “When our minds are at ease, we're more likely to direct the spotlight of attention inward,” Jonah Lehrer wrote in his book Imagine: How Creativity Works.", "target": "at ease", "options": ["relaxed and free from tension", "unable to remain conscious", "under strong pressure to perform"], "answer": 0, "explanations": ["此處 at ease 表示「放鬆、自在」。須依原句語境理解。", "這個選項表示「無法保持清醒」；原句要表達的是「放鬆、自在」。", "這個選項表示「承受強烈表現壓力」；原句要表達的是「放鬆、自在」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-50", "mode": "vocab", "paragraph": "E", "sentence": "However, with music, “When our minds are at ease, we're more likely to direct the spotlight of attention inward,” Jonah Lehrer wrote in his book Imagine: How Creativity Works.", "target": "spotlight of attention", "options": ["the point on which mental focus is concentrated", "a literal beam lighting up the brain", "a device measuring concentration"], "answer": 0, "explanations": ["此處 spotlight of attention 表示「注意力集中的焦點」。須依原句語境理解。", "這個選項表示「實際照亮大腦的光束」；原句要表達的是「注意力集中的焦點」。", "這個選項表示「測量專注力的裝置」；原句要表達的是「注意力集中的焦點」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-51", "mode": "vocab", "paragraph": "E", "sentence": "In a crowded world, real estate is the ultimate scarce resource, and a pair of headphones is a small invisible fence around our minds — making space, creating separation, and helping us listen to ourselves.", "target": "real estate", "options": ["land and buildings considered as property", "an accurate mental picture", "all privately owned headphones"], "answer": 0, "explanations": ["此處 real estate 表示「房地產、土地與建物」。須依原句語境理解。", "這個選項表示「準確的心像」；原句要表達的是「房地產、土地與建物」。", "這個選項表示「全部私人耳機」；原句要表達的是「房地產、土地與建物」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-52", "mode": "vocab", "paragraph": "E", "sentence": "In a crowded world, real estate is the ultimate scarce resource, and a pair of headphones is a small invisible fence around our minds — making space, creating separation, and helping us listen to ourselves.", "target": "scarce resource", "options": ["something valuable available only in limited quantities", "something available without limit", "something unwanted and easily discarded"], "answer": 0, "explanations": ["此處 scarce resource 表示「稀缺資源」。須依原句語境理解。", "這個選項表示「供應無限的東西」；原句要表達的是「稀缺資源」。", "這個選項表示「無人需要且可隨意丟棄的東西」；原句要表達的是「稀缺資源」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-53", "mode": "vocab", "paragraph": "A", "sentence": "Scientists do not share this belief; they maintain that listening to music hurts people's ability to recall other things they should be doing, and any pop song, loud or soft, reduces overall performance for both extroverts and introverts.", "target": "overall", "options": ["considering all relevant aspects together", "limited to one isolated factor", "unrelated to the final result"], "answer": 0, "explanations": ["此處 overall 表示「整體的、總體的」。須依原句語境理解。", "這個選項表示「僅限單一因素的」；原句要表達的是「整體的、總體的」。", "這個選項表示「與最終結果無關的」；原句要表達的是「整體的、總體的」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-54", "mode": "vocab", "paragraph": "A", "sentence": "One factor to consider is that countries like the USA have moved from a farming and manufacturing economy to a service economy, with an emphasis on jobs in offices that require higher levels of concentration, reflection and creativity.", "target": "manufacturing economy", "options": ["an economy based on making goods", "an economy relying only on tourism", "a method for inventing misleading statistics"], "answer": 0, "explanations": ["此處 manufacturing economy 表示「以製造業為主的經濟體」。須依原句語境理解。", "這個選項表示「僅依賴觀光的經濟體」；原句要表達的是「以製造業為主的經濟體」。", "這個選項表示「捏造誤導性統計的方法」；原句要表達的是「以製造業為主的經濟體」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-55", "mode": "vocab", "paragraph": "A", "sentence": "As an estimated 70 percent of office workers work in open-plan office spaces, it is more important to create one's own enclosing bubble of sound.", "target": "estimated", "options": ["approximately calculated", "measured with absolute certainty", "deliberately concealed"], "answer": 0, "explanations": ["此處 estimated 表示「估計的」。須依原句語境理解。", "這個選項表示「以絕對確定性測量的」；原句要表達的是「估計的」。", "這個選項表示「刻意隱藏的」；原句要表達的是「估計的」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-56", "mode": "vocab", "paragraph": "A", "sentence": "Lending strength to the argument for headphones at work is evidence that music relaxes our muscles, improves our mood, and may even moderately reduce blood pressure, heart rate and anxiety.", "target": "blood pressure", "options": ["the force of circulating blood against vessel walls", "the speed of musical beats", "the amount of oxygen in office air"], "answer": 0, "explanations": ["此處 blood pressure 表示「血壓」。須依原句語境理解。", "這個選項表示「音樂節拍的速度」；原句要表達的是「血壓」。", "這個選項表示「辦公室空氣的含氧量」；原句要表達的是「血壓」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-57", "mode": "vocab", "paragraph": "E", "sentence": "In a crowded world, real estate is the ultimate scarce resource, and a pair of headphones is a small invisible fence around our minds — making space, creating separation, and helping us listen to ourselves.", "target": "ultimate", "options": ["the most extreme or fundamental example in this context", "the most recently purchased", "the least important of all"], "answer": 0, "explanations": ["此處 ultimate 表示「最根本、極致的」。須依原句語境理解。", "這個選項表示「最近購買的」；原句要表達的是「最根本、極致的」。", "這個選項表示「所有事物中最不重要的」；原句要表達的是「最根本、極致的」。"], "tag": "字彙與語境義"}, {"id": "headphones-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "To visit a typical modern office today is to walk into a room with possibly a dozen songs playing simultaneously but to hear none of them.", "target": "", "options": ["A modern office may contain many people listening to different songs, even though a visitor cannot hear those songs.", "Visitors to modern offices always hear every song playing through workers' headphones.", "No music is playing in the office because none can be heard by the visitor."], "answer": 0, "explanations": ["possibly 與 none of them 可同時成立：歌曲在耳機內播放，外人聽不到。", "possibly 不是 always，且 hear none 與聽見全部相反。", "聽不到不能推出沒有播放，這是句子特意呈現的反差。"], "tag": "長難句理解", "structure": "To visit... 是主詞不定詞；is to walk...but to hear... 是並列補語；with...songs playing... 為伴隨結構；them 指 songs，不是 workers。"}, {"id": "headphones-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "Up to half of younger workers listen to music on their headphones, and nearly all of them think it makes them better at their jobs.", "target": "", "options": ["No more than about half of younger workers use headphones, and almost all of those users think music helps their job performance.", "Nearly all younger workers use headphones, although only half of the users think music helps.", "Exactly half of all workers have been scientifically proved to work better with music."], "answer": 0, "explanations": ["nearly all of them 指前述戴耳機的年輕工作者；think 是主觀信念。", "把使用者比例與其信念比例交換，改變兩個群體。", "up to 非恰好，younger workers 非所有人，think 非研究證明。"], "tag": "長難句理解", "structure": "Up to half of younger workers 是第一主詞；and 後 nearly all of them 指已提及的使用者；think 後嵌入 it makes them...；it 指音樂，第二個 them 指使用者。"}, {"id": "headphones-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "Scientists do not share this belief; they maintain that listening to music hurts people's ability to recall other things they should be doing, and any pop song, loud or soft, reduces overall performance for both extroverts and introverts.", "target": "", "options": ["The scientists described disagree with the belief that music helps, arguing that it impairs recall and performance.", "The scientists confirm workers' belief that every kind of music improves their performance.", "The scientists say only loud songs impair performance, while quiet songs are harmless."], "answer": 0, "explanations": ["do not share 否定認同；loud or soft 表音量兩種都包含。", "把研究者與工作者的不同看法改成一致。", "忽略 loud or soft 的範圍，把影響限縮為大聲歌曲。"], "tag": "長難句理解", "structure": "分號前 Scientists do not share this belief；分號後 they maintain that... 報告其主張；that 後兩個並列內容為 listening hurts... 與 any pop song reduces...；both...and...涵蓋兩類性格。"}, {"id": "headphones-paraphrase-4", "mode": "paraphrase", "paragraph": "A", "sentence": "A Taiwanese study linked music that has lyrics to lower marks on concentration tests for college students, and other research has shown music with lyrics scrambles our brains’ verbal-processing skills.", "target": "", "options": ["The reported research connects lyrical music with poorer concentration scores and disrupted language processing.", "The Taiwanese study established that all instrumental music always improves test scores.", "The research concerned only musicians' ability to memorise song lyrics."], "answer": 0, "explanations": ["linked...to... 表連結；研究描述是有歌詞的音樂與測驗及語言處理，不是只測背歌詞。", "原句沒有研究器樂必然改善成績，更沒有 all、always。", "把測驗專注和語言處理換成背歌詞，改變測量對象。"], "tag": "長難句理解", "structure": "A Taiwanese study linked X to Y 是第一主句；that has lyrics 修飾 music；and 連接 other research has shown...；後者的受詞子句以 music with lyrics 為主詞。"}, {"id": "headphones-paraphrase-5", "mode": "paraphrase", "paragraph": "A", "sentence": "One factor to consider is that countries like the USA have moved from a farming and manufacturing economy to a service economy, with an emphasis on jobs in offices that require higher levels of concentration, reflection and creativity.", "target": "", "options": ["A shift towards service work has increased the relevance of office jobs requiring concentration, reflection and creativity.", "The shift towards services means office workers no longer need concentration.", "The sentence says farming and manufacturing require exactly the same abilities as every office job."], "answer": 0, "explanations": ["with an emphasis...補充服務經濟的工作特徵，that require...修飾辦公室工作。", "把 require higher levels 改成不再需要，反轉句意。", "文中沒有比較所有行業的能力完全相同。"], "tag": "長難句理解", "structure": "One factor...is that... 為主幹；that 內 countries have moved from X to Y；with an emphasis...補充 Y 的特徵；that require...修飾 jobs，不是 countries。"}, {"id": "headphones-paraphrase-6", "mode": "paraphrase", "paragraph": "A", "sentence": "As an estimated 70 percent of office workers work in open-plan office spaces, it is more important to create one's own enclosing bubble of sound.", "target": "", "options": ["The prevalence of shared office layouts makes creating a personal sound environment more important.", "Seventy per cent of office workers have been shown to dislike all forms of music.", "Only people in private offices need an individual sound environment."], "answer": 0, "explanations": ["As 為原因，estimated 70 percent 說開放式辦公比例，不是厭惡音樂的比例。", "把測量的格局比例改成音樂態度。", "原句用開放式辦公來解釋個人聲音空間的重要，非僅限私人辦公室。"], "tag": "長難句理解", "structure": "As an estimated...work... 是原因子句；it is more important to create... 中 it 為虛主詞，真正內容是 to 不定詞；one's own enclosing bubble 為個人隔離空間的比喻。"}, {"id": "headphones-paraphrase-7", "mode": "paraphrase", "paragraph": "A", "sentence": "Lending strength to the argument for headphones at work is evidence that music relaxes our muscles, improves our mood, and may even moderately reduce blood pressure, heart rate and anxiety.", "target": "", "options": ["Evidence of relaxation and possible moderate physiological benefits lends support to the case for headphones at work.", "Music has been proved to eliminate anxiety and permanently normalise everyone's blood pressure.", "The evidence gives no support at all to the case for headphones."], "answer": 0, "explanations": ["is evidence... 是倒裝主幹；may even moderately 限定部分效果的可能性及幅度。", "把 may、moderately 改成已證明、永久、每個人且完全消除，嚴重誇大。", "Lending strength 明確表示提供支持，非毫無支持。"], "tag": "長難句理解", "structure": "Lending strength to the argument... 置前；is evidence that... 為倒裝句，evidence 是主詞；that 子句依序列 relaxes、improves、may reduce；may 不可省成確定。"}, {"id": "headphones-paraphrase-8", "mode": "paraphrase", "paragraph": "B", "sentence": "The letter writer, an eccentric inventor and repairman named Nathaniel Baldwin, from the US state of Utah, made what at the time was an astonishing claim: he had built, in his kitchen, a new kind of headset that could amplify sound.", "target": "", "options": ["Baldwin's surprising claim was that he had already built a sound-amplifying headset in his kitchen.", "Baldwin merely planned to build a headset if the Navy first agreed to fund a laboratory.", "The Navy had already invented the headset before Baldwin wrote to it."], "answer": 0, "explanations": ["he had built 為過去完成式，表寫信聲稱前已完成；in his kitchen 是製作地點。", "把已完成改成條件式計畫，並憑空加入資助及實驗室。", "把主張發明者由 Baldwin 換成 Navy。"], "tag": "長難句理解", "structure": "The letter writer 為主詞，後有 an eccentric inventor...同位補充；made what...was an astonishing claim 的 what 為融合關係；冒號後 he had built...說明 claim 內容。"}, {"id": "headphones-paraphrase-9", "mode": "paraphrase", "paragraph": "B", "sentence": "This was an opportune invention for the Navy, which asked for a sound test and then enthusiastically adopted the headsets, later called headphones, and used them in World War I for naval radio communication.", "target": "", "options": ["The Navy tested and then adopted the timely invention for wartime radio communication.", "The Navy adopted the headsets without asking for a test.", "The Navy rejected the invention because it arrived after the war had ended."], "answer": 0, "explanations": ["which 回指 Navy；asked、adopted、used 建立先測試後採用及使用的步驟。", "忽略 asked for a sound test，誤說從未測試。", "opportune 為時機恰好，並非太晚而遭拒。"], "tag": "長難句理解", "structure": "This 指前述發明；which 引導 Navy 的非限定關係子句；asked...and then adopted...and used... 三個動詞共用 Navy；later called headphones 被動分詞修飾 headsets。"}, {"id": "headphones-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "The purpose of headphones is to concentrate a quiet and private sound in the ear of the listener, which is a radical departure from music's social purpose in history.", "target": "", "options": ["Directing private sound into a listener's ear differs fundamentally from music's historical social role.", "Headphones simply preserve music's historical function of bringing listeners together in public.", "The sentence says music had no social role before headphones were invented."], "answer": 0, "explanations": ["which 回指前述私人聆聽功能，a radical departure 強調與社會功能的顯著不同。", "將根本改變說成原樣延續。", "原句以歷史社會功能作比較基礎，並非否認其存在。"], "tag": "長難句理解", "structure": "The purpose...is to concentrate... 是主幹；of the listener 修飾 ear；which is... 非限定關係子句評述整件事；from music's social purpose 指比較基準。"}, {"id": "headphones-paraphrase-11", "mode": "paraphrase", "paragraph": "C", "sentence": "“Music, together with dance, co-evolved biologically and culturally to serve as a technology of social bonding,” Nils L. Wallin and Björn Merker wrote in The Origins of Music.", "target": "", "options": ["The cited authors present music and dance as developing together in ways that strengthen social connections.", "The cited authors argue that music developed entirely independently of dance and culture.", "The cited authors say that music was originally designed for private headphone listening."], "answer": 0, "explanations": ["co-evolved、biologically and culturally、social bonding 都保留共同發展及群體功能。", "與 together、co-evolved 相反，也刪除文化面向。", "把古老社會連結功能替換成現代耳機用途。"], "tag": "長難句理解", "structure": "Music 是主詞；together with dance 為插入補充，不改主詞數；co-evolved 是動詞；biologically and culturally 為平行副詞；to serve as... 表功能。"}, {"id": "headphones-paraphrase-12", "mode": "paraphrase", "paragraph": "C", "sentence": "If music evolved as a social glue for the species, as a way to make groups and keep them together, headphones have done what writing and literacy did for language — they made music private.", "target": "", "options": ["If music originally helped unite groups, headphones have made it private in a way comparable to writing's effect on language.", "Headphones and writing both necessarily prevent people from forming any social relationships.", "Headphones made music public for the first time, just as writing first made language public."], "answer": 0, "explanations": ["If 是推論前提；they made music private 是類比的核心，不是社交完全消失。", "私人化不等於阻絕所有社會關係，過度推論。", "private 不能改成 public，類比方向顛倒。"], "tag": "長難句理解", "structure": "If music evolved... 是條件前提；as a way...補充 social glue；headphones have done what... 中 what 引出被類比的作用；破折號後 they made music private 解釋類比。"}, {"id": "headphones-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "Marche is right; wealth can buy — and modern technology can deliver — personal independence, and it is this that people have always sought.", "target": "", "options": ["The writer agrees that money and technology can provide the personal independence people have long wanted.", "The writer rejects Marche's claim that money can buy independence.", "The writer claims that technology has made people stop wanting personal independence."], "answer": 0, "explanations": ["Marche is right 直接表認同；it is this... 強調追求的正是 personal independence。", "把明示贊同讀成反對。", "have always sought 表持續追求，非已放棄。"], "tag": "長難句理解", "structure": "分號後 wealth can buy 與 technology can deliver 並列，受詞 personal independence 共用；it is this that... 為強調句；this 回指 personal independence，不是所有科技產品。"}, {"id": "headphones-paraphrase-14", "mode": "paraphrase", "paragraph": "D", "sentence": "Controlling our public spaces is more important now that more people are moving from the edges of cities to live in urban centres.", "target": "", "options": ["As more people move into urban centres, managing one's experience of shared public space becomes more important.", "People must move out of cities before they can control their experience of public space.", "The writer says urban living has made control of shared space irrelevant."], "answer": 0, "explanations": ["now that 表在如今這個背景下的原因，主句是 more important。", "把移入城市改成必須移出，且憑空增加先決條件。", "irrelevant 與 more important 相反。"], "tag": "長難句理解", "structure": "Controlling our public spaces 是動名詞主詞；is more important 為主幹；now that... 是原因子句；from the edges...to live in... 標示移動起點與目的。"}, {"id": "headphones-paraphrase-15", "mode": "paraphrase", "paragraph": "D", "sentence": "“With the urban space, the more it's inhabited, the safer you feel,” Bull says.", "target": "", "options": ["Bull suggests that greater human presence in urban space can increase a person's feeling of safety.", "Bull claims that the fewer people live in an urban area, the safer everyone feels.", "Bull proves that every crowded place is objectively free from danger."], "answer": 0, "explanations": ["the more...,the safer... 是感受上的正向關聯，you feel 非客觀零風險證明。", "把人較多更覺安全改成相反方向。", "feel safe 不能升格為每處都確定沒有危險。"], "tag": "長難句理解", "structure": "With the urban space 提示討論主題；the more it's inhabited、the safer you feel 為相關比較結構；it 指 urban space；第一個 more 為居住程度，後者為安全感程度。"}, {"id": "headphones-paraphrase-16", "mode": "paraphrase", "paragraph": "D", "sentence": "We assume that people wearing them are busy and we should respect their privacy, so now people wear them to appear busy.", "target": "", "options": ["Because headphones are taken as a signal of being occupied, people may wear them to create that impression.", "Everyone who wears headphones is necessarily listening carefully to work instructions.", "People wear headphones so that others will be more likely to interrupt them."], "answer": 0, "explanations": ["We assume 與 to appear 區分外界推定及形象目的，未保證實際忙碌。", "把外觀訊號推為必然的實際活動，且加入工作指示。", "原句的 privacy 訊號是減少干擾，非吸引打斷。"], "tag": "長難句理解", "structure": "We assume that... 為主句；wearing them 分詞修飾 people；and we should respect... 並列判斷；so 引結果；to appear busy 表佩戴目的，appear 不等於 be。"}, {"id": "headphones-paraphrase-17", "mode": "paraphrase", "paragraph": "E", "sentence": "However, as pointed out at the beginning of this piece, although scientists have stated that headphones are bad for productivity, people still wear them at work.", "target": "", "options": ["People continue wearing headphones at work despite the negative productivity claims reported from scientists.", "Workers stopped using headphones as soon as scientists criticised productivity.", "The scientists are said to agree with every reason people give for wearing headphones."], "answer": 0, "explanations": ["although 表研究評價與使用行為不一致，still wear 才是行為主幹。", "將 still wear 改成 stopped，完全反轉。", "此句談負面研究評價，沒有宣告科學家認同所有使用理由。"], "tag": "長難句理解", "structure": "However 表轉折；as pointed out...是被動縮減子句；although scientists have stated... 為讓步；that...嵌入研究主張；people still wear them 為主句。"}, {"id": "headphones-paraphrase-18", "mode": "paraphrase", "paragraph": "E", "sentence": "The outcome of relaxation, reflection and pausing at work won't be captured in minute-to-minute productivity metrics.", "target": "", "options": ["Short-term productivity measurements may fail to represent the benefits of relaxation and reflection at work.", "Relaxation and reflection necessarily have no value because metrics do not record them.", "Minute-by-minute productivity figures fully capture every consequence of listening to music."], "answer": 0, "explanations": ["won't be captured 指測量呈現不足，不等於沒被量出的結果沒有價值。", "將測量限制誤當成價值不存在的證明。", "fully capture 與 won't be captured 相反。"], "tag": "長難句理解", "structure": "The outcome of relaxation, reflection and pausing 是主詞，核心 outcome 為單數；won't be captured 為否定被動；in...metrics 表測量架構，不是事件實際不發生。"}, {"id": "headphones-paraphrase-19", "mode": "paraphrase", "paragraph": "E", "sentence": "What must be considered is that in moments of extreme focus, our attention radiates outward, toward the problem, rather than inward, on how to solve the problem.", "target": "", "options": ["The writer asks readers to consider how intense concentration can direct attention towards the problem rather than inward towards solving it.", "The writer says attention during intense concentration is always directed inward rather than towards the problem.", "The writer states that concentrating intensely prevents anyone from noticing a problem."], "answer": 0, "explanations": ["rather than 區分注意外部問題與內在解題方式，沒有說完全看不到問題。", "將 outward 與 inward 兩個方向交換。", "原句 toward the problem 表注意問題，非無法察覺問題。"], "tag": "長難句理解", "structure": "What must be considered 是主詞子句；is that...為表語內容；in moments...為時間背景；our attention radiates outward 是嵌入主幹；rather than inward...修正比較焦點。"}, {"id": "headphones-paraphrase-20", "mode": "paraphrase", "paragraph": "E", "sentence": "However, with music, “When our minds are at ease, we're more likely to direct the spotlight of attention inward,” Jonah Lehrer wrote in his book Imagine: How Creativity Works.", "target": "", "options": ["Lehrer suggests that a relaxed mind is more likely to turn attention inward.", "Lehrer guarantees that relaxation always produces a correct solution instantly.", "Lehrer says relaxed people are less likely to reflect on their own thinking."], "answer": 0, "explanations": ["more likely 保留機率，並不保證必然、正確或立刻。", "將機率提高誇大為每次立刻得到正解。", "inward 與反思方向一致，不能改成較不會內省。"], "tag": "長難句理解", "structure": "When our minds are at ease 為時間／情況子句；we're more likely to direct...為主幹；the spotlight...是注意焦點的比喻；inward 表方向；引述是 Lehrer's claim 而非確定定律。"}, {"id": "headphones-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "Young people are easily persuaded by surveys that listening to music is beneficial.", "target": "beneficial", "options": ["有益的", "有害的", "必然無效的"], "answer": 0, "explanations": ["beneficial 指能帶來好處。此處練習題目用語，不表示整句符合原文。", "有害是 harmful，方向相反", "無效不是有益"], "tag": "題目字彙", "source": "Question 27 · 題目用語"}, {"id": "headphones-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Different studies share the same conclusions about the desirability of working in silence.", "target": "desirability", "options": ["值得嚮往或採行的程度", "實際發生的頻率", "法律強制的程度"], "answer": 0, "explanations": ["desirability 問的是是否可取，而非是否被強迫。此處練習題目用語，不表示整句符合原文。", "頻率是 frequency", "可取不等於依法強制"], "tag": "題目字彙", "source": "Question 28 · 題目用語"}, {"id": "headphones-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "The effect of the invention of headphones is comparable to the effect of the invention of writing.", "target": "comparable to", "options": ["可與……相比擬", "與……完全相同且無差異", "與……完全無關"], "answer": 0, "explanations": ["comparable 表可合理比較，不要求完全一致。此處練習題目用語，不表示整句符合原文。", "可比不等於所有方面相同", "能相比不是毫無關聯"], "tag": "題目字彙", "source": "Question 31 · 題目用語"}, {"id": "headphones-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "The work is mentally demanding.", "target": "mentally demanding", "options": ["需要大量心智投入的", "只需體力的", "完全不需思考的"], "answer": 0, "explanations": ["mental 與心智有關，demanding 指要求高。此處練習題目用語，不表示整句符合原文。", "不能改為只需體力", "要求高與不需思考相反"], "tag": "題目字彙", "source": "Question 32 A · 題目用語"}, {"id": "headphones-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "The writer is emphasising the diversity of musical forms.", "target": "diversity", "options": ["多樣性", "完全一致性", "時間上的精確度"], "answer": 0, "explanations": ["diversity 指形式種類的多樣。此處練習題目用語，不表示整句符合原文。", "一致與多樣相反", "不是計時精確度"], "tag": "題目字彙", "source": "Question 33 A · 題目用語"}, {"id": "headphones-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "The writer is expressing frustration with the limited archaeological evidence uncovered.", "target": "frustration", "options": ["挫折、懊惱", "毫無保留的滿意", "客觀的測量單位"], "answer": 0, "explanations": ["frustration 是受阻或不如意的情緒。此處練習題目用語，不表示整句符合原文。", "滿意與挫折相反", "這是情緒名詞，不是單位"], "tag": "題目字彙", "source": "Question 33 B · 題目用語"}, {"id": "headphones-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "The writer is expressing frustration with the limited archaeological evidence uncovered.", "target": "archaeological evidence", "options": ["考古出土或研究所得的證據", "尚未實施的市場問卷", "歌曲的正式版權"], "answer": 0, "explanations": ["archaeological 指以遺物研究過去人類活動。此處練習題目用語，不表示整句符合原文。", "市場問卷不是考古材料", "版權不是此處的證據類型"], "tag": "題目字彙", "source": "Question 33 B · 題目用語"}, {"id": "headphones-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "The writer is expressing frustration with the limited archaeological evidence uncovered.", "target": "uncovered", "options": ["被發現、揭露的", "刻意隱藏的", "未受到布料覆蓋的"], "answer": 0, "explanations": ["evidence uncovered 指發現的證據，非字面沒蓋布。此處練習題目用語，不表示整句符合原文。", "隱藏與揭露相反", "沒蓋布是字面義，不合證據語境"], "tag": "題目字彙", "source": "Question 33 B · 題目用語"}, {"id": "headphones-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "The writer is lending support to the view that music has been important in human history.", "target": "lending support to", "options": ["為……提供支持", "暫借實物給……", "完全推翻……"], "answer": 0, "explanations": ["lend support to 是支持論點的搭配。此處練習題目用語，不表示整句符合原文。", "此處借出的是支持的比喻，非借物", "支持不是推翻"], "tag": "題目字彙", "source": "Question 33 C · 題目用語"}, {"id": "headphones-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "It has reduced the global variation of music styles.", "target": "variation", "options": ["差異、變化的多樣性", "全球人口總數", "固定不變的標準"], "answer": 0, "explanations": ["variation of styles 指風格間的差異。此處練習題目用語，不表示整句符合原文。", "不是人口數量", "差異不是固定標準"], "tag": "題目字彙", "source": "Question 34 C · 題目用語"}, {"id": "headphones-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "Americans are unique in their desire for personal independence.", "target": "unique", "options": ["獨有、與眾不同的", "在任何地方都一模一樣的", "法律規定的"], "answer": 0, "explanations": ["unique 指獨特性；是否真如此須另依原文判斷。此處練習題目用語，不表示整句符合原文。", "普遍一樣與獨特相反", "獨特不表示依法規定"], "tag": "題目字彙", "source": "Question 35 A · 題目用語"}, {"id": "headphones-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "To draw attention to an authoritative book about music.", "target": "authoritative", "options": ["具權威、可信賴的", "專橫命令別人的", "完全匿名的"], "answer": 0, "explanations": ["authoritative book 指具知識權威的著作，不是 authoritarian。此處練習題目用語，不表示整句符合原文。", "專橫是 authoritarian，常見形近誤讀", "匿名是 anonymous"], "tag": "題目字彙", "source": "Question 36 B · 題目用語"}, {"id": "headphones-questionVocab-13", "mode": "questionVocab", "paragraph": "", "sentence": "In densely populated city centres, headphones form barriers that isolate people from fellow citizens and their environment.", "target": "densely populated", "options": ["人口密集的", "人口稀少的", "只有旅客暫住的"], "answer": 0, "explanations": ["densely 修飾 populated，指人口密度高。此處練習題目用語，不表示整句符合原文。", "稀少是 sparsely populated", "密度不限定只能有旅客"], "tag": "題目字彙", "source": "Question 37–40 · 題目用語"}, {"id": "headphones-questionVocab-14", "mode": "questionVocab", "paragraph": "", "sentence": "In densely populated city centres, headphones form barriers that isolate people from fellow citizens and their environment.", "target": "barriers", "options": ["隔閡、阻隔屏障", "合作邀請", "聲音放大裝置"], "answer": 0, "explanations": ["barriers 在此指阻隔社交與周遭的屏障。此處練習題目用語，不表示整句符合原文。", "合作邀請不構成阻隔", "不是音量設備"], "tag": "題目字彙", "source": "Question 37–40 · 題目用語"}, {"id": "headphones-questionVocab-15", "mode": "questionVocab", "paragraph": "", "sentence": "In densely populated city centres, headphones form barriers that isolate people from fellow citizens and their environment.", "target": "isolate", "options": ["使隔離、疏離", "使緊密連結", "正式任命"], "answer": 0, "explanations": ["isolate A from B 指使兩者隔開。此處練習題目用語，不表示整句符合原文。", "連結與隔開相反", "不是職務任命"], "tag": "題目字彙", "source": "Question 37–40 · 題目用語"}, {"id": "headphones-questionVocab-16", "mode": "questionVocab", "paragraph": "", "sentence": "The options include courtesy, suburbs, barriers, obstacles and disapproval.", "target": "courtesy", "options": ["禮貌、禮遇", "共同利益", "強制參與"], "answer": 0, "explanations": ["courtesy 指有禮的對待或禮遇。此處練習題目用語，不表示整句符合原文。", "共同利益不是禮貌", "與強制參與無關"], "tag": "題目字彙", "source": "Question 37–40 Options · 題目用語"}, {"id": "headphones-questionVocab-17", "mode": "questionVocab", "paragraph": "", "sentence": "The options include courtesy, suburbs, barriers, obstacles and disapproval.", "target": "suburbs", "options": ["市郊、郊區", "城市正中心", "遙遠的無人荒漠"], "answer": 0, "explanations": ["suburbs 指城市周邊住宅區等。此處練習題目用語，不表示整句符合原文。", "市中心不是市郊", "郊區不等於完全無人的荒漠"], "tag": "題目字彙", "source": "Question 37–40 Options · 題目用語"}, {"id": "headphones-questionVocab-18", "mode": "questionVocab", "paragraph": "", "sentence": "The options include courtesy, suburbs, barriers, obstacles and disapproval.", "target": "obstacles", "options": ["阻礙、障礙", "利益、好處", "偶然的巧合"], "answer": 0, "explanations": ["obstacles 指妨礙進行的事物。此處練習題目用語，不表示整句符合原文。", "好處是 benefits", "障礙不等於巧合"], "tag": "題目字彙", "source": "Question 37–40 Options · 題目用語"}, {"id": "headphones-questionVocab-19", "mode": "questionVocab", "paragraph": "", "sentence": "The options include courtesy, suburbs, barriers, obstacles and disapproval.", "target": "disapproval", "options": ["不贊同、反對", "正式核准", "完全不知情"], "answer": 0, "explanations": ["disapproval 表負面的評價或不同意。此處練習題目用語，不表示整句符合原文。", "核准是 approval，反義方向", "不贊同不等於不知道"], "tag": "題目字彙", "source": "Question 37–40 Options · 題目用語"}]}, {"id": "katherine-mansfield", "title": "Katherine Mansfield", "sourceTitle": "Katherine Mansfield", "subtitle": "", "part": 1, "topic": "作家生涯、文學創作與時間關係", "sourceNote": "原題筆記提到的 1916 與正文的 1918 不一致，本複習不以該年份判定答案。原文拼寫與標點的明顯錯誤已修正。", "paragraphs": [{"label": "A", "text": "Katherine Mansfield Beauchamp Murry was born in 1888, into a prominent family in Wellington, New Zealand. She became one of New Zealand's best-known writers, using the pen name of Katherine Mansfield. The daughter of a banker, and born into a middle-class family, she was also a first cousin of Countess Elizabeth von Arnim, a distinguished novelist in her time. Mansfield had two older sisters and a younger brother. Her father, Harold Beauchamp, went on to become the chairman of the Bank of New Zealand. In 1893, the Mansfield family moved to Karori, a suburb of Wellington, where Mansfield would spend the happiest years of her childhood; she later used her memories of this time as an inspiration for her Prelude story."}, {"label": "B", "text": "Her first published stories appeared in the High School Reporter and the Wellington Girls’ High School magazine in 1898 and 1899. In 1902, she developed strong feelings for a musician who played the cello, Arnold Trowell, although her feelings were not, for the most part, returned. Mansfield herself was an accomplished cellist, having received lessons from Trowell's father. Mansfield wrote in her journals of feeling isolated to some extent in New Zealand, and, in general terms, of her interest in the Maori people (New Zealand's native people), who were often portrayed in a sympathetic light in her later stories, such as How Pearl Button Was Kidnapped."}, {"label": "C", "text": "She moved to London in 1903, where she attended Queen's College, along with her two sisters. Mansfield recommenced playing the cello, an occupation that she believed, during her time at Queen's, she would take up professionally. She also began contributing to the college newspaper, with such a dedication to it that she eventually became its editor. She was particularly interested in the works of the French writers of this period and in the 19th century British writer, Oscar Wilde, and she was appreciated amongst fellow students at Queen's for her lively and charismatic approach to life and work. She met fellow writer Ida Baker, a South African, at the college, and the pair became lifelong friends. Mansfield did not actively support the suffragette movement in the UK. Women in New Zealand had gained the right to vote in 1893."}, {"label": "D", "text": "Mansfield first began journeying into other parts of Europe in the period 1903-1906, mainly to Belgium and Germany. After finishing her schooling in England, she returned to her New Zealand home in 1906, only then beginning to write short stories in a serious way. She had several works published in Australia in a magazine called The Native Companion, which was her first paid writing work, and by this time she had her mind set on becoming a professional writer. It was also the first occasion on which she used the pseudonym “K. Mansfield”. Mansfield rapidly grew discontented with the provincial New Zealand lifestyle, and with her family. Two years later she headed again to London. Her father sent her an annual subsidy of £100 for the rest of her life. In later years, she would express both admiration and disdain for New Zealand in her journals."}, {"label": "E", "text": "In 1911, Mansfield met John Middleton Murry, the Oxford scholar and editor of the literary magazine Rhythm. They were later to marry in 1918. Mansfield became a co-editor of Rhythm, which was subsequently called The Blue Review, in which more of her works were published. She and Murry lived in various houses in England and briefly in Paris. The Blue Review failed to gain enough readers and was no longer published. Their attempt to set up as writers in Paris was cut short by Murry's bankruptcy, which resulted from the failure of this and other journals. Life back in England meant frequently changed addresses and very limited funds."}, {"label": "F", "text": "Between 1915 and 1918, Mansfield moved between England and Bandol, France. She and Murry developed close contact with other well-known writers of the time such as D. H. Lawrence, Bertrand Russell and Aldous Huxley. By October 1918 Mansfield had become seriously ill; she had been diagnosed with tuberculosis and was advised to enter a sanatorium. She could no longer spend winters in London. In the autumn of 1918 she was so ill that she decided to go to Ospedaletti in Italy. It was the publication of Bliss and Other Stories in 1920 that was to solidify Mansfield's reputation as a writer. Mansfield also spent time in Menton, France, as the tenant of her father's cousin at “The Villa Isola Bella”. There she wrote eight stories including Miss Brill and The Daughters of the Late Colonel, the latter of which she pronounced to be “... the only story that satisfies me to any extent”."}, {"label": "G", "text": "Mansfield produced a great deal of work in the final years of her life, and much of her prose and poetry remained unpublished at her death in 1923. After her death, her husband, Murry, took on the task of editing and publishing her works. His efforts resulted in two additional volumes of short stories, The Doves' Nest and Something Childish, published in 1923 and 1924 respectively; the publication of her Poems, as well as a collection of critical writings (Novels and Novelists) and a number of editions of Mansfield's previously unpublished letters and journals."}], "questions": [{"id": "mansfield-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Katherine Mansfield Beauchamp Murry was born in 1888, into a prominent family in Wellington, New Zealand.", "target": "prominent", "options": ["important and well known", "physically taller than others", "completely unknown"], "answer": 0, "explanations": ["此處 prominent 表示「重要且知名的」。須依原句語境理解。", "這個選項表示「身材比其他人高的」；原句要表達的是「重要且知名的」。", "這個選項表示「完全不知名的」；原句要表達的是「重要且知名的」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "She became one of New Zealand's best-known writers, using the pen name of Katherine Mansfield.", "target": "pen name", "options": ["a name used by a writer instead of their ordinary name", "the brand name of a writing instrument", "a formal academic title"], "answer": 0, "explanations": ["此處 pen name 表示「筆名」。須依原句語境理解。", "這個選項表示「書寫工具品牌名稱」；原句要表達的是「筆名」。", "這個選項表示「正式學術頭銜」；原句要表達的是「筆名」。"], "tag": "搭配與語境義"}, {"id": "mansfield-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "The daughter of a banker, and born into a middle-class family, she was also a first cousin of Countess Elizabeth von Arnim, a distinguished novelist in her time.", "target": "distinguished", "options": ["highly respected for achievement", "easy to distinguish by appearance alone", "deliberately kept anonymous"], "answer": 0, "explanations": ["此處 distinguished 表示「成就卓著、受尊敬的」。須依原句語境理解。", "這個選項表示「僅憑外貌容易區分的」；原句要表達的是「成就卓著、受尊敬的」。", "這個選項表示「刻意保持匿名的」；原句要表達的是「成就卓著、受尊敬的」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "Her father, Harold Beauchamp, went on to become the chairman of the Bank of New Zealand.", "target": "chairman", "options": ["the person leading an organisation or its board", "a person who makes office furniture", "an ordinary bank customer"], "answer": 0, "explanations": ["此處 chairman 表示「主席、董事長」。須依原句語境理解。", "這個選項表示「製造辦公家具的人」；原句要表達的是「主席、董事長」。", "這個選項表示「普通銀行客戶」；原句要表達的是「主席、董事長」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "In 1893, the Mansfield family moved to Karori, a suburb of Wellington, where Mansfield would spend the happiest years of her childhood; she later used her memories of this time as an inspiration for her Prelude story.", "target": "inspiration", "options": ["an influence that stimulates creative work", "a formal commission to publish", "a judgement proving factual accuracy"], "answer": 0, "explanations": ["此處 inspiration 表示「創作靈感的來源」。須依原句語境理解。", "這個選項表示「正式的出版委託」；原句要表達的是「創作靈感的來源」。", "這個選項表示「證明事實正確的判斷」；原句要表達的是「創作靈感的來源」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-6", "mode": "vocab", "paragraph": "B", "sentence": "In 1902, she developed strong feelings for a musician who played the cello, Arnold Trowell, although her feelings were not, for the most part, returned.", "target": "for the most part", "options": ["mainly or in most respects", "without any exception", "only after a long delay"], "answer": 0, "explanations": ["此處 for the most part 表示「大致上、大部分情況下」。須依原句語境理解。", "這個選項表示「毫無例外」；原句要表達的是「大致上、大部分情況下」。", "這個選項表示「只在長久延誤之後」；原句要表達的是「大致上、大部分情況下」。"], "tag": "搭配與語境義"}, {"id": "mansfield-vocab-7", "mode": "vocab", "paragraph": "B", "sentence": "In 1902, she developed strong feelings for a musician who played the cello, Arnold Trowell, although her feelings were not, for the most part, returned.", "target": "returned", "options": ["felt in response by the other person", "sent physically back to its starting place", "paid back in full"], "answer": 0, "explanations": ["此處 returned 表示「感情得到對方回應」。須依原句語境理解。", "這個選項表示「實際送回原地」；原句要表達的是「感情得到對方回應」。", "這個選項表示「全額償還」；原句要表達的是「感情得到對方回應」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-8", "mode": "vocab", "paragraph": "B", "sentence": "Mansfield herself was an accomplished cellist, having received lessons from Trowell's father.", "target": "accomplished", "options": ["highly skilled through training or experience", "having just begun to learn", "financially dependent"], "answer": 0, "explanations": ["此處 accomplished 表示「技藝精湛的」。須依原句語境理解。", "這個選項表示「剛開始學習的」；原句要表達的是「技藝精湛的」。", "這個選項表示「經濟依賴他人的」；原句要表達的是「技藝精湛的」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-9", "mode": "vocab", "paragraph": "B", "sentence": "Mansfield herself was an accomplished cellist, having received lessons from Trowell's father.", "target": "cellist", "options": ["a musician who plays the cello", "a musician who plays the violin", "a person who writes only poetry"], "answer": 0, "explanations": ["此處 cellist 表示「大提琴演奏者」。須依原句語境理解。", "這個選項表示「小提琴演奏者」；原句要表達的是「大提琴演奏者」。", "這個選項表示「只寫詩的人」；原句要表達的是「大提琴演奏者」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "Mansfield wrote in her journals of feeling isolated to some extent in New Zealand, and, in general terms, of her interest in the Maori people (New Zealand's native people), who were often portrayed in a sympathetic light in her later stories, such as How Pearl Button Was Kidnapped.", "target": "journals", "options": ["personal written records of experiences and thoughts", "scientific periodicals", "official school examination papers"], "answer": 0, "explanations": ["此處 journals 表示「私人日記、札記」。須依原句語境理解。", "這個選項表示「科學期刊」；原句要表達的是「私人日記、札記」。", "這個選項表示「學校正式考卷」；原句要表達的是「私人日記、札記」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "Mansfield wrote in her journals of feeling isolated to some extent in New Zealand, and, in general terms, of her interest in the Maori people (New Zealand's native people), who were often portrayed in a sympathetic light in her later stories, such as How Pearl Button Was Kidnapped.", "target": "isolated", "options": ["feeling separated from others", "protected against every illness", "fully integrated into a community"], "answer": 0, "explanations": ["此處 isolated 表示「感到孤立的」。須依原句語境理解。", "這個選項表示「免於所有疾病的」；原句要表達的是「感到孤立的」。", "這個選項表示「完全融入社群的」；原句要表達的是「感到孤立的」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "Mansfield wrote in her journals of feeling isolated to some extent in New Zealand, and, in general terms, of her interest in the Maori people (New Zealand's native people), who were often portrayed in a sympathetic light in her later stories, such as How Pearl Button Was Kidnapped.", "target": "portrayed", "options": ["represented or depicted", "photographed without comment", "formally elected"], "answer": 0, "explanations": ["此處 portrayed 表示「描寫、刻畫」。須依原句語境理解。", "這個選項表示「不附評論地拍照」；原句要表達的是「描寫、刻畫」。", "這個選項表示「正式選出」；原句要表達的是「描寫、刻畫」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "Mansfield wrote in her journals of feeling isolated to some extent in New Zealand, and, in general terms, of her interest in the Maori people (New Zealand's native people), who were often portrayed in a sympathetic light in her later stories, such as How Pearl Button Was Kidnapped.", "target": "in a sympathetic light", "options": ["in an understanding and favourable way", "as objects of ridicule", "under soft physical lighting"], "answer": 0, "explanations": ["此處 in a sympathetic light 表示「以同理、友善的角度」。須依原句語境理解。", "這個選項表示「作為嘲諷的對象」；原句要表達的是「以同理、友善的角度」。", "這個選項表示「在柔和實體燈光下」；原句要表達的是「以同理、友善的角度」。"], "tag": "搭配與語境義"}, {"id": "mansfield-vocab-14", "mode": "vocab", "paragraph": "C", "sentence": "Mansfield recommenced playing the cello, an occupation that she believed, during her time at Queen's, she would take up professionally.", "target": "recommenced", "options": ["started again after a pause", "gave up permanently", "continued without interruption"], "answer": 0, "explanations": ["此處 recommenced 表示「重新開始」。須依原句語境理解。", "這個選項表示「永久放棄」；原句要表達的是「重新開始」。", "這個選項表示「毫無中斷地繼續」；原句要表達的是「重新開始」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-15", "mode": "vocab", "paragraph": "C", "sentence": "Mansfield recommenced playing the cello, an occupation that she believed, during her time at Queen's, she would take up professionally.", "target": "occupation", "options": ["an activity pursued as a profession", "military control of territory", "the act of occupying a seat"], "answer": 0, "explanations": ["此處 occupation 表示「職業、專業活動」。須依原句語境理解。", "這個選項表示「軍事佔領領土」；原句要表達的是「職業、專業活動」。", "這個選項表示「佔用座位的動作」；原句要表達的是「職業、專業活動」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-16", "mode": "vocab", "paragraph": "C", "sentence": "She also began contributing to the college newspaper, with such a dedication to it that she eventually became its editor.", "target": "contributing to", "options": ["providing written material for", "paying mandatory fees to", "preventing the publication of"], "answer": 0, "explanations": ["此處 contributing to 表示「為……撰稿」。須依原句語境理解。", "這個選項表示「向……繳納強制費用」；原句要表達的是「為……撰稿」。", "這個選項表示「阻止……出版」；原句要表達的是「為……撰稿」。"], "tag": "搭配與語境義"}, {"id": "mansfield-vocab-17", "mode": "vocab", "paragraph": "C", "sentence": "She also began contributing to the college newspaper, with such a dedication to it that she eventually became its editor.", "target": "dedication", "options": ["strong commitment of time and effort", "a short written acknowledgement", "an unwillingness to work with others"], "answer": 0, "explanations": ["此處 dedication 表示「投入、奉獻」。須依原句語境理解。", "這個選項表示「簡短的書面獻詞」；原句要表達的是「投入、奉獻」。", "這個選項表示「不願與他人共事」；原句要表達的是「投入、奉獻」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-18", "mode": "vocab", "paragraph": "C", "sentence": "She was particularly interested in the works of the French writers of this period and in the 19th century British writer, Oscar Wilde, and she was appreciated amongst fellow students at Queen's for her lively and charismatic approach to life and work.", "target": "charismatic", "options": ["having a personality that strongly attracts others", "quiet to the point of invisibility", "strictly following formal rules"], "answer": 0, "explanations": ["此處 charismatic 表示「有魅力、能吸引他人的」。須依原句語境理解。", "這個選項表示「安靜到不受注意的」；原句要表達的是「有魅力、能吸引他人的」。", "這個選項表示「嚴格遵循正式規則的」；原句要表達的是「有魅力、能吸引他人的」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-19", "mode": "vocab", "paragraph": "C", "sentence": "Mansfield did not actively support the suffragette movement in the UK.", "target": "suffragette movement", "options": ["the campaign associated with women seeking voting rights", "a campaign to prevent women from working", "a movement promoting musical education"], "answer": 0, "explanations": ["此處 suffragette movement 表示「婦女爭取投票權的運動」。須依原句語境理解。", "這個選項表示「阻止婦女工作的運動」；原句要表達的是「婦女爭取投票權的運動」。", "這個選項表示「推廣音樂教育的運動」；原句要表達的是「婦女爭取投票權的運動」。"], "tag": "搭配與語境義"}, {"id": "mansfield-vocab-20", "mode": "vocab", "paragraph": "D", "sentence": "She had several works published in Australia in a magazine called The Native Companion, which was her first paid writing work, and by this time she had her mind set on becoming a professional writer.", "target": "had her mind set on", "options": ["was firmly determined to pursue", "was uncertain whether to pursue", "had already completed"], "answer": 0, "explanations": ["此處 had her mind set on 表示「下定決心要……」。須依原句語境理解。", "這個選項表示「不確定是否要追求」；原句要表達的是「下定決心要……」。", "這個選項表示「已經完成」；原句要表達的是「下定決心要……」。"], "tag": "搭配與語境義"}, {"id": "mansfield-vocab-21", "mode": "vocab", "paragraph": "D", "sentence": "It was also the first occasion on which she used the pseudonym “K. Mansfield”.", "target": "pseudonym", "options": ["an assumed name used for writing", "the title of a short story", "a name given to a publishing company"], "answer": 0, "explanations": ["此處 pseudonym 表示「筆名、化名」。須依原句語境理解。", "這個選項表示「短篇小說的標題」；原句要表達的是「筆名、化名」。", "這個選項表示「出版社的名稱」；原句要表達的是「筆名、化名」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-22", "mode": "vocab", "paragraph": "D", "sentence": "Mansfield rapidly grew discontented with the provincial New Zealand lifestyle, and with her family.", "target": "discontented with", "options": ["dissatisfied with", "deeply committed to preserving", "unaware of the existence of"], "answer": 0, "explanations": ["此處 discontented with 表示「對……不滿」。須依原句語境理解。", "這個選項表示「堅定致力於維護」；原句要表達的是「對……不滿」。", "這個選項表示「不知道……的存在」；原句要表達的是「對……不滿」。"], "tag": "搭配與語境義"}, {"id": "mansfield-vocab-23", "mode": "vocab", "paragraph": "D", "sentence": "Mansfield rapidly grew discontented with the provincial New Zealand lifestyle, and with her family.", "target": "provincial", "options": ["associated with life outside major cultural centres", "relating to an overseas empire", "involving only financial matters"], "answer": 0, "explanations": ["此處 provincial 表示「地方性的、遠離文化中心的」。須依原句語境理解。", "這個選項表示「海外帝國的」；原句要表達的是「地方性的、遠離文化中心的」。", "這個選項表示「僅涉及財務的」；原句要表達的是「地方性的、遠離文化中心的」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-24", "mode": "vocab", "paragraph": "D", "sentence": "Her father sent her an annual subsidy of £100 for the rest of her life.", "target": "annual subsidy", "options": ["financial support provided once a year", "a monthly payment for completed stories", "a one-time loan requiring immediate repayment"], "answer": 0, "explanations": ["此處 annual subsidy 表示「每年提供的補助金」。須依原句語境理解。", "這個選項表示「每月支付的稿費」；原句要表達的是「每年提供的補助金
