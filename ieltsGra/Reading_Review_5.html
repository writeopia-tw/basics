</style></head><body><header><div class="brand">Reading Room</div><div class="part" id="partLabel">IELTS READING</div></header><main><section class="hero"><div class="label" id="topic">IELTS READING PRACTICE</div><h1 id="title">Reading Review 5</h1><p class="minor" id="catalogSummary"></p><div class="pills"><span class="pill" id="countV"></span><span class="pill" id="countP"></span><span class="pill" id="countQ"></span></div></section><div class="layout"><aside class="side"><h2>篇章與複習設定</h2><label for="article">閱讀篇章｜Part 分類 · A–Z</label><select id="article"></select><div id="paraWrap"><label for="para">段落範圍</label><select id="para"></select></div><div id="typeWrap"><label for="type">字詞類型</label><select id="type"></select></div><div class="stats" id="stats" aria-live="polite"></div><button id="shuffle">重新洗牌練習</button><button id="errors">重練錯題</button><p class="hint">每輪題目與選項隨機排列，同輪不重複。作答後可查看各選項解析。</p><p class="hint">進度保留在目前瀏覽器，不會跨裝置同步。</p><div id="status" role="status"></div></aside><section><nav class="tabs" aria-label="複習模式"><button data-mode="vocab">01 關鍵字語義</button><button data-mode="paraphrase">02 長難句改寫</button><button data-mode="questionVocab">03 題目字彙｜選中文</button><button data-mode="reading">原文閱讀</button></nav><div class="jump" id="jumpWrap"><label for="jump">跳至本輪題目</label><select id="jump"></select></div><div class="card" id="card"></div><p class="footer">先找主幹，再核對修飾範圍、否定、比較與作者態度。</p></section></div></main><script id="data" type="application/json">[{"id": "playing-soccer", "title": "Playing Soccer", "sourceTitle": "Playing Soccer", "subtitle": "", "part": 2, "topic": "街頭足球、制度化訓練與韌性", "sourceNote": "本文比較的是作者描寫的兩種足球環境；價值判斷應理解為作者觀點。原文一處省略不完整及一處並列句已修正文法。", "paragraphs": [{"label": "A", "text": "Street soccer, as its name implies, is an informal variation of the sport, often played on the street, particularly in urban areas. There are many reasons for the widespread popularity of street soccer. Unlike youth soccer, its more formally organized counterpart, no large space is needed, and goal posts, corner markers, and marked lines, associated with the formal game, are typically absent, as are game officials or referees. Another attraction of street soccer is that it is played frequently and competitively, but does not necessarily require standard 11-a-side teams or fixed playing positions. Unlike in youth soccer, inexperienced street soccer players rarely learn from repetitive technical and tactical drills. Instead, they learn from their poor performance in competition, unconscious of the skills they are nonetheless developing, and without older adults or coaches present. Players learn without effort through playing the game, and soon attain an almost natural feeling for the sport."}, {"label": "B", "text": "However, there are lots of cities in the world today where conditions are such that street soccer is no longer possible. Congested traffic now dominates where games were once played. Parks and open fields are used as hangouts for older teenagers with other interests. Add to this the requirement in many localities for official permits to use public spaces and the managed schedules that many young people have today, and spontaneous play of any kind is hard to imagine."}, {"label": "C", "text": "In spite of all these obstacles, which are probably solvable in most instances, there is another sociological explanation of why in many places street soccer doesn’t enjoy the same popularity it once did. In his book How Soccer Explains the World, US writer Franklin Foer observes: But for all the talk of freedom, the 1960s parenting style had a far less relaxed side too. Like the 1960s consumer movement which brought seat belts and airbags to cars, the (youth) soccer movement felt like it could create a set of ... regulations that would protect both the child’s body and mind from damage. Soccer leagues like the one I played in as a child handed out ‘participation’ prizes to every player, no matter how few games his (or her) team won. Where most of the world accepts the practice of using your head to hit the ball as an essential element of the game, some (youth) soccer parents have worried over the potential for injury to the brain. An entire industry grew up to manufacture protective headgear. Even though very little medical evidence supports this fear, some youth leagues prohibited heading the ball altogether."}, {"label": "D", "text": "A growing body of people don’t believe street soccer involves a legitimate educational method. They argue that children need to be taught by experts. Youth soccer instruction now begins with four-year-olds, so that they will have an advantage as six-year-olds. This need to get ahead brings with it a fear of falling behind that only expert instruction can prevent. This type of instruction leaves no room for the trial-and-error approach of street soccer."}, {"label": "E", "text": "One of the basic ideas of street soccer is that young players are assigned a particular role by a better player and are expected to play for the good of the team. Such an assignment runs counter to the idea of youth soccer that every child needs to learn every position and will benefit from doing so. In street soccer, you fill the role that you are best able to fulfil at a particular time. While this role assignment can change from game to game, the purpose is always the same: to get the best out of each individual at any given moment."}, {"label": "F", "text": "In street soccer, children have to learn patience, to wait their turn, to realize that they are not entitled to make decisions, or even be listened to simply because they show up. Positions of responsibility are earned through competition within the team. Younger players in street soccer must wait to attain those positions. In youth soccer, however, with its overly democratic values, youngsters are guaranteed their time in the spotlight. Whether it’s their turn to be captain, to play a central position or to take a crucial shot, youth soccer players come to believe that hard work and patience aren't really necessary."}, {"label": "G", "text": "Not only does every youth soccer player get a chance, but it is also assumed that each individual has played well. ‘Everyone’s a winner; no one’s a loser’ is a guiding principle of youth soccer. This ensures each individual goes away positive about themselves. No one can leave a game or a practice feeling bad. But, if there really are no losers, then why try at all? Since giving less than your best receives the same reward as giving your best, why go to any extra effort? In street soccer, every game results in a winner and a loser and everyone knows who is who. Losing a game is a common experience and players learn early on how to handle this. As a result, unlike most youth soccer players, they acquire resilience. A further difference between these two strands of soccer is that in street soccer a formal record is not kept. You can lose one day and win the next. The results are only temporary and are forgotten within minutes of the end of the match. But in organized youth soccer, the position each person plays and the results are formally noted and maintained throughout a season."}], "questions": [{"id": "soccer-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Street soccer, as its name implies, is an informal variation of the sport, often played on the street, particularly in urban areas.", "target": "implies", "options": ["suggests indirectly", "states explicitly", "rules out"], "answer": 0, "explanations": ["此處 implies 表示「暗示、意味著」。須依原句語境理解。", "這個選項表示「明確說出」；原句要表達的是「暗示、意味著」。", "這個選項表示「排除可能性」；原句要表達的是「暗示、意味著」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Street soccer, as its name implies, is an informal variation of the sport, often played on the street, particularly in urban areas.", "target": "an informal variation", "options": ["a version without a formal organisational structure", "a legally required version", "a change in the final score"], "answer": 0, "explanations": ["此處 an informal variation 表示「非正式的變體形式」。須依原句語境理解。", "這個選項表示「法律規定的形式」；原句要表達的是「非正式的變體形式」。", "這個選項表示「最終比分的變化」；原句要表達的是「非正式的變體形式」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "Street soccer, as its name implies, is an informal variation of the sport, often played on the street, particularly in urban areas.", "target": "urban areas", "options": ["areas in towns or cities", "agricultural districts", "remote wilderness"], "answer": 0, "explanations": ["此處 urban areas 表示「城鎮或都市地區」。須依原句語境理解。", "這個選項表示「農業地區」；原句要表達的是「城鎮或都市地區」。", "這個選項表示「偏遠荒野」；原句要表達的是「城鎮或都市地區」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "There are many reasons for the widespread popularity of street soccer.", "target": "widespread", "options": ["found or accepted in many places", "limited to one neighbourhood", "recently prohibited"], "answer": 0, "explanations": ["此處 widespread 表示「廣泛存在的」。須依原句語境理解。", "這個選項表示「僅限於一個社區」；原句要表達的是「廣泛存在的」。", "這個選項表示「最近被禁止的」；原句要表達的是「廣泛存在的」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "Unlike youth soccer, its more formally organized counterpart, no large space is needed, and goal posts, corner markers, and marked lines, associated with the formal game, are typically absent, as are game officials or referees.", "target": "counterpart", "options": ["the corresponding version in another setting", "an opponent in a match", "a substitute referee"], "answer": 0, "explanations": ["此處 counterpart 表示「另一情境中相對應的事物」。須依原句語境理解。", "這個選項表示「比賽中的對手」；原句要表達的是「另一情境中相對應的事物」。", "這個選項表示「替補裁判」；原句要表達的是「另一情境中相對應的事物」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "Unlike youth soccer, its more formally organized counterpart, no large space is needed, and goal posts, corner markers, and marked lines, associated with the formal game, are typically absent, as are game officials or referees.", "target": "associated with", "options": ["connected with", "in opposition to", "replaced entirely by"], "answer": 0, "explanations": ["此處 associated with 表示「與……有關聯」。須依原句語境理解。", "這個選項表示「與……對立」；原句要表達的是「與……有關聯」。", "這個選項表示「被……完全取代」；原句要表達的是「與……有關聯」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "Unlike youth soccer, its more formally organized counterpart, no large space is needed, and goal posts, corner markers, and marked lines, associated with the formal game, are typically absent, as are game officials or referees.", "target": "referees", "options": ["officials who enforce the rules during games", "people who train the players", "people who select team sponsors"], "answer": 0, "explanations": ["此處 referees 表示「執行比賽規則的裁判」。須依原句語境理解。", "這個選項表示「訓練球員的人」；原句要表達的是「執行比賽規則的裁判」。", "這個選項表示「挑選球隊贊助者的人」；原句要表達的是「執行比賽規則的裁判」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "Another attraction of street soccer is that it is played frequently and competitively, but does not necessarily require standard 11-a-side teams or fixed playing positions.", "target": "competitively", "options": ["in a way that involves trying to win against others", "without keeping any score", "only during formal training"], "answer": 0, "explanations": ["此處 competitively 表示「以競爭方式、力求獲勝地」。須依原句語境理解。", "這個選項表示「完全不計分地」；原句要表達的是「以競爭方式、力求獲勝地」。", "這個選項表示「只在正式訓練時」；原句要表達的是「以競爭方式、力求獲勝地」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "Another attraction of street soccer is that it is played frequently and competitively, but does not necessarily require standard 11-a-side teams or fixed playing positions.", "target": "fixed playing positions", "options": ["predetermined roles on the field", "locations where spectators sit", "permanent sites for all matches"], "answer": 0, "explanations": ["此處 fixed playing positions 表示「固定的場上位置或職責」。須依原句語境理解。", "這個選項表示「觀眾座位的位置」；原句要表達的是「固定的場上位置或職責」。", "這個選項表示「所有比賽的永久場址」；原句要表達的是「固定的場上位置或職責」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-10", "mode": "vocab", "paragraph": "A", "sentence": "Unlike in youth soccer, inexperienced street soccer players rarely learn from repetitive technical and tactical drills.", "target": "repetitive", "options": ["involving the same actions again and again", "increasingly unpredictable", "performed only once"], "answer": 0, "explanations": ["此處 repetitive 表示「反覆重複的」。須依原句語境理解。", "這個選項表示「愈來愈難預測的」；原句要表達的是「反覆重複的」。", "這個選項表示「只做一次的」；原句要表達的是「反覆重複的」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-11", "mode": "vocab", "paragraph": "A", "sentence": "Unlike in youth soccer, inexperienced street soccer players rarely learn from repetitive technical and tactical drills.", "target": "tactical drills", "options": ["repeated exercises practising game strategies", "medical tests after a match", "casual discussions about scores"], "answer": 0, "explanations": ["此處 tactical drills 表示「反覆練習比賽策略的戰術操練」。須依原句語境理解。", "這個選項表示「賽後的醫療檢查」；原句要表達的是「反覆練習比賽策略的戰術操練」。", "這個選項表示「隨意討論比分」；原句要表達的是「反覆練習比賽策略的戰術操練」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-12", "mode": "vocab", "paragraph": "A", "sentence": "Instead, they learn from their poor performance in competition, unconscious of the skills they are nonetheless developing, and without older adults or coaches present.", "target": "unconscious of", "options": ["not aware of", "unable to stay awake because of", "actively opposed to"], "answer": 0, "explanations": ["此處 unconscious of 表示「沒有意識到」。須依原句語境理解。", "這個選項表示「因……無法保持清醒」；原句要表達的是「沒有意識到」。", "這個選項表示「積極反對」；原句要表達的是「沒有意識到」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-13", "mode": "vocab", "paragraph": "A", "sentence": "Instead, they learn from their poor performance in competition, unconscious of the skills they are nonetheless developing, and without older adults or coaches present.", "target": "nonetheless", "options": ["despite what has just been said", "for that reason alone", "in exactly the same way"], "answer": 0, "explanations": ["此處 nonetheless 表示「儘管如此、仍然」。須依原句語境理解。", "這個選項表示「僅僅因為那個原因」；原句要表達的是「儘管如此、仍然」。", "這個選項表示「以完全相同的方式」；原句要表達的是「儘管如此、仍然」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-14", "mode": "vocab", "paragraph": "A", "sentence": "Players learn without effort through playing the game, and soon attain an almost natural feeling for the sport.", "target": "attain", "options": ["reach or achieve", "give up permanently", "formally assess"], "answer": 0, "explanations": ["此處 attain 表示「達到、獲得」。須依原句語境理解。", "這個選項表示「永久放棄」；原句要表達的是「達到、獲得」。", "這個選項表示「正式評量」；原句要表達的是「達到、獲得」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-15", "mode": "vocab", "paragraph": "B", "sentence": "Congested traffic now dominates where games were once played.", "target": "Congested", "options": ["overcrowded and unable to move freely", "moving without interruption", "completely prohibited"], "answer": 0, "explanations": ["此處 Congested 表示「擁塞的」。須依原句語境理解。", "這個選項表示「暢通無阻的」；原句要表達的是「擁塞的」。", "這個選項表示「完全被禁止的」；原句要表達的是「擁塞的」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-16", "mode": "vocab", "paragraph": "B", "sentence": "Congested traffic now dominates where games were once played.", "target": "dominates", "options": ["occupies or controls most of the space", "makes the area safer", "moves to another district"], "answer": 0, "explanations": ["此處 dominates 表示「佔據主要空間」。須依原句語境理解。", "這個選項表示「使該地更安全」；原句要表達的是「佔據主要空間」。", "這個選項表示「轉移到另一區」；原句要表達的是「佔據主要空間」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-17", "mode": "vocab", "paragraph": "B", "sentence": "Parks and open fields are used as hangouts for older teenagers with other interests.", "target": "hangouts", "options": ["places where people regularly spend time together", "places for storing equipment", "official training centres"], "answer": 0, "explanations": ["此處 hangouts 表示「經常聚集消磨時間的場所」。須依原句語境理解。", "這個選項表示「存放器材的地方」；原句要表達的是「經常聚集消磨時間的場所」。", "這個選項表示「正式訓練中心」；原句要表達的是「經常聚集消磨時間的場所」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-18", "mode": "vocab", "paragraph": "B", "sentence": "Add t s that make an activity difficult", "rewards for taking part", "signs of successful training"], "answer": 0, "explanations": ["此處 obstacles 表示「阻礙、障礙」。須依原句語境理解。", "這個選項表示「參加的獎勵」；原句要表達的是「阻礙、障礙」。", "這個選項表示「訓練成功的跡象」；原句要表達的是「阻礙、障礙」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-22", "mode": "vocab", "paragraph": "C", "sentence": "In spite of all these obstacles, which are probably solvable in most instances, there is another sociological explanation of why in many places street soccer doesn’t enjoy the same popularity it once did.", "target": "solvable", "options": ["capable of being dealt with successfully", "impossible to change", "already eliminated"], "answer": 0, "explanations": ["此處 solvable 表示「可解決的」。須依原句語境理解。", "這個選項表示「無法改變的」；原句要表達的是「可解決的」。", "這個選項表示「已經消除的」；原句要表達的是「可解決的」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-23", "mode": "vocab", "paragraph": "C", "sentence": "In spite of all these obstacles, which are probably solvable in most instances, there is another sociological explanation of why in many places street soccer doesn’t enjoy the same popularity it once did.", "target": "instances", "options": ["particular cases or situations", "long periods of history", "official instructions"], "answer": 0, "explanations": ["此處 instances 表示「個別情況、事例」。須依原句語境理解。", "這個選項表示「漫長歷史時期」；原句要表達的是「個別情況、事例」。", "這個選項表示「正式指令」；原句要表達的是「個別情況、事例」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-24", "mode": "vocab", "paragraph": "C", "sentence": "In spite of all these obstacles, which are probably solvable in most instances, there is another sociological explanation of why in many places street soccer doesn’t enjoy the same popularity it once did.", "target": "sociological", "options": ["relating to society and social behaviour", "relating only to bodily movement", "relating to weather conditions"], "answer": 0, "explanations": ["此處 sociological 表示「社會學的」。須依原句語境理解。", "這個選項表示「只與身體動作有關的」；原句要表達的是「社會學的」。", "這個選項表示「與天氣狀況有關的」；原句要表達的是「社會學的」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-25", "mode": "vocab", "pa strongly encouraged", "provided equipment for"], "answer": 0, "explanations": ["此處 prohibited 表示「明令禁止」。須依原句語境理解。", "這個選項表示「大力鼓勵」；原句要表達的是「明令禁止」。", "這個選項表示「提供所需器材」；原句要表達的是「明令禁止」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-33", "mode": "vocab", "paragraph": "C", "sentence": "Even though very little medical evidence supports this fear, some youth leagues prohibited heading the ball altogether.", "target": "heading the ball", "options": ["striking the ball with the head", "carrying the ball by hand", "leading the team onto the field"], "answer": 0, "explanations": ["此處 heading the ball 表示「用頭頂球」。須依原句語境理解。", "這個選項表示「用手持球」；原句要表達的是「用頭頂球」。", "這個選項表示「帶領球隊進場」；原句要表達的是「用頭頂球」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-34", "mode": "vocab", "paragraph": "D", "sentence": "A growing body of people don’t believe street soccer involves a legitimate educational method.", "target": "A growing body of people", "options": ["an increasing number of people", "an organisation managing children's growth", "people developing stronger bodies"], "answer": 0, "explanations": ["此處 A growing body of people 表示「愈來愈多的一群人」。須依原句語境理解。", "這個選項表示「管理兒童成長的組織」；原句要表達的是「愈來愈多的一群人」。", "這個選項表示「身體變得更強壯的人」；原句要表達的是「愈來愈多的一群人」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-35", "mode": "vocab", "paragraph": "D", "sentence": "A growing body of people don’t believe street soccer involves a legitimate educational method.", "target": "legitimate", "options": ["valid and justifiable", "requiring no effort", "strictly competitive"], "answer": 0, "explanations": ["此處 legitimate 表示「正當、合理的」。須依原句語境理解。", "這個選項表示「完全不費力的」；原句要表達的是「正當、合理的」。", "這個選項表示「嚴格競爭性的」；原句要表達的是「正當、合理的」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-36", "mode": "vocab", "paragraph": "D", "sentence": "This need to get ahead brings with it a fear of falling behind that only expert instruction can prevent.", "target": "get ahead", "options": ["make progress and gain an advantage", "move to the front of a physical queue", "avoid all instruction"], "answer": 0, "explanations": ["此處 get ahead 表示「取得進展、領先」。須依原句語境理解。", "這個選項表示「移到實際隊伍前端」；原句要表達的是「取得進展、領先」。", "這個選項表示「避開一切指導」；原句要表達的是「取得進展、領先」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-37", "mode": "vocab", "paragraph": "D", "sentence": "This need to get ahead brings with it a fear of falling behind that only expert instruction can prevent.", "target": "falling behind", "options": ["failing to keep pace with others", "falling over during play", "moving to a defensive position"], "answer": 0, "explanations": ["此處 falling behind 表示「落後於他人」。須依原句語境理解。", "這個選項表示「踢球時跌倒」；原句要表達的是「落後於他人」。", "這個選項表示「移到防守位置」；原句要表達的是「落後於他人」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-38", "mode": "vocab", "paragraph": "D", "sentence": "This type of instruction leaves no room for the trial-and-error approach of street soccer.", "target": "leaves no room for", "options": ["does not allow any opportunity for", "requires a larger physical room for", "provides extra time for"], "answer": 0, "explanations": ["此處 leaves no room for 表示「不容許、沒有……的空間」。須依原句語境理解。", "這個選項表示「要求更大的實體房間」；原句要表達的是「不容許、沒有……的空間」。", "這個選項表示「提供額外時間」；原句要表達的是「不容許、沒有……的空間」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-39", "mode": "vocab", "paragraph": "D", "sentence": "This type of instruction leaves no room for the trial-and-error approach of street soccer.", "target": "trial-and-error approach", "options": ["a method of learning through attempts and mistakes", "a method that prevents all mistakes", "an official examination of errors"], "answer": 0, "explanations": ["此處 trial-and-error approach 表示「透過嘗試與犯錯學習的方法」。須依原句語境理解。", "這個選項表示「完全避免出錯的方法」；原句要表達的是「透過嘗試與犯錯學習的方法」。", "這個選項表示「正式的錯誤測驗」；原句要表達的是「透過嘗試與犯錯學習的方法」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-40", "mode": "vocab", "paragraph": "E", "sentence": "One of the basic ideas of street soccer is that young players are assigned a particular role by a better player and are expected to play for the good of the team.", "target": "assigned", "options": ["given a particular role or task", "excluded from participation", "paid according to performance"], "answer": 0, "explanations": ["此處 assigned 表示「被分派」。須依原句語境理解。", "這個選項表示「被排除參與」；原句要表達的是「被分派」。", "這個選項表示「按表現給付報酬」；原句要表達的是「被分派」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-41", "mode": "vocab", "paragraph": "E", "sentence": "One of the basic ideas of street soccer is that young players are assigned a particular role by a better player and are expected to play for the good of the team.", "target": "for the good of", "options": ["for the benefit of", "as a reward from", "in place of"], "answer": 0, "explanations": ["此處 for the good of 表示「為了……的利益」。須依原句語境理解。", "這個選項表示「作為……給的獎勵」；原句要表達的是「為了……的利益」。", "這個選項表示「代替」；原句要表達的是「為了……的利益」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-42", "mode": "vocab", "paragraph": "E", "sentence": "Such an assignment runs counter to the idea of youth soccer that every child needs to learn every position and will benefit from doing so.", "target": "runs counter to", "options": ["conflicts with", "provides evidence for", "moves quickly towards"], "answer": 0, "explanations": ["此處 runs counter to 表示「與……背道而馳」。須依原句語境理解。", "這個選項表示「提供支持……的證據」；原句要表達的是「與……背道而馳」。", "這個選項表示「迅速跑向」；原句要表達的是「與……背道而馳」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-43", "mode": "vocab", "paragraph": "E", "sentence": "While this role assignment can change from game to game, the purpose is always the same: to get the best out of each individual at any given moment.", "target": "at any given moment", "options": ["at whichever particular time is being considered", "only after the whole season", "at a time chosen in advance"], "answer": 0, "explanations": ["此處 at any given moment 表示「在任何特定時刻」。須依原句語境理解。", "這個選項表示「只在整個賽季之後」；原句要表達的是「在任何特定時刻」。", "這個選項表示「在事先選定的時間」；原句要表達的是「在任何特定時刻」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-44", "mode": "vocab", "paragraph": "F", "sentence": "In street soccer, children have to learn patience, to wait their turn, to realize that they are not entitled to make decisions, or even be listened to simply because they show up.", "target": "entitled to", "options": ["having a right to", "physically able to", "officially ordered to"], "answer": 0, "explanations": ["此處 entitled to 表示「有權……」。須依原句語境理解。", "這個選項表示「身體上能夠」；原句要表達的是「有權……」。", "這個選項表示「被正式命令」；原句要表達的是「有權……」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-45", "mode": "vocab", "paragraph": "F", "sentence": "In youth soccer, however, with its overly democratic values, youngsters are guaranteed their time in the spotlight.", "target": "overly democratic values", "options": ["an excessive emphasis on giving everyone an equal turn", "a refusal to let players participate", "a system of electing government officials"], "answer": 0, "explanations": ["此處 overly democratic values 表示「過度強調人人都有同等機會的價值觀」。須依原句語境理解。", "這個選項表示「拒絕讓球員參與」；原句要表達的是「過度強調人人都有同等機會的價值觀」。", "這個選項表示「選舉政府官員的制度」；原句要表達的是「過度強調人人都有同等機會的價值觀」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-46", "mode": "vocab", "paragraph": "F", "sentence": "In youth soccer, however, with its overly democratic values, youngsters are guaranteed their time in the spotlight.", "target": "in the spotlight", "options": ["receiving public attention or a prominent role", "directly under a training lamp", "hidden from everyone else"], "answer": 0, "explanations": ["此處 in the spotlight 表示「成為焦點、獲得重要表現機會」。須依原句語境理解。", "這個選項表示「直接站在訓練燈下」；原句要表達的是「成為焦點、獲得重要表現機會」。", "這個選項表示「不被其他人注意」；原句要表達的是「成為焦點、獲得重要表現機會」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-47", "mode": "vocab", "paragraph": "F", "sentence": "Whether it’s their turn to be captain, to play a central position or to take a crucial shot, youth soccer players come to believe that hard work and patience aren't really necessary.", "target": "crucial shot", "options": ["an attempt to score at a particularly important moment", "a routine medical injection", "a photograph taken during the game"], "answer": 0, "explanations": ["此處 crucial shot 表示「關鍵的射門」。須依原句語境理解。", "這個選項表示「例行醫療注射」；原句要表達的是「關鍵的射門」。", "這個選項表示「比賽時拍的照片」；原句要表達的是「關鍵的射門」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-48", "mode": "vocab", "paragraph": "G", "sentence": "‘Everyone’s a winner; no one’s a loser’ is a guiding principle of youth soccer.", "target": "guiding principle", "options": ["a central belief directing decisions or behaviour", "a person who organises travel", "a rule used only for recording scores"], "answer": 0, "explanations": ["此處 guiding principle 表示「指導行為或決策的原則」。須依原句語境理解。", "這個選項表示「安排行程的導遊」；原句要表達的是「指導行為或決策的原則」。", "這個選項表示「只用於記分的規則」；原句要表達的是「指導行為或決策的原則」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-49", "mode": "vocab", "paragraph": "G", "sentence": "As a result, unlike most youth soccer players, they acquire resilience.", "target": "acquire resilience", "options": ["develop the ability to recover from setbacks", "avoid experiencing any defeat", "gain a permanent position on the team"], "answer": 0, "explanations": ["此處 acquire resilience 表示「培養從挫折中恢復的韌性」。須依原句語境理解。", "這個選項表示「避免經歷任何失敗」；原句要表達的是「培養從挫折中恢復的韌性」。", "這個選項表示「獲得永久的隊內位置」；原句要表達的是「培養從挫折中恢復的韌性」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-50", "mode": "vocab", "paragraph": "G", "sentence": "A further difference between these two strands of soccer is that in street soccer a formal record is not kept.", "target": "strands", "options": ["different forms or branches of an activity", "individual threads in a net", "sequences of consecutive victories"], "answer": 0, "explanations": ["此處 strands 表示「不同形式、分支」。須依原句語境理解。", "這個選項表示「球網中的一條條線」；原句要表達的是「不同形式、分支」。", "這個選項表示「連勝紀錄」；原句要表達的是「不同形式、分支」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-51", "mode": "vocab", "paragraph": "G", "sentence": "But in organized youth soccer, the position each person plays and the results are formally noted and maintained throughout a season.", "target": "maintained", "options": ["kept and preserved over time", "repaired after physical damage", "abandoned after each game"], "answer": 0, "explanations": ["此處 maintained 表示「持續保留、維持紀錄」。須依原句語境理解。", "這個選項表示「受損後加以修理」；原句要表達的是「持續保留、維持紀錄」。", "這個選項表示「每場比賽後丟棄」；原句要表達的是「持續保留、維持紀錄」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-52", "mode": "vocab", "paragraph": "A", "sentence": "Unlike in youth soccer, inexperienced street soccer players rarely learn from repetitive technical and tactical drills.", "target": "inexperienced", "options": ["lacking practice or knowledge gained by doing something", "highly qualified through long practice", "officially forbidden to participate"], "answer": 0, "explanations": ["此處 inexperienced 表示「缺乏經驗的」。須依原句語境理解。", "這個選項表示「長期練習而資歷深厚的」；原句要表達的是「缺乏經驗的」。", "這個選項表示「被正式禁止參與的」；原句要表達的是「缺乏經驗的」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-53", "mode": "vocab", "paragraph": "F", "sentence": "In youth soccer, however, with its overly democratic values, youngsters are guaranteed their time in the spotlight.", "target": "guaranteed", "options": ["assured of receiving", "merely hoping to receive", "required to pay for"], "answer": 0, "explanations": ["此處 guaranteed 表示「保證可以獲得」。須依原句語境理解。", "這個選項表示「僅僅希望獲得」；原句要表達的是「保證可以獲得」。", "這個選項表示「被要求付費購買」；原句要表達的是「保證可以獲得」。"], "tag": "字彙與語境義"}, {"id": "soccer-vocab-54", "mode": "vocab", "paragraph": "F", "sentence": "Whether it’s their turn to be captain, to play a central position or to take a crucial shot, youth soccer players come to believe that hard work and patience aren't really necessary.", "target": "come to believe", "options": ["gradually develop the belief", "prove through controlled experiments", "pretend to accept without believing"], "answer": 0, "explanations": ["此處 come to believe 表示「逐漸開始相信」。須依原句語境理解。", "這個選項表示「透過對照實驗證明」；原句要表達的是「逐漸開始相信」。", "這個選項表示「假裝接受但並不相信」；原句要表達的是「逐漸開始相信」。"], "tag": "搭配與語境義"}, {"id": "soccer-vocab-55", "mode": "vocab", "paragraph": "G", "sentence": "This ensures each individual goes away positive about themselves.", "target": "ensures", "options": ["makes certain that something happens", "suggests something might happen", "prevents an outcome"], "answer": 0, "explanations": ["此處 ensures 表示「確保、使必然發生」。須依原句語境理解。", "這個選項表示「暗示某事或許發生」；原句要表達的是「確保、使必然發生」。", "這個選項表示「阻止某種結果」；原句要表達的是「確保、使必然發生」。"], "tag": "字彙與語境義"}, {"id": "soccer-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Unlike youth soccer, its more formally organized counterpart, no large space is needed, and goal posts, corner markers, and marked lines, associated with the formal game, are typically absent, as are game officials or referees.", "target": "", "options": ["Street soccer needs neither a large space nor the usual markings and officials of the formal game.", "Street soccer needs a large space even though it dispenses with markings and referees.", "Youth soccer is the less formally organised version and needs no officials."], "answer": 0, "explanations": ["主句 no large space is needed；and 再連接球門、標線通常不存在，as are 補充裁判也如此。", "把 no large space is needed 讀成仍需要大場地，顛倒了否定。", "counterpart 指正式組織的 youth soccer，不能把兩者的正式程度對調。"], "tag": "長難句理解", "structure": "Unlike youth soccer 引出比較對象；its more formally organized counterpart 同位說明 youth soccer；associated with 修飾前面的設施；as are game officials 表示裁判也通常缺席。"}, {"id": "soccer-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "Another attraction of street soccer is that it is played frequently and competitively, but does not necessarily require standard 11-a-side teams or fixed playing positions.", "target": "", "options": ["Street soccer can be competitive without always requiring eleven players per side or fixed positions.", "Competitive street soccer always uses eleven players per side and fixed positions.", "Street soccer cannot be competitive unless it follows every formal rule."], "answer": 0, "explanations": ["not necessarily 表示不一定需要固定人數及位置，並未否認其競爭性。", "把不一定需要改成一定採用，過度限縮了形式。", "but 連接的是有競爭性與不必遵守固定編制，沒有提出競爭必須遵守全部規則的條件。"], "tag": "長難句理解", "structure": "that 引導 is 後面的表語子句；it is played 與 does not necessarily require 共用主詞 it；but 表轉折；or 連接兩項不一定需要的條件。"}, {"id": "soccer-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "Instead, they learn from their poor performance in competition, unconscious of the skills they are nonetheless developing, and without older adults or coaches present.", "target": "", "options": ["Inexperienced players develop skills through competition without necessarily realising that they are doing so.", "Players must become conscious of every new skill before competition can teach them anything.", "Players develop no skills because adults and coaches are absent."], "answer": 0, "explanations": ["unconscious of 說明學習者未察覺正在成長；without coaches 不代表不能學會。", "原句沒有把自覺設為學習的必要前提。", "把缺乏成人指導誤推成無法學習，與 nonetheless developing 相反。"], "tag": "長難句理解", "structure": "Instead 標示與前句 drills 的對比；they learn 是主幹；unconscious of... 描述狀態；the skills 後省略關係代名詞 that；without...present 補充沒有成人在場。"}, {"id": "soccer-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "However, there are lots of cities in the world today where conditions are such that street soccer is no longer possible.", "target": "", "options": ["In many present-day cities, conditions prevent street soccer from being played.", "Street soccer is still possible in every city provided that players accept local conditions.", "Street soccer has disappeared from every city in the world."], "answer": 0, "explanations": ["conditions are such that 表示情況已到了使街頭足球不再可行的程度；範圍是 lots of cities。", "把 no longer possible 改成仍然可行，反轉了句意。", "lots of cities 不等於世界上所有城市，範圍被誇大。"], "tag": "長難句理解", "structure": "where 引導修飾 cities 的關係子句；conditions are such that... 是「情況到了……程度」；that 後說明結果；no longer 表示如今不再。"}, {"id": "soccer-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "Add to this the requirement in many localities for official permits to use public spaces and the managed schedules that many young people have today, and spontaneous play of any kind is hard to imagine.", "target": "", "options": ["Permit requirements and tightly managed schedules add to the problems that make unplanned play difficult.", "Official permits and managed schedules remove the other barriers to spontaneous play.", "Only traffic, rather than permits or schedules, makes spontaneous play difficult."], "answer": 0, "explanations": ["Add to this 要把許可與行程限制加到前述困難中，結尾提出自發活動難以想像的結果。", "把額外障礙誤讀為解決障礙的方法。", "忽略 Add to this 新增的兩項原因，錯誤地只保留交通。"], "tag": "長難句理解", "structure": "Add to this 是祈使結構，受詞有 the requirement... 與 the managed schedules...；for official permits 補充 requirement；that many young people have 修飾 schedules；and 後接推論結果。"}, {"id": "soccer-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "In spite of all these obstacles, which are probably solvable in most instances, there is another sociological explanation of why in many places street soccer doesn’t enjoy the same popularity it once did.", "target": "", "options": ["The writer presents a further social explanation even though the earlier practical obstacles could probably be overcome.", "The writer gives another explanation because the practical obstacles are certainly impossible to solve.", "The writer abandons any social explanation once the earlier obstacles have been solved."], "answer": 0, "explanations": ["In spite of 表讓步；probably solvable 只是可能可解決，並未宣告已解決。", "把 probably solvable 改為 certainly impossible，兼有程度及否定錯誤。", "原句沒有說障礙已解決，也沒有放棄另一解釋。"], "tag": "長難句理解", "structure": "In spite of all these obstacles 是讓步片語；which 非限定關係子句補充障礙可能可解；there is... 是主句；of why... 補充 explanation 的內容。"}, {"id": "soccer-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "In his book How Soccer Explains the World, US writer Franklin Foer observes: But for all the talk of freedom, the 1960s parenting style had a far less relaxed side too.", "target": "", "options": ["Foer suggests that the parenting culture of the 1960s could be restrictive despite its emphasis on freedom.", "Foer argues that talk of freedom made parenting in the 1960s entirely relaxed.", "Foer says that parents in the 1960s never spoke about freedom."], "answer": 0, "explanations": ["for all the talk of freedom 相當於儘管大談自由，仍有較不寬鬆的一面。", "忽略 less relaxed side，將局部讓步讀成完全寬鬆。", "原句承認大談自由，並不是說從不提自由。"], "tag": "長難句理解", "structure": "冒號後是 Foer 的話；But for all... 此處 for all 表「儘管」，不是 but for 的反事實條件；the parenting style had... 是引述主幹；too 補充另一面。"}, {"id": "soccer-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "Soccer leagues like the one I played in as a child handed out ‘participation’ prizes to every player, no matter how few games his (or her) team won.", "target": "", "options": ["Players in the leagues Foer describes received participation prizes regardless of how few matches their teams won.", "Participation prizes were restricted to players whose teams won most matches.", "Only players whose teams never won any match received participation prizes."], "answer": 0, "explanations": ["no matter how few 表示即使贏得很少也發獎，獎勵不取決於勝場。", "把不論勝場都發獎誤讀為優勝隊專屬。", "few 不等於零，且 every player 比只獎勵全敗隊更廣。"], "tag": "長難句理解", "structure": "Soccer leagues 是主詞；like the one... 補充例子；I played in as a child 是省略 that 的關係子句；handed out 是謂語；no matter how few... 是讓步子句。"}, {"id": "soccer-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "Where most of the world accepts the practice of using your head to hit the ball as an essential element of the game, some (youth) soccer parents have worried over the potential for injury to the brain.", "target": "", "options": ["While heading is widely accepted as part of soccer, some youth-soccer parents worry about possible brain injury.", "Heading is rejected around the world because all youth-soccer parents fear brain injury.", "The sentence identifies the particular field where parents first witnessed a brain injury."], "answer": 0, "explanations": ["Where 在此對比兩種態度，不是指出受傷地點；some 也有限定範圍。", "把 most accepts 與 some worried 改成全球反對和所有家長擔心。", "此處 where 表對照情況，句子沒有指定一個實際球場。"], "tag": "長難句理解", "structure": "Where most of the world accepts... 是對照子句；the practice of using your head... 為 accepts 的受詞；some parents have worried... 是主句；the potential for injury 表可能性。"}, {"id": "soccer-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "Even though very little medical evidence supports this fear, some youth leagues prohibited heading the ball altogether.", "target": "", "options": ["Some leagues banned heading despite the limited medical evidence supporting the fear described.", "The leagues banned heading only after the fear had been conclusively supported by extensive evidence.", "No leagues banned heading because the supporting evidence was limited."], "answer": 0, "explanations": ["Even though 引出讓步，some leagues prohibited 才是實際發生的行動。", "把 very little evidence 擴大為 extensive evidence，且加入 only after 的必要順序。", "雖然證據少仍有人禁，不能讀成無人禁止。"], "tag": "長難句理解", "structure": "Even though 後是完整讓步子句；very little 修飾不可數 evidence；supports 的受詞 this fear 回指腦傷疑慮；主句的 some 限定部分聯盟，altogether 修飾禁止程度。"}, {"id": "soccer-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "This need to get ahead brings with it a fear of falling behind that only expert instruction can prevent.", "target": "", "options": ["The desire to gain an advantage creates a fear of lagging behind, which is believed to require expert instruction to prevent.", "Fear of lagging behind removes any desire to gain an advantage.", "Expert instruction is presented as unnecessary because children are not afraid of falling behind."], "answer": 0, "explanations": ["This need 指前句取得優勢的需求；that only... 限定可防止的是 fear of falling behind。", "原句因果由求領先導向怕落後，不是恐懼消除領先意願。", "原句正解釋為何強調專家教導，並非認為不需要。"], "tag": "長難句理解", "structure": "This need to get ahead 是主詞；brings with it 是謂語；a fear... 是受詞；that only expert instruction can prevent 為關係子句，that 作 prevent 的受詞。"}, {"id": "soccer-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "This type of instruction leaves no room for the trial-and-error approach of street soccer.", "target": "", "options": ["This form of expert-led instruction excludes the learning-by-mistakes approach associated with street soccer.", "This instruction depends mainly on letting children learn without expert guidance.", "Street soccer allows no mistakes because all instruction is given by experts."], "answer": 0, "explanations": ["leaves no room for 表不容許；of street soccer 說明被排除的方法屬於街頭足球。", "把排除試誤改成依靠試誤，意思相反。", "將 this instruction 與 street soccer 的角色對調。"], "tag": "長難句理解", "structure": "This type of instruction 回指前文專家教導；leaves no room for 是核心搭配；the trial-and-error approach 為受詞；of street soccer 說明此方法的來源。"}, {"id": "soccer-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "Such an assignment runs counter to the idea of youth soccer that every child needs to learn every position and will benefit from doing so.", "target": "", "options": ["Assigning street players particular roles conflicts with the youth-soccer idea that every child should learn every position.", "Assigning particular roles is the same as requiring every player to learn every position.", "Youth soccer assumes that children cannot benefit from learning more than one position."], "answer": 0, "explanations": ["runs counter to 表衝突；that 子句說明 youth soccer 的理念。", "把相反的兩種安排說成相同。", "原句明說 every child...will benefit，並非否認好處。"], "tag": "長難句理解", "structure": "Such an assignment 回指前句分派特定角色；runs counter to 為謂語；the idea 後的 that 引導同位內容；needs 與 will benefit 共用 every child；doing so 指學每個位置。"}, {"id": "soccer-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "While this role assignment can change from game to game, the purpose is always the same: to get the best out of each individual at any given moment.", "target": "", "options": ["Roles may differ between matches, but the aim remains to use each person's abilities as effectively as possible at the time.", "The aim changes whenever players are assigned new roles.", "Each person must keep the same role for the whole season to benefit the team."], "answer": 0, "explanations": ["While 表讓步；can change 與 always the same 形成角色可變、目的不變的對比。", "把角色的變動錯套到目的上。", "原句容許每場變更，並未要求整季固定。"], "tag": "長難句理解", "structure": "While this role assignment can change... 是讓步子句；the purpose is always the same 為主句；冒號後 to get... 解釋目的；at any given moment 限定當時的最佳運用。"}, {"id": "soccer-paraphrase-15", "mode": "paraphrase", "paragraph": "F", "sentence": "In street soccer, children have to learn patience, to wait their turn, to realize that they are not entitled to make decisions, or even be listened to simply because they show up.", "target": "", "options": ["Simply turning up does not automatically give street players the right to decide or to have their views heard.", "Every street player gains decision-making authority as soon as they arrive.", "Street players are never allowed to make decisions, regardless of their experience."], "answer": 0, "explanations": ["not entitled...simply because 排除的是僅憑出席便獲得權利，不是否定日後可以取得權責。", "把否定的「到場不自動有權」改成到場立即取得。", "原句未說永遠不能決策；後文還談到責任可透過競爭取得。"], "tag": "長難句理解", "structure": "have to 結構並列 learn patience、wait their turn、realize...；that 子句中 not entitled 的否定涵蓋 make decisions 與 be listened to；simply because 說明被否定的充分理由。"}, {"id": "soccer-paraphrase-16", "mode": "paraphrase", "paragraph": "F", "sentence": "Whether it’s their turn to be captain, to play a central position or to take a crucial shot, youth soccer players come to believe that hard work and patience aren't really necessary.", "target": "", "options": ["The writer argues that guaranteed opportunities can lead youth players to regard patience and effort as unnecessary, whatever prominent role they receive.", "Guaranteed opportunities necessarily teach every player to value patience more highly.", "Only being captain, rather than other prominent opportunities, influences players' views."], "answer": 0, "explanations": ["Whether...or... 列舉不同表現機會；主張是作者對保證輪流機會的批評。", "把 aren't necessary 改成更重視耐心，顛倒作者論點。", "列舉不只隊長，也包括中心位置與關鍵射門。"], "tag": "長難句理解", "structure": "Whether... 是表示「無論哪一種情況」的子句；三個 to 不定詞平行列舉；主句 players come to believe；that 子句為相信內容，並非客觀定律。"}, {"id": "soccer-paraphrase-17", "mode": "paraphrase", "paragraph": "G", "sentence": "Since giving less than your best receives the same reward as giving your best, why go to any extra effort?", "target": "", "options": ["The writer questions the incentive to make extra effort when doing one's best and doing less receive equal rewards.", "The writer says that equal rewards prove all players have worked equally hard.", "The writer argues that players should receive no reward even when they do their best."], "answer": 0, "explanations": ["Since 引出反問的理由：努力程度不同卻同酬，可能削弱額外努力的誘因。", "獎勵相同不代表投入相同，原文正以兩者不同作比較。", "原句批評的是獎勵缺乏區別，沒有主張完全不獎勵。"], "tag": "長難句理解", "structure": "Since giving less than your best receives... 是原因子句；兩個 giving 片語分別表示少盡力與盡全力；主句 why go...? 是省略主詞助動詞的反問。"}, {"id": "soccer-paraphrase-18", "mode": "paraphrase", "paragraph": "G", "sentence": "But in organized youth soccer, the position each person plays and the results are formally noted and maintained throughout a season.", "target": "", "options": ["Organised youth soccer retains records of each person’s playing position and match results across the season.", "Both forms preserve exactly the same records throughout a season.", "Youth soccer forgets results after minutes, whereas street soccer keeps permanent season records."], "answer": 0, "explanations": ["But 標示對照；街頭足球不留正式紀錄，組織化足球整季保留。", "忽略 a formal record is not kept，將兩者抹成相同。", "把兩種足球的紀錄方式完全對調。"], "tag": "長難句理解", "structure": "前句 A further difference...that... 指出差異；後句 But in organised youth soccer 為轉折；the position each person plays 與 the results 為並列主詞；are noted and maintained 是被動謂語。"}, {"id": "soccer-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "A contrast between the ways young players gain experience of playing different positions.", "target": "contrast", "options": ["對比、差異", "持續進步", "固定規則"], "answer": 0, "explanations": ["contrast 指兩種做法之間的對照。此處練習題目用語，不表示整句符合原文。", "持續進步是 progress，非 contrast", "固定規則是 rule，非 contrast"], "tag": "題目字彙", "source": "Question 14 · 題目用語"}, {"id": "soccer-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Examples outside sport of greater emphasis on individual safety.", "target": "emphasis on", "options": ["對……的重視、強調", "對……的反對", "對……的無知"], "answer": 0, "explanations": ["emphasis on 指特別重視的焦點；原題不完整搭配已修順。此處練習題目用語，不表示整句符合原文。", "反對是 opposition to，非 emphasis on", "無知是 ignorance of，非 emphasis on"], "tag": "題目字彙", "source": "Question 15 · 題目用語"}, {"id": "soccer-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "A description of methods of selection for leadership on soccer teams.", "target": "leadership", "options": ["領導地位或領導職責", "隊伍的規模", "觀眾的參與"], "answer": 0, "explanations": ["leadership 在此指隊內帶領及負責的角色。此處練習題目用語，不表示整句符合原文。", "規模不是帶領角色", "觀眾參與不是球隊領導"], "tag": "題目字彙", "source": "Question 16 · 題目用語"}, {"id": "soccer-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Details of urban changes that discourage street soccer.", "target": "discourage", "options": ["使較難發展、阻礙", "給予鼓勵", "強制每人參與"], "answer": 0, "explanations": ["discourage 在此是使活動減少或不易進行。此處練習題目用語，不表示整句符合原文。", "鼓勵是 encourage，方向相反", "阻礙不表示強制參與"], "tag": "題目字彙", "source": "Question 17 · 題目用語"}, {"id": "soccer-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "You do not need elaborate facilities to play street soccer.", "target": "elaborate facilities", "options": ["複雜精備的設施", "簡短的口頭指令", "官方的比賽結果"], "answer": 0, "explanations": ["elaborate 修飾 facilities，指繁複講究的設備。此處練習題目用語，不表示整句符合原文。", "facilities 是設施，不是指令", "facilities 不是成績紀錄"], "tag": "題目字彙", "source": "Question 20–21 C · 題目用語"}, {"id": "soccer-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "Street soccer teams can have varying numbers of players.", "target": "varying", "options": ["不固定、可能不同的", "永遠一致的", "法律規定的"], "answer": 0, "explanations": ["varying numbers 指人數可有差異。此處練習題目用語，不表示整句符合原文。", "一致與 varying 相反", "varying 不代表法律規定"], "tag": "題目字彙", "source": "Question 20–21 E · 題目用語"}, {"id": "soccer-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Which results are mentioned in the excerpt from How Soccer Explains the World?", "target": "excerpt", "options": ["摘錄、節選", "全書索引", "未出版草稿"], "answer": 0, "explanations": ["excerpt 是從較長作品取出的片段。此處練習題目用語，不表示整句符合原文。", "索引是 index，非 excerpt", "節選不等於未出版草稿"], "tag": "題目字彙", "source": "Question 22–23 · 題目用語"}, {"id": "soccer-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Some youth soccer leagues adopted more restrictive rules of play.", "target": "restrictive", "options": ["限制較多、約束性的", "完全不設限制的", "純粹提供建議的"], "answer": 0, "explanations": ["restrictive rules 指限制行為的規則。此處練習題目用語，不表示整句符合原文。", "不設限與 restrictive 相反", "restrictive 不是僅供自由參考"], "tag": "題目字彙", "source": "Question 22–23 B · 題目用語"}, {"id": "soccer-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "Soccer equipment manufacturers directed advertising towards parents.", "target": "manufacturers", "options": ["製造商", "購買二手貨的顧客", "裁判員"], "answer": 0, "explanations": ["manufacturers 指生產器材的公司或業者。此處練習題目用語，不表示整句符合原文。", "顧客不是生產者", "裁判不負責製造器材"], "tag": "題目字彙", "source": "Question 22–23 E · 題目用語"}, {"id": "soccer-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "Regardless of the effort the players make, they get some kind of reward at the end of a game.", "target": "Regardless of", "options": ["不論、不受……影響", "正是由於", "僅限於"], "answer": 0, "explanations": ["regardless of 表後續情況不因前述因素改變。此處練習題目用語，不表示整句符合原文。", "由於表因果，非不論", "僅限於表限制，與此不同"], "tag": "題目字彙", "source": "Question 24–26 · 題目用語"}, {"id": "soccer-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "In street soccer, however, players gain resilience because they have to learn to cope with failure.", "target": "resilience", "options": ["從挫折恢復、適應困境的韌性", "確保永不失敗的能力", "獲得官方職位的資格"], "answer": 0, "explanations": ["resilience 是面對挫敗仍可恢復，不是永不失敗。此處練習題目用語，不表示整句符合原文。", "永不失敗不等於能從失敗中恢復", "韌性不是正式資格"], "tag": "題目字彙", "source": "Question 24–26 · 題目用語"}, {"id": "soccer-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "In street soccer, however, players gain resilience because they have to learn to cope with failure.", "target": "cope with", "options": ["應對、處理", "完全消除其存在", "故意引發"], "answer": 0, "explanations": ["cope with 是設法應付困難。此處練習題目用語，不表示整句符合原文。", "應付不保證困難完全消失", "處理困難不是刻意製造困難"], "tag": "題目字彙", "source": "Question 24–26 · 題目用語"}]}, {"id": "shakespeare-plays", "title": "Who Wrote Shakespeare’s Plays?", "sourceTitle": "Who Wrote Shakespeare’s Plays?", "subtitle": "", "part": 2, "topic": "文體計量、作者歸屬與證據限制", "sourceNote": "依本文歷史研究語境理解；suggest、seem、provisionally 不等於已獲確證。原文 continual number 的不自然搭配已修正。", "paragraphs": [{"label": "A", "text": "Even today, almost 400 years after his death, the works of the famous English dramatist William Shakespeare have lost none of their appeal, nor have questions about the source of his genius. For is it really credible that an ordinary actor from the small town of Stratford-upon-Avon should metamorphose into so extraordinary a dramatist? For some, the answer is obvious: Shakespeare was a genius whose gift is no more suspicious than that of the physicist Albert Einstein, the German salesman's son who devised the theory of relativity. But others have insisted that a mere school leaver simply could not have penned such sophisticated works. They believe that Shakespeare was a pseudonym for someone with far more impressive qualifications who wrote the plays that still play to packed theatres today. But after long and largely fruitless debate, researchers are now turning to scientific methods to resolve the controversies surrounding Shakespeare. Ways of identifying the literary ‘fingerprint’ of writers are currently being developed using computers. This analysis of features of literary style is known as 'stylometry' and with it researchers can recognise the work of Shakespeare and his contemporaries with impressive reliability."}, {"label": "B", "text": "The idea of using these basic scientific techniques to probe questions of authorship dates back to 1851, when the Victorian mathematician Augustus de Morgan suggested that different authors might be identified through the frequency with which they used words of different lengths. His idea attracted the attention of Thomas Mendenhall, an American physicist who decided to use word length to investigate one of the oldest controversies about the works of Shakespeare: were they actually written by someone else?"}, {"label": "C", "text": "As long ago as 1785, the Elizabethan writer and philosopher Sir Francis Bacon was identified as a possible contender for having written Shakespeare's works. Bacon's possible motivation for not wanting to be known as the author of such masterpieces is far from clear, but Mendenhall believed his methods might at least reveal telltale signs of Bacon's hand in the plays. However, his results, published in 1901, revealed Bacon's writing style to be quite unlike that of Shakespeare. But Mendenhall's methods also revealed some key concerns. Recognising the need to include large samples of writing from both authors, Mendenhall lumped all their works together, despite the fact that literary style can vary enormously between plays, poetry and philosophy, for example. His focus on word length as the sole ‘fingerprint’ of writing style was also questionable - for how could he be sure that some other characteristics would not give different results? But Mendenhall’s biggest fault was perhaps simply that he was too far ahead of his time - he was attempting a task that cried out for the kind of computers not even conceivable over 100 years ago. More recently, with their development, scholars have been able to look for subtle peculiarities among the complete works of authors, which, in Shakespeare's case, amount to over 800,000 words."}, {"label": "D", "text": "One of the key controversies now being probed is Shakespeare's relationship with other dramatists. Was he a lone genius or was his work the result of collaboration? Traditional methods of investigating such questions have relied on traits like the use of metaphor, but these may be shared by different authors simply on cultural grounds. In contrast, modern stylometry focuses on far more fundamental characteristics which are less likely to be shared by others. The text-crunching power of computers allows researchers to pinpoint phrases, words or even individual letters by their frequency in the work of different authors. Pattern recognition techniques are then used to develop a ‘fingerprint’ for each author."}, {"label": "E", "text": "Stylometry has come up with little to encourage those experts who insist Shakespeare was simply too uneducated to create works of enduring brilliance. In 1996, literary scholar Ward Elliott and mathematician Robert Valenza of Claremont McKenna College, California, published the results of a stylometric comparison of the works of Shakespeare with those of over 30 of the proposed 'real' authors. Elliott and Valenza applied a battery of 51 tests to computerised texts and found that none of the claimants had a stylometric ‘fingerprint’ similar to that of Shakespeare. “I think these claims were driven initially by a sense that Shakespeare is too ‘important’ to be an ordinary person,” says Professor Kate McCluskey, director of the Shakespeare Institute at the University of Birmingham."}, {"label": "F", "text": "Elliott and Valenza's research found something else too. Some of the earliest plays, notably Henry VI and the notoriously violent Titus Andronicus, seem to be a combination of Shakespeare and his brilliant contemporary the playwright Christopher Marlowe, who was born in the same year as Shakespeare. ‘Traditional scholars accept that Marlowe influenced Shakespeare's early work,’ says Dr Thomas Merriam, one of Britain's leading stylometry experts. He explains that, provisionally at least, stylometric studies suggest some of Marlowe's actual text exists within the early plays of Shakespeare."}, {"label": "G", "text": "Some scholars remain cautious about basing new views of Shakespeare’s career on stylometric analysis of centuries-old texts. “If they have been edited, amended or shortened, then the data from them is highly compromised,” says Dr Markus Dahl of London University. Even so, the results to date are in line with the growing view of Shakespeare as a hardworking professional who perfected his skills throughout his career."}], "questions": [{"id": "shakespeare-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Even today, almost 400 years after his death, the works of the famous English dramatist William Shakespeare have lost none of their appeal, nor have questions about the source of his genius.", "target": "dramatist", "options": ["a writer of plays", "a performer of magic", "a critic of scientific theories"], "answer": 0, "explanations": ["此處 dramatist 表示「劇作家」。須依原句語境理解。", "這個選項表示「魔術表演者」；原句要表達的是「劇作家」。", "這個選項表示「科學理論評論者」；原句要表達的是「劇作家」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Even today, almost 400 years after his death, the works of the famous English dramatist William Shakespeare have lost none of their appeal, nor have questions about the source of his genius.", "target": "appeal", "options": ["the power to attract and interest people", "a formal request for money", "a legal challenge to a judgement"], "answer": 0, "explanations": ["此處 appeal 表示「吸引力」。須依原句語境理解。", "這個選項表示「正式的金錢請求」；原句要表達的是「吸引力」。", "這個選項表示「對判決提出上訴」；原句要表達的是「吸引力」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "For is it really credible that an ordinary actor from the small town of Stratford-upon-Avon should metamorphose into so extraordinary a dramatist?", "target": "credible", "options": ["believable and convincing", "obviously imaginary", "widely disliked"], "answer": 0, "explanations": ["此處 credible 表示「可信的」。須依原句語境理解。", "這個選項表示「明顯虛構的」；原句要表達的是「可信的」。", "這個選項表示「普遍不受喜愛的」；原句要表達的是「可信的」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "For is it really credible that an ordinary actor from the small town of Stratford-upon-Avon should metamorphose into so extraordinary a dramatist?", "target": "metamorphose into", "options": ["change completely into", "pretend briefly to be", "be rejected by"], "answer": 0, "explanations": ["此處 metamorphose into 表示「徹底轉變為」。須依原句語境理解。", "這個選項表示「短暫假裝成」；原句要表達的是「徹底轉變為」。", "這個選項表示「被……拒絕」；原句要表達的是「徹底轉變為」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "Even today, almost 400 years after his death, the works of the famous English dramatist William Shakespeare have lost none of their appeal, nor have questions about the source of his genius.", "target": "genius", "options": ["exceptional intellectual or creative ability", "formal professional qualifications", "a reputation for dishonesty"], "answer": 0, "explanations": ["此處 genius 表示「非凡的智慧或創作天賦」。須依原句語境理解。", "這個選項表示「正式專業資格」；原句要表達的是「非凡的智慧或創作天賦」。", "這個選項表示「不誠實的名聲」；原句要表達的是「非凡的智慧或創作天賦」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "For some, the answer is obvious: Shakespeare was a genius whose gift is no more suspicious than that of the physicist Albert Einstein, the German salesman's son who devised the theory of relativity.", "target": "gift", "options": ["a natural talent", "a present given on a special occasion", "a payment for completed work"], "answer": 0, "explanations": ["此處 gift 表示「天賦」。須依原句語境理解。", "這個選項表示「特殊場合贈送的禮物」；原句要表達的是「天賦」。", "這個選項表示「完成工作的報酬」；原句要表達的是「天賦」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "For some, the answer is obvious: Shakespeare was a genius whose gift is no more suspicious than that of the physicist Albert Einstein, the German salesman's son who devised the theory of relativity.", "target": "suspicious", "options": ["giving reason for doubt or mistrust", "providing complete certainty", "requiring technical training"], "answer": 0, "explanations": ["此處 suspicious 表示「令人起疑的」。須依原句語境理解。", "這個選項表示「完全確定的」；原句要表達的是「令人起疑的」。", "這個選項表示「需要技術訓練的」；原句要表達的是「令人起疑的」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "For some, the answer is obvious: Shakespeare was a genius whose gift is no more suspicious than that of the physicist Albert Einstein, the German salesman's son who devised the theory of relativity.", "target": "devised", "options": ["invented or worked out", "copied without alteration", "disproved experimentally"], "answer": 0, "explanations": ["此處 devised 表示「設計出、構想出」。須依原句語境理解。", "這個選項表示「原封不動抄襲」；原句要表達的是「設計出、構想出」。", "這個選項表示「以實驗推翻」；原句要表達的是「設計出、構想出」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "For some, the answer is obvious: Shakespeare was a genius whose gift is no more suspicious than that of the physicist Albert Einstein, the German salesman's son who devised the theory of relativity.", "target": "theory of relativity", "options": ["Einstein's theory concerning space, time and gravitation", "a study of family relationships", "a theory about literary influence"], "answer": 0, "explanations": ["此處 theory of relativity 表示「相對論」。須依原句語境理解。", "這個選項表示「家庭親屬關係研究」；原句要表達的是「相對論」。", "這個選項表示「文學影響理論」；原句要表達的是「相對論」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-10", "mode": "vocab", "paragraph": "A", "sentence": "But others have insisted that a mere school leaver simply could not have penned such sophisticated works.", "target": "mere", "options": ["nothing more than", "especially distinguished", "completely unconnected"], "answer": 0, "explanations": ["此處 mere 表示「僅僅、不過是」。須依原句語境理解。", "這個選項表示「格外傑出的」；原句要表達的是「僅僅、不過是」。", "這個選項表示「完全無關的」；原句要表達的是「僅僅、不過是」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-11", "mode": "vocab", "paragraph": "A", "sentence": "But others have insisted that a mere school leaver simply could not have penned such sophisticated works.", "target": "penned", "options": ["wrote or composed", "confined within an enclosure", "performed before an audience"], "answer": 0, "explanations": ["此處 penned 表示「撰寫」。須依原句語境理解。", "這個選項表示「關在圍欄裡」；原句要表達的是「撰寫」。", "這個選項表示「在觀眾面前演出」；原句要表達的是「撰寫」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-12", "mode": "vocab", "paragraph": "A", "sentence": "But others have insisted that a mere school leaver simply could not have penned such sophisticated works.", "target": "sophisticated", "options": ["complex and highly developed", "simple and unfinished", "deliberately misleading"], "answer": 0, "explanations": ["此處 sophisticated 表示「精緻複雜、成熟的」。須依原句語境理解。", "這個選項表示「簡單且未完成的」；原句要表達的是「精緻複雜、成熟的」。", "這個選項表示「刻意誤導的」；原句要表達的是「精緻複雜、成熟的」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-13", "mode": "vocab", "paragraph": "A", "sentence": "They believe that Shakespeare was a pseudonym for someone with far more impressive qualifications who wrote the plays that still play to packed theatres today.", "target": "pseudonym", "options": ["a name used instead of one's real name when writing", "a person's birth certificate", "a title awarded for academic work"], "answer": 0, "explanations": ["此處 pseudonym 表示「筆名、化名」。須依原句語境理解。", "這個選項表示「出生證明」；原句要表達的是「筆名、化名」。", "這個選項表示「學術工作獲授的頭銜」；原句要表達的是「筆名、化名」。"], "tag": "字彙與語境義"}, {"id": "shakespeare-vocab-14", "mode": "vocab", "paragraph": "A", "sentence": "They believe that Shakespeare was a pseudonym for someone with far more impressive qualifications who wrote the plays that still play to packed theatres today.", "target": "play to packed theatres", "options": ["be performed before full audiences", "be performed only after theatres close", "be sent abroad in packed boxes"], "answer": 0, "explanations": ["此處 play to packed theatres 表示「在滿座的劇院上演」。須依原句語境理解。", "這個選項表示「只在劇院關門後演出」；原句要表達的是「在滿座的劇院上演」。", "這個選項表示「裝箱運送到國外」；原句要表達的是「在滿座的劇院上演」。"], "tag": "搭配與語境義"}, {"id": "shakespeare-vocab-15", "mode": "vocab", "paragraph": "A", "sentence": "But after long and largely fruitless debate, researchers are now turning to scientific method
