ir form?", "target": "retaining their form", "options": ["keeping their overall shape", "remaining in exactly the same location", "keeping every grain permanently fixed"], "answer": 0, "explanations": ["此處 retaining their form 表示「維持原有形狀」。須依原句語境理解。", "這個選項表示「留在完全相同的位置」；原句要表達的是「維持原有形狀」。", "這個選項表示「使每顆沙粒永久固定」；原句要表達的是「維持原有形狀」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-23", "mode": "vocab", "paragraph": "D", "sentence": "That question was first answered in the mid-20th century by British explorer Ralph Alger Bagnold, and his answer hinges on the fact that dunes aren't solid, but granular.", "target": "hinges on", "options": ["depends critically on", "moves mechanically around", "completely contradicts"], "answer": 0, "explanations": ["此處 hinges on 表示「關鍵在於、取決於」。須依原句語境理解。", "這個選項表示「機械式地繞著移動」；原句要表達的是「關鍵在於、取決於」。", "這個選項表示「完全反駁」；原句要表達的是「關鍵在於、取決於」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-24", "mode": "vocab", "paragraph": "D", "sentence": "That question was first answered in the mid-20th century by British explorer Ralph Alger Bagnold, and his answer hinges on the fact that dunes aren't solid, but granular.", "target": "granular", "options": ["made up of separate small particles", "formed from one continuous solid piece", "fully dissolved in liquid"], "answer": 0, "explanations": ["此處 granular 表示「顆粒狀的、由小顆粒構成的」。須依原句語境理解。", "這個選項表示「由單一連續固體構成的」；原句要表達的是「顆粒狀的、由小顆粒構成的」。", "這個選項表示「完全溶於液體的」；原句要表達的是「顆粒狀的、由小顆粒構成的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-25", "mode": "vocab", "paragraph": "D", "sentence": "Bagnold figured out how barchan dunes are able to move grain by grain.", "target": "figured out", "options": ["worked out or understood", "drew a diagram of", "forgot the explanation for"], "answer": 0, "explanations": ["此處 figured out 表示「弄清楚、理解」。須依原句語境理解。", "這個選項表示「繪出示意圖」；原句要表達的是「弄清楚、理解」。", "這個選項表示「忘記……的解釋」；原句要表達的是「弄清楚、理解」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-26", "mode": "vocab", "paragraph": "D", "sentence": "Imagine a single grain of sand being blown up the back of a dune by the wind and deposited on the top.", "target": "deposited", "options": ["laid down or left in a place", "placed in a bank account", "removed by chemical treatment"], "answer": 0, "explanations": ["此處 deposited 表示「沉積、落置」。須依原句語境理解。", "這個選項表示「存入銀行帳戶」；原句要表達的是「沉積、落置」。", "這個選項表示「以化學處理移除」；原句要表達的是「沉積、落置」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-27", "mode": "vocab", "paragraph": "D", "sentence": "More grains follow the same pattern, until the accumulated weight of piled-up sand finally pushes the top down the dune face.", "target": "accumulated", "options": ["gradually collected or built up", "scattered thinly everywhere", "carefully removed beforehand"], "answer": 0, "explanations": ["此處 accumulated 表示「逐漸累積的」。須依原句語境理解。", "這個選項表示「稀疏散布各處的」；原句要表達的是「逐漸累積的」。", "這個選項表示「事先仔細移除的」；原句要表達的是「逐漸累積的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-28", "mode": "vocab", "paragraph": "D", "sentence": "More grains follow the same pattern, until the accumulated weight of piled-up sand finally pushes the top down the dune face.", "target": "dune face", "options": ["the sloping surface of a dune", "the flat ground beneath a dune", "the entire desert landscape"], "answer": 0, "explanations": ["此處 dune face 表示「沙丘的斜坡表面」。須依原句語境理解。", "這個選項表示「沙丘底下的平地」；原句要表達的是「沙丘的斜坡表面」。", "這個選項表示「整片沙漠地景」；原句要表達的是「沙丘的斜坡表面」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-29", "mode": "vocab", "paragraph": "D", "sentence": "The grain tumbles, then stops on the face until subsequent mini-avalanches bury it.", "target": "tumbles", "options": ["falls and rolls over", "floats steadily upwards", "dissolves without movement"], "answer": 0, "explanations": ["此處 tumbles 表示「翻滾而下」。須依原句語境理解。", "這個選項表示「平穩向上飄浮」；原句要表達的是「翻滾而下」。", "這個選項表示「不移動便溶解」；原句要表達的是「翻滾而下」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-30", "mode": "vocab", "paragraph": "D", "sentence": "The grain tumbles, then stops on the face until subsequent mini-avalanches bury it.", "target": "subsequent", "options": ["coming after the event just described", "occurring before all other events", "happening at exactly the same time"], "answer": 0, "explanations": ["此處 subsequent 表示「隨後的、後續的」。須依原句語境理解。", "這個選項表示「在所有其他事件之前發生的」；原句要表達的是「隨後的、後續的」。", "這個選項表示「完全同時發生的」；原句要表達的是「隨後的、後續的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-31", "mode": "vocab", "paragraph": "D", "sentence": "The grain tumbles, then stops on the face until subsequent mini-avalanches bury it.", "target": "mini-avalanches", "options": ["small sudden slides of material down a slope", "small earthquakes deep underground", "gentle winds blowing uphill"], "answer": 0, "explanations": ["此處 mini-avalanches 表示「小規模的崩滑」。須依原句語境理解。", "這個選項表示「地底深處的小地震」；原句要表達的是「小規模的崩滑」。", "這個選項表示「沿坡向上吹的微風」；原句要表達的是「小規模的崩滑」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-32", "mode": "vocab", "paragraph": "D", "sentence": "As this happens to every grain of sand in the dune, the whole thing creeps in the direction of the prevailing wind.", "target": "prevailing wind", "options": ["the wind blowing most commonly from a particular direction", "the strongest gust ever recorded", "air trapped inside the dune"], "answer": 0, "explanations": ["此處 prevailing wind 表示「盛行風」。須依原句語境理解。", "這個選項表示「歷來記錄最強的陣風」；原句要表達的是「盛行風」。", "這個選項表示「困在沙丘內的空氣」；原句要表達的是「盛行風」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-33", "mode": "vocab", "paragraph": "E", "sentence": "As a dune grows, it modifies the speed and course of the wind, which in turn alters how that dune and its neighbours evolve.", "target": "modifies", "options": ["changes or adjusts", "measures without affecting", "eliminates completely"], "answer": 0, "explanations": ["此處 modifies 表示「改變、調整」。須依原句語境理解。", "這個選項表示「只測量而不影響」；原句要表達的是「改變、調整」。", "這個選項表示「完全消除」；原句要表達的是「改變、調整」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-34", "mode": "vocab", "paragraph": "E", "sentence": "As a dune grows, it modifies the speed and course of the wind, which in turn alters how that dune and its neighbours evolve.", "target": "course", "options": ["the direction followed", "a series of classroom lessons", "the total duration of a study"], "answer": 0, "explanations": ["此處 course 表示「行進方向、路徑」。須依原句語境理解。", "這個選項表示「一系列課堂課程」；原句要表達的是「行進方向、路徑」。", "這個選項表示「研究的總時長」；原句要表達的是「行進方向、路徑」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-35", "mode": "vocab", "paragraph": "E", "sentence": "As a dune grows, it modifies the speed and course of the wind, which in turn alters how that dune and its neighbours evolve.", "target": "in turn", "options": ["as a further linked effect", "in a randomly selected order", "without any causal connection"], "answer": 0, "explanations": ["此處 in turn 表示「接著又、進而」。須依原句語境理解。", "這個選項表示「依隨機選定的順序」；原句要表達的是「接著又、進而」。", "這個選項表示「沒有任何因果關聯」；原句要表達的是「接著又、進而」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-36", "mode": "vocab", "paragraph": "E", "sentence": "‘Interestingly, the dune can regulate its own shape, and maintain it as it moves,’ says Dr Stéphane Douady, a physicist at Ecole Normale Supérieure (ENS) in France.", "target": "regulate", "options": ["control or adjust", "officially ban", "describe without influencing"], "answer": 0, "explanations": ["此處 regulate 表示「調節、控制」。須依原句語境理解。", "這個選項表示「正式禁止」；原句要表達的是「調節、控制」。", "這個選項表示「只描述而不影響」；原句要表達的是「調節、控制」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-37", "mode": "vocab", "paragraph": "E", "sentence": "‘Even when two dunes collide, they quickly take on their distinctive shapes again. It's like a living organism.’", "target": "collide", "options": ["hit one another", "move apart without contact", "remain fixed side by side"], "answer": 0, "explanations": ["此處 collide 表示「碰撞」。須依原句語境理解。", "這個選項表示「不接觸地分離」；原句要表達的是「碰撞」。", "這個選項表示「並排固定不動」；原句要表達的是「碰撞」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-38", "mode": "vocab", "paragraph": "E", "sentence": "‘Even when two dunes collide, they quickly take on their distinctive shapes again. It's like a living organism.’", "target": "take on", "options": ["acquire or assume", "physically carry away", "refuse to maintain"], "answer": 0, "explanations": ["此處 take on 表示「呈現、具有」。須依原句語境理解。", "這個選項表示「實際搬走」；原句要表達的是「呈現、具有」。", "這個選項表示「拒絕維持」；原句要表達的是「呈現、具有」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-39", "mode": "vocab", "paragraph": "E", "sentence": "‘Even when two dunes collide, they quickly take on their distinctive shapes again. It's like a living organism.’", "target": "distinctive", "options": ["recognisably different and characteristic", "impossible to tell apart", "entirely temporary and random"], "answer": 0, "explanations": ["此處 distinctive 表示「有辨識度的、特有的」。須依原句語境理解。", "這個選項表示「無法分辨的」；原句要表達的是「有辨識度的、特有的」。", "這個選項表示「完全暫時且隨機的」；原句要表達的是「有辨識度的、特有的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-40", "mode": "vocab", "paragraph": "E", "sentence": "It's like a living organism.’", "target": "organism", "options": ["an individual living thing", "a specially designed machine", "a collection of mineral deposits"], "answer": 0, "explanations": ["此處 organism 表示「生物、有機體」。須依原句語境理解。", "這個選項表示「特別設計的機器」；原句要表達的是「生物、有機體」。", "這個選項表示「一群礦物沉積」；原句要表達的是「生物、有機體」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-41", "mode": "vocab", "paragraph": "F", "sentence": "Douady and his colleagues have also been studying an even odder phenomenon than moving dunes: some barchans actually sing.", "target": "phenomenon", "options": ["an observable event or occurrence", "a final explanation beyond doubt", "a written laboratory instruction"], "answer": 0, "explanations": ["此處 phenomenon 表示「現象」。須依原句語境理解。", "這個選項表示「毫無疑問的最終解釋」；原句要表達的是「現象」。", "這個選項表示「書面的實驗室指令」；原句要表達的是「現象」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-42", "mode": "vocab", "paragraph": "F", "sentence": "Local legends attributed the sounds to dangerous spirits which were trying to trap unwary travellers.", "target": "attributed the sounds to", "options": ["believed the sounds were caused by", "used sounds to imitate", "prevented sounds from reaching"], "answer": 0, "explanations": ["此處 attributed the sounds to 表示「將聲音歸因於」。須依原句語境理解。", "這個選項表示「用聲音模仿」；原句要表達的是「將聲音歸因於」。", "這個選項表示「阻止聲音傳到」；原句要表達的是「將聲音歸因於」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-43", "mode": "vocab", "paragraph": "F", "sentence": "Local legends attributed the sounds to dangerous spirits which were trying to trap unwary travellers.", "target": "unwary", "options": ["not alert to possible danger", "well equipped for research", "unwilling to travel"], "answer": 0, "explanations": ["此處 unwary 表示「不警覺危險的」。須依原句語境理解。", "這個選項表示「研究設備齊全的」；原句要表達的是「不警覺危險的」。", "這個選項表示「不願旅行的」；原句要表達的是「不警覺危險的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-44", "mode": "vocab", "paragraph": "F", "sentence": "Douady is more pragmatic.", "target": "pragmatic", "options": ["concerned with practical and realistic explanations", "guided mainly by superstition", "unwilling to investigate"], "answer": 0, "explanations": ["此處 pragmatic 表示「務實、重視實際的」。須依原句語境理解。", "這個選項表示「主要受迷信指引的」；原句要表達的是「務實、重視實際的」。", "這個選項表示「不願調查的」；原句要表達的是「務實、重視實際的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-45", "mode": "vocab", "paragraph": "F", "sentence": "‘It's a strong booming noise with a low frequency,’ he explains, making a noise like a foghorn to demonstrate.", "target": "booming", "options": ["deep, loud and resonant", "growing rapidly in economic value", "high-pitched and barely audible"], "answer": 0, "explanations": ["此處 booming 表示「低沉洪亮的」。須依原句語境理解。", "這個選項表示「經濟價值迅速增長的」；原句要表達的是「低沉洪亮的」。", "這個選項表示「尖細且幾乎聽不見的」；原句要表達的是「低沉洪亮的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-46", "mode": "vocab", "paragraph": "F", "sentence": "‘It's a strong booming noise with a low frequency,’ he explains, making a noise like a foghorn to demonstrate.", "target": "foghorn", "options": ["a loud low-pitched warning horn used in fog", "a device measuring rainfall", "an instrument detecting underground oil"], "answer": 0, "explanations": ["此處 foghorn 表示「霧笛」。須依原句語境理解。", "這個選項表示「量雨器」；原句要表達的是「霧笛」。", "這個選項表示「偵測地下石油的儀器」；原句要表達的是「霧笛」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-47", "mode": "vocab", "paragraph": "F", "sentence": "Rather than tumbling randomly, the sand grains flow in synchrony and set each other vibrating like the membrane on a gigantic loudspeaker.", "target": "in synchrony", "options": ["with coordinated timing", "at unrelated random times", "in alternating opposite directions"], "answer": 0, "explanations": ["此處 in synchrony 表示「同步地」。須依原句語境理解。", "這個選項表示「在互不相關的隨機時間」；原句要表達的是「同步地」。", "這個選項表示「輪流朝相反方向」；原句要表達的是「同步地」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-48", "mode": "vocab", "paragraph": "F", "sentence": "Rather than tumbling randomly, the sand grains flow in synchrony and set each other vibrating like the membrane on a gigantic loudspeaker.", "target": "membrane", "options": ["a thin sheet that can vibrate", "a rigid solid pillar", "a deep empty chamber"], "answer": 0, "explanations": ["此處 membrane 表示「可振動的薄膜」。須依原句語境理解。", "這個選項表示「堅硬實心柱」；原句要表達的是「可振動的薄膜」。", "這個選項表示「深而空的腔室」；原句要表達的是「可振動的薄膜」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-49", "mode": "vocab", "paragraph": "F", "sentence": "The synchronisation causes the air to move in and out between the grains, creating a powerful sound wave.", "target": "sound wave", "options": ["a vibration travelling through a medium", "a visible line in the sand", "a stream of liquid water"], "answer": 0, "explanations": ["此處 sound wave 表示「聲波」。須依原句語境理解。", "這個選項表示「沙上的可見線條」；原句要表達的是「聲波」。", "這個選項表示「一股液態水流」；原句要表達的是「聲波」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-50", "mode": "vocab", "paragraph": "G", "sentence": "What really surprised the scientists, however, was that they were able to take samples of the singing sand back to France and replicate the sound at ENS, proving that it's the sand, not the dune shape, that causes the sound.", "target": "replicate", "options": ["reproduce the same effect", "refute a previous observation", "record without reproducing"], "answer": 0, "explanations": ["此處 replicate 表示「重現、複製相同效果」。須依原句語境理解。", "這個選項表示「推翻先前觀察」；原句要表達的是「重現、複製相同效果」。", "這個選項表示「只記錄而不重現」；原句要表達的是「重現、複製相同效果」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-51", "mode": "vocab", "paragraph": "G", "sentence": "Their studies show the grains are a uniform shape, well-rounded from years of striking each other, and that the variations in size affect the tone.", "target": "uniform", "options": ["consistent or the same throughout", "intended as official clothing", "different in every case"], "answer": 0, "explanations": ["此處 uniform 表示「一致的、均一的」。須依原句語境理解。", "這個選項表示「作為正式服裝的」；原句要表達的是「一致的、均一的」。", "這個選項表示「每個都不相同的」；原句要表達的是「一致的、均一的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-52", "mode": "vocab", "paragraph": "G", "sentence": "Their studies show the grains are a uniform shape, well-rounded from years of striking each other, and that the variations in size affect the tone.", "target": "tone", "options": ["the pitch or quality of a sound", "the weight of a grain", "the colour of a dune"], "answer": 0, "explanations": ["此處 tone 表示「音調、音色」。須依原句語境理解。", "這個選項表示「沙粒重量」；原句要表達的是「音調、音色」。", "這個選項表示「沙丘顏色」；原句要表達的是「音調、音色」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-53", "mode": "vocab", "paragraph": "G", "sentence": "Crucially, the grains are coated with a special veneer, which Douady calls ‘desert glaze’, made from a precise combination of minerals from surrounding rocks including iron, aluminium, manganese, silicon and calcium.", "target": "coated with", "options": ["covered with a layer of", "completely dissolved in", "made entirely from"], "answer": 0, "explanations": ["此處 coated with 表示「覆有一層……」。須依原句語境理解。", "這個選項表示「完全溶於」；原句要表達的是「覆有一層……」。", "這個選項表示「完全由……構成」；原句要表達的是「覆有一層……」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-54", "mode": "vocab", "paragraph": "G", "sentence": "Crucially, the grains are coated with a special veneer, which Douady calls ‘desert glaze’, made from a precise combination of minerals from surrounding rocks including iron, aluminium, manganese, silicon and calcium.", "target": "veneer", "options": ["a thin covering on a surface", "the solid interior of a grain", "a large separate rock"], "answer": 0, "explanations": ["此處 veneer 表示「表面的薄覆層」。須依原句語境理解。", "這個選項表示「沙粒的實心內部」；原句要表達的是「表面的薄覆層」。", "這個選項表示「一塊分離的大岩石」；原句要表達的是「表面的薄覆層」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-55", "mode": "vocab", "paragraph": "G", "sentence": "Crucially, the grains are coated with a special veneer, which Douady calls ‘desert glaze’, made from a precise combination of minerals from surrounding rocks including iron, aluminium, manganese, silicon and calcium.", "target": "glaze", "options": ["a thin smooth surface coating", "a deep crack inside a grain", "a sudden freezing wind"], "answer": 0, "explanations": ["此處 glaze 表示「薄而光滑的表面覆層」。須依原句語境理解。", "這個選項表示「沙粒內部的深裂縫」；原句要表達的是「薄而光滑的表面覆層」。", "這個選項表示「突然的冰冷強風」；原句要表達的是「薄而光滑的表面覆層」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-56", "mode": "vocab", "paragraph": "G", "sentence": "Crucially, the grains are coated with a special veneer, which Douady calls ‘desert glaze’, made from a precise combination of minerals from surrounding rocks including iron, aluminium, manganese, silicon and calcium.", "target": "minerals", "options": ["naturally occurring inorganic substances", "living microscopic animals", "artificial musical devices"], "answer": 0, "explanations": ["此處 minerals 表示「礦物」。須依原句語境理解。", "這個選項表示「活的微小動物」；原句要表達的是「礦物」。", "這個選項表示「人造音樂裝置」；原句要表達的是「礦物」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-57", "mode": "vocab", "paragraph": "G", "sentence": "The team found that after a month or so, the veneer wore off and the grains lost their ‘voice’.", "target": "wore off", "options": ["gradually disappeared through use or contact", "became increasingly thick", "was removed in one sudden impact"], "answer": 0, "explanations": ["此處 wore off 表示「逐漸磨損消失」。須依原句語境理解。", "這個選項表示「變得愈來愈厚」；原句要表達的是「逐漸磨損消失」。", "這個選項表示「被一次突然撞擊去除」；原句要表達的是「逐漸磨損消失」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-58", "mode": "vocab", "paragraph": "G", "sentence": "But some American colleagues made some artificial grains and managed to make them sing, after covering them in desert glaze.’", "target": "artificial", "options": ["made by people rather than occurring naturally", "formed without any human action", "incapable of producing sound"], "answer": 0, "explanations": ["此處 artificial 表示「人造的」。須依原句語境理解。", "這個選項表示「未經任何人為作用形成的」；原句要表達的是「人造的」。", "這個選項表示「無法產生聲音的」；原句要表達的是「人造的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-59", "mode": "vocab", "paragraph": "E", "sentence": "As a dune grows, it modifies the speed and course of the wind, which in turn alters how that dune and its neighbours evolve.", "target": "evolve", "options": ["develop or change over time", "appear suddenly in a final fixed form", "remain exactly unchanged"], "answer": 0, "explanations": ["此處 evolve 表示「隨時間發展、演變」。須依原句語境理解。", "這個選項表示「突然以最終固定形態出現」；原句要表達的是「隨時間發展、演變」。", "這個選項表示「完全不變」；原句要表達的是「隨時間發展、演變」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-60", "mode": "vocab", "paragraph": "F", "sentence": "There are about 50 dunes distributed across 35 deserts round the world that are known to sing.", "target": "distributed", "options": ["located or spread across different places", "confined to one laboratory", "deliberately destroyed"], "answer": 0, "explanations": ["此處 distributed 表示「分布於各處的」。須依原句語境理解。", "這個選項表示「侷限於一個實驗室的」；原句要表達的是「分布於各處的」。", "這個選項表示「被刻意破壞的」；原句要表達的是「分布於各處的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-61", "mode": "vocab", "paragraph": "F", "sentence": "Rather than tumbling randomly, the sand grains flow in synchrony and set each other vibrating like the membrane on a gigantic loudspeaker.", "target": "gigantic", "options": ["extremely large", "almost too small to notice", "entirely silent"], "answer": 0, "explanations": ["此處 gigantic 表示「巨大的」。須依原句語境理解。", "這個選項表示「小到幾乎無法察覺的」；原句要表達的是「巨大的」。", "這個選項表示「完全無聲的」；原句要表達的是「巨大的」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-62", "mode": "vocab", "paragraph": "G", "sentence": "Crucially, the grains are coated with a special veneer, which Douady calls ‘desert glaze’, made from a precise combination of minerals from surrounding rocks including iron, aluminium, manganese, silicon and calcium.", "target": "Crucially", "options": ["in a way that is especially important to the explanation", "by pure chance", "despite being irrelevant"], "answer": 0, "explanations": ["此處 Crucially 表示「關鍵的是」。須依原句語境理解。", "這個選項表示「純屬偶然地」；原句要表達的是「關鍵的是」。", "這個選項表示「儘管無關緊要」；原句要表達的是「關鍵的是」。"], "tag": "字彙與語境義"}, {"id": "dunes-vocab-63", "mode": "vocab", "paragraph": "G", "sentence": "Crucially, the grains are coated with a special veneer, which Douady calls ‘desert glaze’, made from a precise combination of minerals from surrounding rocks including iron, aluminium, manganese, silicon and calcium.", "target": "precise combination", "options": ["an exact mixture of components", "any randomly chosen material", "a single substance without variation"], "answer": 0, "explanations": ["此處 precise combination 表示「精確的成分組合」。須依原句語境理解。", "這個選項表示「任何隨機選取的材料」；原句要表達的是「精確的成分組合」。", "這個選項表示「沒有變化的單一物質」；原句要表達的是「精確的成分組合」。"], "tag": "搭配與語境義"}, {"id": "dunes-vocab-64", "mode": "vocab", "paragraph": "G", "sentence": "‘We managed to reproduce the desert glaze and then the grains started to sing again,’ says Douady.", "target": "reproduce", "options": ["produce the same substance or effect again", "breed biologically", "prevent something from occurring again"], "answer": 0, "explanations": ["此處 reproduce 表示「重製、重現」。須依原句語境理解。", "這個選項表示「以生物方式繁殖」；原句要表達的是「重製、重現」。", "這個選項表示「阻止再次發生」；原句要表達的是「重製、重現」。"], "tag": "字彙與語境義"}, {"id": "dunes-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Armies of giant sand dunes are advancing across the world’s deserts, engulfing anything that crosses their path.", "target": "", "options": ["Large dunes are moving through deserts and covering things in their route.", "The dunes are stationary, although objects moving past them may be covered.", "The dunes deliberately choose which industrial sites to attack."], "answer": 0, "explanations": ["advancing、engulfing 描述移動和覆蓋；Armies 是比喻，並未賦予意圖。", "stationary 與 advancing 相反。", "把軍隊比喻讀成有意識選擇目標，超出原句。"], "tag": "長難句理解", "structure": "Armies of giant sand dunes 是比喻性主詞；are advancing 是主幹；engulfing... 為伴隨分詞片語；anything that crosses... 中 that 修飾 anything。"}, {"id": "dunes-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "Even the smallest, speediest dunes only travel about 100 metres over the course of a year, while the bigger ones, which weigh something in the order of 10,000 tonnes, barely move one metre in that time.", "target": "", "options": ["Even the fastest dunes move only about 100 metres a year, while the larger ones move scarcely a metre.", "The larger dunes travel about 100 metres a year, faster than the smallest dunes.", "All dunes move exactly one metre a year regardless of size."], "answer": 0, "explanations": ["while 對照大小沙丘速度；about、barely 都不是精確且相同的數值。", "把大小與快慢對調，忽略 while 的比較。", "將兩組不同數據說成全部恰好一米，範圍及精確度皆錯。"], "tag": "長難句理解", "structure": "Even the smallest... 是第一分句主詞；only travel...為謂語；while 引出對照；which weigh... 為 larger ones 的非限定關係子句；in that time 指一年。"}, {"id": "dunes-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "However, their insidious creep can have serious consequences if there is an oil installation or a railway line in their path.", "target": "", "options": ["Slow dune movement can still cause serious damage when industrial or railway facilities lie in its route.", "Dunes cause serious damage only when they move rapidly.", "Dune movement always damages every railway line, regardless of location."], "answer": 0, "explanations": ["However 表慢仍可能危險；can 與 if 限定可能性及設施位於路徑的條件。", "原句指出慢速也能有嚴重後果，不以快速為必要條件。", "把條件性風險擴成所有鐵路必然受損。"], "tag": "長難句理解", "structure": "their insidious creep 是主詞；can have... 表可能後果；if there is... 是條件子句；in their path 修飾設施所在位置；However 回應前文速度很慢。"}, {"id": "dunes-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Only around 20% of that is sand-covered, however, and over half of that is classified as ‘linear’ sand dunes.", "target": "", "options": ["Around a fifth of the land described as arid or semi-arid desert is sandy, and more than half of that sandy area consists of linear dunes.", "Linear dunes cover more than half of all land on Earth.", "Exactly twenty per cent of every continent is covered by linear dunes."], "answer": 0, "explanations": ["第一個 that 指乾旱或半乾旱沙漠陸地，第二個 that 指其中被沙覆蓋的部分。", "錯把第二層子集合的比例套用到全球所有陸地。", "around 不是恰好，且百分之二十指沙覆蓋部分，不直接指線狀沙丘。"], "tag": "長難句理解", "structure": "Only around 20% of that... 是第一主句；however 插入轉折；and over half of that... 為第二主句；兩個 that 指涉範圍逐層縮小，不能同解為全球陸地。"}, {"id": "dunes-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "These form in a long curving wave, as a result of wind blowing strongly from several quarters, flipping them from side to side.", "target": "", "options": ["Linear dunes form under winds coming strongly from several directions, causing side-to-side movement.", "Linear dunes form only when the wind always comes from a single direction.", "Several quarters refers to dividing each sand grain into four pieces."], "answer": 0, "explanations": ["quarters 指方向，several 表不只單一方向；these 指前句線狀沙丘。", "把 several directions 改成 single direction，混淆線狀與新月形沙丘的描述。", "quarters 的方向義不等於把沙粒切成四份。"], "tag": "長難句理解", "structure": "These form... 為主幹；as a result of 後接 wind blowing...；blowing strongly... 為風的分詞修飾；flipping them... 補充風的作用；them 回指 dunes。"}, {"id": "dunes-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "Although linear dunes are static, sand blowing off them can cause problems for desert villages, burying crops and buildings.", "target": "", "options": ["Sand can blow off stationary linear dunes and bury crops or buildings even though the dunes themselves do not migrate.", "Linear dunes must migrate as a whole before any sand can leave them.", "Because linear dunes are static, they cannot cause any problems for villages."], "answer": 0, "explanations": ["Although 區分整體靜止和沙粒仍被吹離；burying 說明造成問題的方式或結果。", "原句沒有把整座遷移當成沙被吹走的必要條件。", "讓步句正說靜止仍造成問題，不能推成無害。"], "tag": "長難句理解", "structure": "Although linear dunes are static 是讓步子句；sand blowing off them 為主句主詞，blowing 為分詞修飾；can cause problems 是主幹；burying crops... 補充結果。"}, {"id": "dunes-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "‘Barchan dunes only tend to form where you have one-directional winds on the edge of sandy deserts near coastal areas,’ says Giles Wiggs, a geomorphologist at Oxford University, who has been studying the formation and movement of sand dunes for more than a decade.", "target": "", "options": ["Barchans tend to form near coastal desert edges where winds come mainly from one direction.", "Barchans are said to form most typically where winds come equally from several directions.", "The sentence guarantees that every coastal area contains barchan dunes."], "answer": 0, "explanations": ["only tend to form 描述形成條件或傾向，不保證每個具備部分條件的地點都有沙丘。", "混淆本文給新月形與線狀沙丘的風向條件。", "near coastal areas 不是所有沿海都必然有，且還有沙地及風向條件。"], "tag": "長難句理解", "structure": "Barchan dunes only tend to form... 是引述主幹；where you have... 指形成環境；on the edge...及 near... 限定地點；who has been studying... 修飾引述者 Giles Wiggs。"}, {"id": "dunes-paraphrase-8", "mode": "paraphrase", "paragraph": "D", "sentence": "But even with strong winds, how can entire barchans move while retaining their form?", "target": "", "options": ["The question asks how an entire dune can change location while keeping its overall shape.", "The question asks why dunes can never change location without losing all their sand.", "The question assumes that every grain stays in the same position within a moving dune."], "answer": 0, "explanations": ["while retaining their form 指整體形狀保留，不是沙粒位置不變。", "疑問句探究如何能做到，不是斷言不能。", "保留外形不表示每顆粒固定；後文正說逐粒搬移。"], "tag": "長難句理解", "structure": "how can entire barchans move 是疑問主幹；even with strong winds 為讓步背景；while retaining their form 是省略與主句相同主詞的分詞結構，表示同時保持形狀。"}, {"id": "dunes-paraphrase-9", "mode": "paraphrase", "paragraph": "D", "sentence": "That question was first answered in the mid-20th century by British explorer Ralph Alger Bagnold, and his answer hinges on the fact that dunes aren't solid, but granular.", "target": "", "options": ["Bagnold's explanation depends on dunes consisting of separate grains rather than a single solid mass.", "Bagnold's explanation requires dunes to be rigid blocks with no separate grains.", "Bagnold argued that dunes cannot move because they contain granular material."], "answer": 0, "explanations": ["aren't solid, but granular 是不是整塊固體、而是顆粒組成的對比。", "將否定與轉折兩側對調。", "顆粒性是解釋能移動的關鍵，不是無法移動的原因。"], "tag": "長難句理解", "structure": "That question was first answered... 是被動分句；and 連接 his answer hinges on...；the fact that... 說明所依賴的事實；aren't...but... 為修正對比。"}, {"id": "dunes-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "Imagine a single grain of sand being blown up the back of a dune by the wind and deposited on the top.", "target": "", "options": ["The reader is asked to picture wind carrying a sand grain up the back of a dune and leaving it on top.", "The reader is asked to imagine grains forming underground before rising through solid rock.", "The grain is described as being carried down the dune face by flowing water."], "answer": 0, "explanations": ["being blown、deposited 都是沙粒承受的作用；by the wind 指作用者。", "原句沒有地下生成或穿過岩層的過程。", "把風改為水，且將背面向上改為正面向下。"], "tag": "長難句理解", "structure": "Imagine 為祈使動詞；a single grain of sand 是受詞；being blown...and deposited... 為兩個並列被動分詞；up the back 與 on the top 表明路徑及終點。"}, {"id": "dunes-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "More grains follow the same pattern, until the accumulated weight of piled-up sand finally pushes the top down the dune face.", "target": "", "options": ["As grains collect on the top, their combined weight eventually drives sand down the dune face.", "Each grain must move down the dune before any further grains can reach the top.", "The top is pushed uphill because accumulated sand weighs progressively less."], "answer": 0, "explanations": ["until 標示累積至觸發下滑的時點；weight 為造成推動的主詞。", "原句允許更多沙先累積，並非每顆都先下滑。", "down 與 up 相反，且未說重量愈積愈輕。"], "tag": "長難句理解", "structure": "More grains follow... 是第一主幹；until 引導終點／結果時間子句；the accumulated weight of piled-up sand 是 pushes 的主詞；the top 是受詞，down... 表方向。"}, {"id": "dunes-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "The grain tumbles, then stops on the face until subsequent mini-avalanches bury it.", "target": "", "options": ["A grain rolls down, pauses on the slope, and stays there until later small slides bury it.", "The grain continues rolling indefinitely and is never covered by more sand.", "The grain is buried before it begins to roll down the face."], "answer": 0, "explanations": ["then 與 until 建立先滾、停住、後被埋的順序。", "忽略 stops 與 bury，錯說不停且從不覆埋。", "subsequent 表之後，不能改成先被埋才滾動。"], "tag": "長難句理解", "structure": "The grain 為共用主詞；tumbles、then stops 為先後謂語；on the face 說明停留位置；until subsequent mini-avalanches bury it 限定停留直到後續覆埋。"}, {"id": "dunes-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "As this happens to every grain of sand in the dune, the whole thing creeps in the direction of the prevailing wind.", "target": "", "options": ["The dune as a whole slowly shifts with the prevailing wind because the grain-level cycle occurs throughout it.", "The dune moves against the prevailing wind because only its surface grains remain still.", "The whole dune is transported as one unchanging solid block."], "answer": 0, "explanations": ["As 說明整體移動與每顆沙的循環相連；creeps 表緩慢移動。", "將順著風改成逆風，且誤說顆粒靜止。", "逐粒運動機制不能改寫為整塊固體搬運。"], "tag": "長難句理解", "structure": "As this happens... 為原因／伴隨情況子句；this 回指前述逐粒循環；every grain 限定遍及沙丘；the whole thing creeps 是主幹；in the direction... 指順風方向。"}, {"id": "dunes-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "As a dune grows, it modifies the speed and course of the wind, which in turn alters how that dune and its neighbours evolve.", "target": "", "options": ["A growing dune changes the wind, and the changed wind then influences the development of that dune and its neighbours.", "The wind changes the dune, but the dune has no effect on the wind.", "Only neighbouring dunes, rather than the original dune, are affected by the modified wind."], "answer": 0, "explanations": ["which in turn 建立回饋關係；that dune and its neighbours 都受影響。", "刪掉 dune modifies wind 的反向影響，失去循環關係。", "how that dune and its neighbours evolve 包含原沙丘，不只鄰丘。"], "tag": "長難句理解", "structure": "As a dune grows 是時間背景；it modifies... 是主句；which 回指前述風被改變的情況；in turn 表接續作用；how...evolve 為 alters 的受詞子句。"}, {"id": "dunes-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "‘Even when two dunes collide, they quickly take on their distinctive shapes again. It's like a living organism.’", "target": "", "options": ["Two dunes can collide and nevertheless quickly regain their characteristic shapes.", "Once two dunes collide, neither can ever recover its previous shape.", "Dunes retain their shapes only because they never collide."], "answer": 0, "explanations": ["Even when 表碰撞這個極端情況也未阻止恢復外形。", "again 說明形狀恢復，非永遠失去。", "原句承認有碰撞，不是用沒有碰撞解釋外形。"], "tag": "長難句理解", "structure": "Even when two dunes collide 是讓步性時間子句；they quickly take on... 是主句；they 指兩座沙丘；again 表恢復，distinctive 修飾各自有辨識度的形狀。"}, {"id": "dunes-paraphrase-16", "mode": "paraphrase", "paragraph": "F", "sentence": "Local legends attributed the sounds to dangerous spirits which were trying to trap unwary travellers.", "target": "", "options": ["Local legends explained the sounds as the work of spirits attempting to trap inattentive travellers.", "Douady's experiments proved that spirits produce the sounds to trap travellers.", "The legends said that travellers produced the sounds to frighten spirits."], "answer": 0, "explanations": ["Local legends 限定解釋的來源，並非科學家的實驗結論。", "把民間傳說升格為實驗證明。", "which 指 spirits，嘗試設陷阱的是傳說中的靈體，不能交換施動者。"], "tag": "長難句理解", "structure": "Local legends attributed the sounds to... 為主幹；to dangerous spirits 是歸因對象；which were trying... 修飾 spirits；to trap... 為嘗試內容；unwary 修飾 travellers。"}, {"id": "dunes-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "Rather than tumbling randomly, the sand grains flow in synchrony and set each other vibrating like the membrane on a gigantic loudspeaker.", "target": "", "options": ["Sand grains move with coordinated timing and make one another vibrate, rather than tumbling independently at random.", "Randomly timed movements prevent grains from affecting one another.", "All grains remain motionless while the air alone produces the sound."], "answer": 0, "explanations": ["Rather than 表排除隨機翻滾的解釋；set each other vibrating 指相互激發振動。", "同步而非隨機，且有彼此作用，兩處皆相反。", "原句 flow、vibrating 都表示顆粒在動。"], "tag": "長難句理解", "structure": "Rather than tumbling randomly 為對照分詞片語；sand grains 為主詞；flow 與 set 為並列動詞；set+受詞+v-ing 表使持續振動；like... 為薄膜比喻。"}, {"id": "dunes-paraphrase-18", "mode": "paraphrase", "paragraph": "G", "sentence": "What really surprised the scientists, however, was that they were able to take samples of the singing sand back to France and replicate the sound at ENS, proving that it's the sand, not the dune shape, that causes the sound.", "target": "", "options": ["Recreating the sound with transported sand showed that the crucial source lay in the sand rather than the dune's overall shape.", "Recreating a dune's shape without taking any sand proved that shape alone produces the sound.", "The team could not reproduce the sound once the sand was taken away from the desert."], "answer": 0, "explanations": ["take samples...back、replicate...at ENS 說明轉移樣本仍能發聲；proving that 指此結果支持的判斷。", "把實驗材料與結論顛倒：原句是沙，不是形狀。", "was able to...replicate 表成功重現，而非失敗。"], "tag": "長難句理解", "structure": "What really surprised... 是主詞子句；was that... 是表語子句；were able to take...and replicate... 並列；proving that... 是結果分詞；it's the sand...that... 為強調句。"}, {"id": "dunes-paraphrase-19", "mode": "paraphrase", "paragraph": "G", "sentence": "Their studies show the grains are a uniform shape, well-rounded from years of striking each other, and that the variations in size affect the tone.", "target": "", "options": ["The grains share a similar rounded shape, while differences in size influence the sound's tone.", "All grains are identical in both size and shape, so tone cannot vary.", "Differences in shape alone explain tone, while grain size has no effect."], "answer": 0, "explanations": ["a uniform shape 與 variations in size 是不同屬性，不能把均一外形擴張為尺寸相同。", "把外形相似錯推為大小完全一樣。", "原句明說尺寸差異 affect the tone，不能排除尺寸。"], "tag": "長難句理解", "structure": "Their studies show 後接兩個並列內容：the grains are...、and that variations...；well-rounded... 補充 shape；from years of striking... 解釋形成圓潤外形的原因。"}, {"id": "dunes-paraphrase-20", "mode": "paraphrase", "paragraph": "G", "sentence": "The team found that after a month or so, the veneer wore off and the grains lost their ‘voice’.", "target": "", "options": ["After roughly a month the surface layer disappeared, and the grains stopped producing the sound described.", "The grains permanently lost their shape after exactly one month.", "As the coating became thicker, the grains produced a louder sound."], "answer": 0, "explanations": ["after a month or so 是約略時間；lost their voice 是不再發聲的擬人說法。", "沒有說形狀永久改變，也不是精確滿一個月。", "wore off 是覆層磨失，不是增厚；lost voice 不是變大聲。"], "tag": "長難句理解", "structure": "The team found that... 為報告框架；that 後有兩個並列結果：veneer wore off、grains lost...；their voice 回指沙粒發聲能力，不是人類嗓音。"}, {"id": "dunes-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "A potential threat to industry and communications.", "target": "potential threat", "options": ["可能構成的威脅", "已必然發生的災難", "確保安全的方法"], "answer": 0, "explanations": ["potential 限定為可能；threat 是風險，尚非已發生損害。此處練習題目用語，不表示整句符合原文。", "可能性不能改成必然且已發生", "threat 不是保護措施"], "tag": "題目字彙", "source": "Question 27–33 Heading iv · 題目用語"}, {"id": "dunes-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Needing a specific combination of conditions.", "target": "specific combination", "options": ["特定的條件組合", "任何隨機條件", "完全單一的因素"], "answer": 0, "explanations": ["specific 限定特定組合，combination 指多項搭配。此處練習題目用語，不表示整句符合原文。", "特定不等於任何隨機", "組合不等於僅有單一因素"], "tag": "題目字彙", "source": "Question 27–33 Heading vi · 題目用語"}, {"id": "dunes-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Old superstitions demystified.", "target": "superstitions", "options": ["迷信", "經驗證的科學定律", "實驗室操作規章"], "answer": 0, "explanations": ["superstitions 指基於超自然等觀念的信念。此處練習題目用語，不表示整句符合原文。", "迷信不等於已驗證定律", "不是實驗操作規章"], "tag": "題目字彙", "source": "Question 27–33 Heading ix · 題目用語"}, {"id": "dunes-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Old superstitions demystified.", "target": "demystified", "options": ["被揭開神秘面紗、得到易懂解釋", "變得更神秘難解", "被禁止討論"], "answer": 0, "explanations": ["demystify 是使不再神秘或難以理解。此處練習題目用語，不表示整句符合原文。", "更難解與字義相反", "解釋不表示禁止討論"], "tag": "題目字彙", "source": "Question 27–33 Heading ix · 題目用語"}, {"id": "dunes-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "They develop in a recognisable shape.", "target": "recognisable", "options": ["可辨認的", "無法察覺的", "完全隨機且沒有特徵的"], "answer": 0, "explanations": ["recognisable shape 指能辨識的外形。此處練習題目用語，不表示整句符合原文。", "無法察覺與可辨認不同", "能辨認即存在某種特徵"], "tag": "題目字彙", "source": "Question 34 · 題目用語"}, {"id": "dunes-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "Bagnold discovered that movement in barchans was caused by the particular composition of the dunes.", "target": "composition", "options": ["組成、構成方式", "音樂作品", "寫作課的作文"], "answer": 0, "explanations": ["此處 composition 指沙丘由什麼及如何構成。此處練習題目用語，不表示整句符合原文。", "音樂作品是其他義，此處對象是 dunes", "作文也是其他義，與物理組成不合"], "tag": "題目字彙", "source": "Question 35 · 題目用語"}, {"id": "dunes-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Bagnold discovered that movement in barchans was caused by the exceptionally heavy nature of the sand grains.", "target": "exceptionally", "options": ["異常地、格外地", "大致上", "毫無差別地"], "answer": 0, "explanations": ["exceptionally 表程度特別突出。此處練習題目用語，不表示整句符合原文。", "大致是 approximately，非 exceptionally", "毫無差別不是程度突出"], "tag": "題目字彙", "source": "Question 35 · 題目用語"}, {"id": "dunes-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Its outline stays the same even after a period of movement.", "target": "outline", "options": ["外輪廓", "研究摘要", "內部重量"], "answer": 0, "explanations": ["outline 在沙丘語境中是外形邊界。此處練習題目用語，不表示整句符合原文。", "摘要是文字概述，此處不是文章", "重量不是輪廓"], "tag": "題目字彙", "source": "Question 36 · 題目用語"}, {"id": "dunes-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "Singing dunes produce a very loud sound which is transmitted at a low frequency.", "target": "transmitted", "options": ["傳播、傳遞", "完全阻擋", "憑空消失"], "answer": 0, "explanations": ["聲音 transmitted 指經介質傳播。此處練習題目用語，不表示整句符合原文。", "阻擋與傳遞不同", "傳播不是消失"], "tag": "題目字彙", "source": "Question 37–40 · 題目用語"}, {"id": "dunes-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "Research proves that the individual grains have a similar shape, but differences in dimensions alter the tone of the song.", "target": "dimensions", "options": ["尺寸、大小", "移動所需的時間", "沙粒的礦物名稱"], "answer": 0, "explanations": ["dimensions 在此指顆粒尺寸。此處練習題目用語，不表示整句符合原文。", "時間不是這裡的尺寸義", "礦物名稱不是大小"], "tag": "題目字彙", "source": "Question 37–40 · 題目用語"}, {"id": "dunes-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "Research proves that the individual grains have a similar shape, but differences in dimensions alter the tone of the song.", "target": "tone", "options": ["音調、音色", "沙丘的顏色", "沙丘的高度"], "answer": 0, "explanations": ["此處 tone 是聲音屬性。此處練習題目用語，不表示整句符合原文。", "顏色色調雖為其他義，但不合 song 語境", "高度不是音調"], "tag": "題目字彙", "source": "Question 37–40 · 題目用語"}, {"id": "dunes-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "Each grain is covered with a mixture of different minerals, and this is vital to sound production.", "target": "minerals", "options": ["礦物", "有生命的微生物", "人造塑膠顆粒"], "answer": 0, "explanations": ["minerals 指鐵、鈣等所屬的礦物物質。此處練習題目用語，不表示整句符合原文。", "礦物不是活體微生物", "礦物不等於塑膠"], "tag": "題目字彙", "source": "Question 37–40 · 題目用語"}, {"id": "dunes-questionVocab-13", "mode": "questionVocab", "paragraph": "", "sentence": "Each grain is covered with a mixture of different minerals, and this is vital to sound production.", "target": "vital to", "options": ["對……至關重要", "與……毫無關係", "只在……之後發生"], "answer": 0, "explanations": ["vital to 表對某事不可或缺的重要性。此處練習題目用語，不表示整句符合原文。", "毫無關係與重要相反", "不是時間先後的連接語"], "tag": "題目字彙", "source": "Question 37–40 · 題目用語"}]}, {"id": "headphones", "title": "Some Views on the Use of Headphones", "sourceTitle": "Some Views on the Use of Headphones", "subtitle": "", "part": 3, "topic": "工作效率、音樂與個人空間", "sourceNote": "本篇呈現研究報告與作者論點，練習重點是辨認歸屬、推論與限定；不可把所有引述當成一致或普遍的科學結論。", "paragraphs": [{"label": "A", "text": "To visit a typical modern office today is to walk into a room with possibly a dozen songs playing simultaneously but to hear none of them. Up to half of younger workers listen to music on their headphones, and nearly all of them think it makes them better at their jobs. In survey after survey, people report with confidence that music makes them happier, better at concentrating, and more productive. Scientists do not share this belief; they maintain that listening to music hurts people's ability to recall other things they should be doing, and any pop song, loud or soft, reduces overall performance for both extroverts and introverts. A Taiwanese study linked music that has lyrics to lower marks on concentration tests for college students, and other research has shown music with lyrics scrambles our brains’ verbal-processing skills. “As silence has the best overall performance, it would still be advisable that people work in silence,” another reporter dryly concluded. The question is therefore: if headphones are so bad for productivity, why do so many people at work have them? One factor to consider is that countries like the USA have moved from a farming and manufacturing economy to a service economy, with an emphasis on jobs in offices that require higher levels of concentration, reflection and creativity. As an estimated 70 percent of office workers work in open-plan office spaces, it is more important to create one's own enclosing bubble of sound. Lending strength to the argument for headphones at work is evidence that music relaxes our muscles, improves our mood, and may even moderately reduce blood pressure, heart rate and anxiety."}, {"label": "B", "text": "The story of headphones began in 1910, when the US Navy received an odd letter written in purple ink on blue-and-pink paper. The letter writer, an eccentric inventor and repairman named Nathaniel Baldwin, from the US state of Utah, made what at the time was an astonishing claim: he had built, in his kitchen, a new kind of headset that could amplify sound. This was an opportune invention for the Navy, which asked for a sound test and then enthusiastically adopted the headsets, later called headphones, and used them in World War I for naval radio communication."}, {"label": "C", "text": "The purpose of headphones is to concentrate a quiet and private sound in the ear of the listener, which is a radical departure from music's social purpose in history. “Music, together with dance, co-evolved biologically and culturally to serve as a technology of social bonding,” Nils L. Wallin and Björn Merker wrote in The Origins of Music. Songs don't leave behind bones, but evidence of musical notation dates back to Sumeria, 3,500 years ago, and in 1995 archaeologists discovered a bone flute in southern Europe estimated to be 44,000 years old. If music evolved as a social glue for the species, as a way to make groups and keep them together, headphones have done what writing and literacy did for language — they made music private."}, {"label": "D", "text": "Author and columnist Stephen Marche wrote that separation from other people is one of the first things ordinary Americans spend their money achieving. It is “a by-product of a long-standing national appetite for independence,” he said. Americans are not alone in their desire for personal independence and privacy. Marche is right; wealth can buy — and modern technology can deliver — personal independence, and it is this that people have always sought. Dr Michael Bull, an expert on personal music devices from the University of Sussex in the UK, has repeatedly made the larger point that personal music devices change how we relate to public spaces. Controlling our public spaces is more important now that more people are moving from the edges of cities to live in urban centres. “With the urban space, the more it's inhabited, the safer you feel,” Bull says. “You feel safe if you can feel people there, but you don't want to interact with them.” Headphones create shields for wearers, separating them from other people and their surroundings. Headphones have their own rules of good manners; they are like wearing a “Do not disturb” sign. We assume that people wearing them are busy and we should respect their privacy, so now people wear them to appear busy. In fact, it is now becoming quite common for people not to listen to anything at all, but just to wear headphones."}, {"label": "E", "text": "However, as pointed out at the beginning of this piece, although scientists have stated that headphones are bad for productivity, people still wear them at work. It is not just that headphones create privacy out of public areas, but also that music causes people to relax and reflect and pause. The outcome of relaxation, reflection and pausing at work won't be captured in minute-to-minute productivity metrics. What must be considered is that in moments of extreme focus, our attention radiates outward, toward the problem, rather than inward, on how to solve the problem. However, with music, “When our minds are at ease, we're more likely to direct the spotlight of attention inward,” Jonah Lehrer wrote in his book Imagine: How Creativity Works. “The answers have been there all along. We just weren't listening.” In a crowded world, real estate is the ultimate scarce resource, and a pair of headphones is a small invisible fence around our minds — making space, creating separation, and helping us listen to ourselves."}], rk is evidence that music relaxes our muscles, improves our mood, and may even moderately reduce blood pressure, heart rate and anxiety.", "target": "Lending strength to", "options": ["providing support for", "temporarily supplying physical force to", "showing that there is no evidence for"], "answer": 0, "explanations": ["此處 Lending strength to 表示「為……提供支持」。須依原句語境理解。", "這個選項表示「暫時借出體力給」；原句要表達的是「為……提供支持」。", "這個選項表示「顯示……沒有證據」；原句要表達的是「為……提供支持」。"], "tag": "搭配與語境義"}, {"id": "headphones-vocab-19", "mode": "vocab", "paragraph": "A", "sentence": "Lending strength to the argument for headphones at work is evidence that music relaxes our muscles, improves our mood, and may even moderately reduce blood pressure, heart rate and anxiety.", "target": "moderately", "options": ["to a limited or reasonable degree", "completely and permanently", "at an extremely rapid rate"], "answer": 0, "explanations": ["此處 moderately 表示「適度地、幅度不大地」。須依原句語境理解。", "這個選項表示「完全且永久地」；原句要表達的是「適度地、幅度不大地」。", "這個選項表示「以極快速度」；原句要表達的是「適度地、幅度不大地」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-20", "mode": "vocab", "paragraph": "A", "sentence": "Lending strength to the argument for headphones at work is evidence that music relaxes our muscles, improves our mood, and may even moderately reduce blood pressure, heart rate and anxiety.", "target": "anxiety", "options": ["feelings of worry or nervousness", "complete lack of interest", "a desire for social status"], "answer": 0, "explanations": ["此處 anxiety 表示「焦慮」。須依原句語境理解。", "這個選項表示「完全缺乏興趣」；原句要表達的是「焦慮」。", "這個選項表示「追求社會地位的慾望」；原句要表達的是「焦慮」。"], "tag": "字彙與語境義"}, {"id": "headphones-vocab-21", "mode": "vocab", "paragraph": "B", "sentence": "The letter writer, an eccentric inventor and repairman named Nathaniel Baldwin, from the US state of Utah, made what at the time was an astonishing claim: he had built, in his kitchen, a new kind of headset that could amplify sound.", "target": "eccentric", "options": ["unusual or unconventional in behaviour", "following every social convent
