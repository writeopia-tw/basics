 the latter of which she pronounced to be “... the only story that satisfies me to any extent”.", "target": "pronounced", "options": ["formally or emphatically declared", "said a word with a particular accent", "issued a medical diagnosis"], "answer": 0, "explanations": ["此處 pronounced 表示「宣稱、明確表示」。須依原句語境理解。", "這個選項表示「用特定口音念字」；原句要表達的是「宣稱、明確表示」。", "這個選項表示「作出醫學診斷」；原句要表達的是「宣稱、明確表示」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-41", "mode": "vocab", "paragraph": "G", "sentence": "Mansfield produced a great deal of work in the final years of her life, and much of her prose and poetry remained unpublished at her death in 1923.", "target": "prose", "options": ["written language that is not poetry", "language written only in verse", "instrumental music without words"], "answer": 0, "explanations": ["此處 prose 表示「散文、非詩體文字」。須依原句語境理解。", "這個選項表示「僅用詩體寫成的文字」；原句要表達的是「散文、非詩體文字」。", "這個選項表示「無文字的器樂」；原句要表達的是「散文、非詩體文字」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-42", "mode": "vocab", "paragraph": "G", "sentence": "After her death, her husband, Murry, took on the task of editing and publishing her works.", "target": "took on", "options": ["accepted responsibility for", "imitated someone's appearance", "rejected a proposed task"], "answer": 0, "explanations": ["此處 took on 表示「承擔」。須依原句語境理解。", "這個選項表示「模仿某人外貌」；原句要表達的是「承擔」。", "這個選項表示「拒絕提出的任務」；原句要表達的是「承擔」。"], "tag": "搭配與語境義"}, {"id": "mansfield-vocab-43", "mode": "vocab", "paragraph": "G", "sentence": "His efforts resulted in two additional volumes of short stories, The Doves' Nest and Something Childish, published in 1923 and 1924 respectively; the publication of her Poems, as well as a collection of critical writings (Novels and Novelists) and a number of editions of Mansfield's previously unpublished letters and journals.", "target": "volumes", "options": ["separate books forming works or collections", "levels of sound", "amounts of space occupied"], "answer": 0, "explanations": ["此處 volumes 表示「成冊的書籍」。須依原句語境理解。", "這個選項表示「音量大小」；原句要表達的是「成冊的書籍」。", "這個選項表示「所佔空間的體積」；原句要表達的是「成冊的書籍」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-44", "mode": "vocab", "paragraph": "G", "sentence": "His efforts resulted in two additional volumes of short stories, The Doves' Nest and Something Childish, published in 1923 and 1924 respectively; the publication of her Poems, as well as a collection of critical writings (Novels and Novelists) and a number of editions of Mansfield's previously unpublished letters and journals.", "target": "respectively", "options": ["in the same order as the items already mentioned", "at exactly the same time", "in the opposite order"], "answer": 0, "explanations": ["此處 respectively 表示「分別地、依前述順序對應」。須依原句語境理解。", "這個選項表示「在完全相同的時間」；原句要表達的是「分別地、依前述順序對應」。", "這個選項表示「依相反順序」；原句要表達的是「分別地、依前述順序對應」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-45", "mode": "vocab", "paragraph": "G", "sentence": "His efforts resulted in two additional volumes of short stories, The Doves' Nest and Something Childish, published in 1923 and 1924 respectively; the publication of her Poems, as well as a collection of critical writings (Novels and Novelists) and a number of editions of Mansfield's previously unpublished letters and journals.", "target": "critical writings", "options": ["analytical or evaluative writing about literature", "writing produced during a medical emergency", "writings that can only express disapproval"], "answer": 0, "explanations": ["此處 critical writings 表示「文學評論文章」。須依原句語境理解。", "這個選項表示「醫療危急時撰寫的文字」；原句要表達的是「文學評論文章」。", "這個選項表示「只能表達負評的文字」；原句要表達的是「文學評論文章」。"], "tag": "搭配與語境義"}, {"id": "mansfield-vocab-46", "mode": "vocab", "paragraph": "G", "sentence": "His efforts resulted in two additional volumes of short stories, The Doves' Nest and Something Childish, published in 1923 and 1924 respectively; the publication of her Poems, as well as a collection of critical writings (Novels and Novelists) and a number of editions of Mansfield's previously unpublished letters and journals.", "target": "editions", "options": ["particular published versions of a work", "private meetings between writers", "unwritten plans for stories"], "answer": 0, "explanations": ["此處 editions 表示「出版版本」。須依原句語境理解。", "這個選項表示「作家間的私人聚會」；原句要表達的是「出版版本」。", "這個選項表示「未寫出的故事構想」；原句要表達的是「出版版本」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-47", "mode": "vocab", "paragraph": "A", "sentence": "The daughter of a banker, and born into a middle-class family, she was also a first cousin of Countess Elizabeth von Arnim, a distinguished novelist in her time.", "target": "middle-class", "options": ["belonging to the social group between the wealthy upper class and the working class", "belonging to the youngest age group", "ranked in the middle of a school class"], "answer": 0, "explanations": ["此處 middle-class 表示「中產階級的」。須依原句語境理解。", "這個選項表示「屬於最年輕年齡層的」；原句要表達的是「中產階級的」。", "這個選項表示「成績排在班級中間的」；原句要表達的是「中產階級的」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-48", "mode": "vocab", "paragraph": "A", "sentence": "In 1893, the Mansfield family moved to Karori, a suburb of Wellington, where Mansfield would spend the happiest years of her childhood; she later used her memories of this time as an inspiration for her Prelude story.", "target": "suburb", "options": ["a residential area on the edge of a town or city", "a remote uninhabited island", "the administrative centre of a country"], "answer": 0, "explanations": ["此處 suburb 表示「市郊、郊區」。須依原句語境理解。", "這個選項表示「偏遠無人島」；原句要表達的是「市郊、郊區」。", "這個選項表示「國家的行政中心」；原句要表達的是「市郊、郊區」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-49", "mode": "vocab", "paragraph": "C", "sentence": "She met fellow writer Ida Baker, a South African, at the college, and the pair became lifelong friends.", "target": "lifelong", "options": ["lasting for the rest or whole of a person's life", "lasting only during college", "renewed only once a year"], "answer": 0, "explanations": ["此處 lifelong 表示「終身的、持續一生的」。須依原句語境理解。", "這個選項表示「僅持續於大學期間的」；原句要表達的是「終身的、持續一生的」。", "這個選項表示「只每年續約一次的」；原句要表達的是「終身的、持續一生的」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-50", "mode": "vocab", "paragraph": "D", "sentence": "In later years, she would express both admiration and disdain for New Zealand in her journals.", "target": "admiration", "options": ["a feeling of respect and approval", "a strong feeling of contempt", "a formal request for financial help"], "answer": 0, "explanations": ["此處 admiration 表示「欽佩、讚賞」。須依原句語境理解。", "這個選項表示「強烈鄙視」；原句要表達的是「欽佩、讚賞」。", "這個選項表示「正式申請金錢援助」；原句要表達的是「欽佩、讚賞」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-51", "mode": "vocab", "paragraph": "E", "sentence": "Mansfield became a co-editor of Rhythm, which was subsequently called The Blue Review, in which more of her works were published.", "target": "co-editor", "options": ["one of the people sharing responsibility for editing", "the only owner of a magazine", "a person who merely subscribes"], "answer": 0, "explanations": ["此處 co-editor 表示「共同編輯之一」。須依原句語境理解。", "這個選項表示「雜誌的唯一所有人」；原句要表達的是「共同編輯之一」。", "這個選項表示「只付費訂閱的人」；原句要表達的是「共同編輯之一」。"], "tag": "字彙與語境義"}, {"id": "mansfield-vocab-52", "mode": "vocab", "paragraph": "F", "sentence": "It was the publication of Bliss and Other Stories in 1920 that was to solidify Mansfield's reputation as a writer.", "target": "publication", "options": ["the act of making a written work publicly available", "the private drafting of a work", "the removal of a book from circulation"], "answer": 0, "explanations": ["此處 publication 表示「出版、發表」。須依原句語境理解。", "這個選項表示「私下起草作品」；原句要表達的是「出版、發表」。", "這個選項表示「使書籍停止流通」；原句要表達的是「出版、發表」。"], "tag": "字彙與語境義"}, {"id": "mansfield-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "The daughter of a banker, and born into a middle-class family, she was also a first cousin of Countess Elizabeth von Arnim, a distinguished novelist in her time.", "target": "", "options": ["Besides being a banker's daughter, Mansfield was a cousin of the noted novelist Elizabeth von Arnim.", "Elizabeth von Arnim was Mansfield's mother and the banker was her cousin.", "Mansfield became related to von Arnim only after becoming a novelist herself."], "answer": 0, "explanations": ["The daughter... 是 Mansfield 的同位補充；a first cousin of... 是另一身分關係。", "將女兒與堂／表親的關係對象互換。", "原句交代家庭關係，沒有說成名後才形成親屬關係。"], "tag": "長難句理解", "structure": "The daughter of a banker 是名詞片語，同位說明 she；born into... 為被動分詞補充；she was also a first cousin... 為主幹；a distinguished novelist 修飾 von Arnim。"}, {"id": "mansfield-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "In 1893, the Mansfield family moved to Karori, a suburb of Wellington, where Mansfield would spend the happiest years of her childhood; she later used her memories of this time as an inspiration for her Prelude story.", "target": "", "options": ["Karori was where Mansfield later remembered spending especially happy childhood years, and she drew on those memories for Prelude.", "Mansfield moved to Karori only after she had already written Prelude.", "Her childhood memories had no influence on Prelude because she had left Karori."], "answer": 0, "explanations": ["where 指 Karori；would spend 是過去視角的未來，不是現在的假設。", "事件順序是童年先、寫作後，不能改為作品先於搬家。", "she later used her memories...as an inspiration 明確表示影響。"], "tag": "長難句理解", "structure": "In 1893 為時間背景；the family moved...為第一主幹；where...would spend...補充地點經歷；分號後 she later used...為第二主句，this time 指童年時期。"}, {"id": "mansfield-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "In 1902, she developed strong feelings for a musician who played the cello, Arnold Trowell, although her feelings were not, for the most part, returned.", "target": "", "options": ["Although Mansfield developed strong feelings for Trowell, he mostly did not feel the same way towards her.", "Trowell and Mansfield are described as having equally strong romantic feelings.", "Her feelings disappeared because Trowell returned to New Zealand."], "answer": 0, "explanations": ["although 引出未獲回應；returned 此處指感情的相互回應，不是移動返國。", "忽略 were not...returned，將單向情感改成兩情相悅。", "將 returned 的語境義誤解為返回某地。"], "tag": "長難句理解", "structure": "she developed strong feelings... 是主句；who played... 修飾 musician；Arnold Trowell 為同位語；although...是讓步子句；for the most part 限定「大致上」。"}, {"id": "mansfield-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Mansfield herself was an accomplished cellist, having received lessons from Trowell's father.", "target": "", "options": ["Mansfield was a skilled cellist and had previously been taught by Trowell's father.", "Mansfield's skills as a cellist came from lessons she gave to Trowell's father.", "Mansfield began taking cello lessons only after she became professionally famous."], "answer": 0, "explanations": ["having received 表先前已接受課程，Mansfield 是 receive 的主體。", "把授課者與受課者對調。", "原句未提成名是開始學琴的先決條件，且時序與分詞相反。"], "tag": "長難句理解", "structure": "Mansfield herself 強調她本人；was an accomplished cellist 是主幹；having received... 為完成式分詞，說明早於主句狀態的訓練經歷；from Trowell's father 指授課者。"}, {"id": "mansfield-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "Mansfield wrote in her journals of feeling isolated to some extent in New Zealand, and, in general terms, of her interest in the Maori people (New Zealand's native people), who were often portrayed in a sympathetic light in her later stories, such as How Pearl Button Was Kidnapped.", "target": "", "options": ["Her journals discuss some isolation and an interest in Maori people, who were often depicted sympathetically in her later stories.", "Her later stories invariably portrayed Maori people negatively.", "Her journals and later fiction are said to contain nothing about Maori people."], "answer": 0, "explanations": ["who 指 Maori people；often、to some extent 都限定範圍及程度。", "sympathetic 與負面對立，often 也非 invariably。", "句子明確談到她的興趣與後來描寫，不能改成完全沒有。"], "tag": "長難句理解", "structure": "wrote in her journals 為主幹；of feeling...與 of her interest...平行說明寫作內容；who were often portrayed...為非限定關係子句；such as...舉作品例子。"}, {"id": "mansfield-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "Mansfield recommenced playing the cello, an occupation that she believed, during her time at Queen's, she would take up professionally.", "target": "", "options": ["While at Queen's, Mansfield believed she would pursue cello playing professionally.", "While at Queen's, Mansfield had already decided to abandon music for a professional writing career.", "The college required every student to become a professional cellist."], "answer": 0, "explanations": ["that she believed...she would take up 指她當時對音樂職涯的想法，不是寫作計畫或校方規定。", "將 cello playing 換成 writing，與當時想法不符。", "she believed 是個人認知，並非對全校學生的要求。"], "tag": "長難句理解", "structure": "recommenced playing... 為主幹；an occupation 同位指 playing the cello；that...she would take up professionally 為關係子句，occupation 是 take up 的受詞；during...為插入時間語。"}, {"id": "mansfield-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "She also began contributing to the college newspaper, with such a dedication to it that she eventually became its editor.", "target": "", "options": ["She contributed to the college newspaper with enough commitment that she eventually became its editor.", "She became editor before she had contributed any writing to the college paper.", "Her lack of dedication prevented her from becoming editor."], "answer": 0, "explanations": ["such...that 建立投入程度與後來結果；it、its 都指 college newspaper。", "倒置先投入撰稿、後成為編輯的順序。", "dedication 不是缺乏投入，eventually became 明確表示成功。"], "tag": "長難句理解", "structure": "She began contributing... 是主幹；with such a dedication to it 表投入程度；that... 引出結果；eventually 表最後；its editor 的所有格回指 college newspaper。"}, {"id": "mansfield-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "She was particularly interested in the works of the French writers of this period and in the 19th century British writer, Oscar Wilde, and she was appreciated amongst fellow students at Queen's for her lively and charismatic approach to life and work.", "target": "", "options": ["Her interests included French writers and Wilde, and fellow students valued her lively, attractive personality.", "Her classmates disliked her because she was interested only in French writers.", "Only Oscar Wilde, rather than her fellow students, appreciated her attitude to life."], "answer": 0, "explanations": ["and 連接文學興趣與同儕評價；appreciated amongst fellow students 是受到同儕肯定。", "把肯定改成討厭，且 only 不符同時提到 Wilde。", "混淆所喜愛的作家與肯定她的同儕。"], "tag": "長難句理解", "structure": "She was particularly interested...與 she was appreciated...為並列主句；in French writers 與 in...Oscar Wilde 為兩個興趣對象；for her...approach 說明受欣賞的原因。"}, {"id": "mansfield-paraphrase-9", "mode": "paraphrase", "paragraph": "D", "sentence": "After finishing her schooling in England, she returned to her New Zealand home in 1906, only then beginning to write short stories in a serious way.", "target": "", "options": ["She returned to New Zealand in 1906 and only at that point began writing short stories seriously.", "She was already writing short stories seriously before finishing school in England.", "She did not return to New Zealand until she had published all her major work."], "answer": 0, "explanations": ["only then 限定認真寫短篇的起點在返國時，不是所有作品都要等到回國後才存在。", "把 only then beginning 所限的起點提前。", "原句沒有等所有主要作品出版後才回國的條件。"], "tag": "長難句理解", "structure": "After finishing... 為時間分詞；she returned...為主句；only then beginning...為補充分詞，主體仍是 she；in a serious way 限定寫作的投入程度。"}, {"id": "mansfield-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "She had several works published in Australia in a magazine called The Native Companion, which was her first paid writing work, and by this time she had her mind set on becoming a professional writer.", "target": "", "options": ["By the time of the Australian magazine publications, she had resolved to become a professional writer.", "The magazine publications show that she was still determined to become a professional cellist.", "She decided to write professionally only after all publication opportunities had ended."], "answer": 0, "explanations": ["by this time 與 had her mind set 說明此時已確定寫作志向。", "把原句的 writer 換成先前音樂志向。", "原句正提作品出版，未說等所有出版機會消失才決定。"], "tag": "長難句理解", "structure": "She had several works published 為 have+受詞+過去分詞；called...修飾 magazine；which...補充此出版經驗為首份有酬寫作；and 後 she had her mind set on...表已立志。"}, {"id": "mansfield-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "It was also the first occasion on which she used the pseudonym “K. Mansfield”.", "target": "", "options": ["This was her first use of the pseudonym K. Mansfield.", "This was the first time she had ever written anything at all.", "K. Mansfield was identified as the magazine's name, not her pseudonym."], "answer": 0, "explanations": ["first occasion 的範圍由 on which she used the pseudonym 限定，不能擴大到首次寫作。", "已有 earlier stories，且本句只談首次採用該筆名。", "pseudonym 為作者所用筆名，不是雜誌標題。"], "tag": "長難句理解", "structure": "It was... 是主幹，It 回指前述出版機會；the first occasion 為表語；on which 引導關係子句，相當於在該次場合；she used... 是子句主幹。"}, {"id": "mansfield-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "In later years, she would express both admiration and disdain for New Zealand in her journals.", "target": "", "options": ["In later years, her journals expressed both positive regard and contempt for New Zealand.", "Her later journals expressed only admiration and never any negative feeling.", "Her later journals expressed only contempt and no admiration."], "answer": 0, "explanations": ["both...and... 強調兩種並存的相反情緒，不能刪掉任何一邊。", "只保留 admiration，忽略 disdain。", "只保留 disdain，忽略 admiration。"], "tag": "長難句理解", "structure": "In later years 為過去時間背景；would express 表過去反覆／後來發生的表達；both admiration and disdain 是並列受詞；for New Zealand 同時連到兩種情緒。"}, {"id": "mansfield-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "Mansfield became a co-editor of Rhythm, which was subsequently called The Blue Review, in which more of her works were published.", "target": "", "options": ["The magazine later called The Blue Review published more of her work after she became a co-editor.", "The Blue Review was the original title before it was renamed Rhythm.", "Mansfield edited two entirely unrelated magazines with no connection between them."], "answer": 0, "explanations": ["which was subsequently called... 指同一本雜誌後來改名，不是兩個無關刊物。", "subsequently 指改名後的名稱，不能顛倒先後。", "which 的回指連結同一本刊物，不能說毫無關係。"], "tag": "長難句理解", "structure": "Mansfield became... 是主句；which was subsequently called... 第一層非限定關係子句修飾 Rhythm；in which...第二層關係子句說明在該刊登載更多作品。"}, {"id": "mansfield-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "Their attempt to set up as writers in Paris was cut short by Murry's bankruptcy, which resulted from the failure of this and other journals.", "target": "", "options": ["Murry's bankruptcy ended their Paris plans early, and the bankruptcy stemmed from failed journals.", "Their Paris plans caused every journal to become successful and eliminated his debts.", "Murry's bankruptcy resulted from their decision to return to England after a successful Paris career."], "answer": 0, "explanations": ["which resulted from 指 bankruptcy 的成因；cut short 指其對巴黎計畫造成的中止。", "把刊物失敗及破產改成成功及清償債務。", "將原因與後果倒置，也憑空加入成功巴黎生涯。"], "tag": "長難句理解", "structure": "Their attempt to set up... 是主詞；was cut short by...為被動；which resulted from...修飾 bankruptcy；this and other journals 中 this 指 The Blue Review。"}, {"id": "mansfield-paraphrase-15", "mode": "paraphrase", "paragraph": "F", "sentence": "By October 1918 Mansfield had become seriously ill; she had been diagnosed with tuberculosis and was advised to enter a sanatorium.", "target": "", "options": ["By October 1918 she was seriously ill, and the diagnosis and recommendation were reported as already established.", "She first became ill only after leaving a sanatorium completely cured.", "She diagnosed herself and advised other writers to enter a sanatorium."], "answer": 0, "explanations": ["had become、had been diagnosed 的過去完成形式建立到該時點已發生的狀況。", "原句不是療養院痊癒後才初次生病。", "she had been diagnosed、was advised 為被動，她是接受診斷和建議者。"], "tag": "長難句理解", "structure": "By October 1918 提供截止時點；had become 表此前已病重；分號後 had been diagnosed with...為過去完成被動；and was advised to...為接受建議，不是她給建議。"}, {"id": "mansfield-paraphrase-16", "mode": "paraphrase", "paragraph": "F", "sentence": "In the autumn of 1918 she was so ill that she decided to go to Ospedaletti in Italy.", "target": "", "options": ["Her illness was serious enough in autumn 1918 to lead her to decide to go to Italy.", "She decided to go to Italy so that she would become seriously ill.", "She went to Italy because she had fully recovered and no longer needed care."], "answer": 0, "explanations": ["so ill that... 表病情嚴重帶來決定，是結果結構。", "把病重導致移動決定改成為了生病而去，因果顛倒。", "fully recovered 與 so ill 相反。"], "tag": "長難句理解", "structure": "In the autumn...為時間背景；she was so ill 為主幹；that she decided...是程度結果子句；to go...是 decided 的受詞不定詞，不能把 that 誤當目的。"}, {"id": "mansfield-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "It was the publication of Bliss and Other Stories in 1920 that was to solidify Mansfield's reputation as a writer.", "target": "", "options": ["The sentence highlights publication of Bliss and Other Stories in 1920 as the event that strengthened her standing as a writer.", "The sentence identifies her move to Italy as the event that destroyed her literary reputation.", "The sentence says that she published Bliss and Other Stories only after her death."], "answer": 0, "explanations": ["It was X that... 強調鞏固聲譽的是1920年的出版事件。", "錯換被強調事件，並把 solidify 反轉為破壞。", "文中死亡在1923，1920出版不是死後。"], "tag": "長難句理解", "structure": "It was the publication...that... 為強調句；in 1920 修飾 publication；was to solidify 表從過去視角看後來造成的作用；reputation as a writer 是受詞。"}, {"id": "mansfield-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "There she wrote eight stories including Miss Brill and The Daughters of the Late Colonel, the latter of which she pronounced to be “... the only story that satisfies me to any extent”.", "target": "", "options": ["Of the two named stories, she singled out The Daughters of the Late Colonel as satisfying her.", "She identified Miss Brill, the first title named, as the story that satisfied her.", "She declared that every story she had ever written satisfied her equally."], "answer": 0, "explanations": ["the latter 指前列兩個具名作品的後者，而非第一個或全部八篇。", "把 latter 誤讀成 former。", "引述 only story 限縮至一篇，不是所有作品。"], "tag": "長難句理解", "structure": "There 指 Menton 的居所；including 列舉兩篇作品；the latter of which 引出關係結構，latter 指第二篇；she pronounced X to be... 中 X 是被評價作品。"}, {"id": "mansfield-paraphrase-19", "mode": "paraphrase", "paragraph": "G", "sentence": "Mansfield produced a great deal of work in the final years of her life, and much of her prose and poetry remained unpublished at her death in 1923.", "target": "", "options": ["She wrote extensively near the end of her life, but a substantial amount of her prose and poetry was still unpublished when she died.", "Every work written during her final years had been published before her death.", "The sentence says she stopped writing several years before her death."], "answer": 0, "explanations": ["much...remained unpublished 與 produced a great deal 並存，區分創作量與出版狀態。", "把 much unpublished 改成全部已出版。", "produced...in the final years 表晚年仍大量創作，非早已停筆。"], "tag": "長難句理解", "structure": "Mansfield produced...為第一主句；and 後 much of her prose and poetry...為第二主句；remained+形容詞 unpublished 描述狀態；at her death 為當時時間界線。"}, {"id": "mansfield-paraphrase-20", "mode": "paraphrase", "paragraph": "G", "sentence": "His efforts resulted in two additional volumes of short stories, The Doves' Nest and Something Childish, published in 1923 and 1924 respectively; the publication of her Poems, as well as a collection of critical writings (Novels and Novelists) and a number of editions of Mansfield's previously unpublished letters and journals.", "target": "", "options": ["The Doves' Nest appeared in 1923 and Something Childish in 1924, alongside other posthumous publications resulting from Murry's work.", "Both named collections appeared in 1924, and no other kinds of writing were published.", "Something Childish appeared in 1923 and The Doves' Nest in 1924."], "answer": 0, "explanations": ["respectively 把作品清單與年份清單依序對應；後面還列 Poems、評論、書信及日記。", "忽略兩個年份及其他出版類型。", "將 respectively 的對應次序交換。"], "tag": "長難句理解", "structure": "His efforts resulted in...為主幹；two additional volumes 後列兩個書名；published in 1923 and 1924 respectively 為被動分詞補充；分號後延續 resulted in 的其他出版成果。"}, {"id": "mansfield-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "How Pearl Button Was Kidnapped portrayed Maori people in a favourable way.", "target": "portrayed", "options": ["描寫、呈現", "依法任命", "實際綁架"], "answer": 0, "explanations": ["portray 是在故事中呈現人物。此處練習題目用語，不表示整句符合原文。", "不指正式任命", "綁架出現在書名，不是 portray 的字義"], "tag": "題目字彙", "source": "Question 3 · 題目用語"}, {"id": "mansfield-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "How Pearl Button Was Kidnapped portrayed Maori people in a favourable way.", "target": "favourable", "options": ["正面、友善的", "帶有敵意的", "完全不相關的"], "answer": 0, "explanations": ["favourable way 指正面或有利的呈現方式。此處練習題目用語，不表示整句符合原文。", "敵意與正面不同", "不相關不是字義"], "tag": "題目字彙", "source": "Question 3 · 題目用語"}, {"id": "mansfield-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Bankruptcy prevented Mansfield and Murry from staying together in Paris.", "target": "Bankruptcy", "options": ["破產、無力償債", "銀行正式開業", "旅居國外"], "answer": 0, "explanations": ["bankruptcy 是財務無力償債的狀態。此處練習題目用語，不表示整句符合原文。", "不是銀行開業", "不是旅居的意思"], "tag": "題目字彙", "source": "Question 7–13 · 題目用語"}, {"id": "mansfield-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "She spent time with distinguished writers.", "target": "distinguished", "options": ["成就卓著、受敬重的", "完全未被識別的", "遭法律禁止工作的"], "answer": 0, "explanations": ["distinguished writers 指具有成就和聲望的作家。此處練習題目用語，不表示整句符合原文。", "未被識別不是此字義", "聲望不等於遭禁業"], "tag": "題目字彙", "source": "Question 7–13 · 題目用語"}, {"id": "mansfield-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "Tuberculosis restricted the time she spent in London.", "target": "restricted", "options": ["限制、縮減", "不斷延長", "完全不影響"], "answer": 0, "explanations": ["restricted 指可停留時間受到限制。此處練習題目用語，不表示整句符合原文。", "限制與延長相反", "受限不等於毫無影響"], "tag": "題目字彙", "source": "Question 7–13 · 題目用語"}, {"id": "mansfield-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "Her reputation was consolidated when Bliss and Other Stories was published.", "target": "consolidated", "options": ["鞏固、強化", "徹底毀壞", "最初改名為"], "answer": 0, "explanations": ["consolidate reputation 指使聲譽更穩固。此處練習題目用語，不表示整句符合原文。", "毀壞與鞏固相反", "不是改名"], "tag": "題目字彙", "source": "Question 7–13 · 題目用語"}, {"id": "mansfield-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Her reputation was consolidated when Bliss and Other Stories was published.", "target": "reputation", "options": ["聲譽、外界對其成就的評價", "法定出生姓名", "出版公司的帳戶"], "answer": 0, "explanations": ["reputation 是他人普遍持有的評價。此處練習題目用語，不表示整句符合原文。", "不是姓名", "不是帳戶"], "tag": "題目字彙", "source": "Question 7–13 · 題目用語"}]}, {"id": "muscle-loss", "title": "Muscle Loss", "sourceTitle": "Muscle Loss", "subtitle": "", "part": 2, "topic": "肌肉萎縮、研究機制與潛在應用", "sourceNote": "依原文的舊研究背景練習語言；could、ought to、prospect 等多為預測。D 段 only active 與 barely active 的說法不完全一致；E 段 the drug 缺乏明確先行詞，兩處不作確定結論的依據。", "paragraphs": [{"label": "A", "text": "For people confined to bed for long periods of time, or for astronauts in microgravity, muscle wasting is a serious problem. Wasting, or atrophy, is a symptom not only of disuse and injury, but of many diseases, including kidney failure, cancer and AIDS. Once enough muscle has been lost, a vicious cycle sets in as exercise becomes increasingly difficult, which in turn leads to disuse and further atrophy."}, {"label": "B", "text": "Despite more than three decades of research into alternatives, the only way to stop such patients losing muscle is a long course of physiotherapy involving weight-bearing exercise, but this is of little use to the weakest and sickest—and in most cases, starts only after wasting has already set in. The use of anabolic steroids is being explored for some conditions. But these compounds have a huge range of effects on the body besides promoting muscle growth, some of them undesirable, and only appear to work well in conjunction with exercise."}, {"label": "C", "text": "Alfred Goldberg, a cell biologist at Harvard University, began studying muscle atrophy in the late 1960s. What he and others discovered was that, rather than being a passive side effect of disuse or disease, muscle wasting is an active process controlled by a complex genetic pathway. So, if someone found out how it was turned on, it ought to be possible to turn it off. “Back then we didn't know the pathway for muscle breakdown,” says Goldberg, “but about five years ago our work showed that no matter what the trigger—disuse, metabolic disease or fasting—the same biochemical programme is responsible.”"}, {"label": "D", "text": "The process involves the ubiquitin-proteasome pathway (UPP), the disposal machinery used to break down unwanted proteins in the cell (New Scientist, 17 December 2005, p. 36). Once the system has been activated, ubiquitin “destroy me” labels are added to muscle proteins. This breaks down the muscle filaments within cells, but does not change the number of muscle cells. Instead, they become thinner and weaker. Further studies showed that at least 90 genes are involved in atrophy; Goldberg calls them “atrogenes.” Although it is still unknown which of these genes triggers atrophy, it soon became clear that two of them are essential to the process. Atrogin1 and muRF1 were first described in 2001 and are the only two atrogenes active only during muscle atrophy. They code for ubiquitin ligases, the enzymes that attach the “destroy me” labels to proteins. The genes are barely active in normal muscle, but expression levels shoot up in sick animals. Knock out either, and muscle wasting all but stops."}, {"label": "E", "text": "An experiment was conducted on a “superboy” who was normal at birth, lacking fat; by the age of five, he was excellent at weightlifting, lifting as much as three kilograms. The scientists found that this is closely related to his mother, who is a professional runner, and that his extended family has unusually strong abilities. The boy's condition is caused by a lack of myostatin, a protein that normally limits muscle growth. Without it, muscles grow far larger and stronger than usual. But the drug can have a temporary effect."}, {"label": "F", "text": "There are still many gaps to be filled in, but those in the field agree that the question is no longer if we can develop anti-wasting treatments, but when. As researchers close in on this target, excitement is mounting about exactly what such treatments could achieve. Patients due to be confined to bed for more than a few days could be given the drug as soon as they begin bed rest to prevent muscle loss that would otherwise slow their recovery. Weaning patients off respirators would become easier as doctors could prevent wasting of the diaphragm. Disease need no longer lead to weakness, and broken bones would not mean long and painful physiotherapy sessions to rebuild muscle strength. And since loss of muscle mass is a major reason why we grow frail with age, an anti-wasting drug could keep older people on their feet and living independently for longer."}, {"label": "G", "text": "The prospect of preventing atrophy is also of great interest to NASA, particularly in view of its much talked-about mission to Mars. By the time astronauts reach the Red Planet, they can expect to lose up to 25 per cent of their muscle mass and be too weak to walk, let alone put on a space suit and carry out repairs. That is why Goldberg's work is funded by the National Space Biomedical Research Institute in Houston, Texas, set up by NASA."}, {"label": "H", "text": "While there are valid medical and space applications for anti-wasting drugs, as a safer alternative to steroids they will inevitably be hugely tempting for athletes too, not to mention the lazy as well. Although Goldberg is keen to point out that helping cheats and couch potatoes is not the focus of his work, he admits that it will undoubtedly happen sooner or later."}], "questions": [{"id": "muscle-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "For people confined to bed for long periods of time, or for astronauts in microgravity, muscle wasting is a serious problem.", "target": "confined to bed", "options": ["unable or not permitted to leave bed", "sleeping only briefly", "choosing a new bed"], "answer": 0, "explanations": ["此處 confined to bed 表示「臥床、活動受限於床上」。須依原句語境理解。", "這個選項表示「只短暫睡眠」；原句要表達的是「臥床、活動受限於床上」。", "這個選項表示「選購新床」；原句要表達的是「臥床、活動受限於床上」。"], "tag": "搭配與語境義"}, {"id": "muscle-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "For people confined to bed for long periods of time, or for astronauts in microgravity, muscle wasting is a serious problem.", "target": "microgravity", "options": ["conditions with very little apparent gravitational force", "unusually strong gravity", "complete absence of air"], "answer": 0, "explanations": ["此處 microgravity 表示「微重力狀態」。須依原句語境理解。", "這個選項表示「異常強的重力」；原句要表達的是「微重力狀態」。", "這個選項表示「完全沒有空氣」；原句要表達的是「微重力狀態」。"], "tag": "字彙與語境義"}, {"id": "muscle-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "For people confined to bed for long periods of time, or for astronauts in microgravity, muscle wasting is a serious problem.", "target": "muscle wasting", "options": ["loss or deterioration of muscle tissue", "deliberate waste of exercise time", "rapid muscle growth"], "answer": 0, "explanations": ["此處 muscle wasting 表示「肌肉流失、萎縮」。須依原句語境理解。", "這個選項表示「刻意浪費運動時間」；原句要表達的是「肌肉流失、萎縮」。", "這個選項表示「肌肉快速增長」；原句要表達的是「肌肉流失、萎縮」。"], "tag": "搭配與語境義"}, {"id": "muscle-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "Wasting, or atrophy, is a symptom not only of disuse and injury, but of 缺乏活動的人」。", "這個選項表示「無法吃固體食物的病人」；原句要表達的是「久坐不動、缺乏活動的人」。"], "tag": "搭配與語境義"}, {"id": "muscle-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Once enough muscle has been lost, a vicious cycle sets in as exercise becomes increasingly difficult, which in turn leads to disuse and further atrophy.", "target": "", "options": ["Muscle loss can make exercise harder, leading to less use and still more muscle loss.", "Muscle loss makes exercise easier and reverses the cycle of inactivity.", "The cycle ends automatically as soon as exercise becomes difficult."], "answer": 0, "explanations": ["as 與 which in turn 串起不斷加重的因果鏈。", "把運動更困難改成更容易，方向相反。", "sets in 表循環開始，不是自動結束。"], "tag": "長難句理解", "structure": "Once 引導條件／時間子句；a vicious cycle sets in 為主句；as 說明原因；which 回指運動愈來愈困難的情況，進而導致廢用和萎縮。"}, {"id": "muscle-paraphrase-2", "mode": "paraphrase", "paragraph": "B", "sentence": "Despite more than three decades of research into alternatives, the only way to stop such patients losing muscle is a long course of physiotherapy involving weight-bearing exercise, but this is of little use to the weakest and sickest—and in most cases, starts only after wasting has already set in.", "target": "", "options": ["Despite years of research, the treatment described relies on physical exercise that offers little help to the most seriously ill and often begins after wasting starts.", "Research has produced an equally effective exercise-free treatment for every patient.", "The treatment is said to prevent all wasting before it begins, especially in the weakest patients."], "answer": 0, "explanations": ["Despite 表多年研究仍有限制；little use 與 only after 說明效益和時機限制。", "原句沒有提供對所有人同樣有效的免運動療法。", "把幫助有限及發病後才開始，改成對最弱者預防全部萎縮。"], "tag": "長難句理解", "structure": "Despite...為讓步；the only way...is...為主幹；involving...修飾 physiotherapy；but this...補充限制；only after...標示通常開始治療的時點。"}, {"id": "muscle-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "But these compounds have a huge range of effects on the body besides promoting muscle growth, some of them undesirable, and only appear to work well in conjunction with exercise.", "target": "", "options": ["The compounds have various effects, including unwanted ones, and appear helpful only alongside exercise.", "The compounds are described as acting only on muscles with no unwanted effects.", "The compounds are known to work equally well without exercise."], "answer": 0, "explanations": ["some of them undesirable 補充部分效果不良；appear 保留觀察的不確定性。", "besides 與 huge range 表不只肌肉生長一種效果。", "only...in conjunction with 排除無運動也同樣奏效的改寫。"], "tag": "長難句理解", "structure": "But these compounds 是主詞；have...and only appear...為並列謂語；besides promoting...表除此之外；some of them undesirable 為獨立補充；with exercise 為作用條件。"}, {"id": "muscle-paraphrase-4", "mode": "paraphrase", "paragraph": "C", "sentence": "What he and others discovered was that, rather than being a passive side effect of disuse or disease, muscle wasting is an active process controlled by a complex genetic pathway.", "target": "", "options": ["The researchers found wasting to be an actively controlled biological process, rather than merely a passive result of inactivity or disease.", "The researchers concluded that genes play no part in wasting.", "The researchers found wasting to be nothing more than an accidental side effect."], "answer": 0, "explanations": ["rather than 對照被排除的理解，核心是 active process。", "controlled by a genetic pathway 明確指出基因路徑。", "把作者修正的被動解釋誤作研究結論。"], "tag": "長難句理解", "structure": "What...discovered 是主詞子句；was that...為表語；rather than being...插入對照；controlled by...被動分詞修飾 process，非修飾 disease。"}, {"id": "muscle-paraphrase-5", "mode": "paraphrase", "paragraph": "C", "sentence": "So, if someone found out how it was turned on, it ought to be possible to turn it off.", "target": "", "options": ["If the activation mechanism were understood, the writer reasons that it should be possible to deactivate the process.", "The sentence reports that an effective deactivation treatment has already been approved.", "The sentence says the mechanism cannot be changed even if fully understood."], "answer": 0, "explanations": ["if...ought to...是條件下的推論，並未說已有療法。", "把 should be possible 升格為已核准治療。", "turn it off 表可望關閉，不是無論如何都無法改變。"], "tag": "長難句理解", "structure": "if someone found out...是條件子句；how it was turned on 是 found out 的受詞；it ought to be possible 為主句；to turn it off 是可能做到的內容。"}, {"id": "muscle-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "“Back then we didn't know the pathway for muscle breakdown,” says Goldberg, “but about five years ago our work showed that no matter what the trigger—disuse, metabolic disease or fasting—the same biochemical programme is responsible.”", "target": "", "options": ["The reported work linked several different triggers to the same biochemical programme.", "Each listed trigger was said to activate a completely unrelated programme.", "Only fasting, rather than disease or disuse, was linked to the programme."], "answer": 0, "explanations": ["no matter what 表不論列舉的觸發因素是哪種，皆涉及同一程式。", "the same 排除完全無關的不同程式。", "列舉包括 disuse、metabolic disease 與 fasting，不只禁食。"], "tag": "長難句理解", "structure": "our work showed that...為報告框架；no matter what the trigger 為讓步結構，破折號列例；the same programme is responsible 為嵌入主幹。"}, {"id": "muscle-paraphrase-7", "mode": "paraphrase", "paragraph": "D", "sentence": "This breaks down the muscle filaments within cells, but does not change the number of muscle cells.", "target": "", "options": ["The described breakdown makes muscle cells thinner and weaker without reducing their number.", "The process works entirely by eliminating muscle cells one by one.", "The process increases the number of muscle cells while leaving their size unchanged."], "answer": 0, "explanations": ["does not change the number 是數量不變，不代表結構與功能不變。", "將數量不變讀成逐個消除，與否定相反。", "原句沒有增加細胞數；隨後說變薄弱。"], "tag": "長難句理解", "structure": "This breaks down...為第一分句；but does not change...為對照謂語；the number of muscle cells 是 change 的受詞；不能把 number 與細胞內 filaments 混同。"}, {"id": "muscle-paraphrase-8", "mode": "paraphrase", "paragraph": "D", "sentence": "Although it is still unknown which of these genes triggers atrophy, it soon became clear that two of them are essential to the process.", "target": "", "options": ["Researchers had identified two necessary genes before establishing which genes initiate the process.", "Researchers had already identified every initiating gene before studying the two necessary ones.", "The inability to identify the initiating genes meant nothing at all was known about the process."], "answer": 0, "explanations": ["unknown which...triggers 與 two essential 可並存；必要因素不等於已知啟動者。", "把 still unknown 改成已辨識所有觸發基因。", "一部分未知不等於所有資訊都未知。"], "tag": "長難句理解", "structure": "Although...為讓步子句；which of these genes triggers...為 unknown 的內容；it became clear that...為主句；two of them 指前述基因中的兩個。"}, {"id": "muscle-paraphrase-9", "mode": "paraphrase", "paragraph": "D", "sentence": "The genes are barely active in normal muscle, but expression levels shoot up in sick animals.", "target": "", "options": ["The genes show very little activity in normal muscle, but their expression rises sharply in sick animals.", "The sentence says the genes are highly active in all normal muscle and inactive in sick animals.", "The sentence says normal muscle has absolutely no activity of these genes."], "answer": 0, "explanations": ["barely 是極少，不是絕對零；本句與前面 only active 的說法須區分。", "把正常與生病狀態的高低關係對調。", "barely active 不能改成完全沒有活性。"], "tag": "長難句理解", "structure": "The genes are barely active 是第一主句；but 表對比；expression levels shoot up 是第二主句；in normal muscle 與 in sick animals 分別限定兩種狀態。"}, {"id": "muscle-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "Knock out either, and muscle wasting all but stops.", "target": "", "options": ["Disabling either one of the two genes is reported to almost halt wasting.", "Both genes must be disabled together before wasting changes at all.", "Disabling a gene is said to stop wasting completely in every conceivable situation."], "answer": 0, "explanations": ["either 指兩者任一；all but 是幾乎，不是無例外完全。", "either 不能改成必須 both together。", "almost 不等於所有情境下絕對停止。"], "tag": "長難句理解", "structure": "Knock out either 是祈使形式；and 後接該條件下的結果；either 回指兩個基因之一；all but 修飾 stops，表示幾乎完全。"}, {"id": "muscle-paraphrase-11", "mode": "paraphrase", "paragraph": "E", "sentence": "The boy's condition is caused by a lack of myostatin, a protein that normally limits muscle growth.", "target": "", "options": ["The boy's unusual growth is attributed to lacking a protein that normally restricts muscle growth.", "The boy's growth is attributed to an excess of a protein that stimulates growth.", "The sentence states that myostatin is an exercise technique taught by his mother."], "answer": 0, "explanations": ["a lack of 與 normally limits 說明抑制物缺乏的機制。", "把缺乏改成過多，又把限制生長改成促進。", "a protein 明確定義不是運動技術。"], "tag": "長難句理解", "structure": "The boy's condition is caused by...為被動主幹；a protein 為 myostatin 的同位說明；that normally limits...為關係子句，修飾 protein。"}, {"id": "muscle-paraphrase-12", "mode": "paraphrase", "paragraph": "F", "sentence": "There are still many gaps to be filled in, but those in the field agree that the question is no longer if we can develop anti-wasting treatments, but when.", "target": "", "options": ["The researchers described feel increasingly certain that treatments will be developed, while their timing remains open.", "The sentence reports that all anti-wasting treatments are already available.", "The researchers described no longer think treatment development is possible."], "answer": 0, "explanations": ["no longer if...but when 把問題從能否轉到何時；這仍是研究者展望。", "尚在談 when，不能說已經全面可用。", "轉向何時代表對可行性較有信心，非放棄。"], "tag": "長難句理解", "structure": "There are still...先承認未知；but 連接 those in the field agree...；that 子句含 if 與 when 兩個疑問內容，對照是否能開發與何時能。"}, {"id": "muscle-paraphrase-13", "mode": "paraphrase", "paragraph": "F", "sentence": "Patients due to be confined to bed for more than a few days could be given the drug as soon as they begin bed rest to prevent muscle loss that would otherwise slow their recovery.", "target": "", "options": ["A prospective drug could be given at the start of bed rest to prevent muscle loss that would otherwise delay recovery.", "Every patient currently receives a drug guaranteed to prevent all muscle loss.", "Recovery is expected to slow because the drug must be withheld until after wasting ends."], "answer": 0, "explanations": ["could、to prevent、otherwise 分別表示潛在措施、目的、若不預防的後果。", "could 不等於現行普遍施行，亦非保證。", "as soon as begin 是開始時，不是萎縮結束後。"], "tag": "長難句理解", "structure": "Patients due to be confined...為主詞；could be given 是可能被動；as soon as...為施藥時點；that would otherwise slow...修飾 muscle loss，otherwise 指未防止時。"}, {"id": "muscle-paraphrase-14", "mode": "paraphrase", "paragraph": "G", "sentence": "By the time astronauts reach the Red Planet, they can expect to lose up to 25 per cent of their muscle mass and be too weak to walk, let alone put on a space suit and carry out repairs.", "target": "", "options": ["The passage predicts that astronauts might become too weak even to walk, making more demanding tasks still less feasible.", "The passage predicts that astronauts will find repairs easier than walking.", "The passage says astronauts must lose exactly a quarter of their muscle mass."], "answer": 0, "explanations": ["too weak to walk、let alone 呈現較簡單都難、更不用提複雜工作的遞進。", "let alone 將穿裝備維修列為更困難，不是更容易。", "up to 25 percent 是上限，非固定精確損失。"], "tag": "長難句理解", "structure": "By the time...限定抵達時點；can expect to...為原文預測；lose...與 be too weak...並列；let alone 省略重複結構，補充更困難活動。"}, {"id": "muscle-paraphrase-15", "mode": "paraphrase", "paragraph": "H", "sentence": "While there are valid medical and space applications for anti-wasting drugs, as a safer alternative to steroids they will inevitably be hugely tempting for athletes too, not to mention the lazy as well.", "target": "", "options": ["The writer expects non-medical interest in the drugs despite their legitimate medical and space uses.", "Legitimate medical uses make athletic misuse impossible.", "Goldberg states that helping inactive people cheat is the main purpose of his research."], "answer": 0, "explanations": ["While 表讓步；合法用途並不排除吸引運動員等非主要用途。", "把並存可能性改成互相排除。", "此句未說主要目的；下一句正否認這是研究焦點。"], "tag": "長難句理解", "structure": "While there are...是讓步子句；as a safer alternative...為評估背景；they will...be tempting 為主句；not to mention 補充另一類受吸引者。"}, {"id": "muscle-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "A reference to the limitations of current treatments for muscle loss.", "target": "limitations", "options": ["限制、局限", "使用說明書", "療效保證"], "answer": 0, "explanations": ["limitations 指方法能做到的範圍有限。此處練習題目用語，不表示整句符合原文。", "說明書是 instructions", "限制不等於療效保證"], "tag": "題目字彙", "source": "Question 15 · 題目用語"}, {"id": "muscle-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "A mention of a space agency's interest in anti-wasting research.", "target": "anti-wasting", "options": ["防止肌肉萎縮的", "反對回收廢物的", "促進肌肉流失的"], "answer": 0, "explanations": ["此處 wasting 是肌肉流失，anti 表防止。此處練習題目用語，不表示整句符合原文。", "不是一般垃圾問題", "anti 的方向與促進相反"], "tag": "題目字彙", "source": "Question 16 · 題目用語"}, {"id": "muscle-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "A reason why space travel could lead to severe muscle loss.", "target": "severe", "options": ["嚴重的", "微不足道的", "必然可逆的"], "answer": 0, "explanations": ["severe 指損失程度大。此處練習題目用語，不表示整句符合原文。", "微小是 slight，非 severe", "程度嚴重不代表必能逆轉"], "tag": "題目字彙", "source": "Question 17 · 題目用語"}, {"id": "muscle-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "A prediction of the wide-ranging benefits of anti-wasting drugs.", "target": "wide-ranging", "options": ["範圍廣泛的", "僅限單一情況的", "已完全確證的"], "answer": 0, "explanations": ["wide-ranging benefits 指多方面好處。此處練習題目用語，不表示整句符合原文。", "廣泛與單一相反", "範圍廣不表示證據已確定"], "tag": "題目字彙", "source": "Question 19 · 題目用語"}, {"id": "muscle-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "They are active in normal muscle tissue.", "target": "tissue", "options": ["組織", "面紙", "全身骨骼總數"], "answer": 0, "explanations": ["muscle tissue 指生物肌肉組織。此處練習題目用語，不表示整句符合原文。", "面紙是其他語境義", "不是骨骼數量"], "tag": "題目字彙", "source": "Question 20–21 A · 題目用語"}, {"id": "muscle-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "They prevent the breakdown of muscle proteins.", "target": "breakdown", "options": ["分解", "詳細的費用表", "情緒崩潰"], "answer": 0, "explanations": ["此處是蛋白質被分解。此處練習題目用語，不表示整句符合原文。", "費用細分表不合生物語境", "不是情緒反應"], "tag": "題目字彙", "source": "Question 20–21 C · 題目用語"}, {"id": "muscle-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "They are responsible for producing muscle filaments.", "target": "filaments", "options": ["細絲狀結構", "完整器官", "人體脂肪總量"], "answer": 0, "explanations": ["muscle filaments 指肌肉細絲。此處練習題目用語，不表示整句符合原文。", "不是完整器官", "不是脂肪總量"], "tag": "題目字彙", "source": "Question 20–21 D · 題目用語"}, {"id": "muscle-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "They code for enzymes that label proteins for destruction.", "target": "code for", "options": ["以遺傳資訊指定製造", "替文字加密", "提出口頭警告"], "answer": 0, "explanations": ["基因 code for 指攜帶製造某產物的資訊。此處練習題目用語，不表示整句符合原文。", "不是加密訊息", "不是口頭警告"], "tag": "題目字彙", "source": "Question 20–21 E · 題目用語"}, {"id": "muscle-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "They code for enzymes that label proteins for destruction.", "target": "destruction", "options": ["破壞、分解清除", "生成新組織", "短暫搬運"], "answer": 0, "explanations": ["此處指蛋白質被標記以供清除。此處練習題目用語，不表示整句符合原文。", "不是新生", "標記供分解不等於僅搬運"], "tag": "題目字彙", "source": "Question 20–21 E · 題目用語"}, {"id": "muscle-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "The study of the superboy revealed unusual strength linked to a lack of myostatin.", "target": "revealed", "options": ["揭示、發現", "刻意隱瞞", "正式否定"], "answer": 0, "explanations": ["revealed 指研究呈現某發現；此句為原題摘要的語句修整。此處練習題目用語，不表示整句符合原文。", "隱藏與揭示相反", "揭示不是否定"], "tag": "題目字彙", "source": "Question 22–26 · 題目用語"}]}, {"id": "songs-of-stones", "title": "Songs of Stones", "sourceTitle": "Songs of Stones", "subtitle": "", "part": 1, "topic": "帕拉底歐建築、展覽與評論", "sourceNote": "500 years ago 為原文展覽時期的相對時間；therapeutic 等評語屬評論者觀點。明顯拼寫與不自然搭配已修正。", "paragraphs": [{"label": "A", "text": "Vicenza is a pleasant, prosperous city in the Veneto, 60km west of Venice. Its grand families settled and farmed the area from the 16th century. But its principal claim to fame is Andrea Palladio, who is such an influential architect that a neoclassical style is known as Palladian. The city is a permanent exhibition of some of his finest buildings, and as he was born in Padua-to be precise-500 years ago, the International Centre for the Study of Palladio’s Architecture has an excellent excuse for mounting la grande mostra, the big show."}, {"label": "B", "text": "The exhibition has the special advantage of being held in one of Palladio's buildings, Palazzo Barbaran da Porto. Its bold façade is a mixture of rustication and decoration set between two rows of elegant columns. On the second floor the pediments are alternately curved or pointed, a Palladian trademark. The harmonious proportions of the atrium at the entrance lead through to a dramatic interior of fine fireplaces and painted ceilings. Palladio's design is simple, clear and not over-crowded. The show has been organised on the same principles, according to Howard Burns, the architectural historian who co-curated it."}, {"label": "C", "text": "Palladio’s father was a miller who settled in Vicenza, where the young Andrea was apprenticed to a skilled stonemason. How did a humble miller’s son become a world-renowned architect? The answer in the exhibition is that, as a young man, Palladio excelled at carving decorative stonework on columns, doorways and fireplaces. He was plainly intelligent, and lucky enough to come across a rich patron, Gian Giorgio Trissino, a landowner and scholar, who organised his education, taking him to Rome in the 1540s, where he studied the masterpieces of classical Roman and Greek architecture and the work of other influential architects of the time, such as Donato Bramante and Raphael."}, {"label": "D", "text": "Mr Burns argues that social mobility was also important. Entrepreneurs, prosperous from agriculture in the Veneto, commissioned the promising local architect to design their country villas and their urban mansions. In Venice the aristocracy were anxious to co-opt talented artists, and Palladio was given the chance to design the buildings that have made him famous-the churches of San Giorgio Maggiore and the Redentore, both easy to admire because they can be seen from the city’s historical centre across a stretch of water."}, {"label": "E", "text": "He tried his hand at bridges-his unbuilt version of the Rialto Bridge was decorated with the large pediment and columns of a temple and, after a fire at the Ducal Palace, he offered an alternative design which bears an uncanny resemblance to the Banqueting House in Whitehall in London. Since it was designed by Inigo Jones, Palladio's first foreign disciple, this is not as surprising as it sounds."}, {"label": "F", "text": "Jones, who visited Italy in 1614, bought a trunk full of the master’s architectural drawings; they passed through the hands of the Dukes of Burlington and Devonshire before settling at the Royal Institute of British Architects in 1894. Many are now on display at Palazzo Barbaran. What they show is how Palladio drew on the buildings of ancient Rome as models. The major theme of both his rural and urban building was temple architecture, with a strong pointed pediment supported by columns and approached by wide steps."}, {"label": "G", "text": "Palladio's work for rich landowners alienates unreconstructed critics on the Italian left, but among the papers in the show are designs for cheap housing in Venice. In the wider world, Palladio's reputation has been nurtured by a text he wrote and illustrated, “Quattro Libri dell’Architettura”. His influence spread to St Petersburg and to Charlottesville in Virginia, where Thomas Jefferson commissioned a Palladian villa he called Monticello."}, {"label": "H", "text": "Vicenza's show contains detailed models of the major buildings and is leavened by portraits of Palladio's teachers and clients by Titian, Veronese and Tintoretto; the paintings of his Venetian buildings are all by Canaletto, no less. This is an uncompromising exhibition; many of the drawings are small and faint, and there are no sideshows for children, but the impact of harmonious lines and satisfying proportions is to impart to a viewer a feeling of benevolent calm. Palladio is history's most therapeutic architect."}], "questions": [{"id": "stones-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Vicenza is a pleasant, prosperous city in the Veneto, 60km west of Venice.", "target": "prosperous", "options": ["wealthy and economically successful", "barely surviving economically", "newly abandoned"], "answer": 0, "explanations": ["此處 prosperous 表示「繁榮富裕的」。須依原句語境理解。", "這個選項表示「經濟勉強維持的」；原句要表達的是「繁榮富裕的」。", "這個選項表示「最近被廢棄的」；原句要表達的是「繁榮富裕的」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "But its principal claim to fame is Andrea Palladio, who is such an influential architect that a neoclassical style is known as Palladian.", "target": "principal claim to fame", "options": ["the main reason a place is well known", "a formal demand for payment", "a disproved historical claim"], "answer": 0, "explanations": ["此處 principal claim to fame 表示「最主要的知名原因」。須依原句語境理解。", "這個選項表示「正式索款」；原句要表達的是「最主要的知名原因」。", "這個選項表示「已推翻的歷史主張」；原句要表達的是「最主要的知名原因」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "But its principal claim to fame is Andrea Palladio, who is such an influential architect that a neoclassical style is known as Palladian.", "target": "influential", "o ws of elegant columns.", "target": "rustication", "options": ["rough-surfaced decorative masonry", "deterioration caused by metal rust", "deliberate removal of all stonework"], "answer": 0, "explanations": ["此處 rustication 表示「粗面石工、粗面砌石裝飾」。須依原句語境理解。", "這個選項表示「金屬鏽蝕造成的劣化」；原句要表達的是「粗面石工、粗面砌石裝飾」。", "這個選項表示「刻意移除全部石工」；原句要表達的是「粗面石工、粗面砌石裝飾」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-8", "mode": "vocab", "paragraph": "B", "sentence": "Its bold façade is a mixture of rustication and decoration set between two rows of elegant columns.", "target": "columns", "options": ["upright structural or decorative pillars", "regular newspaper articles", "rows of financial figures"], "answer": 0, "explanations": ["此處 columns 表示「柱子」。須依原句語境理解。", "這個選項表示「報紙專欄」；原句要表達的是「柱子」。", "這個選項表示「財務數字欄」；原句要表達的是「柱子」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-9", "mode": "vocab", "paragraph": "B", "sentence": "On the second floor the pediments are alternately curved or pointed, a Palladian trademark.", "target": "pediments", "options": ["triangular or curved decorative elements above a classical front", "underground foundations", "the wide stairs only"], "answer": 0, "explanations": ["此處 pediments 表示「古典建築的山牆或飾頂」。須依原句語境理解。", "這個選項表示「地下基礎」；原句要表達的是「古典建築的山牆或飾頂」。", "這個選項表示「僅指寬闊樓梯」；原句要表達的是「古典建築的山牆或飾頂」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "On the second floor the pediments are alternately curved or pointed, a Palladian trademark.", "target": "trademark", "options": ["a characteristic feature strongly associated with someone", "a fee charged to visitors", "a guarantee of legal ownership"], "answer": 0, "explanations": ["此處 trademark 表示「標誌性特色」。須依原句語境理解。", "這個選項表示「向訪客收的費用」；原句要表達的是「標誌性特色」。", "這個選項表示「法律所有權保證」；原句要表達的是「標誌性特色」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "The harmonious proportions of the atrium at the entrance lead through to a dramatic interior of fine fireplaces and painted ceilings.", "target": "harmonious proportions", "options": ["balanced size relationships that fit well together", "identical measurements in every dimension", "deliberately clashing colours"], "answer": 0, "explanations": ["此處 harmonious proportions 表示「和諧的比例」。須依原句語境理解。", "這個選項表示「所有尺寸完全一致」；原句要表達的是「和諧的比例」。", "這個選項表示「刻意衝突的顏色」；原句要表達的是「和諧的比例」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "The harmonious proportions of the atrium at the entrance lead through to a dramatic interior of fine fireplaces and painted ceilings.", "target": "atrium", "options": ["a central entrance hall or open interior space", "a narrow exterior gutter", "a room beneath the foundations"], "answer": 0, "explanations": ["此處 atrium 表示「中庭、入口大廳」。須依原句語境理解。", "這個選項表示「狹窄外部排水溝」；原句要表達的是「中庭、入口大廳」。", "這個選項表示「基礎下方房間」；原句要表達的是「中庭、入口大廳」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "The show has been organised on the same principles, according to Howard Burns, the architectural historian who co-curated it.", "target": "co-curated", "options": ["jointly selected and organised as an exhibition", "jointly purchased as private property", "restored using medical treatment"], "answer": 0, "explanations": ["此處 co-curated 表示「共同策展」。須依原句語境理解。", "這個選項表示「共同購為私產」；原句要表達的是「共同策展」。", "這個選項表示「用醫療方式修復」；原句要表達的是「共同策展」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-14", "mode": "vocab", "paragraph": "C", "sentence": "Palladio’s father was a miller who settled in Vicenza, where the young Andrea was apprenticed to a skilled stonemason.", "target": "miller", "options": ["a person operating a mill to grind grain", "a person mining precious stones", "a person designing ships"], "answer": 0, "explanations": ["此處 miller 表示「磨坊工人」。須依原句語境理解。", "這個選項表示「挖掘寶石的人」；原句要表達的是「磨坊工人」。", "這個選項表示「設計船舶的人」；原句要表達的是「磨坊工人」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-15", "mode": "vocab", "paragraph": "C", "sentence": "Palladio’s father was a miller who settled in Vicenza, where the young Andrea was apprenticed to a skilled stonemason.", "target": "apprenticed to", "options": ["placed with a skilled worker to learn a trade", "employed as the supervisor of", "legally prevented from learning from"], "answer": 0, "explanations": ["此處 apprenticed to 表示「拜師學藝、當學徒」。須依原句語境理解。", "這個選項表示「受聘監督」；原句要表達的是「拜師學藝、當學徒」。", "這個選項表示「依法禁止向……學習」；原句要表達的是「拜師學藝、當學徒」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-16", "mode": "vocab", "paragraph": "C", "sentence": "Palladio’s father was a miller who settled in Vicenza, where the young Andrea was apprenticed to a skilled stonemason.", "target": "stonemason", "options": ["a craftsperson who cuts and works stone", "a person manufacturing glass", "a professional painter of portraits"], "answer": 0, "explanations": ["此處 stonemason 表示「石匠」。須依原句語境理解。", "這個選項表示「玻璃製造者」；原句要表達的是「石匠」。", "這個選項表示「專業肖像畫家」；原句要表達的是「石匠」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-17", "mode": "vocab", "paragraph": "C", "sentence": "How did a humble miller’s son become a world-renowned architect?", "target": "humble", "options": ["of a modest social background", "showing no architectural skill", "highly aristocratic"], "answer": 0, "explanations": ["此處 humble 表示「出身卑微的」。須依原句語境理解。", "這個選項表示「沒有建築技巧的」；原句要表達的是「出身卑微的」。", "這個選項表示「貴族地位很高的」；原句要表達的是「出身卑微的」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-18", "mode": "vocab", "paragraph": "C", "sentence": "The answer in the exhibition is that, as a young man, Palladio excelled at carving decorative stonework on columns, doorways and fireplaces.", "target": "excelled at", "options": ["was exceptionally good at", "refused to attempt", "was first trained in"], "answer": 0, "explanations": ["此處 excelled at 表示「擅長、表現傑出」。須依原句語境理解。", "這個選項表示「拒絕嘗試」；原句要表達的是「擅長、表現傑出」。", "這個選項表示「首次接受訓練於」；原句要表達的是「擅長、表現傑出」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-19", "mode": "vocab", "paragraph": "C", "sentence": "The answer in the exhibition is that, as a young man, Palladio excelled at carving decorative stonework on columns, doorways and fireplaces.", "target": " , "answer": 0, "explanations": ["此處 social mobility 表示「社會階級流動」。須依原句語境理解。", "這個選項表示「鄰近城鎮間旅行」；原句要表達的是「社會階級流動」。", "這個選項表示「建築實際移動」；原句要表達的是「社會階級流動」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-23", "mode": "vocab", "paragraph": "D", "sentence": "Entrepreneurs, prosperous from agriculture in the Veneto, commissioned the promising local architect to design their country villas and their urban mansions.", "target": "Entrepreneurs", "options": ["people who establish and run business ventures", "people inheriting only political titles", "employees paid only to give tours"], "answer": 0, "explanations": ["此處 Entrepreneurs 表示「企業家、創業者」。須依原句語境理解。", "這個選項表示「只繼承政治頭銜的人」；原句要表達的是「企業家、創業者」。", "這個選項表示「只受薪帶團的人」；原句要表達的是「企業家、創業者」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-24", "mode": "vocab", "paragraph": "D", "sentence": "Entrepreneurs, prosperous from agriculture in the Veneto, commissioned the promising local architect to design their country villas and their urban mansions.", "target": "commissioned", "options": ["formally engaged to produce work", "criticised after completion", "prevented from working"], "answer": 0, "explanations": ["此處 commissioned 表示「委託創作或設計」。須依原句語境理解。", "這個選項表示「完成後批評」；原句要表達的是「委託創作或設計」。", "這個選項表示「阻止工作」；原句要表達的是「委託創作或設計」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-25", "mode": "vocab", "paragraph": "D", "sentence": "Entrepreneurs, prosperous from agriculture in the Veneto, commissioned the promising local architect to design their country villas and their urban mansions.", "target": "villas", "options": ["large country residences", "temporary street stalls", "public sports stadiums"], "answer": 0, "explanations": ["此處 villas 表示「鄉間別墅」。須依原句語境理解。", "這個選項表示「臨時路邊攤」；原句要表達的是「鄉間別墅」。", "這個選項表示「公共體育場」；原句要表達的是「鄉間別墅」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-26", "mode": "vocab", "paragraph": "D", "sentence": "Entrepreneurs, prosperous from agriculture in the Veneto, commissioned the promising local architect to design their country villas and their urban mansions.", "target": "mansions", "options": ["very large impressive houses", "small workshops", "communal grain stores"], "answer": 0, "explanations": ["此處 mansions 表示「豪宅」。須依原句語境理解。", "這個選項表示「小工坊」；原句要表達的是「豪宅」。", "這個選項表示「公共穀倉」；原句要表達的是「豪宅」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-27", "mode": "vocab", "paragraph": "D", "sentence": "In Venice the aristocracy were anxious to co-opt talented artists, and Palladio was given the chance to design the buildings that have made him famous-the churches of San Giorgio Maggiore and the Redentore, both easy to admire because they can be seen from the city’s historical centre across a stretch of water.", "target": "aristocracy", "options": ["the highest hereditary social class", "the whole working population", "a group of art students"], "answer": 0, "explanations": ["此處 aristocracy 表示「貴族階級」。須依原句語境理解。", "這個選項表示「全部勞動人口」；原句要表達的是「貴族階級」。", "這個選項表示「一群藝術學生」；原句要表達的是「貴族階級」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-28", "mode": "vocab", "paragraph": "D", "sentence": "In Venice the aristocracy were anxious to co-opt talented artists, and Palladio was given the chance to design the buildings that have made him famous-the churches of San Giorgio Maggiore and the Redentore, both easy to admire because they can be seen from the city’s historical centre across a stretch of water.", "target": "co-opt", "options": ["bring into a group to use their abilities or support", "exclude permanently", "copy without any alteration"], "answer": 0, "explanations": ["此處 co-opt 表示「延攬、吸收納入」。須依原句語境理解。", "這個選項表示「永久排除」；原句要表達的是「延攬、吸收納入」。", "這個選項表示「完全照抄」；原句要表達的是「延攬、吸收納入」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-29", "mode": "vocab", "paragraph": "E", "sentence": "He tried his hand at bridges-his unbuilt version of the Rialto Bridge was decorated with the large pediment and columns of a temple and, after a fire at the Ducal Palace, he offered an alternative design which bears an uncanny resemblance to the Banqueting House in Whitehall in London.", "target": "tried his hand at", "options": ["attempted an activity to see how well he could do it", "injured his hand while", "was formally forbidden to practise"], "answer": 0, "explanations": ["此處 tried his hand at 表示「嘗試從事」。須依原句語境理解。", "這個選項表示「從事時傷到手」；原句要表達的是「嘗試從事」。", "這個選項表示「被正式禁止練習」；原句要表達的是「嘗試從事」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-30", "mode": "vocab", "paragraph": "E", "sentence": "He tried his hand at bridges-his unbuilt version of the Rialto Bridge was decorated with the large pediment and columns of a temple and, after a fire at the Ducal Palace, he offered an alternative design which bears an uncanny resemblance to the Banqueting House in Whitehall in London.", "target": "uncanny resemblance", "options": ["a striking and strangely close similarity", "a minor unrelated coincidence", "a deliberate complete contrast"], "answer": 0, "explanations": ["此處 uncanny resemblance 表示「驚人而近乎奇異的相似」。須依原句語境理解。", "這個選項表示「微小且無關的巧合」；原句要表達的是「驚人而近乎奇異的相似」。", "這個選項表示「刻意的完全對比」；原句要表達的是「驚人而近乎奇異的相似」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-31", "mode": "vocab", "paragraph": "E", "sentence": "Since it was designed by Inigo Jones, Palladio's first foreign disciple, this is not as surprising as it sounds.", "target": "disciple", "options": ["a follower influenced by a teacher's ideas", "a person formally rejecting a teacher", "the original inventor of all the ideas"], "answer": 0, "explanations": ["此處 disciple 表示「門徒、追隨者」。須依原句語境理解。", "這個選項表示「正式拒絕老師的人」；原句要表達的是「門徒、追隨者」。", "這個選項表示「所有理念的最初發明者」；原句要表達的是「門徒、追隨者」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-32", "mode": "vocab", "paragraph": "F", "sentence": "Jones, who visited Italy in 1614, bought a trunk full of the master’s architectural drawings; they passed through the hands of the Dukes of Burlington and Devonshire before settling at the Royal Institute of British Architects in 1894.", "target": "trunk", "options": ["a large storage chest", "the main stem of a tree", "an elephant's nose"], "answer": 0, "explanations": ["此處 trunk 表示「大型行李箱」。須依原句語境理解。", "這個選項表示「樹幹」；原句要表達的是「大型行李箱」。", "這個選項表示「象鼻」；原句要表達的是「大型行李箱」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-33", "mode": "vocab", "paragraph": "F", "sentence": "Jones, who visited Italy in 1614, bought a trunk full of the master’s architectural drawings; they passed through the hands of the Dukes of Burlington and Devonshire before settling at the Royal Institute of British Architects in 1894.", "target": "passed through the hands of", "options": ["were owned or held successively by", "were physically destroyed by", "were created entirely by"], "answer": 0, "explanations": ["此處 passed through the hands of 表示「先後轉手由……持有」。須依原句語境理解。", "這個選項表示「被實際毀壞」；原句要表達的是「先後轉手由……持有」。", "這個選項表示「完全由……創作」；原句要表達的是「先後轉手由……持有」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-34", "mode": "vocab", "paragraph": "F", "sentence": "What they show is how Palladio drew on the buildings of ancient Rome as models.", "target": "drew on", "options": ["used as a source of ideas", "sketched directly on the surface of", "refused to consider"], "answer": 0, "explanations": ["此處 drew on 表示「借鑑、取材自」。須依原句語境理解。", "這個選項表示「直接畫在……表面上」；原句要表達的是「借鑑、取材自」。", "這個選項表示「拒絕考慮」；原句要表達的是「借鑑、取材自」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-35", "mode": "vocab", "paragraph": "F", "sentence": "The major theme of both his rural and urban building was temple architecture, with a strong pointed pediment supported by columns and approached by wide steps.", "target": "temple architecture", "options": ["building design associated with religious temples", "the shape of the side of a human head", "a design for temporary camps"], "answer": 0, "explanations": ["此處 temple architecture 表示「神殿建築風格」。須依原句語境理解。", "這個選項表示「人類頭側的形狀」；原句要表達的是「神殿建築風格」。", "這個選項表示「臨時營地設計」；原句要表達的是「神殿建築風格」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-36", "mode": "vocab", "paragraph": "G", "sentence": "Palladio's work for rich landowners alienates unreconstructed critics on the Italian left, but among the papers in the show are designs for cheap housing in Venice.", "target": "alienates", "options": ["makes
