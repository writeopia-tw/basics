ontains detailed models of the major buildings and is leavened by portraits of Palladio's teachers and clients by Titian, Veronese and Tintoretto; the paintings of his Venetian buildings are all by Canaletto, no less.", "target": "no less", "options": ["used to emphasise something impressive", "not enough in quantity", "not as impressive as expected"], "answer": 0, "explanations": ["此處 no less 表示「竟然、正是，用於強調分量」。須依原句語境理解。", "這個選項表示「數量不足」；原句要表達的是「竟然、正是，用於強調分量」。", "這個選項表示「不如預期出色」；原句要表達的是「竟然、正是，用於強調分量」。"], "tag": "搭配與語境義"}, {"id": "stones-vocab-41", "mode": "vocab", "paragraph": "H", "sentence": "This is an uncompromising exhibition; many of the drawings are small and faint, and there are no sideshows for children, but the impact of harmonious lines and satisfying proportions is to impart to a viewer a feeling of benevolent calm.", "target": "uncompromising", "options": ["not making concessions to become easier or more popular", "easily adjusted to please everyone", "unable to make decisions"], "answer": 0, "explanations": ["此處 uncompromising 表示「不妥協、不迎合的」。須依原句語境理解。", "這個選項表示「輕易調整以迎合所有人」；原句要表達的是「不妥協、不迎合的」。", "這個選項表示「無法決定的」；原句要表達的是「不妥協、不迎合的」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-42", "mode": "vocab", "paragraph": "H", "sentence": "This is an uncompromising exhibition; many of the drawings are small and faint, and there are no sideshows for children, but the impact of harmonious lines and satisfying proportions is to impart to a viewer a feeling of benevolent calm.", "target": "faint", "options": ["difficult to see clearly", "temporarily unconscious", "physically unstable"], "answer": 0, "explanations": ["此處 faint 表示「淡而不清楚的」。須依原句語境理解。", "這個選項表示「暫時昏厥的」；原句要表達的是「淡而不清楚的」。", "這個選項表示「物理上不穩定的」；原句要表達的是「淡而不清楚的」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-43", "mode": "vocab", "paragraph": "H", "sentence": "This is an uncompromising exhibition; many of the drawings are small and faint, and there are no sideshows for children, but the impact of harmonious lines and satisfying proportions is to impart to a viewer a feeling of benevolent calm.", "target": "impart", "options": ["give or communicate a quality or feeling", "remove entirely", "divide into equal parts"], "answer": 0, "explanations": ["此處 impart 表示「賦予、傳達」。須依原句語境理解。", "這個選項表示「完全移除」；原句要表達的是「賦予、傳達」。", "這個選項表示「平均分割」；原句要表達的是「賦予、傳達」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-44", "mode": "vocab", "paragraph": "H", "sentence": "This is an uncompromising exhibition; many of the drawings are small and faint, and there are no sideshows for children, but the impact of harmonious lines and satisfying proportions is to impart to a viewer a feeling of benevolent calm.", "target": "benevolent", "options": ["kindly and gentle in effect", "harsh and threatening", "financially profitable"], "answer": 0, "explanations": ["此處 benevolent 表示「溫和仁善的」。須依原句語境理解。", "這個選項表示「嚴厲具威脅的」；原句要表達的是「溫和仁善的」。", "這個選項表示「能獲利的」；原句要表達的是「溫和仁善的」。"], "tag": "字彙與語境義"}, {"id": "stones-vocab-45", "mode": "vocab", "paragraph": "H", "sentence": "Palladio is history's most therapeutic architect.", "target": "therapeutic", "options": ["having a soothing or healing effect", "designed only as a hospital", "causing deliberate discomfort"], "answer": 0, "explanations": ["此處 therapeutic 表示「有療癒、舒緩效果的」。須依原句語境理解。", "這個選項表示「只設計作醫院的」；原句要表達的是「有療癒、舒緩效果的」。", "這個選項表示「刻意造成不適的」；原句要表達的是「有療癒、舒緩效果的」。"], "tag": "字彙與語境義"}, {"id": "stones-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "But its principal claim to fame is Andrea Palladio, who is such an influential architect that a neoclassical style is known as Palladian.", "target": "", "options": ["Palladio's influence was great enough for an architectural style to be named after him.", "Palladio was named after a style that had become famous centuries before he was born.", "The sentence says his buildings had no influence on later design."], "answer": 0, "explanations": ["such...that...表示影響力大到形成以他命名的風格。", "將人名與風格命名方向顛倒。", "influential 與毫無影響相反。"], "tag": "長難句理解", "structure": "its principal claim to fame is...為主句；who is such...that...為關係子句內的程度結果結構；Palladian 是被命名的 neoclassical style。"}, {"id": "stones-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "The city is a permanent exhibition of some of his finest buildings, and as he was born in Padua-to be precise-500 years ago, the International Centre for the Study of Palladio’s Architecture has an excellent excuse for mounting la grande mostra, the big show.", "target": "", "options": ["The anniversary of Palladio's birth provides an occasion for the exhibition in a city already displaying his buildings.", "The exhibition is being held because all his buildings in the city have disappeared.", "Palladio was born in Vicenza exactly five hundred years before the present reader's lifetime."], "answer": 0, "explanations": ["as...說明辦展契機；相對時間以原文年代為準，出生地是 Padua。", "原句說城市本身就是永久展示，非全消失。", "錯換出生地，也把文章時點誤套成讀者現在。"], "tag": "長難句理解", "structure": "The city is...and...the Centre has...為並列主句；as he was born...是原因子句；to be precise 插入修正；for mounting...說明 excuse 的內容。"}, {"id": "stones-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "The show has been organised on the same principles, according to Howard Burns, the architectural historian who co-curated it.", "target": "", "options": ["Burns says the exhibition follows the simple and uncluttered principles used in Palladio's design.", "Burns says the exhibition deliberately reverses Palladio's principles.", "The exhibition's principles are attributed to an unknown person who did not help organise it."], "answer": 0, "explanations": ["same principles 回指前句 simple、clear、not over-crowded。", "same 不等於相反。", "Howard Burns 有姓名且 co-curated it，不能說未參與。"], "tag": "長難句理解", "structure": "The show has been organised...為被動主幹；on the same principles 指依相同原則；according to...標記資訊來源；who co-curated it 修飾 historian。"}, {"id": "stones-paraphrase-4", "mode": "paraphrase", "paragraph": "C", "sentence": "Palladio’s father was a miller who settled in Vicenza, where the young Andrea was apprenticed to a skilled stonemason.", "target": "", "options": ["After his father settled in Vicenza, young Andrea trained under a skilled worker in stone.", "Young Andrea trained his father to become a stonemason in another city.", "Andrea was already an established architect before learning any stonework."], "answer": 0, "explanations": ["was apprenticed to 表年輕 Andrea 是學徒，stonemason 是師傅。", "將受訓者與父親角色交換。", "原句先描述學徒階段，未說已成建築名家。"], "tag": "長難句理解", "structure": "Palladio's father was a miller 為主幹；who settled...修飾 father；where...was apprenticed...修飾 Vicenza，含被動學徒關係。"}, {"id": "stones-paraphrase-5", "mode": "paraphrase", "paragraph": "C", "sentence": "The answer in the exhibition is that, as a young man, Palladio excelled at carving decorative stonework on columns, doorways and fireplaces.", "target": "", "options": ["The exhibition explains his progress partly through exceptional skill in decorative stone carving as a young man.", "The exhibition says he avoided working with stone until late in life.", "The exhibition identifies his skill as mainly painting portraits rather than carving."], "answer": 0, "explanations": ["excelled at 表雕刻技能突出；as a young man 限定早年。", "把早年擅長改成晚年才做。", "改變專長內容，原句是 carving stonework。"], "tag": "長難句理解", "structure": "The answer...is that...為主幹；as a young man 為時間補充；Palladio excelled at...為表語子句；on columns...列舉雕刻所在構件。"}, {"id": "stones-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "He was plainly intelligent, and lucky enough to come across a rich patron, Gian Giorgio Trissino, a landowner and scholar, who organised his education, taking him to Rome in the 1540s, where he studied the masterpieces of classical Roman and Greek architecture and the work of other influential architects of the time, such as Donato Bramante and Raphael.", "target": "", "options": ["A wealthy supporter organised his education and took him to Rome, where he studied ancient and contemporary architectural examples.", "Palladio paid a poor pupil to travel alone to Rome and teach him architecture.", "The supporter prevented him from studying the work of other architects."], "answer": 0, "explanations": ["who organised...修飾 Trissino；taking him... 的執行者也是贊助者。", "顛倒師生與資助關係，並把同行改為獨行。", "where he studied 明確說獲得學習機會。"], "tag": "長難句理解", "structure": "patron 後 Gian Giorgio Trissino 與 landowner and scholar 為同位語；who...為關係子句；taking...為伴隨動作；where...修飾 Rome，he 指 Palladio。"}, {"id": "stones-paraphrase-7", "mode": "paraphrase", "paragraph": "D", "sentence": "Entrepreneurs, prosperous from agriculture in the Veneto, commissioned the promising local architect to design their country villas and their urban mansions.", "target": "", "options": ["Agriculturally wealthy entrepreneurs hired Palladio to design both country residences and city houses.", "Palladio commissioned the entrepreneurs to design farms for him.", "The patrons hired him only to design urban buildings and no rural residences."], "answer": 0, "explanations": ["commissioned X to design 表委託 Palladio，兩類住宅都包含。", "交換委託人與受託人。", "country villas 與 urban mansions 並列，不能刪掉前者。"], "tag": "長難句理解", "structure": "Entrepreneurs 是主詞；prosperous from...為形容補充；commissioned 是動詞；the architect 為受詞；to design...為委託工作，their 指委託人的住宅。"}, {"id": "stones-paraphrase-8", "mode": "paraphrase", "paragraph": "D", "sentence": "In Venice the aristocracy were anxious to co-opt talented artists, and Palladio was given the chance to design the buildings that have made him famous-the churches of San Giorgio Maggiore and the Redentore, both easy to admire because they can be seen from the city’s historical centre across a stretch of water.", "target": "", "options": ["Two of the churches that established his reputation can readily be viewed across the water from the historic centre.", "His churches cannot be seen from the city's historic centre.", "The phrase both refers to the architect and the aristocracy rather than the churches."], "answer": 0, "explanations": ["both 指列舉的兩座教堂；because 解釋容易觀賞的原因。", "can be seen 與不能看見相反。", "both 的最近且合理複數指涉為兩座教堂。"], "tag": "長難句理解", "structure": "Palladio was given the chance...為被動；buildings that...含關係子句；破折號列舉兩座教堂；both easy...補充；because they can be seen...為原因。"}, {"id": "stones-paraphrase-9", "mode": "paraphrase", "paragraph": "E", "sentence": "He tried his hand at bridges-his unbuilt version of the Rialto Bridge was decorated with the large pediment and columns of a temple and, after a fire at the Ducal Palace, he offered an alternative design which bears an uncanny resemblance to the Banqueting House in Whitehall in London.", "target": "", "options": ["Palladio's alternative palace design closely resembles a London building.", "The sentence says his Rialto Bridge design was built exactly as drawn.", "The sentence says the two palace designs share no similarities."], "answer": 0, "explanations": ["which bears...修飾 alternative design，不是說未建橋方案已落成。", "unbuilt 明確表示橋設計未建，不能改成建成。", "uncanny resemblance 強調驚人相似，不是無相似。"], "tag": "長難句理解", "structure": "He tried his hand...為開頭主句；破折號後補述橋案；and after a fire...連接另一設計；which...修飾 alternative design；to the Banqueting House 為相似對象。"}, {"id": "stones-paraphrase-10", "mode": "paraphrase", "paragraph": "E", "sentence": "Since it was designed by Inigo Jones, Palladio's first foreign disciple, this is not as surprising as it sounds.", "target": "", "options": ["The similarity is less surprising because the London building was designed by a follower of Palladio.", "The similarity proves that Palladio personally designed the London building.", "The sentence treats Since as the date when construction began."], "answer": 0, "explanations": ["Since 表原因；it 指倫敦 Banqueting House；Jones 是 Palladio 追隨者。", "原句設計者是 Inigo Jones，不是 Palladio 本人。", "此處 since 後解釋原因，沒有開始日期。"], "tag": "長難句理解", "structure": "Since it was designed...為原因子句；Palladio's first foreign disciple 同位修飾 Jones；this is not as surprising...主句；this 指兩案相似的情況。"}, {"id": "stones-paraphrase-11", "mode": "paraphrase", "paragraph": "F", "sentence": "Jones, who visited Italy in 1614, bought a trunk full of the master’s architectural drawings; they passed through the hands of the Dukes of Burlington and Devonshire before settling at the Royal Institute of British Architects in 1894.", "target": "", "options": ["The drawings changed hands before eventually entering the institute's collection in 1894.", "The drawings remained with Jones and were never held by anyone else.", "The institute created the drawings in 1894 after buying empty paper."], "answer": 0, "explanations": ["they 指 drawings；passed through the hands 表歷任持有者。", "原句明列其後兩位持有人及最終機構。", "1894 是收藏流轉時點，不是創作年。"], "tag": "長難句理解", "structure": "Jones...bought...為第一主句；who visited...補背景；分號後 they passed...為第二主句；before settling...省略與主句相同主體 drawings。"}, {"id": "stones-paraphrase-12", "mode": "paraphrase", "paragraph": "F", "sentence": "What they show is how Palladio drew on the buildings of ancient Rome as models.", "target": "", "options": ["The drawings reveal Palladio's use of ancient Roman buildings as design models.", "The drawings show that Palladio had no knowledge of Roman architecture.", "The sentence describes images he physically painted onto Roman buildings."], "answer": 0, "explanations": ["What they show is how...強調圖稿揭露的借鑑方法。", "drew on 明確表示借鑑，非全然不知。", "drew on 在此不是畫在建物表面。"], "tag": "長難句理解", "structure": "What they show 是主詞子句，they 指 drawings；is how...為表語；Palladio drew on...為 how 子句主幹；as models 說明古建築的用途。"}, {"id": "stones-paraphrase-13", "mode": "paraphrase", "paragraph": "G", "sentence": "Palladio's work for rich landowners alienates unreconstructed critics on the Italian left, but among the papers in the show are designs for cheap housing in Venice.", "target": "", "options": ["Although his wealthy clients alienate some critics, the exhibition also contains his inexpensive housing designs.", "Every design in the exhibition was solely for rich landowners.", "The writer says all critics approve of his work because it was only for the poor."], "answer": 0, "explanations": ["but 對照批評與廉價住宅設計的存在，不能只留富人委託一側。", "among...are designs for cheap housing 否定全部僅為富人。", "alienates critics 與全體認可相反，也誤說只為窮人。"], "tag": "長難句理解", "structure": "Palladio's work...alienates...為第一主句；but 後 among the papers...置前，are designs...為倒裝；for cheap housing 指設計用途。"}, {"id": "stones-paraphrase-14", "mode": "paraphrase", "paragraph": "G", "sentence": "In the wider world, Palladio's reputation has been nurtured by a text he wrote and illustrated, “Quattro Libri dell’Architettura”.", "target": "", "options": ["His illustrated writing helped sustain his international reputation.", "His reputation depended exclusively on buildings and never on written work.", "The text mentioned was written by a critic to discredit him."], "answer": 0, "explanations": ["has been nurtured by a text 說明著作的助力；he wrote and illustrated 指他本人。", "原句明確提文字助力，不能排除。", "著作是他寫繪的，作用是培養聲譽而非抹黑。"], "tag": "長難句理解", "structure": "In the wider world 提示範圍；reputation has been nurtured 為被動主幹；by a text 指作用來源；he wrote and illustrated 為省略 that 的關係子句。"}, {"id": "stones-paraphrase-15", "mode": "paraphrase", "paragraph": "H", "sentence": "This is an uncompromising exhibition; many of the drawings are small and faint, and there are no sideshows for children, but the impact of harmonious lines and satisfying proportions is to impart to a viewer a feeling of benevolent calm.", "target": "", "options": ["Despite small faint drawings and no children's attractions, the reviewer finds a calming effect in the harmonious design.", "The reviewer says the exhibition is worthless because every drawing is difficult to see.", "The reviewer describes a show designed mainly around children's entertainment."], "answer": 0, "explanations": ["but 轉向整體的正面感受；無兒童附加活動不等於展覽無價值。", "刪去後半正面評價，誇大成全盤否定。", "no sideshows for children 不能改成以兒童娛樂為主。"], "tag": "長難句理解", "structure": "分號後先列 drawings...與 no sideshows...；but the impact...is to impart...為轉折主幹；harmonious lines 與 satisfying proportions 為作用來源，feeling of...為效果。"}, {"id": "stones-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "The exhibition is held in a building which has been redecorated lately.", "target": "redecorated", "options": ["重新裝飾的", "首次建造的", "完全拆除的"], "answer": 0, "explanations": ["redecorate 是再次裝飾，re-表再度。此處練習題目用語，不表示整句符合原文。", "首次興建不是重新裝飾", "拆除是 demolish"], "tag": "題目字彙", "source": "Question 1 · 題目用語"}, {"id": "stones-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Palazzo Barbaran da Porto reflects Palladio's design.", "target": "reflects", "options": ["反映、體現", "照鏡子看見", "反射全部聲音"], "answer": 0, "explanations": ["建築 reflects design 指呈現設計特色。此處練習題目用語，不表示整句符合原文。", "不是照鏡動作", "非聲學反射"], "tag": "題目字彙", "source": "Question 2 · 題目用語"}, {"id": "stones-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Palladio's alternative design for the Ducal Palace is similar to the Banqueting House.", "target": "alternative design", "options": ["替代設計方案", "唯一已落成建築", "無關的舊照片"], "answer": 0, "explanations": ["alternative 是另一可選方案。此處練習題目用語，不表示整句符合原文。", "設計不保證已建成", "不是照片"], "tag": "題目字彙", "source": "Question 5 · 題目用語"}, {"id": "stones-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Who covered the fee for Palladio's architectural studies?", "target": "covered the fee", "options": ["支付費用", "把帳單遮住", "拒絕付款"], "answer": 0, "explanations": ["cover a fee 指負擔費用。此處練習題目用語，不表示整句符合原文。", "不是字面覆蓋", "與拒付不同"], "tag": "題目字彙", "source": "Question 9 · 題目用語"}, {"id": "stones-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "Who was the first foreign student influenced by Palladio?", "target": "foreign student", "options": ["來自其他國家的學生", "只研究外語的學生", "出生於同一城市的人"], "answer": 0, "explanations": ["原題 non-domestic student 已修為自然的 foreign student。此處練習題目用語，不表示整句符合原文。", "foreign 不等於專修外語", "外國學生不等於本地居民"], "tag": "題目字彙", "source": "Question 10 · 題目用語"}, {"id": "stones-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "What kind of ancient Roman buildings affected Palladio's work deeply?", "target": "affected", "options": ["影響", "刻意模仿他", "支付報酬給他"], "answer": 0, "explanations": ["affected his work 是對作品產生影響。此處練習題目用語，不表示整句符合原文。", "句中主詞是古建築，非模仿者", "不是付款"], "tag": "題目字彙", "source": "Question 11 · 題目用語"}, {"id": "stones-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "What text strengthened Palladio's reputation?", "target": "strengthened", "options": ["鞏固、增強", "徹底消除", "僅僅記錄"], "answer": 0, "explanations": ["strengthen reputation 指提升穩固程度。此處練習題目用語，不表示整句符合原文。", "消除與增強相反", "記錄不等於強化"], "tag": "題目字彙", "source": "Question 12 · 題目用語"}, {"id": "stones-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "What text strengthened Palladio's reputation?", "target": "reputation", "options": ["聲譽", "固定工資", "法律姓名"], "answer": 0, "explanations": ["reputation 是外界對他的評價。此處練習題目用語，不表示整句符合原文。", "不是薪資", "不是姓名"], "tag": "題目字彙", "source": "Question 12 · 題目用語"}]}, {"id": "origins-weather", "title": "The Origins of Weather Forecasting", "sourceTitle": "The Origins of Weather Forecasting", "subtitle": "", "part": 1, "topic": "氣象預報的起源與公共反應", "sourceNote": "依原文歷史敘述練習；today、recent years 及 so far 等時間詞以原文寫作時點為準。", "paragraphs": [{"label": "A", "text": "The pioneering forecast on August 1, 1861, was introduced with a deceptively simple heading: ‘General weather probable during next two days.’ But those few words started an ongoing controversy that still continues today - after all, everyone remembers the forecasts that go wrong, but rarely the ones that are right."}, {"label": "B", "text": "The first forecast was the idea of Admiral Robert FitzRoy, head of the newly founded Meteorological Department, and one of Britain's greatest but least-known heroes. It was a brave undertaking, because in those days predicting the weather had gained a reputation similar to astrology or fortune-telling. The few people who attempted it had become a national joke when their forecasts inevitably went wrong."}, {"label": "C", "text": "FitzRoy was different, though. His background was faultless, most famously his captaining of the ship HMS Beagle on Charles Darwin's voyage around the world, which eventually led to the publication of Darwin's well-known book On the Origin of Species. When FitzRoy retired from active service as an admiral in Britain's navy, he was looking for a new direction. He subsequently secured a job as chief statistician at the Meteorological Department, part of the Board of Trade. Parliament had voted to set up and fund the Meteorological Department on June 30, 1854, to chart the safest sailing routes across the Atlantic Ocean. However, the British Government was not impressed with the idea of collecting weather reports and establishing a weather forecast, and the suggestion by one Member of Parliament for this was met with laughter from the other MPs."}, {"label": "D", "text": "FitzRoy was given a staff of three clerks in a small office in London, but he soon grew bored with the tedium of transcribing thousands of ships’ reports. Instead, he focused on a much more pressing issue - the huge loss of life at sea from storms. This problem came to a head in 1859, when gale-force winds sank the ship named Royal Charter, with the loss of 430 lives, within sight of the shore. Even in those days when ships regularly sank in storms, the loss of the Royal Charter was considered a national tragedy. FitzRoy stirred up feelings even further when he wrote a letter to The Times newspaper explaining that the storm had been entirely predictable."}, {"label": "E", "text": "That same year, a total of 1,645 lives were lost off the British coast, and FitzRoy wrote repeatedly to The Times pushing for a storm-warning service for shipping. This was just the right moment for a national forecasting service. Knowledge of the weather was improving, barometer readings gave warning of approaching storms, and the invention of the electric telegraph and Morse code in 1844 gave instant communication for the first time."}, {"label": "F", "text": "So in February 1861, FitzRoy pressed ahead with a storm-warning service. Previously, weather reports had been unreliable, but FitzRoy's innovation was to issue ships with standardised instruments which allowed for accurate weather reports. At exactly the same time each day the information was sent to him by telegraph, and he was able to draw up more detailed weather maps. The approach of an incoming storm could be recognised, and from London, FitzRoy could telegraph warnings to ports on the coast, where an ingenious system of flags was hoisted up high for passing ships to read. This represented the biggest advance in shipping safety after the introduction of the lifeboat, and in subsequent years the number of lives lost around Britain fell by about a third. FitzRoy became a hero to the fishing and maritime fleets."}, {"label": "G", "text": "Encouraged by his storm-warning success, FitzRoy then started a public weather forecasting service. As he had a close connection with The Times, this newspaper introduced his daily forecast in August 1861. It attracted huge attention, including from Queen Victoria, who regularly sent messengers to FitzRoy’s office to get a forecast for the sea crossing over the Solent to an island which she liked to visit off the south coast of England. He was also popular with ordinary fishermen, who were happy not to be out at sea in bad weather. The owners of fishing vessels, however, were not supportive of FitzRoy's forecasts, which often caused delays for them when bad weather was forecast."}, {"label": "H", "text": "Nevertheless, weather forecasting at that time was very difficult, and one mistake could result in much bad publicity. It wasn’t long before some forecasts turned out wrong, and the letters pages of The Times were full of heated correspondence. It is indisputable that FitzRoy was way ahead of his time, but it is only in recent years that he has been recognised as a towering figure in meteorology, with the honour of an area of sea being given his name in the shipping forecast (a radio broadcast of weather reports for the seas around Britain). His extraordinary determination to get forecasting established cost him dearly though, and he died prematurely. But his legacy lives on, because late in his life he published a book about weather forecasting which was recognised by other scientists to be well ahead of its time."}], "questions": [{"id": "weather-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "The pioneering forecast on August 1, 1861, was introduced with a deceptively simple heading: ‘General weather probable during next two days.’", "target": "pioneering", "options": ["being among the first to introduce something", "imitating a long-established practice", "intended only for private use"], "answer": 0, "explanations": ["此處 pioneering 表示「開創性的」。須依原句語境理解。", "這個選項表示「模仿長久慣例的」；原句要表達的是「開創性的」。", "這個選項表示「僅供私人使用的」；原句要表達的是「開創性的」。"], "tag": "字彙與語境義"}, {"id": "weather-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "The pioneering forecast on August 1, 1861, was introduced with a deceptively simple heading: ‘General weather probable during next two days.’", "target": "deceptively simple", "options": ["appearing simpler than it really is", "deliberately false in every detail", "genuinely effortless in all respects"], "answer": 0, "explanations": ["此處 deceptively simple 表示「看似簡單但實則不然」。須依原句語境理解。", "這個選項表示「每個細節都刻意造假」；原句要表達的是「看似簡單但實則不然」。", "這個選項表示「各方面都確實不費力」；原句要表達的是「看似簡單但實則不然」。"], "tag": "搭配與語境義"}, {"id": "weather-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "But those few words started an ongoing controversy that still continues today - after all, everyone remembers the forecasts that go wrong, but rarely the ones that are right.", "target": "ongoing controversy", "options": ["a continuing issue of public disagreement", "a settled point of agreement", "a brief weather event"], "answer": 0, "explanations": ["此處 ongoing controversy ing any trace"], "answer": 0, "explanations": ["此處 prematurely 表示「過早地」。須依原句語境理解。", "這個選項表示「在異常長的延誤之後」；原句要表達的是「過早地」。", "這個選項表示「不留痕跡地」；原句要表達的是「過早地」。"], "tag": "字彙與語境義"}, {"id": "weather-vocab-45", "mode": "vocab", "paragraph": "H", "sentence": "But his legacy lives on, because late in his life he published a book about weather forecasting which was recognised by other scientists to be well ahead of its time.", "target": "legacy lives on", "options": ["lasting influence continues after death", "all his money has been spent", "his predictions are all correct forever"], "answer": 0, "explanations": ["此處 legacy lives on 表示「遺澤、影響持續存在」。須依原句語境理解。", "這個選項表示「他的錢已全花完」；原句要表達的是「遺澤、影響持續存在」。", "這個選項表示「他的預測永遠全對」；原句要表達的是「遺澤、影響持續存在」。"], "tag": "搭配與語境義"}, {"id": "weather-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "But those few words started an ongoing controversy that still continues today - after all, everyone remembers the forecasts that go wrong, but rarely the ones that are right.", "target": "", "options": ["The simple introductory words launched a debate that continued to the article's present.", "The words brought all debate about forecasting to a permanent end.", "The writer says accurate forecasts are remembered more readily than failed ones."], "answer": 0, "explanations": ["ongoing controversy 表持續爭議；after all 後強調人易記失準預報。", "started...controversy 不等於終止爭議。", "後半是易記錯誤、少記正確，不能交換。"], "tag": "長難句理解", "structure": "But those few words 是主詞；that still continues 修飾 controversy；破折號後 after all 提供理由；the ones that are right 中 ones 指 forecasts。"}, {"id": "weather-paraphrase-2", "mode": "paraphrase", "paragraph": "B", "sentence": "It was a brave undertaking, because in those days predicting the weather had gained a reputation similar to astrology or fortune-telling.", "target": "", "options": ["Launching the forecast was courageous because forecasting was then treated as scarcely more credible than fortune-telling.", "Forecasting was universally respected as an established science when the service began.", "The phrase means FitzRoy was merely frightened of travelling by ship."], "answer": 0, "explanations": ["because 說明勇氣來自面對不佳公信力的風險。", "similar to astrology or fortune-telling 顯示負面聲譽，不是普遍尊敬。", "undertaking 是這項事業，不是航行恐懼。"], "tag": "長難句理解", "structure": "It was a brave undertaking 為主幹；because 引原因；predicting the weather 是動名詞主詞；had gained 為更早形成的聲譽。"}, {"id": "weather-paraphrase-3", "mode": "paraphrase", "paragraph": "C", "sentence": "His background was faultless, most famously his captaining of the ship HMS Beagle on Charles Darwin's voyage around the world, which eventually led to the publication of Darwin's well-known book On the Origin of Species.", "target": "", "options": ["FitzRoy's distinguished background included captaining the Beagle on Darwin's voyage, which later contributed to the book's publication.", "FitzRoy wrote On the Origin of Species before captaining the Beagle.", "The book caused Darwin to undertake a voyage with a captain who had no experience."], "answer": 0, "explanations": ["which 回指航行經歷及相關前文，不把書作者換成 FitzRoy。", "原句明說 Darwin's book，且 eventually 表後來。", "倒置航行與出版關係，並加入無經驗。"], "tag": "長難句理解", "structure": "His background was faultless 為主幹；most famously...補充資歷；on Darwin's voyage 說明航行背景；which eventually led...為非限定關係子句。"}, {"id": "weather-paraphrase-4", "mode": "paraphrase", "paragraph": "C", "sentence": "When FitzRoy retired from active service as an admiral in Britain's navy, he was looking for a new direction.", "target": "", "options": ["On retiring from naval service, FitzRoy sought a different professional direction.", "FitzRoy retired from weather forecasting before starting his first naval career.", "The sentence says he had no plans after retirement and refused new work."], "answer": 0, "explanations": ["When 子句時間點是離開海軍，主句 looking for new direction。", "交換海軍與氣象職涯先後。", "looking for new direction 不表示拒絕新工作。"], "tag": "長難句理解", "structure": "When FitzRoy retired...為時間子句；as an admiral 說明當時職位；he was looking...為主句；for a new direction 為求職轉向的比喻。"}, {"id": "weather-paraphrase-5", "mode": "paraphrase", "paragraph": "C", "sentence": "However, the British Government was not impressed with the idea of collecting weather reports and establishing a weather forecast, and the suggestion by one Member of Parliament for this was met with laughter from the other MPs.", "target": "", "options": ["Although the department received public funding, the proposal for collecting reports and producing forecasts met government scepticism.", "Parliament's funding decision meant every member enthusiastically supported public forecasts.", "The department received no funding because everyone refused all maritime safety work."], "answer": 0, "explanations": ["本文區別建部繪航線的支持與預報建議遭嘲笑。", "不能把一種用途的撥款推成所有人支持另一用途。", "前文 had voted to...fund 明確存在撥款。"], "tag": "長難句理解", "structure": "However 表與前述建部撥款對比；was not impressed...為第一分句；and the suggestion...was met...為第二被動句；by one Member 修飾 suggestion，非執行嘲笑者。"}, {"id": "weather-paraphrase-6", "mode": "paraphrase", "paragraph": "D", "sentence": "Instead, he focused on a much more pressing issue - the huge loss of life at sea from storms.", "target": "", "options": ["FitzRoy shifted attention from tedious copying to the urgent problem of deaths in sea storms.", "FitzRoy regarded copying reports as more urgent than preventing loss of life.", "The sentence says he stopped caring about maritime safety to become a journalist."], "answer": 0, "explanations": ["Instead 表轉向；much more pressing issue 的內容在破折號後。", "更迫切的是海上死亡，不能反過來。", "a letter 是後文行動，此句不是轉職新聞業。"], "tag": "長難句理解", "structure": "Instead 為承接轉折；he focused on...為主幹；破折號同位說明 issue；the huge loss of life 的 from storms 表原因。"}, {"id": "weather-paraphrase-7", "mode": "paraphrase", "paragraph": "D", "sentence": "This problem came to a head in 1859, when gale-force winds sank the ship named Royal Charter, with the loss of 430 lives, within sight of the shore.", "target": "", "options": ["The Royal Charter disaster brought the existing problem to a critical point, with hundreds dying close to shore.", "The ship's loss was the first time any ship had ever sunk in a storm.", "The problem was fully solved when the ship safely reached the shore."], "answer": 0, "explanations": ["came to a head 指舊問題達高峰，不是首次出現或已解決。", "前文已有海難問題，後文亦說當時常沉船。", "sank 與 loss of lives 不能改成安全抵岸。"], "tag": "長難句理解", "structure": "This problem came to a head 為主幹；when...sank...為關係時間補充；with the loss...補充結果；within sight of shore 說明即在看得到岸的距離。"}, {"id": "weather-paraphrase-8", "mode": "paraphrase", "paragraph": "E", "sentence": "That same year, a total of 1,645 lives were lost off the British coast, and FitzRoy wrote repeatedly to The Times pushing for a storm-warning service for shipping.", "target": "", "options": ["After the year's heavy losses, FitzRoy repeatedly urged a storm-warning service for shipping.", "He urged an end to all communication with shipping after one minor incident.", "He merely recorded deaths without advocating any new service."], "answer": 0, "explanations": ["wrote repeatedly...pushing for 表反覆倡議。", "總死亡與倡設服務被改成小事件及終止通訊。", "分詞 pushing 明確表示推動，不只是紀錄。"], "tag": "長難句理解", "structure": "a total...were lost 與 FitzRoy wrote...為並列主句；That same year 回指前述1859；pushing for...分詞修飾主詞 FitzRoy 的寫信目的與行動。"}, {"id": "weather-paraphrase-9", "mode": "paraphrase", "paragraph": "E", "sentence": "Knowledge of the weather was improving, barometer readings gave warning of approaching storms, and the invention of the electric telegraph and Morse code in 1844 gave instant communication for the first time.", "target": "", "options": ["Better knowledge, pressure measurements and rapid telegraph communication made conditions favourable for forecasting.", "The sentence says telegraphs alone provided every kind of meteorological knowledge.", "Weather knowledge had deteriorated so much that communication became impossible."], "answer": 0, "explanations": ["三項並列因素共同支持前句 right moment，不能獨取一項作全部原因。", "通訊不等同氣象知識與氣壓量測。", "improving 與 instant communication 皆非惡化不通。"], "tag": "長難句理解", "structure": "Knowledge...was improving、readings gave warning、invention...gave communication 為三個並列分句；approaching 修飾 storms，for the first time 表歷史時點。"}, {"id": "weather-paraphrase-10", "mode": "paraphrase", "paragraph": "F", "sentence": "Previously, weather reports had been unreliable, but FitzRoy's innovation was to issue ships with standardised instruments which allowed for accurate weather reports.", "target": "", "options": ["FitzRoy addressed unreliable reports by providing ships with consistent measuring equipment.", "He improved reliability by allowing every ship to use any arbitrary instrument.", "He replaced all measurement instruments with guesses based on personal intuition."], "answer": 0, "explanations": ["but 引創新；which allowed...說明標準化儀器的用途。", "standardised 不等於任意選擇。", "instruments 明確是測量器材，不是改用直覺。"], "tag": "長難句理解", "structure": "Previously...had been...先交代舊狀態；but innovation was to issue...為主幹；issue ships with...是配發結構；which 修飾 instruments。"}, {"id": "weather-paraphrase-11", "mode": "paraphrase", "paragraph": "F", "sentence": "At exactly the same time each day the information was sent to him by telegraph, and he was able to draw up more detailed weather maps.", "target": "", "options": ["Reports were sent at a common daily time, enabling FitzRoy to prepare more detailed maps.", "Reports arrived only once a year at different times chosen by each ship.", "FitzRoy sent maps before obtaining any information from the ships."], "answer": 0, "explanations": ["exactly the same time each day 與後續 draw up maps 建立蒐集與製圖順序。", "each day 不是每年，same time 不是各自隨意。", "先取得資料再能製圖，不是沒資料先製。"], "tag": "長難句理解", "structure": "At...為時間語；information was sent...為被動；and he was able...為結果相連分句；by telegraph 表傳送媒介。"}, {"id": "weather-paraphrase-12", "mode": "paraphrase", "paragraph": "F", "sentence": "The approach of an incoming storm could be recognised, and from London, FitzRoy could telegraph warnings to ports on the coast, where an ingenious system of flags was hoisted up high for passing ships to read.", "target": "", "options": ["Recognising an approaching storm enabled warnings to reach coastal ports, where raised flags signalled passing ships.", "The flags were hidden indoors so that passing ships could not read them.", "FitzRoy personally travelled to every ship to deliver each warning."], "answer": 0, "explanations": ["where 指 ports；hoisted up high 表以可見旗號傳給過船。", "升高供讀與藏室內相反。", "could telegraph warnings 表遠距傳訊，非親赴每船。"], "tag": "長難句理解", "structure": "The approach...could be recognised 為被動；and...could telegraph...為並列主句；where...was hoisted...修飾 ports；for ships to read 表目的。"}, {"id": "weather-paraphrase-13", "mode": "paraphrase", "paragraph": "G", "sentence": "As he had a close connection with The Times, this newspaper introduced his daily forecast in August 1861.", "target": "", "options": ["The Times carried daily forecasts because FitzRoy had a close connection with the newspaper.", "The newspaper began publishing forecasts despite having no connection with FitzRoy.", "The Times established his connection only after rejecting every forecast."], "answer": 0, "explanations": ["As 表因果背景；this newspaper 指 The Times。", "原句明說 close connection，不是毫無關聯。", "introduced daily forecast 不是拒絕，且因果被倒置。"], "tag": "長難句理解", "structure": "As he had...為原因子句；this newspaper introduced...為主句；his 指 FitzRoy；in August 1861 為刊登時點。"}, {"id": "weather-paraphrase-14", "mode": "paraphrase", "paragraph": "G", "sentence": "The owners of fishing vessels, however, were not supportive of FitzRoy's forecasts, which often caused delays for them when bad weather was forecast.", "target": "", "options": ["Fishing-boat owners opposed forecasts that could delay activity, unlike fishermen who welcomed avoiding dangerous weather.", "Boat owners and ordinary fishermen are described as equally supportive.", "The forecasts were unpopular with fishermen because they preferred sailing in dangerous weather."], "answer": 0, "explanations": ["however 對照兩群人的利益與態度。", "忽略 not supportive，抹平差異。", "happy not to be out...表示樂於避險，不是偏好危險。"], "tag": "長難句理解", "structure": "The owners...were not supportive 為主幹；however 插入對比；which often caused...修飾 forecasts；when bad weather was forecast 限定產生延誤情況。"}, {"id": "weather-paraphrase-15", "mode": "paraphrase", "paragraph": "H", "sentence": "It is indisputable that FitzRoy was way ahead of his time, but it is only in recent years that he has been recognised as a towering figure in meteorology, with the honour of an area of sea being given his name in the shipping forecast (a radio broadcast of weather reports for the seas around Britain).", "target": "", "options": ["The writer sees FitzRoy as exceptionally forward-thinking but says recognition came much later.", "The writer says FitzRoy's importance was fully recognised by everyone throughout his life.", "Naming a sea area after him proves every one of his forecasts was accurate."], "answer": 0, "explanations": ["only in recent years 限制認可時點；榮譽不等於每次預測正確。", "將延後認可改成生前全體認可。", "紀念命名與每項預測正確不是同一命題。"], "tag": "長難句理解", "structure": "It is indisputable that...為虛主詞結構；but it is only...that...為強調句；with the honour of...補充認可形式；being given his name 是被動動名詞。"}, {"id": "weather-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "FitzRoy faced competition from other applicants for the chief statistician's job.", "target": "applicants", "options": ["申請者", "已全數錄取的職員", "旁觀的旅客"], "answer": 0, "explanations": ["applicants 是提出求職申請的人。此處練習題目用語，不表示整句符合原文。", "申請不等於錄取", "不是旅客"], "tag": "題目字彙", "source": "Question 3 · 題目用語"}, {"id": "weather-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "FitzRoy faced competition from other applicants for the chief statistician's job.", "target": "chief statistician", "options": ["首席統計專員", "船上總廚", "海軍最低階水手"], "answer": 0, "explanations": ["chief 表主管層級，statistician 為統計專業。此處練習題目用語，不表示整句符合原文。", "不是廚師", "不是水手"], "tag": "題目字彙", "source": "Question 3 · 題目用語"}, {"id": "weather-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Progress in technology made it a good time for publicly available weather forecasting to begin.", "target": "publicly available", "options": ["公眾可取得的", "僅限機密內部使用的", "已永久停止供應的"], "answer": 0, "explanations": ["指預報開放公眾接收。此處練習題目用語，不表示整句符合原文。", "公開與機密對立", "可取得不等於停供"], "tag": "題目字彙", "source": "Question 5 · 題目用語"}, {"id": "weather-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Simultaneous weather reports were taken daily.", "target": "Simultaneous", "options": ["同時進行的", "每年才一次的", "互不相關的"], "answer": 0, "explanations": ["simultaneous 指同一時間。此處練習題目用語，不表示整句符合原文。", "不是年度頻率", "同時不代表有無關聯"], "tag": "題目字彙", "source": "Question 6–13 · 題目用語"}, {"id": "weather-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "Storm warnings were telegraphed to ports along the shore.", "target": "telegraphed", "options": ["用電報傳送的", "由船親自運送的", "只在報上刊登的"], "answer": 0, "explanations": ["telegraph 可作動詞指發電報。此處練習題目用語，不表示整句符合原文。", "不是船運", "不是僅報紙刊載"], "tag": "題目字彙", "source": "Question 6–13 · 題目用語"}, {"id": "weather-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "Signals for ships were displayed using raised flags.", "target": "displayed", "options": ["展示、使可見", "刻意隱藏", "完全取消"], "answer": 0, "explanations": ["signals displayed 指旗號被呈現供看見。此處練習題目用語，不表示整句符合原文。", "隱藏與展示相反", "呈現不是取消"], "tag": "題目字彙", "source": "Question 6–13 · 題目用語"}, {"id": "weather-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "In modern times FitzRoy's name is used for a marine area.", "target": "marine", "options": ["海洋的", "高山的", "內陸農田的"], "answer": 0, "explanations": ["marine area 指海域。此處練習題目用語，不表示整句符合原文。", "不是山區", "不是農田"], "tag": "題目字彙", "source": "Question 6–13 · 題目用語"}, {"id": "weather-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "FitzRoy produced a book which was respected by the scientific community.", "target": "scientific community", "options": ["科學界、科學研究群體", "單一地方住宅區", "全部船上乘客"], "answer": 0, "explanations": ["community 此處為共享專業領域的人群。此處練習題目用語，不表示整句符合原文。", "不是居住社區", "不是一般乘客"], "tag": "題目字彙", "source": "Question 6–13 · 題目用語"}]}, {"id": "elephant-communication", "title": "Elephant Communication", "sourceTitle": "Elephant Communication", "subtitle": "", "part": 3, "topic": "地表振動、感官機制與研究推論", "sourceNote": "may、might、suggest 等推測須保留。原文 B 段將錘骨寫在 inner ear，已依耳部解剖修為 middle ear；原圖題若沿用 inner ear 亦有同一問題。", "paragraphs": [{"label": "A", "text": "O’Connell-Rodwell, a post-doctoral fellow at Stanford University, has traveled to Namibia's first-ever wildlife reserve to explore the mystical and complicated realm of elephant communication. She, along with her colleagues, is part of a scientific revolution that started almost 20 years ago. This revolution has made a stunning revelation: elephants are capable of communicating with one another over long distances by means of low-frequency sounds, also known as infrasound, which are too deep for humans to hear."}, {"label": "B", "text": "As might be expected, African elephants’ ability to detect seismic sound may have something to do with their ears. The hammer bone in an elephant's middle ear is proportionally huge for a mammal, but it is normal for animals that use vibrational signals. Thus, it may be a sign that elephants can use seismic sounds to communicate."}, {"label": "C", "text": "Other aspects of elephant anatomy also support this ability. First, their massive bodies, which enable them to give out low-frequency sounds almost as powerful as the sound a jet makes during take-off, serve as ideal frames for receiving ground vibrations and transmitting them to the inner ear. Second, the elephant's toe bones are set in a fatty pad, which might help focus vibrations from the ground into the bone. Finally, the elephant has an enormous brain that sits in the cranial cavity behind the eyes, in line with the auditory canal. The front of the skull is riddled with sinus cavities, which might function as resonating chambers for ground vibrations."}, {"label": "D", "text": "It remains unclear how elephants detect such vibrations, but O’Connell-Rodwell suggests that the pachyderms are ‘listening’ with their trunks and feet instead of (or in addition to) their ears. The elephant trunk may be the most versatile appendage in nature: it is used for drinking, bathing, smelling, feeding and scratching. Both trunk and feet contain two types of nerve endings that are sensitive to pressure—one detects infrasonic vibration and the other responds to vibrations of slightly higher frequencies. As O’Connell-Rodwell sees it, this research has a boundless and unpredictable future. ‘Our work is really at the interface of geophysics, neurophysiology and ecology,’ she says. ‘We're raising questions that have never even been considered before.’"}, {"label": "E", "text": "Scientists have long known that seismic communication is widespread among small animals such as spiders, scorpions, insects and many vertebrates, including white-lipped frogs, blind mole-rats, kangaroo rats and golden moles. Nevertheless, O’Connell-Rodwell was the first to argue that a giant land animal is also sending and receiving seismic signals. ‘I used to lay a male planthopper on a stem and replay the calling sound of a female; the male would exhibit the same kind of behaviour that happens in elephants: he would freeze, press down on his legs, move forward a little, then stay still again. I found it fascinating, and it made me think that perhaps auditory communication is not the only thing going on.’"}, {"label": "F", "text": "Scientists have confirmed that an elephant's capacity to communicate over long distances is essential for survival, especially in places like Etosha, where more than 2,400 savanna elephants range over an area larger than New Jersey. It is already difficult for an elephant to find a mate in such a vast wilderness, and elephant reproductive biology only complicates matters. Breeding herds also adopt low-frequency sounds to warn of predators. Even though adult elephants have no enemies other than human beings, calves are vulnerable and susceptible to attacks from lions and hyenas. At the sight of a predator, older herd members clump together to protect the young before running away."}, {"label": "G", "text": "We now know that elephants can respond to warning calls in the air, but can they detect signals transmitted solely through the ground? To investigate, the research team designed an experiment in 2002 that used electronic devices to send signals through the ground at Mushara. ‘The outcomes of our 2002 study revealed that elephants could indeed sense warning signals through the ground,’ O’Connell-Rodwell observes."}, {"label": "H", "text": "Last year, an experiment was set up to pursue the problem further. It used three different recordings: the 1994 warning call from Mushara, an anti-predator call recorded by scientist Joyce Poole in Kenya, and a made-up warble tone. ‘The data I've observed so far imply that the elephants responded exactly as I expected. However, the fascinating finding is that the anti-predator call from Kenya—unfamiliar to them—caused them to gather, tense up and rumble aggressively as well; but they didn't always flee. I didn't expect the results to be that clear-cut.’"}], "questions": [{"id": "elephants-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "O’Connell-Rodwell, a post-doctoral fellow at Stanford University, has traveled to Namibia's first-ever wildlife reserve to explore the mystical and complicated realm of elephant communication.", "target": "post-doctoral fellow", "options": ["a researcher working after completing a doctorate", "a person studying for a first degree", "a doctor providing only emergency care"], "answer": 0, "explanations": ["此處 post-doctoral fellow 表示「博士後研究員」。須依原句語境理解。", "這個選項表示「修讀第一個學位的人」；原句要表達的是「博士後研究員」。", "這個選項表示「只提供急診照護的醫生」；原句要表達的是「博士後研究員」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-2", "m oportionally huge for a mammal, but it is normal for animals that use vibrational signals.", "target": "mammal", "options": ["a warm-blooded vertebrate group whose females produce milk", "an animal group including all insects", "a plant adapted to dry climates"], "answer": 0, "explanations": ["此處 mammal 表示「哺乳類動物」。須依原句語境理解。", "這個選項表示「包含所有昆蟲的動物群」；原句要表達的是「哺乳類動物」。", "這個選項表示「適應乾燥氣候的植物」；原句要表達的是「哺乳類動物」。"], "tag": "字彙與語境義"}, {"id": "elephants-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "The hammer bone in an elephant's middle ear is proportionally huge for a mammal, but it is normal for animals that use vibrational signals.", "target": "vibrational signals", "options": ["messages carried by physical oscillations", "written symbols on the ground", "changes in daylight alone"], "answer": 0, "explanations": ["此處 vibrational signals 表示「振動訊號」。須依原句語境理解。", "這個選項表示「地上的文字符號」；原句要表達的是「振動訊號」。", "這個選項表示「僅有日光變化」；原句要表達的是「振動訊號」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-11", "mode": "vocab", "paragraph": "C", "sentence": "Other aspects of elephant anatomy also support this ability.", "target": "anatomy", "options": ["the bodily structure of an organism", "the study of social customs only", "a count of animals in a reserve"], "answer": 0, "explanations": ["此處 anatomy 表示「身體解剖構造」。須依原句語境理解。", "這個選項表示「只研究社會風俗」；原句要表達的是「身體解剖構造」。", "這個選項表示「保護區動物數量統計」；原句要表達的是「身體解剖構造」。"], "tag": "字彙與語境義"}, {"id": "elephants-vocab-12", "mode": "vocab", "paragraph": "C", "sentence": "First, their massive bodies, which enable them to give out low-frequency sounds almost as powerful as the sound a jet makes during take-off, serve as ideal frames for receiving ground vibrations and transmitting them to the inner ear.", "target": "transmitting", "options": ["passing or carrying onward", "preventing movement entirely", "converting to an unrelated smell"], "answer": 0, "explanations": ["此處 transmitting 表示「傳遞、傳送」。須依原句語境理解。", "這個選項表示「完全阻止移動」；原句要表達的是「傳遞、傳送」。", "這個選項表示「轉為無關氣味」；原句要表達的是「傳遞、傳送」。"], "tag": "字彙與語境義"}, {"id": "elephants-vocab-13", "mode": "vocab", "paragraph": "C", "sentence": "Second, the elephant's toe bones are set in a fatty pad, which might help focus vibrations from the ground into the bone.", "target": "fatty pad", "options": ["a cushion-like layer of fat tissue", "a hard external shell", "an artificial recording device"], "answer": 0, "explanations": ["此處 fatty pad 表示「脂肪墊」。須依原句語境理解。", "這個選項表示「硬的外殼」；原句要表達的是「脂肪墊」。", "這個選項表示「人造錄音裝置」；原句要表達的是「脂肪墊」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-14", "mode": "vocab", "paragraph": "C", "sentence": "Finally, the elephant has an enormous brain that sits in the cranial cavity behind the eyes, in line with the auditory canal.", "target": "cranial cavity", "options": ["the space inside the skull containing the brain", "the hollow within a leg bone", "the opening of the trunk"], "answer": 0, "explanations": ["此處 cranial cavity 表示「顱腔」。須依原句語境理解。", "這個選項表示「腿骨內的空腔」；原句要表達的是「顱腔」。", "這個選項表示「象鼻開口」；原句要表達的是「顱腔」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-15", "mode": "vocab", "paragraph": "C", "sentence": "Finally, the elephant has an enormous brain that sits in the cranial cavity behind the eyes, in line with the auditory canal.", "target": "auditory canal", "options": ["the passage associated with the ear", "a channel carrying blood", "a river beside the habitat"], "answer": 0, "explanations": ["此處 auditory canal 表示「耳道」。須依原句語境理解。", "這個選項表示「血液流通管道」；原句要表達的是「耳道」。", "這個選項表示「棲地旁河流」；原句要表達的是「耳道」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-16", "mode": "vocab", "paragraph": "C", "sentence": "The front of the skull is riddled with sinus cavities, which might function as resonating chambers for ground vibrations.", "target": "riddled with", "options": ["containing many holes or cavities throughout", "entirely free of", "deliberately repaired with"], "answer": 0, "explanations": ["此處 riddled with 表示「布滿孔洞或空腔」。須依原句語境理解。", "這個選項表示「完全沒有」；原句要表達的是「布滿孔洞或空腔」。", "這個選項表示「刻意用……修補」；原句要表達的是「布滿孔洞或空腔」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-17", "mode": "vocab", "paragraph": "C", "sentence": "The front of the skull is riddled with sinus cavities, which might function as resonating chambers for ground vibrations.", "target": "sinus cavities", "options": ["air-filled spaces in the skull", "solid jaw muscles", "fluid-filled spaces in the feet"], "answer": 0, "explanations": ["此處 sinus cavities 表示「顱骨中的鼻竇空腔」。須依原句語境理解。", "這個選項表示「實心下顎肌肉」；原句要表達的是「顱骨中的鼻竇空腔」。", "這個選項表示「腳部充液空間」；原句要表達的是「顱骨中的鼻竇空腔」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-18", "mode": "vocab", "paragraph": "C", "sentence": "The front of the skull is riddled with sinus cavities, which might function as resonating chambers for ground vibrations.", "target": "resonating chambers", "options": ["spaces that reinforce vibrations at particular frequencies", "compartments that block every vibration", "rooms used to keep animals asleep"], "answer": 0, "explanations": ["此處 resonating chambers 表示「共鳴腔」。須依原句語境理解。", "這個選項表示「阻擋全部振動的隔間」；原句要表達的是「共鳴腔」。", "這個選項表示「使動物睡眠的房間」；原句要表達的是「共鳴腔」。"], "tag": "搭配與語境義"}, {"id": "elephants-vocab-19", "mode": "vocab", "paragraph": "D", "sentence": "It remains unclear how elephants detect such vibrations, but O’Connell-Rodwell suggests that the pachyderms are ‘listening’ with their trunks and feet instead of (or in addition to) their ears.", "target": "pachyderms", "options": ["a traditional term for large thick-skinned mammals such as elephants", "small insects with thin wings", "birds migrating long distances"], "answer": 0, "explanations": ["此處 pachyderms 表示「象等大型厚皮哺乳動物的舊稱」。須依原句語境理解。", "這個選項表示「薄翅小昆蟲」；原句要表達的是「象等大型厚皮哺乳動物的舊稱」。", "這個選項表示「長距離遷徙鳥類」；原句要表達的是「象等大型厚皮哺乳動物的舊稱」。"], "tag": "字彙與語境義"}, {"id": "elephants-vocab-20", "mode": "vocab", "paragraph": "D", "sentence": "The elephant trunk may be the most versatile appendage in nature: it is used for drinking, bathing, smelling, feeding and scratching.", "target": "versatile appendage", "options": ["a body part capable of many different functions", "a body part serving only one purpose"
