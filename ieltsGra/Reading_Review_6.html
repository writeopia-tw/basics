function start(){for(const id of ['shuffle','errors','para','type'])$(id).disabled=!!data.pending;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=!!data.pending);document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});$('paraWrap').classList.toggle('hidden',mode==='questionVocab'||mode==='reading'||!!data.pending);$('typeWrap').classList.toggle('hidden',mode!=='vocab'||!!data.pending);$('jumpWrap').classList.toggle('hidden',mode==='reading'||!!data.pending);queue=shuffled(data.questions.filter(q=>q.mode===mode&&(mode==='questionVocab'||paragraph==='all'||q.paragraph===paragraph)&&(mode!=='vocab'||category==='all'||q.tag===category)&&(!wrongOnly||progress[fingerprint(q)]?.correct===false))).map(q=>({q,order:shuffled([0,1,2]),selected:null}));position=0;render()}
function sourceText(q){let i=q.sentence.indexOf(q.target);return q.target?esc(q.sentence.slice(0,i))+'<mark>'+esc(q.target)+'</mark>'+esc(q.sentence.slice(i+q.target.length)):esc(q.sentence)}
function render(){stats();const card=$('card');if(data.pending){card.innerHTML=`<article class="result"><div class="label">IELTS READING · PART ${data.part}</div><h2>${esc(data.title)}</h2><p>內容待加入</p><p class="minor">這篇已列入目錄。提供文章與題目後，即可加入三種複習練習。</p></article>`;return}if(mode==='reading'){card.innerHTML=`<article class="read"><div class="label">SOURCE TEXT</div><h2>${esc(data.sourceTitle||data.title)}</h2><p class="minor">${esc(data.subtitle)}</p>${data.sourceNote?`<p class="source-note">${esc(data.sourceNote)}</p>`:""}${data.paragraphs.map(p=>`<h3>PARAGRAPH ${esc(p.label)}</h3><p lang="en">${esc(p.text)}</p>`).join('')}</article>`;return}options('jump',queue.map((x,i)=>[String(i),`${i+1} · ${x.q.paragraph||'題目'} · ${x.q.target||x.q.tag}`]),position<queue.length?String(position):'');$('jump').disabled=!queue.length;
if(!queue.length){card.innerHTML=`<div class="result"><div class="label">${wrongOnly?'REVIEW':'PRACTICE'}</div><h2>${wrongOnly?'此範圍目前沒有錯題。':'此範圍沒有題目。'}</h2><p class="minor">可調整範圍或返回全部題目。</p><button id="all" class="primary">顯示全部題目</button></div>`;$('all').onclick=()=>{wrongOnly=false;paragraph='all';category='all';$('para').value='all';$('type').value='all';start()};return}
if(position>=queue.length){const answered=queue.filter(x=>x.selected!==null),good=answered.filter(x=>x.selected===x.q.answer);card.innerHTML=`<div class="result"><div class="label">ROUND COMPLETE</div><h2>這一輪已結束。</h2><p>已作答 ${answered.length} / ${queue.length} 題，其中答對 ${good.length} 題。</p><div class="actions"><button id="roundWrong">重練本輪錯題</button><button class="primary" id="again">重新洗牌練習</button></div></div>`;$('again').onclick=()=>{wrongOnly=false;start()};$('roundWrong').onclick=()=>{queue=shuffled(queue.filter(x=>x.selected!==null&&x.selected!==x.q.answer)).map(x=>({q:x.q,order:shuffled([0,1,2]),selected:null}));wrongOnly=true;position=0;render()};return}
const item=queue[position],q=item.q,done=queue.filter(x=>x.selected!==null).length;card.innerHTML=`<div class="top"><span>${mode==='questionVocab'?esc(q.source):'Paragraph '+esc(q.paragraph)} <span class="tag">${esc(q.tag)}</span></span><span id="roundCount">${wrongOnly?'錯題複習 · ':''}${position+1} / ${queue.length} · 已答 ${done} 題</span></div><progress id="roundProgress" class="progress" value="${done}" max="${queue.length}" aria-label="本輪已答題數"></progress><div class="prompt">${mode==='vocab'?'WHAT DOES THE HIGHLIGHTED EXPRESSION MEAN?':mode==='paraphrase'?'WHICH PARAPHRASE PRESERVES THE ORIGINAL MEANING?':'選出標示字詞在此語境中的中文意思'}</div><p class="sentence" lang="en">${sourceText(q)}</p><div class="answers">${item.order.map((n,i)=>`<button class="answer" data-answer="${n}" lang="${mode==='questionVocab'?'zh-Hant':'en'}"><span class="letter">${'ABC'[i]}</span><span>${esc(q.options[n])}</span></button>`).join('')}</div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="context" class="${mode==='questionVocab'?'hidden':''}">查看所在段落</button><div><button id="previous" ${position===0?'disabled':''}>上一題</button> <button id="next" class="primary" disabled>${position===queue.length-1?'查看本輪結果':'下一題 →'}</button></div></div><div id="contextText" class="context hidden"></div>`;
card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(item.selected!==null)return;item.selected=Number(b.dataset.answer);remember(q,item.selected);showFeedback(item);stats()});$('previous').onclick=()=>{position--;render()};$('next').onclick=()=>{position++;render();$('card').scrollIntoView({behavior:'smooth',block:'start'})};$('context').onclick=()=>{const c=$('contextText');c.classList.toggle('hidden');c.textContent=data.paragraphs.find(p=>p.label===q.paragraph).text;$('context').textContent=c.classList.contains('hidden')?'查看所在段落':'收起段落'};if(item.selected!==null)showFeedback(item)}
function showFeedback(item){const q=item.q,done=queue.filter(x=>x.selected!==null).length;$('roundCount').textContent=(wrongOnly?'錯題複習 · ':'')+(position+1)+' / '+queue.length+' · 已答 '+done+' 題';$('roundProgress').value=done;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const n=Number(b.dataset.answer);b.classList.toggle('correct',n===q.answer);b.classList.toggle('wrong',n===item.selected&&n!==q.answer)});const f=$('feedback');f.classList.remove('hidden');f.innerHTML=`<b>${item.selected===q.answer?'✓ 答對了':'請留意這裡'} · 正確答案 ${'ABC'[item.order.indexOf(q.answer)]}</b>${item.order.map((n,i)=>`<p><b>${'ABC'[i]} ${n===q.answer?'✓':'✕'}</b> ${esc(q.explanations[n])}</p>`).join('')}${q.structure?`<div class="syntax"><b>句構拆解</b><br>${esc(q.structure)}</div>`:''}`;$('next').disabled=false}
function configure(){paragraph='all';category='all';wrongOnly=false;$('title').textContent='Reading Review 6';$('topic').textContent='IELTS READING PRACTICE';$('partLabel').textContent='IELTS READING · PART '+data.part;document.title='Reading Review 6';KEY=keyFor(data);loadProgress();$('status').textContent='';options('para',[['all','全部段落'],...data.paragraphs.map(p=>[p.label,'Paragraph '+p.label])],'all');const tags=[...new Set(data.questions.filter(q=>q.mode==='vocab').map(q=>q.tag))];options('type',[['all','全部類型'],...tags.map(t=>[t,t])],'all');updateCounts();start()}
$('article').replaceChildren(...[1,2,3].filter(part=>bank.some(a=>a.part===part)).map(part=>{const g=document.createElement('optgroup');g.label='IELTS Reading Part '+part;const sorted=bank.filter(a=>a.part===part).sort((a,b)=>a.title.localeCompare(b.title,'en',{sensitivity:'base'}));for(const a of sorted){const o=document.createElement('option');o.value=a.id;o.textContent=a.title+(a.pending?' · 待加入':'');g.appendChild(o)}return g}));$('article').value=data.id;$('article').onchange=e=>{data=bank.find(a=>a.id===e.target.value);configure()};$('para').onchange=e=>{paragraph=e.target.value;start()};$('type').onchange=e=>{category=e.target.value;start()};$('jump').onchange=e=>{position=Number(e.target.value);render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;wrongOnly=false;start()});$('shuffle').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=false;start()};$('errors').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=!wrongOnly;start()};function updateCounts(){$('catalogSummary').textContent='已加入 '+bank.filter(a=>!a.pending).length+' / '+bank.length+' 篇 · 各篇進度分別保留';document.querySelector('.pills').classList.toggle('hidden',!!data.pending);$('countV').textContent=data.questions.filter(q=>q.mode==='vocab').length+' 題關鍵字語義';$('countP').textContent=data.questions.filter(q=>q.mode==='paraphrase').length+' 題長難句改寫';$('countQ').textContent=data.questions.filter(q=>q.mode==='questionVocab').length+' 題題目字彙選中文';}configure();
</script></body></html>
