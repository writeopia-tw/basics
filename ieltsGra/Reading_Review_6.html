ther than poor management.", "target": "misfortune", "options": ["不幸、厄運", "不當管理", "非法獲利"], "answer": 0, "explanations": ["misfortune 指運氣不佳或不幸事件。。此處練習題目用語，不表示整句符合原文。", "題句用 rather than 將其與管理不良對比。", "不是獲利，也不自帶違法意思。"], "tag": "題目字彙", "source": "Question 25 · 題目用語"}, {"id": "managers-questionVocab-13", "mode": "questionVocab", "paragraph": "", "sentence": "Promoting internally is nearly always more effective than bringing in stars from outside.", "target": "Promoting internally", "options": ["從組織內部拔擢晉升", "在公司內部宣傳產品", "將公司遷入室內"], "answer": 0, "explanations": ["promote 在人事語境是晉升，internally 指內部。。此處練習題目用語，不表示整句符合原文。", "不是 promote products 的推廣商品義。", "不是搬遷辦公場所。"], "tag": "題目字彙", "source": "Question 26 · 題目用語"}, {"id": "managers-questionVocab-14", "mode": "questionVocab", "paragraph": "", "sentence": "Promoting internally is nearly always more effective than bringing in stars from outside.", "target": "bringing in stars", "options": ["延攬外部明星人才", "讓員工觀看星空", "將員工提升到最高職位"], "answer": 0, "explanations": ["stars 是出眾人才，bring in 是引進。。此處練習題目用語，不表示整句符合原文。", "不是天文星體。", "外部延攬與內部晉升不同。"], "tag": "題目字彙", "source": "Question 26 · 題目用語"}]}, {"id": "contradictions-tourism", "title": "The contradictions of tourism", "sourceTitle": "The contradictions of tourism", "subtitle": "", "part": 3, "topic": "觀光、文化商品化與環境經濟取捨", "sourceNote": "作者對觀光與生態旅遊的評價是本文論點；can、may、not always 均保留限縮，不能推成所有國家、所有旅客皆如此。D 段修正 framing and staging 的主謂一致。", "paragraphs": [{"label": "A", "text": "International tourism presents itself as straightforward, passive and benign, yet it is complex, interesting and important, full of contradictions and depths. It has enormous growth potential; almost every country desires an expansion in this sector. Yet whether and how to grow is not nearly as straightforward as one might hope."}, {"label": "B", "text": "Tourism can provide the ideal export for developing countries, which can capitalize on their unique cultures and natural environments. However, to do this they need to have features such as airports, hotels, sanitation facilities, roads and medical facilities. A government can build these itself, using revenue from local taxes or getting finance from foreign lenders. Alternatively, the government may attract foreign investment, allowing others to pay for the building, thus relieving itself of providing capital but forgoing profits."}, {"label": "C", "text": "Tourism is, however, a risky investment. It can gradually decline as a resort becomes seen as outdated, or it can be destroyed overnight by a single hurricane, or a political emergency. Even when successful, countries and localities are faced with a dilemma: keep it within limits, or extend its benefits but also deepen dependence on a single, fickle industry."}, {"label": "D", "text": "By definition, tourists travel to see and knowingly to encounter the different, the original, the authentic. In this increasingly global world, what they want is regional and unique. But only through artifice can the tourist demand for authenticity be met. An event such as a festival or ceremony needs to be brought to their attention and its importance and unique nature elaborated to them. Natural sites, too, need to be presented if they are to be regarded as noteworthy; gates, permits, and notices are required to set them apart from the mundane. Complicated framing and staging allow tourists to recognize, by sight, \"the actual thing\"."}, {"label": "E", "text": "Tourism places a premium on the parts of a culture that are visible, such as handicrafts and costume, and disregards those that are not, like the rules governing seating on a bus, attitudes to the elderly, or appropriate ways of addressing family members; in this way, tourism favours what can be commodified. Yet commodities can be produced most efficiently using industrial machinery to take advantage of economies of scale, an option closed to village artisans. This alienates the producers from what is being produced, and means the product no longer has any personal meaning to them."}, {"label": "F", "text": "In addition, cultural idiosyncrasies and natural spectacles change over time. Tourists can’t be attracted, however, to an unstable and ambiguous culture, or to a natural site that is in the process of transforming itself. As a consequence, efforts are made to fix and standardize: folk dances, tortilla-making, peace pipes, bird habitats and the course of the Amazon have all been bound and defined. Had they not been fixed, however, they would not be accessible."}, {"label": "G", "text": "Tourism also promotes an external orientation. Like other exports, the \"tourism experience\" is produced by local people, and consumed by foreigners. To obtain loans and ultimately create revenue, a government of whatever size has to please outside investors and potential travelers. In these ways, tourism can result in a political system becoming more authoritarian and giving less consideration to the needs of individuals within the country."}, {"label": "H", "text": "In recent years, with increased awareness of some of these dangers, the phenomenon of ecotourism has developed. This has been seen as a way to prevent and reverse the environmental degradation resulting from tourism as well as from general human activity. Ecotourists distance themselves from mainstream hotel tourists, and also from adventure tourists like those who have, for example, left rubbish at the base of Mount Everest in Nepal. They want to do things like sleep in tents on platforms in tropical rainforests, swim among the fish on coral reefs, or walk over a tree canopy on a net bridge. They value the ecosystem as it is and are willing to pay for its preservation. In this way, they create an incentive for local people to refrain from using natural resources for short-term gain."}, {"label": "I", "text": "However, what is fortunate for the birds is not always so fortunate for the local people. In order to be environmentally sustainable, ecotourists have to be few in number. The economies of scale that allow tourism to be profitable cannot operate in a small bush camp. Camping doesn’t generate much revenue. Ecotourism proves that tourism does not have to be in conflict with environmental preservation. Unfortunately, it also proves that the realm in which the environment and the economy can be mutually supporting is tiny."}, {"label": "J", "text": "Furthermore, Westerners’ interest in biodiversity often means that the tourist wants to listen to a parrot, not a local elder, and that dollars bypass beggars on their way to support trees. Thus ecotourists’ environmental awareness can stand in contrast to their indifference to the local human community. Tourism always contains a message: this is what we value, this is what we don’t."}], "questions": [{"id": "tourism-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "International tourism presents itself as straightforward, passive and benign, yet it is complex, interesting and important, full of contradictions and depths.", "target": "straightforward", "options": ["simple to understand or deal with", "following a straight physical route", "guaranteed to succeed financially"], "answer": 0, "explanations": ["此處 straightforward 表示「簡單明瞭、容易處理的」。須依原句語境理解。", "這個選項表示「沿直線路徑的」；原句要表達的是「簡單明瞭、容易處理的」。", "這個選項表示「保證財務成功的」；原句要表達的是「簡單明瞭、容易處理的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "International tourism presents itself as straightforward, passive and benign, yet it is complex, interesting and important, full of contradictions and depths.", "target": "benign", "options": ["not harmful or threatening", "highly profitable", "deliberately aggressive"], "answer": 0, "explanations": ["此處 benign 表示「無害的、良性的」。須依原句語境理解。", "這個選項表示「利潤極高的」；原句要表達的是「無害的、良性的」。", "這個選項表示「刻意挑釁的」；原句要表達的是「無害的、良性的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "International tourism presents itself as straightforward, passive and benign, yet it is complex, interesting and important, full of contradictions and depths.", "target": "contradictions", "options": ["features or effects that seem opposed to one another", "formal agreements between governments", "repeated improvements over time"], "answer": 0, "explanations": ["此處 contradictions 表示「矛盾、相互牴觸之處」。須依原句語境理解。", "這個選項表示「政府間正式協定」；原句要表達的是「矛盾、相互牴觸之處」。", "這個選項表示「隨時間反覆出現的改善」；原句要表達的是「矛盾、相互牴觸之處」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "It has enormous growth potential; almost every country desires an expansion in this sector.", "target": "growth potential", "options": ["the capacity for future expansion", "a record of past earnings", "a fixed limit on visitor numbers"], "answer": 0, "explanations": ["此處 growth potential 表示「成長潛力」。須依原句語境理解。", "這個選項表示「過去收益紀錄」；原句要表達的是「成長潛力」。", "這個選項表示「旅客人數的固定上限」；原句要表達的是「成長潛力」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "It has enormous growth potential; almost every country desires an expansion in this sector.", "target": "sector", "options": ["a distinct area of economic activity", "a single company's office", "a geographic border between countries"], "answer": 0, "explanations": ["此處 sector 表示「經濟部門、產業領域」。須依原句語境理解。", "這個選項表示「某公司的辦公室」；原句要表達的是「經濟部門、產業領域」。", "這個選項表示「國界」；原句要表達的是「經濟部門、產業領域」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-6", "mode": "vocab", "paragraph": "B", "sentence": "Tourism can provide the ideal export for developing countries, which can capitalize on their unique cultures and natural environments.", "target": "capitalize on", "options": ["use an advantage or opportunity for benefit", "write words in capital letters", "destroy the value of a resource"], "answer": 0, "explanations": ["此處 capitalize on 表示「善用、利用某優勢獲益」。須依原句語境理解。", "這個選項表示「以大寫字母書寫」；原句要表達的是「善用、利用某優勢獲益」。", "這個選項表示「破壞資源價值」；原句要表達的是「善用、利用某優勢獲益」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-7", "mode": "vocab", "paragraph": "B", "sentence": "However, to do this they need to have features such as airports, hotels, sanitation facilities, roads and medical facilities.", "target": "sanitation facilities", "options": ["systems for hygiene and safe disposal of waste", "buildings for treating serious injuries only", "facilities for booking accommodation"], "answer": 0, "explanations": ["此處 sanitation facilities 表示「衛生設施」。須依原句語境理解。", "這個選項表示「僅處理重傷的建築」；原句要表達的是「衛生設施」。", "這個選項表示「預訂住宿的設施」；原句要表達的是「衛生設施」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-8", "mode": "vocab", "paragraph": "B", "sentence": "A government can build these itself, using revenue from local taxes or getting finance from foreign lenders.", "target": "revenue", "options": ["money received from taxes or business activity", "the final profit after all costs", "money that must be repaid to a lender"], "answer": 0, "explanations": ["此處 revenue 表示「稅收、收入」。須依原句語境理解。", "這個選項表示「扣除所有成本的淨利」；原句要表達的是「稅收、收入」。", "這個選項表示「必須償還貸方的款項」；原句要表達的是「稅收、收入」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-9", "mode": "vocab", "paragraph": "B", "sentence": "A government can build these itself, using revenue from local taxes or getting finance from foreign lenders.", "target": "foreign lenders", "options": ["overseas people or organisations that provide loans", "foreign visitors who buy souvenirs", "local residents who pay taxes"], "answer": 0, "explanations": ["此處 foreign lenders 表示「外國貸款人或機構」。須依原句語境理解。", "這個選項表示「購買紀念品的外國旅客」；原句要表達的是「外國貸款人或機構」。", "這個選項表示「繳稅的本地居民」；原句要表達的是「外國貸款人或機構」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "Alternatively, the government may attract foreign investment, allowing others to pay for the building, thus relieving itself of providing capital but forgoing profits.", "target": "foreign investment", "options": ["capital put into a country by overseas investors", "money borrowed and owed to overseas banks", "all spending by local households"], "answer": 0, "explanations": ["此處 foreign investment 表示「外國投資」。須依原句語境理解。", "這個選項表示「向海外銀行借入並積欠的款項」；原句要表達的是「外國投資」。", "這個選項表示「本地家庭的所有支出」；原句要表達的是「外國投資」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "Alternatively, the government may attract foreign investment, allowing others to pay for the building, thus relieving itself of providing capital but forgoing profits.", "target": "relieving itself of", "options": ["freeing itself from a burden or responsibility", "making itself fully responsible for", "delaying a decision about"], "answer": 0, "explanations": ["此處 relieving itself of 表示「使自身免除某負擔或責任」。須依原句語境理解。", "這個選項表示「讓自身負起全部責任」；原句要表達的是「使自身免除某負擔或責任」。", "這個選項表示「延遲決定」；原句要表達的是「使自身免除某負擔或責任」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "Alternatively, the government may attract foreign investment, allowing others to pay for the building, thus relieving itself of providing capital but forgoing profits.", "target": "providing capital", "options": ["supplying money needed to finance a project", "offering a city as a travel destination", "paying back the profits already received"], "answer": 0, "explanations": ["此處 providing capital 表示「提供建設或投資所需資本」。須依原句語境理解。", "這個選項表示「提供城市作旅遊目的地」；原句要表達的是「提供建設或投資所需資本」。", "這個選項表示「償還已收取的利潤」；原句要表達的是「提供建設或投資所需資本」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "Alternatively, the government may attract foreign investment, allowing others to pay for the building, thus relieving itself of providing capital but forgoing profits.", "target": "forgoing", "options": ["giving up something that could have been obtained", "guaranteeing future receipt of", "collecting in advance"], "answer": 0, "explanations": ["此處 forgoing 表示「放棄原可取得的事物」。須依原句語境理解。", "這個選項表示「保證將來收到」；原句要表達的是「放棄原可取得的事物」。", "這個選項表示「預先收取」；原句要表達的是「放棄原可取得的事物」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-14", "mode": "vocab", "paragraph": "C", "sentence": "Even when successful, countries and localities are faced with a dilemma: keep it within limits, or extend its benefits but also deepen dependence on a single, fickle industry.", "target": "localities", "options": ["particular places or areas", "local government employees", "services offered to visitors"], "answer": 0, "explanations": ["此處 localities 表示「地方、地區」。須依原句語境理解。", "這個選項表示「地方政府員工」；原句要表達的是「地方、地區」。", "這個選項表示「提供旅客的服務」；原句要表達的是「地方、地區」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-15", "mode": "vocab", "paragraph": "C", "sentence": "Even when successful, countries and localities are faced with a dilemma: keep it within limits, or extend its benefits but also deepen dependence on a single, fickle industry.", "target": "dilemma", "options": ["a difficult choice between competing alternatives", "a problem with only one possible solution", "a guarantee of future profit"], "answer": 0, "explanations": ["此處 dilemma 表示「兩難、難以抉擇的處境」。須依原句語境理解。", "這個選項表示「只有一種解法的問題」；原句要表達的是「兩難、難以抉擇的處境」。", "這個選項表示「未來獲利的保證」；原句要表達的是「兩難、難以抉擇的處境」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-16", "mode": "vocab", "paragraph": "C", "sentence": "Even when successful, countries and localities are faced with a dilemma: keep it within limits, or extend its benefits but also deepen dependence on a single, fickle industry.", "target": "deepen dependence on", "options": ["become more reliant on", "reduce the need for", "develop a wider range of alternatives to"], "answer": 0, "explanations": ["此處 deepen dependence on 表示「加深對……的依賴」。須依原句語境理解。", "這個選項表示「減少對……的需要」；原句要表達的是「加深對……的依賴」。", "這個選項表示「發展更多替代方案」；原句要表達的是「加深對……的依賴」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-17", "mode": "vocab", "paragraph": "C", "sentence": "Even when successful, countries and localities are faced with a dilemma: keep it within limits, or extend its benefits but also deepen dependence on a single, fickle industry.", "target": "fickle", "options": ["liable to change unpredictably", "protected from outside events", "permanently established"], "answer": 0, "explanations": ["此處 fickle 表示「變化無常、不穩定的」。須依原句語境理解。", "這個選項表示「不受外界事件影響的」；原句要表達的是「變化無常、不穩定的」。", "這個選項表示「永久確立的」；原句要表達的是「變化無常、不穩定的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-18", "mode": "vocab", "paragraph": "D", "sentence": "By definition, tourists travel to see and knowingly to encounter the different, the original, the authentic.", "target": "authentic", "options": ["genuine rather than imitation", "officially expensive", "universally familiar"], "answer": 0, "explanations": ["此處 authentic 表示「真實的、原真的」。須依原句語境理解。", "這個選項表示「官方定價昂貴的」；原句要表達的是「真實的、原真的」。", "這個選項表示「人人熟悉的」；原句要表達的是「真實的、原真的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-19", "mode": "vocab", "paragraph": "D", "sentence": "But only through artifice can the tourist demand for authenticity be met.", "target": "artifice", "options": ["deliberate construction or staging that creates an effect", "a completely untouched natural process", "a work of art of any kind"], "answer": 0, "explanations": ["此處 artifice 表示「人為安排、營造手法」。須依原句語境理解。", "這個選項表示「完全未受干預的自然過程」；原句要表達的是「人為安排、營造手法」。", "這個選項表示「任何種類的藝術品」；原句要表達的是「人為安排、營造手法」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-20", "mode": "vocab", "paragraph": "D", "sentence": "But only through artifice can the tourist demand for authenticity be met.", "target": "authenticity", "options": ["the quality of being genuine or original", "the popularity of an attraction", "the permission to enter a site"], "answer": 0, "explanations": ["此處 authenticity 表示「真實性、原真性」。須依原句語境理解。", "這個選項表示「景點的受歡迎程度」；原句要表達的是「真實性、原真性」。", "這個選項表示「進入景點的許可」；原句要表達的是「真實性、原真性」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-21", "mode": "vocab", "paragraph": "D", "sentence": "An event such as a festival or ceremony needs to be brought to their attention and its importance and unique nature elaborated to them.", "target": "elaborated", "options": ["explained in greater detail", "made less important", "concealed from visitors"], "answer": 0, "explanations": ["此處 elaborated 表示「詳加闡述」。須依原句語境理解。", "這個選項表示「使較不重要」；原句要表達的是「詳加闡述」。", "這個選項表示「對旅客隱瞞」；原句要表達的是「詳加闡述」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-22", "mode": "vocab", "paragraph": "D", "sentence": "Natural sites, too, need to be presented if they are to be regarded as noteworthy; gates, permits, and notices are required to set them apart from the mundane.", "target": "noteworthy", "options": ["deserving special attention", "difficult to obtain permission for", "impossible to describe in words"], "answer": 0, "explanations": ["此處 noteworthy 表示「值得注意的」。須依原句語境理解。", "這個選項表示「難以取得許可的」；原句要表達的是「值得注意的」。", "這個選項表示「無法用言語描述的」；原句要表達的是「值得注意的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-23", "mode": "vocab", "paragraph": "D", "sentence": "Natural sites, too, need to be presented if they are to be regarded as noteworthy; gates, permits, and notices are required to set them apart from the mundane.", "target": "set them apart from", "options": ["make them distinct from", "keep them physically distant from all visitors", "make them identical to"], "answer": 0, "explanations": ["此處 set them apart from 表示「將它們與……區分開來」。須依原句語境理解。", "這個選項表示「使其與所有旅客保持實際距離」；原句要表達的是「將它們與……區分開來」。", "這個選項表示「使其與……相同」；原句要表達的是「將它們與……區分開來」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-24", "mode": "vocab", "paragraph": "D", "sentence": "Natural sites, too, need to be presented if they are to be regarded as noteworthy; gates, permits, and notices are required to set them apart from the mundane.", "target": "mundane", "options": ["ordinary and lacking special interest", "mysterious and dangerous", "rare and highly valuable"], "answer": 0, "explanations": ["此處 mundane 表示「平凡、日常而不起眼的」。須依原句語境理解。", "這個選項表示「神祕危險的」；原句要表達的是「平凡、日常而不起眼的」。", "這個選項表示「稀有珍貴的」；原句要表達的是「平凡、日常而不起眼的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-25", "mode": "vocab", "paragraph": "D", "sentence": "Complicated framing and staging allow tourists to recognize, by sight, \"the actual thing\".", "target": "framing and staging", "options": ["presenting and arranging something to shape its meaning", "constructing physical frames for paintings only", "removing all human involvement"], "answer": 0, "explanations": ["此處 framing and staging 表示「透過呈現框架與安排來營造意義」。須依原句語境理解。", "這個選項表示「僅製作畫作的實體框架」；原句要表達的是「透過呈現框架與安排來營造意義」。", "這個選項表示「移除所有人為介入」；原句要表達的是「透過呈現框架與安排來營造意義」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-26", "mode": "vocab", "paragraph": "E", "sentence": "Tourism places a premium on the parts of a culture that are visible, such as handicrafts and costume, and disregards those that are not, like the rules governing seating on a bus, attitudes to the elderly, or appropriate ways of addressing family members; in this way, tourism favours what can be commodified.", "target": "places a premium on", "options": ["gives especially high value or importance to", "charges a compulsory entrance fee for", "places strict restrictions on"], "answer": 0, "explanations": ["此處 places a premium on 表示「特別重視、賦予高價值」。須依原句語境理解。", "這個選項表示「對……強制收取入場費」；原句要表達的是「特別重視、賦予高價值」。", "這個選項表示「嚴格限制」；原句要表達的是「特別重視、賦予高價值」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-27", "mode": "vocab", "paragraph": "E", "sentence": "Tourism places a premium on the parts of a culture that are visible, such as handicrafts and costume, and disregards those that are not, like the rules governing seating on a bus, attitudes to the elderly, or appropriate ways of addressing family members; in this way, tourism favours what can be commodified.", "target": "handicrafts", "options": ["objects made by hand using traditional skills", "goods made entirely by automated machines", "instructions for carrying out ceremonies"], "answer": 0, "explanations": ["此處 handicrafts 表示「手工藝品」。須依原句語境理解。", "這個選項表示「全由自動機器製作的商品」；原句要表達的是「手工藝品」。", "這個選項表示「舉行儀式的說明」；原句要表達的是「手工藝品」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-28", "mode": "vocab", "paragraph": "E", "sentence": "Tourism places a premium on the parts of a culture that are visible, such as handicrafts and costume, and disregards those that are not, like the rules governing seating on a bus, attitudes to the elderly, or appropriate ways of addressing family members; in this way, tourism favours what can be commodified.", "target": "disregards", "options": ["pays no attention to", "strongly approves of", "explains in considerable detail"], "answer": 0, "explanations": ["此處 disregards 表示「忽略、不重視」。須依原句語境理解。", "這個選項表示「極為贊同」；原句要表達的是「忽略、不重視」。", "這個選項表示「詳細解釋」；原句要表達的是「忽略、不重視」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-29", "mode": "vocab", "paragraph": "E", "sentence": "Tourism places a premium on the parts of a culture that are visible, such as handicrafts and costume, and disregards those that are not, like the rules governing seating on a bus, attitudes to the elderly, or appropriate ways of addressing family members; in this way, tourism favours what can be commodified.", "target": "governing", "options": ["regulating how something is done", "funding with public money", "advertising to foreign visitors"], "answer": 0, "explanations": ["此處 governing 表示「規範、支配」。須依原句語境理解。", "這個選項表示「用公款資助」；原句要表達的是「規範、支配」。", "這個選項表示「向外國旅客宣傳」；原句要表達的是「規範、支配」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-30", "mode": "vocab", "paragraph": "E", "sentence": "Tourism places a premium on the parts of a culture that are visible, such as handicrafts and costume, and disregards those that are not, like the rules governing seating on a bus, attitudes to the elderly, or appropriate ways of addressing family members; in this way, tourism favours what can be commodified.", "target": "addressing", "options": ["speaking to someone in a particular way", "writing someone's postal location", "solving a difficult practical problem"], "answer": 0, "explanations": ["此處 addressing 表示「對人稱呼或說話」。須依原句語境理解。", "這個選項表示「填寫某人的郵寄地址」；原句要表達的是「對人稱呼或說話」。", "這個選項表示「解決棘手的實際問題」；原句要表達的是「對人稱呼或說話」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-31", "mode": "vocab", "paragraph": "E", "sentence": "Tourism places a premium on the parts of a culture that are visible, such as handicrafts and costume, and disregards those that are not, like the rules governing seating on a bus, attitudes to the elderly, or appropriate ways of addressing family members; in this way, tourism favours what can be commodified.", "target": "commodified", "options": ["turned into something that can be bought and sold", "protected from all commercial use", "returned to its original natural form"], "answer": 0, "explanations": ["此處 commodified 表示「被商品化的」。須依原句語境理解。", "這個選項表示「受到保護而免於任何商業使用的」；原句要表達的是「被商品化的」。", "這個選項表示「恢復原有自然形態的」；原句要表達的是「被商品化的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-32", "mode": "vocab", "paragraph": "E", "sentence": "Yet commodities can be produced most efficiently using industrial machinery to take advantage of economies of scale, an option closed to village artisans.", "target": "commodities", "options": ["goods produced for exchange or sale", "social relationships with no market value", "laws preventing industrial production"], "answer": 0, "explanations": ["此處 commodities 表示「商品」。須依原句語境理解。", "這個選項表示「無市場價值的社會關係」；原句要表達的是「商品」。", "這個選項表示「禁止工業生產的法律」；原句要表達的是「商品」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-33", "mode": "vocab", "paragraph": "E", "sentence": "Yet commodities can be produced most efficiently using industrial machinery to take advantage of economies of scale, an option closed to village artisans.", "target": "economies of scale", "options": ["lower costs per unit achieved through larger-scale production", "equal profits shared by every producer", "the cost of weighing goods for sale"], "answer": 0, "explanations": ["此處 economies of scale 表示「規模經濟」。須依原句語境理解。", "這個選項表示「所有生產者均分的利潤」；原句要表達的是「規模經濟」。", "這個選項表示「秤量販售商品的費用」；原句要表達的是「規模經濟」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-34", "mode": "vocab", "paragraph": "E", "sentence": "Yet commodities can be produced most efficiently using industrial machinery to take advantage of economies of scale, an option closed to village artisans.", "target": "artisans", "options": ["workers skilled in making things by hand", "industrial investors who own machinery", "performers who entertain on stage"], "answer": 0, "explanations": ["此處 artisans 表示「工匠、手工藝者」。須依原句語境理解。", "這個選項表示「擁有機器的工業投資者」；原句要表達的是「工匠、手工藝者」。", "這個選項表示「舞台上的表演者」；原句要表達的是「工匠、手工藝者」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-35", "mode": "vocab", "paragraph": "E", "sentence": "This alienates the producers from what is being produced, and means the product no longer has any personal meaning to them.", "target": "alienates", "options": ["makes people feel disconnected from something", "makes people proud of something", "provides legal ownership of something"], "answer": 0, "explanations": ["此處 alienates 表示「使疏離、使失去連結」。須依原句語境理解。", "這個選項表示「使人對某事感到自豪」；原句要表達的是「使疏離、使失去連結」。", "這個選項表示「賦予某物的合法所有權」；原句要表達的是「使疏離、使失去連結」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-36", "mode": "vocab", "paragraph": "F", "sentence": "In addition, cultural idiosyncrasies and natural spectacles change over time.", "target": "idiosyncrasies", "options": ["distinctive and unusual characteristics", "beliefs shared identically by every culture", "formal financial obligations"], "answer": 0, "explanations": ["此處 idiosyncrasies 表示「獨特性、特有習俗或特徵」。須依原句語境理解。", "這個選項表示「每種文化完全相同的信念」；原句要表達的是「獨特性、特有習俗或特徵」。", "這個選項表示「正式財務義務」；原句要表達的是「獨特性、特有習俗或特徵」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-37", "mode": "vocab", "paragraph": "F", "sentence": "In addition, cultural idiosyncrasies and natural spectacles change over time.", "target": "spectacles", "options": ["impressive or striking sights", "glasses worn to improve eyesight", "written guides for tourists"], "answer": 0, "explanations": ["此處 spectacles 表示「壯觀景象」。須依原句語境理解。", "這個選項表示「矯正視力的眼鏡」；原句要表達的是「壯觀景象」。", "這個選項表示「旅遊指南」；原句要表達的是「壯觀景象」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-38", "mode": "vocab", "paragraph": "F", "sentence": "Tourists can’t be attracted, however, to an unstable and ambiguous culture, or to a natural site that is in the process of transforming itself.", "target": "ambiguous", "options": ["not having one clear or fixed interpretation", "certain to cause physical injury", "officially prohibited"], "answer": 0, "explanations": ["此處 ambiguous 表示「模糊、難以明確界定的」。須依原句語境理解。", "這個選項表示「肯定會造成人身傷害的」；原句要表達的是「模糊、難以明確界定的」。", "這個選項表示「官方禁止的」；原句要表達的是「模糊、難以明確界定的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-39", "mode": "vocab", "paragraph": "F", "sentence": "As a consequence, efforts are made to fix and standardize: folk dances, tortilla-making, peace pipes, bird habitats and the course of the Amazon have all been bound and defined.", "target": "fix", "options": ["hold something in a stable or defined form", "repair something that is broken", "choose a date for a meeting"], "answer": 0, "explanations": ["此處 fix 表示「使固定、定型」。須依原句語境理解。", "這個選項表示「修理損壞的物品」；原句要表達的是「使固定、定型」。", "這個選項表示「選定會議日期」；原句要表達的是「使固定、定型」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-40", "mode": "vocab", "paragraph": "F", "sentence": "As a consequence, efforts are made to fix and standardize: folk dances, tortilla-making, peace pipes, bird habitats and the course of the Amazon have all been bound and defined.", "target": "standardize", "options": ["make things conform to a consistent model", "encourage unlimited variation", "prove a historical claim correct"], "answer": 0, "explanations": ["此處 standardize 表示「使標準化」。須依原句語境理解。", "這個選項表示「鼓勵無限變化」；原句要表達的是「使標準化」。", "這個選項表示「證實歷史主張正確」；原句要表達的是「使標準化」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-41", "mode": "vocab", "paragraph": "F", "sentence": "As a consequence, efforts are made to fix and standardize: folk dances, tortilla-making, peace pipes, bird habitats and the course of the Amazon have all been bound and defined.", "target": "bound and defined", "options": ["given fixed limits and clear identities", "physically tied and prevented from moving", "left completely free to change"], "answer": 0, "explanations": ["此處 bound and defined 表示「界定範圍、賦予明確形式」。須依原句語境理解。", "這個選項表示「被綁住而無法移動」；原句要表達的是「界定範圍、賦予明確形式」。", "這個選項表示「完全任其改變」；原句要表達的是「界定範圍、賦予明確形式」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-42", "mode": "vocab", "paragraph": "G", "sentence": "Tourism also promotes an external orientation.", "target": "external orientation", "options": ["a focus on demands and interests from outside", "the physical direction a building faces", "a training programme for local residents"], "answer": 0, "explanations": ["此處 external orientation 表示「對外部需求與利益的導向」。須依原句語境理解。", "這個選項表示「建築的實際朝向」；原句要表達的是「對外部需求與利益的導向」。", "這個選項表示「本地居民的訓練課程」；原句要表達的是「對外部需求與利益的導向」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-43", "mode": "vocab", "paragraph": "G", "sentence": "In these ways, tourism can result in a political system becoming more authoritarian and giving less consideration to the needs of individuals within the country.", "target": "authoritarian", "options": ["enforcing strict authority with limited personal freedom", "giving equal power to all citizens", "depending entirely on outside funding"], "answer": 0, "explanations": ["此處 authoritarian 表示「威權的、專制的」。須依原句語境理解。", "這個選項表示「給所有公民同等權力的」；原句要表達的是「威權的、專制的」。", "這個選項表示「完全依賴外部資助的」；原句要表達的是「威權的、專制的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-44", "mode": "vocab", "paragraph": "G", "sentence": "In these ways, tourism can result in a political system becoming more authoritarian and giving less consideration to the needs of individuals within the country.", "target": "giving less consideration to", "options": ["paying less attention to someone's interests or needs", "offering less financial compensation for", "asking for fewer official documents from"], "answer": 0, "explanations": ["此處 giving less consideration to 表示「較少考量、較不顧及」。須依原句語境理解。", "這個選項表示「提供較少財務賠償」；原句要表達的是「較少考量、較不顧及」。", "這個選項表示「要求較少正式文件」；原句要表達的是「較少考量、較不顧及」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-45", "mode": "vocab", "paragraph": "H", "sentence": "In recent years, with increased awareness of some of these dangers, the phenomenon of ecotourism has developed.", "target": "ecotourism", "options": ["travel focused on natural areas and environmental conservation", "tourism aimed solely at urban business centres", "mass travel with no concern for nature"], "answer": 0, "explanations": ["此處 ecotourism 表示「生態旅遊」。須依原句語境理解。", "這個選項表示「僅以城市商業中心為目的的旅遊」；原句要表達的是「生態旅遊」。", "這個選項表示「不考量自然環境的大眾旅遊」；原句要表達的是「生態旅遊」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-46", "mode": "vocab", "paragraph": "H", "sentence": "This has been seen as a way to prevent and reverse the environmental degradation resulting from tourism as well as from general human activity.", "target": "environmental degradation", "options": ["deterioration in the condition of the natural environment", "an increase in environmental diversity", "the measurement of ecological value"], "answer": 0, "explanations": ["此處 environmental degradation 表示「環境劣化」。須依原句語境理解。", "這個選項表示「環境多樣性增加」；原句要表達的是「環境劣化」。", "這個選項表示「生態價值的測量」；原句要表達的是「環境劣化」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-47", "mode": "vocab", "paragraph": "H", "sentence": "Ecotourists distance themselves from mainstream hotel tourists, and also from adventure tourists like those who have, for example, left rubbish at the base of Mount Everest in Nepal.", "target": "distance themselves from", "options": ["deliberately distinguish or separate themselves from", "estimate the physical distance between", "move their homes closer to"], "answer": 0, "explanations": ["此處 distance themselves from 表示「刻意與……區隔、劃清界線」。須依原句語境理解。", "這個選項表示「估算實際距離」；原句要表達的是「刻意與……區隔、劃清界線」。", "這個選項表示「將住處搬近」；原句要表達的是「刻意與……區隔、劃清界線」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-48", "mode": "vocab", "paragraph": "H", "sentence": "Ecotourists distance themselves from mainstream hotel tourists, and also from adventure tourists like those who have, for example, left rubbish at the base of Mount Everest in Nepal.", "target": "mainstream", "options": ["belonging to the most common or widely accepted type", "located beside the main river", "intended only for expert researchers"], "answer": 0, "explanations": ["此處 mainstream 表示「主流的」。須依原句語境理解。", "這個選項表示「位於主要河流旁的」；原句要表達的是「主流的」。", "這個選項表示「僅供專業研究者的」；原句要表達的是「主流的」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-49", "mode": "vocab", "paragraph": "H", "sentence": "They want to do things like sleep in tents on platforms in tropical rainforests, swim among the fish on coral reefs, or walk over a tree canopy on a net bridge.", "target": "tree canopy", "options": ["the upper layer formed by trees' crowns and leaves", "the underground system of roots", "a shelter built entirely from wood"], "answer": 0, "explanations": ["此處 tree canopy 表示「森林樹冠層」。須依原句語境理解。", "這個選項表示「地下根系」；原句要表達的是「森林樹冠層」。", "這個選項表示「完全用木材搭建的遮蔽物」；原句要表達的是「森林樹冠層」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-50", "mode": "vocab", "paragraph": "H", "sentence": "They value the ecosystem as it is and are willing to pay for its preservation.", "target": "preservation", "options": ["protection against damage or loss", "conversion into a commercial product", "replacement with a modern substitute"], "answer": 0, "explanations": ["此處 preservation 表示「保護、保存」。須依原句語境理解。", "這個選項表示「轉為商業產品」；原句要表達的是「保護、保存」。", "這個選項表示「以現代替代品取代」；原句要表達的是「保護、保存」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-51", "mode": "vocab", "paragraph": "H", "sentence": "In this way, they create an incentive for local people to refrain from using natural resources for short-term gain.", "target": "incentive", "options": ["something that motivates a particular action", "an official rule prohibiting an action", "an unavoidable result of an action"], "answer": 0, "explanations": ["此處 incentive 表示「誘因、激勵因素」。須依原句語境理解。", "這個選項表示「禁止某行為的官方規定」；原句要表達的是「誘因、激勵因素」。", "這個選項表示「某行為不可避免的結果」；原句要表達的是「誘因、激勵因素」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-52", "mode": "vocab", "paragraph": "H", "sentence": "In this way, they create an incentive for local people to refrain from using natural resources for short-term gain.", "target": "refrain from", "options": ["deliberately avoid doing something", "continue doing something more often", "receive permission to do something"], "answer": 0, "explanations": ["此處 refrain from 表示「克制不做、避免」。須依原句語境理解。", "這個選項表示「更頻繁地持續做」；原句要表達的是「克制不做、避免」。", "這個選項表示「獲准做」；原句要表達的是「克制不做、避免」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-53", "mode": "vocab", "paragraph": "H", "sentence": "In this way, they create an incentive for local people to refrain from using natural resources for short-term gain.", "target": "short-term gain", "options": ["an immediate benefit obtained over a brief period", "a lasting environmental improvement", "a small loss made during a transition"], "answer": 0, "explanations": ["此處 short-term gain 表示「短期利益」。須依原句語境理解。", "這個選項表示「長期的環境改善」；原句要表達的是「短期利益」。", "這個選項表示「過渡期間的小額損失」；原句要表達的是「短期利益」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-54", "mode": "vocab", "paragraph": "I", "sentence": "In order to be environmentally sustainable, ecotourists have to be few in number.", "target": "environmentally sustainable", "options": ["able to continue without seriously damaging the environment", "guaranteed to make high profits", "completely free of human activity"], "answer": 0, "explanations": ["此處 environmentally sustainable 表示「環境上可持續的」。須依原句語境理解。", "這個選項表示「保證創造高利潤的」；原句要表達的是「環境上可持續的」。", "這個選項表示「完全沒有人類活動的」；原句要表達的是「環境上可持續的」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-55", "mode": "vocab", "paragraph": "I", "sentence": "Ecotourism proves that tourism does not have to be in conflict with environmental preservation.", "target": "in conflict with", "options": ["incompatible with or opposed to", "entirely dependent on", "financially supported by"], "answer": 0, "explanations": ["此處 in conflict with 表示「與……衝突」。須依原句語境理解。", "這個選項表示「完全依賴」；原句要表達的是「與……衝突」。", "這個選項表示「由……提供財務支持」；原句要表達的是「與……衝突」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-56", "mode": "vocab", "paragraph": "I", "sentence": "Unfortunately, it also proves that the realm in which the environment and the economy can be mutually supporting is tiny.", "target": "realm", "options": ["an area or sphere of activity or possibility", "a country ruled by a monarch", "a clearly marked tourist route"], "answer": 0, "explanations": ["此處 realm 表示「領域、範疇」。須依原句語境理解。", "這個選項表示「君主統治的國家」；原句要表達的是「領域、範疇」。", "這個選項表示「明確標示的旅遊路線」；原句要表達的是「領域、範疇」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-57", "mode": "vocab", "paragraph": "I", "sentence": "Unfortunately, it also proves that the realm in which the environment and the economy can be mutually supporting is tiny.", "target": "mutually supporting", "options": ["helping or sustaining each other", "benefiting only one side", "operating entirely independently"], "answer": 0, "explanations": ["此處 mutually supporting 表示「相互支持的」。須依原句語境理解。", "這個選項表示「僅使單方受益的」；原句要表達的是「相互支持的」。", "這個選項表示「完全獨立運作的」；原句要表達的是「相互支持的」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-58", "mode": "vocab", "paragraph": "J", "sentence": "Furthermore, Westerners’ interest in biodiversity often means that the tourist wants to listen to a parrot, not a local elder, and that dollars bypass beggars on their way to support trees.", "target": "biodiversity", "options": ["the variety of living organisms in an area", "the number of visitors entering a habitat", "the financial value of wildlife products"], "answer": 0, "explanations": ["此處 biodiversity 表示「生物多樣性」。須依原句語境理解。", "這個選項表示「進入棲地的遊客人數」；原句要表達的是「生物多樣性」。", "這個選項表示「野生動物產品的財務價值」；原句要表達的是「生物多樣性」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-59", "mode": "vocab", "paragraph": "J", "sentence": "Furthermore, Westerners’ interest in biodiversity often means that the tourist wants to listen to a parrot, not a local elder, and that dollars bypass beggars on their way to support trees.", "target": "bypass", "options": ["pass around or avoid reaching someone", "provide direct assistance to someone", "stop all money from entering a country"], "answer": 0, "explanations": ["此處 bypass 表示「繞過、未流向某人」。須依原句語境理解。", "這個選項表示「直接援助某人」；原句要表達的是「繞過、未流向某人」。", "這個選項表示「阻止所有資金進入國家」；原句要表達的是「繞過、未流向某人」。"], "tag": "字彙與語境義"}, {"id": "tourism-vocab-60", "mode": "vocab", "paragraph": "J", "sentence": "Thus ecotourists’ environmental awareness can stand in contrast to their indifference to the local human community.", "target": "stand in contrast to", "options": ["be noticeably different from", "be the direct cause of", "be exactly equivalent to"], "answer": 0, "explanations": ["此處 stand in contrast to 表示「與……形成對比」。須依原句語境理解。", "這個選項表示「是……的直接原因」；原句要表達的是「與……形成對比」。", "這個選項表示「與……完全等同」；原句要表達的是「與……形成對比」。"], "tag": "搭配與語境義"}, {"id": "tourism-vocab-61", "mode": "vocab", "paragraph": "J", "sentence": "Thus ecotourists’ environmental awareness can stand in contrast to their indifference to the local human community.", "target": "indifference", "options": ["a lack of interest or concern", "active hostility", "a willingness to compromise"], "answer": 0, "explanations": ["此處 indifference 表示「漠不關心」。須依原句語境理解。", "這個選項表示「主動敵視」；原句要表達的是「漠不關心」。", "這個選項表示「願意妥協」；原句要表達的是「漠不關心」。"], "tag": "字彙與語境義"}, {"id": "tourism-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "International tourism presents itself as straightforward, passive and benign, yet it is complex, interesting and important, full of contradictions and depths.", "target": "", "options": ["Tourism appears simple and harmless, but the author describes it as complex and internally contradictory.", "The author concludes that tourism is entirely harmless because it appears passive.", "The author says tourism is too unimportant to deserve serious attention."], "answer": 0, "explanations": ["presents itself as 與 yet 形成表象和作者判斷的對照。", "將表面形象當成作者結論，忽略 yet。", "原文明說 important，不能推成不值得關注。"], "tag": "長難句理解", "structure": "主幹 International tourism presents itself as ... yet it is ...；兩組形容詞對照。full of contradictions and depths 補充後一評價，it 回指 international tourism。"}, {"id": "tourism-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "Yet whether and how to grow is not nearly as straightforward as one might hope.", "target": "", "options": ["Deciding whether tourism should expand and how to expand it is more difficult than it may initially seem.", "The author says every country should expand tourism in exactly the same way.", "The author says tourism has no possibility of growing anywhere."], "answer": 0, "explanations": ["whether 與 how 提出兩層決策，並未給所有國家相同答案。", "原文強調複雜性，無單一通用擴張方法。", "不簡單不等於毫無成長可能，前文已說有成長潛力。"], "tag": "長難句理解", "structure": "whether and how to grow 整組間接疑問不定詞作主詞；is not nearly as straightforward as ... 為否定等同比較。one 為泛指的人，不是特定國家。"}, {"id": "tourism-paraphrase-3", "mode": "paraphrase", "paragraph": "B", "sentence": "Tourism can provide the ideal export for developing countries, which can capitalize on their unique cultures and natural environments.", "target": "", "options": ["Developing countries can use distinctive cultures and natural environments as advantages in tourism exports.", "Developing countries must replace their cultures with identical international products.", "Only countries without distinctive natural environments can export tourism."], "answer": 0, "explanations": ["which 回指 developing countries；capitalize on 表利用既有優勢。", "原文是善用獨特文化，不是予以消除。", "將 unique cultures and natural environments 的優勢關係倒轉。"], "tag": "長難句理解", "structure": "主句 Tourism can provide the ideal export for developing countries；which can capitalize on ... 為非限定關係子句，which 指 countries。can 表可能與能力，不保證每國都會成功。"}, {"id": "tourism-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "Alternatively, the government may attract foreign investment, allowing others to pay for the building, thus relieving itself of providing capital but forgoing profits.", "target": "", "options": ["Foreign investment may remove the government's need to fund construction, but it can also mean giving up profits.", "Foreign investors always give governments all profits while governments pay all building costs.", "Foreign investment removes every possible risk and guarantees government profits."], "answer": 0, "explanations": ["allowing 與 thus relieving 說明資金安排的結果，but 帶出失去利潤的取捨。", "把建設付款者與利潤歸屬方向顛倒。", "免除出資負擔不等於消除所有風險或保證獲利。"], "tag": "長難句理解", "structure": "主句 government may attract foreign investment；allowing others to pay ... 為結果分詞。thus relieving itself of ... but forgoing ... 並列兩項後果，itself 指 government，others 指外部投資者。"}, {"id": "tourism-paraphrase-5", "mode": "paraphrase", "paragraph": "C", "sentence": "It can gradually decline as a resort becomes seen as outdated, or it can be destroyed overnight by a single hurricane, or a political emergency.", "target": "", "options": ["A tourism investment may decline slowly as a resort becomes unfashionable, or suffer sudden destruction from a disaster or political crisis.", "Tourism can fail only gradually and is protected from sudden political events.", "A resort's age is the only factor that can affect a tourism investment."], "answer": 0, "explanations": ["or 並列漸進與突發兩類風險，as 解釋漸進衰退背景。", "overnight 與 political emergency 明確提供突發風險。", "原文還列颶風與政治緊急狀態，也不只是實際年齡。"], "tag": "長難句理解", "structure": "It can gradually decline ... or it can be destroyed ... 為並列主句；as a resort becomes seen as outdated 表漸變原因。It 回指 tourism 作為投資，不是某一名旅客。"}, {"id": "tourism-paraphrase-6", "mode": "paraphrase", "paragraph": "C", "sentence": "Even when successful, countries and localities are faced with a dilemma: keep it within limits, or extend its benefits but also deepen dependence on a single, fickle industry.", "target": "", "options": ["Even successful tourism creates a choice between limiting growth and expanding benefits while increasing reliance on an unstable industry.", "Once tourism succeeds, the country no longer faces any difficult decisions.", "Restricting tourism necessarily increases dependence on that industry more than expansion does."], "answer": 0, "explanations": ["Even when 表讓步；冒號後列兩方案，擴張同時有利益與依賴風險。", "Even 強調成功也仍有兩難。", "原句將 deepen dependence 與 extend its benefits 並列於擴張方案，非限制方案。"], "tag": "長難句理解", "structure": "Even when successful 省略 tourism is，描述觀光成功的情況；主句 countries and localities are faced with a dilemma。冒號後 keep ... or extend ... 列抉擇，but also 補第二方案的代價。"}, {"id": "tourism-paraphrase-7", "mode": "paraphrase", "paragraph": "D", "sentence": "In this increasingly global world, what they want is regional and unique.", "target": "", "options": ["In a globalised world, tourists seek experiences that are distinctive to particular regions.", "Tourists seek only experiences identical to those available everywhere.", "The author says tourists are mainly seeking a new regional government."], "answer": 0, "explanations": ["what 名詞子句作主詞；regional and unique 描述旅客想要的東西。", "與 regional and unique 相反。", "regional 在此是地方特色，不是區域政府。"], "tag": "長難句理解", "structure": "In this increasingly global world 為背景；what they want 是主詞，is 為連綴動詞，regional and unique 為補語。they 回指 tourists，what 相當於 the things that。"}, {"id": "tourism-paraphrase-8", "mode": "paraphrase", "paragraph": "D", "sentence": "But only through artifice can the tourist demand for authenticity be met.", "target": "", "options": ["The author argues that satisfying tourists' demand for authenticity requires deliberate presentation and staging.", "The author argues that any human presentation necessarily makes authentic tourism impossible.", "The author says tourists have no interest in authenticity once attractions are staged."], "answer": 0, "explanations": ["only through artifice 限定達成途徑，刻意呈現看似矛盾的關係。", "將作者認為所需的途徑改成使之不可能的因素。", "句子正是描述旅客對 authenticity 的需求，沒有說需求消失。"], "tag": "長難句理解", "structure": "only＋介系詞片語置首引起部分倒裝：can the tourist demand ... be met；還原為 the demand can be met only through artifice。be met 指需求獲得滿足，非旅客與人見面。"}, {"id": "tourism-paraphrase-9", "mode": "paraphrase", "paragraph": "D", "sentence": "An event such as a festival or ceremony needs to be brought to their attention and its importance and unique nature elaborated to them.", "target": "", "options": ["Events need to be highlighted and their significance explained so that tourists notice and appreciate them.", "Tourists must organise every local ceremony themselves before they can visit.", "The author argues that explaining an event's meaning is unnecessary."], "answer": 0, "explanations": ["兩個被動結構分別處理活動被注意及意義被解說。", "needs to be brought to ... 不等於必須由旅客自己主辦。", "importance ... elaborated to them 正要求闡明其意義。"], "tag": "長難句理解", "structure": "An event ... needs to be brought ... 為第一主幹；and its importance and unique nature elaborated ... 省略 needs to be 的相關結構。their、them 均指 tourists，不是活動主辦者。"}, {"id": "tourism-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "Natural sites, too, need to be presented if they are to be regarded as noteworthy; gates, permits, and notices are required to set them apart from the mundane.", "target": "", "options": ["Natural places need presentation to be recognised as special, with boundaries and signs distinguishing them from ordinary surroundings.", "Natural places become noteworthy only when no one marks or presents them.", "Gates and notices are described as proof that a site has no tourism value."], "answer": 0, "explanations": ["if ... are to ... 表若要達成目標，需採前述呈現手段。", "原文主張需要呈現與區分，與完全不標示相反。", "gates 等用於 set them apart，不是證明沒有價值。"], "tag": "長難句理解", "structure": "Natural sites need to be presented 為主幹；if they are to be regarded as noteworthy 表目標條件。分號後 gates, permits, and notices are required ... 補充作法，them 指 sites。"}, {"id": "tourism-paraphrase-11", "mode": "paraphrase", "paragraph": "E", "sentence": "Tourism places a premium on the parts of a culture that are visible, such as handicrafts and costume, and disregards those that are not, like the rules governing seating on a bus, attitudes to the elderly, or appropriate ways of addressing family members; in this way, tourism favours what can be commodified.", "target": "", "options": ["Tourism favours visible cultural products and tends to overlook less visible social customs.", "Tourism values every aspect of culture equally, whether visible or invisible.", "Tourism ignores handicrafts while placing the highest value on bus-seating customs."], "answer": 0, "explanations": ["that are visible 與 those that are not 對照可見與不易商品化的文化面向。", "places a premium 與 disregards 明確呈現差別待遇。", "把受重視的手工藝與被忽略的社會規則對調。"], "tag": "長難句理解", "structure": "主幹 Tourism places a premium on ... and disregards ...；those 代 parts of a culture，that are not 省略 visible。such as 與 like 各引一組例子；分號後總結商品化傾向。"}, {"id": "tourism-paraphrase-12", "mode": "paraphrase", "paragraph": "E", "sentence": "Yet commodities can be produced most efficiently using industrial machinery to take advantage of economies of scale, an option closed to village artisans.", "target": "", "options": ["Large-scale industrial production can reduce costs, but village craftspeople lack access to that option.", "Village artisans enjoy exactly the same industrial economies of scale as large manufacturers.", "The author says industrial production is always less efficient than village craftwork."], "answer": 0, "explanations": ["an option 回指工業化生產利用規模經濟的作法；closed to 表無法採用。", "closed to village artisans 明確說這不是工匠可用的選項。", "原文說 most efficiently using industrial machinery，而非總較無效率。"], "tag": "長難句理解", "structure": "主幹 commodities can be produced ... using ...；to take advantage of ... 表目的。an option closed to village artisans 為整個作法的同位補充，closed to 是無法使用之意，不是店鋪關門。"}, {"id": "tourism-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "Yet commodities can be produced most efficiently using industrial machinery to take advantage of economies of scale, an option closed to village artisans. This alienates the producers from what is being produced, and means the product no longer has any personal meaning to them.", "target": "", "options": ["Industrial commodification can separate makers from their products, removing the products' personal significance for them.", "The producers become more personally attached to every product through industrial production.", "Only tourists lose interest in the products, while their makers remain unaffected."], "answer": 0, "explanations": ["This 指前述工業商品化方式，them 指 producers。", "no longer has any personal meaning 與更有依附感相反。", "把受到疏離影響的生產者誤換成旅客。"], "tag": "長難句理解", "structure": "This alienates the producers from what is being produced 為主幹；what 名詞子句作 from 的受詞。and means 後省略 that，the product ... to them 中 them 回指 producers。"}, {"id": "tourism-paraphrase-14", "mode": "paraphrase", "paragraph": "F", "sentence": "Tourists can’t be attracted, however, to an unstable and ambiguous culture, or to a natural site that is in the process of transforming itself.", "target": "", "options": ["The author claims tourism struggles to attract visitors to culture or nature that is unstable or continually changing.", "The author says culture and nature never change over time.", "The author says tourists are themselves unable to change their behaviour."], "answer": 0, "explanations": ["to ... culture 與 to ... site 是同一被動動詞 attracted 的兩個目標。", "前句明說 change over time，這句談觀光對變動的反應。", "transforming itself 修飾 natural site，並非指旅客的行為。"], "tag": "長難句理解", "structure": "Tourists can't be attracted ... to A, or to B 為被動結構；however 插入轉折。that is in the process of transforming itself 修飾 natural site，itself 回指 site。"}, {"id": "tourism-paraphrase-15", "mode": "paraphrase", "paragraph": "F", "sentence": "Had they not been fixed, however, they would not be accessible.", "target": "", "options": ["The author suggests that without past efforts to fix and define attractions, those attractions would not be accessible now.", "The author says attractions were never fixed and are therefore inaccessible now.", "The author says attractions would have become inaccessible only in the past, with no present implication."], "answer": 0, "explanations": ["Had they not been fixed 還原為 If they had not been fixed；would not be 指現在狀態。", "將反事實條件當成實際未發生，顛倒作者假設。", "主句 would not be 並非 would not have been，結果落在現在可接近性。"], "tag": "長難句理解", "structure": "Had they not been fixed 為省略 if 的倒裝條件句，相當於 If they had not been fixed。過去完成式條件配 would not be 現在結果，屬混合條件句；they 指前句各種景觀與文化項目。"}, {"id": "tourism-paraphrase-16", "mode": "paraphrase", "paragraph": "G", "sentence": "To obtain loans and ultimately create revenue, a government of whatever size has to please outside investors and potential travelers.", "target": "", "options": ["Governments seeking loans and tourism income may prioritise outside investors and potential visitors.", "The author says all loans are provided by local individuals who oppose tourism.", "The author says a government's size exempts it from needing to attract outside interest."], "answer": 0, "explanations": ["To ... 表目的；of whatever size 不論政府大小皆納入此論述。", "原句談外部投資者與潛在旅客，非所有貸款都來自反對觀光的居民。", "whatever size 排除以規模作為豁免條件的解讀。"], "tag": "長難句理解", "structure": "To obtain loans and ultimately create revenue 為目的不定詞；主幹 a government ... has to please ...。of whatever size 後位修飾 government，並列受詞 outside investors and potential travelers。"}, {"id": "tourism-paraphrase-17", "mode": "paraphrase", "paragraph": "G", "sentence": "In these ways, tourism can result in a political system becoming more authoritarian and giving less consideration to the needs of individuals within the country.", "target": "", "options": ["The author warns that tourism can encourage more authoritarian government and less attention to local people's needs.", "Tourism inevitably creates an authoritarian government in every country.", "The author says tourism always increases political freedom and local influence."], "answer": 0, "explanations": ["can result in 表可能結果，不是普遍必然；兩項政治後果並列。", "將 can 擴成 inevitably，並擅加每個國家。", "與 more authoritarian、less consideration 方向相反。"], "tag": "長難句理解", "structure": "tourism can result in 後接 a political system becoming ... and giving ...；名詞加分詞表示結果狀態。more 與 less 同時標示變化方向，can 保留作者警告的可能性。"}, {"id": "tourism-paraphrase-18", "mode": "paraphrase", "paragraph": "H", "sentence": "In recent years, with increased awareness of some of these dangers, the phenomenon of ecotourism has developed. This has been seen as a way to prevent and reverse the environmental degradation resulting from tourism as well as from general human activity.", "target": "", "options": ["Ecotourism has been regarded as a possible way to counter environmental damage from tourism and other human activity.", "Ecotourism is stated to have already removed all environmental damage worldwide.", "Only tourism causes the environmental damage discussed; other human activity is excluded."], "answer": 0, "explanations": ["has been seen as 標示被賦予的角色；as well as 納入其他人類活動。", "被視為方法不等於已全面成功，更不等於已清除所有損害。", "as well as from general human activity 明確非僅觀光。"], "tag": "長難句理解", "structure": "This 回指 ecotourism；has been seen as a way 為被動評價。to prevent and reverse ... 說明目的；resulting from ... 為修飾 degradation 的分詞，as well as 並列兩種來源。"}, {"id": "tourism-paraphrase-19", "mode": "paraphrase", "paragraph": "H", "sentence": "Ecotourists distance themselves from mainstream hotel tourists, and also from adventure tourists like those who have, for example, left rubbish at the base of Mount Everest in Nepal.", "target": "", "options": ["Ecotourists deliberately distinguish themselves from mainstream hotel tourists and from adventure tourists associated with damage or rubbish.", "Ecotourists are defined solely by how far they physically stand from hotels.", "The author says all ecotourists and all adventure tourists behave identically."], "answer": 0, "explanations": ["distance themselves from 在此表認同與作風的區隔，非實際距離。", "將比喻片語誤讀成可測量的距離。", "兩組 from 明確描述生態旅客與其他旅遊作風的區別。"], "tag": "長難句理解", "structure": "主幹 Ecotourists distance themselves from A and also from B；like those who have ... 補冒險旅客例子。who ... 修飾 those，不可推成所有 adventure tourists 都留下垃圾。"}, {"id": "tourism-paraphrase-20", "mode": "paraphrase", "paragraph": "H", "sentence": "In this way, they create an incentive for local people to refrain from using natural resources for short-term gain.", "target": "", "options": ["By paying to preserve ecosystems, ecotourists give local people a reason to avoid exploiting resources for immediate benefit.", "Ecotourists pay local people to use up resources more quickly for short-term profit.", "Local people are forced by a universal legal ban to stop using all resources forever."], "answer": 0, "explanations": ["In this way 承接付費保存；incentive 是經濟誘因，refrain from 表避免。", "將 preservation 與 refrain 的方向倒轉。", "誘因不等於法律強制，也未說禁止所有資源使用至永遠。"], "tag": "長難句理解", "structure": "主幹 they create an incentive for local people to refrain ...；they 指 ecotourists。for ... to ... 說明受激勵者與行動；from 後接 using 動名詞，for short-term gain 說明被避免行為的目的。"}, {"id": "tourism-paraphrase-21", "mode": "paraphrase", "paragraph": "I", "sentence": "However, what is fortunate for the birds is not always so fortunate for the local people.", "target": "", "options": ["An outcome beneficial to wildlife is not necessarily equally beneficial to local residents.", "Every benefit to wildlife inevitably causes an equal benefit to local people.", "The author says wildlife conservation always harms every local resident."], "answer": 0, "explanations": ["not always 否定必然同步受益，並未反向斷言永遠有害。", "把 not always 刪去，變成必然同等受益。", "not always fortunate 不等於 always harmful。"], "tag": "長難句理解", "structure": "what is fortunate for the birds 為名詞子句主詞；is not always ... 為主句。前後 fortunate 比較不同受益對象，不能把部分否定改成全稱負面結論。"}, {"id": "tourism-paraphrase-22", "mode": "paraphrase", "paragraph": "I", "sentence": "In order to be environmentally sustainable, ecotourists have to be few in number.", "target": "", "options": ["The author argues that environmental sustainability requires keeping ecotourist numbers low.", "The author says environmental sustainability requires unlimited increases in visitor numbers.", "The author says ecotourists must spend little money because their incomes are low."], "answer": 0, "explanations": ["In order to ... 表目的，few in number 限制的是旅客數量。", "與 have to be few in number 相反。", "number 指人數，不是旅客收入或消費能力。"], "tag": "長難句理解", "structure": "In order to be environmentally sustainable 為目的結構，意指生態旅遊要可持續；主幹 ecotourists have to be few in number。have to 表作者提出的必要條件，不是描述旅客個人可再生。"}, {"id": "tourism-paraphrase-23", "mode": "paraphrase", "paragraph": "I", "sentence": "Ecotourism proves that tourism does not have to be in conflict with environmental preservation.", "target": "", "options": ["Ecotourism shows that tourism and environmental preservation need not be incompatible.", "Ecotourism proves that tourism must always damage environmental preservation.", "Ecotourism proves that all forms of tourism are completely free of environmental harm."], "answer": 0, "explanations": ["does not have to 表非必然衝突，保留相容的可能。", "need not 與 must 的義務／必然方向相反。", "存在相容可能不代表所有類型都毫無傷害。"], "tag": "長難句理解", "structure": "主句 Ecotourism proves 後接 that 名詞子句；does not have to be in conflict with 是不一定必須衝突，不是 must not。不能從一種形式推廣為所有旅遊均無害。"}, {"id": "tourism-paraphrase-24", "mode": "paraphrase", "paragraph": "I", "sentence": "Ecotourism proves that tourism does not have to be in conflict with environmental preservation. Unfortunately, it also proves that the realm in which the environment and the economy can be mutually supporting is tiny.", "target": "", "options": ["The author believes the situations in which environmental and economic interests support each other are very limited.", "The author believes environmental and economic interests support each other in every tourism project.", "The author says mutual support is absolutely impossible in any circumstances."], "answer": 0, "explanations": ["tiny 表範圍狹小，並非無限普遍或完全不存在。", "與 realm ... is tiny 相反。", "tiny 仍承認小範圍存在，不等於 impossible。"], "tag": "長難句理解", "structure": "it also proves that ... 為主幹，it 指 ecotourism。that 子句主詞 the realm；in which ... 修飾 realm。mutually supporting 表雙向支持，tiny 描述相容範圍。"}, {"id": "tourism-paraphrase-25", "mode": "paraphrase", "paragraph": "J", "sentence": "Furthermore, Westerners’ interest in biodiversity often means that the tourist wants to listen to a parrot, not a local elder, and that dollars bypass beggars on their way to support trees.", "target": "", "options": ["The author argues that tourism spending may favour biodiversity over local people in need.", "The author says tourism spending always reaches the poorest residents before supporting nature.", "The author says parrots literally collect money and donate it to trees."], "answer": 0, "explanations": ["dollars bypass beggars 是資金流向的比喻，說明保育偏好可能忽略社區。", "原文說繞過 beggars，與優先到達相反。", "把旅遊資金偏好的比喻誤讀為動物實際收款。"], "tag": "長難句理解", "structure": "Westerners' interest ... often means that A and that B；兩個 that 子句平行說明偏好。dollars bypass beggars 中 dollars 為擬人化主詞；often 保留頻率限制，不可改成一律。"}, {"id": "tourism-paraphrase-26", "mode": "paraphrase", "paragraph": "J", "sentence": "Thus ecotourists’ environmental awareness can stand in contrast to their indifference to the local human community.", "target": "", "options": ["Concern for nature can coexist with a lack of concern for the local human community.", "Environmental concern necessarily guarantees equal concern for local people.", "The author claims every ecotourist actively attacks the local community."], "answer": 0, "explanations": ["can stand in contrast 表兩種態度可能形成反差，並非互相保證。", "把對比改成正向保證。", "indifference 是不關心，非主動攻擊，can 也非 every。"], "tag": "長難句理解", "structure": "主幹 ecotourists' environmental awareness can stand in contrast to their indifference；to 為介系詞，後接名詞。their 回指 ecotourists，can 保留可能性，community 指當地人類社群。"}, {"id": "tourism-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "Summary word list: infrastructure", "target": "infrastructure", "options": ["基礎建設", "觀光宣傳內容", "歷史文化遺物"], "answer": 0, "explanations": ["infrastructure 指交通等支撐社會經濟的基本設施。。此處練習題目用語，不表示整句符合原文。", "不是宣傳文案。", "不是文化遺物。"], "tag": "題目字彙", "source": "Question 27–31 · 題目用語"}, {"id": "tourism-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Summary word list: perceptions", "target": "perceptions", "options": ["看法、認知", "法定許可", "建設成本"], "answer": 0, "explanations": ["perceptions of 指人們如何看待某事。。此處練習題目用語，不表示整句符合原文。", "許可為 permits 或 permission。", "不是成本。"], "tag": "題目字彙", "source": "Question 27–31 · 題目用語"}, {"id": "tourism-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Summary word list: expansion", "target": "expansion", "options": ["擴張、擴大", "支出", "解釋"], "answer": 0, "explanations": ["expansion 指規模擴大。。此處練習題目用語，不表示整句符合原文。", "不是 expenditure 的支出。", "不是 explanation 的解釋。"], "tag": "題目字彙", "source": "Question 27–31 · 題目用語"}, {"id": "tourism-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Even if the development of tourism is successful, a country has to decide whether the industry's [...] is desirable.", "target": "desirable", "options": ["值得追求、合意的", "可立即出售的", "無法避免的"], "answer": 0, "explanations": ["desirable 指被認為有益、值得要的。。此處練習題目用語，不表示整句符合原文。", "不是可出售。", "不是 inevitable 的不可避免。"], "tag": "題目字彙", "source": "Question 27–31 · 題目用語"}, {"id": "tourism-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "The writer says that for tourists, an authentic experience is created in an unnatural manner.", "target": "authentic", "options": ["真實、原真的", "受歡迎的", "獲官方批准的"], "answer": 0, "explanations": ["authentic 強調真實而非仿造。。此處練習題目用語，不表示整句符合原文。", "受歡迎不等於真實。", "官方批准不保證真實性。"], "tag": "題目字彙", "source": "Question 32 · 題目用語"}, {"id": "tourism-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "The writer says that for tourists, an authentic experience is only possible if official barriers can be removed.", "target": "official barriers", "options": ["官方設置的限制或障礙", "旅客的個人偏見", "自然形成的地形"], "answer": 0, "explanations": ["official 指官方；barriers 可指制度限制或實體阻隔。。此處練習題目用語，不表示整句符合原文。", "不是個人偏見。", "official 排除純自然形成之意。"], "tag": "題目字彙", "source": "Question 32 · 題目用語"}, {"id": "tourism-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "The writer says that for tourists, an authentic experience may be destroyed by inappropriate behaviour.", "target": "inappropriate behaviour", "options": ["不合宜的行為", "無法預測的天氣", "沒有獲利的活動"], "answer": 0, "explanations": ["inappropriate 指不符合情境或規範。。此處練習題目用語，不表示整句符合原文。", "behaviour 是行為，不是天氣。", "是否合宜與是否獲利不同。"], "tag": "題目字彙", "source": "Question 32 · 題目用語"}, {"id": "tourism-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "an unintentional cause of offence to local people by tourists", "target": "unintentional", "options": ["非故意的", "不可原諒的", "不常發生的"], "answer": 0, "explanations": ["unintentional 說行為者沒有故意如此。。此處練習題目用語，不表示整句符合原文。", "非故意不等於不可原諒。", "意圖與發生頻率不同。"], "tag": "題目字彙", "source": "Question 33 · 題目用語"}, {"id": "tourism-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "an unintentional cause of offence to local people by tourists", "target": "offence", "options": ["冒犯、使人不快", "正式贈禮", "外幣收入"], "answer": 0, "explanations": ["cause offence to someone 是令某人感到被冒犯。。此處練習題目用語，不表示整句符合原文。", "不是贈禮。", "不是收入。"], "tag": "題目字彙", "source": "Question 33 · 題目用語"}, {"id": "tourism-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "an aspect of culture which tourism tends to ignore", "target": "aspect", "options": ["面向、層面", "完整定義", "唯一原因"], "answer": 0, "explanations": ["aspect 指事物的一個面向。。此處練習題目用語，不表示整句符合原文。", "不是整體的完整定義。", "不是唯一原因。"], "tag": "題目字彙", "source": "Question 33 · 題目用語"}, {"id": "tourism-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "Tourists' interest in traditionally-made objects may lead to changes in how they are made.", "target": "traditionally-made objects", "options": ["以傳統方式製作的物品", "古時曾被使用的所有物品", "由觀光客親手製作的物品"], "answer": 0, "explanations": ["traditionally-made 說製作方式，不必然表示物品年代久遠。。此處練習題目用語，不表示整句符合原文。", "傳統製法不等於每件都是古物。", "沒有指定製作者為旅客。"], "tag": "題目字彙", "source": "Question 34 · 題目用語"}, {"id": "tourism-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "The writer says that in order to promote tourism, features such as folk dances may have been unintentionally neglected.", "target": "neglected", "options": ["被忽視、未獲應有照顧", "被精確分類", "被刻意模仿"], "answer": 0, "explanations": ["neglect 指疏於注意或照料。。此處練習題目用語，不表示整句符合原文。", "分類不是忽視。", "模仿不是 neglect。"], "tag": "題目字彙", "source": "Question 35 · 題目用語"}, {"id": "tourism-questionVocab-13", "mode": "questionVocab", "paragraph": "", "sentence": "The writer says that in order to promote tourism, features such as folk dances have been publicised in undesirable ways.", "target": "publicised", "options": ["被宣傳、使廣為人知", "被私有化", "被列為違法"], "answer": 0, "explanations": ["publicise 是宣傳，使公眾知道。。此處練習題目用語，不表示整句符合原文。", "私有化是 privatise。", "不是定罪或禁止。"], "tag": "題目字彙", "source": "Question 35 · 題目用語"}, {"id": "tourism-questionVocab-14", "mode": "questionVocab", "paragraph": "", "sentence": "Ecotourism can be more profitable than mass tourism because it requires fewer facilities.", "target": "mass tourism", "options": ["大眾化、大規模觀光", "專供生態學者的旅行", "僅單人進行的旅遊"], "answer": 0, "explanations": ["mass 指大量人群參與。。此處練習題目用語，不表示整句符合原文。", "未限定科學家。", "與單人旅遊相反。"], "tag": "題目字彙", "source": "Question 36 · 題目用語"}, {"id": "tourism-questionVocab-15", "mode": "questionVocab", "paragraph": "", "sentence": "Limiting the number of ecotourists is necessary to protect the environment.", "target": "ecotourists", "options": ["生態旅遊者", "所有到國外的旅客", "專做觀光研究的科學家"], "answer": 0, "explanations": ["ecotourists 是以自然保育導向旅行的人。。此處練習題目用語，不表示整句符合原文。", "不是所有出國的人。", "不必是研究者。"], "tag": "題目字彙", "source": "Question 37 · 題目用語"}, {"id": "tourism-questionVocab-16", "mode": "questionVocab", "paragraph": "", "sentence": "Some ecotourists prefer interacting with wildlife over engaging with local residents.", "target": "interacting with wildlife", "options": ["與野生動物互動", "控制野生動物數量", "研究動物的市場價格"], "answer": 0, "explanations": ["interact with 是與某對象互動。。此處練習題目用語，不表示整句符合原文。", "未指族群控制。", "未指價格研究。"], "tag": "題目字彙", "source": "Question 38 · 題目用語"}, {"id": "tourism-questionVocab-17", "mode": "questionVocab", "paragraph": "", "sentence": "Some ecotourists prefer interacting with wildlife over engaging with local residents.", "target": "engaging with", "options": ["與……接觸、互動", "與……訂婚", "僱用……工作"], "answer": 0, "explanations": ["engage with 人群在此是交流接觸。。此處練習題目用語，不表示整句符合原文。", "訂婚通常為 be engaged to，不符合此語境。", "僱用義非此處 with 結構的意思。"], "tag": "題目字彙", "source": "Question 38 · 題目用語"}, {"id": "tourism-questionVocab-18", "mode": "questionVocab", "paragraph": "", "sentence": "Tourism can influence a country's political priorities.", "target": "political priorities", "options": ["政治施政的優先事項", "各政黨成立的先後次序", "政府過去的所有政策"], "answer": 0, "explanations": ["priorities 指被優先考量的事，不是成立時間。。此處練習題目用語，不表示整句符合原文。", "不是時間排序。", "非過去政策的總集合。"], "tag": "題目字彙", "source": "Question 40 · 題目用語"}]}]</script><script>
'use strict';
const $=id=>document.getElementById(id),bank=JSON.parse($('data').textContent);let data=bank.find(a=>a.id==='mind-music')||bank[0];const keyFor=a=>'reading-review-6-'+a.id+'-v1';let KEY=keyFor(data);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={vocab:'關鍵字語義',paraphrase:'長難句改寫',questionVocab:'題目字彙｜選中文'};
let progress={};function loadProgress(){progress={};try{const stored=JSON.parse(localStorage.getItem(KEY)||'{}');if(stored&&typeof stored==='object'&&!Array.isArray(stored))progress=stored}catch(e){}}loadProgress();
let mode='vocab',paragraph='all',category='all',wrongOnly=false,queue=[],position=0;
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fingerprint(q){return JSON.stringify([q.id,q.sentence,q.options,q.answer])}
function remember(q,n){progress[fingerprint(q)]={selected:n,correct:n===q.answer};try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){$('status').textContent='瀏覽器無法保留進度；目前這一輪仍可正常作答。'}}
function options(id,rows,value){$(id).replaceChildren(...rows.map(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;return o}));$(id).value=value}
function stats(){if(data.pending){$('stats').textContent='此篇內文與複習題目待加入。';return}const m=mode==='reading'?'vocab':mode,qs=data.questions.filter(q=>q.mode===m),done=qs.filter(q=>progress[fingerprint(q)]),good=done.filter(q=>progress[fingerprint(q)].correct);$('stats').innerHTML=`<b>${names[m]}</b><br>最近作答：${done.length} / ${qs.length} 題<br>答對 ${good.length} 題 · 待複習 ${done.length-good.length} 題`;$('errors').textContent=wrongOnly?'返回全部題目':'重練錯題'}
function start(){for(const id of ['shuffle','errors','para','type'])$(id).disabled=!!data.pending;document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=!!data.pending);document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});$('paraWrap').classList.toggle('hidden',mode==='questionVocab'||mode==='reading'||!!data.pending);$('typeWrap').classList.toggle('hidden',mode!=='vocab'||!!data.pending);$('jumpWrap').classList.toggle('hidden',mode==='reading'||!!data.pending);queue=shuffled(data.questions.filter(q=>q.mode===mode&&(mode==='questionVocab'||paragraph==='all'||q.paragraph===paragraph)&&(mode!=='vocab'||category==='all'||q.tag===category)&&(!wrongOnly||progress[fingerprint(q)]?.correct===false))).map(q=>({q,order:shuffled([0,1,2]),selected:null}));position=0;render()}
function sourceText(q){let i=q.sentence.indexOf(q.target);return q.target?esc(q.sentence.slice(0,i))+'<mark>'+esc(q.target)+'</mark>'+esc(q.sentence.slice(i+q.target.length)):esc(q.sentence)}
function render(){stats();const card=$('card');if(data.pending){card.innerHTML=`<article class="result"><div class="label">IELTS READING · PART ${data.part}</div><h2>${esc(data.title)}</h2><p>內容待加入</p><p class="minor">這篇已列入目錄。提供文章與題目後，即可加入三種複習練習。</p></article>`;return}if(mode==='reading'){card.innerHTML=`<article class="read"><div class="label">SOURCE TEXT</div><h2>${esc(data.sourceTitle||data.title)}</h2><p class="minor">${esc(data.subtitle)}</p>${data.sourceNote?`<p class="source-note">${esc(data.sourceNote)}</p>`:""}${data.paragraphs.map(p=>`<h3>PARAGRAPH ${esc(p.label)}</h3><p lang="en">${esc(p.text)}</p>`).join('')}</article>`;return}options('jump',queue.map((x,i)=>[String(i),`${i+1} · ${x.q.paragraph||'題目'} · ${x.q.target||x.q.tag}`]),position<queue.length?String(position):'');$('jump').disabled=!queue.length;
if(!queue.length){card.innerHTML=`<div class="result"><div class="label">${wrongOnly?'REVIEW':'PRACTICE'}</div><h2>${wrongOnly?'此範圍目前沒有錯題。':'此範圍沒有題目。'}</h2><p class="minor">可調整範圍或返回全部題目。</p><button id="all" class="primary">顯示全部題目</button></div>`;$('all').onclick=()=>{wrongOnly=false;paragraph='all';category='all';$('para').value='all';$('type').value='all';start()};return}
if(position>=queue.length){const answered=queue.filter(x=>x.selected!==null),good=answered.filter(x=>x.selected===x.q.answer);card.innerHTML=`<div class="result"><div class="label">ROUND COMPLETE</div><h2>這一輪已結束。</h2><p>已作答 ${answered.length} / ${queue.length} 題，其中答對 ${good.length} 題。</p><div class="actions"><button id="roundWrong">重練本輪錯題</button><button class="primary" id="again">重新洗牌練習</button></div></div>`;$('again').onclick=()=>{wrongOnly=false;start()};$('roundWrong').onclick=()=>{queue=shuffled(queue.filter(x=>x.selected!==null&&x.selected!==x.q.answer)).map(x=>({q:x.q,order:shuffled([0,1,2]),selected:null}));wrongOnly=true;position=0;render()};return}
const item=queue[position],q=item.q,done=queue.filter(x=>x.selected!==null).length;card.innerHTML=`<div class="top"><span>${mode==='questionVocab'?esc(q.source):'Paragraph '+esc(q.paragraph)} <span class="tag">${esc(q.tag)}</span></span><span id="roundCount">${wrongOnly?'錯題複習 · ':''}${position+1} / ${queue.length} · 已答 ${done} 題</span></div><progress id="roundProgress" class="progress" value="${done}" max="${queue.length}" aria-label="本輪已答題數"></progress><div class="prompt">${mode==='vocab'?'WHAT DOES THE HIGHLIGHTED EXPRESSION MEAN?':mode==='paraphrase'?'WHICH PARAPHRASE PRESERVES THE ORIGINAL MEANING?':'選出標示字詞在此語境中的中文意思'}</div><p class="sentence" lang="en">${sourceText(q)}</p><div class="answers">${item.order.map((n,i)=>`<button class="answer" data-answer="${n}" lang="${mode==='questionVocab'?'zh-Hant':'en'}"><span class="letter">${'ABC'[i]}</span><span>${esc(q.options[n])}</span></button>`).join('')}</div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="context" class="${mode==='questionVocab'?'hidden':''}">查看所在段落</button><div><button id="previous" ${position===0?'disabled':''}>上一題</button> <button id="next" class="primary" disabled>${position===queue.length-1?'查看本輪結果':'下一題 →'}</button></div></div><div id="contextText" class="context hidden"></div>`;
card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(item.selected!==null)return;item.selected=Number(b.dataset.answer);remember(q,item.selected);showFeedback(item);stats()});$('previous').onclick=()=>{position--;render()};$('next').onclick=()=>{position++;render();$('card').scrollIntoView({behavior:'smooth',block:'start'})};$('context').onclick=()=>{const c=$('contextText');c.classList.toggle('hidden');c.textContent=data.paragraphs.find(p=>p.label===q.paragraph).text;$('context').textContent=c.classList.contains('hidden')?'查看所在段落':'收起段落'};if(item.selected!==null)showFeedback(item)}
function showFeedback(item){const q=item.q,done=queue.filter(x=>x.selected!==null).length;$('roundCount').textContent=(wrongOnly?'錯題複習 · ':'')+(position+1)+' / '+queue.length+' · 已答 '+done+' 題';$('roundProgress').value=done;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;const n=Number(b.dataset.answer);b.classList.toggle('correct',n===q.answer);b.classList.toggle('wrong',n===item.selected&&n!==q.answer)});const f=$('feedback');f.classList.remove('hidden');f.innerHTML=`<b>${item.selected===q.answer?'✓ 答對了':'請留意這裡'} · 正確答案 ${'ABC'[item.order.indexOf(q.answer)]}</b>${item.order.map((n,i)=>`<p><b>${'ABC'[i]} ${n===q.answer?'✓':'✕'}</b> ${esc(q.explanations[n])}</p>`).join('')}${q.structure?`<div class="syntax"><b>句構拆解</b><br>${esc(q.structure)}</div>`:''}`;$('next').disabled=false}
function configure(){paragraph='all';category='all';wrongOnly=false;$('title').textContent='Reading Review 6';$('topic').textContent='IELTS READING PRACTICE';$('partLabel').textContent='IELTS READING · PART '+data.part;document.title='Reading Review 6';KEY=keyFor(data);loadProgress();$('status').textContent='';options('para',[['all','全部段落'],...data.paragraphs.map(p=>[p.label,'Paragraph '+p.label])],'all');const tags=[...new Set(data.questions.filter(q=>q.mode==='vocab').map(q=>q.tag))];options('type',[['all','全部類型'],...tags.map(t=>[t,t])],'all');updateCounts();start()}
$('article').replaceChildren(...[1,2,3].filter(part=>bank.some(a=>a.part===part)).map(part=>{const g=document.createElement('optgroup');g.label='IELTS Reading Part '+part;const sorted=bank.filter(a=>a.part===part).sort((a,b)=>a.title.localeCompare(b.title,'en',{sensitivity:'base'}));for(const a of sorted){const o=document.createElement('option');o.value=a.id;o.textContent=a.title+(a.pending?' · 待加入':'');g.appendChild(o)}return g}));$('article').value=data.id;$('article').onchange=e=>{data=bank.find(a=>a.id===e.target.value);configure()};$('para').onchange=e=>{paragraph=e.target.value;start()};$('type').onchange=e=>{category=e.target.value;start()};$('jump').onchange=e=>{position=Number(e.target.value);render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;wrongOnly=false;start()});$('shuffle').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=false;start()};$('errors').onclick=()=>{if(mode==='reading')mode='vocab';wrongOnly=!wrongOnly;start()};function updateCounts(){$('catalogSummary').textContent='已加入 '+bank.filter(a=>!a.pending).length+' / '+bank.length+' 篇 · 各篇進度分別保留';document.querySelector('.pills').classList.toggle('hidden',!!data.pending);$('countV').textContent=data.questions.filter(q=>q.mode==='vocab').length+' 題關鍵字語義';$('countP').textContent=data.questions.filter(q=>q.mode==='paraphrase').length+' 題長難句改寫';$('countQ').textContent=data.questions.filter(q=>q.mode==='questionVocab').length+' 題題目字彙選中文';}configure();
</script></body></html>
