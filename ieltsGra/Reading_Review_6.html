of fashion.", "target": "falling out of fashion", "options": ["ceasing to be popular or customary", "growing continuously more widespread", "becoming legally compulsory"], "answer": 0, "explanations": ["此處 falling out of fashion 表示「不再流行」。須依原句語境理解。", "這個選項表示「持續愈來愈普遍」；原句要表達的是「不再流行」。", "這個選項表示「變成法律強制」；原句要表達的是「不再流行」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-44", "mode": "vocab", "paragraph": "F", "sentence": "In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies.", "target": "aligning themselves with", "options": ["bringing their character closer to", "physically forming a straight queue beside", "completely rejecting"], "answer": 0, "explanations": ["此處 aligning themselves with 表示「使自身與……相契合」。須依原句語境理解。", "這個選項表示「在旁實際排直線」；原句要表達的是「使自身與……相契合」。", "這個選項表示「完全拒絕」；原句要表達的是「使自身與……相契合」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-45", "mode": "vocab", "paragraph": "F", "sentence": "In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies.", "target": "reverence", "options": ["deep respect", "intense boredom", "careful financial measurement"], "answer": 0, "explanations": ["此處 reverence 表示「崇敬」。須依原句語境理解。", "這個選項表示「極度厭煩」；原句要表達的是「崇敬」。", "這個選項表示「仔細財務測量」；原句要表達的是「崇敬」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-46", "mode": "vocab", "paragraph": "F", "sentence": "In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies.", "target": "spirituality", "options": ["concern with sacred or non-material aspects of life", "a type of alcoholic drink", "a strictly financial transaction"], "answer": 0, "explanations": ["此處 spirituality 表示「精神性、靈性」。須依原句語境理解。", "這個選項表示「一種酒精飲料」；原句要表達的是「精神性、靈性」。", "這個選項表示「嚴格財務交易」；原句要表達的是「精神性、靈性」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-47", "mode": "vocab", "paragraph": "F", "sentence": "Knowing when to maintain silence, as well as when to clap, became a mark of sophistication, a kind of code for audiences to learn.", "target": "sophistication", "options": ["cultivated refinement and knowledge of conventions", "unnecessary physical decoration only", "proof of higher moral worth"], "answer": 0, "explanations": ["此處 sophistication 表示「修養、世故與文化品味」。須依原句語境理解。", "這個選項表示「僅多餘實體裝飾」；原句要表達的是「修養、世故與文化品味」。", "這個選項表示「較高道德價值的證明」；原句要表達的是「修養、世故與文化品味」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-48", "mode": "vocab", "paragraph": "F", "sentence": "Applause became a matter of ‘do’ or ‘don’t’, so losing many old shades of meaning.", "target": "shades of meaning", "options": ["subtle differences in what is communicated", "different paint colours only", "the volume of noise alone"], "answer": 0, "explanations": ["此處 shades of meaning 表示「細微意涵差異」。須依原句語境理解。", "這個選項表示「僅不同油漆顏色」；原句要表達的是「細微意涵差異」。", "這個選項表示「僅噪音音量」；原句要表達的是「細微意涵差異」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-49", "mode": "vocab", "paragraph": "F", "sentence": "Applause became much less of a true dialogue with an audience, especially so with opera, where the singers saw it as part of a basic transaction with the crowd.", "target": "dialogue", "options": ["a meaningful exchange between parties", "a one-way command with no response", "a written contract only"], "answer": 0, "explanations": ["此處 dialogue 表示「對話、相互交流」。須依原句語境理解。", "這個選項表示「無回應的單向命令」；原句要表達的是「對話、相互交流」。", "這個選項表示「僅書面合約」；原句要表達的是「對話、相互交流」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-50", "mode": "vocab", "paragraph": "F", "sentence": "Applause became much less of a true dialogue with an audience, especially so with opera, where the singers saw it as part of a basic transaction with the crowd.", "target": "transaction", "options": ["an exchange in which something is given and received", "a completely spontaneous private emotion", "a literal journey across a country"], "answer": 0, "explanations": ["此處 transaction 表示「交易式交換」。須依原句語境理解。", "這個選項表示「完全自發的私人情感」；原句要表達的是「交易式交換」。", "這個選項表示「實際橫跨國家的旅程」；原句要表達的是「交易式交換」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-51", "mode": "vocab", "paragraph": "F", "sentence": "So by the time the 19th century arrived, applause had become standardized and institutionalized, and had become an expectation rather than the reward it used to be.", "target": "standardized", "options": ["made to follow a common fixed pattern", "made infinitely varied", "made completely impossible"], "answer": 0, "explanations": ["此處 standardized 表示「標準化的」。須依原句語境理解。", "這個選項表示「使無限多樣的」；原句要表達的是「標準化的」。", "這個選項表示「使完全不可能的」；原句要表達的是「標準化的」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-52", "mode": "vocab", "paragraph": "G", "sentence": "In the 21st century we’re reinventing applause, to make it what it used to be: a coded form of communication.", "target": "reinventing", "options": ["giving something an updated form or renewed use", "destroying every earlier function", "copying without any change"], "answer": 0, "explanations": ["此處 reinventing 表示「重新塑造、再創造」。須依原句語境理解。", "這個選項表示「摧毀全部既有功能」；原句要表達的是「重新塑造、再創造」。", "這個選項表示「毫無改變照抄」；原句要表達的是「重新塑造、再創造」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-53", "mode": "vocab", "paragraph": "G", "sentence": "In the 21st century we’re reinventing applause, to make it what it used to be: a coded form of communication.", "target": "coded form of communication", "options": ["a way of conveying messages through shared signals", "random noise with no meaning", "communication restricted to writing computer programs"], "answer": 0, "explanations": ["此處 coded form of communication 表示「透過共同訊號傳意的溝通形式」。須依原句語境理解。", "這個選項表示「毫無意義的隨機噪音」；原句要表達的是「透過共同訊號傳意的溝通形式」。", "這個選項表示「僅寫程式的溝通」；原句要表達的是「透過共同訊號傳意的溝通形式」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-54", "mode": "vocab", "paragraph": "G", "sentence": "By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising.", "target": "appreciation", "options": ["recognition and positive regard", "a legal requirement to make payment", "complete indifference"], "answer": 0, "explanations": ["此處 appreciation 表示「欣賞、感謝」。須依原句語境理解。", "這個選項表示「依法必須付款」；原句要表達的是「欣賞、感謝」。", "這個選項表示「完全漠不關心」；原句要表達的是「欣賞、感謝」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-55", "mode": "vocab", "paragraph": "G", "sentence": "By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising.", "target": "amplifying", "options": ["increasing the impact or reach of", "necessarily raising only physical sound volume", "making less noticeable"], "answer": 0, "explanations": ["此處 amplifying 表示「擴大影響、傳播」。須依原句語境理解。", "這個選項表示「必然只提高實際音量」；原句要表達的是「擴大影響、傳播」。", "這個選項表示「使更不顯眼」；原句要表達的是「擴大影響、傳播」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-56", "mode": "vocab", "paragraph": "G", "sentence": "By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising.", "target": "extending", "options": ["prolonging or spreading more widely", "bringing to an immediate end", "excluding all further participation"], "answer": 0, "explanations": ["此處 extending 表示「延伸、擴散」。須依原句語境理解。", "這個選項表示「立即終止」；原句要表達的是「延伸、擴散」。", "這個選項表示「排除後續參與」；原句要表達的是「延伸、擴散」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-57", "mode": "vocab", "paragraph": "G", "sentence": "Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead.", "target": "momentary", "options": ["lasting only a very short time", "permanent without change", "extremely complicated"], "answer": 0, "explanations": ["此處 momentary 表示「短暫的」。須依原句語境理解。", "這個選項表示「永久不變的」；原句要表達的是「短暫的」。", "這個選項表示「極複雜的」；原句要表達的是「短暫的」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-58", "mode": "vocab", "paragraph": "G", "sentence": "Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead.", "target": "short-lived", "options": ["not lasting long", "lasting throughout history", "produced only in quiet places"], "answer": 0, "explanations": ["此處 short-lived 表示「持續不久的」。須依原句語境理解。", "這個選項表示「貫穿全部歷史的」；原句要表達的是「持續不久的」。", "這個選項表示「只在安靜地方產生的」；原句要表達的是「持續不久的」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-59", "mode": "vocab", "paragraph": "G", "sentence": "Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead.", "target": "far more permanent", "options": ["considerably more lasting", "less lasting than before", "guaranteed never to change in any possible way"], "answer": 0, "explanations": ["此處 far more permanent 表示「持續得長久許多」。須依原句語境理解。", "這個選項表示「比以前更短暫」；原句要表達的是「持續得長久許多」。", "這個選項表示「保證任何方面都永不改變」；原句要表達的是「持續得長久許多」。"], "tag": "搭配與語境義"}, {"id": "applause-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Scholars aren't quite sure about the origins of applause, but the form that is still most common, clapping the hands together, was formalized in Western culture during and after performances.", "target": "", "options": ["The exact origins are uncertain, although handclapping became a formal Western performance convention.", "Scholars have established the exact first applause event beyond doubt.", "Uncertainty about origins means handclapping never became customary."], "answer": 0, "explanations": ["aren't quite sure 與 was formalized 區分起源未知與慣例形成。", "否定的不確定不能改成精確定論。", "原句明說後來正式化，非從未成慣例。"], "tag": "長難句理解", "structure": "Scholars aren't sure...為第一分句；but the form...was formalized...為被動第二分句；clapping...同位解釋 form；that is...修飾 form。"}, {"id": "applause-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "During the time of the Roman Republic (509 BC — 27 BC) the common way to end a play was for the chief actor to yell ‘Valete et plaudite!’ (‘Goodbye and applaud!’) thus signaling to the audience that it was time for them to give praise by striking hands and making explosive noise.", "target": "", "options": ["The actor's closing call cued the audience to express approval through clapping.", "The actor ordered the audience to remain silent for the rest of the evening.", "The call was made solely to tell performers when to begin the play."], "answer": 0, "explanations": ["thus signaling 表台詞結尾提示觀眾讚賞，不是開演提示。", "give praise by striking hands 與保持沉默相反。", "common way to end a play 不等於開始。"], "tag": "長難句理解", "structure": "the common way...was for the actor to yell...為主幹；thus signaling...為結果分詞；that it was time...為訊號內容；for them 指 audience。"}, {"id": "applause-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "Rome saw the rise of a professional class of applauders, or ‘people who clapped for their dinner’, hired to infiltrate crowds and manipulate their reaction to performances.", "target": "", "options": ["Some applause was produced by paid people blending into the audience to influence its reaction.", "Every audience member clapped entirely independently without any paid influence.", "The professional applauders were employed only to prevent all praise."], "answer": 0, "explanations": ["hired to infiltrate and manipulate 說明受僱者的偽裝及目的。", "存在 paid class，不能說 every entirely independent。", "操控、延長讚賞非一律阻止。"], "tag": "長難句理解", "structure": "Rome saw the rise...以地點代時期；or people...為同位解釋；hired to...為被動分詞；two to 不定詞含 infiltrate 與 manipulate 兩項目的。"}, {"id": "applause-paraphrase-4", "mode": "paraphrase", "paragraph": "A", "sentence": "Actors would hire a dozen or so people to spread out among their audiences and prolong the applause, or, if they were feeling especially bold, to start ‘spontaneous’ chants and shouts of praise.", "target": "", "options": ["Actors hired people to extend applause or, more boldly, initiate praise that only appeared spontaneous.", "The praise was necessarily unplanned because quotation marks prove sincerity.", "The actors hired people only to leave the theatre early."], "answer": 0, "explanations": ["引號暗示反諷，受僱事實顯示非真正自發。", "把反諷引號當真誠證明，忽略 hire。", "spread out、prolong、start chants 都非提早離場。"], "tag": "長難句理解", "structure": "would hire...為慣常作法；to spread...and prolong...為目的；or...to start...為另一方案；if...especially bold 插入條件，‘spontaneous’修飾表象。"}, {"id": "applause-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena.", "target": "", "options": ["Leaders used audience greetings as one way to estimate their popularity.", "The sentence describes measuring leaders' physical height in a crowd.", "Greeting volume was declared a flawless measure of every citizen's actual belief."], "answer": 0, "explanations": ["estimate their standing 指推估民望，不是體測或完美代表。", "standing 是聲望語境義。", "one method、estimate 不支持無偏且完美測所有人。"], "tag": "長難句理解", "structure": "One of the methods...was gauging...為主幹；they used...修飾 methods；to estimate...為目的；greetings they got...含關係子句；when...為到場時點。"}, {"id": "applause-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "Leaders became astute at reading the volume, the rhythm, and the length of the crowd's claps for clues about how well they were doing as officials and lawmakers.", "target": "", "options": ["Leaders learned to interpret the loudness, rhythm and duration of claps as clues to approval.", "Only the total number of seats was relevant to their assessment.", "The three clap features directly proved every official had made good laws."], "answer": 0, "explanations": ["for clues 表線索，不是完整客觀證明。", "原文明列三項聲音／時間特徵。", "clues about performance 不等於證明政策良善。"], "tag": "長難句理解", "structure": "became astute at reading...為主幹；三個名詞並列；for clues...表用途；about how well...為嵌入疑問內容；as officials...限定身分。"}, {"id": "applause-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "Cicero, the Roman lawyer, would send friends to stand around outside the arena, taking notes to see what kind of greeting each official got when he entered, the better to see who was beloved by the people, and who was not.", "target": "", "options": ["Cicero sent observers to compare rivals' receptions and judge who enjoyed public affection.", "He sent friends to manufacture identical greetings for every official.", "The observers were sent to find out only the officials' private financial wealth."], "answer": 0, "explanations": ["taking notes、the better to see 表蒐集比較支持度。", "原句是觀察紀錄，未說偽造一致反應。", "beloved by people 指民眾喜愛，不是私產。"], "tag": "長難句理解", "structure": "would send friends to stand...為慣常行動；taking notes...為伴隨分詞；to see what...為目的；the better to see...強化目的；who...and who...平行。"}, {"id": "applause-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "And particularly in the Greco-Roman world, crowds, especially in cities, were really good at communicating messages through rhythmic clapping, sometimes coupled with shouts.’", "target": "", "options": ["Crowds communicated through patterned applause, sometimes combining it with shouted responses.", "All the messages were purely silent and involved no clapping.", "The passage says rhythmic applause always carried exactly the same meaning."], "answer": 0, "explanations": ["sometimes 表有時伴喊，coding 指可傳訊的模式。", "rhythmic clapping 本身有聲，另可能加喊。", "能以模式傳訊不表示永遠同一內容。"], "tag": "長難句理解", "structure": "crowds...were good at communicating...為主幹；particularly...與 especially...為範圍插入；through...表媒介；coupled with...為被動分詞，sometimes 限定頻率。"}, {"id": "applause-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "The coding was, he says, invaluable when assessing an orator’s fortunes.", "target": "", "options": ["Understanding these patterns was extremely useful for judging a speaker's political prospects.", "The patterns had no value for assessing a speaker.", "The historian could determine every future event with certainty from a single clap."], "answer": 0, "explanations": ["invaluable 表極有價值，不是無價值；assessing 非全知預測。", "in-在此不能按普通否定讀成沒有價值。", "有用線索不等於能確知每件未來事。"], "tag": "長難句理解", "structure": "The coding was...invaluable 為主幹；he says 插入來源；when assessing...省略評估者；orator's fortunes 指成敗前景而非僅財富。"}, {"id": "applause-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "While Greco-Roman audiences certainly smacked their palms together the same way we do today, their overall strategies of applause were much more varied than clapping alone.", "target": "", "options": ["Ancient audiences clapped as people do now but also used a wider range of approving gestures.", "Ancient audiences never brought their hands together.", "Their only possible expression of approval was modern handclapping."], "answer": 0, "explanations": ["While 讓步承認拍手相同，主句說還有更多變化。", "certainly smacked palms 承認拍手存在。", "much more varied than clapping alone 排除僅此一種。"], "tag": "長難句理解", "structure": "While...smacked...為讓步；the same way [that] we do...為比較；overall strategies were...為主句；than clapping alone 為比較對象。"}, {"id": "applause-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Crowds expressed degrees of approval of the person or persons before them, ranging from claps, to snaps (of the finger and thumb), to waves (of the edge of the toga).", "target": "", "options": ["Approval could be expressed by clapping, snapping fingers or waving part of a garment.", "Every gesture involved raising exactly the same handkerchief.", "Only the volume of spoken praise distinguished levels of approval."], "answer": 0, "explanations": ["ranging from...to...to...列多種非單一形式。", "手帕是下一句帝王更換措施，不能套到全部。", "原句包括手與衣服動作，不只說話。"], "tag": "長難句理解", "structure": "Crowds expressed degrees...為主幹；of the person...表示被認可對象；ranging...為列舉分詞；括號明示 snaps 與 waves 的動作部位。"}, {"id": "applause-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "The emperor Aurelian decided to replace this gesture by waving a special handkerchief instead, a prop which he then distributed to all Roman citizens, so they would never be without a way to praise him.", "target": "", "options": ["Aurelian replaced garment-waving with a special cloth that citizens could use to praise him.", "Aurelian prohibited every visible display of praise.", "The cloth was distributed so that citizens would have no means to applaud."], "answer": 0, "explanations": ["so they would never be without a way 表確保隨時有讚賞方式的雙重否定。", "分發道具為讚賞，不是禁絕。", "never without 表不缺，非完全沒有。"], "tag": "長難句理解", "structure": "decided to replace...by waving...為主幹；a prop 同位說明 handkerchief；which he distributed...為關係子句；so...表目的，never...without 須整體解讀。"}, {"id": "applause-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "Although the style of applause may have changed over the centuries, the need to manipulate remained. 16th-century French poet Jean Daurat is credited with bringing back the Roman practice of hiring professional applauders.", "target": "", "options": ["The form of applause changed, but the motive to manipulate audiences persisted.", "The passage says changes in form eliminated every attempt at manipulation.", "Nothing about applause ever changed over time."], "answer": 0, "explanations": ["Although 對照形式改變與目的延續。", "remained 不等於 eliminated。", "may have changed 承認形式演變。"], "tag": "長難句理解", "structure": "Although...may have changed 為讓步子句；the need...remained 為主句；to manipulate 修飾 need；over centuries 為長時間範圍。"}, {"id": "applause-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "Although the style of applause may have changed over the centuries, the need to manipulate remained. 16th-century French poet Jean Daurat is credited with bringing back the Roman practice of hiring professional applauders.", "target": "", "options": ["Daurat is associated with reviving the older Roman practice of paid applause.", "Daurat is identified as the first human ever to invent applause.", "He is blamed for proving paid applause had never existed in Rome."], "answer": 0, "explanations": ["bringing back 指復興既有作法，不是首創掌聲。", "revival 不等於最初發明。", "the Roman practice 明確認為古羅馬已有。"], "tag": "長難句理解", "structure": "16th-century...poet 為主詞，姓名同位；is credited with 為被動歸功；bringing back...為動名詞受詞；of hiring...補 practice 內容。"}, {"id": "applause-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "By the early 1820s, claques had become institutionalized, with an agency in Paris specializing in the distribution of the claqueurs’ services.", "target": "", "options": ["By the early 1820s paid applause had become organised through a specialised agency.", "The practice remained entirely random with no organised suppliers.", "The agency was established only to outlaw paid applause."], "answer": 0, "explanations": ["institutionalized 與 specializing in distribution 描述組織化服務。", "與完全隨機無供應者相反。", "分配服務不是禁止服務。"], "tag": "長難句理解", "structure": "By...為截止時點；claques had become...為過去完成；with an agency...specializing...為伴隨結構；in distribution 說明專業服務。"}, {"id": "applause-paraphrase-16", "mode": "paraphrase", "paragraph": "E", "sentence": "The claque also underwent a kind of classification: the rieurs (laughers) would laugh loudly at the jokes; the pleureurs (criers) would feign tears in reaction to performances; the commissaires (officers) would learn a play or a piece of music by heart and then call attention to its best parts.", "target": "", "options": ["Different categories of paid supporters specialised in laughter, simulated tears or drawing attention to strong passages.", "Every supporter had exactly the same task with no classification.", "The criers were required to cry only from sincere involuntary emotion."], "answer": 0, "explanations": ["classification 下三類工作不同；feign 明確是裝哭。", "原句列類別與功能，不能說無區別。", "feign 與必須真情非自主相反。"], "tag": "長難句理解", "structure": "The claque underwent classification 為主幹；冒號後三個分號分句平行列工作；would 表慣常；by heart 為記熟，then 表後續引導注意。"}, {"id": "applause-paraphrase-17", "mode": "paraphrase", "paragraph": "E", "sentence": "This practice spread to Milan, to Vienna, and to London before falling out of fashion.", "target": "", "options": ["The practice spread internationally before losing popularity, and awareness of its tricks undermined its power.", "The practice never left France.", "Public discovery of the tricks strengthened its influence without limit."], "answer": 0, "explanations": ["spread...before...與 once...明示擴散後衰退，揭穿削弱效果。", "明列 Milan、Vienna、London，非只法國。", "lost power 不能改成無限增強。"], "tag": "長難句理解", "structure": "This practice spread...為主幹；to...三地並列；before falling...為時間分詞；下一句 once...為觸發條件，its 指 claque。"}, {"id": "applause-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies.", "target": "", "options": ["Concert culture became more solemn by adopting attitudes associated with religious ceremony.", "All concerts were physically relocated inside churches by definition.", "The shift is described as making concerts less serious and more casually interactive."], "answer": 0, "explanations": ["aligning 表態度取向，不等於必須在教堂。", "精神或禮儀比擬不直接確定實體地點。", "more serious 不是 less serious。"], "tag": "長難句理解", "structure": "symphonies and concerts became...為主幹；aligning themselves with...為伴隨分詞；associated with...修飾 reverence and spirituality。"}, {"id": "applause-paraphrase-19", "mode": "paraphrase", "paragraph": "F", "sentence": "Knowing when to maintain silence, as well as when to clap, became a mark of sophistication, a kind of code for audiences to learn.", "target": "", "options": ["Understanding when to remain silent or applaud became a sign of cultivated audience behaviour.", "Every sound made during a performance was equally appropriate.", "Knowing when to clap meant silence was never acceptable."], "answer": 0, "explanations": ["when silence 與 when clap 兩種情境並存，需知規範。", "knowing when 表時機有別，非一切聲音皆合宜。", "silence 被列入需知內容，不能排除。"], "tag": "長難句理解", "structure": "Knowing...為動名詞主詞；when to maintain silence 與 when to clap 平行；became a mark...為主幹；a kind of code 同位補充 sophistication 的規範。"}, {"id": "applause-paraphrase-20", "mode": "paraphrase", "paragraph": "F", "sentence": "Applause became a matter of ‘do’ or ‘don’t’, so losing many old shades of meaning.", "target": "", "options": ["Reducing applause to a choice between doing it and not doing it removed some former nuances.", "The binary rule added infinitely many new meanings.", "Applause retained every earlier shade of meaning unchanged."], "answer": 0, "explanations": ["do or don't 二分；so losing...表細微意義減少。", "losing 與 adding 相反。", "many old shades lost 不等於全部原封不動。"], "tag": "長難句理解", "structure": "Applause became a matter of...為主幹；so losing...為結果分詞，主體 applause；many 不等於全部；shades 是細微語義非色彩。"}, {"id": "applause-paraphrase-21", "mode": "paraphrase", "paragraph": "F", "sentence": "So by the time the 19th century arrived, applause had become standardized and institutionalized, and had become an expectation rather than the reward it used to be.", "target": "", "options": ["By the nineteenth century, applause had become a standard expectation rather than a freely earned reward.", "The sentence says applause was abolished completely in the nineteenth century.", "Applause became less predictable and entirely free of conventions."], "answer": 0, "explanations": ["expectation、standardized、institutionalized 表固定化，非消失。", "had become expectation 承認仍存在。", "標準與慣例化不能改成完全無規範。"], "tag": "長難句理解", "structure": "by the time...為截止時間子句；had become...兩次並列過去完成謂語；rather than...區分新功能與舊功能；it used to be 為修飾 reward 的省略關係子句。"}, {"id": "applause-paraphrase-22", "mode": "paraphrase", "paragraph": "G", "sentence": "In the 21st century we’re reinventing applause, to make it what it used to be: a coded form of communication.", "target": "", "options": ["Digital forms are described as renewing applause's earlier role as coded communication.", "The author says modern approval has no connection with earlier applause.", "The aim is to remove all communicative meaning from public approval."], "answer": 0, "explanations": ["what it used to be 指重新取得舊功能，而非全斷裂。", "reinvent to make what it used to be 明示延續。", "coded communication 正是保留並更新的功能。"], "tag": "長難句理解", "structure": "we're reinventing...為主幹；to make...為目的；what it used to be 為受詞補語內容；冒號後名詞組解釋 what。"}, {"id": "applause-paraphrase-23", "mode": "paraphrase", "paragraph": "G", "sentence": "By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising.", "target": "", "options": ["Online interaction makes the audience part of the performance by helping spread and extend it.", "The audience remains entirely passive and never contributes to the reach of a performance.", "The sentence claims all online comments are literal handclaps heard in the theatre."], "answer": 0, "explanations": ["by participating、demonstrating...through commenting 描述參與式類比。", "成為一部分與被動無貢獻相反。", "類比掌聲不是字面現場拍手。"], "tag": "長難句理解", "structure": "By connecting...為方法；we become...為主句；by participating...再說方法；demonstrating...為伴隨分詞；by amplifying...補欣賞的呈現途徑。"}, {"id": "applause-paraphrase-24", "mode": "paraphrase", "paragraph": "G", "sentence": "Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead.", "target": "", "options": ["The writer argues that digital approval has greater significance partly because it lasts longer than momentary applause.", "Digital approval is described as less lasting than earlier applause.", "The sentence guarantees that every online response will remain accessible forever."], "answer": 0, "explanations": ["because...no longer...but...more permanent 是相對持久比較，不是絕對永久保證。", "比較方向被顛倒。", "far more permanent 不等於 every forever。"], "tag": "長難句理解", "structure": "Our kind of applause...matters more 為主幹；because 引理由；no longer momentary...but far more permanent 為對照；in many ways 限定比較面向。"}, {"id": "applause-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "The impact of musical performance on the etiquette of applause.", "target": "etiquette", "options": ["禮儀、行為規範", "器材技術", "客觀音高"], "answer": 0, "explanations": ["etiquette 指何時鼓掌等適切舉止。此處練習題目用語，不表示整句符合原文。", "不是技術器材", "不是聲音屬性"], "tag": "題目字彙", "source": "Question 14–20 Heading i · 題目用語"}, {"id": "applause-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "The initial emergence of applause in the theatre.", "target": "emergence", "options": ["出現、興起", "完全消失", "固定價格"], "answer": 0, "explanations": ["emergence 指開始形成或變得明顯。此處練習題目用語，不表示整句符合原文。", "不是 disappearance", "不是價目"], "tag": "題目字彙", "source": "Question 14–20 Heading iii · 題目用語"}, {"id": "applause-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "A form of applause that is more far-reaching than before.", "target": "far-reaching", "options": ["影響廣泛、深遠的", "只能在很遠處聽到的", "毫無影響的"], "answer": 0, "explanations": ["此處 far-reaching 指傳播及影響範圍。此處練習題目用語，不表示整句符合原文。", "不是只比實體聽距", "深遠不等於無影響"], "tag": "題目字彙", "source": "Question 14–20 Heading iv · 題目用語"}, {"id": "applause-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "The use of applause to evaluate political figures' popularity.", "target": "evaluate", "options": ["評估", "無條件認同", "故意製造"], "answer": 0, "explanations": ["evaluate 是判斷、衡量。此處練習題目用語，不表示整句符合原文。", "評估不等於贊同", "測量不等於操控製造"], "tag": "題目字彙", "source": "Question 14–20 Heading v · 題目用語"}, {"id": "applause-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "The different methods of applause employed in ancient times.", "target": "employed", "options": ["採用、運用的", "所有人皆領薪才適用", "永久淘汰的"], "answer": 0, "explanations": ["methods employed 指所用方法。此處練習題目用語，不表示整句符合原文。", "employ 方法並非僱用人", "不是棄用"], "tag": "題目字彙", "source": "Question 14–20 Heading vii · 題目用語"}, {"id": "applause-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "The re-emergence and disappearance of fake appreciation.", "target": "fake appreciation", "options": ["虛假、假裝的讚賞", "毫無保留的真誠情感", "正式法律批評"], "answer": 0, "explanations": ["fake 指非真誠、為表演而做。此處練習題目用語，不表示整句符合原文。", "與真誠相反", "不是法律譴責"], "tag": "題目字彙", "source": "Question 14–20 Heading viii · 題目用語"}, {"id": "applause-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Working out how popular an opponent was.", "target": "opponent", "options": ["對手、競爭者", "必然支持自己的盟友", "不相干的觀眾"], "answer": 0, "explanations": ["政治語境為競爭對手。此處練習題目用語，不表示整句符合原文。", "不是確保支持的盟友", "不是泛指觀眾"], "tag": "題目字彙", "source": "Question 14–20 Heading x · 題目用語"}, {"id": "applause-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "The cost of hire depended on the fame of the client.", "target": "hire", "options": ["僱用、租用服務", "自行創作", "完全免費的贈品"], "answer": 0, "explanations": ["cost of hire 指聘用服務所需費用。此處練習題目用語，不表示整句符合原文。", "不是自己創作", "hire 不等於免費"], "tag": "題目字彙", "source": "Question 21–22 C · 題目用語"}, {"id": "applause-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "Claqueurs were divided into different categories.", "target": "categories", "options": ["類別", "地理方位", "固定音量"], "answer": 0, "explanations": ["categories 指依功能等分出的組別。此處練習題目用語，不表示整句符合原文。", "不是方位", "不是單一音量"], "tag": "題目字彙", "source": "Question 21–22 D · 題目用語"}, {"id": "applause-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "People could show their superiority by knowing when silence or applause was appropriate.", "target": "superiority", "options": ["較優越的地位或自我呈現", "必然較高道德水準", "完全不具知識"], "answer": 0, "explanations": ["此處為文化修養的地位展示，不是道德確證。此處練習題目用語，不表示整句符合原文。", "社會優越感不等於已證道德較高", "不是無知"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}, {"id": "applause-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "People could show their superiority by knowing when silence or applause was appropriate.", "target": "appropriate", "options": ["合宜、適當的", "毫無限制均可的", "刻意隱瞞的"], "answer": 0, "explanations": ["appropriate 指符合場合規範。此處練習題目用語，不表示整句符合原文。", "有規範不等於皆可", "不是 concealed"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}, {"id": "applause-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "Performers no longer had a meaningful dialogue with their audiences.", "target": "meaningful dialogue", "options": ["有實質意義的雙向交流", "無回應的單向命令", "固定票價"], "answer": 0, "explanations": ["dialogue 指雙方有回應的互動。此處練習題目用語，不表示整句符合原文。", "非只有命令", "不是財務價格"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}, {"id": "applause-questionVocab-13", "mode": "questionVocab", "paragraph": "", "sentence": "Modern expressions of approval last longer than earlier applause.", "target": "expressions of approval", "options": ["表示認可、讚賞的方式", "僅臉部怒氣", "正式求職申請"], "answer": 0, "explanations": ["expression 此處泛指表達方式，approval 是正面認可。此處練習題目用語，不表示整句符合原文。", "不只臉部且不是憤怒", "不是 application"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}, {"id": "applause-questionVocab-14", "mode": "questionVocab", "paragraph": "", "sentence": "Modern expressions of approval last longer than earlier applause.", "target": "approval", "options": ["認可、贊同", "不滿、反對", "觀眾總人數"], "answer": 0, "explanations": ["approval 指正面評價。此處練習題目用語，不表示整句符合原文。", "與 disapproval 相反", "不是人數統計"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}]}, {"id": "listening-ocean", "title": "Listening to the Ocean", "sourceTitle": "Listening to the Ocean", "subtitle": "", "part": 1, "topic": "海洋聲學、鯨類追蹤與氣候測量", "sourceNote": "依提供文章練習歷史研究與推論；recent、Since 1985 與未來式以原文寫作時間為準。F 段將原文熱容量與熱量混比的用語改為熱容量彼此比較；不以該估計數值設題。熱容量用語核對：WHOI Argo, Warming ocean — https://www2.whoi.edu/site/argo/impacts/warming-ocean/", "paragraphs": [{"label": "A", "text": "The oceans cover more than 70 per cent of the planet's surface, yet until quite recently we knew less about their depths than about the surface of the Moon. The Moon has been far more accessible to study because astronomers have long been able to look at its surface, first with the naked eye and then with the telescope, both instruments that focus light. Until the twentieth century, however, no instruments were available for the study of Earth's oceans: light, which can travel trillions of kilometres through the vast vacuum of space, cannot penetrate very far in seawater."}, {"label": "B", "text": "It turns out that for penetrating water the best instrument is sound. Curious investigators have long been fascinated by sound and the way it travels in water. As early as 1490, the artist and scientist Leonardo da Vinci observed: ‘If you cause your ship to stop and place the head of a long tube in the water and place the outer extremity to your ear, you will hear ships at a great distance from you.’ It was not until 1826 that two scientists, Colladon and Sturm, accurately measured the speed of sound in water. Using a long tube to listen under water (as da Vinci had suggested), they recorded how fast the sound of a submerged bell travelled across Lake Geneva in Switzerland. What these investigators demonstrated was that water is an excellent medium for sound, transmitting it almost five times faster than its speed in air."}, {"label": "C", "text": "A number of factors influence how far sound travels under water and how long it lasts, including particles, salinity, temperature and pressure. Particles in seawater can reflect, scatter and absorb certain frequencies of sound, just as certain wavelengths of light may be reflected, scattered and absorbed by specific types of particles in the atmosphere. In 1943, Maurice Ewing and J. L. Worzel conducted an experiment to test the theory that low-frequency waves, which are less vulnerable than higher frequencies to scattering and absorption, should be able to travel great distances, if the sound source is placed correctly. The researchers set off an underwater explosion and learned that it was detected easily by receivers 3,200 kilometres away. In analysing the results of this test, they discovered a kind of ‘sound pipeline’, known as the ‘deep sound channel’. Sound introduced into this channel of water could travel thousands of kilometres with minimal loss of signal."}, {"label": "D", "text": "The US Navy was quick to appreciate the usefulness of low-frequency sound and the deep sound channel. They developed the Sound Surveillance System (SOSUS), which involved underwater microphones, called hydrophones, that were placed on the ocean bottom and connected by cables to on-shore processing centres. It was Christopher Clark of Cornell University who soon realised that SOSUS could be used to listen to whales. Using a SOSUS receiver in the West Indies, he could hear whales that were 1,770 kilometres away."}, {"label": "E", "text": "Whales are the biggest of Earth's creatures, yet these animals are also remarkably elusive. Scientists wishing to observe blue whales must simply wait in their ships for the whales to surface. A few whales have been tracked briefly in the wild in this way but not for very great distances, and much about them remains unknown. But by using SOSUS, scientists can track the whales and position them on a map. Moreover, they can track not just one whale at a time, but many creatures simultaneously. They can also learn to distinguish whale calls; researchers have detected changes in the calls of finback whales as the seasons change, and have found that blue whales in different regions of the Pacific Ocean have different calls."}, {"label": "F", "text": "SOSUS has also proved instrumental in obtaining information crucial to our understanding of climate. The system has enabled researchers to begin making ocean temperature measurements on a global scale, measurements that are key to understanding the workings of heat transfer between the ocean and the atmosphere. The ocean plays an enormous role in determining air temperature — the heat capacity in only the upper few metres of ocean is thought to be equal to that of the entire atmosphere. For sound waves travelling horizontally in the ocean, speed is largely a function of temperature. Thus, the travel time of a wave of sound between two points is a sensitive indicator of the average temperature along its path. Transmitting sound in numerous directions through the deep sound channel can give scientists measurements spanning vast areas of the globe. Thousands of sound paths in the ocean can be pieced together into a map of global ocean temperatures, and by repeating measurements along the same paths over time, scientists can track changes in temperature over months or years."}, {"label": "G", "text": "Researchers are also using other acoustic techniques to monitor climate. Oceanographer Jeff Nystuen, for example, has explored the use of sound to measure rainfall over the ocean. Monitoring changing global rainfall patterns will contribute to understanding major climate change as well as the weather phenomenon known as El Niño. Since 1985, Nystuen has used hydrophones to listen to rain over the ocean, acoustically measuring not only the rainfall rate but also the rainfall type, ranging from drizzle to thunderstorms. By using the sound of rain under water as a ‘natural’ rain gauge, the measurement of rainfall over the oceans will become available to climatologists. In this way, modern society continues to benefit from the investigations of those who, like Leonardo da Vinci, pursued the answers to some basic questions of nature."}], "questions": [{"id": "ocean-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "The Moon has been far more accessible to study because astronomers have long been able to look at its surface, first with the naked eye and then with the telescope, both instruments that focus light.", "target": "accessible", "options": ["possible to reach or examine", "easy to believe", "free from legal restrictions"], "answer": 0, "explanations": ["此處 accessible 表示「可接近、可供研究的」。須依原句語境理解。", "這個選項表示「容易相信的」；原句要表達的是「可接近、可供研究的」 stances, if the sound source is placed correctly.", "target": "sound source", "options": ["the place or object from which sound originates", "the destination of a sound wave", "a written account of an experiment"], "answer": 0, "explanations": ["此處 sound source 表示「聲源」。須依原句語境理解。", "這個選項表示「聲波的目的地」；原句要表達的是「聲源」。", "這個選項表示「實驗的書面紀錄」；原句要表達的是「聲源」。"], "tag": "搭配與語境義"}, {"id": "ocean-vocab-20", "mode": "vocab", "paragraph": "C", "sentence": "The researchers set off an underwater explosion and learned that it was detected easily by receivers 3,200 kilometres away.", "target": "set off", "options": ["cause something to explode", "leave on a journey", "cancel a planned event"], "answer": 0, "explanations": ["此處 set off 表示「引爆」。須依原句語境理解。", "這個選項表示「啟程」；原句要表達的是「引爆」。", "這個選項表示「取消預定活動」；原句要表達的是「引爆」。"], "tag": "搭配與語境義"}, {"id": "ocean-vocab-21", "mode": "vocab", "paragraph": "C", "sentence": "The researchers set off an underwater explosion and learned that it was detected easily by receivers 3,200 kilometres away.", "target": "detected", "options": ["noticed or identified using instruments", "deliberately concealed", "calculated without measurements"], "answer": 0, "explanations": ["此處 detected 表示「偵測到」。須依原句語境理解。", "這個選項表示「刻意隱藏」；原句要表達的是「偵測到」。", "這個選項表示「不經測量而計算出」；原句要表達的是「偵測到」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-22", "mode": "vocab", "paragraph": "C", "sentence": "In analysing the results of this test, they discovered a kind of ‘sound pipeline’, known as the ‘deep sound channel’.", "target": "deep sound channel", "options": ["an ocean layer that guides sound over long distances", "a cable transmitting images", "a man-made tunnel below the seabed"], "answer": 0, "explanations": ["此處 deep sound channel 表示「深海聲道」。須依原句語境理解。", "這個選項表示「傳送影像的電纜」；原句要表達的是「深海聲道」。", "這個選項表示「海床下的人造隧道」；原句要表達的是「深海聲道」。"], "tag": "搭配與語境義"}, {"id": "ocean-vocab-23", "mode": "vocab", "paragraph": "C", "sentence": "Sound introduced into this channel of water could travel thousands of kilometres with minimal loss of sign 星光的儀器」；原句要表達的是「水下聽音器」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-27", "mode": "vocab", "paragraph": "D", "sentence": "They developed the Sound Surveillance System (SOSUS), which involved underwater microphones, called hydrophones, that were placed on the ocean bottom and connected by cables to on-shore processing centres.", "target": "on-shore", "options": ["located on land beside the sea", "situated far out at sea", "buried beneath the ocean floor"], "answer": 0, "explanations": ["此處 on-shore 表示「岸上的、陸上的」。須依原句語境理解。", "這個選項表示「位於遠海的」；原句要表達的是「岸上的、陸上的」。", "這個選項表示「埋在海床下的」；原句要表達的是「岸上的、陸上的」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-28", "mode": "vocab", "paragraph": "D", "sentence": "They developed the Sound Surveillance System (SOSUS), which involved underwater microphones, called hydrophones, that were placed on the ocean bottom and connected by cables to on-shore processing centres.", "target": "processing centres", "options": ["facilities where recorded information is analysed", "places where ships are built", "habitats where whales reproduce"], "answer": 0, "explanations": ["此處 processing centres 表示「資料處理中心」。須依原句語境理解。", "這個選項表示「造船場所」；原句要表達的是「資料處理中心」。", "這個選項表示「鯨類繁殖棲地」；原句要表達的是「資料處理中心」。"], "tag": "搭配與語境義"}, {"id": "ocean-vocab-29", "mode": "vocab", "paragraph": "D", "sentence": "Using a SOSUS receiver in the West Indies, he could hear whales that were 1,770 kilometres away.", "target": "receiver", "options": ["a device that picks up incoming signals", "a device that blocks all sound", "a machine that drills into rock"], "answer": 0, "explanations": ["此處 receiver 表示「訊號接收器」。須依原句語境理解。", "這個選項表示「阻隔所有聲音的裝置」；原句要表達的是「訊號接收器」。", "這個選項表示「鑽入岩石的機器」；原句要表達的是「訊號接收器」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-30", "mode": "vocab", "paragraph": "E", "sentence": "Whales are the biggest of Earth's creatures, yet these animals are also remarkably elusive.", "target": "elusive", "options": ["difficult to find or observe", "easy to identify at any time", "deliberately hostile to humans"], "answ
