「水平方向地」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-42", "mode": "vocab", "paragraph": "F", "sentence": "For sound waves travelling horizontally in the ocean, speed is largely a function of temperature.", "target": "a function of", "options": ["something that depends on another factor", "the intended purpose of a device", "an activity performed at a ceremony"], "answer": 0, "explanations": ["此處 a function of 表示「取決於某因素的結果」。須依原句語境理解。", "這個選項表示「裝置的預定用途」；原句要表達的是「取決於某因素的結果」。", "這個選項表示「典禮中的活動」；原句要表達的是「取決於某因素的結果」。"], "tag": "搭配與語境義"}, {"id": "ocean-vocab-43", "mode": "vocab", "paragraph": "F", "sentence": "Thus, the travel time of a wave of sound between two points is a sensitive indicator of the average temperature along its path.", "target": "indicator", "options": ["a sign or measurement that reveals a condition", "a cause that guarantees an outcome", "a person operating a ship"], "answer": 0, "explanations": ["此處 indicator 表示「指標」。須依原句語境理解。", "這個選項表示「保證結果發生的原因」；原句要表達的是「指標」。", "這個選項表示「操船的人」；原句要表達的是「指標」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-44", "mode": "vocab", "paragraph": "F", "sentence": "Transmitting sound in numerous directions through the deep sound channel can give scientists measurements spanning vast areas of the globe.", "target": "spanning", "options": ["extending across an area", "excluding an area from measurement", "dividing an area into equal sections"], "answer": 0, "explanations": ["此處 spanning 表示「跨越、涵蓋」。須依原句語境理解。", "這個選項表示「將某區排除於測量外」；原句要表達的是「跨越、涵蓋」。", "這個選項表示「將某區均分」；原句要表達的是「跨越、涵蓋」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-45", "mode": "vocab", "paragraph": "F", "sentence": "Thousands of sound paths in the ocean can be pieced together into a map of global ocean temperatures, and by repeating measurements along the same paths over time, scientists can track changes in temperature over months or years.", "target": "pieced together", "options": ["combined from separate parts to form a whole", "broken into smaller fragments", "replaced by unrelated information"], "answer": 0, "explanations": ["此處 pieced together 表示「將零散資料拼合成整體」。須依原句語境理解。", "這個選項表示「拆成更小的碎片」；原句要表達的是「將零散資料拼合成整體」。", "這個選項表示「換成無關的資訊」；原句要表達的是「將零散資料拼合成整體」。"], "tag": "搭配與語境義"}, {"id": "ocean-vocab-46", "mode": "vocab", "paragraph": "G", "sentence": "Researchers are also using other acoustic techniques to monitor climate.", "target": "acoustic", "options": ["relating to sound", "relating to light", "relating to electricity alone"], "answer": 0, "explanations": ["此處 acoustic 表示「聲學的、與聲音有關的」。須依原句語境理解。", "這個選項表示「與光有關的」；原句要表達的是「聲學的、與聲音有關的」。", "這個選項表示「僅與電有關的」；原句要表達的是「聲學的、與聲音有關的」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-47", "mode": "vocab", "paragraph": "G", "sentence": "Researchers are also using other acoustic techniques to monitor climate.", "target": "monitor", "options": ["observe and measure changes over time", "directly cause a change", "announce a final conclusion"], "answer": 0, "explanations": ["此處 monitor 表示「監測」。須依原句語境理解。", "這個選項表示「直接導致變化」；原句要表達的是「監測」。", "這個選項表示「宣布最終結論」；原句要表達的是「監測」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-48", "mode": "vocab", "paragraph": "G", "sentence": "Oceanographer Jeff Nystuen, for example, has explored the use of sound to measure rainfall over the ocean.", "target": "Oceanographer", "options": ["a scientist who studies the oceans", "a scientist studying ancient languages", "a person who forecasts individual fortunes"], "answer": 0, "explanations": ["此處 Oceanographer 表示「海洋學家」。須依原句語境理解。", "這個選項表示「研究古代語言的科學家」；原句要表達的是「海洋學家」。", "這個選項表示「預測個人命運的人」；原句要表達的是「海洋學家」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-49", "mode": "vocab", "paragraph": "G", "sentence": "Monitoring changing global rainfall patterns will contribute to understanding major climate change as well as the weather phenomenon known as El Niño.", "target": "rainfall patterns", "options": ["the distribution and variation of rain over time and place", "the sounds made by one raindrop", "the equipment used to forecast storms"], "answer": 0, "explanations": ["此處 rainfall patterns 表示「降雨分布與變化模式」。須依原句語境理解。", "這個選項表示「單顆雨滴的聲音」；原句要表達的是「降雨分布與變化模式」。", "這個選項表示「預報暴風雨的設備」；原句要表達的是「降雨分布與變化模式」。"], "tag": "搭配與語境義"}, {"id": "ocean-vocab-50", "mode": "vocab", "paragraph": "G", "sentence": "Monitoring changing global rainfall patterns will contribute to understanding major climate change as well as the weather phenomenon known as El Niño.", "target": "phenomenon", "options": ["an event or process that can be observed", "an explanation already proved false", "an instruction for operating equipment"], "answer": 0, "explanations": ["此處 phenomenon 表示「現象」。須依原句語境理解。", "這個選項表示「已證偽的解釋」；原句要表達的是「現象」。", "這個選項表示「操作設備的指令」；原句要表達的是「現象」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-51", "mode": "vocab", "paragraph": "G", "sentence": "Since 1985, Nystuen has used hydrophones to listen to rain over the ocean, acoustically measuring not only the rainfall rate but also the rainfall type, ranging from drizzle to thunderstorms.", "target": "drizzle", "options": ["very light rain with small drops", "a violent storm with hail", "water sprayed by breaking waves"], "answer": 0, "explanations": ["此處 drizzle 表示「毛毛雨」。須依原句語境理解。", "這個選項表示「夾冰雹的猛烈暴風雨」；原句要表達的是「毛毛雨」。", "這個選項表示「碎浪噴起的水花」；原句要表達的是「毛毛雨」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-52", "mode": "vocab", "paragraph": "G", "sentence": "By using the sound of rain under water as a ‘natural’ rain gauge, the measurement of rainfall over the oceans will become available to climatologists.", "target": "rain gauge", "options": ["an instrument used to measure rainfall", "a device measuring ocean salinity", "a map of atmospheric currents"], "answer": 0, "explanations": ["此處 rain gauge 表示「雨量計」。須依原句語境理解。", "這個選項表示「測海水鹽度的裝置」；原句要表達的是「雨量計」。", "這個選項表示「大氣環流圖」；原句要表達的是「雨量計」。"], "tag": "搭配與語境義"}, {"id": "ocean-vocab-53", "mode": "vocab", "paragraph": "G", "sentence": "By using the sound of rain under water as a ‘natural’ rain gauge, the measurement of rainfall over the oceans will become available to climatologists.", "target": "climatologists", "options": ["scientists who study climate", "people who design musical instruments", "scientists who study fossils"], "answer": 0, "explanations": ["此處 climatologists 表示「氣候學家」。須依原句語境理解。", "這個選項表示「設計樂器的人」；原句要表達的是「氣候學家」。", "這個選項表示「研究化石的科學家」；原句要表達的是「氣候學家」。"], "tag": "字彙與語境義"}, {"id": "ocean-vocab-54", "mode": "vocab", "paragraph": "G", "sentence": "In this way, modern society continues to benefit from the investigations of those who, like Leonardo da Vinci, pursued the answers to some basic questions of nature.", "target": "pursued", "options": ["tried over time to find or achieve", "avoided examining", "accepted without inquiry"], "answer": 0, "explanations": ["此處 pursued 表示「持續探求、追尋」。須依原句語境理解。", "這個選項表示「避免檢視」；原句要表達的是「持續探求、追尋」。", "這個選項表示「未經探究即接受」；原句要表達的是「持續探求、追尋」。"], "tag": "字彙與語境義"}, {"id": "ocean-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "The oceans cover more than 70 per cent of the planet's surface, yet until quite recently we knew less about their depths than about the surface of the Moon.", "target": "", "options": ["Although oceans cover most of Earth, until recently we understood their depths less well than the Moon's surface.", "Scientists knew less about the Moon because the oceans cover most of Earth.", "Only recently have oceans come to cover more than 70 per cent of the planet."], "answer": 0, "explanations": ["yet 對照海洋面積廣大與人類對深海了解不足；less ... than 比較的是知識程度。", "把兩個比較對象顛倒，並把對比改成因果。", "until recently 修飾 knew less，不是說海洋面積最近才增大。"], "tag": "長難句理解", "structure": "主幹 The oceans cover ... yet we knew less ...；until quite recently 是時間範圍。than about the surface ... 省略重複的 we knew，depths 指海洋深處。"}, {"id": "ocean-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "The Moon has been far more accessible to study because astronomers have long been able to look at its surface, first with the naked eye and then with the telescope, both instruments that focus light.", "target": "", "options": ["The Moon has been easier to study because its surface can be observed with light-based means, including the eye and telescope.", "The Moon became observable only after the telescope replaced human eyesight.", "The Moon's surface is easier to reach physically because telescopes transport observers there."], "answer": 0, "explanations": ["because 解釋可研究性；first ... then ... 表示觀測方式的發展。", "原文明確說先能以肉眼觀察，不是望遠鏡發明後才看得見。", "accessible to study 是可供觀測研究，不等於人能實際登陸。"], "tag": "長難句理解", "structure": "主句 The Moon has been far more accessible to study；because 引出原因。both instruments ... 回指 naked eye 與 telescope，that focus light 修飾 instruments。"}, {"id": "ocean-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "Until the twentieth century, however, no instruments were available for the study of Earth's oceans: light, which can travel trillions of kilometres through the vast vacuum of space, cannot penetrate very far in seawater.", "target": "", "options": ["Light travels vast distances in space but penetrates seawater poorly, limiting earlier ocean research.", "Light cannot travel far through space but passes easily through seawater.", "Before the twentieth century, seawater allowed no form of energy to pass through it."], "answer": 0, "explanations": ["which 子句說明光在太空中可傳得很遠，主幹指出其在海水中穿透有限。", "顛倒光在太空與海水中的傳播情況。", "原文說光穿透不遠，沒有說所有能量都不能通過海水。"], "tag": "長難句理解", "structure": "冒號後主幹 light cannot penetrate very far in seawater；which can travel ... 是非限定關係子句。Until ... 限定前方 no instruments were available 的時間。"}, {"id": "ocean-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "It was not until 1826 that two scientists, Colladon and Sturm, accurately measured the speed of sound in water.", "target": "", "options": ["Accurate measurement of sound speed in water was not achieved until 1826.", "Sound first began travelling through water in 1826.", "Da Vinci accurately measured the speed of sound in water in 1490."], "answer": 0, "explanations": ["not until 強調準確量測的時間點，不否認早期已有觀察。", "把人類測量的歷史誤當成自然現象開始的時間。", "把達文西早期觀察與 Colladon、Sturm 的後來量測混為一談。"], "tag": "長難句理解", "structure": "強調句 It was not until 1826 that ...；還原為 two scientists did not accurately measure ... until 1826。that 後為被強調時間所對應的完整事件。"}, {"id": "ocean-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "Using a long tube to listen under water (as da Vinci had suggested), they recorded how fast the sound of a submerged bell travelled across Lake Geneva in Switzerland.", "target": "", "options": ["Following an approach da Vinci had suggested, the scientists used a tube to record how quickly a bell's sound crossed the lake.", "The scientists proved that da Vinci had used the same submerged bell in Switzerland.", "The scientists timed the movement of the bell itself across the lake."], "answer": 0, "explanations": ["Using 的隱含主詞與 they 相同；測量對象是聲音的傳播速度。", "as da Vinci had suggested 指方法，沒有說使用同一口鐘。", "how fast the sound ... travelled 中移動的是聲音，不是鐘。"], "tag": "長難句理解", "structure": "句首 Using ... 為分詞構句，主詞承接 they。as da Vinci had suggested 是插入補充；how fast ... 為 recorded 的間接問句受詞。"}, {"id": "ocean-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "What these investigators demonstrated was that water is an excellent medium for sound, transmitting it almost five times faster than its speed in air.", "target": "", "options": ["Their research showed that water carries sound at nearly five times its speed in air.", "Their research showed that sound travels faster in air than in water.", "Their research showed that a tube increases sound speed by exactly five times."], "answer": 0, "explanations": ["What 子句概括研究者證明的內容；almost 表示接近而非精確等於。", "把水與空氣中的速度關係倒置。", "沒有說是管子加速聲音，也把 almost 誤成 exactly。"], "tag": "長難句理解", "structure": "What these investigators demonstrated 是名詞子句主詞；was that ... 引出補語。transmitting ... 為分詞補充，it 指 sound，its speed in air 為比較基準。"}, {"id": "ocean-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "A number of factors influence how far sound travels under water and how long it lasts, including particles, salinity, temperature and pressure.", "target": "", "options": ["How far underwater sound travels and how long it persists depend on several factors, including salt content and pressure.", "Only temperature determines the distance travelled by underwater sound.", "The listed factors affect sound's distance but have no effect on its duration."], "answer": 0, "explanations": ["how far 與 how long 並列，受多種因素影響。", "原文列 particles、salinity、temperature、pressure，不能縮成僅溫度。", "how long it lasts 明確涵蓋持續時間。"], "tag": "長難句理解", "structure": "主幹 A number of factors influence ...；兩個 how 子句並列作 influence 的受詞。including ... 補列因素，不表示列舉已窮盡所有可能因素。"}, {"id": "ocean-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "Particles in seawater can reflect, scatter and absorb certain frequencies of sound, just as certain wavelengths of light may be reflected, scattered and absorbed by specific types of particles in the atmosphere.", "target": "", "options": ["Particles can redirect or absorb sound waves in seawater, in a way comparable to their effects on light in the atmosphere.", "Particles affect light in the atmosphere but cannot affect sound under water.", "Sound and light travel at identical speeds because particles influence both."], "answer": 0, "explanations": ["just as 引出相似的作用方式，不是主張兩者所有性質相同。", "前半句明說海水微粒也能反射、散射、吸收聲音。", "作用方式相似不代表速度相同，原文未作此推論。"], "tag": "長難句理解", "structure": "主句 Particles ... can reflect, scatter and absorb ...；just as 引出比較子句，light may be reflected ... 採被動式，對照聲波與光波受到的作用。"}, {"id": "ocean-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "In 1943, Maurice Ewing and J. L. Worzel conducted an experiment to test the theory that low-frequency waves, which are less vulnerable than higher frequencies to scattering and absorption, should be able to travel great distances, if the sound source is placed correctly.", "target": "", "options": ["The experiment tested whether correctly positioned low-frequency sound could travel far because it is less affected by scattering and absorption.", "The researchers assumed every sound wave travels equally far regardless of its source position.", "The experiment tested whether higher-frequency waves are less vulnerable than lower-frequency ones."], "answer": 0, "explanations": ["that 後是待測理論；which 提供低頻較少受影響的特徵，if 限定聲源位置。", "刪除低頻限制，也忽略 if 所列條件。", "顛倒低頻與高頻的比較關係。"], "tag": "長難句理解", "structure": "主幹 Ewing and Worzel conducted an experiment to test the theory；that 引同位語子句說明理論。which ... 為插入關係子句；if ... 是低頻遠距傳播的條件。"}, {"id": "ocean-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "The researchers set off an underwater explosion and learned that it was detected easily by receivers 3,200 kilometres away.", "target": "", "options": ["After creating an underwater explosion, researchers found that its sound could be detected 3,200 kilometres away.", "Receivers located 3,200 kilometres away caused the underwater explosion.", "The explosion physically travelled 3,200 kilometres along the seabed."], "answer": 0, "explanations": ["被遠處接收器偵測到的是爆炸產生的聲音；set off 表引爆。", "接收器是偵測端，不是引爆者。", "原文不是說爆炸本體沿海床移動。"], "tag": "長難句理解", "structure": "The researchers 為 set off 與 learned 的共同主詞；learned 後 that 子句中 it 回指爆炸事件發出的聲訊。receivers ... away 是偵測端位置。"}, {"id": "ocean-paraphrase-11", "mode": "paraphrase", "paragraph": "C", "sentence": "In analysing the results of this test, they discovered a kind of ‘sound pipeline’, known as the ‘deep sound channel’. Sound introduced into this channel of water could travel thousands of kilometres with minimal loss of signal.", "target": "", "options": ["Sound sent into the deep sound channel can travel very far while losing little signal strength.", "The deep sound channel prevents sound from travelling beyond a few kilometres.", "Every sound transmitted under water retains its full strength indefinitely."], "answer": 0, "explanations": ["introduced 為過去分詞修飾 Sound；could 與 minimal 保留能力及小量耗損。", "與 travel thousands of kilometres 相反。", "擴大為所有水下聲音，並將 minimal loss 誤成零耗損與無限持續。"], "tag": "長難句理解", "structure": "主幹 Sound could travel ...；introduced into this channel ... 相當於 that was introduced ...。with minimal loss of signal 表示伴隨狀態，不是完全沒有訊號衰減。"}, {"id": "ocean-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "They developed the Sound Surveillance System (SOSUS), which involved underwater microphones, called hydrophones, that were placed on the ocean bottom and connected by cables to on-shore processing centres.", "target": "", "options": ["SOSUS used underwater microphones on the seabed linked by cables to processing centres on land.", "SOSUS microphones were on land while all processing centres were underwater.", "SOSUS transmitted every signal wirelessly without using cables."], "answer": 0, "explanations": ["which 補充 SOSUS 的構成；that 指水下麥克風的安放與連接方式。", "將麥克風和處理中心的位置交換。", "connected by cables 明確指出以電纜連接。"], "tag": "長難句理解", "structure": "主幹 They developed the Sound Surveillance System；which involved ... 補充系統內容。called hydrophones 是 microphones 的同位補充；that were placed ... and connected ... 共用被動結構。"}, {"id": "ocean-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "It was Christopher Clark of Cornell University who soon realised that SOSUS could be used to listen to whales.", "target": "", "options": ["Christopher Clark recognised that SOSUS could also be used to listen to whales.", "Christopher Clark was the inventor of every component in the SOSUS system.", "SOSUS was originally designed solely for whale research by Christopher Clark."], "answer": 0, "explanations": ["It was ... who ... 強調辨識新用途的人，不是宣稱發明整個系統。", "realised 描述理解用途，無法推成發明全部元件。", "前文是海軍開發系統；此句只說 Clark 發現可用於聽鯨。"], "tag": "長難句理解", "structure": "It was Christopher Clark ... who ... 為人稱強調句；realised 後接 that 名詞子句。could be used 是被動，to listen to whales 說明用途。"}, {"id": "ocean-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "Scientists wishing to observe blue whales must simply wait in their ships for the whales to surface.", "target": "", "options": ["Researchers who want to observe blue whales from ships have to wait for the animals to come up to the surface.", "Researchers can observe blue whales continuously underwater from an ordinary ship.", "Blue whales wait for scientists before deciding whether to surface."], "answer": 0, "explanations": ["wishing 修飾 Scientists；for 後的 whales 才是 surface 的動作者。", "句子強調必須等鯨魚浮出，非可持續直接觀察水下活動。", "顛倒等待者與被等待者，也擅加鯨魚的意圖。"], "tag": "長難句理解", "structure": "主幹 Scientists must wait ...；wishing to observe ... 是現在分詞後位修飾。for the whales to surface 中 surface 為不及物動詞，意為浮出水面。"}, {"id": "ocean-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "Moreover, they can track not just one whale at a time, but many creatures simultaneously.", "target": "", "options": ["The system allows scientists to follow several animals at once rather than just one.", "The system permits tracking only one whale during each research session.", "The system forces different whale species to communicate simultaneously."], "answer": 0, "explanations": ["not just ... but ... 擴大可追蹤的數量；simultaneously 是同時。", "only 與原文 but many 相反。", "track 是研究者追蹤，不是促使動物發聲。"], "tag": "長難句理解", "structure": "主幹 they can track ...；not just one whale at a time, but many creatures simultaneously 為並列受詞與時間方式對照，they 指研究者。"}, {"id": "ocean-paraphrase-16", "mode": "paraphrase", "paragraph": "F", "sentence": "SOSUS has also proved instrumental in obtaining information crucial to our understanding of climate.", "target": "", "options": ["SOSUS has played a significant role in providing information needed to understand climate.", "SOSUS has been used only as a musical instrument for studying climate.", "The climate information obtained through SOSUS has proved irrelevant."], "answer": 0, "explanations": ["instrumental in 表對促成某事有重要作用；crucial 說明資訊重要性。", "把 instrumental 的促成功用誤解為樂器。", "crucial 明確不是 irrelevant。"], "tag": "長難句理解", "structure": "主幹 SOSUS has proved instrumental in obtaining information；crucial to our understanding ... 後位修飾 information。proved 在此為連綴動詞，並非被動被證明的省略。"}, {"id": "ocean-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "For sound waves travelling horizontally in the ocean, speed is largely a function of temperature.", "target": "", "options": ["For sound moving horizontally through the ocean, its speed depends largely on temperature.", "Horizontal sound waves determine ocean temperature entirely on their own.", "The speed of horizontal sound waves is completely unaffected by temperature."], "answer": 0, "explanations": ["a function of 表依變關係，largely 保留非唯一因素的限度。", "把速度依溫度變化的關係倒置，並將 largely 擴為 entirely。", "與 depends largely on temperature 相反。"], "tag": "長難句理解", "structure": "For sound waves travelling ... 設定適用範圍；主幹 speed is largely a function of temperature。travelling horizontally 為分詞修飾 waves，function 在此不是用途。"}, {"id": "ocean-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "Thousands of sound paths in the ocean can be pieced together into a map of global ocean temperatures, and by repeating measurements along the same paths over time, scientists can track changes in temperature over months or years.", "target": "", "options": ["Combining many sound paths and measuring them repeatedly lets scientists map ocean temperatures and follow change over time.", "One sound path measured once reveals every future change in ocean temperature.", "Repeated sound measurements directly prevent ocean temperatures from changing."], "answer": 0, "explanations": ["前半句談拼合全球溫度圖，後半句 by repeating 談長期追蹤。", "many paths 與 repeating 都不能省成單一路徑、單次測量。", "track changes 是監測變化，不是阻止變化。"], "tag": "長難句理解", "structure": "Thousands of sound paths can be pieced together ... 為被動；and 連接第二主句 scientists can track ...。by repeating ... 為方法，along the same paths 確保重複比較的路徑一致。"}, {"id": "ocean-paraphrase-19", "mode": "paraphrase", "paragraph": "G", "sentence": "Since 1985, Nystuen has used hydrophones to listen to rain over the ocean, acoustically measuring not only the rainfall rate but also the rainfall type, ranging from drizzle to thunderstorms.", "target": "", "options": ["The hydrophone research described uses rain sounds to measure both how much rain falls and what type of rain it is.", "The instruments measure rainfall quantity but cannot distinguish rain types.", "Every rainfall type produces exactly the same sound, making classification impossible."], "answer": 0, "explanations": ["not only ... but also ... 連接 rainfall rate 與 rainfall type 兩種資訊。", "刪去 but also the rainfall type 的明確內容。", "本句說可聲學辨識不同類型，並非所有雨聲完全相同。"], "tag": "長難句理解", "structure": "Since 1985 搭配 has used，時間依原文寫作時點；acoustically measuring ... 補充方法。ranging from drizzle to thunderstorms 修飾 rainfall type 的涵蓋範圍。"}, {"id": "ocean-paraphrase-20", "mode": "paraphrase", "paragraph": "G", "sentence": "In this way, modern society continues to benefit from the investigations of those who, like Leonardo da Vinci, pursued the answers to some basic questions of nature.", "target": "", "options": ["Modern society benefits from people who, like da Vinci, investigated basic questions about nature.", "Only da Vinci's own research continues to benefit modern society.", "Modern society benefits because investigators stopped asking questions about nature."], "answer": 0, "explanations": ["those who 指一群探究自然的人；like da Vinci 是舉例而非唯一對象。", "將例子錯當成唯一受益來源。", "pursued 表積極追尋，並不是停止提問。"], "tag": "長難句理解", "structure": "主幹 modern society continues to benefit from the investigations of those；who pursued ... 修飾 those。like Leonardo da Vinci 為插入比較，those 並非僅指達文西一人。"}, {"id": "ocean-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "Techniques for investigating the Moon are the same as techniques for researching the ocean.", "target": "investigating", "options": ["調查、研究", "投資資金", "估算售價"], "answer": 0, "explanations": ["investigating 在此指以方法研究天體。。此處練習題目用語，不表示整句符合原文。", "不是 investing 的投資。", "不是 estimating a price。"], "tag": "題目字彙", "source": "Question 2 · 題目用語"}, {"id": "ocean-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Measuring temperature changes in the ocean using sound is more time-consuming than other methods.", "target": "time-consuming", "options": ["耗費時間的", "不受時間限制的", "時間較精準的"], "answer": 0, "explanations": ["time-consuming 描述某事需要花很多時間。。此處練習題目用語，不表示整句符合原文。", "不代表不限時間。", "不描述計時精準度。"], "tag": "題目字彙", "source": "Question 3 · 題目用語"}, {"id": "ocean-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Hydrophones can distinguish different kinds of rain.", "target": "Hydrophones", "options": ["水下聽音器", "雨水收集槽", "海底攝影機"], "answer": 0, "explanations": ["hydrophones 指在水下接收聲音的儀器。。此處練習題目用語，不表示整句符合原文。", "不是僅收集雨水的容器。", "不是攝影設備。"], "tag": "題目字彙", "source": "Question 4 · 題目用語"}, {"id": "ocean-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Hydrophones can distinguish different kinds of rain.", "target": "distinguish", "options": ["辨別、區分", "強化音量", "消除差異"], "answer": 0, "explanations": ["distinguish 在此是辨認不同種類。。此處練習題目用語，不表示整句符合原文。", "不等於放大聲音。", "辨別差異不等於消除差異。"], "tag": "題目字彙", "source": "Question 4 · 題目用語"}, {"id": "ocean-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "a reference to a long-term study of different types of weather", "target": "long-term study", "options": ["長期研究", "長距離旅行", "即時天氣報告"], "answer": 0, "explanations": ["long-term 指持續時間長，study 是研究。。此處練習題目用語，不表示整句符合原文。", "term 並非距離。", "長期研究不同於單次即時報告。"], "tag": "題目字彙", "source": "Question 8 · 題目用語"}, {"id": "ocean-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "According to the passage, who conducted research into the rate at which sound travels in water?", "target": "conducted research into", "options": ["對……進行研究", "將研究經費轉交給", "指揮……演奏"], "answer": 0, "explanations": ["conduct research into 是進行某議題研究的搭配。。此處練習題目用語，不表示整句符合原文。", "沒有經費轉交的意思。", "conduct 雖可指指揮樂團，此處受詞是 research。"], "tag": "題目字彙", "source": "Question 9 · 題目用語"}, {"id": "ocean-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "According to the passage, who conducted research into the rate at which sound travels in water?", "target": "the rate at which", "options": ["……的速率", "……的收費標準", "……的成功機率"], "answer": 0, "explanations": ["rate 與 sound travels 搭配，指聲音傳播速率。。此處練習題目用語，不表示整句符合原文。", "此語境沒有費用。", "不是研究成功的機率。"], "tag": "題目字彙", "source": "Question 9 · 題目用語"}, {"id": "ocean-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "SOSUS allows whale researchers to imitate whale calls of different species.", "target": "imitate", "options": ["模仿", "抑制", "定位"], "answer": 0, "explanations": ["imitate 是做出相似的聲音或行為。。此處練習題目用語，不表示整句符合原文。", "不是 suppress 的抑制。", "不是 locate 的定位。"], "tag": "題目字彙", "source": "Question 11 · 題目用語"}, {"id": "ocean-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "SOSUS allows whale researchers to protect whales as they migrate.", "target": "migrate", "options": ["遷徙", "繁殖", "被馴養"], "answer": 0, "explanations": ["動物 migrate 是季節性或長距離移動。。此處練習題目用語，不表示整句符合原文。", "繁殖是 reproduce。", "馴養不是 migrate。"], "tag": "題目字彙", "source": "Question 11 · 題目用語"}, {"id": "ocean-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "SOSUS allows scientists to investigate ocean currents.", "target": "ocean currents", "options": ["洋流、海流", "目前的海況", "海洋電力"], "answer": 0, "explanations": ["currents 在海洋語境指水體流動。。此處練習題目用語，不表示整句符合原文。", "current 作形容詞才可指目前的。", "不是電流的語境義。"], "tag": "題目字彙", "source": "Question 13 · 題目用語"}, {"id": "ocean-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "SOSUS allows scientists to measure variations in temperature.", "target": "variations", "options": ["變化、差異", "固定平均值", "預測誤差"], "answer": 0, "explanations": ["variations in temperature 指溫度的變動。。此處練習題目用語，不表示整句符合原文。", "不是固定不變的值。", "未限定為量測或預測錯誤。"], "tag": "題目字彙", "source": "Question 13 · 題目用語"}]}, {"id": "top-managers", "title": "Should top managers be promoted from within the company, or hired from outside?", "sourceTitle": "Should top managers be promoted from within the company, or hired from outside?", "subtitle": "", "part": 2, "topic": "人才招募、組織系統與績效", "sourceNote": "hire the best 是作者先介紹再質疑的主張，不能當成全文結論。研究中的 30%、70% 與 Deming 引述的 90% 屬不同脈絡。A 段補入 philosophy，修正原文 recruitment 用語不完整；時間表述依原文。", "paragraphs": [{"label": "A", "text": "The difference between companies is people. With capital and technology in plentiful supply, the critical resource for companies in the knowledge era will be human talent. Companies full of ‘star’ achievers will, by definition, outperform organisations without them. So firms should compete for the most talented people, attract them from other companies, pay them very well, and get rid of second-raters. This in essence has been the recruitment philosophy of the ambitious companies of the past decade, given definitive form by the consultancy McKinsey in the book The War for Talent. Although the intensity of the warfare subsequently subsided, it has been warming up again as the economy tightens: labour shortages, for example, are the reason that many governments are welcoming workers from abroad."}, {"label": "B", "text": "The diagnosis — people are important — is so obvious it scarcely needs saying, but the apparently logical prescription — hire the best — is, like so much in management, profoundly wrong. The point was illuminated by the collapse of the major American company Enron, whose leaders, as a New Yorker article called ‘The Talent Myth’ related, were so convinced of their own cleverness that they believed that collective intelligence is the sum of a lot of individual intelligences. In fact, in a profound sense the two are opposites. Enron believed in stars, noted author Malcolm Gladwell, because they didn't believe in systems. But companies don't just create: ‘they execute and compete and co-ordinate the efforts of many people, and the organisations that are most successful at that task are the ones where the system is the star.’"}, {"label": "C", "text": "The truth is that a company can't win the talent war by hiring stars — only lose it. New light is thrown on why this should be so by a study of the careers of 1,000 top analysts, published in the Harvard Business Review. The researchers found that when a company recruited a star performer, three things happened."}, {"label": "D", "text": "First, star quality didn't easily transfer from one organisation to another. In many cases, when star performers switched employers, their performance dropped sharply and in some instances never recovered. Few people realise how much success is due to the working environment — systems, processes, leadership, accumulated embedded learning, which are absent in and can't be transported to the new firm. Moreover, precisely because of their past success, stars were unwilling to learn new tricks and antagonised those (on whom they now unknowingly depended) who could teach them. So they left, increasing their salary as they did so — a surprisingly high 36 per cent moved on within three years."}, {"label": "E", "text": "Secondly, the performance of their new team suffered as a result of the tensions and resentment created by their arrival. Hiring a star has been compared to an organ transplant. The new organ can damage others by taking most of the blood supply, other organs can start aching or threaten to stop working, or the body can reject the transplant altogether."}, {"label": "F", "text": "Thirdly, the share price fell, as investors sold stock, evidently to punish the company for its extravagance in spending money on the expensive new appointee. This is ironic, since the motive for importing stars was often to improve the share price."}, {"label": "G", "text": "Everyone accepts the cliché that people make the organisation — but, in fact, to a far greater extent, the organisation makes the people. This is as true in the world of football as in business. Some football clubs buy very good — and very expensive — players, but the team may be less than the sum of its parts. Others put much more emphasis on developing systems: a setting within which less good players can improve, and which helps everyone to form an effective team. These clubs are often more successful than those with the stars. Similarly, a study of the performance of fund managers showed that just 30 per cent of variation in fund performance was due to the individual, compared to 70 per cent to the company-specific setting."}, {"label": "H", "text": "That will be no surprise to those familiar with systems thinking. Deming, the management thinker, used to say that there was no point in criticising people when 90 per cent of performance variation was down to the system within which they worked. Consistent improvement, he said, is a matter not of raising the level of individual intelligence, but of the learning of the organisation as a whole."}, {"label": "I", "text": "So if not by hiring stars, how can a company compete in the war for talent? It should grow its own. Some companies are not only better at creating stars, but also at retaining them. Because they have a much more sophisticated view of the interdependent relationship between star and system, they keep them longer without needing to pay exorbitant salaries. The star system is glamorous — for the few. But companies that use it rarely benefit to the extent that they expect. Bringing in high-paid talent from outside is rarely worthwhile, and the impact can be dire."}], "questions": [{"id": "managers-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "With capital and technology in plentiful supply, the critical resource for companies in the knowledge era will be human talent.", "target": "capital", "options": ["money available for investment or business operations", "the main city of a country", "the total number of employees"], "answer": 0, "explanations": ["此處 capital 表示「資本、營運或投資資金」。須依原句語境理解。", "這個選項表示「首都」；原句要表達的是「資本、營運或投資資金」。", "這個選項表示「員工總數」；原句要表達的是「資本、營運或投資資金」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "With capital and technology in plentiful supply, the critical resource for companies in the knowledge era will be human talent.", "target": "in plentiful supply", "options": ["available in large quantities", "available only to a small elite", "continually declining in quality"], "answer": 0, "explanations": ["此處 in plentiful supply 表示「供應充足」。須依原句語境理解。", "這個選項表示「僅少數菁英能取得」；原句要表達的是「供應充足」。", "這個選項表示「品質不斷下降」；原句要表達的是「供應充足」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "With capital and technology in plentiful supply, the critical resource for companies in the knowledge era will be human talent.", "target": "critical resource", "options": ["an input essential to an organisation's success", "a source of public criticism", "a resource that has no practical use"], "answer": 0, "explanations": ["此處 critical resource 表示「關鍵資源」。須依原句語境理解。", "這個選項表示「公眾批評的來源」；原句要表達的是「關鍵資源」。", "這個選項表示「沒有實際用途的資源」；原句要表達的是「關鍵資源」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "Companies full of ‘star’ achievers will, by definition, outperform organisations without them.", "target": "outperform", "options": ["achieve better results than someone else", "copy another organisation's approach", "perform before a public audience"], "answer": 0, "explanations": ["此處 outperform 表示「表現優於」。須依原句語境理解。", "這個選項表示「模仿其他組織的做法」；原句要表達的是「表現優於」。", "這個選項表示「公開表演」；原句要表達的是「表現優於」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "So firms should compete for the most talented people, attract them from other companies, pay them very well, and get rid of second-raters.", "target": "second-raters", "options": ["people regarded as having inferior ability", "people placed second in a competition", "employees working a second shift"], "answer": 0, "explanations": ["此處 second-raters 表示「被認為能力次一等的人」。須依原句語境理解。", "這個選項表示「比賽中獲得第二名的人」；原句要表達的是「被認為能力次一等的人」。", "這個選項表示「上第二班的員工」；原句要表達的是「被認為能力次一等的人」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "This in essence has been the recruitment philosophy of the ambitious companies of the past decade, given definitive form by the consultancy McKinsey in the book The War for Talent.", "target": "in essence", "options": ["in its most basic nature", "in complete detail", "in an exceptional case"], "answer": 0, "explanations": ["此處 in essence 表示「本質上、大體而言」。須依原句語境理解。", "這個選項表示「完整詳細地」；原句要表達的是「本質上、大體而言」。", "這個選項表示「在例外情況中」；原句要表達的是「本質上、大體而言」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "This in essence has been the recruitment philosophy of the ambitious companies of the past decade, given definitive form by the consultancy McKinsey in the book The War for Talent.", "target": "recruitment philosophy", "options": ["the principles guiding how staff are hired", "a system for dismissing customers", "a method for calculating company taxes"], "answer": 0, "explanations": ["此處 recruitment philosophy 表示「招募理念」。須依原句語境理解。", "這個選項表示「解雇顧客的制度」；原句要表達的是「招募理念」。", "這個選項表示「計算公司稅額的方法」；原句要表達的是「招募理念」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "This in essence has been the recruitment philosophy of the ambitious companies of the past decade, given definitive form by the consultancy McKinsey in the book The War for Talent.", "target": "definitive form", "options": ["a clear and authoritative expression", "a temporary unofficial suggestion", "an uncertain personal guess"], "answer": 0, "explanations": ["此處 definitive form 表示「明確而具代表性的表述」。須依原句語境理解。", "這個選項表示「暫時非正式的建議」；原句要表達的是「明確而具代表性的表述」。", "這個選項表示「不確定的個人猜測」；原句要表達的是「明確而具代表性的表述」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "This in essence has been the recruitment philosophy of the ambitious companies of the past decade, given defini 而立即取得的」；原句要表達的是「逐步累積的」。", "這個選項表示「因過時而刻意丟棄的」；原句要表達的是「逐步累積的」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-26", "mode": "vocab", "paragraph": "D", "sentence": "Few people realise how much success is due to the working environment — systems, processes, leadership, accumulated embedded learning, which are absent in and can't be transported to the new firm.", "target": "embedded learning", "options": ["knowledge built into an organisation's practices and experience", "knowledge learned entirely independently of context", "a short training course for new recruits"], "answer": 0, "explanations": ["此處 embedded learning 表示「內嵌於組織實務與經驗的知識」。須依原句語境理解。", "這個選項表示「完全脫離情境習得的知識」；原句要表達的是「內嵌於組織實務與經驗的知識」。", "這個選項表示「給新進人員的短期訓練」；原句要表達的是「內嵌於組織實務與經驗的知識」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-27", "mode": "vocab", "paragraph": "D", "sentence": "Moreover, precisely because of their past success, stars were unwilling to learn new tricks and antagonised those (on whom they now unknowingly depended) who could teach them.", "target": "antagonised", "options": ["made other people hostile or resentful", "encouraged people to cooperate", "rewarded people for their advice"], "answer": 0, "explanations": ["此處 antagonised 表示「激怒、引起反感」。須依原句語境理解。", "這個選項表示「鼓勵合作」；原句要表達的是「激怒、引起反感」。", "這個選項表示「獎勵他人的建議」；原句要表達的是「激怒、引起反感」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-28", "mode": "vocab", "paragraph": "D", "sentence": "Moreover, precisely because of their past success, stars were unwilling to learn new tricks and antagonised those (on whom they now unknowingly depended) who could teach them.", "target": "unknowingly", "options": ["without being aware of something", "without being able to read", "with a deliberate plan"], "answer": 0, "explanations": ["此處 unknowingly 表示「不知情地、未察覺地」。須依原句語境理解。", "這個選項表示「無法閱讀地」；原句要表達的是「不知情地、未察覺地」。", "這個選項表示「有意計劃地」；原句要表達的是「不知情地、未察覺地」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-29", "mode": "vocab", "paragraph": "D", "sentence": "So they left, increasing their salary as they did so — a surprisingly high 36 per cent moved on within three years.", "target": "moved on", "options": ["left to take another job or opportunity", "received a promotion in the same job", "travelled to another office for a day"], "answer": 0, "explanations": ["此處 moved on 表示「離職轉往下一份工作」。須依原句語境理解。", "這個選項表示「在原工作中獲得晉升」；原句要表達的是「離職轉往下一份工作」。", "這個選項表示「到另一辦公室出差一天」；原句要表達的是「離職轉往下一份工作」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-30", "mode": "vocab", "paragraph": "E", "sentence": "Secondly, the performance of their new team suffered as a result of the tensions and resentment created by their arrival.", "target": "resentment", "options": ["lasting anger caused by perceived unfair treatment", "admiration for someone's achievements", "fear of an unknown physical danger"], "answer": 0, "explanations": ["此處 resentment 表示「因感到不公而產生的怨懟」。須依原句語境理解。", "這個選項表示「對他人成就的欽佩」；原句要表達的是「因感到不公而產生的怨懟」。", "這個選項表示「對未知人身危險的恐懼」；原句要表達的是「因感到不公而產生的怨懟」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-31", "mode": "vocab", "paragraph": "E", "sentence": "Hiring a star has been compared to an organ transplant.", "target": "organ transplant", "options": ["the transfer of an organ into another body", "a medical examination of employees", "the growth of a new organ without surgery"], "answer": 0, "explanations": ["此處 organ transplant 表示「器官移植」。須依原句語境理解。", "這個選項表示「員工健康檢查」；原句要表達的是「器官移植」。", "這個選項表示「不經手術長出新器官」；原句要表達的是「器官移植」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-32", "mode": "vocab", "paragraph": "E", "sentence": "The new organ can damage others by taking most of the blood supply, other organs can start aching or threaten to stop working, or the body can reject the transplant altogether.", "target": "blood supply", "options": ["the flow of blood available to body tissues", "a donation of medical equipment", "a measurement of employee health"], "answer": 0, "explanations": ["此處 blood supply 表示「血液供應」。須依原句語境理解。", "這個選項表示「醫療設備捐贈」；原句要表達的是「血液供應」。", "這個選項表示「員工健康的測量」；原句要表達的是「血液供應」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-33", "mode": "vocab", "paragraph": "E", "sentence": "The new organ can damage others by taking most of the blood supply, other organs can start aching or threaten to stop working, or the body can reject the transplant altogether.", "target": "reject the transplant", "options": ["refuse to accept the newly introduced organ", "remove the organ's need for blood", "increase the organ's supply of oxygen"], "answer": 0, "explanations": ["此處 reject the transplant 表示「排斥移植的器官」。須依原句語境理解。", "這個選項表示「消除器官對血液的需求」；原句要表達的是「排斥移植的器官」。", "這個選項表示「增加器官的氧氣供應」；原句要表達的是「排斥移植的器官」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-34", "mode": "vocab", "paragraph": "F", "sentence": "Thirdly, the share price fell, as investors sold stock, evidently to punish the company for its extravagance in spending money on the expensive new appointee.", "target": "share price", "options": ["the market value of one unit of company ownership", "the cost divided equally among workers", "the salary shared by two managers"], "answer": 0, "explanations": ["此處 share price 表示「股價」。須依原句語境理解。", "這個選項表示「員工均攤的費用」；原句要表達的是「股價」。", "這個選項表示「兩名主管共享的薪水」；原句要表達的是「股價」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-35", "mode": "vocab", "paragraph": "F", "sentence": "Thirdly, the share price fell, as investors sold stock, evidently to punish the company for its extravagance in spending money on the expensive new appointee.", "target": "stock", "options": ["shares representing ownership of a company", "goods stored for later sale", "the ancestry of a person"], "answer": 0, "explanations": ["此處 stock 表示「股票」。須依原句語境理解。", "這個選項表示「庫存商品」；原句要表達的是「股票」。", "這個選項表示「人的血統」；原句要表達的是「股票」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-36", "mode": "vocab", "paragraph": "F", "sentence": "Thirdly, the share price fell, as investors sold stock, evidently to punish the company for its extravagance in spending money on the expensive new appointee.", "target": "extravagance", "options": ["spending more money than is necessary or reasonable", "refusal to spend any money", "failure to keep financial records"], "answer": 0, "explanations": ["此處 extravagance 表示「奢侈、過度花費」。須依原句語境理解。", "這個選項表示「拒絕花錢」；原句要表達的是「奢侈、過度花費」。", "這個選項表示「未保留財務紀錄」；原句要表達的是「奢侈、過度花費」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-37", "mode": "vocab", "paragraph": "F", "sentence": "Thirdly, the share price fell, as investors sold stock, evidently to punish the company for its extravagance in spending money on the expensive new appointee.", "target": "appointee", "options": ["a person selected for a particular job", "a person who selects job applicants", "someone holding an appointment with a doctor"], "answer": 0, "explanations": ["此處 appointee 表示「獲任命的人」。須依原句語境理解。", "這個選項表示「挑選求職者的人」；原句要表達的是「獲任命的人」。", "這個選項表示「預約看醫生的人」；原句要表達的是「獲任命的人」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-38", "mode": "vocab", "paragraph": "F", "sentence": "This is ironic, since the motive for importing stars was often to improve the share price.", "target": "ironic", "options": ["contrary to what was intended or expected", "impossible to explain rationally", "deliberately amusing to everyone involved"], "answer": 0, "explanations": ["此處 ironic 表示「具有諷刺意味的、事與願違的」。須依原句語境理解。", "這個選項表示「完全無法合理解釋的」；原句要表達的是「具有諷刺意味的、事與願違的」。", "這個選項表示「刻意讓所有當事人發笑的」；原句要表達的是「具有諷刺意味的、事與願違的」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-39", "mode": "vocab", "paragraph": "F", "sentence": "This is ironic, since the motive for importing stars was often to improve the share price.", "target": "motive", "options": ["a reason for taking an action", "the eventual outcome of a decision", "a public statement of financial results"], "answer": 0, "explanations": ["此處 motive 表示「動機」。須依原句語境理解。", "這個選項表示「決策的最終結果」；原句要表達的是「動機」。", "這個選項表示「公開財報聲明」；原句要表達的是「動機」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-40", "mode": "vocab", "paragraph": "G", "sentence": "Everyone accepts the cliché that people make the organisation — but, in fact, to a far greater extent, the organisation makes the people.", "target": "cliché", "options": ["an expression or  表示「基金經理人」。須依原句語境理解。", "這個選項表示「僅管理慈善活動的人」；原句要表達的是「基金經理人」。", "這個選項表示「監督工廠生產的主管」；原句要表達的是「基金經理人」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-44", "mode": "vocab", "paragraph": "G", "sentence": "Similarly, a study of the performance of fund managers showed that just 30 per cent of variation in fund performance was due to the individual, compared to 70 per cent to the company-specific setting.", "target": "variation", "options": ["differences in the level of performance", "a guarantee of steady progress", "a complete change of profession"], "answer": 0, "explanations": ["此處 variation 表示「績效上的差異、變異」。須依原句語境理解。", "這個選項表示「穩定進步的保證」；原句要表達的是「績效上的差異、變異」。", "這個選項表示「完全轉換職業」；原句要表達的是「績效上的差異、變異」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-45", "mode": "vocab", "paragraph": "G", "sentence": "Similarly, a study of the performance of fund managers showed that just 30 per cent of variation in fund performance was due to the individual, compared to 70 per cent to the company-specific setting.", "target": "company-specific", "options": ["particular to one organisation", "identical across all companies", "focused on a single employee only"], "answer": 0, "explanations": ["此處 company-specific 表示「某公司特有的」。須依原句語境理解。", "這個選項表示「所有公司都相同的」；原句要表達的是「某公司特有的」。", "這個選項表示「只針對一名員工的」；原句要表達的是「某公司特有的」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-46", "mode": "vocab", "paragraph": "H", "sentence": "That will be no surprise to those familiar with systems thinking.", "target": "systems thinking", "options": ["an approach that examines how interacting parts form a whole", "a method of ranking isolated individuals", "thinking without considering relationships"], "answer": 0, "explanations": ["此處 systems thinking 表示「系統思考」。須依原句語境理解。", "這個選項表示「為孤立個人排名的方法」；原句要表達的是「系統思考」。", "這個選項表示「不考慮關聯的思考」；原句要表達的是「系統思考」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-47", "mode": "vocab", "paragraph": "H", "sentence": "Deming, the management thinker, used to say that there was no point in criticising people when 90 per cent of performance variation was down to the system within which they worked.", "target": "was down to", "options": ["was caused by or attributable to", "was reduced to a lower amount", "was assigned to a junior employee"], "answer": 0, "explanations": ["此處 was down to 表示「歸因於、由某因素造成」。須依原句語境理解。", "這個選項表示「被減少至較低數量」；原句要表達的是「歸因於、由某因素造成」。", "這個選項表示「被交派給初階員工」；原句要表達的是「歸因於、由某因素造成」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-48", "mode": "vocab", "paragraph": "H", "sentence": "Consistent improvement, he said, is a matter not of raising the level of individual intelligence, but of the learning of the organisation as a whole.", "target": "Consistent improvement", "options": ["steady and continuing progress", "a sudden temporary rise in performance", "exactly the same performance every year"], "answer": 0, "explanations": ["此處 Consistent improvement 表示「持續穩定的改善」。須依原句語境理解。", "這個選項表示「突然且暫時的績效提升」；原句要表達的是「持續穩定的改善」。", "這個選項表示「每年完全相同的績效」；原句要表達的是「持續穩定的改善」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-49", "mode": "vocab", "paragraph": "H", "sentence": "Consistent improvement, he said, is a matter not of raising the level of individual intelligence, but of the learning of the organisation as a whole.", "target": "as a whole", "options": ["considered as one complete unit", "without allowing any disagreement", "with every worker acting independently"], "answer": 0, "explanations": ["此處 as a whole 表示「作為整體」。須依原句語境理解。", "這個選項表示「不容許任何異議」；原句要表達的是「作為整體」。", "這個選項表示「每名員工獨立行動地」；原句要表達的是「作為整體」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-50", "mode": "vocab", "paragraph": "I", "sentence": "It should grow its own.", "target": "grow its own", "options": ["develop talented people within the organisation", "produce its own physical goods", "hire only people who already own shares"], "answer": 0, "explanations": ["此處 grow its own 表示「自行培養內部人才」。須依原句語境理解。", "這個選項表示「自行生產實體商品」；原句要表達的是「自行培養內部人才」。", "這個選項表示「僅聘用已有股份的人」；原句要表達的是「自行培養內部人才」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-51", "mode": "vocab", "paragraph": "I", "sentence": "Some companies are not only better at creating stars, but also at retaining them.", "target": "retaining", "options": ["keeping valued employees in the organisation", "holding back salary payments", "replacing workers with outside candidates"], "answer": 0, "explanations": ["此處 retaining 表示「留住人才」。須依原句語境理解。", "這個選項表示「扣住薪資不發」；原句要表達的是「留住人才」。", "這個選項表示「以外部人選取代員工」；原句要表達的是「留住人才」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-52", "mode": "vocab", "paragraph": "I", "sentence": "Because they have a much more sophisticated view of the interdependent relationship between star and system, they keep them longer without needing to pay exorbitant salaries.", "target": "sophisticated", "options": ["based on a complex and well-developed understanding", "deliberately misleading", "simple enough to ignore context"], "answer": 0, "explanations": ["此處 sophisticated 表示「成熟精細、周延的」。須依原句語境理解。", "這個選項表示「刻意誤導的」；原句要表達的是「成熟精細、周延的」。", "這個選項表示「簡單到無須考量情境的」；原句要表達的是「成熟精細、周延的」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-53", "mode": "vocab", "paragraph": "I", "sentence": "Because they have a much more sophisticated view of the interdependent relationship between star and system, they keep them longer without needing to pay exorbitant salaries.", "target": "interdependent", "options": ["depending on and influencing each other", "functioning without any connection", "competing until one side disappears"], "answer": 0, "explanations": ["此處 interdependent 表示「相互依存的」。須依原句語境理解。", "這個選項表示「完全沒有關聯地運作的」；原句要表達的是「相互依存的」。", "這個選項表示「競爭到一方消失的」；原句要表達的是「相互依存的」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-54", "mode": "vocab", "paragraph": "I", "sentence": "Because they have a much more sophisticated view of the interdependent relationship between star and system, they keep them longer without needing to pay exorbitant salaries.", "target": "exorbitant", "options": ["unreasonably high", "exactly equal to average pay", "paid only after retirement"], "answer": 0, "explanations": ["此處 exorbitant 表示「高得離譜的、過高的」。須依原句語境理解。", "這個選項表示「恰等於平均薪資的」；原句要表達的是「高得離譜的、過高的」。", "這個選項表示「退休後才支付的」；原句要表達的是「高得離譜的、過高的」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-55", "mode": "vocab", "paragraph": "I", "sentence": "The star system is glamorous — for the few.", "target": "glamorous", "options": ["appealing because of an exciting or prestigious image", "effective in every situation", "hidden from outside observers"], "answer": 0, "explanations": ["此處 glamorous 表示「光鮮亮麗、令人嚮往的」。須依原句語境理解。", "這個選項表示「在所有情況都有效的」；原句要表達的是「光鮮亮麗、令人嚮往的」。", "這個選項表示「不讓外人看見的」；原句要表達的是「光鮮亮麗、令人嚮往的」。"], "tag": "字彙與語境義"}, {"id": "managers-vocab-56", "mode": "vocab", "paragraph": "I", "sentence": "But companies that use it rarely benefit to the extent that they expect.", "target": "to the extent that", "options": ["to the degree that", "for the sole reason that", "up to the moment when"], "answer": 0, "explanations": ["此處 to the extent that 表示「達到……的程度」。須依原句語境理解。", "這個選項表示「僅因為」；原句要表達的是「達到……的程度」。", "這個選項表示「直到某個時刻」；原句要表達的是「達到……的程度」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-57", "mode": "vocab", "paragraph": "I", "sentence": "Bringing in high-paid talent from outside is rarely worthwhile, and the impact can be dire.", "target": "Bringing in", "options": ["recruiting people from outside", "taking people to an indoor meeting", "forcing existing employees to resign"], "answer": 0, "explanations": ["此處 Bringing in 表示「引進、延攬人才」。須依原句語境理解。", "這個選項表示「帶人到室內開會」；原句要表達的是「引進、延攬人才」。", "這個選項表示「強迫現有員工辭職」；原句要表達的是「引進、延攬人才」。"], "tag": "搭配與語境義"}, {"id": "managers-vocab-58", "mode": "vocab", "paragraph": "I", "sentence": "Bringing in high-paid talent from outside is rarely worthwhile, and the impact can be dire.", "target": "dire", "options": ["extremely serious or harmful", "slightly inconvenient", "entirely predictable"], "answer": 0, "explanations": ["此處 dire 表示「嚴重、糟糕的」。須依原句語境理解。", "這個選項表示「稍微不便的」；原句要表達的是「嚴重、糟糕的」。", "這個選項表示「完全可預測的」；原句要表達的是「嚴重、糟糕的」。"], "tag": "字彙與語境義"}, {"id": "managers-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "With capital and technology in plentiful supply, the critical resource for companies in the knowledge era will be human talent.", "target": "", "options": ["The argument introduced here treats human talent as the key resource when capital and technology are readily available.", "The argument says human talent is irrelevant whenever capital is abundant.", "The argument says companies in the knowledge era have no access to technology."], "answer": 0, "explanations": ["With 結構提供背景，主句將人才列為關鍵；這是作者先介紹的主張。", "關鍵資源是人才，不是人才無關緊要。", "in plentiful supply 表供應充足，並非無法取得。"], "tag": "長難句理解", "structure": "With capital and technology in plentiful supply 為 with＋名詞＋介系詞片語的背景結構；主句主詞 the critical resource ...，補語為 human talent。留意此處仍在引介待討論的觀點。"}, {"id": "managers-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "Companies full of ‘star’ achievers will, by definition, outperform organisations without them.", "target": "", "options": ["The initial argument assumes that organisations with star achievers perform better than those without them.", "The initial argument says star achievers perform best when working without organisations.", "The initial argument concludes that every successful company has no need for talented people."], "answer": 0, "explanations": ["without them 指沒有明星人才的公司；outperform 是比較組織績效。", "without them 修飾 organisations，不是說人才離開組織工作。", "將全文稍後批評明星制度的立場過度推成不需要人才。"], "tag": "長難句理解", "structure": "Companies full of ‘star’ achievers 為主詞，full of ... 作後位修飾；will outperform ... 為謂語。organisations without them 中 them 回指 star achievers。"}, {"id": "managers-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "This in essence has been the recruitment philosophy of the ambitious companies of the past decade, given definitive form by the consultancy McKinsey in the book The War for Talent.", "target": "", "options": ["McKinsey's book clearly expressed the recruitment philosophy followed by ambitious companies.", "McKinsey's book proved that the philosophy succeeds in every organisation.", "The book describes a philosophy that no company had previously followed."], "answer": 0, "explanations": ["given definitive form 補充理念得到明確表述，不代表實證其普遍正確。", "表述一套主張與證明每家公司都適用並不相同。", "has been 表示此前已在採用，不能推成從未被使用。"], "tag": "長難句理解", "structure": "主幹 This ... has been the recruitment philosophy ...；given definitive form by ... 為過去分詞補充，說明這套理念如何被具體表述。This 回指前句列出的挖角、厚薪與淘汰做法。"}, {"id": "managers-paraphrase-4", "mode": "paraphrase", "paragraph": "A", "sentence": "Although the intensity of the warfare subsequently subsided, it has been warming up again as the economy tightens: labour shortages, for example, are the reason that many governments are welcoming workers from abroad.", "target": "", "options": ["Competition for talent became less intense for a time but later strengthened again as labour became scarcer.", "Competition for talent permanently ended once the warfare subsided.", "Governments welcomed foreign workers because they already had too many workers."], "answer": 0, "explanations": ["Although 表讓步，subsided 與 warming up again 對照先降溫後升溫。", "again 表示再次加劇，不能解為永久結束。", "labour shortages 是缺工，與勞工過多相反。"], "tag": "長難句理解", "structure": "Although 引出先前強度減弱的讓步子句；主句 it has been warming up again，it 指人才爭奪。as the economy tightens 為背景原因，冒號後以缺工解釋。"}, {"id": "managers-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "The diagnosis — people are important — is so obvious it scarcely needs saying, but the apparently logical prescription — hire the best — is, like so much in management, profoundly wrong.", "target": "", "options": ["The author accepts that people matter but rejects hiring the best individuals as an adequate solution.", "The author rejects both the importance of people and the need for effective management.", "The author argues that hiring outstanding individuals is always the correct management solution."], "answer": 0, "explanations": ["but 區分作者認同的診斷與否定的處方。", "前半句明說 people are important 如此明顯，作者並未否認。", "後半句 profoundly wrong 正是否定此推論。"], "tag": "長難句理解", "structure": "The diagnosis ... is so obvious ... 與 the ... prescription ... is ... wrong 為 but 連接的兩主句。兩組破折號分別解釋 diagnosis、prescription；like so much in management 為插入語。"}, {"id": "managers-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "The point was illuminated by the collapse of the major American company Enron, whose leaders, as a New Yorker article called ‘The Talent Myth’ related, were so convinced of their own cleverness that they believed that collective intelligence is the sum of a lot of individual intelligences.", "target": "", "options": ["Enron illustrates leaders' mistaken belief that a group's intelligence simply equals the total intelligence of its individuals.", "Enron's leaders believed individual intelligence played no role at all in company performance.", "The article establishes as a fact that collective intelligence is just the sum of individual intelligence."], "answer": 0, "explanations": ["whose 指 Enron 的領導者；that 後是他們的信念，不是作者認可的事實。", "原文不是否認個人智慧，而是過度相信可直接加總。", "believed 的內容正是作者批判的想法，不能當成文章結論。"], "tag": "長難句理解", "structure": "主句 The point was illuminated by the collapse ...；whose leaders were so convinced ... that they believed ... 為關係子句。as ... related 是插入報導來源；so ... that ... 表程度及結果。"}, {"id": "managers-paraphrase-7", "mode": "paraphrase", "paragraph": "B", "sentence": "But companies don't just create: ‘they execute and compete and co-ordinate the efforts of many people, and the organisations that are most successful at that task are the ones where the system is the star.’", "target": "", "options": ["The quoted view stresses that organisations must coordinate many people's work, making the system central to success.", "The quoted view says a company succeeds only when one star works independently of all others.", "The quoted view treats creativity as the only activity a company needs."], "answer": 0, "explanations": ["don't just create 擴大到執行、競爭與協調；system is the star 是比喻。", "原文核心正是多人協調與系統，並非孤立明星。", "don't just 明確表示不僅僅是創造。"], "tag": "長難句理解", "structure": "But companies don't just create 後以冒號引述補充；they execute and compete and co-ordinate ... 為並列動詞。where the system is the star 修飾 the ones，ones 代 organisations。"}, {"id": "managers-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "The truth is that a company can't win the talent war by hiring stars — only lose it.", "target": "", "options": ["The author argues that hiring stars can lose the talent war for a company rather than win it.", "The author says a company wins the talent war as soon as it hires enough stars.", "The author says companies should dismiss all capable employees immediately."], "answer": 0, "explanations": ["破折號後省略 can，保留作者對此招募策略的強烈批評。", "將 can't win 誤讀成可保證取勝。", "反對以挖角明星取勝不等於主張解雇所有能幹員工。"], "tag": "長難句理解", "structure": "主幹 The truth is that ...；that 名詞子句為補語。can't win ... by hiring stars — only lose it 中 lose 前省略 can，it 回指 the talent war，不是指明星員工。"}, {"id": "managers-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "New light is thrown on why this should be so by a study of the careers of 1,000 top analysts, published in the Harvard Business Review.", "target": "", "options": ["A study of top analysts' careers offers an explanation for why the star-hiring strategy may fail.", "The researchers studied 1,000 companies and proved that every business must fail.", "The study explains how to recruit analysts without examining their careers."], "answer": 0, "explanations": ["by 引出提供理解的研究；1,000 修飾 analysts，而非公司數。", "研究對象數目與單位錯誤，也將主張擴至所有企業。", "研究明確是 careers of ... analysts，不是無視其職涯。"], "tag": "長難句理解", "structure": "New light is thrown on ... by a study ... 為被動比喻；why this should be so 為 on 的名詞子句受詞。published in ... 為 study 的過去分詞補充，this 回指前句的招募策略失敗論點。"}, {"id": "managers-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "In many cases, when star performers switched employers, their performance dropped sharply and in some instances never recovered.", "target": "", "options": ["After changing employers, star performers often suffered a sharp drop in performance, sometimes permanently.", "Every star performer improved immediately after changing employer.", "All star performers suffered exactly the same permanent loss in performance."], "answer": 0, "explanations": ["many cases 與 some instances 限定範圍，不能改寫成所有人皆如此。", "與 performance dropped sharply 方向相反。", "原文未說 everyone，也未說所有下降幅度一致或都不恢復。"], "tag": "長難句理解", "structure": "when star performers switched employers 為時間子句；主幹 their performance dropped ... and ... never recovered。in many cases 範圍大於 in some instances，後者僅限定 never recovered。"}, {"id": "managers-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Few people realise how much success is due to the working environment — systems, processes, leadership, accumulated embedded learning, which are absent in and can't be transported to the new firm.", "target": "", "options": ["Much success depends on organisational resources and learning that do not simply move with the employee to a new firm.", "All success belongs exclusively to individual talent and is unaffected by context.", "The new employer automatically receives all the previous company's accumulated learning."], "answer": 0, "explanations": ["how much 引出成功受環境支持的程度，which 補充那些組織條件無法直接搬走。", "忽略 due to the working environment 的核心主張。", "原文說 absent in and can't be transported，非自動轉移。"], "tag": "長難句理解", "structure": "Few people realise 後接 how much success is due to ...；破折號列出環境成分。which are absent in and can't be transported to ... 共同修飾前列條件；much 不能擴成 all。"}, {"id": "managers-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "Moreover, precisely because of their past success, stars were unwilling to learn new tricks and antagonised those (on whom they now unknowingly depended) who could teach them.", "target": "", "options": ["Because of their earlier success, the stars resisted learning and alienated the very people whose help they now needed.", "The stars willingly learned from colleagues because they knew they depended on them.", "The colleagues refused to teach the stars because they had never possessed useful knowledge."], "answer": 0, "explanations": ["because 說明自恃成功而抗拒學習；those 同時是可教導、又被依賴的人。", "unwilling 與 unknowingly 排除主動理解並欣然學習的說法。", "who could teach them 表那些人有能力教導，沒有說從無有用知識。"], "tag": "長難句理解", "structure": "主句 stars were unwilling ... and antagonised those ...；on whom they ... depended 與 who could teach them 都修飾 those。them 指明星人才，precisely because ... 強調其反常原因。"}, {"id": "managers-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "So they left, increasing their salary as they did so — a surprisingly high 36 per cent moved on within three years.", "target": "", "options": ["Many stars subsequently left, gaining higher pay as they moved; 36 per cent departed within three years.", "Every star remained with the new firm for at least three years.", "Thirty-six per cent accepted lower salaries in order to stay."], "answer": 0, "explanations": ["So 接前文導向離職；increasing ... 描述離開轉職時薪水提高。", "36 per cent moved on within three years 排除人人留滿三年。", "原文是薪資上升與離職，非降薪留任。"], "tag": "長難句理解", "structure": "主幹 they left；increasing their salary ... 是伴隨分詞構句，as they did so 中 so 指離開轉職。破折號後用 36 per cent 補數據，within three years 表三年內。"}, {"id": "managers-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "Secondly, the performance of their new team suffered as a result of the tensions and resentment created by their arrival.", "target": "", "options": ["The stars' arrival harmed the new team's performance by creating tension and resentment.", "Existing teams improved because all members welcomed the stars without resentment.", "The stars' poor personal performance had no effect on anyone else."], "answer": 0, "explanations": ["as a result of 表原因；created by their arrival 修飾 tensions and resentment。", "原文明說團隊受損且產生怨懟，並非一致歡迎。", "本段的重點是新團隊也受影響，不能改成其他人不受影響。"], "tag": "長難句理解", "structure": "主幹 the performance of their new team suffered；as a result of ... 引出原因。created by their arrival 是過去分詞修飾並列名詞，their 指新來的明星員工。"}, {"id": "managers-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "Hiring a star has been compared to an organ transplant. The new organ can damage others by taking most of the blood supply, other organs can start aching or threaten to stop working, or the body can reject the transplant altogether.", "target": "", "options": ["The comparison suggests that introducing a star can disrupt or be rejected by an existing organisation, much like a transplanted organ in a body.", "The comparison says all organisations inevitably reject every newcomer.", "The comparison says recruiting a star is a medical procedure performed on employees."], "answer": 0, "explanations": ["can 表示可能，器官比喻承接引進明星對原團隊的衝擊。", "can damage 或 can reject 皆非必然，不能擴成所有新進人員皆遭排斥。", "這是類比說明組織問題，不是字面的醫療處置。"], "tag": "長難句理解", "structure": "Hiring a star has been compared to an organ transplant 為被動類比句；Hiring a star 為動名詞主詞。compare A to B 將人才引進比作器官移植，後句展開資源排擠與排斥的可能性。"}, {"id": "managers-paraphrase-16", "mode": "paraphrase", "paragraph": "F", "sentence": "Thirdly, the share price fell, as investors sold stock, evidently to punish the company for its extravagance in spending money on the expensive new appointee.", "target": "", "options": ["Investors sold shares, apparently objecting to expensive recruitment, so the share price fell.", "Investors bought more shares to reward the company for its costly new recruit.", "The company reduced the new recruit's salary because its stock of goods fell."], "answer": 0, "explanations": ["as 表原因，evidently 保留作者對投資人動機的判斷。", "sold 與 fell 都被倒轉，punish 也被誤成獎勵。", "stock 在此為股票；句子未說減薪或商品庫存下降。"], "tag": "長難句理解", "structure": "主幹 the share price fell；as investors sold stock 為原因子句。evidently to punish ... 解釋出售動機；for its extravagance ... 說明被懲罰的原因，its 指公司。"}, {"id": "managers-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "This is ironic, since the motive for importing stars was often to improve the share price.", "target": "", "options": ["The outcome was ironic because hiring stars was often intended to raise the share price, yet the price fell.", "Hiring stars reduced the share price exactly as the companies had intended.", "The author finds it ironic that the companies never cared about their share prices."], "answer": 0, "explanations": ["This 回指股價下跌，since 說明與原意相反之處。", "目的 improve 與結果 fell 相反，不是刻意造成下跌。", "motive ... to improve the share price 明確表示在乎股價。"], "tag": "長難句理解", "structure": "This is ironic 為主句，This 回指前句結果；since the motive ... was ... 引出原因。importing stars 是引進外部人才的比喻，不是進口實體物品。"}, {"id": "managers-paraphrase-18", "mode": "paraphrase", "paragraph": "G", "sentence": "Everyone accepts the cliché that people make the organisation — but, in fact, to a far greater extent, the organisation makes the people.", "target": "", "options": ["The author reverses a familiar saying, arguing that organisations shape people even more than people shape organisations.", "The author says people shape organisations but organisations have no effect on people.", "The author concludes that the two influences are exactly equal in strength."], "answer": 0, "explanations": ["but 對比常見說法與作者強調，to a far greater extent 比較影響程度。", "後半句明說 organisation makes the people。", "far greater extent 表影響更大，不是相等。"], "tag": "長難句理解", "structure": "Everyone accepts 後接 that 名詞子句；but 引入主句 the organisation makes the people。make 在此是塑造的比喻，不是製造人；to a far greater extent 修飾後一方向的影響。"}, {"id": "managers-paraphrase-19", "mode": "paraphrase", "paragraph": "G", "sentence": "Others put much more emphasis on developing systems: a setting within which less good players can improve, and which helps everyone to form an effective team.", "target": "", "options": ["Some clubs develop systems in which less outstanding players can improve and everyone can work effectively as a team.", "Some clubs focus exclusively on buying famous players and avoid developing team systems.", "A system helps only weaker players while preventing other players from cooperating."], "answer": 0, "explanations": ["Others 對照前述買明星的俱樂部；兩個 which 子句說明系統的作用。", "原句強調 developing systems，與避免建立系統相反。", "helps everyone 表幫助所有人組隊，不是妨礙其他人合作。"], "tag": "長難句理解", "structure": "Others put ... emphasis on developing systems 為主幹；冒號後 a setting 解釋 systems。within which ... 與 which helps ... 修飾 setting，前者強調環境，後者強調促成團隊的功能。"}, {"id": "managers-paraphrase-20", "mode": "paraphrase", "paragraph": "G", "sentence": "Similarly, a study of the performance of fund managers showed that just 30 per cent of variation in fund performance was due to the individual, compared to 70 per cent to the company-specific setting.", "target": "", "options": ["The fund-manager study attributed a larger share of performance variation to the company setting than to the individual.", "The study found that every fund manager earned exactly 30 per cent profit.", "The study attributed 70 per cent of variation to individuals and 30 per cent to companies."], "answer": 0, "explanations": ["30% 與 70% 分配的是績效差異的歸因，而非獲利率。", "variation in performance 不是基金的報酬率。", "顛倒個人與公司環境的歸因比例。"], "tag": "長難句理解", "structure": "主句 a study ... showed that ...；that 子句主詞為 just 30 per cent of variation ...。compared to 70 per cent to ... 省略 was due，需補回比較兩種歸因；不能與 H 段另一引述的 90% 混用。"}, {"id": "managers-paraphrase-21", "mode": "paraphrase", "paragraph": "H", "sentence": "Deming, the management thinker, used to say that there was no point in criticising people when 90 per cent of performance variation was down to the system within which they worked.", "target": "", "options": ["Deming argued that blaming individuals made little sense when the system accounted for most performance variation.", "Deming argued that every individual should be blamed for every failure regardless of the system.", "Deming said individuals alone caused 90 per cent of performance variation."], "answer": 0, "explanations": ["no point in 否定責備個人的合理性；was down to 表歸因。", "忽略 no point 與系統因素的核心。", "90% 指系統，非個人，且是引述 Deming 的看法。"], "tag": "長難句理解", "structure": "Deming used to say that ... 為引述；there was no point in criticising ... 中 in 後接動名詞。when 交代判斷背景；within which they worked 修飾 system，they 指 people。"}, {"id": "managers-paraphrase-22", "mode": "paraphrase", "paragraph": "H", "sentence": "Consistent improvement, he said, is a matter not of raising the level of individual intelligence, but of the learning of the organisation as a whole.", "target": "", "options": ["In Deming's view, steady improvement depends on organisational learning rather than merely increasing individuals' intelligence.", "Deming said organisational learning is irrelevant and only personal intelligence should be raised.", "Deming said all forms of individual learning must be prohibited."], "answer": 0, "explanations": ["not of A but of B 對照改善的重點，he said 標示觀點來源。", "將 not A but B 的方向完全顛倒。", "強調組織學習不等於禁止任何個人學習。"], "tag": "長難句理解", "structure": "主幹 Consistent improvement is a matter ...；he said 為插入語。not of raising ... but of the learning ... 平行對照；as a whole 修飾 organisation，指組織整體。"}, {"id": "managers-paraphrase-23", "mode": "paraphrase", "paragraph": "I", "sentence": "So if not by hiring stars, how can a company compete in the war for talent? It should grow its own.", "target": "", "options": ["Instead of relying on outside stars, the company should develop talented staff internally.", "The company should produce all its own goods instead of employing talented staff.", "The company should hire only stars who have already worked for a rival."], "answer": 0, "explanations": ["its own 省略人才概念，承接前句 hiring stars 的問題。", "把人才培養的比喻誤解為製造產品。", "grow its own 與依賴外部現成人才的做法相反。"], "tag": "長難句理解", "structure": "It should grow its own 為簡短回答；It 指 a company，its own 省略 own talent 或 stars。grow 為培養的比喻，應和前句 if not by hiring stars 一起理解。"}, {"id": "managers-paraphrase-24", "mode": "paraphrase", "paragraph": "I", "sentence": "Because they have a much more sophisticated view of the interdependent relationship between star and system, they keep them longer without needing to pay exorbitant salaries.", "target": "", "options": ["Companies with a developed understanding of the relationship between people and systems can retain talent longer without excessive salaries.", "These companies retain staff only because they pay the highest possible salaries.", "Talented people and organisational systems are completely independent, so salaries do not matter."], "answer": 0, "explanations": ["Because 引出理解互相依存關係的原因，without 指無須靠過高薪酬。", "without needing to pay exorbitant salaries 正是否定這個原因。", "interdependent 明確表示相互依存，且非主張薪資完全無關。"], "tag": "長難句理解", "structure": "Because they have ... 為原因子句；主句 they keep them longer，they 指公司、them 指人才。without needing to pay ... 表無須採取的手段，between star and system 界定關係雙方。"}, {"id": "managers-paraphrase-25", "mode": "paraphrase", "paragraph": "I", "sentence": "The star system is glamorous — for the few. But companies that use it rarely benefit to the extent that they expect.", "target": "", "options": ["Companies using the star system seldom gain as much as they expect.", "Companies never gain any benefit at all from the star system.", "The star system nearly always delivers more than companies expect."], "answer": 0, "explanations": ["to the extent that they expect 比較實際受益程度與預期；rarely 不等於 never。", "將較少達到預期擴成完全從不受益。", "將未達預期的方向倒轉。"], "tag": "長難句理解", "structure": "主幹 companies rarely benefit ...；that use it 修飾 companies，it 指 star system。to the extent that they expect 中 that 引出程度子句，不能將整句縮為絕對無效。"}, {"id": "managers-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "an example of the importance of systems in a non-business context", "target": "non-business context", "options": ["非商業情境", "公司內部的財務制度", "不涉及溝通的情境"], "answer": 0, "explanations": ["non-business 表商業領域以外，context 是情境。。此處練習題目用語，不表示整句符合原文。", "與財務制度不同。", "business 與溝通與否不是同一分類。"], "tag": "題目字彙", "source": "Question 14 · 題目用語"}, {"id": "managers-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "advice on how businesses can acquire the best people", "target": "acquire", "options": ["取得、延攬", "評分", "排除"], "answer": 0, "explanations": ["企業 acquire people 是取得人才、延攬人才。。此處練習題目用語，不表示整句符合原文。", "不是替人評分。", "不是排除人才。"], "tag": "題目字彙", "source": "Question 15 · 題目用語"}, {"id": "managers-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "a medical analogy to a star joining another company", "target": "analogy", "options": ["類比、比喻性的比較", "診斷結果", "毫無關係的巧合"], "answer": 0, "explanations": ["analogy 以不同事物的相似結構作說明。。此處練習題目用語，不表示整句符合原文。", "medical 不使 analogy 變成實際診斷。", "類比有比較關係，不是毫無關聯。"], "tag": "題目字彙", "source": "Question 16 · 題目用語"}, {"id": "managers-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "a claim that stars may not make necessary adaptations when they change companies", "target": "adaptations", "options": ["適應上的調整", "公開道歉", "薪資補償"], "answer": 0, "explanations": ["adaptations 在換公司語境指配合新環境的改變。。此處練習題目用語，不表示整句符合原文。", "道歉是 apologies。", "補償是 compensation。"], "tag": "題目字彙", "source": "Question 17 · 題目用語"}, {"id": "managers-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "an example of a company that suffered from a misplaced belief in the talents of its senior managers", "target": "misplaced belief", "options": ["不恰當、放錯對象的信念", "被遺忘的信念", "尚未公開的信念"], "answer": 0, "explanations": ["misplaced 說信任或信念給錯地方或不合情理。。此處練習題目用語，不表示整句符合原文。", "不是遺忘。", "不是是否公開。"], "tag": "題目字彙", "source": "Question 18 · 題目用語"}, {"id": "managers-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "an example of a company that suffered from a misplaced belief in the talents of its senior managers", "target": "senior managers", "options": ["高階主管", "年齡最大的所有員工", "退休後的顧問"], "answer": 0, "explanations": ["senior 在職務中指位階較高。。此處練習題目用語，不表示整句符合原文。", "不單純指年齡。", "沒有已退休之意。"], "tag": "題目字彙", "source": "Question 18 · 題目用語"}, {"id": "managers-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "The stars often failed to maintain their performance.", "target": "maintain their performance", "options": ["維持原有表現", "修理工作設備", "訂立績效標準"], "answer": 0, "explanations": ["maintain performance 是使表現保持水準。。此處練習題目用語，不表示整句符合原文。", "maintain 在此非維修器材。", "維持與訂立標準不同。"], "tag": "題目字彙", "source": "Question 19–22 · 題目用語"}, {"id": "managers-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Secondly, there was often a negative effect on co-workers in their [...] at the new company.", "target": "co-workers", "options": ["同事", "競爭公司的投資者", "應徵者"], "answer": 0, "explanations": ["co-workers 是一起工作的人。。此處練習題目用語，不表示整句符合原文。", "不是外部投資者。", "不是尚未受僱的求職者。"], "tag": "題目字彙", "source": "Question 19–22 · 題目用語"}, {"id": "managers-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "Thirdly, investors reduced their commitment to the company.", "target": "commitment", "options": ["投入、支持的程度", "具有法律效力的判決", "求職面試的預約"], "answer": 0, "explanations": ["投資人對公司的 commitment 指持續投入與支持。。此處練習題目用語，不表示整句符合原文。", "不是法律判決。", "不是預約時間。"], "tag": "題目字彙", "source": "Question 19–22 · 題目用語"}, {"id": "managers-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "The War for Talent had a greater impact than its authors had expected.", "target": "impact", "options": ["影響", "銷售單價", "寫作篇幅"], "answer": 0, "explanations": ["impact 在此指作品帶來的影響。。此處練習題目用語，不表示整句符合原文。", "未必與價格有關。", "不是文章字數。"], "tag": "題目字彙", "source": "Question 23 · 題目用語"}, {"id": "managers-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "The economic situation of certain countries is leading to growing demand for foreign staff.", "target": "growing demand", "options": ["不斷增加的需求", "正在下降的供給", "已被滿足的要求"], "answer": 0, "explanations": ["growing 修飾 demand，指需求持續增加。。此處練習題目用語，不表示整句符合原文。", "不是供給減少的字面意思。", "未表示需求已滿足。"], "tag": "題目字彙", "source": "Question 24 · 題目用語"}, {"id": "managers-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "Enron failed through misfortune ra
