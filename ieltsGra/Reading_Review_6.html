more.", "target": "anticipation", "options": ["expectation of what will come next", "knowledge only of the distant past", "a deliberate refusal to listen"], "answer": 0, "explanations": ["此處 anticipation 表示「預期、期待」。須依原句語境理解。", "這個選項表示「僅知遙遠過去」；原句要表達的是「預期、期待」。", "這個選項表示「刻意拒絕聽」；原句要表達的是「預期、期待」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-49", "mode": "vocab", "paragraph": "G", "sentence": "‘Repetition leads to familiarity which leads to anticipation, which is satisfied by hearing the song,’ says John Seabrook, author of The Song Machine: Inside the Hit Factory, about how producers pump pop songs full of aural ‘hooks’, the punchy melodic phrases designed to target the brain and leave it wanting more.", "target": "aural ‘hooks’", "options": ["memorable sound patterns designed to catch attention", "physical hooks worn on the ear", "visual patterns only"], "answer": 0, "explanations": ["此處 aural ‘hooks’ 表示「抓耳、易記的聽覺鉤子」。須依原句語境理解。", "這個選項表示「戴在耳上的實體鉤子」；原句要表達的是「抓耳、易記的聽覺鉤子」。", "這個選項表示「僅視覺圖案」；原句要表達的是「抓耳、易記的聽覺鉤子」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-50", "mode": "vocab", "paragraph": "G", "sentence": "‘Repetition leads to familiarity which leads to anticipation, which is satisfied by hearing the song,’ says John Seabrook, author of The Song Machine: Inside the Hit Factory, about how producers pump pop songs full of aural ‘hooks’, the punchy melodic phrases designed to target the brain and leave it wanting more.", "target": "punchy melodic phrases", "options": ["short striking sequences of musical notes", "lyrics describing physical fighting", "weak barely audible random sounds"], "answer": 0, "explanations": ["此處 punchy melodic phrases 表示「鮮明有力的旋律片語」。須依原句語境理解。", "這個選項表示「描寫打鬥的歌詞」；原句要表達的是「鮮明有力的旋律片語」。", "這個選項表示「微弱難聞的隨機聲」；原句要表達的是「鮮明有力的旋律片語」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-51", "mode": "vocab", "paragraph": "G", "sentence": "The researchers are comparing the melodic structure of 100 often mentioned songs with 100 similarly popular songs that weren't cited as earworms, to assess the difference.", "target": "assess", "options": ["evaluate or judge", "assume without testing", "prevent publication of"], "answer": 0, "explanations": ["此處 assess 表示「評估」。須依原句語境理解。", "這個選項表示「未測試便假定」；原句要表達的是「評估」。", "這個選項表示「阻止發表」；原句要表達的是「評估」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-52", "mode": "vocab", "paragraph": "G", "sentence": "The researchers are comparing the melodic structure of 100 often mentioned songs with 100 similarly popular songs that weren't cited as earworms, to assess the difference.", "target": "cited as", "options": ["mentioned or identified as examples of", "seen briefly in the distance", "proved to be impossible"], "answer": 0, "explanations": ["此處 cited as 表示「被提及、列為」。須依原句語境理解。", "這個選項表示「遠處瞥見」；原句要表達的是「被提及、列為」。", "這個選項表示「證明不可能」；原句要表達的是「被提及、列為」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-53", "mode": "vocab", "paragraph": "G", "sentence": "Songs with earworm potential appear to share certain features: a repeating pattern of ups and downs in pitch, and irregular musical intervals.", "target": "pitch", "options": ["how high or low a sound is", "the loudness of a sound", "a field used for football only"], "answer": 0, "explanations": ["此處 pitch 表示「音高」。須依原句語境理解。", "這個選項表示「音量」；原句要表達的是「音高」。", "這個選項表示「僅足球場」；原句要表達的是「音高」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-54", "mode": "vocab", "paragraph": "G", "sentence": "Songs with earworm potential appear to share certain features: a repeating pattern of ups and downs in pitch, and irregular musical intervals.", "target": "musical intervals", "options": ["differences in pitch between notes", "silent breaks between concerts only", "the length of a music recording"], "answer": 0, "explanations": ["此處 musical intervals 表示「音程」。須依原句語境理解。", "這個選項表示「僅音樂會間休息」；原句要表達的是「音程」。", "這個選項表示「錄音總長」；原句要表達的是「音程」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-55", "mode": "vocab", "paragraph": "H", "sentence": "The researchers plan next to test their results in reverse, and play ringtones from songs of both the earworm and non-earworm variety for volunteers several times a day to see which ones get stuck.", "target": "in reverse", "options": ["with the direction of the procedure turned around", "without changing anything", "by playing every recording backwards only"], "answer": 0, "explanations": ["此處 in reverse 表示「反向進行」。須依原句語境理解。", "這個選項表示「完全不變」；原句要表達的是「反向進行」。", "這個選項表示「只把錄音倒轉播放」；原句要表達的是「反向進行」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-56", "mode": "vocab", "paragraph": "H", "sentence": "Drs Stewart and Halpern are now working together to recruit survey participants for a study looking at whether people at different stages of life experience earworms differently.", "target": "recruit", "options": ["enlist people to participate", "force every person to join", "exclude without explanation"], "answer": 0, "explanations": ["此處 recruit 表示「招募」。須依原句語境理解。", "這個選項表示「強迫所有人加入」；原句要表達的是「招募」。", "這個選項表示「無說明地排除」；原句要表達的是「招募」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-57", "mode": "vocab", "paragraph": "H", "sentence": "Drs Stewart and Halpern are now working together to recruit survey participants for a study looking at whether people at different stages of life experience earworms differently.", "target": "stages of life", "options": ["different periods in a person's lifespan", "platforms used for live performances", "steps for manufacturing instruments"], "answer": 0, "explanations": ["此處 stages of life 表示「人生階段」。須依原句語境理解。", "這個選項表示「現場演出舞台」；原句要表達的是「人生階段」。", "這個選項表示「製造樂器步驟」；原句要表達的是「人生階段」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-58", "mode": "vocab", "paragraph": "H", "sentence": "‘But the few responses we have so far indicate that they have earworms less often. It could be that they don't play music as often as younger people do.’", "target": "indicate", "options": ["suggest or point towards", "guarantee conclusively", "deny without reason"], "answer": 0, "explanations": ["此處 indicate 表示「顯示、指出」。須依原句語境理解。", "這個選項表示「最終確保」；原句要表達的是「顯示、指出」。", "這個選項表示「無理由否認」；原句要表達的是「顯示、指出」。"], "tag": "字彙與語境義"}, {"id": "mind-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Scientists call them ‘involuntary musical images’, or ‘earworms’, and a wave of new research is shining light on why they occur and what can be learned from them.", "target": "", "options": ["Research is beginning to clarify why involuntary music occurs and what it may reveal.", "Scientists have already explained every aspect of earworms conclusively.", "The research concerns only how to compose songs deliberately."], "answer": 0, "explanations": ["is shining light 表增加理解，不是所有謎題都已解。", "beginning clarification 不等於全確證。", "involuntary...why they occur 不只作曲技巧。"], "tag": "長難句理解", "structure": "Scientists call...先定義；and a wave of research...為並列主句；why...與 what...為介詞 on 的平行受詞內容；them 指耳蟲現象。"}, {"id": "mind-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "‘The idea that we have full control over our thought processes is an illusion,’ says psychologist Lauren Stewart, who founded the master's program in music, mind and brain at Goldsmiths, University of London, UK, where recent research has taken place.", "target": "", "options": ["Stewart questions the belief that people fully control their own thinking.", "Stewart claims people cannot exert any control over any thought.", "Stewart confirms that complete conscious control is an established fact."], "answer": 0, "explanations": ["full control 是被否定的程度，不代表任何控制皆無。", "否定完全控制不能推成零控制。", "is an illusion 與確認完全控制相反。"], "tag": "長難句理解", "structure": "The idea...is an illusion 為主幹；that we have...為同位內容子句；says...標記來源；who founded...修飾 Stewart，where...修飾研究機構。"}, {"id": "mind-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "Researchers haven't been able to watch what happens in the brain when earworms occur, because they happen unpredictably.", "target": "", "options": ["Unpredictable timing has prevented researchers from directly observing brain activity during earworms.", "Researchers have watched every earworm as it happened because the timing is fixed.", "The sentence proves no information about earworms can be gathered by any method."], "answer": 0, "explanations": ["because 提出直接觀察受阻原因，不否定問卷等其他證據。", "unpredictably 與固定可觀察相反。", "下一句有多種資料來源，不能推成全不可知。"], "tag": "長難句理解", "structure": "haven't been able to watch...為否定能力主幹；what happens...為 watch 的受詞；when earworms occur 為時間；because they happen...表原因。"}, {"id": "mind-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "A Goldsmiths study published in the journal Memory and Cognition this year showed that the singing we hear in our heads tends to be true to actual recordings.", "target": "", "options": ["The study suggests internally heard music tends to preserve features of actual recordings.", "Every imagined song is always identical to a recording in every possible detail.", "The study says remembered music necessarily bears no resemblance to recordings."], "answer": 0, "explanations": ["tends to 為傾向，不等於每次所有細節相同。", "tends to 不能改成 always identical。", "true to 表接近原貌，非毫無相似。"], "tag": "長難句理解", "structure": "A study published...為主詞，published 為分詞；showed that...引結果；the singing we hear...為嵌入主詞，we hear 為省略 that 的關係子句。"}, {"id": "mind-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "Researchers had 17 volunteers tap to the beat of any earworm they heard during a four-day period while a device attached to their wrist recorded their movements.", "target": "", "options": ["Volunteers indicated rhythm by tapping while a wrist-mounted device recorded the movement.", "The device played songs directly into each volunteer's wrist.", "Researchers asked volunteers only to write lyrics and did not record movement."], "answer": 0, "explanations": ["had volunteers tap 是要求受試者敲拍，裝置功能是記錄動作。", "attached to wrist 不代表從手腕播放音樂。", "tap to beat、recorded movements 不等於只抄歌詞。"], "tag": "長難句理解", "structure": "Researchers had+受詞+原形 tap 為使役；any earworm they heard...含關係子句；while...recorded...為同步時間子句；attached...修飾 device。"}, {"id": "mind-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "Another Goldsmiths study, published this year in Consciousness and Cognition, found that people who report hearing earworms often, and find them most intrusive, have slightly different brain structures, with more gray matter in areas associated with processing emotions.", "target": "", "options": ["Frequent intrusive earworms were associated with small structural differences in emotion-related brain areas.", "The study proved earworms caused every observed structural difference.", "All people with any earworm were said to have completely different brains."], "answer": 0, "explanations": ["found...people...have...為關聯發現；slightly、often、most intrusive 都限縮。", "觀察到兩者同現不等於已證因果。", "把特定頻繁困擾者擴為所有人，把微小變成完全不同。"], "tag": "長難句理解", "structure": "people who report...and find...為長主詞；have slightly different structures 為嵌入主幹；with more gray matter 補充；associated with...修飾 areas。"}, {"id": "mind-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "Studies also show that the music in our heads often starts playing during times of ‘low cognitive load’, such as while showering, getting dressed, walking, or doing chores.", "target": "", "options": ["Earworms often arise during activities placing relatively few demands on thinking.", "Earworms are said to occur only during the hardest intellectual tasks.", "The sentence states that no activity of any kind occurs during an earworm."], "answer": 0, "explanations": ["often 為常見情況；showering、chores 是心智負荷低但仍有活動。", "低負荷被反轉為僅最高負荷。", "低認知負荷不等於身體完全不活動。"], "tag": "長難句理解", "structure": "Studies show that...為框架；music...starts playing...為內容；during times...限定情境；such as while...列四個平行活動例。"}, {"id": "mind-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "Dr Stewart likens earworms to ‘sonic screen savers’ that keep the mind entertained while it is otherwise unoccupied.", "target": "", "options": ["Stewart compares earworms to background entertainment for a mind not otherwise occupied.", "The comparison means a literal computer program is installed inside the brain.", "The comparison claims earworms always prevent every other mental activity."], "answer": 0, "explanations": ["likens...to...是功能比喻，不是實體裝置。", "比喻不能當作電腦程式真的存在。", "while otherwise unoccupied 不是永遠排除全部活動。"], "tag": "長難句理解", "structure": "Dr Stewart likens X to Y 為主幹；that keep...修飾 sonic screen savers；while it is...表情境，it 指 mind。"}, {"id": "mind-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "The volunteers who sat idly for the next five minutes were the most likely to report hearing the music in their heads.", "target": "", "options": ["Among the tested groups, those left idle for five minutes were most likely to report internal music.", "Every idle volunteer certainly heard music, and no busy volunteer ever did.", "The most likely group was the one performing the most challenging tasks."], "answer": 0, "explanations": ["most likely 是群組機率比較，不等於全有與全無。", "把相對可能性轉為絕對分配。", "本句指出 idle 為最高，不是最高負荷組。"], "tag": "長難句理解", "structure": "The volunteers who...為主詞；were the most likely to report...為主幹；who sat...限定受試群；the music in their heads 指內在音樂。"}, {"id": "mind-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "Dr Stewart observed that the more challenging the activity, the less likely the volunteers were to hear the music.", "target": "", "options": ["As task difficulty increased, the likelihood of hearing the music decreased in the reported observations.", "Task difficulty and earworm likelihood increased together.", "The sentence proves difficult tasks permanently eliminate earworms in everyone."], "answer": 0, "explanations": ["the more...,the less...為反向變化，不是保證永久療效。", "把反向關係改成同向。", "less likely 不等於永遠消除，且限研究觀察。"], "tag": "長難句理解", "structure": "Dr Stewart observed that...標記觀察；the more challenging the activity [was] 為省略比較分句；the less likely...were...為相應結果，屬機率。"}, {"id": "mind-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Songs the brain fixates on are usually those it has been exposed to recently, surveys show, which is why tunes getting heavy radio play frequently top the earworm charts.", "target": "", "options": ["Songs recently encountered are often the ones that later recur mentally, helping explain frequent earworms from heavily broadcast tunes.", "Only songs consciously memorised years earlier can ever become earworms.", "Frequent radio play is said to make a tune impossible to remember."], "answer": 0, "explanations": ["usually、recently、which is why 連接接觸頻率與反覆音樂。", "only、years earlier、consciously 都違反原句。", "heavy play 常居前列，非無法記住。"], "tag": "長難句理解", "structure": "Songs [that] brain fixates on 為長主詞；are those [that] it has been exposed to...為表語；surveys show 為插入；which is why...補解釋。"}, {"id": "mind-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "Even tunes you may have heard but didn't pay attention to can worm their way into your subconscious, says Ira Hyman, a psychologist at Western Washington University in Bellingham, USA.", "target": "", "options": ["Music may enter the subconscious even without focused attention during hearing.", "A tune can be remembered only if the listener consciously tries to learn it.", "The sentence describes literal worms entering the listener's ears."], "answer": 0, "explanations": ["even...didn't pay attention to 排除必須有意學習的條件。", "can...even without attention 反對 only consciously。", "worm their way 是比喻，非實體生物。"], "tag": "長難句理解", "structure": "Even tunes...為主詞；you may have heard...but didn't pay attention to 為省略關係代名詞的子句；can worm...為主幹；says...標記 Hyman 的主張。"}, {"id": "mind-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "In an unpublished study there, participants who listened to music while doing other tasks were more likely to report that the songs returned as earworms later on, compared with participants who simply listened.", "target": "", "options": ["Participants who combined listening with other tasks reported later earworms more often than participants who only listened.", "The simply-listening group was reported as more likely to experience later earworms.", "The unpublished study established that no multitasking listener ever heard an earworm."], "answer": 0, "explanations": ["more likely...compared with 指多工組較高。", "將比較組高低對調。", "more likely 不可能改成該組完全沒有。"], "tag": "長難句理解", "structure": "participants who...為長主詞；were more likely to report...為主幹；that songs returned...為 report 內容；compared with...引對照組。"}, {"id": "mind-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "So, when the mind hits a part of a song it can't remember, it loops back rather than moving on.", "target": "", "options": ["Failure to remember the next part may cause the mind to return to an earlier fragment.", "Whenever memory fails, the song is necessarily forgotten permanently.", "The mind always finishes the full song without repeating any part."], "answer": 0, "explanations": ["when...can't remember...loops back 而非 moving on，描述重複機制。", "回頭反覆不等於永久遺忘。", "rather than moving on 排除總能順利完成。"], "tag": "長難句理解", "structure": "when the mind hits a part...為時間／條件；it can't remember 為關係子句修飾 part；it loops back 為主句；rather than...比較兩種走向。"}, {"id": "mind-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "That could make an earworm even more entrenched, Dr Hyman says.", "target": "", "options": ["The proposed looping mechanism could make an earworm harder to dislodge.", "The looping mechanism has been proved to eliminate every earworm.", "The mechanism necessarily makes every earworm last forever."], "answer": 0, "explanations": ["could 為可能效果；more entrenched 為更難擺脫，不是無限持續。", "方向與 more entrenched 相反。", "could 與比較程度不能升為必然永恆。"], "tag": "長難句理解", "structure": "That 指前述記不出後續而回播；could make+受詞+形容詞補語；even more 修飾 entrenched；Dr Hyman says 表來源。"}, {"id": "mind-paraphrase-16", "mode": "paraphrase", "paragraph": "E", "sentence": "According to a theory known as the Zeigarnik effect, named for a Soviet psychologist, Bluma Zeigarnik, unfinished thoughts and activities weigh on the mind more heavily than those that are completed, although experiments exposing students to interrupted songs have yielded mixed results.", "target": "", "options": ["The Zeigarnik account predicts unfinished material will preoccupy the mind, but the cited experiments have not consistently supported it.", "The experiments conclusively supported the theory in every case.", "The account states that completed activities always occupy more attention than unfinished ones."], "answer": 0, "explanations": ["although 保留理論與混合實證的落差。", "mixed results 不是全部一致確證。", "more heavily than 對象為 unfinished 大於 completed，不能換向。"], "tag": "長難句理解", "structure": "According to...限定理論來源；named for...修飾 theory；unfinished thoughts...weigh...為主句；than those...中 those 指 thoughts and activities；although...為讓步。"}, {"id": "mind-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "Researchers say they can't pinpoint a spot in the brain where earworms live.", "target": "", "options": ["Researchers cannot currently assign earworms to one precisely identified brain location.", "The researchers have identified a single exclusive earworm centre beyond doubt.", "The sentence says earworms cannot involve any brain activity."], "answer": 0, "explanations": ["can't pinpoint 否定精確單點定位，不否定腦活動存在。", "把 can't 改成已確證。", "定位未知不等於完全無活動。"], "tag": "長難句理解", "structure": "Researchers say...為報告框架；they can't pinpoint a spot...為內容；where earworms live 修飾 spot，live 為非字面居住的表達。"}, {"id": "mind-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "Imaging studies by Andrea Halpern at Bucknell University, in Lewisburg, USA, have shown that deliberately imagining music and actually listening to music activate many of the same neurological networks.", "target": "", "options": ["Imagining music deliberately and hearing it involve many overlapping neural systems.", "Imagining and listening activate entirely separate systems with no overlap.", "The study proves every aspect of imagination and actual listening is identical."], "answer": 0, "explanations": ["many of the same 表大量重疊，非毫無重疊，也非全部相同。", "the same 排除完全分離。", "many 不等於 all，腦活動重疊不使所有體驗相同。"], "tag": "長難句理解", "structure": "Imaging studies...have shown that...為主幹；deliberately imagining...and actually listening...為兩個平行動名詞主詞；activate...為嵌入謂語。"}, {"id": "mind-paraphrase-19", "mode": "paraphrase", "paragraph": "F", "sentence": "Dr Halpern's earlier studies showed that when subjects listened to the first few notes of familiar music, areas in the right frontal and superior temporal portions of the brain became activated, along with the supplementary motor area at the top, which is typically involved in remembering sequences.", "target": "", "options": ["Familiar opening notes activated several brain areas, including a region associated with remembering sequences.", "The study says only one area became active and no other region was involved.", "The supplementary motor area was defined as a region used only for hearing loud noise."], "answer": 0, "explanations": ["along with 表多區共同；typically remembering sequences 非僅大聲音。", "areas...along with...明列多區。", "which...typically...記序列功能被換成唯一聽噪音。"], "tag": "長難句理解", "structure": "when subjects listened...為時間；areas...became activated 為被動主幹；along with...添一區；which...involved...修飾 supplementary motor area。"}, {"id": "mind-paraphrase-20", "mode": "paraphrase", "paragraph": "F", "sentence": "When the same subjects listened to unfamiliar music and were asked to recall it, there was activity in the left frontal portions of the brain instead.", "target": "", "options": ["Unfamiliar music followed by a recall request was associated with activity in left frontal regions instead.", "The reported condition produced exactly the same right-sided activity as the familiar-music condition.", "The subjects were asked to forget the unfamiliar music immediately."], "answer": 0, "explanations": ["instead 表與前句的不同區域；recall 是回想而非忘記。", "忽略 left...instead 的對照。", "asked to recall 不能改 ask to forget。"], "tag": "長難句理解", "structure": "When...listened...and were asked...為同主詞的主動／被動並列時間子句；there was activity...為存在句；instead 回指前述熟悉音樂條件的活動區域。"}, {"id": "mind-paraphrase-21", "mode": "paraphrase", "paragraph": "G", "sentence": "‘Repetition leads to familiarity which leads to anticipation, which is satisfied by hearing the song,’ says John Seabrook, author of The Song Machine: Inside the Hit Factory, about how producers pump pop songs full of aural ‘hooks’, the punchy melodic phrases designed to target the brain and leave it wanting more.", "target": "", "options": ["Repeated exposure can build familiarity and expectation, making hearing the song satisfying.", "The quoted explanation says repetition necessarily destroys all interest immediately.", "The sequence runs from satisfaction to unfamiliarity and then to repetition."], "answer": 0, "explanations": ["leads to 串起重複、熟悉、期待，最後被聽歌滿足。", "原句說形成期待，不是必然立刻失趣。", "把因果鏈條順序倒置。"], "tag": "長難句理解", "structure": "Repetition leads...為第一主幹；which leads...修飾 familiarity；第二 which is satisfied...修飾 anticipation；by hearing...說明滿足方式。"}, {"id": "mind-paraphrase-22", "mode": "paraphrase", "paragraph": "G", "sentence": "The researchers are comparing the melodic structure of 100 often mentioned songs with 100 similarly popular songs that weren't cited as earworms, to assess the difference.", "target": "", "options": ["Researchers compare often-mentioned earworms with equally popular songs not named as earworms.", "The comparison uses only unpopular songs as the control set.", "The study assumes that every popular song has equal earworm potential."], "answer": 0, "explanations": ["similarly popular 控制流行程度，earworm reportedness 不同。", "similarly popular 不是 only unpopular。", "兩組是否被列耳蟲不同，不是事先當成潛力全同。"], "tag": "長難句理解", "structure": "are comparing X with Y 為主幹；often mentioned 修飾第一組 songs；that weren't cited...修飾第二組；to assess...為研究目的。"}, {"id": "mind-paraphrase-23", "mode": "paraphrase", "paragraph": "G", "sentence": "Songs with earworm potential appear to share certain features: a repeating pattern of ups and downs in pitch, and irregular musical intervals.", "target": "", "options": ["Potential earworm songs seem to have common melodic patterns, though the wording remains tentative.", "The sentence proves every song with those patterns must become an earworm.", "Earworm songs are said to share no musical features at all."], "answer": 0, "explanations": ["appear to、potential 保留推論，不是充分必要定律。", "相似特徵不能推出每首必成耳蟲。", "share certain features 排除毫無共通。"], "tag": "長難句理解", "structure": "Songs with...為主詞；appear to share...為限定主幹；冒號後列兩項特徵；in pitch 修飾 ups and downs，irregular 修飾 intervals。"}, {"id": "mind-paraphrase-24", "mode": "paraphrase", "paragraph": "H", "sentence": "The researchers plan next to test their results in reverse, and play ringtones from songs of both the earworm and non-earworm variety for volunteers several times a day to see which ones get stuck.", "target": "", "options": ["The proposed test will play tunes from both groups to see which actually recur in volunteers' minds.", "The test has already proved the predictions correct before any tunes were played.", "In reverse means the only task is to play every recording backwards."], "answer": 0, "explanations": ["plan next 表未來；in reverse 指由歌曲類別測是否變耳蟲，非必然倒帶。", "計畫不能改成已完成確證。", "後文描述播放兩類鈴聲，沒說錄音逆向聲流。"], "tag": "長難句理解", "structure": "plan...to test...and play...為並列不定詞；from songs of both...限定來源兩類；for volunteers...為接收對象；to see which...為目的。"}, {"id": "mind-paraphrase-25", "mode": "paraphrase", "paragraph": "H", "sentence": "‘But the few responses we have so far indicate that they have earworms less often. It could be that they don't play music as often as younger people do.’", "target": "", "options": ["Initial responses suggest older people may have fewer earworms, contrary to the prediction based on knowing more songs.", "A large completed survey proved every older person has more earworms.", "The few responses establish with certainty that music exposure is the sole cause of age differences."], "answer": 0, "explanations": ["few、so far、indicate、could 都保留樣本及解釋限制。", "把少量目前回覆改成大型完結研究，方向亦反。", "It could be 是假說，不是唯一成因確證。"], "tag": "長難句理解", "structure": "But...responses...indicate that...為主幹；we have so far 修飾 responses；they 指 older people；後句 It could be that...提出播放音樂頻率的可能解釋。"}, {"id": "mind-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "A description of characteristics common to songs with earworms.", "target": "characteristics", "options": ["特徵、特性", "研究員的身分", "歌曲的播放裝置"], "answer": 0, "explanations": ["characteristics 指可辨識、比較的特徵。此處練習題目用語，不表示整句符合原文。", "不是研究者身分", "不是器材"], "tag": "題目字彙", "source": "Question 14 · 題目用語"}, {"id": "mind-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "A justification for research into earworms.", "target": "justification", "options": ["合理依據、研究理由", "最終研究結果", "完全無根據的猜測"], "answer": 0, "explanations": ["justification 解釋為何值得或有必要研究。此處練習題目用語，不表示整句符合原文。", "不是研究完成後成果", "不是無根據"], "tag": "題目字彙", "source": "Question 15 · 題目用語"}, {"id": "mind-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Details of proposed research into the frequency of earworms in different age groups.", "target": "proposed research", "options": ["擬進行、提出的研究", "已完成且全部確證的研究", "已被禁止的研究"], "answer": 0, "explanations": ["proposed 指計畫階段，不能當成已得結果。此處練習題目用語，不表示整句符合原文。", "提案不等於完成", "提出不代表遭禁"], "tag": "題目字彙", "source": "Question 17 · 題目用語"}, {"id": "mind-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Details of proposed research into the frequency of earworms in different age groups.", "target": "frequency", "options": ["發生頻率", "音量", "主觀喜好強度"], "answer": 0, "explanations": ["此處 frequency 指多常出現。此處練習題目用語，不表示整句符合原文。", "不是聲量", "不是偏好強度"], "tag": "題目字彙", "source": "Question 17 · 題目用語"}, {"id": "mind-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "Further research has demonstrated that some brains may deal with emotions differently.", "target": "emotions", "options": ["情緒", "歌詞", "器材"], "answer": 0, "explanations": ["emotions 為喜怒哀樂等心理狀態。此處練習題目用語，不表示整句符合原文。", "lyrics 才是歌詞", "不是設備"], "tag": "題目字彙", "source": "Question 18–21 · 題目用語"}, {"id": "mind-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "A reduction in earworms was related to how challenging the task was.", "target": "challenging", "options": ["需要投入心智、難度高的", "帶有挑釁語氣才適用", "完全無需專注的"], "answer": 0, "explanations": ["task challenging 指任務有難度。此處練習題目用語，不表示整句符合原文。", "此處不是人際挑釁", "與毫不費力相反"], "tag": "題目字彙", "source": "Question 18–21 · 題目用語"}, {"id": "mind-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Some musicians create music that is intentionally memorable.", "target": "intentionally", "options": ["有意、刻意地", "無意間", "僅因意外"], "answer": 0, "explanations": ["intentionally 表有目的安排。此處練習題目用語，不表示整句符合原文。", "與 accidentally 相反", "不是純偶然"], "tag": "題目字彙", "source": "Question 22 · 題目用語"}, {"id": "mind-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Some musicians create music that is intentionally memorable.", "target": "memorable", "options": ["容易記住、令人難忘的", "不可能被記住的", "只在回憶中存在才適用"], "answer": 0, "explanations": ["memorable 指會留下鮮明記憶。此處練習題目用語，不表示整句符合原文。", "不可能記住相反", "不限定已不再存在"], "tag": "題目字彙", "source": "Question 22 · 題目用語"}, {"id": "mind-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "People are unable to completely regulate how they think.", "target": "regulate", "options": ["調節、控制", "毫無例外地取消", "公開讚美"], "answer": 0, "explanations": ["regulate thought processes 指調控思考。此處練習題目用語，不表示整句符合原文。", "調控不等於全部取消", "不是稱讚"], "tag": "題目字彙", "source": "Question 23 · 題目用語"}, {"id": "mind-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "Earworms are more persistent when only a short section of the song is constantly replayed.", "target": "persistent", "options": ["持續、難擺脫的", "立即消失的", "必然令人愉快的"], "answer": 0, "explanations": ["persistent 描述持續性；原題缺少的 is 已補上。此處練習題目用語，不表示整句符合原文。", "不是短暫即逝", "持續不限定情緒正負"], "tag": "題目字彙", "source": "Question 26 · 題目用語"}, {"id": "mind-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "The questions refer to earworms, or involuntary musical images.", "target": "involuntary", "options": ["不由自主、非有意控制的", "刻意設計的", "法律強制的"], "answer": 0, "explanations": ["involuntary musical images 指自發出現的內在音樂意象。此處練習題目用語，不表示整句符合原文。", "非 deliberately created", "不是依法強制"], "tag": "題目字彙", "source": "Question 14–26 · 題目用語"}]}, {"id": "origin-applause", "title": "The Origin and Development of Applause", "sourceTitle": "The Origin and Development of Applause", "subtitle": "", "part": 2, "topic": "掌聲、群眾互動與社交媒體", "sourceNote": "依本文歷史敘述及作者類比理解；引號中的 spontaneous 帶有反諷。數位互動被類比為掌聲，不是字面拍手。", "paragraphs": [{"label": "A", "text": "Scholars aren't quite sure about the origins of applause, but the form that is still most common, clapping the hands together, was formalized in Western culture during and after performances. During the time of the Roman Republic (509 BC — 27 BC) the common way to end a play was for the chief actor to yell ‘Valete et plaudite!’ (‘Goodbye and applaud!’) thus signaling to the audience that it was time for them to give praise by striking hands and making explosive noise. It's no surprise, then, that this became a means of crowd manipulation. Rome saw the rise of a professional class of applauders, or ‘people who clapped for their dinner’, hired to infiltrate crowds and manipulate their reaction to performances. Actors would hire a dozen or so people to spread out among their audiences and prolong the applause, or, if they were feeling especially bold, to start ‘spontaneous’ chants and shouts of praise."}, {"label": "B", "text": "The Roman Republic came to an end and was replaced by the Roman Empire (27 BC — 476 AD) where applause became a way for leaders to interact directly with their citizens. One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena. Leaders became astute at reading the volume, the rhythm, and the length of the crowd's claps for clues about how well they were doing as officials and lawmakers. ‘We should think of it as an ancient type of opinion poll,’ says Greg Aldrete, a professor of history. ‘This is how you gauge the people.’ Roman leaders were gathering data about people by listening to applause."}, {"label": "C", "text": "Clever leaders of the ancient world researched their rivals, too. Cicero, the Roman lawyer, would send friends to stand around outside the arena, taking notes to see what kind of greeting each official got when he entered, the better to see who was beloved by the people, and who was not. They had a lot of information to assess. ‘Ancient crowds were more interactive than they are today,’ Aldrete points out. ‘There was a lot of back and forth between speakers and crowds. And particularly in the Greco-Roman world, crowds, especially in cities, were really good at communicating messages through rhythmic clapping, sometimes coupled with shouts.’ The coding was, he says, invaluable when assessing an orator’s fortunes."}, {"label": "D", "text": "Around the first century AD, those systems of applause became more and more elaborate. Applause no longer meant, simply, ‘claps’. While Greco-Roman audiences certainly smacked their palms together the same way we do today, their overall strategies of applause were much more varied than clapping alone. Crowds expressed degrees of approval of the person or persons before them, ranging from claps, to snaps (of the finger and thumb), to waves (of the edge of the toga). The emperor Aurelian decided to replace this gesture by waving a special handkerchief instead, a prop which he then distributed to all Roman citizens, so they would never be without a way to praise him."}, {"label": "E", "text": "Although the style of applause may have changed over the centuries, the need to manipulate remained. 16th-century French poet Jean Daurat is credited with bringing back the Roman practice of hiring professional applauders. In France, this group became known as a ‘claque’. Daurat handed out tickets to his own performances to people who promised to applaud at the end. By the early 1820s, claques had become institutionalized, with an agency in Paris specializing in the distribution of the claqueurs’ services. The historian William B. Cohen describes the intricate price lists agencies of this kind would hand out to potential patrons: polite clapping would cost this many francs, enthusiastic applause would cost this many. The claque also underwent a kind of classification: the rieurs (laughers) would laugh loudly at the jokes; the pleureurs (criers) would feign tears in reaction to performances; the commissaires (officers) would learn a play or a piece of music by heart and then call attention to its best parts. This practice spread to Milan, to Vienna, and to London before falling out of fashion. The claque lost its power once people became aware of its tricks."}, {"label": "F", "text": "And clapping itself evolved. In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies. Knowing when to maintain silence, as well as when to clap, became a mark of sophistication, a kind of code for audiences to learn. Applause became a matter of ‘do’ or ‘don’t’, so losing many old shades of meaning. Those changes changed performers, too. Applause became much less of a true dialogue with an audience, especially so with opera, where the singers saw it as part of a basic transaction with the crowd. So by the time the 19th century arrived, applause had become standardized and institutionalized, and had become an expectation rather than the reward it used to be."}, {"label": "G", "text": "In the 21st century we’re reinventing applause, to make it what it used to be: a coded form of communication. More and more the digital world allows us to link and like and share through our devices. By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising. Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead."}], "questions": [{"id": "applause-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Scholars aren't quite sure about the origins of applause, but the form that is still most common, clapping the hands together, was formalized in Western culture during and after performances.", "target": "Scholars", "options": ["people engaged in serious academic study", "students only below university level", "actors employed to clap"], "answer": 0, "explanations": ["此處 Scholars 表示「學者」。須依原句語境理解。", "這個選項表示「僅大學以下學生」；原句要表達的是「學者」。", "這個選項表示「受僱拍手的演員」；原句要表達的是「學者」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Scholars aren't quite sure about the origins of applause, but the form that is still most common, clapping the hands together, was formalized in Western culture during and after performances.", "target": "formalized", "options": ["made into an established recognised practice", "legally required in every country", "invented without earlier examples"], "answer": 0, "explanations": ["此處 formalized 表示「正式化、形成慣例」。須依原句語境理解。", "這個選項表示「每國法律皆強制」；原句要表達的是「正式化、形成慣例」。", "這個選項表示「毫無前例發明」；原句要表達的是「正式化、形成慣例」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "During the time of the Roman Republic (509 BC — 27 BC) the common way to end a play was for the chief actor to yell ‘Valete et plaudite!’ (‘Goodbye and applaud!’) thus signaling to the audience that it was time for them to give praise by striking hands and making explosive noise.", "target": "signaling", "options": ["communicating a cue or message", "asking privately for money", "causing an accidental noise only"], "answer": 0, "explanations": ["此處 signaling 表示「示意、發出訊號」。須依原句語境理解。", "這個選項表示「私下要錢」；原句要表達的是「示意、發出訊號」。", "這個選項表示「僅製造意外噪音」；原句要表達的是「示意、發出訊號」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "It's no surprise, then, that this became a means of crowd manipulation.", "target": "a means of crowd manipulation", "options": ["a method of influencing a group's reactions", "an unbiased measurement without influence", "a way of moving theatre seats"], "answer": 0, "explanations": ["此處 a means of crowd manipulation 表示「操控群眾反應的手段」。須依原句語境理解。", "這個選項表示「不影響群眾的無偏測量」；原句要表達的是「操控群眾反應的手段」。", "這個選項表示「搬動劇院座位的方法」；原句要表達的是「操控群眾反應的手段」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "Rome saw the rise of a professional class of applauders, or ‘people who clapped for their dinner’, hired to infiltrate crowds and manipulate their reaction to performances.", "target": "clapped for their dinner", "options": ["earned rewards by providing applause", "clapped only because the food tasted good", "prepared meals without receiving pay"], "answer": 0, "explanations": ["此處 clapped for their dinner 表示「以鼓掌換取報酬」。須依原句語境理解。", "這個選項表示「只因食物好吃而鼓掌」；原句要表達的是「以鼓掌換取報酬」。", "這個選項表示「無薪做飯」；原句要表達的是「以鼓掌換取報酬」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "Rome saw the rise of a professional class of applauders, or ‘people who clapped for their dinner’, hired to infiltrate crowds and manipulate their reaction to performances.", "target": "infiltrate", "options": ["enter a group secretly or without appearing separate", "stay visibly apart from", "formally announce exclusion from"], "answer": 0, "explanations": ["此處 infiltrate 表示「混入、滲透」。須依原句語境理解。", "這個選項表示「明顯遠離」；原句要表達的是「混入、滲透」。", "這個選項表示「正式宣布被排除」；原句要表達的是「混入、滲透」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-7", "mode": "vocab", "paragraph": "A ": ["exchange responses without an intermediary with", "remain completely isolated from", "communicate only through written laws with"], "answer": 0, "explanations": ["此處 interact directly with 表示「與……直接互動」。須依原句語境理解。", "這個選項表示「與……完全隔離」；原句要表達的是「與……直接互動」。", "這個選項表示「僅以成文法溝通」；原句要表達的是「與……直接互動」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena.", "target": "standing with the people", "options": ["status or level of public approval", "physical posture in a crowd", "the exact location of a ruler's seat"], "answer": 0, "explanations": ["此處 standing with the people 表示「在民眾間的聲望、支持度」。須依原句語境理解。", "這個選項表示「在人群中的站姿」；原句要表達的是「在民眾間的聲望、支持度」。", "這個選項表示「統治者座位精確位置」；原句要表達的是「在民眾間的聲望、支持度」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena.", "target": "gauging", "options": ["estimating or measuring", "deliberately altering every response", "ignoring completely"], "answer": 0, "explanations": ["此處 gauging 表示「衡量、判斷」。須依原句語境理解。", "這個選項表示「刻意改動全部回應」；原句要表達的是「衡量、判斷」。", "這個選項表示「完全忽略」；原句要表達的是「衡量、判斷」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena.", "target": "arena", "options": ["a public space for performance or spectacle", "a private room for sleeping", "an office storing documents only"], "answer": 0, "explanations": ["此處 arena 表示「競技場、表演場域」。須依原句語境理解。", "這個選項表示「私人臥房」；原句要表達的是「競技場、表演場域」。", "這個選項表示「僅存文件的辦公室」；原句要表達的是「競技場、表演場域」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-14", "mode": "vocab", "paragraph": "B", "sentence": "Leaders became astute at ence": "Cicero, the Roman lawyer, would send friends to stand around outside the arena, taking notes to see what kind of greeting each official got when he entered, the better to see who was beloved by the people, and who was not.", "target": "the better to", "options": ["so as to do something more effectively", "because it had already been finished", "despite being unable to"], "answer": 0, "explanations": ["此處 the better to 表示「以便更有效地」。須依原句語境理解。", "這個選項表示「因為早已完成」；原句要表達的是「以便更有效地」。", "這個選項表示「儘管無法」；原句要表達的是「以便更有效地」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-19", "mode": "vocab", "paragraph": "C", "sentence": "Cicero, the Roman lawyer, would send friends to stand around outside the arena, taking notes to see what kind of greeting each official got when he entered, the better to see who was beloved by the people, and who was not.", "target": "beloved", "options": ["greatly loved or admired", "merely recognised by appearance", "formally employed"], "answer": 0, "explanations": ["此處 beloved 表示「深受愛戴的」。須依原句語境理解。", "這個選項表示「僅外貌被認得的」；原句要表達的是「深受愛戴的」。", "這個選項表示「正式受僱的」；原句要表達的是「深受愛戴的」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-20", "mode": "vocab", "paragraph": "C", "sentence": "‘There was a lot of back and forth between speakers and crowds. And particularly in the Greco-Roman world, crowds, especially in cities, were really good at communicating messages through rhythmic clapping, sometimes coupled with shouts.’", "target": "back and forth", "options": ["reciprocal exchanges", "one final statement with no response", "repeated physical travel only"], "answer": 0, "explanations": ["此處 back and forth 表示「來回互動」。須依原句語境理解。", "這個選項表示「一句無回應的最終陳述」；原句要表達的是「來回互動」。", "這個選項表示「僅反覆實際旅行」；原句要表達的是「來回互動」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-21", "mode": "vocab", "paragraph": "C", "sentence": "And particularly in the Greco-Roman world, crowds, especially in cities, were really good at communicating messages through rhythmic clapping, sometimes coupled with shouts.’", "target": "rhythmic cl
