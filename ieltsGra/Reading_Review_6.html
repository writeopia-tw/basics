</style></head><body><header><div class="brand">Reading Room</div><div class="part" id="partLabel">IELTS READING</div></header><main><section class="hero"><div class="label" id="topic">IELTS READING PRACTICE</div><h1 id="title">Reading Review 6</h1><p class="minor" id="catalogSummary"></p><div class="pills"><span class="pill" id="countV"></span><span class="pill" id="countP"></span><span class="pill" id="countQ"></span></div></section><div class="layout"><aside class="side"><h2>篇章與複習設定</h2><label for="article">閱讀篇章｜Part 分類 · A–Z</label><select id="article"></select><div id="paraWrap"><label for="para">段落範圍</label><select id="para"></select></div><div id="typeWrap"><label for="type">字詞類型</label><select id="type"></select></div><div class="stats" id="stats" aria-live="polite"></div><button id="shuffle">重新洗牌練習</button><button id="errors">重練錯題</button><p class="hint">每輪題目與選項隨機排列，同輪不重複。作答後可查看各選項解析。</p><p class="hint">進度保留在目前瀏覽器，不會跨裝置同步。</p><div id="status" role="status"></div></aside><section><nav class="tabs" aria-label="複習模式"><button data-mode="vocab">01 關鍵字語義</button><button data-mode="paraphrase">02 長難句改寫</button><button data-mode="questionVocab">03 題目字彙｜選中文</button><button data-mode="reading">原文閱讀</button></nav><div class="jump" id="jumpWrap"><label for="jump">跳至本輪題目</label><select id="jump"></select></div><div class="card" id="card"></div><p class="footer">先找主幹，再核對修飾範圍、否定、比較與作者態度。</p></section></div></main><script id="data" type="application/json">[{"id": "neanderthal-technology", "title": "Neanderthal Technology", "sourceTitle": "Neanderthal Technology", "subtitle": "", "part": 3, "topic": "史前住居、考古保存與證據推論", "sourceNote": "archaeological evidence 中 might、seem、is thought、has been interpreted 均保留不確定性；遺物存在不等於某一解釋已獲證實。", "paragraphs": [{"label": "A", "text": "We think of our prehistoric ancestors as people of the ice and snow, living in caves, and for many of the West European Neanderthalers that is an accurate picture of their life. But where there were no caves, further to the east on the Russian steppe, for example, open-air sites with some sort of constructed shelter were the only option. We now know much more about the cave sites than the open-air ones because, historically, it was the cave sites of Western Europe that were first explored by archaeologists and also because open-air sites are harder to find — many of them have disappeared under deep mud deposits or under the rising postglacial seas. Caves, moreover, aid the survival of archaeological material and can preserve the records of remote millennia."}, {"label": "B", "text": "In south-west France, the limestone caves of the Périgord region made ideal homes for the Neanderthal people. There were good supplies of flint to hand for axes and the like, and the caves were often sited in small river valleys that offered protection against the worst of the weather. The Neanderthalers liked south-facing caves, for obvious reasons of sunshine and wind avoidance, and caves at some height above the valley floor offered refuge from floods and good game-watching vantage points. The Périgord region during the last ice age was, in fact, an exceptionally benign habitat for humans. It enjoyed a rather maritime climate with cooler summers that permitted the extension of tundra and steppe over its higher plateaux, and its year-round high levels of sunshine favoured the growth of the ground plants needed by reindeer, bison and horse. Winters were mildish for the ice age, animals never needed to migrate far from summer to winter, and men never needed to travel far from home to find abundant supplies of meat."}, {"label": "C", "text": "In Central and Eastern Europe, where caves are less readily available, such open-air sites as have been discovered were mostly located near water: bottom-land was a good place for people and animals to live, and the sedimentation pattern of lakes and stream courses has aided archaeological preservation — whereas erosion has presumably blown away sites which were out in the open. Some of the open-air sites in Germany, Central Europe and Russia have provided valuable information about Neanderthal man and his way of life. From Moldova, for example, comes evidence that has been interpreted as the remains of wind-breaks, or even a large tent-ring, up to about 8 x 5 m in size, of mainly mammoth bones enclosing a dense concentration of stone tools, animal bones and ash."}, {"label": "D", "text": "From the West European caves more evidence of built structures is available, and some of it goes back a long way in time. In the Grotte du Lazaret, near Nice, at a date during the last ice age but one, claims for some sort of skin tent within the cave have been advanced, on the basis of arrangements of large stones out from the cave wall that might have supported timber struts for a covering of skins up to the rock face above. At Lazaret, what might be openings in the hypothesised tents seem to point away from the cave mouth, and finds of wolf and fox foot bones, without the rest of the skeletons, inside these ‘tents’ have been thought to indicate the use of animal pelts as bed coverings. The two patches of ash at Lazaret that mark ancient fires, with stone tools around them evidently made and used on the spot, are edged with small marine mollusc shells, prompting the excavator to suggest that seaweed had been used as bedding around the fires. The cave of Baume-Bonne in the Basses-Alpes region of France, another early site, boasts ten square metres of cobbles brought up from the local river and laid down, as though to take care of a puddle area in the cave, with the smoothest and roundest surfaces of the stones uppermost, and there are other similar cases."}, {"label": "E", "text": "The ash encountered in concentrations at some sites testifies to the Neanderthal people's use of fire: not surprising, since use of fire was, by Neanderthal times, an already ancient accomplishment of evolving humanity, and survival in the sub-arctic conditions faced by the Neanderthalers is inconceivable without control of fire. Fire gave warmth, light, heat for cooking and defence against predatory animals. A charred piece of birch from Krapina in Croatia is thought to be the remains of a fire-making twirl stick. But Neanderthal hearths, in the sense of specially constructed places for fire, are fewer and harder to identify with certainty than the mere ash piles that are a regular feature of their sites. They seem often to have just lit a small fire (40-50 cm across) on the existing ground surface of the cave, without preparation. Judging from the shallow penetration of heat effects under the ash, this fire was only of short duration. Sometimes the fires were larger in size, up to one metre across, and quite irregular in shape. It is not always easy to decide how much additional structure some fires possessed: claims of stone circles to contain the fire run up against the fact that stones tend to litter the cave floors everywhere and those around a fire can quite accidentally look as though they were arranged in a circle."}], "questions": [{"id": "neanderthal-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "We think of our prehistoric ancestors as people of the ice and snow, living in caves, and for many of the West European Neanderthalers that is an accurate picture of their life.", "target": "prehistoric ancestors", "options": ["people from whom later humans descended before written history", "recently discovered written records", "unrelated modern populations"], "answer": 0, "explanations": ["此處 prehistoric ancestors 表示「史前祖先」。須依原句語境理解。", "這個選項表示「最近發現的文字紀錄」；原句要表達的是「史前祖先」。", "這個選項表示「無親緣的現代族群」；原句要表達的是「史前祖先」。"], "tag": "搭配與語境義"}, {"id": "neanderthal-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "But where there were no caves, further to the east on the Russian steppe, for example, open-air sites with some sort of constructed shelter were the only option.", "target": "steppe", "options": ["a large open grassland region", "a steep rocky slope", "a tropical rainforest"], "answer": 0, "explanations": ["此處 steppe 表示「乾草原、草原地帶」。須依原句語境理解。", "這個選項表示「陡峭岩坡」；原句要表達的是「乾草原、草原地帶」。", "這個選項表示「熱帶雨林」；原句要表達的是「乾草原、草原地帶」。"], "tag": "字彙與語境義"}, {"id": "neanderthal-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "But where there were no caves, further to the east on the Russian steppe, for example, open-air sites with some sort of constructed shelter were the only option.", "target": "constructed shelter", "options": ["a protective structure deliberately built", "a naturally formed cave only", "an unprotected open space"], "answer": 0, "explanations": ["此處 constructed shelter 表示「人工搭建的遮蔽住處」。須依原句語境理解。", "這個選項表示「僅天然洞穴」；原句要表達的是「人工搭建的遮蔽住處」。", "這個選項表示「未受遮蔽的空地」；原句要表達的是「人工搭建的遮蔽住處」。"], "tag": "搭配與語境義"}, {"id": "neanderthal-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "We now know much more about the cave sites than the open-air ones because, historically, it was the cave sites of Western Europe that were first explored by archaeologists and also because open-air sites are harder to find — many of them have disappeared under deep mud deposits or under the rising postglacial seas.", "target": "archaeologists", "options": ["researchers studying past human life through material remains", "researchers predicting weather", "specialists treating inherited illness"], "answer": 0, "explanations": ["此處 archaeologists 表示「考古學家」。須依原句語境理解。", "這個選項表示「預測天氣的學者」；原句要表達的是「考古學家」。", "這個選項表示「治療遺傳病的專家」；原句要表達的是「考古學家」。"], "tag": "字彙與語境義"}, {"id": "neanderthal-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "We now know much more about the cave sites than the open-air ones because, historically, it was the cave sites of Western Europe that were first explored by archaeologists and also because open-air sites are harder to find — many of them have disappeared under deep mud deposits or under the rising postglacial seas.", "target": "mud deposits", "options": ["layers of mud laid down over tered in concentrations at some sites testifies to the Neanderthal people's use of fire: not surprising, since use of fire was, by Neanderthal times, an already ancient accomplishment of evolving humanity, and survival in the sub-arctic conditions faced by the Neanderthalers is inconceivable without control of fire.", "target": "inconceivable", "options": ["impossible or extremely difficult to imagine", "already fully documented", "unimportant to survival"], "answer": 0, "explanations": ["此處 inconceivable 表示「難以想像、不可能設想的」。須依原句語境理解。", "這個選項表示「已完整記錄的」；原句要表達的是「難以想像、不可能設想的」。", "這個選項表示「與生存無關緊要的」；原句要表達的是「難以想像、不可能設想的」。"], "tag": "字彙與語境義"}, {"id": "neanderthal-vocab-59", "mode": "vocab", "paragraph": "E", "sentence": "Fire gave warmth, light, heat for cooking and defence against predatory animals.", "target": "predatory animals", "options": ["animals that hunt others for food", "animals eating only plants", "animals kept only as companions"], "answer": 0, "explanations": ["此處 predatory animals 表示「掠食性動物」。須依原句語境理解。", "這個選項表示「純植食動物」；原句要表達的是「掠食性動物」。", "這個選項表示「只當伴侶飼養的動物」；原句要表達的是「掠食性動物」。"], "tag": "搭配與語境義"}, {"id": "neanderthal-vocab-60", "mode": "vocab", "paragraph": "E", "sentence": "A charred piece of birch from Krapina in Croatia is thought to be the remains of a fire-making twirl stick.", "target": "charred", "options": ["partly burned and blackened", "fully polished", "waterlogged without burning"], "answer": 0, "explanations": ["此處 charred 表示「燒焦、炭化的」。須依原句語境理解。", "這個選項表示「完全磨光的」；原句要表達的是「燒焦、炭化的」。", "這個選項表示「未燃燒而浸水的」；原句要表達的是「燒焦、炭化的」。"], "tag": "字彙與語境義"}, {"id": "neanderthal-vocab-61", "mode": "vocab", "paragraph": "E", "sentence": "A charred piece of birch from Krapina in Croatia is thought to be the remains of a fire-making twirl stick.", "target": "birch", "options": ["a type of tree", "a species of marine shellfish", "a naturally occurring stone"], "answer": 0, "explanations": ["此處 birch 表示「樺樹」。須依原句語境理解。", "這個選項表示「海生貝類物種」；原句要表達的是「樺樹」。", "這個選項表示「天然石頭」；原句要表達的是「樺樹」。"], "tag": "字彙與語境義"}, {"id": "neanderthal-vocab-62", "mode": "vocab", "paragraph": "E", "sentence": "But Neanderthal hearths, in the sense of specially constructed places for fire, are fewer and harder to identify with certainty than the mere ash piles that are a regular feature of their sites.", "target": "hearths", "options": ["places prepared or used for a fire", "the central organs pumping blood", "unrelated natural rock piles"], "answer": 0, "explanations": ["此處 hearths 表示「爐灶、火塘」。須依原句語境理解。", "這個選項表示「輸送血液的心臟」；原句要表達的是「爐灶、火塘」。", "這個選項表示「無關天然石堆」；原句要表達的是「爐灶、火塘」。"], "tag": "字彙與語境義"}, {"id": "neanderthal-vocab-63", "mode": "vocab", "paragraph": "E", "sentence": "But Neanderthal hearths, in the sense of specially constructed places for fire, are fewer and harder to identify with certainty than the mere ash piles that are a regular feature of their sites.", "target": "mere ash piles", "options": ["nothing more than heaps of ash", "elaborately built permanent fireplaces", "unburnt piles of animal skins"], "answer": 0, "explanations": ["此處 mere ash piles 表示「僅僅是灰堆」。須依原句語境理解。", "這個選項表示「精心搭建的永久壁爐」；原句要表達的是「僅僅是灰堆」。", "這個選項表示「未燃燒獸皮堆」；原句要表達的是「僅僅是灰堆」。"], "tag": "搭配與語境義"}, {"id": "neanderthal-vocab-64", "mode": "vocab", "paragraph": "E", "sentence": "Judging from the shallow penetration of heat effects under the ash, this fire was only of short duration.", "target": "shallow penetration", "options": ["limited extension beneath the surface", "complete spread to every depth", "a broad horizontal area only"], "answer": 0, "explanations": ["此處 shallow penetration 表示「淺層穿透」。須依原句語境理解。", "這個選項表示「擴散到全部深度」；原句要表達的是「淺層穿透」。", "這個選項表示「僅水平大面積」；原句要表達的是「淺層穿透」。"], "tag": "搭配與語境義"}, {"id": "neanderthal-vocab-65", "mode": "vocab", "paragraph": "E", "sentence": "Judging from the shallow penetration of heat effects under the ash, this fire was only of short duration.", "target": "of short duration", "options": ["lasting only a brief time", "small only in physical width", "used at very long intervals"], "answer": 0, "explanations": ["此處 of short duration 表示「持續時間短的」。須依原句語境理解。", "這個選項表示「僅物理寬度小的」；原句要表達的是「持續時間短的」。", "這個選項表示「每隔很長時間使用的」；原句要表達的是「持續時間短的」。"], "tag": "搭配與語境義"}, {"id": "neanderthal-vocab-66", "mode": "vocab", "paragraph": "E", "sentence": "It is not always easy to decide how much additional structure some fires possessed: claims of stone circles to contain the fire run up against the fact that stones tend to litter the cave floors everywhere and those around a fire can quite accidentally look as though they were arranged in a circle.", "target": "run up against", "options": ["encounter a difficulty or obstacle", "provide conclusive support for", "physically race towards"], "answer": 0, "explanations": ["此處 run up against 表示「遭遇、碰上阻礙」。須依原句語境理解。", "這個選項表示「為……提供確證」；原句要表達的是「遭遇、碰上阻礙」。", "這個選項表示「實際奔跑向」；原句要表達的是「遭遇、碰上阻礙」。"], "tag": "搭配與語境義"}, {"id": "neanderthal-vocab-67", "mode": "vocab", "paragraph": "E", "sentence": "It is not always easy to decide how much additional structure some fires possessed: claims of stone circles to contain the fire run up against the fact that stones tend to litter the cave floors everywhere and those around a fire can quite accidentally look as though they were arranged in a circle.", "target": "litter", "options": ["be scattered untidily across", "clean every part of", "cover deliberately with written signs"], "answer": 0, "explanations": ["此處 litter 表示「零亂散布於」。須依原句語境理解。", "這個選項表示「清潔所有部分」；原句要表達的是「零亂散布於」。", "這個選項表示「刻意覆上文字符號」；原句要表達的是「零亂散布於」。"], "tag": "字彙與語境義"}, {"id": "neanderthal-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "But where there were no caves, further to the east on the Russian steppe, for example, open-air sites with some sort of constructed shelter were the only option.", "target": "", "options": ["In places without caves, people had to rely on open-air sites with built shelter.", "Built shelters were unnecessary everywhere because every region had caves.", "Open-air sites were always preferred even where caves were abundant."], "answer": 0, "explanations": ["where 限定缺乏洞穴的地區，only option 不是普遍偏好。", "把局部無洞區域改成到處都有洞。", "唯一選擇不等於自由偏好，且原句沒有概括所有地區。"], "tag": "長難句理解", "structure": "But 引出與洞居的對照；where there were no caves 為地點條件；further...與 for example 插入舉例；open-air sites...were the only option 為主幹。"}, {"id": "neanderthal-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "We now know much more about the cave sites than the open-air ones because, historically, it was the cave sites of Western Europe that were first explored by archaeologists and also because open-air sites are harder to find — many of them have disappeared under deep mud deposits or under the rising postglacial seas.", "target": "", "options": ["Cave sites are better known partly because they were investigated first and partly because open-air sites are harder to discover.", "Cave sites are better known solely because no open-air sites ever existed.", "All surviving sites were explored at exactly the same time and are equally easy to find."], "answer": 0, "explanations": ["兩個 because 並列不同原因，much more...than 比較知識量。", "solely 刪掉多重原因；原文承認露天遺址存在。", "first explored 與 harder to find 否定同時及同難度。"], "tag": "長難句理解", "structure": "We know more about X than Y 為主幹；because 中 it was...that...為強調句；and also because...添第二原因；破折號後說明露天遺址失落情況。"}, {"id": "neanderthal-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "Caves, moreover, aid the survival of archaeological material and can preserve the records of remote millennia.", "target": "", "options": ["Caves help archaeological material survive, allowing evidence of very distant periods to be retained.", "Every object outside a cave is immediately destroyed.", "Caves preserve only written records created in recent decades."], "answer": 0, "explanations": ["aid 與 can 說保存優勢，不代表洞外一概消失；records 也不只文字。", "比較保存優勢不能推成洞外全部即刻毀壞。", "remote millennia 與最近數十年相反，考古紀錄含物質遺存。"], "tag": "長難句理解", "structure": "Caves 為主詞；aid...and can preserve...為並列謂語；moreover 承接另一理由；records of remote millennia 為久遠時期的證據。"}, {"id": "neanderthal-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "There were good supplies of flint to hand for axes and the like, and the caves were often sited in small river valleys that offered protection against the worst of the weather.", "target": "", "options": ["Tool-making stone was readily available, and sheltered river-valley locations offered weather protection.", "The caves were protected because flint had to be transported from distant countries.", "Flint was mentioned only as food rather than a tool-making material."], "answer": 0, "explanations": ["to hand 表易得，for axes 說用途；另一分句交代選址優勢。", "readily available 不是需遠途搬運。", "for axes and the like 不是食物。"], "tag": "長難句理解", "structure": "There were supplies...為存在句；to hand、for axes 修飾 supplies；and caves were sited...為被動分句；that offered...修飾 valleys。"}, {"id": "neanderthal-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "The Neanderthalers liked south-facing caves, for obvious reasons of sunshine and wind avoidance, and caves at some height above the valley floor offered refuge from floods and good game-watching vantage points.", "target": "", "options": ["Elevated caves offered both flood refuge and useful positions for observing game.", "The caves had to lie below the valley floor to protect people from flooding.", "The phrase game-watching refers to watching organised sporting contests."], "answer": 0, "explanations": ["at some height above 與 flood refuge 相互連結；game 為可獵動物。", "above 不能改 below，且防洪邏輯顛倒。", "史前覓食語境中的 game 非體育比賽。"], "tag": "長難句理解", "structure": "前半 liked south-facing caves...；and 後 caves at some height...為主詞；offered 後並列 refuge 與 vantage points；from floods 限定庇護對象。"}, {"id": "neanderthal-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "The Périgord region during the last ice age was, in fact, an exceptionally benign habitat for humans.", "target": "", "options": ["The region is described as unusually favourable for people compared with the broader Ice Age environment.", "The author claims no danger of any kind could exist in the region.", "The author describes the region as more hostile than every other Ice Age location."], "answer": 0, "explanations": ["exceptionally benign 指相對有利，不保證零風險。", "有利不等於所有危險皆無。", "benign 與 hostile 方向相反。"], "tag": "長難句理解", "structure": "The region...was...為主幹；during the last ice age 為時間；in fact 插入強調；for humans 限定評價對象，不能擴大為絕對安全。"}, {"id": "neanderthal-paraphrase-7", "mode": "paraphrase", "paragraph": "B", "sentence": "It enjoyed a rather maritime climate with cooler summers that permitted the extension of tundra and steppe over its higher plateaux, and its year-round high levels of sunshine favoured the growth of the ground plants needed by reindeer, bison and horse.", "target": "", "options": ["Climate and sunshine supported vegetation, helping sustain animals used as food.", "Sunshine prevented all plants from growing, leaving no animals in the area.", "The statement concerns only a single summer rather than year-round conditions."], "answer": 0, "explanations": ["permitted、favoured 都描述有利植物的條件；needed by 指動物所需。", "growth 被改成完全抑制，因果方向相反。", "year-round 不能縮為某一夏季。"], "tag": "長難句理解", "structure": "It enjoyed...為主幹；with cooler summers that permitted...補氣候；and its sunshine favoured...並列；needed by...被動分詞修飾 ground plants。"}, {"id": "neanderthal-paraphrase-8", "mode": "paraphrase", "paragraph": "B", "sentence": "Winters were mildish for the ice age, animals never needed to migrate far from summer to winter, and men never needed to travel far from home to find abundant supplies of meat.", "target": "", "options": ["Relatively mild winters reduced the need for animals and people to travel far for food.", "The passage says no animals ever moved anywhere in any season.", "People had to leave the region every winter because meat disappeared."], "answer": 0, "explanations": ["never needed to migrate far 表無需遠遷，不等於完全不移動。", "不需遠行不能改成任何動物永遠不動。", "原句說肉源充足、無需遠行，非必須每冬離開。"], "tag": "長難句理解", "structure": "三個並列分句依次為 Winters were...、animals never needed...、men never needed...；for the ice age 提供相對比較基準，to find...表覓食目的。"}, {"id": "neanderthal-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "In Central and Eastern Europe, where caves are less readily available, such open-air sites as have been discovered were mostly located near water: bottom-land was a good place for people and animals to live, and the sedimentation pattern of lakes and stream courses has aided archaeological preservation — whereas erosion has presumably blown away sites which were out in the open.", "target": "", "options": ["The discovered open-air sites were mainly near water, where living conditions and sedimentary preservation were favourable.", "Every original open-air settlement has survived and was necessarily near water.", "The author says water always destroys every trace of occupation."], "answer": 0, "explanations": ["such...as have been discovered 限定目前已發現的樣本；mostly 非全部。", "把已發現樣本擴到全部原址，mostly 改成 necessarily。", "sedimentation aided preservation 不是水皆毀壞。"], "tag": "長難句理解", "structure": "where caves are less available 插入地區背景；such sites as...指已發現的那些遺址；were mostly located...為主幹；冒號後說明位置與保存因素。"}, {"id": "neanderthal-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "In Central and Eastern Europe, where caves are less readily available, such open-air sites as have been discovered were mostly located near water: bottom-land was a good place for people and animals to live, and the sedimentation pattern of lakes and stream courses has aided archaeological preservation — whereas erosion has presumably blown away sites which were out in the open.", "target": "", "options": ["Erosion is offered as a probable reason why some exposed sites have disappeared.", "The author presents a directly witnessed destruction of every open-air site.", "The author rules out erosion as a possible explanation."], "answer": 0, "explanations": ["presumably 為推測，whereas 對照沉積保存與侵蝕損失。", "推測不是親見，也沒有 every site 的範圍。", "原句正把侵蝕列為可能解釋。"], "tag": "長難句理解", "structure": "whereas 引出對照；erosion has presumably blown away...為主幹；which were out in the open 修飾 sites；presumably 限定因果解釋的確定度。"}, {"id": "neanderthal-paraphrase-11", "mode": "paraphrase", "paragraph": "C", "sentence": "From Moldova, for example, comes evidence that has been interpreted as the remains of wind-breaks, or even a large tent-ring, up to about 8 x 5 m in size, of mainly mammoth bones enclosing a dense concentration of stone tools, animal bones and ash.", "target": "", "options": ["Bone arrangements at the cited site have been interpreted as protective structures surrounding tools and other remains.", "Excavators have directly observed an intact occupied mammoth-bone tent.", "The arrangement is said to contain no tools, bones or ash."], "answer": 0, "explanations": ["has been interpreted 保留解釋性；enclosing...說內部密集遺物。", "遺跡的解讀不等於親見完整使用中的帳棚。", "後半明列 stone tools、bones、ash。"], "tag": "長難句理解", "structure": "From Moldova 地點置前，comes evidence 為倒裝；that has been interpreted...修飾 evidence；of mainly mammoth bones 補結構材料；enclosing...分詞說包圍內容。"}, {"id": "neanderthal-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "In the Grotte du Lazaret, near Nice, at a date during the last ice age but one, claims for some sort of skin tent within the cave have been advanced, on the basis of arrangements of large stones out from the cave wall that might have supported timber struts for a covering of skins up to the rock face above.", "target": "", "options": ["The proposed skin tent belongs to the ice age before the most recent one and is inferred from stone arrangements.", "The writer dates a fully proved tent to a period after the most recent ice age.", "The stone arrangements conclusively establish every detail of the tent's construction."], "answer": 0, "explanations": ["but one 指倒數第二；claims、might 都保留假說。", "年代與確定程度都被改變。", "might have supported 不等於所有建造細節已定論。"], "tag": "長難句理解", "structure": "In the Grotte...為地點；at a date...為時間；claims...have been advanced 為被動主幹；on the basis of...表依據；that might have supported...修飾 stones。"}, {"id": "neanderthal-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "At Lazaret, what might be openings in the hypothesised tents seem to point away from the cave mouth, and finds of wolf and fox foot bones, without the rest of the skeletons, inside these ‘tents’ have been thought to indicate the use of animal pelts as bed coverings.", "target": "", "options": ["Possible openings seem oriented away from the cave entrance, while selected animal bones have been taken as evidence of fur bedding.", "The writer proves that whole wolf skeletons were used as structural pillars.", "The openings are certainly identified and point directly towards the cave entrance."], "answer": 0, "explanations": ["might、seem、have been thought 都限制確定性；without the rest...也很重要。", "不是全副骨骼，更未說作支柱。", "把可能改確定，away 改 towards。"], "tag": "長難句理解", "structure": "what might be openings 為主詞子句；seem to point...為主幹；and finds...have been thought...為第二被動主句；without...限定發現的是部分骨骼。"}, {"id": "neanderthal-paraphrase-14", "mode": "paraphrase", "paragraph": "D", "sentence": "The two patches of ash at Lazaret that mark ancient fires, with stone tools around them evidently made and used on the spot, are edged with small marine mollusc shells, prompting the excavator to suggest that seaweed had been used as bedding around the fires.", "target": "", "options": ["Shells bordering the ash led the excavator to propose seaweed as material around the fires.", "The shells were themselves conclusively identified as intact seaweed beds.", "The excavator rejected all possible use of seaweed despite the shells."], "answer": 0, "explanations": ["prompting...to suggest 表從發現提出解釋，不是直接證實。", "shells 與推定海草鋪物不是同一材料。", "suggest that...是提出，不是拒絕。"], "tag": "長難句理解", "structure": "The two patches of ash 為長主詞；that mark...修飾 ash；with stone tools...補周遭；are edged...為被動主幹；prompting...為結果分詞。"}, {"id": "neanderthal-paraphrase-15", "mode": "paraphrase", "paragraph": "D", "sentence": "The cave of Baume-Bonne in the Basses-Alpes region of France, another early site, boasts ten square metres of cobbles brought up from the local river and laid down, as though to take care of a puddle area in the cave, with the smoothest and roundest surfaces of the stones uppermost, and there are other similar cases.", "target": "", "options": ["Stones were laid with smooth rounded faces upward, apparently to deal with wet ground.", "The account says the sharpest stone surfaces were deliberately left upward.", "The phrase as though proves the builders' purpose beyond doubt."], "answer": 0, "explanations": ["smoothest...uppermost 描述擺向；as though 只類比推測用途。", "將最平滑朝上換成最尖銳朝上。", "as though 不能升為已確證目的。"], "tag": "長難句理解", "structure": "boasts...為擁有義；brought up...and laid down...為並列被動分詞；as though to...表推定目的；with...surfaces...uppermost 為伴隨狀態。"}, {"id": "neanderthal-paraphrase-16", "mode": "paraphrase", "paragraph": "E", "sentence": "The ash encountered in concentrations at some sites testifies to the Neanderthal people's use of fire: not surprising, since use of fire was, by Neanderthal times, an already ancient accomplishment of evolving humanity, and survival in the sub-arctic conditions faced by the Neanderthalers is inconceivable without control of fire.", "target": "", "options": ["Ash concentrations support the use of fire, which the writer sees as necessary for survival in the stated cold conditions.", "The ash proves every site contained an elaborately constructed permanent hearth.", "The writer argues people could readily survive the stated conditions without fire."], "answer": 0, "explanations": ["火的存在與專門火塘的存在不同；後文正區別兩種證據。", "不能由有灰直接推為有精建永久爐。", "inconceivable without fire 與無火輕易生存相反。"], "tag": "長難句理解", "structure": "The ash...testifies to...為主幹；not surprising 為省略評論；since 後列古老技能與寒冷生存理由；without control of fire 為必要條件的否定表達。"}, {"id": "neanderthal-paraphrase-17", "mode": "paraphrase", "paragraph": "E", "sentence": "A charred piece of birch from Krapina in Croatia is thought to be the remains of a fire-making twirl stick.", "target": "", "options": ["The burnt birch is tentatively identified as a remnant of a fire-making implement.", "The wood has been conclusively shown to be a complete modern match.", "The passage says the wood could not have any connection with fire."], "answer": 0, "explanations": ["is thought to be 限定推定；remains 非完整原物。", "把推定改確證、殘件改完整，還改成現代火柴。", "原句解釋正與生火有關。"], "tag": "長難句理解", "structure": "A charred piece...為主詞；is thought to be...為被動報告；the remains of...為補語；fire-making 修飾 twirl stick，說明可能用途。"}, {"id": "neanderthal-paraphrase-18", "mode": "paraphrase", "paragraph": "E", "sentence": "But Neanderthal hearths, in the sense of specially constructed places for fire, are fewer and harder to identify with certainty than the mere ash piles that are a regular feature of their sites.", "target": "", "options": ["Specially built hearths are less common and harder to establish confidently than simple ash accumulations.", "Every ash heap is automatically a purpose-built hearth.", "Hearths are described as more numerous and easier to identify than ash piles."], "answer": 0, "explanations": ["比較區分構造證據與燃燒殘留，不可混為一類。", "ash 與 prepared place 不能直接等同。", "fewer、harder 不可改 more、easier。"], "tag": "長難句理解", "structure": "But hearths 為主詞；in the sense of...插入定義；are fewer and harder...為並列比較；than...ash piles 為共同比較對象。"}, {"id": "neanderthal-paraphrase-19", "mode": "paraphrase", "paragraph": "E", "sentence": "Judging from the shallow penetration of heat effects under the ash, this fire was only of short duration.", "target": "", "options": ["Limited heat penetration is used to infer that the particular fire burned only briefly.", "The shallow heat effects establish that every fire at every site burned for years.", "The inference is based on the height of the cave roof rather than heat effects."], "answer": 0, "explanations": ["Judging from 是推論依據，this fire 限定個案。", "個案短時不能改成全部長年。", "依據是灰下受熱深度，不是洞頂高度。"], "tag": "長難句理解", "structure": "Judging from...為推論分詞片語；this fire was...為主句；under the ash 修飾 heat effects 的位置；of short duration 表持續時間。"}, {"id": "neanderthal-paraphrase-20", "mode": "paraphrase", "paragraph": "E", "sentence": "It is not always easy to decide how much additional structure some fires possessed: claims of stone circles to contain the fire run up against the fact that stones tend to litter the cave floors everywhere and those around a fire can quite accidentally look as though they were arranged in a circle.", "target": "", "options": ["Apparent circles may be accidental because cave floors naturally contain many scattered stones.", "Every ring-shaped arrangement conclusively proves deliberate construction.", "The author says caves never contain loose stones except beside a built fire."], "answer": 0, "explanations": ["run up against 提出另一解釋；can accidentally look...不等於一定刻意。", "外觀像圓不保證人造，原句正警告此推論。", "stones tend to litter...everywhere 明說普遍散石。"], "tag": "長難句理解", "structure": "冒號後 claims...run up against the fact...為主幹；that 後含兩個並列事實；those 指 stones；as though...為外觀類比，不是實際證明。"}, {"id": "neanderthal-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "Evidence of outdoor dwellings.", "target": "dwellings", "options": ["住處、居所", "野外獵物", "天然植被"], "answer": 0, "explanations": ["dwellings 指人居住的地方。此處練習題目用語，不表示整句符合原文。", "獵物是 game，非 dwellings", "不是植物"], "tag": "題目字彙", "source": "Question 27–31 Heading i · 題目用語"}, {"id": "neanderthal-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "Contrasting two types of home.", "target": "Contrasting", "options": ["對比、比較差異", "證明完全相同", "只計算數量"], "answer": 0, "explanations": ["contrast 是比較相異處。此處練習題目用語，不表示整句符合原文。", "不是抹除差異", "不是純數量統計"], "tag": "題目字彙", "source": "Question 27–31 Heading v · 題目用語"}, {"id": "neanderthal-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "A vital source of power.", "target": "vital", "options": ["至關重要的", "可有可無的", "必然危險的"], "answer": 0, "explanations": ["vital 表不可或缺的重要性。此處練習題目用語，不表示整句符合原文。", "可有可無與重要相反", "重要不等於危險"], "tag": "題目字彙", "source": "Question 27–31 Heading vi · 題目用語"}, {"id": "neanderthal-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Evidence of efforts to prevent pools of water forming.", "target": "pools", "options": ["積水、水窪", "有蓋游泳池才適用", "共用的金錢基金"], "answer": 0, "explanations": ["洞穴語境為聚成一攤的水。此處練習題目用語，不表示整句符合原文。", "pool 不限人工泳池", "此處不是資金池"], "tag": "題目字彙", "source": "Question 32–36 · 題目用語"}, {"id": "neanderthal-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "Remains of sea creatures.", "target": "Remains", "options": ["殘骸、遺存", "尚未來到的時代", "海面亮光"], "answer": 0, "explanations": ["remains 此處是生物留下的殼等材料。此處練習題目用語，不表示整句符合原文。", "不是未來時期", "不是光線"], "tag": "題目字彙", "source": "Question 32–36 · 題目用語"}, {"id": "neanderthal-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "A circular arrangement of animal bones.", "target": "arrangement", "options": ["排列、配置", "事前約會安排", "天然動物分類"], "answer": 0, "explanations": ["此處是骨頭在空間中的排布。此處練習題目用語，不表示整句符合原文。", "不是約會", "不是分類學"], "tag": "題目字彙", "source": "Question 32–36 · 題目用語"}, {"id": "neanderthal-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Evidence suggesting the use of animal fur for warmth.", "target": "suggesting", "options": ["暗示、支持某種解釋", "毫無疑問地確證", "完全排除"], "answer": 0, "explanations": ["suggesting 比 proving 的證據力度弱。此處練習題目用語，不表示整句符合原文。", "不能把暗示升格為確證", "支持可能性不等於排除"], "tag": "題目字彙", "source": "Question 32–36 · 題目用語"}, {"id": "neanderthal-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Most evidence of purpose-built fires takes the form of ash piles.", "target": "purpose-built", "options": ["為特定用途建造的", "完全自然形成的", "任何偶然留下的"], "answer": 0, "explanations": ["purpose-built 指刻意為某用途搭建。此處練習題目用語，不表示整句符合原文。", "不是自然成因", "不是所有偶然遺留"], "tag": "題目字彙", "source": "Question 37–39 · 題目用語"}, {"id": "neanderthal-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "The fires needed to protect occupants from predatory animals.", "target": "occupants", "options": ["住在或使用該處的人", "只指訪問考古學家", "全部被獵動物"], "answer": 0, "explanations": ["occupants 在此指居住使用洞穴者。此處練習題目用語，不表示整句符合原文。", "不限定現代研究者", "不是動物獵物"], "tag": "題目字彙", "source": "Question 37–39 · 題目用語"}, {"id": "neanderthal-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "The fires needed to protect occupants from predatory animals.", "target": "predatory", "options": ["掠食性的", "只吃植物的", "已被完全馴化的"], "answer": 0, "explanations": ["predatory animals 指會捕食的動物。此處練習題目用語，不表示整句符合原文。", "不是純植食", "不等於已馴化"], "tag": "題目字彙", "source": "Question 37–39 · 題目用語"}, {"id": "neanderthal-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "Discuss what is known about Neanderthal settlements.", "target": "settlements", "options": ["聚落、居住地", "金錢清償", "已完成的法律和解"], "answer": 0, "explanations": ["考古語境為人居地點。此處練習題目用語，不表示整句符合原文。", "不是還款", "不是訴訟和解"], "tag": "題目字彙", "source": "Question 40 C · 題目用語"}]}, {"id": "social-history", "title": "What Is Social History?", "sourceTitle": "What Is Social History?", "subtitle": "", "part": 3, "topic": "社會史、文化思潮與歷史批判", "sourceNote": "本文包含作者對史學的評論；could be said、arguably 等不是無條件事實。普通人的分類、同理與批判的關係須依論證理解。", "paragraphs": [{"label": "A", "text": "Ever since its elevation to the status of an academic discipline, history has been very largely concerned with problems of its own making. These may be gaps which the young researcher is advised by supervisors to fill; or established views which he or she is encouraged to challenge. In either case, the need for the researcher to provide new insights in order to gain professional advancement often counts for more than the intrinsic interest of the topic. Social history is quite different. It touches on, and arguably helps to focus, major issues of public debate. It mobilises popular enthusiasm and engages popular passions. It prides itself on being concerned with everyday things rather than sensational events and is directed against the ‘Great Man’ theories that originally characterised history, and the tedious focus on bureaucratic issues that subsequently dominated the 1920s and 30s. This is also reflected in the way it is taught, through the adoption of multi-disciplinary perspectives rather than a narrow historical interpretation."}, {"label": "B", "text": "Social history emerged, both as a popular enthusiasm and as a scholarly practice, from the cultural revolution of the 1960s in North America and Europe, and reproduces its leading inspirations. The spirit of social history was pre-eminently a modernising one, as reflected in its choice of subject matter. Whereas traditional history had focused on the 12th to 17th centuries, social history was apt to make its historical homeland in the 19th century. Latterly, it has even begun to extend its inquiry up to contemporary events and movements. The subject matter favoured by the new social history, with its move away from the aristocracy and the establishment, corresponds to other cultural manifestations of the 1960s, such as New Wave British cinema, with its working-class protagonists, or ‘Pop art’, with its use of everyday artefacts. Similarly, the anti-institutional bias of the new social history—the renewed determination to write the history of ‘ordinary’ people as against that of statecraft—could be said to echo a much more widespread collapse of social deference, and a questioning of authority figures of all kinds."}, {"label": "C", "text": "Another major 1960s influence on the new social history—very different in its origins and effects—was the ‘nostalgia industry’, which focused on the sale of memorabilia and artefacts from recent history. This emerged as a kind of negative counterpart to the otherwise dominant modernisation of the decade and reflected a disenchantment, no less apparent on the Left of the political spectrum than on the Right, with post-war social change. Industrial archaeology, an invention of the 1960s, elevated disused factories and mills to the status of national monuments. Following in the same track, property restorers turned houses built for 19th-century factory workers—once emblems of poverty, overcrowding, and ill-health—into picturesque residences. In another sphere, one could point to the proliferation of folk clubs and the discovery of industrial folk songs, prefiguring one of the major themes of the new social history—the dignity of labour."}, {"label": "D", "text": "So far as historical work was concerned, by the 1970s the sense of disenchantment had crystallised into an idealised view of the past, fostering a nostalgic regard for disappearing communities. The restoration of vanished components of ‘the world we have lost’ became a major impetus in historical writing and research. The dignity of ordinary people could be said to be the unifying theme of this line of historical inquiry and retrieval—a celebration of everyday life, even, perhaps especially, when it involved hardship and suffering."}, {"label": "E", "text": "Despite the novelty of its subject matter, social history reproduces many of the characteristic biases of its predecessors. Social historians are good at amassing details on household artefacts, budgets, daily purchases, but at times the evidence is assumed to speak for itself, and the simple reproduction of fact masquerades as explanation. The facts accumulated may leave no conceptual space for the great absences, for the many areas where the documentary record is silent."}, {"label": "F", "text": "The indulgence which social historians extend towards their subjects, and the desire to establish ‘empathy’—seeing the past in terms of its own values rather than those of today— can also serve to flatter our self-esteem, making history a field in which, at no great cost to ourselves, we can demonstrate our enlarged sympathies and benevolence. Recognising our kinship to people in the past, and tracing, or discovering, their likeness to ourselves, we are flattered in the belief that underneath we are all lovable; eccentric perhaps and even absurd, but large-hearted, generous and frank. This sense of integration with the past can thus serve as a comfortable alternative to critical awareness and self-questioning, allowing us to dignify the present by illegitimate association with the past."}, {"label": "G", "text": "Social history, if it is to fulfil its subversive potential, needs to be a great deal more disturbing. If it is to celebrate a common humanity, and to bring past and present closer together, far more weight needs to be given to the effects of insecurities and emergencies—the fears that shadow the growing up of children, the oppositions we encounter during our lives—experiences which may be hard for an individual to categorise but which nevertheless have a significance which goes beyond that individual. Perhaps too we might recognise that there is a profound condescension in the notion of ‘ordinary people’—that unified totality in which social historians are apt to deal. Implicitly, it is a category from which we tend to exclude ourselves, although in fact we are exceptional only by our privilege of hindsight. ‘There are ... no masses,’ Raymond Williams wrote, ‘only ways of seeing people as masses.’ It is perhaps time for historians to scrutinise the term ‘ordinary people’ in the same way."}], "questions": [{"id": "history-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Ever since its elevation to the status of an academic discipline, history has been very largely concerned with problems of its own making.", "target": "elevation", "options": ["raising to a higher status", "increase in geographical height only", "a decline in academic importance"], "answer": 0, "explanations": ["此處 elevation 表示「提升地位」。須依原句語境理解。", "這個選項表示「僅地理高度增加」；原句要表達的是「提升地位」。", "這個選項表示「學術重要性降低」；原句要表達的是「提升地位」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Ever since its elevation to the status of an academic discipline, history has been very largely concerned with problems of its own making.", "target": "academic discipline", "options": ["a recognised field of study", "punishment imposed at school", "an individual's personal self-control"], "answer": 0, "explanations": ["此處 academic discipline 表示「學術學科」。須依原句語境理解。", "這個選項表示「學校施加的懲罰」；原句要表達的是「學術學科」。", "這個選項表示「個人的自制力」；原句要表達的是「學術學科」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "Ever since its elevation to the status of an academic discipline, history has been very largely concerned with problems of its own making.", "target": "of its own making", "options": ["created by itself", "entirely imposed by outsiders", "made from original raw materials"], "answer": 0, "explanations": ["此處 of its own making 表示「由自身造成的」。須依原句語境理解。", "這個選項表示「完全由外界強加的」；原句要表達的是「由自身造成的」。", "這個選項表示「以原始材料製成的」；原句要表達的是「由自身造成的」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "These may be gaps which the young researcher is advised by supervisors to fill; or established views which he or she is encouraged to challenge.", "target": "established views", "options": ["widely accepted existing interpretations", "new ideas no one has considered", "legally required opinions"], "answer": 0, "explanations": ["此處 established views 表示「既有公認觀點」。須依原句語境理解。", "這個選項表示「尚未考慮的新想法」；原句要表達的是「既有公認觀點」。", "這個選項表示「法律強制意見」；原句要表達的是「既有公認觀點」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "These may be gaps which the young researcher is advised by supervisors to fill; or established views which he or she is encouraged to challenge.", "target": "challenge", "options": ["question or dispute", "accept without examination", "make physically more difficult"], "answer": 0, "explanations": ["此處 challenge 表示「質疑、挑戰」。須依原句語境理解。", "這個選項表示「未檢驗便接受」；原句要表達的是「質疑、挑戰」。", "這個選項表示「使體力上更艱難」；原句要表達的是「質疑、挑戰」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "In either case, the need for the researcher to provide new insights in order to gain professional advancement often counts for more than the intrinsic interest of the topic.", "target": "insights", "options": ["new or deeper understanding", "raw facts without interpretation", "private feelings alone"], "answer": 0, "explanations": ["此處 insights 表示「洞見、深入理解」。須依原句語境理解。", "這個選項表示「未解讀的原始事實」；原句要表達的是「洞見、深入理解」。", "這個選項表示「僅私人感受」；原句要表達的是「洞見、深入理解」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "In either case, the need for the researcher to provide new insights in order to gain professional advancement often counts for more than the intrinsic interest of the topic.", "target": "professional advancement", "options": ["progress in a career", "a literal advance payment", "the end of all employment"], "answer": 0, "explanations": ["此處 professional advancement 表示「專業職涯晉升」。須依原句語境理解。", "這個選項表示「實際預付款」；原句要表達的是「專業職涯晉升」。", "這個選項表示「全部就業的終結」；原句要表達的是「專業職涯晉升」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "In either case, the need for the researcher to provide new insights in order to gain professional advancement often counts for more than the intrinsic interest of the topic.", "target": "counts for more than", "options": ["is regarded as more important than", "has a larger numerical total only", "is completely identical to"], "answer": 0, "explanations": ["此處 counts for more than 表示「比……更重要」。須依原句語境理解。", "這個選項表示「僅數量總計較多」；原句要表達的是「比……更重要」。", "這個選項表示「與……完全相同」；原句要表達的是「比……更重要」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "In either case, the need for the researcher to provide new insights in order to gain professional advancement often counts for more than the intrinsic interest of the topic.", "target": "intrinsic interest", "options": ["interest arising from the subject itself", "interest added only by financial rewards", "money charged on a loan"], "answer": 0, "explanations": ["此處 intrinsic interest 表示「題目本身的內在吸引力」。須依原句語境理解。", "這個選項表示「僅由金錢報酬附加的興趣」；原句要表達的是「題目本身的內在吸引力」。", "這個選項表示「貸款利息」；原句要表達的是「題目本身的內在吸引力」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-10", "mode": "vocab", "paragraph": "A", "sentence": "It touches on, and arguably helps to focus, major issues of public debate.", "target": "touches on", "options": ["deals with or relates to", "physically makes light contact with", "fully resolves every aspect of"], "answer": 0, "explanations": ["此處 touches on 表示「涉及、觸及」。須依原句語境理解。", "這個選項表示「實際輕碰」；原句要表達的是「涉及、觸及」。", "這個選項表示「全面解決所有層面」；原句要表達的是「涉及、觸及」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-11", "mode": "vocab", "paragraph": "A", "sentence": "It touches on, and arguably helps to focus, major issues of public debate.", "target": "arguably", "options": ["as can reasonably be maintained", "beyond any possibility of disagreement", "without any conceivable reason"], "answer": 0, "explanations": ["此處 arguably 表示「可以說、可主張地」。須依原句語境理解。", "這個選項表示「絕無爭議地」；原句要表達的是「可以說、可主張地」。", "這個選項表示「完全沒有可想原因地」；原句要表達的是「可以說、可主張地」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-12", "mode": "vocab", "paragraph": "A", "sentence": "It mobilises popular enthusiasm and engages popular passions.", "target": "mobilises", "options": ["brings into active use or action", "permanently suppresses", "physically moves a building"], "answer": 0, "explanations": ["此處 mobilises 表示「動員、激發」。須依原句語境理解。", "這個選項表示「永久壓抑」；原句要表達的是「動員、激發」。", "這個選項表示「實際搬動建物」；原句要表達的是「動員、激發」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-13", "mode": "vocab", "paragraph": "A", "sentence": "It mobilises popular enthusiasm and engages popular passions.", "target": "engages popular passions", "options": ["draws on and involves strong public feelings", "hires people to act as officials", "eliminates all emotion from debate"], "answer": 0, "explanations": ["此處 engages popular passions 表示「引發、連結公眾的強烈情感」。須依原句語境理解。", "這個選項表示「僱人任官」；原句要表達的是「引發、連結公眾的強烈情感」。", "這個選項表示「消除辯論全部情感」；原句要表達的是「引發、連結公眾的強烈情感」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-14", "mode": "vocab", "paragraph": "A", "sentence": "It prides itself on being concerned with everyday things rather than sensational events and is directed against the ‘Great Man’ theories that originally characterised history, and the tedious focus on bureaucratic issues that subsequently dominated the 1920s and 30s.", "target": "prides itself on", "options": ["takes particular satisfaction in", "feels ashamed of", "refuses to discuss"], "answer": 0, "explanations": ["此處 prides itself on 表示「以……自豪」。須依原句語境理解。", "這個選項表示「以……為恥」；原句要表達的是「以……自豪」。", "這個選項表示「拒絕討論」；原句要表達的是「以……自豪」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-15", "mode": "vocab", "paragraph": "A", "sentence": "It prides itself on being concerned with everyday things rather than sensational events and is directed against the ‘Great Man’ theories that originally characterised history, and the tedious focus on bureaucratic issues that subsequently dominated the 1920s and 30s.", "target": "sensational", "options": ["striking or dramatic enough to attract intense attention", "quietly ordinary", "necessarily inaccurate"], "answer": 0, "explanations": ["此處 sensational 表示「轟動、引人注目的」。須依原句語境理解。", "這個選項表示「安靜平凡的」；原句要表達的是「轟動、引人注目的」。", "這個選項表示「必然不正確的」；原句要表達的是「轟動、引人注目的」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-16", "mode": "vocab", "paragraph": "A", "sentence": "It prides itself on being concerned with everyday things rather than sensational events and is directed against the ‘Great Man’ theories that originally characterised history, and the tedious focus on bureaucratic issues that subsequently dominated the 1920s and 30s.", "target": "tedious", "options": ["boring through excessive length or repetition", "immediately exciting", "too brief to understand"], "answer": 0, "explanations": ["此處 tedious 表示「冗長乏味的」。須依原句語境理解。", "這個選項表示「立刻令人興奮的」；原句要表達的是「冗長乏味的」。", "這個選項表示「簡短到無法理解的」；原句要表達的是「冗長乏味的」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-17", "mode": "vocab", "paragraph": "A", "sentence": "It prides itself on being concerned with everyday things rather than sensational events and is directed against the ‘Great Man’ theories that originally characterised history, and the tedious focus on bureaucratic issues that subsequently dominated the 1920s and 30s.", "target": "bureaucratic", "options": ["relating to official administrative systems", "relating only to private family life", "opposed to all written records"], "answer": 0, "explanations": ["此處 bureaucratic 表示「官僚行政的」。須依原句語境理解。", "這個選項表示「僅關私人家庭生活的」；原句要表達的是「官僚行政的」。", "這個選項表示「反對全部文字紀錄的」；原句要表達的是「官僚行政的」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-18", "mode": "vocab", "paragraph": "A", "sentence": "This is also reflected in the way it is taught, through the adoption of multi-disciplinary perspectives rather than a narrow historical interpretation.", "target": "multi-disciplinary perspectives", "options": ["viewpoints drawing on several fields of study", "views confined to one narrow field", "personal opinions without any evidence"], "answer": 0, "explanations": ["此處 multi-disciplinary perspectives 表示「跨學科觀點」。須依原句語境理解。", "這個選項表示「侷限單一狹窄學科的觀點」；原句要表達的是「跨學科觀點」。", "這個選項表示「完全無證據的個人意見」；原句要表達的是「跨學科觀點」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-19", "mode": "vocab", "paragraph": "B", "sentence": "Social history emerged, both as a popular enthusiasm and as a scholarly practice, from the cultural revolution of the 1960s in North America and Europe, and reproduces its leading inspirations.", "target": "scholarly practice", "options": ["work conducted as academic research", "informal school entertainment", "professional military training"], "answer": 0, "explanations": ["此處 scholarly practice 表示「學術研究實踐」。須依原句語境理解。", "這個選項表示「非正式學校娛樂」；原句要表達的是「學術研究實踐」。", "這個選項表示「專業軍事訓練」；原句要表達的是「學術研究實踐」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-20", "mode": "vocab", "paragraph": "B", "sentence": "The spirit of social history was pre-eminently a modernising one, as reflected in its choice of subject matter.", "target": "pre-eminently", "options": ["above all or especially", "only after complete failure", "with no particular importance"], "answer": 0, "explanations": ["此處 pre-eminently 表示「首要地、尤其」。須依原句語境理解。", "這個選項表示「只在完全失敗後」；原句要表達的是「首要地、尤其」。", "這個選項表示「毫無特別重要性地」；原句要表達的是「首要地、尤其」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-21", "mode": "vocab", "paragraph": "B", "sentence": "The spirit of social history was pre-eminently a modernising one, as reflected in its choice of subject matter.", "target": "subject matter", "options": ["the topics being studied or discussed", "the physical material of a document", "a person's emotional condition"], "answer": 0, "explanations": ["此處 subject matter 表示「研究、討論的主題內容」。須依原句語境理解。", "這個選項表示「文件的實際材質」；原句要表達的是「研究、討論的主題內容」。", "這個選項表示「個人情緒狀態」；原句要表達的是「研究、討論的主題內容」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-22", "mode": "vocab", "paragraph": "B", "sentence": "Whereas traditional history had focused on the 12th to 17th centuries, social history was apt to make its historical homeland in the 19th century.", "target": "apt to", "options": ["inclined or likely to", "certain never to", "legally obliged to"], "answer": 0, "explanations": ["此處 apt to 表示「傾向、往往會」。須依原句語境理解。", "這個選項表示「肯定絕不會」；原句要表達的是「傾向、往往會」。", "這個選項表示「依法必須」；原句要表達的是「傾向、往往會」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-23", "mode": "vocab", "paragraph": "B", "sentence": "Whereas traditional history had focused on the 12th to 17th centuries, social history was apt to make its historical homeland in the 19th century.", "target": "historical homeland", "options": ["the period treated as its characteristic area of study", "the country where all historians were born", "a literally owned ancestral house"], "answer": 0, "explanations": ["此處 historical homeland 表示「主要著力的歷史時期」。須依原句語境理解。", "這個選項表示「全部歷史學家的出生國」；原句要表達的是「主要著力的歷史時期」。", "這個選項表示「實際擁有的祖宅」；原句要表達的是「主要著力的歷史時期」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-24", "mode": "vocab", "paragraph": "B", "sentence": "Latterly, it has even begun to extend its inquiry up to contemporary events and movements.", "target": "Latterly", "options": ["more recently", "in the first stage only", "on the left side"], "answer": 0, "explanations": ["此處 Latterly 表示「近來、後來」。須依原句語境理解。", "這個選項表示「僅最初階段」；原句要表達的是「近來、後來」。", "這個選項表示「在左側」；原句要表達的是「近來、後來」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-25", "mode": "vocab", "paragraph": "B", "sentence": "Latterly, it has even begun to extend its inquiry up to contemporary events and movements.", "target": "inquiry", "options": ["systematic investigation or study", "a fixed unquestionable answer", "a ceremonial speech only"], "answer": 0, "explanations": ["此處 inquiry 表示「探究、研究」。須依原句語境理解。", "這個選項表示「固定不可質疑的答案」；原句要表達的是「探究、研究」。", "這個選項表示「僅典禮演說」；原句要表達的是「探究、研究」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-26", "mode": "vocab", "paragraph": "B", "sentence": "Latterly, it has even begun to extend its inquiry up to contemporary events and movements.", "target": "contemporary events", "options": ["events of the present or recent period", "events confined to ancient times", "events always occurring simultaneously"], "answer": 0, "explanations": ["此處 contemporary events 表示「當代事件」。須依原句語境理解。", "這個選項表示「僅古代事件」；原句要表達的是「當代事件」。", "這個選項表示「總在同時發生的事件」；原句要表達的是「當代事件」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-27", "mode": "vocab", "paragraph": "B", "sentence": "The subject matter favoured by the new social history, with its move away from the aristocracy and the establishment, corresponds to other cultural manifestations of the 1960s, such as New Wave British cinema, with its working-class protagonists, or ‘Pop art’, with its use of everyday artefacts.", "target": "aristocracy", "options": ["the hereditary upper social class", "the entire working population", "a group of unrelated researchers"], "answer": 0, "explanations": ["此處 aristocracy 表示「貴族階層」。須依原句語境理解。", "這個選項表示「全部勞動人口」；原句要表達的是「貴族階層」。", "這個選項表示「無關研究員群體」；原句要表達的是「貴族階層」。"], "tag": "字彙與語
