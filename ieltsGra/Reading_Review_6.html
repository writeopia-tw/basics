more.", "target": "anticipation", "options": ["expectation of what will come next", "knowledge only of the distant past", "a deliberate refusal to listen"], "answer": 0, "explanations": ["此處 anticipation 表示「預期、期待」。須依原句語境理解。", "這個選項表示「僅知遙遠過去」；原句要表達的是「預期、期待」。", "這個選項表示「刻意拒絕聽」；原句要表達的是「預期、期待」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-49", "mode": "vocab", "paragraph": "G", "sentence": "‘Repetition leads to familiarity which leads to anticipation, which is satisfied by hearing the song,’ says John Seabrook, author of The Song Machine: Inside the Hit Factory, about how producers pump pop songs full of aural ‘hooks’, the punchy melodic phrases designed to target the brain and leave it wanting more.", "target": "aural ‘hooks’", "options": ["memorable sound patterns designed to catch attention", "physical hooks worn on the ear", "visual patterns only"], "answer": 0, "explanations": ["此處 aural ‘hooks’ 表示「抓耳、易記的聽覺鉤子」。須依原句語境理解。", "這個選項表示「戴在耳上的實體鉤子」；原句要表達的是「抓耳、易記的聽覺鉤子」。", "這個選項表示「僅視覺圖案」；原句要表達的是「抓耳、易記的聽覺鉤子」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-50", "mode": "vocab", "paragraph": "G", "sentence": "‘Repetition leads to familiarity which leads to anticipation, which is satisfied by hearing the song,’ says John Seabrook, author of The Song Machine: Inside the Hit Factory, about how producers pump pop songs full of aural ‘hooks’, the punchy melodic phrases designed to target the brain and leave it wanting more.", "target": "punchy melodic phrases", "options": ["short striking sequences of musical notes", "lyrics describing physical fighting", "weak barely audible random sounds"], "answer": 0, "explanations": ["此處 punchy melodic phrases 表示「鮮明有力的旋律片語」。須依原句語境理解。", "這個選項表示「描寫打鬥的歌詞」；原句要表達的是「鮮明有力的旋律片語」。", "這個選項表示「微弱難聞的隨機聲」；原句要表達的是「鮮明有力的旋律片語」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-51", "mode": "vocab", "paragraph": "G", "sentence": "The researchers are comparing the melodic structure of 100 often mentioned songs with 100 similarly popular songs that weren't cited as earworms, to assess the difference.", "target": "assess", "options": ["evaluate or judge", "assume without testing", "prevent publication of"], "answer": 0, "explanations": ["此處 assess 表示「評估」。須依原句語境理解。", "這個選項表示「未測試便假定」；原句要表達的是「評估」。", "這個選項表示「阻止發表」；原句要表達的是「評估」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-52", "mode": "vocab", "paragraph": "G", "sentence": "The researchers are comparing the melodic structure of 100 often mentioned songs with 100 similarly popular songs that weren't cited as earworms, to assess the difference.", "target": "cited as", "options": ["mentioned or identified as examples of", "seen briefly in the distance", "proved to be impossible"], "answer": 0, "explanations": ["此處 cited as 表示「被提及、列為」。須依原句語境理解。", "這個選項表示「遠處瞥見」；原句要表達的是「被提及、列為」。", "這個選項表示「證明不可能」；原句要表達的是「被提及、列為」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-53", "mode": "vocab", "paragraph": "G", "sentence": "Songs with earworm potential appear to share certain features: a repeating pattern of ups and downs in pitch, and irregular musical intervals.", "target": "pitch", "options": ["how high or low a sound is", "the loudness of a sound", "a field used for football only"], "answer": 0, "explanations": ["此處 pitch 表示「音高」。須依原句語境理解。", "這個選項表示「音量」；原句要表達的是「音高」。", "這個選項表示「僅足球場」；原句要表達的是「音高」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-54", "mode": "vocab", "paragraph": "G", "sentence": "Songs with earworm potential appear to share certain features: a repeating pattern of ups and downs in pitch, and irregular musical intervals.", "target": "musical intervals", "options": ["differences in pitch between notes", "silent breaks between concerts only", "the length of a music recording"], "answer": 0, "explanations": ["此處 musical intervals 表示「音程」。須依原句語境理解。", "這個選項表示「僅音樂會間休息」；原句要表達的是「音程」。", "這個選項表示「錄音總長」；原句要表達的是「音程」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-55", "mode": "vocab", "paragraph": "H", "sentence": "The researchers plan next to test their results in reverse, and play ringtones from songs of both the earworm and non-earworm variety for volunteers several times a day to see which ones get stuck.", "target": "in reverse", "options": ["with the direction of the procedure turned around", "without changing anything", "by playing every recording backwards only"], "answer": 0, "explanations": ["此處 in reverse 表示「反向進行」。須依原句語境理解。", "這個選項表示「完全不變」；原句要表達的是「反向進行」。", "這個選項表示「只把錄音倒轉播放」；原句要表達的是「反向進行」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-56", "mode": "vocab", "paragraph": "H", "sentence": "Drs Stewart and Halpern are now working together to recruit survey participants for a study looking at whether people at different stages of life experience earworms differently.", "target": "recruit", "options": ["enlist people to participate", "force every person to join", "exclude without explanation"], "answer": 0, "explanations": ["此處 recruit 表示「招募」。須依原句語境理解。", "這個選項表示「強迫所有人加入」；原句要表達的是「招募」。", "這個選項表示「無說明地排除」；原句要表達的是「招募」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-57", "mode": "vocab", "paragraph": "H", "sentence": "Drs Stewart and Halpern are now working together to recruit survey participants for a study looking at whether people at different stages of life experience earworms differently.", "target": "stages of life", "options": ["different periods in a person's lifespan", "platforms used for live performances", "steps for manufacturing instruments"], "answer": 0, "explanations": ["此處 stages of life 表示「人生階段」。須依原句語境理解。", "這個選項表示「現場演出舞台」；原句要表達的是「人生階段」。", "這個選項表示「製造樂器步驟」；原句要表達的是「人生階段」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-58", "mode": "vocab", "paragraph": "H", "sentence": "‘But the few responses we have so far indicate that they have earworms less often. It could be that they don't play music as often as younger people do.’", "target": "indicate", "options": ["suggest or point towards", "guarantee conclusively", "deny without reason"], "answer": 0, "explanations": ["此處 indicate 表示「顯示、指出」。須依原句語境理解。", "這個選項表示「最終確保」；原句要表達的是「顯示、指出」。", "這個選項表示「無理由否認」；原句要表達的是「顯示、指出」。"], "tag": "字彙與語境義"}, {"id": "mind-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Scientists call them ‘involuntary musical images’, or ‘earworms’, and a wave of new research is shining light on why they occur and what can be learned from them.", "target": "", "options": ["Research is beginning to clarify why involuntary music occurs and what it may reveal.", "Scientists have already explained every aspect of earworms conclusively.", "The research concerns only how to compose songs deliberately."], "answer": 0, "explanations": ["is shining light 表增加理解，不是所有謎題都已解。", "beginning clarification 不等於全確證。", "involuntary...why they occur 不只作曲技巧。"], "tag": "長難句理解", "structure": "Scientists call...先定義；and a wave of research...為並列主句；why...與 what...為介詞 on 的平行受詞內容；them 指耳蟲現象。"}, {"id": "mind-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "‘The idea that we have full control over our thought processes is an illusion,’ says psychologist Lauren Stewart, who founded the master's program in music, mind and brain at Goldsmiths, University of London, UK, where recent research has taken place.", "target": "", "options": ["Stewart questions the belief that people fully control their own thinking.", "Stewart claims people cannot exert any control over any thought.", "Stewart confirms that complete conscious control is an established fact."], "answer": 0, "explanations": ["full control 是被否定的程度，不代表任何控制皆無。", "否定完全控制不能推成零控制。", "is an illusion 與確認完全控制相反。"], "tag": "長難句理解", "structure": "The idea...is an illusion 為主幹；that we have...為同位內容子句；says...標記來源；who founded...修飾 Stewart，where...修飾研究機構。"}, {"id": "mind-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "Researchers haven't been able to watch what happens in the brain when earworms occur, because they happen unpredictably.", "target": "", "options": ["Unpredictable timing has prevented researchers from directly observing brain activity during earworms.", "Researchers have watched every earworm as it happened because the timing is fixed.", "The sentence proves no information about earworms can be gathered by any method."], "answer": 0, "explanations": ["because 提出直接觀察受阻原因，不否定問卷等其他證據。", "unpredictably 與固定可觀察相反。", "下一句有多種資料來源，不能推成全不可知。"], "tag": "長難句理解", "structure": "haven't been able to watch...為否定能力主幹；what happens...為 watch 的受詞；when earworms occur 為時間；because they happen...表原因。"}, {"id": "mind-paraphrase-4", "mode": "paraphrase", "paragraph": "B", "sentence": "A Goldsmiths study published in the journal Memory and Cognition this year showed that the singing we hear in our heads tends to be true to actual recordings.", "target": "", "options": ["The study suggests internally heard music tends to preserve features of actual recordings.", "Every imagined song is always identical to a recording in every possible detail.", "The study says remembered music necessarily bears no resemblance to recordings."], "answer": 0, "explanations": ["tends to 為傾向，不等於每次所有細節相同。", "tends to 不能改成 always identical。", "true to 表接近原貌，非毫無相似。"], "tag": "長難句理解", "structure": "A study published...為主詞，published 為分詞；showed that...引結果；the singing we hear...為嵌入主詞，we hear 為省略 that 的關係子句。"}, {"id": "mind-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "Researchers had 17 volunteers tap to the beat of any earworm they heard during a four-day period while a device attached to their wrist recorded their movements.", "target": "", "options": ["Volunteers indicated rhythm by tapping while a wrist-mounted device recorded the movement.", "The device played songs directly into each volunteer's wrist.", "Researchers asked volunteers only to write lyrics and did not record movement."], "answer": 0, "explanations": ["had volunteers tap 是要求受試者敲拍，裝置功能是記錄動作。", "attached to wrist 不代表從手腕播放音樂。", "tap to beat、recorded movements 不等於只抄歌詞。"], "tag": "長難句理解", "structure": "Researchers had+受詞+原形 tap 為使役；any earworm they heard...含關係子句；while...recorded...為同步時間子句；attached...修飾 device。"}, {"id": "mind-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "Another Goldsmiths study, published this year in Consciousness and Cognition, found that people who report hearing earworms often, and find them most intrusive, have slightly different brain structures, with more gray matter in areas associated with processing emotions.", "target": "", "options": ["Frequent intrusive earworms were associated with small structural differences in emotion-related brain areas.", "The study proved earworms caused every observed structural difference.", "All people with any earworm were said to have completely different brains."], "answer": 0, "explanations": ["found...people...have...為關聯發現；slightly、often、most intrusive 都限縮。", "觀察到兩者同現不等於已證因果。", "把特定頻繁困擾者擴為所有人，把微小變成完全不同。"], "tag": "長難句理解", "structure": "people who report...and find...為長主詞；have slightly different structures 為嵌入主幹；with more gray matter 補充；associated with...修飾 areas。"}, {"id": "mind-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "Studies also show that the music in our heads often starts playing during times of ‘low cognitive load’, such as while showering, getting dressed, walking, or doing chores.", "target": "", "options": ["Earworms often arise during activities placing relatively few demands on thinking.", "Earworms are said to occur only during the hardest intellectual tasks.", "The sentence states that no activity of any kind occurs during an earworm."], "answer": 0, "explanations": ["often 為常見情況；showering、chores 是心智負荷低但仍有活動。", "低負荷被反轉為僅最高負荷。", "低認知負荷不等於身體完全不活動。"], "tag": "長難句理解", "structure": "Studies show that...為框架；music...starts playing...為內容；during times...限定情境；such as while...列四個平行活動例。"}, {"id": "mind-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "Dr Stewart likens earworms to ‘sonic screen savers’ that keep the mind entertained while it is otherwise unoccupied.", "target": "", "options": ["Stewart compares earworms to background entertainment for a mind not otherwise occupied.", "The comparison means a literal computer program is installed inside the brain.", "The comparison claims earworms always prevent every other mental activity."], "answer": 0, "explanations": ["likens...to...是功能比喻，不是實體裝置。", "比喻不能當作電腦程式真的存在。", "while otherwise unoccupied 不是永遠排除全部活動。"], "tag": "長難句理解", "structure": "Dr Stewart likens X to Y 為主幹；that keep...修飾 sonic screen savers；while it is...表情境，it 指 mind。"}, {"id": "mind-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "The volunteers who sat idly for the next five minutes were the most likely to report hearing the music in their heads.", "target": "", "options": ["Among the tested groups, those left idle for five minutes were most likely to report internal music.", "Every idle volunteer certainly heard music, and no busy volunteer ever did.", "The most likely group was the one performing the most challenging tasks."], "answer": 0, "explanations": ["most likely 是群組機率比較，不等於全有與全無。", "把相對可能性轉為絕對分配。", "本句指出 idle 為最高，不是最高負荷組。"], "tag": "長難句理解", "structure": "The volunteers who...為主詞；were the most likely to report...為主幹；who sat...限定受試群；the music in their heads 指內在音樂。"}, {"id": "mind-paraphrase-10", "mode": "paraphrase", "paragraph": "C", "sentence": "Dr Stewart observed that the more challenging the activity, the less likely the volunteers were to hear the music.", "target": "", "options": ["As task difficulty increased, the likelihood of hearing the music decreased in the reported observations.", "Task difficulty and earworm likelihood increased together.", "The sentence proves difficult tasks permanently eliminate earworms in everyone."], "answer": 0, "explanations": ["the more...,the less...為反向變化，不是保證永久療效。", "把反向關係改成同向。", "less likely 不等於永遠消除，且限研究觀察。"], "tag": "長難句理解", "structure": "Dr Stewart observed that...標記觀察；the more challenging the activity [was] 為省略比較分句；the less likely...were...為相應結果，屬機率。"}, {"id": "mind-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Songs the brain fixates on are usually those it has been exposed to recently, surveys show, which is why tunes getting heavy radio play frequently top the earworm charts.", "target": "", "options": ["Songs recently encountered are often the ones that later recur mentally, helping explain frequent earworms from heavily broadcast tunes.", "Only songs consciously memorised years earlier can ever become earworms.", "Frequent radio play is said to make a tune impossible to remember."], "answer": 0, "explanations": ["usually、recently、which is why 連接接觸頻率與反覆音樂。", "only、years earlier、consciously 都違反原句。", "heavy play 常居前列，非無法記住。"], "tag": "長難句理解", "structure": "Songs [that] brain fixates on 為長主詞；are those [that] it has been exposed to...為表語；surveys show 為插入；which is why...補解釋。"}, {"id": "mind-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "Even tunes you may have heard but didn't pay attention to can worm their way into your subconscious, says Ira Hyman, a psychologist at Western Washington University in Bellingham, USA.", "target": "", "options": ["Music may enter the subconscious even without focused attention during hearing.", "A tune can be remembered only if the listener consciously tries to learn it.", "The sentence describes literal worms entering the listener's ears."], "answer": 0, "explanations": ["even...didn't pay attention to 排除必須有意學習的條件。", "can...even without attention 反對 only consciously。", "worm their way 是比喻，非實體生物。"], "tag": "長難句理解", "structure": "Even tunes...為主詞；you may have heard...but didn't pay attention to 為省略關係代名詞的子句；can worm...為主幹；says...標記 Hyman 的主張。"}, {"id": "mind-paraphrase-13", "mode": "paraphrase", "paragraph": "D", "sentence": "In an unpublished study there, participants who listened to music while doing other tasks were more likely to report that the songs returned as earworms later on, compared with participants who simply listened.", "target": "", "options": ["Participants who combined listening with other tasks reported later earworms more often than participants who only listened.", "The simply-listening group was reported as more likely to experience later earworms.", "The unpublished study established that no multitasking listener ever heard an earworm."], "answer": 0, "explanations": ["more likely...compared with 指多工組較高。", "將比較組高低對調。", "more likely 不可能改成該組完全沒有。"], "tag": "長難句理解", "structure": "participants who...為長主詞；were more likely to report...為主幹；that songs returned...為 report 內容；compared with...引對照組。"}, {"id": "mind-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "So, when the mind hits a part of a song it can't remember, it loops back rather than moving on.", "target": "", "options": ["Failure to remember the next part may cause the mind to return to an earlier fragment.", "Whenever memory fails, the song is necessarily forgotten permanently.", "The mind always finishes the full song without repeating any part."], "answer": 0, "explanations": ["when...can't remember...loops back 而非 moving on，描述重複機制。", "回頭反覆不等於永久遺忘。", "rather than moving on 排除總能順利完成。"], "tag": "長難句理解", "structure": "when the mind hits a part...為時間／條件；it can't remember 為關係子句修飾 part；it loops back 為主句；rather than...比較兩種走向。"}, {"id": "mind-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "That could make an earworm even more entrenched, Dr Hyman says.", "target": "", "options": ["The proposed looping mechanism could make an earworm harder to dislodge.", "The looping mechanism has been proved to eliminate every earworm.", "The mechanism necessarily makes every earworm last forever."], "answer": 0, "explanations": ["could 為可能效果；more entrenched 為更難擺脫，不是無限持續。", "方向與 more entrenched 相反。", "could 與比較程度不能升為必然永恆。"], "tag": "長難句理解", "structure": "That 指前述記不出後續而回播；could make+受詞+形容詞補語；even more 修飾 entrenched；Dr Hyman says 表來源。"}, {"id": "mind-paraphrase-16", "mode": "paraphrase", "paragraph": "E", "sentence": "According to a theory known as the Zeigarnik effect, named for a Soviet psychologist, Bluma Zeigarnik, unfinished thoughts and activities weigh on the mind more heavily than those that are completed, although experiments exposing students to interrupted songs have yielded mixed results.", "target": "", "options": ["The Zeigarnik account predicts unfinished material will preoccupy the mind, but the cited experiments have not consistently supported it.", "The experiments conclusively supported the theory in every case.", "The account states that completed activities always occupy more attention than unfinished ones."], "answer": 0, "explanations": ["although 保留理論與混合實證的落差。", "mixed results 不是全部一致確證。", "more heavily than 對象為 unfinished 大於 completed，不能換向。"], "tag": "長難句理解", "structure": "According to...限定理論來源；named for...修飾 theory；unfinished thoughts...weigh...為主句；than those...中 those 指 thoughts and activities；although...為讓步。"}, {"id": "mind-paraphrase-17", "mode": "paraphrase", "paragraph": "F", "sentence": "Researchers say they can't pinpoint a spot in the brain where earworms live.", "target": "", "options": ["Researchers cannot currently assign earworms to one precisely identified brain location.", "The researchers have identified a single exclusive earworm centre beyond doubt.", "The sentence says earworms cannot involve any brain activity."], "answer": 0, "explanations": ["can't pinpoint 否定精確單點定位，不否定腦活動存在。", "把 can't 改成已確證。", "定位未知不等於完全無活動。"], "tag": "長難句理解", "structure": "Researchers say...為報告框架；they can't pinpoint a spot...為內容；where earworms live 修飾 spot，live 為非字面居住的表達。"}, {"id": "mind-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "Imaging studies by Andrea Halpern at Bucknell University, in Lewisburg, USA, have shown that deliberately imagining music and actually listening to music activate many of the same neurological networks.", "target": "", "options": ["Imagining music deliberately and hearing it involve many overlapping neural systems.", "Imagining and listening activate entirely separate systems with no overlap.", "The study proves every aspect of imagination and actual listening is identical."], "answer": 0, "explanations": ["many of the same 表大量重疊，非毫無重疊，也非全部相同。", "the same 排除完全分離。", "many 不等於 all，腦活動重疊不使所有體驗相同。"], "tag": "長難句理解", "structure": "Imaging studies...have shown that...為主幹；deliberately imagining...and actually listening...為兩個平行動名詞主詞；activate...為嵌入謂語。"}, {"id": "mind-paraphrase-19", "mode": "paraphrase", "paragraph": "F", "sentence": "Dr Halpern's earlier studies showed that when subjects listened to the first few notes of familiar music, areas in the right frontal and superior temporal portions of the brain became activated, along with the supplementary motor area at the top, which is typically involved in remembering sequences.", "target": "", "options": ["Familiar opening notes activated several brain areas, including a region associated with remembering sequences.", "The study says only one area became active and no other region was involved.", "The supplementary motor area was defined as a region used only for hearing loud noise."], "answer": 0, "explanations": ["along with 表多區共同；typically remembering sequences 非僅大聲音。", "areas...along with...明列多區。", "which...typically...記序列功能被換成唯一聽噪音。"], "tag": "長難句理解", "structure": "when subjects listened...為時間；areas...became activated 為被動主幹；along with...添一區；which...involved...修飾 supplementary motor area。"}, {"id": "mind-paraphrase-20", "mode": "paraphrase", "paragraph": "F", "sentence": "When the same subjects listened to unfamiliar music and were asked to recall it, there was activity in the left frontal portions of the brain instead.", "target": "", "options": ["Unfamiliar music followed by a recall request was associated with activity in left frontal regions instead.", "The reported condition produced exactly the same right-sided activity as the familiar-music condition.", "The subjects were asked to forget the unfamiliar music immediately."], "answer": 0, "explanations": ["instead 表與前句的不同區域；recall 是回想而非忘記。", "忽略 left...instead 的對照。", "asked to recall 不能改 ask to forget。"], "tag": "長難句理解", "structure": "When...listened...and were asked...為同主詞的主動／被動並列時間子句；there was activity...為存在句；instead 回指前述熟悉音樂條件的活動區域。"}, {"id": "mind-paraphrase-21", "mode": "paraphrase", "paragraph": "G", "sentence": "‘Repetition leads to familiarity which leads to anticipation, which is satisfied by hearing the song,’ says John Seabrook, author of The Song Machine: Inside the Hit Factory, about how producers pump pop songs full of aural ‘hooks’, the punchy melodic phrases designed to target the brain and leave it wanting more.", "target": "", "options": ["Repeated exposure can build familiarity and expectation, making hearing the song satisfying.", "The quoted explanation says repetition necessarily destroys all interest immediately.", "The sequence runs from satisfaction to unfamiliarity and then to repetition."], "answer": 0, "explanations": ["leads to 串起重複、熟悉、期待，最後被聽歌滿足。", "原句說形成期待，不是必然立刻失趣。", "把因果鏈條順序倒置。"], "tag": "長難句理解", "structure": "Repetition leads...為第一主幹；which leads...修飾 familiarity；第二 which is satisfied...修飾 anticipation；by hearing...說明滿足方式。"}, {"id": "mind-paraphrase-22", "mode": "paraphrase", "paragraph": "G", "sentence": "The researchers are comparing the melodic structure of 100 often mentioned songs with 100 similarly popular songs that weren't cited as earworms, to assess the difference.", "target": "", "options": ["Researchers compare often-mentioned earworms with equally popular songs not named as earworms.", "The comparison uses only unpopular songs as the control set.", "The study assumes that every popular song has equal earworm potential."], "answer": 0, "explanations": ["similarly popular 控制流行程度，earworm reportedness 不同。", "similarly popular 不是 only unpopular。", "兩組是否被列耳蟲不同，不是事先當成潛力全同。"], "tag": "長難句理解", "structure": "are comparing X with Y 為主幹；often mentioned 修飾第一組 songs；that weren't cited...修飾第二組；to assess...為研究目的。"}, {"id": "mind-paraphrase-23", "mode": "paraphrase", "paragraph": "G", "sentence": "Songs with earworm potential appear to share certain features: a repeating pattern of ups and downs in pitch, and irregular musical intervals.", "target": "", "options": ["Potential earworm songs seem to have common melodic patterns, though the wording remains tentative.", "The sentence proves every song with those patterns must become an earworm.", "Earworm songs are said to share no musical features at all."], "answer": 0, "explanations": ["appear to、potential 保留推論，不是充分必要定律。", "相似特徵不能推出每首必成耳蟲。", "share certain features 排除毫無共通。"], "tag": "長難句理解", "structure": "Songs with...為主詞；appear to share...為限定主幹；冒號後列兩項特徵；in pitch 修飾 ups and downs，irregular 修飾 intervals。"}, {"id": "mind-paraphrase-24", "mode": "paraphrase", "paragraph": "H", "sentence": "The researchers plan next to test their results in reverse, and play ringtones from songs of both the earworm and non-earworm variety for volunteers several times a day to see which ones get stuck.", "target": "", "options": ["The proposed test will play tunes from both groups to see which actually recur in volunteers' minds.", "The test has already proved the predictions correct before any tunes were played.", "In reverse means the only task is to play every recording backwards."], "answer": 0, "explanations": ["plan next 表未來；in reverse 指由歌曲類別測是否變耳蟲，非必然倒帶。", "計畫不能改成已完成確證。", "後文描述播放兩類鈴聲，沒說錄音逆向聲流。"], "tag": "長難句理解", "structure": "plan...to test...and play...為並列不定詞；from songs of both...限定來源兩類；for volunteers...為接收對象；to see which...為目的。"}, {"id": "mind-paraphrase-25", "mode": "paraphrase", "paragraph": "H", "sentence": "‘But the few responses we have so far indicate that they have earworms less often. It could be that they don't play music as often as younger people do.’", "target": "", "options": ["Initial responses suggest older people may have fewer earworms, contrary to the prediction based on knowing more songs.", "A large completed survey proved every older person has more earworms.", "The few responses establish with certainty that music exposure is the sole cause of age differences."], "answer": 0, "explanations": ["few、so far、indicate、could 都保留樣本及解釋限制。", "把少量目前回覆改成大型完結研究，方向亦反。", "It could be 是假說，不是唯一成因確證。"], "tag": "長難句理解", "structure": "But...responses...indicate that...為主幹；we have so far 修飾 responses；they 指 older people；後句 It could be that...提出播放音樂頻率的可能解釋。"}, {"id": "mind-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "A description of characteristics common to songs with earworms.", "target": "characteristics", "options": ["特徵、特性", "研究員的身分", "歌曲的播放裝置"], "answer": 0, "explanations": ["characteristics 指可辨識、比較的特徵。此處練習題目用語，不表示整句符合原文。", "不是研究者身分", "不是器材"], "tag": "題目字彙", "source": "Question 14 · 題目用語"}, {"id": "mind-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "A justification for research into earworms.", "target": "justification", "options": ["合理依據、研究理由", "最終研究結果", "完全無根據的猜測"], "answer": 0, "explanations": ["justification 解釋為何值得或有必要研究。此處練習題目用語，不表示整句符合原文。", "不是研究完成後成果", "不是無根據"], "tag": "題目字彙", "source": "Question 15 · 題目用語"}, {"id": "mind-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "Details of proposed research into the frequency of earworms in different age groups.", "target": "proposed research", "options": ["擬進行、提出的研究", "已完成且全部確證的研究", "已被禁止的研究"], "answer": 0, "explanations": ["proposed 指計畫階段，不能當成已得結果。此處練習題目用語，不表示整句符合原文。", "提案不等於完成", "提出不代表遭禁"], "tag": "題目字彙", "source": "Question 17 · 題目用語"}, {"id": "mind-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Details of proposed research into the frequency of earworms in different age groups.", "target": "frequency", "options": ["發生頻率", "音量", "主觀喜好強度"], "answer": 0, "explanations": ["此處 frequency 指多常出現。此處練習題目用語，不表示整句符合原文。", "不是聲量", "不是偏好強度"], "tag": "題目字彙", "source": "Question 17 · 題目用語"}, {"id": "mind-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "Further research has demonstrated that some brains may deal with emotions differently.", "target": "emotions", "options": ["情緒", "歌詞", "器材"], "answer": 0, "explanations": ["emotions 為喜怒哀樂等心理狀態。此處練習題目用語，不表示整句符合原文。", "lyrics 才是歌詞", "不是設備"], "tag": "題目字彙", "source": "Question 18–21 · 題目用語"}, {"id": "mind-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "A reduction in earworms was related to how challenging the task was.", "target": "challenging", "options": ["需要投入心智、難度高的", "帶有挑釁語氣才適用", "完全無需專注的"], "answer": 0, "explanations": ["task challenging 指任務有難度。此處練習題目用語，不表示整句符合原文。", "此處不是人際挑釁", "與毫不費力相反"], "tag": "題目字彙", "source": "Question 18–21 · 題目用語"}, {"id": "mind-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Some musicians create music that is intentionally memorable.", "target": "intentionally", "options": ["有意、刻意地", "無意間", "僅因意外"], "answer": 0, "explanations": ["intentionally 表有目的安排。此處練習題目用語，不表示整句符合原文。", "與 accidentally 相反", "不是純偶然"], "tag": "題目字彙", "source": "Question 22 · 題目用語"}, {"id": "mind-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Some musicians create music that is intentionally memorable.", "target": "memorable", "options": ["容易記住、令人難忘的", "不可能被記住的", "只在回憶中存在才適用"], "answer": 0, "explanations": ["memorable 指會留下鮮明記憶。此處練習題目用語，不表示整句符合原文。", "不可能記住相反", "不限定已不再存在"], "tag": "題目字彙", "source": "Question 22 · 題目用語"}, {"id": "mind-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "People are unable to completely regulate how they think.", "target": "regulate", "options": ["調節、控制", "毫無例外地取消", "公開讚美"], "answer": 0, "explanations": ["regulate thought processes 指調控思考。此處練習題目用語，不表示整句符合原文。", "調控不等於全部取消", "不是稱讚"], "tag": "題目字彙", "source": "Question 23 · 題目用語"}, {"id": "mind-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "Earworms are more persistent when only a short section of the song is constantly replayed.", "target": "persistent", "options": ["持續、難擺脫的", "立即消失的", "必然令人愉快的"], "answer": 0, "explanations": ["persistent 描述持續性；原題缺少的 is 已補上。此處練習題目用語，不表示整句符合原文。", "不是短暫即逝", "持續不限定情緒正負"], "tag": "題目字彙", "source": "Question 26 · 題目用語"}, {"id": "mind-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "The questions refer to earworms, or involuntary musical images.", "target": "involuntary", "options": ["不由自主、非有意控制的", "刻意設計的", "法律強制的"], "answer": 0, "explanations": ["involuntary musical images 指自發出現的內在音樂意象。此處練習題目用語，不表示整句符合原文。", "非 deliberately created", "不是依法強制"], "tag": "題目字彙", "source": "Question 14–26 · 題目用語"}]}, {"id": "origin-applause", "title": "The Origin and Development of Applause", "sourceTitle": "The Origin and Development of Applause", "subtitle": "", "part": 2, "topic": "掌聲、群眾互動與社交媒體", "sourceNote": "依本文歷史敘述及作者類比理解；引號中的 spontaneous 帶有反諷。數位互動被類比為掌聲，不是字面拍手。", "paragraphs": [{"label": "A", "text": "Scholars aren't quite sure about the origins of applause, but the form that is still most common, clapping the hands together, was formalized in Western culture during and after performances. During the time of the Roman Republic (509 BC — 27 BC) the common way to end a play was for the chief actor to yell ‘Valete et plaudite!’ (‘Goodbye and applaud!’) thus signaling to the audience that it was time for them to give praise by striking hands and making explosive noise. It's no surprise, then, that this became a means of crowd manipulation. Rome saw the rise of a professional class of applauders, or ‘people who clapped for their dinner’, hired to infiltrate crowds and manipulate their reaction to performances. Actors would hire a dozen or so people to spread out among their audiences and prolong the applause, or, if they were feeling especially bold, to start ‘spontaneous’ chants and shouts of praise."}, {"label": "B", "text": "The Roman Republic came to an end and was replaced by the Roman Empire (27 BC — 476 AD) where applause became a way for leaders to interact directly with their citizens. One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena. Leaders became astute at reading the volume, the rhythm, and the length of the crowd's claps for clues about how well they were doing as officials and lawmakers. ‘We should think of it as an ancient type of opinion poll,’ says Greg Aldrete, a professor of history. ‘This is how you gauge the people.’ Roman leaders were gathering data about people by listening to applause."}, {"label": "C", "text": "Clever leaders of the ancient world researched their rivals, too. Cicero, the Roman lawyer, would send friends to stand around outside the arena, taking notes to see what kind of greeting each official got when he entered, the better to see who was beloved by the people, and who was not. They had a lot of information to assess. ‘Ancient crowds were more interactive than they are today,’ Aldrete points out. ‘There was a lot of back and forth between speakers and crowds. And particularly in the Greco-Roman world, crowds, especially in cities, were really good at communicating messages through rhythmic clapping, sometimes coupled with shouts.’ The coding was, he says, invaluable when assessing an orator’s fortunes."}, {"label": "D", "text": "Around the first century AD, those systems of applause became more and more elaborate. Applause no longer meant, simply, ‘claps’. While Greco-Roman audiences certainly smacked their palms together the same way we do today, their overall strategies of applause were much more varied than clapping alone. Crowds expressed degrees of approval of the person or persons before them, ranging from claps, to snaps (of the finger and thumb), to waves (of the edge of the toga). The emperor Aurelian decided to replace this gesture by waving a special handkerchief instead, a prop which he then distributed to all Roman citizens, so they would never be without a way to praise him."}, {"label": "E", "text": "Although the style of applause may have changed over the centuries, the need to manipulate remained. 16th-century French poet Jean Daurat is credited with bringing back the Roman practice of hiring professional applauders. In France, this group became known as a ‘claque’. Daurat handed out tickets to his own performances to people who promised to applaud at the end. By the early 1820s, claques had become institutionalized, with an agency in Paris specializing in the distribution of the claqueurs’ services. The historian William B. Cohen describes the intricate price lists agencies of this kind would hand out to potential patrons: polite clapping would cost this many francs, enthusiastic applause would cost this many. The claque also underwent a kind of classification: the rieurs (laughers) would laugh loudly at the jokes; the pleureurs (criers) would feign tears in reaction to performances; the commissaires (officers) would learn a play or a piece of music by heart and then call attention to its best parts. This practice spread to Milan, to Vienna, and to London before falling out of fashion. The claque lost its power once people became aware of its tricks."}, {"label": "F", "text": "And clapping itself evolved. In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies. Knowing when to maintain silence, as well as when to clap, became a mark of sophistication, a kind of code for audiences to learn. Applause became a matter of ‘do’ or ‘don’t’, so losing many old shades of meaning. Those changes changed performers, too. Applause became much less of a true dialogue with an audience, especially so with opera, where the singers saw it as part of a basic transaction with the crowd. So by the time the 19th century arrived, applause had become standardized and institutionalized, and had become an expectation rather than the reward it used to be."}, {"label": "G", "text": "In the 21st century we’re reinventing applause, to make it what it used to be: a coded form of communication. More and more the digital world allows us to link and like and share through our devices. By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising. Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead."}], "questions": [{"id": "applause-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Scholars aren't quite sure about the origins of applause, but the form that is still most common, clapping the hands together, was formalized in Western culture during and after performances.", "target": "Scholars", "options": ["people engaged in serious academic study", "students only below university level", "actors employed to clap"], "answer": 0, "explanations": ["此處 Scholars 表示「學者」。須依原句語境理解。", "這個選項表示「僅大學以下學生」；原句要表達的是「學者」。", "這個選項表示「受僱拍手的演員」；原句要表達的是「學者」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Scholars aren't quite sure about the origins of applause, but the form that is still most common, clapping the hands together, was formalized in Western culture during and after performances.", "target": "formalized", "options": ["made into an established recognised practice", "legally required in every country", "invented without earlier examples"], "answer": 0, "explanations": ["此處 formalized 表示「正式化、形成慣例」。須依原句語境理解。", "這個選項表示「每國法律皆強制」；原句要表達的是「正式化、形成慣例」。", "這個選項表示「毫無前例發明」；原句要表達的是「正式化、形成慣例」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "During the time of the Roman Republic (509 BC — 27 BC) the common way to end a play was for the chief actor to yell ‘Valete et plaudite!’ (‘Goodbye and applaud!’) thus signaling to the audience that it was time for them to give praise by striking hands and making explosive noise.", "target": "signaling", "options": ["communicating a cue or message", "asking privately for money", "causing an accidental noise only"], "answer": 0, "explanations": ["此處 signaling 表示「示意、發出訊號」。須依原句語境理解。", "這個選項表示「私下要錢」；原句要表達的是「示意、發出訊號」。", "這個選項表示「僅製造意外噪音」；原句要表達的是「示意、發出訊號」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "It's no surprise, then, that this became a means of crowd manipulation.", "target": "a means of crowd manipulation", "options": ["a method of influencing a group's reactions", "an unbiased measurement without influence", "a way of moving theatre seats"], "answer": 0, "explanations": ["此處 a means of crowd manipulation 表示「操控群眾反應的手段」。須依原句語境理解。", "這個選項表示「不影響群眾的無偏測量」；原句要表達的是「操控群眾反應的手段」。", "這個選項表示「搬動劇院座位的方法」；原句要表達的是「操控群眾反應的手段」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "Rome saw the rise of a professional class of applauders, or ‘people who clapped for their dinner’, hired to infiltrate crowds and manipulate their reaction to performances.", "target": "clapped for their dinner", "options": ["earned rewards by providing applause", "clapped only because the food tasted good", "prepared meals without receiving pay"], "answer": 0, "explanations": ["此處 clapped for their dinner 表示「以鼓掌換取報酬」。須依原句語境理解。", "這個選項表示「只因食物好吃而鼓掌」；原句要表達的是「以鼓掌換取報酬」。", "這個選項表示「無薪做飯」；原句要表達的是「以鼓掌換取報酬」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "Rome saw the rise of a professional class of applauders, or ‘people who clapped for their dinner’, hired to infiltrate crowds and manipulate their reaction to performances.", "target": "infiltrate", "options": ["enter a group secretly or without appearing separate", "stay visibly apart from", "formally announce exclusion from"], "answer": 0, "explanations": ["此處 infiltrate 表示「混入、滲透」。須依原句語境理解。", "這個選項表示「明顯遠離」；原句要表達的是「混入、滲透」。", "這個選項表示「正式宣布被排除」；原句要表達的是「混入、滲透」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-7", "mode": "vocab", "paragraph": "A ": ["exchange responses without an intermediary with", "remain completely isolated from", "communicate only through written laws with"], "answer": 0, "explanations": ["此處 interact directly with 表示「與……直接互動」。須依原句語境理解。", "這個選項表示「與……完全隔離」；原句要表達的是「與……直接互動」。", "這個選項表示「僅以成文法溝通」；原句要表達的是「與……直接互動」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena.", "target": "standing with the people", "options": ["status or level of public approval", "physical posture in a crowd", "the exact location of a ruler's seat"], "answer": 0, "explanations": ["此處 standing with the people 表示「在民眾間的聲望、支持度」。須依原句語境理解。", "這個選項表示「在人群中的站姿」；原句要表達的是「在民眾間的聲望、支持度」。", "這個選項表示「統治者座位精確位置」；原句要表達的是「在民眾間的聲望、支持度」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena.", "target": "gauging", "options": ["estimating or measuring", "deliberately altering every response", "ignoring completely"], "answer": 0, "explanations": ["此處 gauging 表示「衡量、判斷」。須依原句語境理解。", "這個選項表示「刻意改動全部回應」；原句要表達的是「衡量、判斷」。", "這個選項表示「完全忽略」；原句要表達的是「衡量、判斷」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena.", "target": "arena", "options": ["a public space for performance or spectacle", "a private room for sleeping", "an office storing documents only"], "answer": 0, "explanations": ["此處 arena 表示「競技場、表演場域」。須依原句語境理解。", "這個選項表示「私人臥房」；原句要表達的是「競技場、表演場域」。", "這個選項表示「僅存文件的辦公室」；原句要表達的是「競技場、表演場域」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-14", "mode": "vocab", "paragraph": "B", "sentence": "Leaders became astute at ence": "Cicero, the Roman lawyer, would send friends to stand around outside the arena, taking notes to see what kind of greeting each official got when he entered, the better to see who was beloved by the people, and who was not.", "target": "the better to", "options": ["so as to do something more effectively", "because it had already been finished", "despite being unable to"], "answer": 0, "explanations": ["此處 the better to 表示「以便更有效地」。須依原句語境理解。", "這個選項表示「因為早已完成」；原句要表達的是「以便更有效地」。", "這個選項表示「儘管無法」；原句要表達的是「以便更有效地」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-19", "mode": "vocab", "paragraph": "C", "sentence": "Cicero, the Roman lawyer, would send friends to stand around outside the arena, taking notes to see what kind of greeting each official got when he entered, the better to see who was beloved by the people, and who was not.", "target": "beloved", "options": ["greatly loved or admired", "merely recognised by appearance", "formally employed"], "answer": 0, "explanations": ["此處 beloved 表示「深受愛戴的」。須依原句語境理解。", "這個選項表示「僅外貌被認得的」；原句要表達的是「深受愛戴的」。", "這個選項表示「正式受僱的」；原句要表達的是「深受愛戴的」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-20", "mode": "vocab", "paragraph": "C", "sentence": "‘There was a lot of back and forth between speakers and crowds. And particularly in the Greco-Roman world, crowds, especially in cities, were really good at communicating messages through rhythmic clapping, sometimes coupled with shouts.’", "target": "back and forth", "options": ["reciprocal exchanges", "one final statement with no response", "repeated physical travel only"], "answer": 0, "explanations": ["此處 back and forth 表示「來回互動」。須依原句語境理解。", "這個選項表示「一句無回應的最終陳述」；原句要表達的是「來回互動」。", "這個選項表示「僅反覆實際旅行」；原句要表達的是「來回互動」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-21", "mode": "vocab", "paragraph": "C", "sentence": "And particularly in the Greco-Roman world, crowds, especially in cities, were really good at communicating messages through rhythmic clapping, sometimes coupled with shouts.’", "target": "rhythmic cl of fashion.", "target": "falling out of fashion", "options": ["ceasing to be popular or customary", "growing continuously more widespread", "becoming legally compulsory"], "answer": 0, "explanations": ["此處 falling out of fashion 表示「不再流行」。須依原句語境理解。", "這個選項表示「持續愈來愈普遍」；原句要表達的是「不再流行」。", "這個選項表示「變成法律強制」；原句要表達的是「不再流行」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-44", "mode": "vocab", "paragraph": "F", "sentence": "In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies.", "target": "aligning themselves with", "options": ["bringing their character closer to", "physically forming a straight queue beside", "completely rejecting"], "answer": 0, "explanations": ["此處 aligning themselves with 表示「使自身與……相契合」。須依原句語境理解。", "這個選項表示「在旁實際排直線」；原句要表達的是「使自身與……相契合」。", "這個選項表示「完全拒絕」；原句要表達的是「使自身與……相契合」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-45", "mode": "vocab", "paragraph": "F", "sentence": "In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies.", "target": "reverence", "options": ["deep respect", "intense boredom", "careful financial measurement"], "answer": 0, "explanations": ["此處 reverence 表示「崇敬」。須依原句語境理解。", "這個選項表示「極度厭煩」；原句要表達的是「崇敬」。", "這個選項表示「仔細財務測量」；原句要表達的是「崇敬」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-46", "mode": "vocab", "paragraph": "F", "sentence": "In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies.", "target": "spirituality", "options": ["concern with sacred or non-material aspects of life", "a type of alcoholic drink", "a strictly financial transaction"], "answer": 0, "explanations": ["此處 spirituality 表示「精神性、靈性」。須依原句語境理解。", "這個選項表示「一種酒精飲料」；原句要表達的是「精神性、靈性」。", "這個選項表示「嚴格財務交易」；原句要表達的是「精神性、靈性」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-47", "mode": "vocab", "paragraph": "F", "sentence": "Knowing when to maintain silence, as well as when to clap, became a mark of sophistication, a kind of code for audiences to learn.", "target": "sophistication", "options": ["cultivated refinement and knowledge of conventions", "unnecessary physical decoration only", "proof of higher moral worth"], "answer": 0, "explanations": ["此處 sophistication 表示「修養、世故與文化品味」。須依原句語境理解。", "這個選項表示「僅多餘實體裝飾」；原句要表達的是「修養、世故與文化品味」。", "這個選項表示「較高道德價值的證明」；原句要表達的是「修養、世故與文化品味」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-48", "mode": "vocab", "paragraph": "F", "sentence": "Applause became a matter of ‘do’ or ‘don’t’, so losing many old shades of meaning.", "target": "shades of meaning", "options": ["subtle differences in what is communicated", "different paint colours only", "the volume of noise alone"], "answer": 0, "explanations": ["此處 shades of meaning 表示「細微意涵差異」。須依原句語境理解。", "這個選項表示「僅不同油漆顏色」；原句要表達的是「細微意涵差異」。", "這個選項表示「僅噪音音量」；原句要表達的是「細微意涵差異」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-49", "mode": "vocab", "paragraph": "F", "sentence": "Applause became much less of a true dialogue with an audience, especially so with opera, where the singers saw it as part of a basic transaction with the crowd.", "target": "dialogue", "options": ["a meaningful exchange between parties", "a one-way command with no response", "a written contract only"], "answer": 0, "explanations": ["此處 dialogue 表示「對話、相互交流」。須依原句語境理解。", "這個選項表示「無回應的單向命令」；原句要表達的是「對話、相互交流」。", "這個選項表示「僅書面合約」；原句要表達的是「對話、相互交流」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-50", "mode": "vocab", "paragraph": "F", "sentence": "Applause became much less of a true dialogue with an audience, especially so with opera, where the singers saw it as part of a basic transaction with the crowd.", "target": "transaction", "options": ["an exchange in which something is given and received", "a completely spontaneous private emotion", "a literal journey across a country"], "answer": 0, "explanations": ["此處 transaction 表示「交易式交換」。須依原句語境理解。", "這個選項表示「完全自發的私人情感」；原句要表達的是「交易式交換」。", "這個選項表示「實際橫跨國家的旅程」；原句要表達的是「交易式交換」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-51", "mode": "vocab", "paragraph": "F", "sentence": "So by the time the 19th century arrived, applause had become standardized and institutionalized, and had become an expectation rather than the reward it used to be.", "target": "standardized", "options": ["made to follow a common fixed pattern", "made infinitely varied", "made completely impossible"], "answer": 0, "explanations": ["此處 standardized 表示「標準化的」。須依原句語境理解。", "這個選項表示「使無限多樣的」；原句要表達的是「標準化的」。", "這個選項表示「使完全不可能的」；原句要表達的是「標準化的」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-52", "mode": "vocab", "paragraph": "G", "sentence": "In the 21st century we’re reinventing applause, to make it what it used to be: a coded form of communication.", "target": "reinventing", "options": ["giving something an updated form or renewed use", "destroying every earlier function", "copying without any change"], "answer": 0, "explanations": ["此處 reinventing 表示「重新塑造、再創造」。須依原句語境理解。", "這個選項表示「摧毀全部既有功能」；原句要表達的是「重新塑造、再創造」。", "這個選項表示「毫無改變照抄」；原句要表達的是「重新塑造、再創造」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-53", "mode": "vocab", "paragraph": "G", "sentence": "In the 21st century we’re reinventing applause, to make it what it used to be: a coded form of communication.", "target": "coded form of communication", "options": ["a way of conveying messages through shared signals", "random noise with no meaning", "communication restricted to writing computer programs"], "answer": 0, "explanations": ["此處 coded form of communication 表示「透過共同訊號傳意的溝通形式」。須依原句語境理解。", "這個選項表示「毫無意義的隨機噪音」；原句要表達的是「透過共同訊號傳意的溝通形式」。", "這個選項表示「僅寫程式的溝通」；原句要表達的是「透過共同訊號傳意的溝通形式」。"], "tag": "搭配與語境義"}, {"id": "applause-vocab-54", "mode": "vocab", "paragraph": "G", "sentence": "By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising.", "target": "appreciation", "options": ["recognition and positive regard", "a legal requirement to make payment", "complete indifference"], "answer": 0, "explanations": ["此處 appreciation 表示「欣賞、感謝」。須依原句語境理解。", "這個選項表示「依法必須付款」；原句要表達的是「欣賞、感謝」。", "這個選項表示「完全漠不關心」；原句要表達的是「欣賞、感謝」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-55", "mode": "vocab", "paragraph": "G", "sentence": "By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising.", "target": "amplifying", "options": ["increasing the impact or reach of", "necessarily raising only physical sound volume", "making less noticeable"], "answer": 0, "explanations": ["此處 amplifying 表示「擴大影響、傳播」。須依原句語境理解。", "這個選項表示「必然只提高實際音量」；原句要表達的是「擴大影響、傳播」。", "這個選項表示「使更不顯眼」；原句要表達的是「擴大影響、傳播」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-56", "mode": "vocab", "paragraph": "G", "sentence": "By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising.", "target": "extending", "options": ["prolonging or spreading more widely", "bringing to an immediate end", "excluding all further participation"], "answer": 0, "explanations": ["此處 extending 表示「延伸、擴散」。須依原句語境理解。", "這個選項表示「立即終止」；原句要表達的是「延伸、擴散」。", "這個選項表示「排除後續參與」；原句要表達的是「延伸、擴散」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-57", "mode": "vocab", "paragraph": "G", "sentence": "Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead.", "target": "momentary", "options": ["lasting only a very short time", "permanent without change", "extremely complicated"], "answer": 0, "explanations": ["此處 momentary 表示「短暫的」。須依原句語境理解。", "這個選項表示「永久不變的」；原句要表達的是「短暫的」。", "這個選項表示「極複雜的」；原句要表達的是「短暫的」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-58", "mode": "vocab", "paragraph": "G", "sentence": "Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead.", "target": "short-lived", "options": ["not lasting long", "lasting throughout history", "produced only in quiet places"], "answer": 0, "explanations": ["此處 short-lived 表示「持續不久的」。須依原句語境理解。", "這個選項表示「貫穿全部歷史的」；原句要表達的是「持續不久的」。", "這個選項表示「只在安靜地方產生的」；原句要表達的是「持續不久的」。"], "tag": "字彙與語境義"}, {"id": "applause-vocab-59", "mode": "vocab", "paragraph": "G", "sentence": "Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead.", "target": "far more permanent", "options": ["considerably more lasting", "less lasting than before", "guaranteed never to change in any possible way"], "answer": 0, "explanations": ["此處 far more permanent 表示「持續得長久許多」。須依原句語境理解。", "這個選項表示「比以前更短暫」；原句要表達的是「持續得長久許多」。", "這個選項表示「保證任何方面都永不改變」；原句要表達的是「持續得長久許多」。"], "tag": "搭配與語境義"}, {"id": "applause-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Scholars aren't quite sure about the origins of applause, but the form that is still most common, clapping the hands together, was formalized in Western culture during and after performances.", "target": "", "options": ["The exact origins are uncertain, although handclapping became a formal Western performance convention.", "Scholars have established the exact first applause event beyond doubt.", "Uncertainty about origins means handclapping never became customary."], "answer": 0, "explanations": ["aren't quite sure 與 was formalized 區分起源未知與慣例形成。", "否定的不確定不能改成精確定論。", "原句明說後來正式化，非從未成慣例。"], "tag": "長難句理解", "structure": "Scholars aren't sure...為第一分句；but the form...was formalized...為被動第二分句；clapping...同位解釋 form；that is...修飾 form。"}, {"id": "applause-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "During the time of the Roman Republic (509 BC — 27 BC) the common way to end a play was for the chief actor to yell ‘Valete et plaudite!’ (‘Goodbye and applaud!’) thus signaling to the audience that it was time for them to give praise by striking hands and making explosive noise.", "target": "", "options": ["The actor's closing call cued the audience to express approval through clapping.", "The actor ordered the audience to remain silent for the rest of the evening.", "The call was made solely to tell performers when to begin the play."], "answer": 0, "explanations": ["thus signaling 表台詞結尾提示觀眾讚賞，不是開演提示。", "give praise by striking hands 與保持沉默相反。", "common way to end a play 不等於開始。"], "tag": "長難句理解", "structure": "the common way...was for the actor to yell...為主幹；thus signaling...為結果分詞；that it was time...為訊號內容；for them 指 audience。"}, {"id": "applause-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "Rome saw the rise of a professional class of applauders, or ‘people who clapped for their dinner’, hired to infiltrate crowds and manipulate their reaction to performances.", "target": "", "options": ["Some applause was produced by paid people blending into the audience to influence its reaction.", "Every audience member clapped entirely independently without any paid influence.", "The professional applauders were employed only to prevent all praise."], "answer": 0, "explanations": ["hired to infiltrate and manipulate 說明受僱者的偽裝及目的。", "存在 paid class，不能說 every entirely independent。", "操控、延長讚賞非一律阻止。"], "tag": "長難句理解", "structure": "Rome saw the rise...以地點代時期；or people...為同位解釋；hired to...為被動分詞；two to 不定詞含 infiltrate 與 manipulate 兩項目的。"}, {"id": "applause-paraphrase-4", "mode": "paraphrase", "paragraph": "A", "sentence": "Actors would hire a dozen or so people to spread out among their audiences and prolong the applause, or, if they were feeling especially bold, to start ‘spontaneous’ chants and shouts of praise.", "target": "", "options": ["Actors hired people to extend applause or, more boldly, initiate praise that only appeared spontaneous.", "The praise was necessarily unplanned because quotation marks prove sincerity.", "The actors hired people only to leave the theatre early."], "answer": 0, "explanations": ["引號暗示反諷，受僱事實顯示非真正自發。", "把反諷引號當真誠證明，忽略 hire。", "spread out、prolong、start chants 都非提早離場。"], "tag": "長難句理解", "structure": "would hire...為慣常作法；to spread...and prolong...為目的；or...to start...為另一方案；if...especially bold 插入條件，‘spontaneous’修飾表象。"}, {"id": "applause-paraphrase-5", "mode": "paraphrase", "paragraph": "B", "sentence": "One of the chief methods they used to estimate their standing with the people was gauging the greetings they got when they entered the arena.", "target": "", "options": ["Leaders used audience greetings as one way to estimate their popularity.", "The sentence describes measuring leaders' physical height in a crowd.", "Greeting volume was declared a flawless measure of every citizen's actual belief."], "answer": 0, "explanations": ["estimate their standing 指推估民望，不是體測或完美代表。", "standing 是聲望語境義。", "one method、estimate 不支持無偏且完美測所有人。"], "tag": "長難句理解", "structure": "One of the methods...was gauging...為主幹；they used...修飾 methods；to estimate...為目的；greetings they got...含關係子句；when...為到場時點。"}, {"id": "applause-paraphrase-6", "mode": "paraphrase", "paragraph": "B", "sentence": "Leaders became astute at reading the volume, the rhythm, and the length of the crowd's claps for clues about how well they were doing as officials and lawmakers.", "target": "", "options": ["Leaders learned to interpret the loudness, rhythm and duration of claps as clues to approval.", "Only the total number of seats was relevant to their assessment.", "The three clap features directly proved every official had made good laws."], "answer": 0, "explanations": ["for clues 表線索，不是完整客觀證明。", "原文明列三項聲音／時間特徵。", "clues about performance 不等於證明政策良善。"], "tag": "長難句理解", "structure": "became astute at reading...為主幹；三個名詞並列；for clues...表用途；about how well...為嵌入疑問內容；as officials...限定身分。"}, {"id": "applause-paraphrase-7", "mode": "paraphrase", "paragraph": "C", "sentence": "Cicero, the Roman lawyer, would send friends to stand around outside the arena, taking notes to see what kind of greeting each official got when he entered, the better to see who was beloved by the people, and who was not.", "target": "", "options": ["Cicero sent observers to compare rivals' receptions and judge who enjoyed public affection.", "He sent friends to manufacture identical greetings for every official.", "The observers were sent to find out only the officials' private financial wealth."], "answer": 0, "explanations": ["taking notes、the better to see 表蒐集比較支持度。", "原句是觀察紀錄，未說偽造一致反應。", "beloved by people 指民眾喜愛，不是私產。"], "tag": "長難句理解", "structure": "would send friends to stand...為慣常行動；taking notes...為伴隨分詞；to see what...為目的；the better to see...強化目的；who...and who...平行。"}, {"id": "applause-paraphrase-8", "mode": "paraphrase", "paragraph": "C", "sentence": "And particularly in the Greco-Roman world, crowds, especially in cities, were really good at communicating messages through rhythmic clapping, sometimes coupled with shouts.’", "target": "", "options": ["Crowds communicated through patterned applause, sometimes combining it with shouted responses.", "All the messages were purely silent and involved no clapping.", "The passage says rhythmic applause always carried exactly the same meaning."], "answer": 0, "explanations": ["sometimes 表有時伴喊，coding 指可傳訊的模式。", "rhythmic clapping 本身有聲，另可能加喊。", "能以模式傳訊不表示永遠同一內容。"], "tag": "長難句理解", "structure": "crowds...were good at communicating...為主幹；particularly...與 especially...為範圍插入；through...表媒介；coupled with...為被動分詞，sometimes 限定頻率。"}, {"id": "applause-paraphrase-9", "mode": "paraphrase", "paragraph": "C", "sentence": "The coding was, he says, invaluable when assessing an orator’s fortunes.", "target": "", "options": ["Understanding these patterns was extremely useful for judging a speaker's political prospects.", "The patterns had no value for assessing a speaker.", "The historian could determine every future event with certainty from a single clap."], "answer": 0, "explanations": ["invaluable 表極有價值，不是無價值；assessing 非全知預測。", "in-在此不能按普通否定讀成沒有價值。", "有用線索不等於能確知每件未來事。"], "tag": "長難句理解", "structure": "The coding was...invaluable 為主幹；he says 插入來源；when assessing...省略評估者；orator's fortunes 指成敗前景而非僅財富。"}, {"id": "applause-paraphrase-10", "mode": "paraphrase", "paragraph": "D", "sentence": "While Greco-Roman audiences certainly smacked their palms together the same way we do today, their overall strategies of applause were much more varied than clapping alone.", "target": "", "options": ["Ancient audiences clapped as people do now but also used a wider range of approving gestures.", "Ancient audiences never brought their hands together.", "Their only possible expression of approval was modern handclapping."], "answer": 0, "explanations": ["While 讓步承認拍手相同，主句說還有更多變化。", "certainly smacked palms 承認拍手存在。", "much more varied than clapping alone 排除僅此一種。"], "tag": "長難句理解", "structure": "While...smacked...為讓步；the same way [that] we do...為比較；overall strategies were...為主句；than clapping alone 為比較對象。"}, {"id": "applause-paraphrase-11", "mode": "paraphrase", "paragraph": "D", "sentence": "Crowds expressed degrees of approval of the person or persons before them, ranging from claps, to snaps (of the finger and thumb), to waves (of the edge of the toga).", "target": "", "options": ["Approval could be expressed by clapping, snapping fingers or waving part of a garment.", "Every gesture involved raising exactly the same handkerchief.", "Only the volume of spoken praise distinguished levels of approval."], "answer": 0, "explanations": ["ranging from...to...to...列多種非單一形式。", "手帕是下一句帝王更換措施，不能套到全部。", "原句包括手與衣服動作，不只說話。"], "tag": "長難句理解", "structure": "Crowds expressed degrees...為主幹；of the person...表示被認可對象；ranging...為列舉分詞；括號明示 snaps 與 waves 的動作部位。"}, {"id": "applause-paraphrase-12", "mode": "paraphrase", "paragraph": "D", "sentence": "The emperor Aurelian decided to replace this gesture by waving a special handkerchief instead, a prop which he then distributed to all Roman citizens, so they would never be without a way to praise him.", "target": "", "options": ["Aurelian replaced garment-waving with a special cloth that citizens could use to praise him.", "Aurelian prohibited every visible display of praise.", "The cloth was distributed so that citizens would have no means to applaud."], "answer": 0, "explanations": ["so they would never be without a way 表確保隨時有讚賞方式的雙重否定。", "分發道具為讚賞，不是禁絕。", "never without 表不缺，非完全沒有。"], "tag": "長難句理解", "structure": "decided to replace...by waving...為主幹；a prop 同位說明 handkerchief；which he distributed...為關係子句；so...表目的，never...without 須整體解讀。"}, {"id": "applause-paraphrase-13", "mode": "paraphrase", "paragraph": "E", "sentence": "Although the style of applause may have changed over the centuries, the need to manipulate remained. 16th-century French poet Jean Daurat is credited with bringing back the Roman practice of hiring professional applauders.", "target": "", "options": ["The form of applause changed, but the motive to manipulate audiences persisted.", "The passage says changes in form eliminated every attempt at manipulation.", "Nothing about applause ever changed over time."], "answer": 0, "explanations": ["Although 對照形式改變與目的延續。", "remained 不等於 eliminated。", "may have changed 承認形式演變。"], "tag": "長難句理解", "structure": "Although...may have changed 為讓步子句；the need...remained 為主句；to manipulate 修飾 need；over centuries 為長時間範圍。"}, {"id": "applause-paraphrase-14", "mode": "paraphrase", "paragraph": "E", "sentence": "Although the style of applause may have changed over the centuries, the need to manipulate remained. 16th-century French poet Jean Daurat is credited with bringing back the Roman practice of hiring professional applauders.", "target": "", "options": ["Daurat is associated with reviving the older Roman practice of paid applause.", "Daurat is identified as the first human ever to invent applause.", "He is blamed for proving paid applause had never existed in Rome."], "answer": 0, "explanations": ["bringing back 指復興既有作法，不是首創掌聲。", "revival 不等於最初發明。", "the Roman practice 明確認為古羅馬已有。"], "tag": "長難句理解", "structure": "16th-century...poet 為主詞，姓名同位；is credited with 為被動歸功；bringing back...為動名詞受詞；of hiring...補 practice 內容。"}, {"id": "applause-paraphrase-15", "mode": "paraphrase", "paragraph": "E", "sentence": "By the early 1820s, claques had become institutionalized, with an agency in Paris specializing in the distribution of the claqueurs’ services.", "target": "", "options": ["By the early 1820s paid applause had become organised through a specialised agency.", "The practice remained entirely random with no organised suppliers.", "The agency was established only to outlaw paid applause."], "answer": 0, "explanations": ["institutionalized 與 specializing in distribution 描述組織化服務。", "與完全隨機無供應者相反。", "分配服務不是禁止服務。"], "tag": "長難句理解", "structure": "By...為截止時點；claques had become...為過去完成；with an agency...specializing...為伴隨結構；in distribution 說明專業服務。"}, {"id": "applause-paraphrase-16", "mode": "paraphrase", "paragraph": "E", "sentence": "The claque also underwent a kind of classification: the rieurs (laughers) would laugh loudly at the jokes; the pleureurs (criers) would feign tears in reaction to performances; the commissaires (officers) would learn a play or a piece of music by heart and then call attention to its best parts.", "target": "", "options": ["Different categories of paid supporters specialised in laughter, simulated tears or drawing attention to strong passages.", "Every supporter had exactly the same task with no classification.", "The criers were required to cry only from sincere involuntary emotion."], "answer": 0, "explanations": ["classification 下三類工作不同；feign 明確是裝哭。", "原句列類別與功能，不能說無區別。", "feign 與必須真情非自主相反。"], "tag": "長難句理解", "structure": "The claque underwent classification 為主幹；冒號後三個分號分句平行列工作；would 表慣常；by heart 為記熟，then 表後續引導注意。"}, {"id": "applause-paraphrase-17", "mode": "paraphrase", "paragraph": "E", "sentence": "This practice spread to Milan, to Vienna, and to London before falling out of fashion.", "target": "", "options": ["The practice spread internationally before losing popularity, and awareness of its tricks undermined its power.", "The practice never left France.", "Public discovery of the tricks strengthened its influence without limit."], "answer": 0, "explanations": ["spread...before...與 once...明示擴散後衰退，揭穿削弱效果。", "明列 Milan、Vienna、London，非只法國。", "lost power 不能改成無限增強。"], "tag": "長難句理解", "structure": "This practice spread...為主幹；to...三地並列；before falling...為時間分詞；下一句 once...為觸發條件，its 指 claque。"}, {"id": "applause-paraphrase-18", "mode": "paraphrase", "paragraph": "F", "sentence": "In the 18th century, symphonies and concerts became more serious, aligning themselves with the reverence and spirituality associated with religious ceremonies.", "target": "", "options": ["Concert culture became more solemn by adopting attitudes associated with religious ceremony.", "All concerts were physically relocated inside churches by definition.", "The shift is described as making concerts less serious and more casually interactive."], "answer": 0, "explanations": ["aligning 表態度取向，不等於必須在教堂。", "精神或禮儀比擬不直接確定實體地點。", "more serious 不是 less serious。"], "tag": "長難句理解", "structure": "symphonies and concerts became...為主幹；aligning themselves with...為伴隨分詞；associated with...修飾 reverence and spirituality。"}, {"id": "applause-paraphrase-19", "mode": "paraphrase", "paragraph": "F", "sentence": "Knowing when to maintain silence, as well as when to clap, became a mark of sophistication, a kind of code for audiences to learn.", "target": "", "options": ["Understanding when to remain silent or applaud became a sign of cultivated audience behaviour.", "Every sound made during a performance was equally appropriate.", "Knowing when to clap meant silence was never acceptable."], "answer": 0, "explanations": ["when silence 與 when clap 兩種情境並存，需知規範。", "knowing when 表時機有別，非一切聲音皆合宜。", "silence 被列入需知內容，不能排除。"], "tag": "長難句理解", "structure": "Knowing...為動名詞主詞；when to maintain silence 與 when to clap 平行；became a mark...為主幹；a kind of code 同位補充 sophistication 的規範。"}, {"id": "applause-paraphrase-20", "mode": "paraphrase", "paragraph": "F", "sentence": "Applause became a matter of ‘do’ or ‘don’t’, so losing many old shades of meaning.", "target": "", "options": ["Reducing applause to a choice between doing it and not doing it removed some former nuances.", "The binary rule added infinitely many new meanings.", "Applause retained every earlier shade of meaning unchanged."], "answer": 0, "explanations": ["do or don't 二分；so losing...表細微意義減少。", "losing 與 adding 相反。", "many old shades lost 不等於全部原封不動。"], "tag": "長難句理解", "structure": "Applause became a matter of...為主幹；so losing...為結果分詞，主體 applause；many 不等於全部；shades 是細微語義非色彩。"}, {"id": "applause-paraphrase-21", "mode": "paraphrase", "paragraph": "F", "sentence": "So by the time the 19th century arrived, applause had become standardized and institutionalized, and had become an expectation rather than the reward it used to be.", "target": "", "options": ["By the nineteenth century, applause had become a standard expectation rather than a freely earned reward.", "The sentence says applause was abolished completely in the nineteenth century.", "Applause became less predictable and entirely free of conventions."], "answer": 0, "explanations": ["expectation、standardized、institutionalized 表固定化，非消失。", "had become expectation 承認仍存在。", "標準與慣例化不能改成完全無規範。"], "tag": "長難句理解", "structure": "by the time...為截止時間子句；had become...兩次並列過去完成謂語；rather than...區分新功能與舊功能；it used to be 為修飾 reward 的省略關係子句。"}, {"id": "applause-paraphrase-22", "mode": "paraphrase", "paragraph": "G", "sentence": "In the 21st century we’re reinventing applause, to make it what it used to be: a coded form of communication.", "target": "", "options": ["Digital forms are described as renewing applause's earlier role as coded communication.", "The author says modern approval has no connection with earlier applause.", "The aim is to remove all communicative meaning from public approval."], "answer": 0, "explanations": ["what it used to be 指重新取得舊功能，而非全斷裂。", "reinvent to make what it used to be 明示延續。", "coded communication 正是保留並更新的功能。"], "tag": "長難句理解", "structure": "we're reinventing...為主幹；to make...為目的；what it used to be 為受詞補語內容；冒號後名詞組解釋 what。"}, {"id": "applause-paraphrase-23", "mode": "paraphrase", "paragraph": "G", "sentence": "By connecting with others in this way, we become part of the performance by participating in it, demonstrating our appreciation by amplifying and extending the show through commenting and praising.", "target": "", "options": ["Online interaction makes the audience part of the performance by helping spread and extend it.", "The audience remains entirely passive and never contributes to the reach of a performance.", "The sentence claims all online comments are literal handclaps heard in the theatre."], "answer": 0, "explanations": ["by participating、demonstrating...through commenting 描述參與式類比。", "成為一部分與被動無貢獻相反。", "類比掌聲不是字面現場拍手。"], "tag": "長難句理解", "structure": "By connecting...為方法；we become...為主句；by participating...再說方法；demonstrating...為伴隨分詞；by amplifying...補欣賞的呈現途徑。"}, {"id": "applause-paraphrase-24", "mode": "paraphrase", "paragraph": "G", "sentence": "Our kind of applause matters more now, in many ways, because it is no longer momentary and short-lived, but is far more permanent instead.", "target": "", "options": ["The writer argues that digital approval has greater significance partly because it lasts longer than momentary applause.", "Digital approval is described as less lasting than earlier applause.", "The sentence guarantees that every online response will remain accessible forever."], "answer": 0, "explanations": ["because...no longer...but...more permanent 是相對持久比較，不是絕對永久保證。", "比較方向被顛倒。", "far more permanent 不等於 every forever。"], "tag": "長難句理解", "structure": "Our kind of applause...matters more 為主幹；because 引理由；no longer momentary...but far more permanent 為對照；in many ways 限定比較面向。"}, {"id": "applause-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "The impact of musical performance on the etiquette of applause.", "target": "etiquette", "options": ["禮儀、行為規範", "器材技術", "客觀音高"], "answer": 0, "explanations": ["etiquette 指何時鼓掌等適切舉止。此處練習題目用語，不表示整句符合原文。", "不是技術器材", "不是聲音屬性"], "tag": "題目字彙", "source": "Question 14–20 Heading i · 題目用語"}, {"id": "applause-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "The initial emergence of applause in the theatre.", "target": "emergence", "options": ["出現、興起", "完全消失", "固定價格"], "answer": 0, "explanations": ["emergence 指開始形成或變得明顯。此處練習題目用語，不表示整句符合原文。", "不是 disappearance", "不是價目"], "tag": "題目字彙", "source": "Question 14–20 Heading iii · 題目用語"}, {"id": "applause-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "A form of applause that is more far-reaching than before.", "target": "far-reaching", "options": ["影響廣泛、深遠的", "只能在很遠處聽到的", "毫無影響的"], "answer": 0, "explanations": ["此處 far-reaching 指傳播及影響範圍。此處練習題目用語，不表示整句符合原文。", "不是只比實體聽距", "深遠不等於無影響"], "tag": "題目字彙", "source": "Question 14–20 Heading iv · 題目用語"}, {"id": "applause-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "The use of applause to evaluate political figures' popularity.", "target": "evaluate", "options": ["評估", "無條件認同", "故意製造"], "answer": 0, "explanations": ["evaluate 是判斷、衡量。此處練習題目用語，不表示整句符合原文。", "評估不等於贊同", "測量不等於操控製造"], "tag": "題目字彙", "source": "Question 14–20 Heading v · 題目用語"}, {"id": "applause-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "The different methods of applause employed in ancient times.", "target": "employed", "options": ["採用、運用的", "所有人皆領薪才適用", "永久淘汰的"], "answer": 0, "explanations": ["methods employed 指所用方法。此處練習題目用語，不表示整句符合原文。", "employ 方法並非僱用人", "不是棄用"], "tag": "題目字彙", "source": "Question 14–20 Heading vii · 題目用語"}, {"id": "applause-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "The re-emergence and disappearance of fake appreciation.", "target": "fake appreciation", "options": ["虛假、假裝的讚賞", "毫無保留的真誠情感", "正式法律批評"], "answer": 0, "explanations": ["fake 指非真誠、為表演而做。此處練習題目用語，不表示整句符合原文。", "與真誠相反", "不是法律譴責"], "tag": "題目字彙", "source": "Question 14–20 Heading viii · 題目用語"}, {"id": "applause-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "Working out how popular an opponent was.", "target": "opponent", "options": ["對手、競爭者", "必然支持自己的盟友", "不相干的觀眾"], "answer": 0, "explanations": ["政治語境為競爭對手。此處練習題目用語，不表示整句符合原文。", "不是確保支持的盟友", "不是泛指觀眾"], "tag": "題目字彙", "source": "Question 14–20 Heading x · 題目用語"}, {"id": "applause-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "The cost of hire depended on the fame of the client.", "target": "hire", "options": ["僱用、租用服務", "自行創作", "完全免費的贈品"], "answer": 0, "explanations": ["cost of hire 指聘用服務所需費用。此處練習題目用語，不表示整句符合原文。", "不是自己創作", "hire 不等於免費"], "tag": "題目字彙", "source": "Question 21–22 C · 題目用語"}, {"id": "applause-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "Claqueurs were divided into different categories.", "target": "categories", "options": ["類別", "地理方位", "固定音量"], "answer": 0, "explanations": ["categories 指依功能等分出的組別。此處練習題目用語，不表示整句符合原文。", "不是方位", "不是單一音量"], "tag": "題目字彙", "source": "Question 21–22 D · 題目用語"}, {"id": "applause-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "People could show their superiority by knowing when silence or applause was appropriate.", "target": "superiority", "options": ["較優越的地位或自我呈現", "必然較高道德水準", "完全不具知識"], "answer": 0, "explanations": ["此處為文化修養的地位展示，不是道德確證。此處練習題目用語，不表示整句符合原文。", "社會優越感不等於已證道德較高", "不是無知"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}, {"id": "applause-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "People could show their superiority by knowing when silence or applause was appropriate.", "target": "appropriate", "options": ["合宜、適當的", "毫無限制均可的", "刻意隱瞞的"], "answer": 0, "explanations": ["appropriate 指符合場合規範。此處練習題目用語，不表示整句符合原文。", "有規範不等於皆可", "不是 concealed"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}, {"id": "applause-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "Performers no longer had a meaningful dialogue with their audiences.", "target": "meaningful dialogue", "options": ["有實質意義的雙向交流", "無回應的單向命令", "固定票價"], "answer": 0, "explanations": ["dialogue 指雙方有回應的互動。此處練習題目用語，不表示整句符合原文。", "非只有命令", "不是財務價格"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}, {"id": "applause-questionVocab-13", "mode": "questionVocab", "paragraph": "", "sentence": "Modern expressions of approval last longer than earlier applause.", "target": "expressions of approval", "options": ["表示認可、讚賞的方式", "僅臉部怒氣", "正式求職申請"], "answer": 0, "explanations": ["expression 此處泛指表達方式，approval 是正面認可。此處練習題目用語，不表示整句符合原文。", "不只臉部且不是憤怒", "不是 application"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}, {"id": "applause-questionVocab-14", "mode": "questionVocab", "paragraph": "", "sentence": "Modern expressions of approval last longer than earlier applause.", "target": "approval", "options": ["認可、贊同", "不滿、反對", "觀眾總人數"], "answer": 0, "explanations": ["approval 指正面評價。此處練習題目用語，不表示整句符合原文。", "與 disapproval 相反", "不是人數統計"], "tag": "題目字彙", "source": "Question 23–26 · 題目用語"}]}]</script><script>

let mode='vocab',paragraph='all',category='all',wrongOnly=false,queue=[],position=0;

function fingerprint(q){return JSON.stringify([q.id,q.sentence,q.options,q.answer])}
