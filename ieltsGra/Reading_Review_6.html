nship", "options": ["a sense of connection or shared qualities", "necessarily direct biological descent", "complete lack of similarity"], "answer": 0, "explanations": ["此處 kinship 表示「親近感、共通性」。須依原句語境理解。", "這個選項表示「必然直接血緣傳承」；原句要表達的是「親近感、共通性」。", "這個選項表示「完全無相似」；原句要表達的是「親近感、共通性」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-70", "mode": "vocab", "paragraph": "F", "sentence": "Recognising our kinship to people in the past, and tracing, or discovering, their likeness to ourselves, we are flattered in the belief that underneath we are all lovable; eccentric perhaps and even absurd, but large-hearted, generous and frank.", "target": "eccentric", "options": ["unconventional or odd", "completely typical in every way", "highly hostile without exception"], "answer": 0, "explanations": ["此處 eccentric 表示「古怪、不循常規的」。須依原句語境理解。", "這個選項表示「各方面完全典型」；原句要表達的是「古怪、不循常規的」。", "這個選項表示「毫無例外充滿敵意」；原句要表達的是「古怪、不循常規的」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-71", "mode": "vocab", "paragraph": "F", "sentence": "Recognising our kinship to people in the past, and tracing, or discovering, their likeness to ourselves, we are flattered in the belief that underneath we are all lovable; eccentric perhaps and even absurd, but large-hearted, generous and frank.", "target": "absurd", "options": ["ridiculous or unreasonable", "entirely logical", "unavoidably tragic"], "answer": 0, "explanations": ["此處 absurd 表示「荒謬的」。須依原句語境理解。", "這個選項表示「完全合邏輯的」；原句要表達的是「荒謬的」。", "這個選項表示「無可避免悲劇性的」；原句要表達的是「荒謬的」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-72", "mode": "vocab", "paragraph": "F", "sentence": "Recognising our kinship to people in the past, and tracing, or discovering, their likeness to ourselves, we are flattered in the belief that underneath we are all lovable; eccentric perhaps and even absurd, but large-hearted, generous and frank.", "target": "large-hearted", "options": ["kind and generous", "having a medically enlarged heart", "financially wealthy by definition"], "answer": 0, "explanations": ["此處 large-hearted 表示「寬厚、慷慨的」。須依原句語境理解。", "這個選項表示「醫學上心臟擴大的」；原句要表達的是「寬厚、慷慨的」。", "這個選項表示「按定義財富豐厚的」；原句要表達的是「寬厚、慷慨的」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-73", "mode": "vocab", "paragraph": "F", "sentence": "Recognising our kinship to people in the past, and tracing, or discovering, their likeness to ourselves, we are flattered in the belief that underneath we are all lovable; eccentric perhaps and even absurd, but large-hearted, generous and frank.", "target": "frank", "options": ["open and honest in expression", "secretive in all matters", "a former French currency"], "answer": 0, "explanations": ["此處 frank 表示「坦率的」。須依原句語境理解。", "這個選項表示「凡事隱密的」；原句要表達的是「坦率的」。", "這個選項表示「以前的法國貨幣」；原句要表達的是「坦率的」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-74", "mode": "vocab", "paragraph": "F", "sentence": "This sense of integration with the past can thus serve as a comfortable alternative to critical awareness and self-questioning, allowing us to dignify the present by illegitimate association with the past.", "target": "critical awareness", "options": ["the ability to examine assumptions and problems thoughtfully", "automatic acceptance of familiar beliefs", "dislike without any reasoning"], "answer": 0, "explanations": ["此處 critical awareness 表示「批判意識」。須依原句語境理解。", "這個選項表示「自動接受熟悉信念」；原句要表達的是「批判意識」。", "這個選項表示「毫無理由的厭惡」；原句要表達的是「批判意識」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-75", "mode": "vocab", "paragraph": "F", "sentence": "This sense of integration with the past can thus serve as a comfortable alternative to critical awareness and self-questioning, allowing us to dignify the present by illegitimate association with the past.", "target": "self-questioning", "options": ["examining one's own assumptions", "asking only other people for biographical facts", "doubting the existence of all evidence"], "answer": 0, "explanations": ["此處 self-questioning 表示「自我反省、質疑」。須依原句語境理解。", "這個選項表示「只詢問他人生平」；原句要表達的是「自我反省、質疑」。", "這個選項表示「懷疑所有證據存在」；原句要表達的是「自我反省、質疑」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-76", "mode": "vocab", "paragraph": "F", "sentence": "This sense of integration with the past can thus serve as a comfortable alternative to critical awareness and self-questioning, allowing us to dignify the present by illegitimate association with the past.", "target": "dignify", "options": ["make something seem worthy of respect", "prove something is factually true", "make something physically larger"], "answer": 0, "explanations": ["此處 dignify 表示「使顯得莊重、有尊嚴」。須依原句語境理解。", "這個選項表示「證明事實為真」；原句要表達的是「使顯得莊重、有尊嚴」。", "這個選項表示「使實體變大」；原句要表達的是「使顯得莊重、有尊嚴」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-77", "mode": "vocab", "paragraph": "F", "sentence": "This sense of integration with the past can thus serve as a comfortable alternative to critical awareness and self-questioning, allowing us to dignify the present by illegitimate association with the past.", "target": "illegitimate association", "options": ["an unjustified connection", "a legally recognised historical fact", "a biological family relationship only"], "answer": 0, "explanations": ["此處 illegitimate association 表示「不正當、無充分依據的連結」。須依原句語境理解。", "這個選項表示「依法承認的史實」；原句要表達的是「不正當、無充分依據的連結」。", "這個選項表示「僅生物親緣」；原句要表達的是「不正當、無充分依據的連結」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-78", "mode": "vocab", "paragraph": "G", "sentence": "Social history, if it is to fulfil its subversive potential, needs to be a great deal more disturbing.", "target": "subversive potential", "options": ["capacity to challenge accepted structures or beliefs", "ability to preserve every convention unchanged", "a plan to physically destroy archives"], "answer": 0, "explanations": ["此處 subversive potential 表示「顛覆既有觀念的潛力」。須依原句語境理解。", "這個選項表示「維持全部慣例不變的能力」；原句要表達的是「顛覆既有觀念的潛力」。", "這個選項表示「實際摧毀檔案的計畫」；原句要表達的是「顛覆既有觀念的潛力」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-79", "mode": "vocab", "paragraph": "G", "sentence": "If it is to celebrate a common humanity, and to bring past and present closer together, far more weight needs to be given to the effects of insecurities and emergencies—the fears that shadow the growing up of children, the oppositions we encounter during our lives—experiences which may be hard for an individual to categorise but which nevertheless have a significance which goes beyond that individual.", "target": "more weight", "options": ["greater importance or emphasis", "more physical mass only", "a longer waiting period"], "answer": 0, "explanations": ["此處 more weight 表示「更大重視」。須依原句語境理解。", "這個選項表示「僅更大實際重量」；原句要表達的是「更大重視」。", "這個選項表示「更長等候期」；原句要表達的是「更大重視」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-80", "mode": "vocab", "paragraph": "G", "sentence": "If it is to celebrate a common humanity, and to bring past and present closer together, far more weight needs to be given to the effects of insecurities and emergencies—the fears that shadow the growing up of children, the oppositions we encounter during our lives—experiences which may be hard for an individual to categorise but which nevertheless have a significance which goes beyond that individual.", "target": "insecurities", "options": ["feelings or conditions of uncertainty and vulnerability", "confirmed peace and certainty", "private financial guarantees"], "answer": 0, "explanations": ["此處 insecurities 表示「不安全感、不穩定處境」。須依原句語境理解。", "這個選項表示「已確認的安定和確定」；原句要表達的是「不安全感、不穩定處境」。", "這個選項表示「私人財務保證」；原句要表達的是「不安全感、不穩定處境」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-81", "mode": "vocab", "paragraph": "G", "sentence": "If it is to celebrate a common humanity, and to bring past and present closer together, far more weight needs to be given to the effects of insecurities and emergencies—the fears that shadow the growing up of children, the oppositions we encounter during our lives—experiences which may be hard for an individual to categorise but which nevertheless have a significance which goes beyond that individual.", "target": "shadow", "options": ["affect persistently in a troubling way", "block sunlight physically only", "make completely irrelevant"], "answer": 0, "explanations": ["此處 shadow 表示「籠罩、伴隨影響」。須依原句語境理解。", "這個選項表示「僅實際擋陽光」；原句要表達的是「籠罩、伴隨影響」。", "這個選項表示「使完全無關」；原句要表達的是「籠罩、伴隨影響」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-82", "mode": "vocab", "paragraph": "G", "sentence": "If it is to celebrate a common humanity, and to bring past and present closer together, far more weight needs to be given to the effects of insecurities and emergencies—the fears that shadow the growing up of children, the oppositions we encounter during our lives—experiences which may be hard for an individual to categorise but which nevertheless have a significance which goes beyond that individual.", "target": "categorise", "options": ["place within explanatory groups or classes", "demonstrate conclusively", "remove from every record"], "answer": 0, "explanations": ["此處 categorise 表示「分類」。須依原句語境理解。", "這個選項表示「確證」；原句要表達的是「分類」。", "這個選項表示「從所有紀錄移除」；原句要表達的是「分類」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-83", "mode": "vocab", "paragraph": "G", "sentence": "Perhaps too we might recognise that there is a profound condescension in the notion of ‘ordinary people’—that unified totality in which social historians are apt to deal.", "target": "condescension", "options": ["an attitude of assumed superiority towards others", "equal mutual respect", "unwillingness to make judgements of any kind"], "answer": 0, "explanations": ["此處 condescension 表示「居高臨下、屈尊式態度」。須依原句語境理解。", "這個選項表示「平等相互尊重」；原句要表達的是「居高臨下、屈尊式態度」。", "這個選項表示「不願作任何判斷」；原句要表達的是「居高臨下、屈尊式態度」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-84", "mode": "vocab", "paragraph": "G", "sentence": "Perhaps too we might recognise that there is a profound condescension in the notion of ‘ordinary people’—that unified totality in which social historians are apt to deal.", "target": "unified totality", "options": ["a group treated as a single undifferentiated whole", "a set of clearly distinguished individuals", "a numerical count alone"], "answer": 0, "explanations": ["此處 unified totality 表示「被視為整體一致的群體」。須依原句語境理解。", "這個選項表示「清楚區分的個體集合」；原句要表達的是「被視為整體一致的群體」。", "這個選項表示「單純數量統計」；原句要表達的是「被視為整體一致的群體」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-85", "mode": "vocab", "paragraph": "G", "sentence": "Implicitly, it is a category from which we tend to exclude ourselves, although in fact we are exceptional only by our privilege of hindsight.", "target": "Implicitly", "options": ["without being directly stated", "explicitly and openly", "purely by chance"], "answer": 0, "explanations": ["此處 Implicitly 表示「隱含地」。須依原句語境理解。", "這個選項表示「明確公開地」；原句要表達的是「隱含地」。", "這個選項表示「純屬偶然地」；原句要表達的是「隱含地」。"], "tag": "字彙與語境義"}, {"id": "history-vocab-86", "mode": "vocab", "paragraph": "G", "sentence": "Implicitly, it is a category from which we tend to exclude ourselves, although in fact we are exceptional only by our privilege of hindsight.", "target": "privilege of hindsight", "options": ["the advantage of understanding events after they occurred", "the ability to predict every future event", "superior moral worth proven at birth"], "answer": 0, "explanations": ["此處 privilege of hindsight 表示「後見之明帶來的優勢」。須依原句語境理解。", "這個選項表示「預知所有未來事件的能力」；原句要表達的是「後見之明帶來的優勢」。", "這個選項表示「出生時已證明較高道德價值」；原句要表達的是「後見之明帶來的優勢」。"], "tag": "搭配與語境義"}, {"id": "history-vocab-87", "mode": "vocab", "paragraph": "G", "sentence": "It is perhaps time for historians to scrutinise the term ‘ordinary people’ in the same way.", "target": "scrutinise", "options": ["examine closely and critically", "accept at face value", "delete without reading"], "answer": 0, "explanations": ["此處 scrutinise 表示「仔細審視」。須依原句語境理解。", "這個選項表示「照單全收」；原句要表達的是「仔細審視」。", "這個選項表示「不讀便刪除」；原句要表達的是「仔細審視」。"], "tag": "字彙與語境義"}, {"id": "history-paraphrase-1", "mode": "paraphrase", "paragraph": "A", "sentence": "Ever since its elevation to the status of an academic discipline, history has been very largely concerned with problems of its own making.", "target": "", "options": ["The writer argues that academic history has largely pursued problems generated within the discipline itself.", "The writer says history has never been recognised as an academic field.", "The writer says every historical problem is directly selected by the public."], "answer": 0, "explanations": ["very largely 限定主要傾向；its own making 指學科內部形成。", "ever since its elevation 承認已成學科。", "own 指學科，非全由公眾。"], "tag": "長難句理解", "structure": "Ever since...為起始時間片語；history has been concerned...為主幹；of its own making 修飾 problems；評論的範圍由 very largely 限定。"}, {"id": "history-paraphrase-2", "mode": "paraphrase", "paragraph": "A", "sentence": "These may be gaps which the young researcher is advised by supervisors to fill; or established views which he or she is encouraged to challenge.", "target": "", "options": ["Research may either fill recognised gaps or challenge accepted interpretations.", "The sentence says students are always forbidden to question existing views.", "Filling gaps and questioning views are described as the same activity with no difference."], "answer": 0, "explanations": ["may 與 or 列兩種研究方向，不是單一必然程序。", "encouraged to challenge 與禁止相反。", "or 對照不同方向，不能說完全一樣。"], "tag": "長難句理解", "structure": "These 指學科內問題；gaps which...to fill 與 views which...to challenge 為平行名詞組；researcher is advised、is encouraged 都是被動。"}, {"id": "history-paraphrase-3", "mode": "paraphrase", "paragraph": "A", "sentence": "In either case, the need for the researcher to provide new insights in order to gain professional advancement often counts for more than the intrinsic interest of the topic.", "target": "", "options": ["Career advancement can be given more importance than a topic's inherent interest.", "The writer claims all researchers are interested only in money and never in ideas.", "The sentence says intrinsic interest always outweighs every career motive."], "answer": 0, "explanations": ["often、more than 限定常見比較，不是所有人只有一種動機。", "often 不等於 all，且 professional advancement 不僅金錢。", "比較方向被反轉。"], "tag": "長難句理解", "structure": "the need for the researcher to provide...為長主詞；in order to gain...為目的；counts for more than...為核心比較；intrinsic interest 是被比較的一側。"}, {"id": "history-paraphrase-4", "mode": "paraphrase", "paragraph": "A", "sentence": "It touches on, and arguably helps to focus, major issues of public debate.", "target": "", "options": ["Social history relates to public debates and may help sharpen their focus.", "The writer says social history certainly resolves every public dispute.", "The writer says social history has no contact with public concerns."], "answer": 0, "explanations": ["touches on、arguably helps 都比確定解決更有限。", "可能協助聚焦不等於全部解決。", "涉及公眾辯論不能改成無關。"], "tag": "長難句理解", "structure": "It 指 social history；touches on...與 helps to focus...為兩個共用受詞的謂語；arguably 插入限定後者；major issues...為共同受詞。"}, {"id": "history-paraphrase-5", "mode": "paraphrase", "paragraph": "A", "sentence": "It prides itself on being concerned with everyday things rather than sensational events and is directed against the ‘Great Man’ theories that originally characterised history, and the tedious focus on bureaucratic issues that subsequently dominated the 1920s and 30s.", "target": "", "options": ["Social history presents itself as concerned with ordinary life and opposed to traditional emphasis on great individuals and bureaucracy.", "Social history is said to celebrate only sensational leaders and official administration.", "The sentence says social history avoids everyday matters altogether."], "answer": 0, "explanations": ["everyday rather than sensational，並對 Great Man 和 bureaucracy 提出反向重心。", "把被反對焦點改成唯一關注。", "prides itself on everyday things 與迴避相反。"], "tag": "長難句理解", "structure": "It prides itself on being concerned...與 is directed against...並列；rather than 區分日常與轟動；that...characterised history 修飾 theories；focus...dominated...為另一對象。"}, {"id": "history-paraphrase-6", "mode": "paraphrase", "paragraph": "A", "sentence": "This is also reflected in the way it is taught, through the adoption of multi-disciplinary perspectives rather than a narrow historical interpretation.", "target": "", "options": ["Teaching reflects a broader approach drawing on several academic fields.", "The subject is taught through a deliberately narrow single-field interpretation.", "The passage says no teaching method exists for social history."], "answer": 0, "explanations": ["through adoption...說明教法，以 rather than 對照狹窄理解。", "把多學科與單學科交換。", "the way it is taught 承認已有教學方式。"], "tag": "長難句理解", "structure": "This is reflected...為被動主幹；in the way it is taught...說明表現所在；through...表方法；rather than...對照被避開的狹隘解讀。"}, {"id": "history-paraphrase-7", "mode": "paraphrase", "paragraph": "B", "sentence": "Social history emerged, both as a popular enthusiasm and as a scholarly practice, from the cultural revolution of the 1960s in North America and Europe, and reproduces its leading inspirations.", "target": "", "options": ["Social history developed out of the 1960s cultural transformation as both public enthusiasm and academic activity.", "The sentence says social history caused all the cultural changes before it existed.", "Social history emerged solely as a private hobby with no scholarly dimension."], "answer": 0, "explanations": ["emerged from 表起源方向；both...and...保留雙重形態。", "把出自文化變化倒置為造成全部變化。", "刪去 scholarly practice，錯誤限縮。"], "tag": "長難句理解", "structure": "Social history emerged...from...為主幹；both as...and as...插入平行身分；and reproduces...補仍反映其靈感；its 指1960s文化轉變。"}, {"id": "history-paraphrase-8", "mode": "paraphrase", "paragraph": "B", "sentence": "Whereas traditional history had focused on the 12th to 17th centuries, social history was apt to make its historical homeland in the 19th century.", "target": "", "options": ["Traditional historians favoured earlier centuries, while social historians tended to focus on the nineteenth.", "Every social historian is said to study only the twelfth century.", "Traditional history is described as beginning only after social history ended."], "answer": 0, "explanations": ["Whereas 作對比；apt to 表傾向，不是絕對排他。", "把十九世紀改為十二世紀並加入 every、only。", "原句比較研究時期，非兩門學科存在的起訖。"], "tag": "長難句理解", "structure": "Whereas...had focused...為對照子句；social history was apt to...為主句；historical homeland 比喻主要研究時段；in the19th century 限定焦點。"}, {"id": "history-paraphrase-9", "mode": "paraphrase", "paragraph": "B", "sentence": "The subject matter favoured by the new social history, with its move away from the aristocracy and the establishment, corresponds to other cultural manifestations of the 1960s, such as New Wave British cinema, with its working-class protagonists, or ‘Pop art’, with its use of everyday artefacts.", "target": "", "options": ["The new subject choices parallel wider cultural interest in working people and everyday objects.", "The new social history concentrated entirely on aristocratic heroes.", "The cultural examples are presented as unrelated accidents with no shared direction."], "answer": 0, "explanations": ["corresponds to 表呼應；away from aristocracy 指轉離上層。", "將離開的對象誤為唯一重心。", "作者明確建立文化對應，不是無關。"], "tag": "長難句理解", "structure": "The subject matter favoured...為長主詞；with its move away...插入補充；corresponds to...為主幹；such as...列電影與藝術兩例，with...補其特徵。"}, {"id": "history-paraphrase-10", "mode": "paraphrase", "paragraph": "B", "sentence": "Similarly, the anti-institutional bias of the new social history—the renewed determination to write the history of ‘ordinary’ people as against that of statecraft—could be said to echo a much more widespread collapse of social deference, and a questioning of authority figures of all kinds.", "target": "", "options": ["The interest in ordinary people rather than statecraft can be seen as reflecting broader challenges to traditional authority.", "The writer states that all respect for every person disappeared completely.", "The new historical interest is presented as increasing unquestioning obedience to authority."], "answer": 0, "explanations": ["could be said to echo 表可主張的呼應，collapse of social deference 非所有人互不尊重。", "把階級權威敬從擴成所有尊重，程度亦過大。", "questioning authority 與增加盲從相反。"], "tag": "長難句理解", "structure": "anti-institutional bias 為主詞；破折號同位說明；as against that of statecraft 中 that 指 history；could be said...為限定被動；echo 後列兩項社會變化。"}, {"id": "history-paraphrase-11", "mode": "paraphrase", "paragraph": "C", "sentence": "This emerged as a kind of negative counterpart to the otherwise dominant modernisation of the decade and reflected a disenchantment, no less apparent on the Left of the political spectrum than on the Right, with post-war social change.", "target": "", "options": ["The nostalgia industry expressed dissatisfaction with modernisation rather than simply continuing its dominant direction.", "The nostalgia industry is described as the strongest unqualified celebration of modernisation.", "The industry is said to have prevented every form of modernisation from existing."], "answer": 0, "explanations": ["negative counterpart 與 disenchantment 表反向回應，不代表徹底阻止。", "將不滿改為無保留頌揚。", "反向力量不等於所有現代化被阻止。"], "tag": "長難句理解", "structure": "This 指 nostalgia industry；emerged as...與 reflected...為並列；otherwise dominant 修飾 modernisation；with post-war change 說明幻滅對象。"}, {"id": "history-paraphrase-12", "mode": "paraphrase", "paragraph": "C", "sentence": "This emerged as a kind of negative counterpart to the otherwise dominant modernisation of the decade and reflected a disenchantment, no less apparent on the Left of the political spectrum than on the Right, with post-war social change.", "target": "", "options": ["Disappointment with post-war change was as visible on the political Left as on the Right.", "The disappointment existed only on the Right and not on the Left.", "The Left was said to feel less disappointment than the Right."], "answer": 0, "explanations": ["no less...than 表左側並不比右側少，不能反讀為更少或全無。", "no less apparent 承認兩側皆可見。", "no less 不能改 less。"], "tag": "長難句理解", "structure": "disenchantment 後插入 no less apparent...比較形容語；on the Left 與 on the Right 是比較位置；political spectrum 是政治立場範圍，非地理方向。"}, {"id": "history-paraphrase-13", "mode": "paraphrase", "paragraph": "C", "sentence": "Industrial archaeology, an invention of the 1960s, elevated disused factories and mills to the status of national monuments.", "target": "", "options": ["Old industrial buildings were newly valued as nationally important historical sites.", "The buildings became nationally important only because they were newly constructed factories.", "The sentence says every unused building in the country was demolished."], "answer": 0, "explanations": ["disused 與 elevated...status 表舊工業遺產價值提升。", "disused 排除因全新興建而受重視。", "elevated 不是 demolished，亦無 every building。"], "tag": "長難句理解", "structure": "Industrial archaeology 為主詞；an invention...為同位補充；elevated X to status Y 為主幹；disused 修飾 factories and mills。"}, {"id": "history-paraphrase-14", "mode": "paraphrase", "paragraph": "C", "sentence": "Following in the same track, property restorers turned houses built for 19th-century factory workers—once emblems of poverty, overcrowding, and ill-health—into picturesque residences.", "target": "", "options": ["Workers' former homes were restored into attractive residences, reversing their earlier association with deprivation.", "The houses had always been luxurious and carried no associations with hardship.", "The restorers turned attractive homes into overcrowded factory dormitories."], "answer": 0, "explanations": ["once emblems...與 into picturesque residences 對照前後形象。", "once emblems of poverty 不支持從來奢華。", "將改造方向反過來。"], "tag": "長難句理解", "structure": "Following in the same track 為分詞背景；restorers turned X into Y 為主幹；built for...修飾 houses；破折號 once...補舊形象。"}, {"id": "history-paraphrase-15", "mode": "paraphrase", "paragraph": "D", "sentence": "So far as historical work was concerned, by the 1970s the sense of disenchantment had crystallised into an idealised view of the past, fostering a nostalgic regard for disappearing communities.", "target": "", "options": ["By the 1970s dissatisfaction had developed into an idealised past and nostalgia for fading communities.", "Historians had proved that the past was objectively perfect in every respect.", "Disenchantment had vanished without influencing historical work."], "answer": 0, "explanations": ["idealised 指理想化，不代表客觀完美；fostering 表產生影響。", "理想化認知不能等同證實完美。", "had crystallised 與 fostering 明示形成及影響。"], "tag": "長難句理解", "structure": "by the1970s 為截止時點；sense...had crystallised into...為主幹；fostering...為結果分詞；So far as...concerned 限定史學範圍。"}, {"id": "history-paraphrase-16", "mode": "paraphrase", "paragraph": "D", "sentence": "The dignity of ordinary people could be said to be the unifying theme of this line of historical inquiry and retrieval—a celebration of everyday life, even, perhaps especially, when it involved hardship and suffering.", "target": "", "options": ["The dignity of ordinary people is presented as a connecting theme, including lives marked by hardship.", "Only comfortable lives are treated as worthy of attention.", "The writer guarantees that every historian celebrates suffering for identical reasons."], "answer": 0, "explanations": ["even,perhaps especially 表苦難生活也被納入甚至格外受到重視，perhaps 保留。", "原句把 hardship and suffering 明確納入。", "could be said 與 perhaps 不支持 every、guarantees。"], "tag": "長難句理解", "structure": "The dignity...could be said to be...為限定主幹；破折號同位解釋；when it involved...限定 everyday life 的情境；it 指生活非研究員。"}, {"id": "history-paraphrase-17", "mode": "paraphrase", "paragraph": "E", "sentence": "Despite the novelty of its subject matter, social history reproduces many of the characteristic biases of its predecessors.", "target": "", "options": ["New topics do not necessarily free social history from older historical biases.", "New topics guarantee that every earlier bias has disappeared.", "The writer says social history studies exactly the same topics without any novelty."], "answer": 0, "explanations": ["Despite...reproduces...表新題材與舊偏差可並存。", "讓步結構直接否定「新必無偏」。", "novelty 明確承認主題新。"], "tag": "長難句理解", "structure": "Despite...為讓步片語；social history reproduces...為主幹；of its predecessors 指前身的偏差；novelty 限定在 subject matter。"}, {"id": "history-paraphrase-18", "mode": "paraphrase", "paragraph": "E", "sentence": "Social historians are good at amassing details on household artefacts, budgets, daily purchases, but at times the evidence is assumed to speak for itself, and the simple reproduction of fact masquerades as explanation.", "target": "", "options": ["Collecting and repeating details may be mistaken for explaining them.", "The writer says facts are useless and should never be collected.", "The writer argues that reproduction of facts always provides a sufficient explanation."], "answer": 0, "explanations": ["at times 表部分情況；masquerades 批評事實陳列冒充解釋。", "批評缺少解釋不等於反對所有事實蒐集。", "masquerades 表假冒，不是充分成立。"], "tag": "長難句理解", "structure": "historians are good at...先肯定蒐集；but at times evidence is assumed...為轉折；and reproduction...masquerades...再批判混淆；speak for itself 是被質疑的假設。"}, {"id": "history-paraphrase-19", "mode": "paraphrase", "paragraph": "E", "sentence": "The facts accumulated may leave no conceptual space for the great absences, for the many areas where the documentary record is silent.", "target": "", "options": ["Abundant surviving facts may crowd out consideration of what written records fail to reveal.", "Large numbers of documents guarantee that every experience is fully recorded.", "The writer says no documents exist for any historical topic."], "answer": 0, "explanations": ["may leave no conceptual space 表可能遮蔽資料缺口，不是文獻完全不存在。", "量多不等於沒有記錄盲區。", "documentary record is silent 限定某些區域，非所有主題。"], "tag": "長難句理解", "structure": "The facts accumulated 為主詞，accumulated 為被動分詞；may leave...為主幹；for...absences 與 for...areas 平行；where...silent 修飾 areas。"}, {"id": "history-paraphrase-20", "mode": "paraphrase", "paragraph": "F", "sentence": "The indulgence which social historians extend towards their subjects, and the desire to establish ‘empathy’—seeing the past in terms of its own values rather than those of today— can also serve to flatter our self-esteem, making history a field in which, at no great cost to ourselves, we can demonstrate our enlarged sympathies and benevolence.", "target": "", "options": ["Sympathetic treatment of past people can flatter present-day observers without demanding much from them.", "Understanding the past always proves observers morally superior.", "The author says sympathy can never influence a historian's self-image."], "answer": 0, "explanations": ["can also serve to flatter 是可能副作用，非道德優越證明。", "flatter 不是 prove superiority，也不是 always。", "原句正連結同理與自我形象。"], "tag": "長難句理解", "structure": "indulgence...與 desire...為並列長主詞；which...extend 修飾 indulgence；破折號定義 empathy；can serve...為主幹；making...為結果分詞。"}, {"id": "history-paraphrase-21", "mode": "paraphrase", "paragraph": "F", "sentence": "Recognising our kinship to people in the past, and tracing, or discovering, their likeness to ourselves, we are flattered in the belief that underneath we are all lovable; eccentric perhaps and even absurd, but large-hearted, generous and frank.", "target": "", "options": ["Seeing similarities with past people can encourage a flattering belief in our shared goodness.", "The passage proves all people in every era are morally good without exception.", "The author says similarity necessarily prevents any sense of connection."], "answer": 0, "explanations": ["we are flattered in the belief 表一種自我悅納的信念，不是作者證實其真。", "把被批評的信念當成已證事實。", "recognising kinship 表連結，非必然隔絕。"], "tag": "長難句理解", "structure": "Recognising...與 tracing...為並列分詞，主體 we；we are flattered...為被動主句；that...為 belief 內容；分號後形容詞補 lovable 的自我形象。"}, {"id": "history-paraphrase-22", "mode": "paraphrase", "paragraph": "F", "sentence": "This sense of integration with the past can thus serve as a comfortable alternative to critical awareness and self-questioning, allowing us to dignify the present by illegitimate association with the past.", "target": "", "options": ["Comforting identification with the past can replace critical self-examination and unjustifiably dignify the present.", "Any identification with the past necessarily produces rigorous self-criticism.", "The connection is described as legitimate merely because it feels reassuring."], "answer": 0, "explanations": ["can、comfortable alternative、illegitimate 是作者的風險批評。", "alternative to critical awareness 指可能取代，非必然促進。", "令人安心不使連結自動正當。"], "tag": "長難句理解", "structure": "This sense...can serve as...為主幹；alternative to...指出被取代活動；allowing us to...為結果分詞；by illegitimate association 表不當提升現在形象的方法。"}, {"id": "history-paraphrase-23", "mode": "paraphrase", "paragraph": "G", "sentence": "Social history, if it is to fulfil its subversive potential, needs to be a great deal more disturbing.", "target": "", "options": ["To realise its challenging potential, social history must be less comforting and more unsettling.", "The author recommends making all historical work more reassuring.", "The sentence describes a potential already fulfilled with no changes needed."], "answer": 0, "explanations": ["if it is to...表欲達目的的條件；needs to...提出尚需改變。", "more disturbing 不能改成更安心。", "needs to be more 表仍未充分實現。"], "tag": "長難句理解", "structure": "Social history 是主詞；if it is to fulfil...插入目的條件；needs to be...為主幹；a great deal more 修飾 disturbing 的比較程度。"}, {"id": "history-paraphrase-24", "mode": "paraphrase", "paragraph": "G", "sentence": "If it is to celebrate a common humanity, and to bring past and present closer together, far more weight needs to be given to the effects of insecurities and emergencies—the fears that shadow the growing up of children, the oppositions we encounter during our lives—experiences which may be hard for an individual to categorise but which nevertheless have a significance which goes beyond that individual.", "target": "", "options": ["The author wants greater attention to fear, insecurity and conflict because individual experiences can have wider significance.", "Private experiences are said to have no relevance beyond the person involved.", "The author recommends considering only events that fit easily into fixed categories."], "answer": 0, "explanations": ["hard to categorise...nevertheless...beyond individual 區分難分類與仍有意義。", "goes beyond 排除完全無外部意義。", "作者正要求重視難分類經驗，非只看容易者。"], "tag": "長難句理解", "structure": "if...為目的條件；weight needs to be given...為被動主句；破折號列經驗；which...hard...but which...significance 為平行關係子句。"}, {"id": "history-paraphrase-25", "mode": "paraphrase", "paragraph": "G", "sentence": "Perhaps too we might recognise that there is a profound condescension in the notion of ‘ordinary people’—that unified totality in which social historians are apt to deal.", "target": "", "options": ["Treating ordinary people as one unified group may imply a superior attitude towards them.", "The category is presented as a wholly neutral description beyond examination.", "The writer says ordinary people are objectively identical in every possible respect."], "answer": 0, "explanations": ["作者質疑分類帶有 condescension，不是在背書整體一致。", "profound condescension 與完全中立相反。", "unified totality 是批判所指的做法，不是作者認定事實。"], "tag": "長難句理解", "structure": "we might recognise...為限定主幹；that there is...為內容；in the notion...指出態度所在；破折號 that unified totality 同位解釋被質疑的分類。"}, {"id": "history-paraphrase-26", "mode": "paraphrase", "paragraph": "G", "sentence": "Implicitly, it is a category from which we tend to exclude ourselves, although in fact we are exceptional only by our privilege of hindsight.", "target": "", "options": ["Historians' apparent exceptional position comes largely from knowing later outcomes, not from belonging to a different kind of humanity.", "The author says historians can predict every future event with certainty.", "Historians are described as inherently superior to all people they study."], "answer": 0, "explanations": ["only by...hindsight 限定差異來源，不支持天生優越或預知。", "hindsight 是事後了解，非預知。", "exceptional only by...削弱本質優越的主張。"], "tag": "長難句理解", "structure": "it is a category...為主句；from which...修飾 category；although...為讓步；by our privilege...說明所謂特殊的來源，only 限縮該來源。"}, {"id": "history-questionVocab-1", "mode": "questionVocab", "paragraph": "", "sentence": "The options include methodology, originality and organisational matters.", "target": "methodology", "options": ["方法論、研究方法體系", "僅研究結論", "歷史事件的時間表"], "answer": 0, "explanations": ["methodology 指系統性的研究作法。此處練習題目用語，不表示整句符合原文。", "不是結果", "不是純年代列表"], "tag": "題目字彙", "source": "Question 27–31 Options · 題目用語"}, {"id": "history-questionVocab-2", "mode": "questionVocab", "paragraph": "", "sentence": "The options include methodology, originality and organisational matters.", "target": "originality", "options": ["原創性、新穎見解", "文件最初售價", "完全精確無誤"], "answer": 0, "explanations": ["originality 指新穎、不只是照搬既有觀點。此處練習題目用語，不表示整句符合原文。", "不是價格", "原創不保證正確"], "tag": "題目字彙", "source": "Question 27–31 Options · 題目用語"}, {"id": "history-questionVocab-3", "mode": "questionVocab", "paragraph": "", "sentence": "The options include methodology, originality and organisational matters.", "target": "organisational matters", "options": ["組織行政事務", "私人情緒", "完全無關的巧合"], "answer": 0, "explanations": ["此選項指制度或機構運作議題。此處練習題目用語，不表示整句符合原文。", "不是個人感受", "不是巧合"], "tag": "題目字彙", "source": "Question 27–31 Options · 題目用語"}, {"id": "history-questionVocab-4", "mode": "questionVocab", "paragraph": "", "sentence": "Its teaching approach is derived from different academic subjects.", "target": "derived from", "options": ["源自、取自", "與……完全無關", "刻意排除"], "answer": 0, "explanations": ["derive from 指取得來源；本句保留原摘要含義並補全缺字。此處練習題目用語，不表示整句符合原文。", "不是無關", "不是排除"], "tag": "題目字彙", "source": "Question 27–31 · 題目用語"}, {"id": "history-questionVocab-5", "mode": "questionVocab", "paragraph": "", "sentence": "The rise of social history led to the cultural revolution of the 1960s.", "target": "led to", "options": ["導致", "發生得比……晚的唯一意思", "與……毫無關聯"], "answer": 0, "explanations": ["lead to 是因果表達；因果方向須另依原文判斷。此處練習題目用語，不表示整句符合原文。", "片語本身不是時間先後而已", "不是無關"], "tag": "題目字彙", "source": "Question 32 · 題目用語"}, {"id": "history-questionVocab-6", "mode": "questionVocab", "paragraph": "", "sentence": "British cinema in the 1960s lacked any working-class characters.", "target": "working-class", "options": ["勞動階級的", "已受聘的演員才適用", "貴族階層的"], "answer": 0, "explanations": ["working-class characters 指勞動階級角色。此處練習題目用語，不表示整句符合原文。", "working-class 不是「演員有工作」", "不是 aristocratic"], "tag": "題目字彙", "source": "Question 34 · 題目用語"}, {"id": "history-questionVocab-7", "mode": "questionVocab", "paragraph": "", "sentence": "The loss of respect for authority was a leading cause of social problems.", "target": "authority", "options": ["權威、掌權者", "作者身分", "個人財產"], "answer": 0, "explanations": ["此處為社會權力或權威角色。此處練習題目用語，不表示整句符合原文。", "作者是 author，與 authority 不同", "不是財產"], "tag": "題目字彙", "source": "Question 35 · 題目用語"}, {"id": "history-questionVocab-8", "mode": "questionVocab", "paragraph": "", "sentence": "Its products were not always genuine historical items.", "target": "genuine", "options": ["真實、真正的", "必然昂貴的", "明確虛假的"], "answer": 0, "explanations": ["genuine historical items 指真實歷史物品。此處練習題目用語，不表示整句符合原文。", "真品不一定昂貴", "真實與虛假相反"], "tag": "題目字彙", "source": "Question 36 A · 題目用語"}, {"id": "history-questionVocab-9", "mode": "questionVocab", "paragraph": "", "sentence": "It led to the abandonment of modernisation.", "target": "abandonment", "options": ["放棄、捨棄", "更積極推進", "嚴格的分類"], "answer": 0, "explanations": ["abandonment 指不再追求或繼續。此處練習題目用語，不表示整句符合原文。", "不是加速推進", "不是 categorisation"], "tag": "題目字彙", "source": "Question 36 B · 題目用語"}, {"id": "history-questionVocab-10", "mode": "questionVocab", "paragraph": "", "sentence": "It opposed the dominant trend of the time.", "target": "dominant trend", "options": ["當時占主導的趨勢", "唯一可能發生的事", "不重要的小細節"], "answer": 0, "explanations": ["dominant 表影響最大，不等於唯一。此處練習題目用語，不表示整句符合原文。", "主導不表示排除所有其他可能", "不是無關緊要"], "tag": "題目字彙", "source": "Question 36 D · 題目用語"}, {"id": "history-questionVocab-11", "mode": "questionVocab", "paragraph": "", "sentence": "There was a new interest in traditional industrial buildings.", "target": "industrial buildings", "options": ["工業建築", "純住宅區全體", "未經人類改造的自然物"], "answer": 0, "explanations": ["指工廠、磨坊等產業建物。此處練習題目用語，不表示整句符合原文。", "不是泛指全部住宅", "不是天然物"], "tag": "題目字彙", "source": "Question 37 B · 題目用語"}, {"id": "history-questionVocab-12", "mode": "questionVocab", "paragraph": "", "sentence": "Many older homes were unsuitable as places of residence.", "target": "residence", "options": ["居住、住所", "工作成就", "考古工具"], "answer": 0, "explanations": ["place of residence 指住處。此處練習題目用語，不表示整句符合原文。", "不是成就", "不是器具"], "tag": "題目字彙", "source": "Question 37 D · 題目用語"}, {"id": "history-questionVocab-13", "mode": "questionVocab", "paragraph": "", "sentence": "Researchers should focus on the immediate past.", "target": "immediate past", "options": ["剛過去、較近的過去", "極遙遠史前時期", "尚未到來的未來"], "answer": 0, "explanations": ["immediate past 指時間較近的過去。此處練習題目用語，不表示整句符合原文。", "不是遠古", "不是未來"], "tag": "題目字彙", "source": "Question 38 A · 題目用語"}, {"id": "history-questionVocab-14", "mode": "questionVocab", "paragraph": "", "sentence": "They should not overemphasise past difficulties.", "target": "overemphasise", "options": ["過度強調", "完全不提", "精確無偏地概述"], "answer": 0, "explanations": ["over- 表超過適當程度。此處練習題目用語，不表示整句符合原文。", "過度與完全不提不同", "不是中性概述"], "tag": "題目字彙", "source": "Question 38 C · 題目用語"}, {"id": "history-questionVocab-15", "mode": "questionVocab", "paragraph": "", "sentence": "Some information may be hard to categorise.", "target": "categorise", "options": ["分類", "刪除", "確證為真"], "answer": 0, "explanations": ["categorise 是放入某類別。此處練習題目用語，不表示整句符合原文。", "不是刪除資料", "分類不是事實驗證"], "tag": "題目字彙", "source": "Question 39 B · 題目用語"}, {"id": "history-questionVocab-16", "mode": "questionVocab", "paragraph": "", "sentence": "Explore negative emotions that are part of daily life.", "target": "negative emotions", "options": ["負面情緒", "必然虛假的感受", "僅道德上邪惡的行為"], "answer": 0, "explanations": ["負面指不愉快等情緒，並非真假或道德分類。此處練習題目用語，不表示整句符合原文。", "負面不等於虛假", "情緒不等於行為邪惡"], "tag": "題目字彙", "source": "Question 40 A · 題目用語"}, {"id": "history-questionVocab-17", "mode": "questionVocab", "paragraph": "", "sentence": "Build on what has already been established by historians.", "target": "Build on", "options": ["以……為基礎進一步發展", "把建築實際蓋在上面", "完全推翻"], "answer": 0, "explanations": ["build on existing work 是沿既有成果繼續。此處練習題目用語，不表示整句符合原文。", "非字面建屋", "不是一律否定"], "tag": "題目字彙", "source": "Question 40 B · 題目用語"}, {"id": "history-questionVocab-18", "mode": "questionVocab", "paragraph": "", "sentence": "Try to provide an objective view of the recent past.", "target": "objective", "options": ["客觀的", "僅符合個人偏好的", "完全未受研究的"], "answer": 0, "explanations": ["objective 指盡量不由個人偏見左右。此處練習題目用語，不表示整句符合原文。", "不是主觀偏好", "客觀不等於未研究"], "tag": "題目字彙", "source": "Question 40 C · 題目用語"}, {"id": "history-questionVocab-19", "mode": "questionVocab", "paragraph": "", "sentence": "Offer solutions to the pressing problems of our day.", "target": "pressing", "options": ["迫切的", "與印刷紙張有關才適用", "不值得注意的"], "answer": 0, "explanations": ["pressing problems 指急需處理的問題。此處練習題目用語，不表示整句符合原文。", "不是印刷義", "迫切不是不重要"], "tag": "題目字彙", "source": "Question 40 D · 題目用語"}]}, {"id": "mind-music", "title": "Mind Music", "sourceTitle": "Mind Music", "subtitle": "", "part": 2, "topic": "耳蟲、記憶、認知負荷與研究限制", "sourceNote": "this year、now 等以原文寫作時點為準。相關性、初步觀察、理論和混合結果須分開；耳蟲是腦內反覆出現的音樂，不是實體寄生蟲。", "paragraphs": [{"label": "A", "text": "Ever had a song stuck in your head, playing on an endless loop? Scientists call them ‘involuntary musical images’, or ‘earworms’, and a wave of new research is shining light on why they occur and what can be learned from them. Some neuroscientists and cognitive psychologists are studying earworms to explore the mysteries of memory and the part of the brain that is beyond our conscious control. ‘The idea that we have full control over our thought processes is an illusion,’ says psychologist Lauren Stewart, who founded the master's program in music, mind and brain at Goldsmiths, University of London, UK, where recent research has taken place. Researchers haven't been able to watch what happens in the brain when earworms occur, because they happen unpredictably. Much of what is known about them comes from surveys, questionnaires, diaries and lab experiments."}, {"label": "B", "text": "A Goldsmiths study published in the journal Memory and Cognition this year showed that the singing we hear in our heads tends to be true to actual recordings. Researchers had 17 volunteers tap to the beat of any earworm they heard during a four-day period while a device attached to their wrist recorded their movements. The tapping tempos were within 10% of the tempos of the original recordings. Another Goldsmiths study, published this year in Consciousness and Cognition, found that people who report hearing earworms often, and find them most intrusive, have slightly different brain structures, with more gray matter in areas associated with processing emotions."}, {"label": "C", "text": "Studies also show that the music in our heads often starts playing during times of ‘low cognitive load’, such as while showering, getting dressed, walking, or doing chores. Dr Stewart likens earworms to ‘sonic screen savers’ that keep the mind entertained while it is otherwise unoccupied. She and her colleagues tested that theory by having volunteers listen to songs and giving them various tasks afterwards. The volunteers who sat idly for the next five minutes were the most likely to report hearing the music in their heads. Dr Stewart observed that the more challenging the activity, the less likely the volunteers were to hear the music. Diary studies also show songs tend to match people's moods and therefore they are not random. If you are energized and upbeat, an earworm that occurs is likely to be uptempo too."}, {"label": "D", "text": "Songs the brain fixates on are usually those it has been exposed to recently, surveys show, which is why tunes getting heavy radio play frequently top the earworm charts. Even tunes you may have heard but didn't pay attention to can worm their way into your subconscious, says Ira Hyman, a psychologist at Western Washington University in Bellingham, USA. In an unpublished study there, participants who listened to music while doing other tasks were more likely to report that the songs returned as earworms later on, compared with participants who simply listened."}, {"label": "E", "text": "Some earworms are just fragments of a song that repeat like a broken record. So, when the mind hits a part of a song it can't remember, it loops back rather than moving on. That could make an earworm even more entrenched, Dr Hyman says. According to a theory known as the Zeigarnik effect, named for a Soviet psychologist, Bluma Zeigarnik, unfinished thoughts and activities weigh on the mind more heavily than those that are completed, although experiments exposing students to interrupted songs have yielded mixed results."}, {"label": "F", "text": "Researchers say they can't pinpoint a spot in the brain where earworms live. Imaging studies by Andrea Halpern at Bucknell University, in Lewisburg, USA, have shown that deliberately imagining music and actually listening to music activate many of the same neurological networks. Dr Halpern's earlier studies showed that when subjects listened to the first few notes of familiar music, areas in the right frontal and superior temporal portions of the brain became activated, along with the supplementary motor area at the top, which is typically involved in remembering sequences. When the same subjects listened to unfamiliar music and were asked to recall it, there was activity in the left frontal portions of the brain instead."}, {"label": "G", "text": "One factor that makes some songs stick might be repetition. ‘Repetition leads to familiarity which leads to anticipation, which is satisfied by hearing the song,’ says John Seabrook, author of The Song Machine: Inside the Hit Factory, about how producers pump pop songs full of aural ‘hooks’, the punchy melodic phrases designed to target the brain and leave it wanting more. The researchers are comparing the melodic structure of 100 often mentioned songs with 100 similarly popular songs that weren't cited as earworms, to assess the difference. Songs with earworm potential appear to share certain features: a repeating pattern of ups and downs in pitch, and irregular musical intervals."}, {"label": "H", "text": "The researchers plan next to test their results in reverse, and play ringtones from songs of both the earworm and non-earworm variety for volunteers several times a day to see which ones get stuck. Drs Stewart and Halpern are now working together to recruit survey participants for a study looking at whether people at different stages of life experience earworms differently. ‘You can argue that older people might get them more often because they know more songs,’ Dr Halpern says. ‘But the few responses we have so far indicate that they have earworms less often. It could be that they don't play music as often as younger people do.’"}], "questions": [{"id": "mind-vocab-1", "mode": "vocab", "paragraph": "A", "sentence": "Ever had a song stuck in your head, playing on an endless loop?", "target": "on an endless loop", "options": ["repeating continuously", "ending after one performance", "changing unpredictably to unrelated sounds"], "answer": 0, "explanations": ["此處 on an endless loop 表示「不斷循環重播」。須依原句語境理解。", "這個選項表示「播放一次便結束」；原句要表達的是「不斷循環重播」。", "這個選項表示「無法預測地變成無關聲音」；原句要表達的是「不斷循環重播」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-2", "mode": "vocab", "paragraph": "A", "sentence": "Scientists call them ‘involuntary musical images’, or ‘earworms’, and a wave of new research is shining light on why they occur and what can be learned from them.", "target": "involuntary musical images", "options": ["music experienced in the mind without deliberate choice", "pictures consciously drawn to represent songs", "external recordings played at high volume"], "answer": 0, "explanations": ["此處 involuntary musical images 表示「非自主出現的腦內音樂意象」。須依原句語境理解。", "這個選項表示「刻意繪製代表歌曲的圖片」；原句要表達的是「非自主出現的腦內音樂意象」。", "這個選項表示「高音量播放的外部錄音」；原句要表達的是「非自主出現的腦內音樂意象」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-3", "mode": "vocab", "paragraph": "A", "sentence": "Scientists call them ‘involuntary musical images’, or ‘earworms’, and a wave of new research is shining light on why they occur and what can be learned from them.", "target": "shining light on", "options": ["helping to explain or clarify", "illuminating with a physical lamp", "making deliberately more obscure"], "answer": 0, "explanations": ["此處 shining light on 表示「闡明、使更清楚」。須依原句語境理解。", "這個選項表示「用實際燈具照亮」；原句要表達的是「闡明、使更清楚」。", "這個選項表示「刻意使更難理解」；原句要表達的是「闡明、使更清楚」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-4", "mode": "vocab", "paragraph": "A", "sentence": "Some neuroscientists and cognitive psychologists are studying earworms to explore the mysteries of memory and the part of the brain that is beyond our conscious control.", "target": "neuroscientists", "options": ["researchers studying the nervous system", "researchers studying only climate", "professionals producing commercial songs"], "answer": 0, "explanations": ["此處 neuroscientists 表示「神經科學家」。須依原句語境理解。", "這個選項表示「只研究氣候的學者」；原句要表達的是「神經科學家」。", "這個選項表示「製作商業歌曲的人」；原句要表達的是「神經科學家」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-5", "mode": "vocab", "paragraph": "A", "sentence": "Some neuroscientists and cognitive psychologists are studying earworms to explore the mysteries of memory and the part of the brain that is beyond our conscious control.", "target": "cognitive psychologists", "options": ["researchers studying mental processes such as memory", "specialists only in physical muscle strength", "researchers measuring only room acoustics"], "answer": 0, "explanations": ["此處 cognitive psychologists 表示「認知心理學家」。須依原句語境理解。", "這個選項表示「只專研肌力者」；原句要表達的是「認知心理學家」。", "這個選項表示「只量室內聲學者」；原句要表達的是「認知心理學家」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-6", "mode": "vocab", "paragraph": "A", "sentence": "Some neuroscientists and cognitive psychologists are studying earworms to explore the mysteries of memory and the part of the brain that is beyond our conscious control.", "target": "conscious control", "options": ["deliberate awareness and regulation of mental activity", "automatic action without awareness", "legal control by an institution"], "answer": 0, "explanations": ["此處 conscious control 表示「有意識的控制」。須依原句語境理解。", "這個選項表示「無意識自動動作」；原句要表達的是「有意識的控制」。", "這個選項表示「機構的法律管制」；原句要表達的是「有意識的控制」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-7", "mode": "vocab", "paragraph": "A", "sentence": "‘The idea that we have full control over our thought processes is an illusion,’ says psychologist Lauren Stewart, who founded the master's program in music, mind and brain at Goldsmiths, University of London, UK, where recent research has taken place.", "target": "illusion", "options": ["a misleading belief or impression", "a proven scientific law", "a deliberately composed tune"], "answer": 0, "explanations": ["此處 illusion 表示「錯覺、誤以為真的觀念」。須依原句語境理解。", "這個選項表示「已確證的科學定律」；原句要表達的是「錯覺、誤以為真的觀念」。", "這個選項表示「刻意作成的曲調」；原句要表達的是「錯覺、誤以為真的觀念」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-8", "mode": "vocab", "paragraph": "A", "sentence": "‘The idea that we have full control over our thought processes is an illusion,’ says psychologist Lauren Stewart, who founded the master's program in music, mind and brain at Goldsmiths, University of London, UK, where recent research has taken place.", "target": "thought processes", "options": ["the mental operations involved in thinking", "the physical route to a laboratory", "the steps of producing a music video"], "answer": 0, "explanations": ["此處 thought processes 表示「思考歷程」。須依原句語境理解。", "這個選項表示「往實驗室的路線」；原句要表達的是「思考歷程」。", "這個選項表示「製作音樂影片的步驟」；原句要表達的是「思考歷程」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-9", "mode": "vocab", "paragraph": "A", "sentence": "Researchers haven't been able to watch what happens in the brain when earworms occur, because they happen unpredictably.", "target": "unpredictably", "options": ["in a way whose timing cannot reliably be anticipated", "at precisely scheduled intervals", "only when specifically requested"], "answer": 0, "explanations": ["此處 unpredictably 表示「無法預測地」。須依原句語境理解。", "這個選項表示「按精確時程」；原句要表達的是「無法預測地」。", "這個選項表示「僅在明確要求時」；原句要表達的是「無法預測地」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-10", "mode": "vocab", "paragraph": "B", "sentence": "A Goldsmiths study published in the journal Memory and Cognition this year showed that the singing we hear in our heads tends to be true to actual recordings.", "target": "true to", "options": ["accurately corresponding to", "emotionally loyal to a person only", "directly opposed to"], "answer": 0, "explanations": ["此處 true to 表示「忠於、接近原本的」。須依原句語境理解。", "這個選項表示「僅對人情感忠誠」；原句要表達的是「忠於、接近原本的」。", "這個選項表示「與……直接相反」；原句要表達的是「忠於、接近原本的」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-11", "mode": "vocab", "paragraph": "B", "sentence": "Researchers had 17 volunteers tap to the beat of any earworm they heard during a four-day period while a device attached to their wrist recorded their movements.", "target": "tap to the beat", "options": ["move or strike in time with the rhythm", "press a device to stop music", "write the lyrics accurately"], "answer": 0, "explanations": ["此處 tap to the beat 表示「隨節拍輕敲」。須依原句語境理解。", "這個選項表示「按裝置停止音樂」；原句要表達的是「隨節拍輕敲」。", "這個選項表示「準確寫歌詞」；原句要表達的是「隨節拍輕敲」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-12", "mode": "vocab", "paragraph": "B", "sentence": "The tapping tempos were within 10% of the tempos of the original recordings.", "target": "tempos", "options": ["speeds of musical rhythms", "the volume levels of recordings", "the lengths of song titles"], "answer": 0, "explanations": ["此處 tempos 表示「音樂速度、節拍速率」。須依原句語境理解。", "這個選項表示「錄音音量」；原句要表達的是「音樂速度、節拍速率」。", "這個選項表示「歌名長度」；原句要表達的是「音樂速度、節拍速率」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-13", "mode": "vocab", "paragraph": "B", "sentence": "Another Goldsmiths study, published this year in Consciousness and Cognition, found that people who report hearing earworms often, and find them most intrusive, have slightly different brain structures, with more gray matter in areas associated with processing emotions.", "target": "intrusive", "options": ["unwelcome and difficult to ignore", "barely noticeable and always welcome", "heard only from an outside loudspeaker"], "answer": 0, "explanations": ["此處 intrusive 表示「侵入性、難以忽略的」。須依原句語境理解。", "這個選項表示「幾不可察且總受歡迎的」；原句要表達的是「侵入性、難以忽略的」。", "這個選項表示「只從外部喇叭聽到的」；原句要表達的是「侵入性、難以忽略的」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-14", "mode": "vocab", "paragraph": "B", "sentence": "Another Goldsmiths study, published this year in Consciousness and Cognition, found that people who report hearing earworms often, and find them most intrusive, have slightly different brain structures, with more gray matter in areas associated with processing emotions.", "target": "gray matter", "options": ["brain tissue associated with nerve-cell bodies and processing", "grey-coloured earwax", "a metaphor for uncertain research only"], "answer": 0, "explanations": ["此處 gray matter 表示「大腦灰質」。須依原句語境理解。", "這個選項表示「灰色耳垢」；原句要表達的是「大腦灰質」。", "這個選項表示「僅研究不明的比喻」；原句要表達的是「大腦灰質」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-15", "mode": "vocab", "paragraph": "B", "sentence": "Another Goldsmiths study, published this year in Consciousness and Cognition, found that people who report hearing earworms often, and find them most intrusive, have slightly different brain structures, with more gray matter in areas associated with processing emotions.", "target": "associated with", "options": ["connected or linked with", "necessarily the sole cause of", "completely isolated from"], "answer": 0, "explanations": ["此處 associated with 表示「與……有關聯」。須依原句語境理解。", "這個選項表示「必然是……唯一原因」；原句要表達的是「與……有關聯」。", "這個選項表示「與……完全隔離」；原句要表達的是「與……有關聯」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-16", "mode": "vocab", "paragraph": "B", "sentence": "Another Goldsmiths study, published this year in Consciousness and Cognition, found that people who report hearing earworms often, and find them most intrusive, have slightly different brain structures, with more gray matter in areas associated with processing emotions.", "target": "processing emotions", "options": ["handling emotional information in the brain", "performing emotional songs on stage", "eliminating every feeling permanently"], "answer": 0, "explanations": ["此處 processing emotions 表示「處理情緒資訊」。須依原句語境理解。", "這個選項表示「在舞台演出感性歌曲」；原句要表達的是「處理情緒資訊」。", "這個選項表示「永久消除所有感受」；原句要表達的是「處理情緒資訊」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-17", "mode": "vocab", "paragraph": "C", "sentence": "Studies also show that the music in our heads often starts playing during times of ‘low cognitive load’, such as while showering, getting dressed, walking, or doing chores.", "target": "low cognitive load", "options": ["a state requiring little mental effort", "a condition of extreme intellectual demand", "low battery power in a music device"], "answer": 0, "explanations": ["此處 low cognitive load 表示「低認知負荷」。須依原句語境理解。", "這個選項表示「極高智力要求的狀況」；原句要表達的是「低認知負荷」。", "這個選項表示「音樂裝置低電量」；原句要表達的是「低認知負荷」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-18", "mode": "vocab", "paragraph": "C", "sentence": "Dr Stewart likens earworms to ‘sonic screen savers’ that keep the mind entertained while it is otherwise unoccupied.", "target": "likens", "options": ["compares one thing to another", "proves identical in every respect", "states a personal preference for"], "answer": 0, "explanations": ["此處 likens 表示「比擬為」。須依原句語境理解。", "這個選項表示「證明各方面完全相同」；原句要表達的是「比擬為」。", "這個選項表示「表示個人偏好」；原句要表達的是「比擬為」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-19", "mode": "vocab", "paragraph": "C", "sentence": "Dr Stewart likens earworms to ‘sonic screen savers’ that keep the mind entertained while it is otherwise unoccupied.", "target": "sonic screen savers", "options": ["sounds compared to a background program occupying an idle mind", "devices blocking all sound", "written lyrics on a television screen"], "answer": 0, "explanations": ["此處 sonic screen savers 表示「被比作占用閒置心智的聲音螢幕保護程式」。須依原句語境理解。", "這個選項表示「阻擋全部聲音的裝置」；原句要表達的是「被比作占用閒置心智的聲音螢幕保護程式」。", "這個選項表示「電視螢幕歌詞」；原句要表達的是「被比作占用閒置心智的聲音螢幕保護程式」。"], "tag": "搭配與語境義"}, {"id": "mind-vocab-20", "mode": "vocab", "paragraph": "C", "sentence": "Dr Stewart likens earworms to ‘sonic screen savers’ that keep the mind entertained while it is otherwise unoccupied.", "target": "unoccupied", "options": ["not engaged in another mental task", "physically empty of all brain tissue", "unemployed throughout life"], "answer": 0, "explanations": ["此處 unoccupied 表示「未被其他心智工作占用的」。須依原句語境理解。", "這個選項表示「完全沒有腦組織的」；原句要表達的是「未被其他心智工作占用的」。", "這個選項表示「終身沒有工作的」；原句要表達的是「未被其他心智工作占用的」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-21", "mode": "vocab", "paragraph": "C", "sentence": "The volunteers who sat idly for the next five minutes were the most likely to report hearing the music in their heads.", "target": "idly", "options": ["without active engagement in a task", "with intense concentration", "with deliberate hostility"], "answer": 0, "explanations": ["此處 idly 表示「閒著、不從事任務地」。須依原句語境理解。", "這個選項表示「高度專注地」；原句要表達的是「閒著、不從事任務地」。", "這個選項表示「刻意懷敵意地」；原句要表達的是「閒著、不從事任務地」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-22", "mode": "vocab", "paragraph": "C", "sentence": "If you are energized and upbeat, an earworm that occurs is likely to be uptempo too.", "target": "upbeat", "options": ["cheerful and positive", "slow and sorrowful", "always louder than other music"], "answer": 0, "explanations": ["此處 upbeat 表示「愉快、積極的」。須依原句語境理解。", "這個選項表示「緩慢悲傷的」；原句要表達的是「愉快、積極的」。", "這個選項表示「總比其他音樂大聲的」；原句要表達的是「愉快、積極的」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-23", "mode": "vocab", "paragraph": "C", "sentence": "If you are energized and upbeat, an earworm that occurs is likely to be uptempo too.", "target": "uptempo", "options": ["having a fast musical beat", "having a low pitch only", "played without any rhythm"], "answer": 0, "explanations": ["此處 uptempo 表示「節奏快速的」。須依原句語境理解。", "這個選項表示「僅音高較低的」；原句要表達的是「節奏快速的」。", "這個選項表示「沒有節拍演奏的」；原句要表達的是「節奏快速的」。"], "tag": "字彙與語境義"}, {"id": "mind-vocab-24", "mode": "vocab", "paragraph": "D", "sentence": "Songs the brain fixates on are usually those it has been exposed to recently, surveys show, which is why tunes getting heavy radio play frequently top the earworm charts.", "target": "fixates on", "options": ["keeps focusing on persistently", "immediately forg
